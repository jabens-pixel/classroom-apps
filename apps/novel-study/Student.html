<script>
// ============================================================================
// Student pages: classes → home (the book, today's reading, the units) → a unit's steps: Read, then
// each activity the teacher chose. The book is read in Sora or in the student's own copy.
// ============================================================================
(function () {
  var S = NV.S = { home: null, item: null, evidence: null, loading: false };
  NV.act = NV.act || {};
  var A = NV.act;
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || !A[el.dataset.act]) return;
    if (el.tagName === 'A' && !el.getAttribute('target')) e.preventDefault();
    A[el.dataset.act](el, e);
  });
  function esc(s) { return NV.esc(s); }
  function asArg() { return NV.state.as || ''; }
  function readOnly() { return !!(S.home && S.home.me && S.home.me.readOnly); }
  function me() { return (S.home && S.home.me) || {}; }
  // ---------------------------------------------------------------- classes
  NV.views.classes = function (app) {
    var b = NV.boot, list = (b.studentClasses || []).slice();
    var teaching = NV.boot.role !== 'student' ? (b.classes || []) : [];
    var h = '<section class="nv-card"><h1>Your classes</h1>';
    if (teaching.length) h += '<p class="nv-muted">You’re a teacher, so the Student view opens your own practice copy of a class: what students see, saved under your account.</p>';
    var all = teaching.map(function (c) { return Object.assign({ teacherSelf: true }, c); }).concat(list);
    h += all.length ? '<div class="nv-class-list">' + all.map(function (c) {
      return '<button type="button" class="nv-class-pick" data-act="pickClass" data-class="' + esc(c.classId) + '"><span class="nv-class-pick-name">' + esc(c.className) + (c.period ? ' <small>Period ' + esc(c.period) + '</small>' : '') + '</span>' +
        '<span class="nv-class-pick-book">' + (c.bookTitle ? esc(c.bookTitle) : 'No book yet') + '</span>' + (c.teacherSelf ? '<span class="nv-chip">Your class</span>' : '') + '</button>';
    }).join('') + '</div>' : '<p>You haven’t joined a class yet.</p>';
    h += '</section><section class="nv-card"><h2>Join a class</h2><p class="nv-muted">Type the class code from your teacher and your real name.</p>' +
      '<form class="nv-join" id="nvJoin"><label class="nv-field"><span>Class code</span><input id="joinCode" class="nv-input nv-code-input" autocomplete="off" maxlength="8" required></label>' +
      '<label class="nv-field"><span>First name</span><input id="joinFirst" class="nv-input" autocomplete="given-name" maxlength="40" required></label>' +
      '<label class="nv-field"><span>Last name</span><input id="joinLast" class="nv-input" autocomplete="family-name" maxlength="40" required></label>' +
      '<button type="submit" class="nv-btn primary">Join</button><p class="nv-form-msg" id="joinMsg" role="alert"></p></form></section>';
    app.innerHTML = h;
    NV.byId('nvJoin').onsubmit = function (e) {
      e.preventDefault(); var btn = this.querySelector('button'); btn.disabled = true; NV.byId('joinMsg').textContent = '';
      NV.rpc('joinClass', { code: NV.byId('joinCode').value, firstName: NV.byId('joinFirst').value, lastName: NV.byId('joinLast').value }, { retry: true }).then(function (r) {
        NV.boot.studentClasses = r.classes; NV.state.classId = r.classId; NV.store.set('nvClass_' + NV.boot.email, r.classId); NV.go('home');
      }).catch(function (err) { btn.disabled = false; NV.byId('joinMsg').textContent = err.message; });
    };
  };
  A.pickClass = function (el) { NV.state.classId = el.dataset.class; NV.state.as = ''; NV.store.set('nvClass_' + NV.boot.email, el.dataset.class); NV.go('home'); };

  // ---------------------------------------------------------------- shared bits
  function ribbon() {
    var m = me();
    if (NV.state.as) return '<div class="nv-ribbon' + (m.readOnly ? '' : ' is-demo') + '"><span>' + (m.readOnly ? 'Viewing <b>' + esc(m.name) + '</b>’s work · read-only' : 'Using demo student <b>' + esc(m.name) + '</b> · saves work') + '</span><button type="button" class="nv-btn small" data-act="backToDashboard">← Back to dashboard</button></div>';
    if (m.teacherSelf) return '<div class="nv-ribbon is-preview"><span>Student view of your own class. Hidden weeks and items show here for you, marked “Hidden from students”.</span></div>';
    return '';
  }
  A.backToDashboard = function () { NV.leave(function () { NV.state.role = 'teacher'; NV.state.as = ''; NV.go('dashboard'); }); };
  function accessBadge(book) {
    var a = (S.home.access || {})[book.access] || { label: 'In Sora', note: '' };
    return '<span class="nv-access nv-access-' + esc(book.access) + '" title="' + esc(a.note) + '">' + (book.access === 'always' ? '∞ ' : '') + esc(a.label) + '</span>';
  }
  function coverHtml(book, big) {
    if (book.coverUrl) return '<img class="nv-cover' + (big ? ' is-big' : '') + '" src="' + esc(book.coverUrl) + '" alt="Cover of ' + esc(book.title) + '" referrerpolicy="no-referrer">';
    // A typographic cover so the page never shows a broken image.
    return '<div class="nv-cover nv-cover-type' + (big ? ' is-big' : '') + '" aria-hidden="true"><span>' + esc(book.title) + '</span><small>' + esc(book.author || '') + '</small></div>';
  }
  function swatch(color) { return '<span class="nv-swatch nv-hl-' + esc(color) + '" aria-hidden="true"></span>'; }
  function keyChip(k) { return '<span class="nv-key-chip nv-hlbg-' + esc(k.color) + '">' + esc(NV.colorName[k.color] || k.color) + ' = <b>' + esc(k.label) + '</b></span>'; }

  function unitWordLower() { return String((S.home && S.home.unitWord) || 'Week').toLowerCase(); }
  function unitOf(n) { return (S.home && S.home.units || []).filter(function (u) { return u.n === Number(n); })[0]; }
  function actOf(u, id) { return u ? (u.activities || []).filter(function (a) { return a.id === id; })[0] : null; }
  function isSora() { return !S.home || S.home.source !== 'own'; }
  function itemStatus(u, a) {
    var key = 'w' + u.n + '_' + a.id, st = (S.home.status || {})[key] || {}, g = (S.home.grades || {})[key];
    if (g && (g.excluded || (g.score !== null && g.score !== undefined))) return { cls: 'graded', text: g.excluded ? 'Left out of grade' : 'Graded' };
    if (a.form === 'quiz' && st.state === 'submitted') return { cls: 'graded', text: 'Scored' };
    if (st.state === 'submitted') return { cls: 'in', text: st.edited ? 'Turned in · edited' : 'Turned in' };
    if (st.state === 'draft') return { cls: 'progress', text: 'In progress' };
    return { cls: 'none', text: 'Not started yet' };
  }
  function readingLine(u) { var r = u.reading || {}; return r.label || ''; }
  function soraButtons(book, small) {
    if (!book.soraUrl) return '<span class="nv-chip is-warn">Your teacher hasn’t added the Sora link yet</span>';
    return '<a class="nv-btn primary' + (small ? ' small' : '') + '" href="' + esc(book.soraUrl) + '" target="_blank" rel="noopener">Open in Sora ↗</a>' +
      '<button type="button" class="nv-btn' + (small ? ' small' : '') + '" data-act="sideBySide" title="Opens Sora in its own window on the left half of the screen">⧉ Read side-by-side</button>' +
      (book.audioUrl ? '<a class="nv-btn ghost' + (small ? ' small' : '') + '" href="' + esc(book.audioUrl) + '" target="_blank" rel="noopener">🎧 Audiobook ↗</a>' : '');
  }
  /** Sora can't be shown inside this page, so it opens in its own window on the left; this page works on the right. */
  A.sideBySide = function () {
    var book = S.home && S.home.book; if (!book || !book.soraUrl) return;
    var sw = screen.availWidth || 1280, sh = screen.availHeight || 800, w = Math.round(sw * 0.56);
    var win = null;
    try { win = window.open(book.soraUrl, 'nvSora', 'popup=yes,width=' + w + ',height=' + sh + ',left=0,top=0'); } catch (e) {}
    if (!win) { window.open(book.soraUrl, '_blank', 'noopener'); }
    document.body.classList.add('nv-side');
    NV.store.set('nvSide', true);
    NV.toast('Sora is open on the left. On a Chromebook, press Alt + ] to snap this window to the right.');
  };
  A.sideOff = function () { document.body.classList.remove('nv-side'); NV.store.set('nvSide', false); };
  if (NV.store.get('nvSide', false)) document.body.classList.add('nv-side');

  function loadHome(cb) {
    S.loading = true;
    NV.rpc('getStudentHome', { classId: NV.state.classId, as: asArg() }, { retry: true }).then(function (r) { S.home = r; S.loading = false; cb(null, r); })
      .catch(function (e) { S.loading = false; cb(e); });
  }

  // ---------------------------------------------------------------- home
  function bookCardHtml(h) {
    var b = h.book, p = h.progress || {};
    var actions, note;
    if (isSora()) {
      actions = '<div class="nv-row nv-hero-actions">' + soraButtons(b) + '</div>' +
        (b.access === 'assigned' ? '' : '<label class="nv-check nv-borrow"><input type="checkbox" data-act="borrowed" ' + (p.borrowedAt ? 'checked' : '') + (readOnly() ? ' disabled' : '') + '><span>' + (p.borrowedAt ? 'I have the book in Sora ✓' : 'I’ve borrowed the book in Sora') + '</span></label>');
      note = '<div class="nv-hero-badges">' + accessBadge(b) + '</div><p class="nv-hero-note">' + esc(((h.access || {})[b.access] || {}).note || '') + '</p>';
    } else {
      actions = '<label class="nv-check nv-borrow"><input type="checkbox" data-act="borrowed" ' + (p.borrowedAt ? 'checked' : '') + (readOnly() ? ' disabled' : '') + '><span>' + (p.borrowedAt ? 'I have my copy ✓' : 'I have my copy of the book') + '</span></label>';
      note = '<div class="nv-hero-badges"><span class="nv-access nv-access-own">📖 Your own copy</span></div><p class="nv-hero-note">Read in your print copy. Each day or week here tells you what to read and where to stop.' + (b.edition ? ' Page numbers follow ' + esc(b.edition) + '.' : '') + '</p>';
    }
    return '<section class="nv-card nv-hero">' + coverHtml(b, true) + '<div class="nv-hero-copy"><div class="nv-eyebrow">Our novel</div><h1 class="nv-book-title">' + esc(b.title) + '</h1>' + (b.subtitle ? '<div class="nv-book-sub">' + esc(b.subtitle) + '</div>' : '') +
      (b.author ? '<div class="nv-book-author">by ' + esc(b.author) + '</div>' : '') + note + actions + (b.printNote ? '<p class="nv-small nv-muted">' + esc(b.printNote) + '</p>' : '') + '</div></section>';
  }
  /** The unit to start with: today's (day by day), otherwise the newest one that is open. */
  function currentUnit(h) {
    var open = (h.units || []).filter(function (u) { return u.anyOpen; });
    if (h.structure === 'daily') { var t = open.filter(function (u) { return u.date === h.today; })[0]; if (t) return t; var past = open.filter(function (u) { return u.date && u.date <= h.today; }); if (past.length) return past[past.length - 1]; }
    return open[open.length - 1] || null;
  }
  function unitCardHtml(h, u, big) {
    var p = h.progress || {}, pr = (p.weeks || {})[u.n] || {};
    var readTxt = pr.status === 'done' ? '✓ Read' : pr.status === 'partway' ? 'Reading' + (pr.where ? ' · at ' + esc(pr.where) : '') : 'Not started';
    var isToday = h.structure === 'daily' && u.date === h.today;
    return '<article class="nv-week-card' + (big ? ' is-current' : '') + '"><div class="nv-week-head"><span class="nv-eyebrow">' + esc(u.label) + (u.date ? ' · ' + esc(NV.fmtDay(u.date)) : '') + (isToday ? ' · Today' : '') + '</span><h3>' + esc(u.title || u.label) + '</h3></div>' +
      '<p class="nv-today-read"><span>' + (h.structure === 'daily' ? 'Read today' : 'Read') + '</span>' + esc(readingLine(u) || 'See your teacher') + '</p>' +
      (u.eq ? '<p class="nv-eq-mini">' + esc(u.eq) + '</p>' : '') +
      '<ul class="nv-week-items"><li class="' + (pr.status === 'done' ? 'is-graded' : pr.status === 'partway' ? 'is-progress' : '') + '"><span>Read</span><em>' + readTxt + '</em></li>' + u.activities.map(function (a) {
        if (!u.open[a.id] && !me().teacherSelf) return '<li class="is-locked"><span>' + esc(a.icon + ' ' + a.title) + '</span><em>Not open yet</em></li>';
        var s = itemStatus(u, a); return '<li class="is-' + s.cls + '"><span>' + esc(a.icon + ' ' + a.title) + '</span><em>' + esc(a.graded ? s.text : (s.cls === 'none' ? 'Practice' : s.text)) + (u.due[a.id] ? ' · due ' + esc(NV.fmtDate(u.due[a.id])) : '') + (!u.open[a.id] ? ' · hidden from students' : '') + '</em></li>';
      }).join('') + '</ul><button type="button" class="nv-btn primary nv-week-open" data-act="openWeek" data-week="' + u.n + '">Open ' + esc(u.label) + ' →</button></article>';
  }
  NV.views.home = function (app) {
    if (!NV.state.classId) return NV.go('classes');
    app.innerHTML = '<section class="nv-card nv-skeleton"><p>Opening your novel study…</p></section>';
    loadHome(function (err, h) {
      if (err) return NV.fail(app, err);
      if (NV.state.view !== 'home') return;
      var out = ribbon() + '<div class="nv-crumbs"><button type="button" class="nv-link" data-act="toClasses">← Your classes</button><span>' + esc(h.klass.className) + '</span></div>';
      if (!h.book) { app.innerHTML = out + '<section class="nv-card"><h1>No book yet</h1><p>Your teacher hasn’t set up the book for this class. Check back soon.</p></section>'; return; }
      out += bookCardHtml(h);
      var cur = currentUnit(h);
      if (cur) out += '<section class="nv-card nv-now"><div class="nv-card-head"><h2>' + (h.structure === 'daily' && cur.date === h.today ? 'Today' : 'Now') + '</h2></div><div class="nv-weeks is-one">' + unitCardHtml(h, cur, true) + '</div></section>';
      if (h.highlightKey && h.highlightKey.length) {
        out += '<section class="nv-card"><div class="nv-card-head"><h2>' + (isSora() ? 'Our highlight key' : 'Our sticky-note key') + '</h2></div><p class="nv-muted">' +
          (isSora() ? 'When you highlight in Sora, use these colors. Everyone uses the same key, so your highlights turn into evidence you can bring back here.' : 'Flag your copy with sticky notes (or a pencil mark) in these colors. Everyone uses the same key, so your notes turn into evidence you can bring back here.') + '</p>' +
          '<ul class="nv-key">' + h.highlightKey.map(function (k) { return '<li>' + swatch(k.color) + '<div><b>' + esc(NV.colorName[k.color] || k.color) + ': ' + esc(k.label) + '</b>' + (k.hint ? '<span>' + esc(k.hint) + '</span>' : '') + '</div></li>'; }).join('') + '</ul></section>';
      }
      var res = h.resume;
      if (res && res.view === 'week' && (!cur || res.week !== cur.n) && h.units.some(function (u) { return u.n === res.week; })) {
        var ru = unitOf(res.week), ra = actOf(ru, res.step);
        out += '<button type="button" class="nv-resume" data-act="openWeek" data-week="' + res.week + '" data-step="' + esc(res.step || 'read') + '"><span>Pick up where you left off</span><b>' + esc(ru.label) + (ra ? ' · ' + esc(ra.title) : '') + ' →</b></button>';
      }
      out += '<section class="nv-card"><div class="nv-card-head"><h2>All ' + esc(unitWordLower()) + 's</h2></div>';
      if (!h.units.length) out += '<p>Your teacher hasn’t opened the first ' + esc(unitWordLower()) + ' yet.</p>';
      out += '<div class="nv-weeks">' + h.units.map(function (u) { return unitCardHtml(h, u, false); }).join('') + '</div></section>';
      app.innerHTML = out;
    });
  };
  A.toClasses = function () { NV.leave(function () { NV.state.classId = ''; NV.go('classes'); }); };
  A.borrowed = function (el) {
    var on = el.checked; el.disabled = true;
    NV.rpc('saveProgress', { classId: NV.state.classId, as: asArg(), borrowed: on }, { retry: true }).then(function (r) { S.home.progress = r.progress; NV.render(); })
      .catch(function (e) { el.checked = !on; el.disabled = false; NV.toast(e.message, 'error'); });
  };
  A.openWeek = function (el) { NV.leave(function () { NV.go('week', { week: Number(el.dataset.week), step: el.dataset.step || 'read' }); }); };

  // ---------------------------------------------------------------- a unit (week, arc or day)
  var resumeT = null;
  function saveResume() {
    if (readOnly()) return; clearTimeout(resumeT);
    resumeT = setTimeout(function () { NV.rpc('saveResume', { classId: NV.state.classId, as: asArg(), route: { view: 'week', week: NV.state.week, step: NV.state.step } }).catch(function () {}); }, 1500);
  }
  NV.views.week = function (app) {
    if (!S.home || S.home.klass.classId !== NV.state.classId) {
      app.innerHTML = '<section class="nv-card nv-skeleton"><p>Opening…</p></section>';
      return loadHome(function (err) { if (err) return NV.fail(app, err); if (NV.state.view === 'week') NV.views.week(app); });
    }
    var u = unitOf(NV.state.week);
    if (!u) { app.innerHTML = ribbon() + '<section class="nv-card"><h1>That isn’t open</h1><p><button class="nv-btn" data-act="toHome">← Back</button></p></section>'; return; }
    var steps = [{ k: 'read', label: 'Read', icon: '📖' }].concat(u.activities.map(function (a) { return { k: a.id, label: a.title, icon: a.icon, act: a }; }));
    var step = steps.some(function (x) { return x.k === NV.state.step; }) ? NV.state.step : 'read';
    NV.state.step = step; saveResume();
    var nav = '<nav class="nv-steps" style="--n:' + steps.length + '" aria-label="Steps">' + steps.map(function (s, i) {
      var a = s.act, open = !a || u.open[a.id] || me().teacherSelf, st = a ? itemStatus(u, a) : null;
      var cls = 'nv-step' + (s.k === step ? ' is-on' : '') + (!open ? ' is-locked' : '') + (st ? ' st-' + st.cls : '');
      return '<button type="button" class="' + cls + '" data-act="toStep" data-step="' + esc(s.k) + '"' + (s.k === step ? ' aria-current="step"' : '') + (!open ? ' title="Not open yet"' : '') + '><span class="nv-step-n">' + (i + 1) + '</span><span class="nv-step-label">' + esc(s.label) + '</span>' + (st && st.cls !== 'none' ? '<span class="nv-step-dot" aria-hidden="true"></span>' : '') + '</button>';
    }).join('') + '</nav>';
    app.innerHTML = ribbon() + '<div class="nv-crumbs"><button type="button" class="nv-link" data-act="toHome">← All ' + esc(unitWordLower()) + 's</button><span>' + esc(S.home.book.title) + '</span></div>' +
      '<header class="nv-week-banner"><div class="nv-eyebrow">' + esc(u.label) + (u.date ? ' · ' + esc(NV.fmtDay(u.date)) : '') + '</div><h1>' + esc(u.title || u.label) + '</h1>' +
      '<p class="nv-today-read is-big"><span>' + (S.home.structure === 'daily' ? 'Read today' : 'Read') + '</span>' + esc(readingLine(u) || 'See your teacher') + (u.reading && u.reading.stopAt ? ' <small>· stop at ' + esc(u.reading.stopAt) + '</small>' : '') + '</p>' +
      (u.eq ? '<p class="nv-eq"><span>Essential question</span>' + esc(u.eq) + '</p>' : '') + '</header>' + nav + '<div id="nvStep" class="nv-step-body"></div>';
    var body = NV.byId('nvStep');
    if (step === 'read') return STEP_VIEWS.read(body, u, steps[1] ? steps[1] : null);
    var a = actOf(u, step);
    if (!u.open[a.id] && !me().teacherSelf) { body.innerHTML = '<section class="nv-card"><h2>Not open yet</h2><p>Your teacher hasn’t opened “' + esc(a.title) + '” yet. Anything you already wrote is kept.</p></section>'; return; }
    var idx = steps.map(function (s) { return s.k; }).indexOf(step), next = steps[idx + 1] || null;
    (STEP_VIEWS[a.form] || STEP_VIEWS.text)(body, u, a, next);
  };
  A.toHome = function () { NV.leave(function () { NV.go('home'); }); };
  A.toStep = function (el) { NV.leave(function () { NV.state.step = el.dataset.step; NV.render(); try { window.scrollTo(0, 0); } catch (e) {} }); };
  function nextBtn(next) { return next ? '<div class="nv-next"><button type="button" class="nv-btn primary" data-act="toStep" data-step="' + esc(next.k) + '">Next: ' + esc(next.label) + ' →</button></div>' : '<div class="nv-next"><button type="button" class="nv-btn" data-act="toHome">← All ' + esc(unitWordLower()) + 's</button></div>'; }

  function gradedHead(u, a, extra) {
    var st = itemStatus(u, a), type;
    if (!a.graded) type = null;
    else if (u.noGrade[a.id]) type = 'Not graded this time';
    else if (a.gradeType === 'auto') type = a.points + ' pts · scores itself';
    else if (a.gradeType === 'rubric') type = a.points + ' pts · scored on a 7-level rubric';
    else type = a.points + ' pts';
    return '<div class="nv-graded-head">' + (type ? '<span class="nv-graded-badge">Graded assignment · ' + esc(type) + '</span>' : '<span class="nv-practice">Practice: not scored on its own</span>') + '<span class="nv-status nv-status-' + st.cls + '">' + esc(st.text) + '</span>' +
      (u.due[a.id] ? '<span class="nv-due">Due ' + esc(NV.fmtDate(u.due[a.id], true)) + '</span>' : '') + (!u.open[a.id] ? '<span class="nv-chip is-warn">Hidden from students</span>' : '') + (extra || '') + '</div>';
  }
  function feedbackHtml(item, a) {
    var g = item.grade; if (!g) return '';
    if (g.excluded) return '<div class="nv-feedback"><b>Your teacher left this out of your grade.</b></div>';
    if (g.score === null || g.score === undefined) return g.comment ? '<div class="nv-feedback"><h3>Feedback from your teacher</h3><p>' + esc(g.comment) + '</p></div>' : '';
    var label = a.gradeType === 'rubric' ? ((item.rubric || []).filter(function (r) { return r.score === Math.round(g.score); })[0] || {}).label : (g.score >= a.points ? 'Complete' : g.score > 0 ? 'Partly complete' : 'Incomplete');
    return '<div class="nv-feedback"><h3>Graded: ' + esc(label || '') + ' · ' + esc(g.score) + '/' + esc(a.points) + '</h3>' + (g.comment ? '<p>' + esc(g.comment) + '</p>' : '') + '</div>';
  }
  function howScored(item) {
    if (item.rubric) return '<details class="nv-howscored"><summary>How it’s scored (7 levels)</summary><ol class="nv-rubric-list">' + item.rubric.map(function (r) { return '<li><b>' + r.score + ' · ' + esc(r.label) + '</b> ' + esc(r.text) + '</li>'; }).join('') + '</ol></details>';
    if (item.complete) return '<details class="nv-howscored"><summary>How it’s scored</summary><p><b>Complete:</b> ' + esc(item.complete.complete) + '</p><p><b>Incomplete:</b> ' + esc(item.complete.incomplete) + '</p></details>';
    return '';
  }
  function promptHtml(a) {
    return (a.prompt ? '<div class="nv-prompt">' + esc(a.prompt) + '</div>' : '') + ((a.directions || []).length ? '<ol class="nv-directions">' + a.directions.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ol>' : '');
  }

  var STEP_VIEWS = {};

  // ---------- Read (not scored on its own) ----------
  STEP_VIEWS.read = function (body, u, next) {
    var b = S.home.book, pr = ((S.home.progress || {}).weeks || {})[u.n] || {}, key = S.home.highlightKey || [];
    var focus = key.filter(function (k) { return (u.focus || []).indexOf(k.color) >= 0; });

    // Half-written posts and replies are kept on this device and warn before leaving.
    body.querySelectorAll('#nvPostText, .nv-reply-text').forEach(function (t) {
      t.addEventListener('input', function () { var k = draftKey(t.id === 'nvPostText' ? '' : t.closest('.nv-reply-box').dataset.parent); if (t.value.trim()) NV.store.set(k, t.value); else NV.store.del(k); });
    });
    NV.guard.registerExtra('discussion', function () { return Array.prototype.some.call(document.querySelectorAll('#nvPostText, .nv-reply-text'), function (t) { return t.value.trim(); }); });
  }
  function sendPost(text, parentId, btn) {
    if (!text.trim()) { NV.toast('Write something first.'); return; }
    btn.disabled = true; var clientId = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    NV.rpc('postDiscussion', { classId: NV.state.classId, as: asArg(), week: NV.state.week, act: NV.state.step, text: text, parentId: parentId || '', clientId: clientId }, { retry: true, timeoutMs: 45000 }).then(function (r) {
      NV.store.del(draftKey(parentId)); S.item.discussion = r.discussion;
      var key = 'w' + NV.state.week + '_' + NV.state.step; S.home.status[key] = Object.assign({}, S.home.status[key] || {}, { state: 'submitted' });
      NV.guard.registerExtra('discussion', null);
      drawDiscussion(NV.byId('nvStep'), unitOf(NV.state.week), actOf(unitOf(NV.state.week), NV.state.step), S.item);
      NV.toast(parentId ? 'Reply posted.' : 'Posted. Now read your classmates’ posts and reply to one.', 'ok');
    }).catch(function (e) { btn.disabled = false; NV.toast(e.message + ' Your writing is still here.', 'error'); });
  }
  A.post = function (el) { sendPost(NV.byId('nvPostText').value, '', el); };
  A.reply = function (el) { var t = el.closest('.nv-reply-box').querySelector('textarea'); sendPost(t.value, el.dataset.parent, el); };
  A.editPost = function (el) {
    var id = el.dataset.id, p = (S.item.discussion.posts || []).filter(function (x) { return x.id === id; })[0]; if (!p) return;
    NV.modal('<h2 id="nvModalTitle">Edit your post</h2><textarea id="nvEditText" class="nv-input" rows="7" maxlength="8000">' + esc(p.text) + '</textarea><div class="nv-row"><button type="button" class="nv-btn primary" id="nvEditSave">Save</button><button type="button" class="nv-btn" onclick="NV.closeModal()">Cancel</button></div>');
    NV.byId('nvEditSave').onclick = function () {
      var b = this; b.disabled = true;
      NV.rpc('editDiscussion', { classId: NV.state.classId, as: asArg(), postId: id, text: NV.byId('nvEditText').value }, { retry: true }).then(function (r) {
        NV.closeModal(); S.item.discussion = r.discussion; drawDiscussion(NV.byId('nvStep'), unitOf(NV.state.week), actOf(unitOf(NV.state.week), NV.state.step), S.item);
      }).catch(function (e) { b.disabled = false; NV.toast(e.message, 'error'); });
    };
  };

  window.__MB.Student = 'ok';
})();
</script>
