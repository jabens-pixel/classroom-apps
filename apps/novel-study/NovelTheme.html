<style>
/* ============================================================================
   Novel Study -- the look. Presentation only (no saving or grading logic). Included LAST.
   Literata for the reading voice, Public Sans for the interface; one accent (deep teal) for
   actions, red only for work waiting on the teacher.
   ========================================================================== */
:root{
  --paper:#f5f1e8; --card:#fffdf9; --ink:#1c2733; --muted:#56606d; --line:#e2dacb; --line2:#eee7da;
  --accent:#1d5c58; --accent-2:#174a47; --accent-soft:#e3efed; --wine:#6e2a46; --gold:#7a5c10;
  --needs:#b42318; --needs-2:#8c1d17; --ok:#1e6b43; --ok-soft:#e8f5ec; --warn:#8a5a00; --warn-soft:#fff6df;
  --hl-gold:#e9c24a; --hl-yellow:#e9c24a; --hl-blue:#9cc7f4; --hl-green:#a6dbae; --hl-pink:#f4b2cc; --hl-orange:#f7c189; --hl-purple:#cab7f1;
  --serif:'Literata',Georgia,'Times New Roman',serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --page-max:1640px; --gutter:clamp(16px,2.4vw,40px);
  --r:14px; --shadow:0 1px 2px rgba(28,39,51,.06),0 6px 18px rgba(28,39,51,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .4em}
h1{font-size:30px;font-weight:700} h2{font-size:22px;font-weight:650} h3{font-size:17px;font-weight:650} h4{font-size:16px}
p{margin:.4em 0 .8em} a{color:var(--accent)} small{font-size:.82em}
.nv-muted{color:var(--muted)} .nv-small{font-size:13.5px} .nv-empty{color:var(--muted);font-style:italic;margin:10px 0}
.nv-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.nv-plain{padding-left:18px}
.nv-eyebrow{display:block;font:800 11px/1.3 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar: Student · Teacher · Admin ---------- */
.nv-top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.nv-top-inner{max-width:var(--page-max);margin:0 auto;display:flex;align-items:center;gap:16px;padding:9px 18px;flex-wrap:wrap}
.nv-brand{display:flex;align-items:center;gap:10px;font:700 18px var(--serif);letter-spacing:.01em}
.nv-brand-mark{width:22px;height:26px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,#c9a24a 0 4px,#f6efe0 4px);box-shadow:inset -2px 0 0 rgba(0,0,0,.08)}
.nv-roles{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
.nv-role{border:0;background:transparent;color:#e8edf3;font:700 13.5px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer}
.nv-role:hover{background:rgba(255,255,255,.12)}
.nv-role.is-on{background:#fff;color:var(--ink)}
.nv-role:focus-visible{outline:2px solid #f6d65a;outline-offset:2px}
.nv-account{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#d6dde6;min-width:0}
.nv-account-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.nv-build{font-size:11px;padding:2px 7px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#e8edf3}
.nv-update{position:sticky;top:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:#fff3cd;color:#4a3a06;font-weight:600;font-size:14px;border-bottom:1px solid #e9d38a}

/* ---------- layout + cards ---------- */
.nv-app{max-width:var(--page-max);margin:0 auto;padding:20px var(--gutter) 80px}
.nv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin:0 0 16px}
.nv-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nv-card-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0} .nv-card-title h2{margin:0}
.nv-card-actions{display:flex;gap:8px;margin-left:auto}
.nv-card-sub{color:var(--muted);font-size:14px;max-width:820px;margin:6px 0 4px}
.nv-skeleton{color:var(--muted)}
.nv-error{border-color:#e6b4ae;background:#fff7f5}
.nv-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nv-fold>summary::-webkit-details-marker{display:none}
.nv-fold>summary h2{margin:0}
.nv-fold>summary h2::before{content:"▸";display:inline-block;margin-right:9px;color:var(--gold);transition:transform .15s}
.nv-fold[open]>summary h2::before{transform:rotate(90deg)}
.nv-fold[open]>summary{margin-bottom:12px}
.nv-sub{border-top:1px solid var(--line2);padding-top:16px;margin-top:16px}
.nv-sub-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nv-crumbs{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:var(--muted);font-size:14px;flex-wrap:wrap}

/* ---------- controls ---------- */
.nv-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 15px;border:1px solid #c9c0b0;border-radius:10px;background:#fff;color:var(--ink);font:650 14.5px var(--sans);text-decoration:none;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.nv-btn:hover{border-color:var(--accent);background:#fbfaf6}
.nv-btn:focus-visible,.nv-input:focus-visible,.nv-link:focus-visible,.nv-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nv-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nv-btn.primary:hover{background:var(--accent-2)}
.nv-btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.nv-btn.ghost:hover{background:var(--accent-soft)}
.nv-btn.small{min-height:32px;padding:5px 11px;font-size:13px;border-radius:8px}
.nv-btn.is-danger{color:var(--needs)} .nv-btn.is-danger:hover{background:#fdeceb}
.nv-btn:disabled{opacity:.55;cursor:wait}
.nv-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.nv-icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px}
.nv-icon-btn:hover{background:#f3eee5;color:var(--needs)}
.nv-field{display:flex;flex-direction:column;gap:4px;margin:8px 0;min-width:0}
.nv-field>span{font-weight:700;font-size:13.5px} .nv-field>span small{font-weight:500;color:var(--muted)} .nv-field>small{color:var(--muted)}
.nv-field-sm{max-width:160px}
.nv-input{width:100%;min-width:0;font:15px/1.45 var(--sans);color:var(--ink);background:#fff;border:1px solid #cbc2b3;border-radius:9px;padding:9px 11px}
textarea.nv-input{resize:vertical}
.nv-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,92,88,.15);outline:none}
.nv-input:disabled,.nv-input[readonly]{background:#f7f4ee;color:#3b4552}
.nv-input-row{display:flex;gap:8px;align-items:center}
.nv-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.nv-span2{grid-column:1/-1}
.nv-inline-form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.nv-inline-form .nv-field{flex:1 1 200px}
.nv-form-msg{font-size:13.5px;color:var(--muted)} p.nv-form-msg{color:var(--needs);font-weight:600}
.nv-check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px}
.nv-check input{width:18px;height:18px;accent-color:var(--accent)}
.nv-fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px 16px}
.nv-fieldset legend{font-weight:750;font-size:13.5px;padding:0 6px} .nv-fieldset legend small{font-weight:500;color:var(--muted)}
.nv-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#faf8f3;color:#3d4653;font-size:12.5px;font-weight:650;white-space:nowrap}
.nv-chip.is-ok{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.nv-chip.is-warn{background:var(--warn-soft);border-color:#ead8a9;color:var(--warn)}
.nv-chip.is-needs{background:var(--needs);border-color:var(--needs);color:#fff}
.nv-demo-tag{display:inline-block;padding:0 6px;border-radius:5px;background:#eef0ff;color:#3b4890;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.nv-pill{border:1px solid #cbc2b3;background:#fff;border-radius:999px;padding:8px 15px;font:650 14px var(--sans);color:var(--ink);cursor:pointer}
.nv-pill.is-on{background:var(--accent);border-color:var(--accent);color:#fff}

/* highlight colors (the class key) */
.nv-swatch{display:inline-block;flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);vertical-align:-3px}
.nv-hl-gold{background:var(--hl-gold)} .nv-hl-yellow{background:var(--hl-yellow)} .nv-hl-none{background:#e7e2d8} .nv-hl-blue{background:var(--hl-blue)} .nv-hl-green{background:var(--hl-green)} .nv-hl-pink{background:var(--hl-pink)} .nv-hl-orange{background:var(--hl-orange)} .nv-hl-purple{background:var(--hl-purple)}
.nv-key-chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:13.5px;color:#1c2733}
.nv-hlbg-gold{background:#f8e7a8} .nv-hlbg-yellow{background:#f8e7a8} .nv-hlbg-none{background:#f1ede5} .nv-hlbg-blue{background:#d6e8fb} .nv-hlbg-green{background:#d7f0db} .nv-hlbg-pink{background:#fbdbe8} .nv-hlbg-orange{background:#fde3c6} .nv-hlbg-purple{background:#e7defa}
.nv-key{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.nv-key li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.nv-key li .nv-swatch{width:22px;height:22px;margin-top:1px}
.nv-key li div{display:flex;flex-direction:column} .nv-key li span{font-size:13.5px;color:var(--muted)}

/* ---------- student: classes + home ---------- */
.nv-class-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.nv-class-pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.nv-class-pick:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.nv-class-pick-name{font:700 17px var(--serif)} .nv-class-pick-book{color:var(--muted);font-size:14px}
.nv-join{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.nv-code-input{text-transform:uppercase;letter-spacing:.18em;font-weight:800}
.nv-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start;padding:24px}
.nv-cover{width:96px;height:140px;object-fit:cover;border-radius:4px 8px 8px 4px;box-shadow:0 8px 20px rgba(28,39,51,.25);background:#ddd}
.nv-cover.is-big{width:132px;height:194px}
.nv-cover-type{display:flex;flex-direction:column;justify-content:space-between;padding:16px 14px 14px 20px;background:linear-gradient(90deg,#3a2a1c 0 7px,#6e2a46 7px 100%);color:#f8efe2;position:relative;overflow:hidden}
.nv-cover-type::after{content:"";position:absolute;inset:10px 10px 10px 17px;border:1px solid rgba(248,239,226,.35);border-radius:2px;pointer-events:none}
.nv-cover-type span{font:700 17px/1.18 var(--serif);word-break:break-word} .nv-cover-type small{font-size:11.5px;opacity:.85}
.nv-book-title{font-size:34px;margin:4px 0 2px} .nv-book-author{color:var(--muted);font-size:16px;margin-bottom:10px;font-family:var(--serif);font-style:italic}
.nv-hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.nv-hero-note{color:var(--muted);font-size:14.5px;margin:4px 0 10px}
.nv-access{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.02em;background:#eef2f7;color:#2c3b5a;border:1px solid #d3dbe7}
.nv-access-always{background:var(--ok-soft);color:var(--ok);border-color:#bfe0cb}
.nv-access-limited{background:var(--warn-soft);color:var(--warn);border-color:#ead8a9}
.nv-borrow{margin-top:6px;padding:9px 13px;border:1px dashed #cbc2b3;border-radius:10px;background:#fbfaf6}
.nv-resume{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;margin:0 0 16px;padding:14px 18px;border:1px solid #bcd7d3;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-2);font:600 15px var(--sans);cursor:pointer;text-align:left}
.nv-resume b{font-size:16px} .nv-resume:hover{border-color:var(--accent)}
.nv-weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.nv-week-card{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.nv-week-head h3{font-size:19px;margin:3px 0 0}
.nv-eq-mini{font-family:var(--serif);font-style:italic;color:#3b4552;font-size:14.5px;margin:0}
.nv-week-items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.nv-week-items li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 8px;border-radius:7px;background:#faf8f3}
.nv-week-items li span{font-weight:700} .nv-week-items li em{font-style:normal;color:var(--muted);text-align:right}
.nv-week-items li.is-in em,.nv-week-items li.is-graded em{color:var(--ok);font-weight:700}
.nv-week-items li.is-progress em{color:var(--warn);font-weight:700}
.nv-week-items li.is-locked{opacity:.7}
.nv-week-open{margin-top:auto}

/* ---------- student: a week ---------- */
.nv-week-banner{margin:0 0 14px}
.nv-week-banner h1{font-size:32px;margin:4px 0 8px}
.nv-eq{position:relative;margin:8px 0 4px;padding:12px 16px 12px 18px;border-left:4px solid var(--gold);background:#fbf6ea;border-radius:0 10px 10px 0;font:500 17px/1.45 var(--serif);color:#2a2f38}
.nv-eq span{display:block;font:800 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.nv-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 16px;padding:5px;background:#ebe5d9;border-radius:14px}
.nv-step{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 8px;border:0;border-radius:10px;background:transparent;color:#3b4552;font:700 14.5px var(--sans);cursor:pointer}
.nv-step:hover{background:rgba(255,255,255,.6)}
.nv-step.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nv-step-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#d6cebf;color:#3b4552;font-size:12.5px;font-weight:800}
.nv-step.is-on .nv-step-n{background:var(--accent);color:#fff}
.nv-step.st-in .nv-step-n,.nv-step.st-graded .nv-step-n{background:var(--ok);color:#fff}
.nv-step.is-locked{opacity:.6}
.nv-step-dot{position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.nv-step.st-in .nv-step-dot,.nv-step.st-graded .nv-step-dot{background:var(--ok)}
.nv-practice{display:inline-block;margin:0 0 10px;padding:4px 11px;border-radius:999px;background:#f0ede6;color:#4b5563;font-size:12.5px;font-weight:700}
.nv-stop{padding:9px 12px;border-radius:9px;background:#f6f2e9;font-size:14.5px}
.nv-focus{margin-top:14px;padding:14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7}
.nv-focus h3{margin-bottom:2px}
.nv-checkin{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.nv-where{max-width:420px}
.nv-next{display:flex;justify-content:flex-end;margin-top:14px}
.nv-graded-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.nv-graded-badge{display:inline-flex;padding:4px 11px;border-radius:999px;background:var(--wine);color:#fff;font-size:12.5px;font-weight:750}
.nv-status{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:750;border:1px solid var(--line);background:#fff;color:#3b4552}
.nv-status-in,.nv-status-graded{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.nv-status-progress{background:var(--warn-soft);border-color:#ead8a9;color:var(--warn)}
.nv-due{font-size:13px;color:var(--muted);font-weight:650}
.nv-prompt{margin:6px 0 12px;padding:12px 15px;border:1px solid var(--line2);border-radius:10px;background:#fff;font:500 16.5px/1.5 var(--serif)}
.nv-howscored{margin:6px 0 12px;font-size:14px} .nv-howscored summary{cursor:pointer;font-weight:700;color:var(--accent)}
.nv-rubric-list{margin:8px 0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.nv-feedback{margin:10px 0 14px;padding:12px 15px;border-radius:10px;background:var(--ok-soft);border:1px solid #bfe0cb}
.nv-feedback h3{font-family:var(--sans);font-size:15px;color:var(--ok);margin:0 0 4px}
.nv-offer{margin:10px 0;padding:12px 15px;border:2px solid #e6c56a;border-radius:12px;background:var(--warn-soft)}
.nv-offer p{margin:0 0 6px}
.nv-ribbon{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#24303d;color:#fff;font-size:14px}
.nv-ribbon.is-demo{background:#3b4890} .nv-ribbon.is-preview{background:#5b4a1a}
.nv-ribbon .nv-btn{background:#fff}

/* evidence log */
.nv-import{margin:6px 0 14px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7}
.nv-import summary{cursor:pointer}
.nv-made-msg{margin:6px 0;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);font-size:14px;font-weight:600}
.nv-inbox{font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
.nv-cards{display:grid;gap:10px;margin:8px 0}
.nv-card-ev{border:1px solid var(--line);border-left:7px solid #d9d2c4;border-radius:10px;background:#fff;padding:10px 12px}
.nv-hlside-gold{border-left-color:var(--hl-gold)!important} .nv-hlside-yellow{border-left-color:var(--hl-yellow)!important} .nv-hlside-blue{border-left-color:var(--hl-blue)!important} .nv-hlside-green{border-left-color:var(--hl-green)!important}
.nv-hlside-pink{border-left-color:var(--hl-pink)!important} .nv-hlside-orange{border-left-color:var(--hl-orange)!important} .nv-hlside-purple{border-left-color:var(--hl-purple)!important}
.nv-card-ev-head{display:grid;grid-template-columns:auto minmax(150px,230px) 1fr auto auto;gap:8px;align-items:center}
.nv-ev-meaning{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:9px;border:1px solid rgba(0,0,0,.1);min-width:0}
.nv-ev-meaning select{flex:1;min-width:0;border:0;background:transparent;font:700 14px var(--sans);color:var(--ink);padding:4px 0;cursor:pointer}
.nv-ev-meaning select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nv-ev-src{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#4b5563;white-space:nowrap}
.nv-card-ev-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#efe9de;font-weight:800;font-size:13px}
.nv-card-ev .nv-field{margin:6px 0 0}
.nv-ev-text{font-family:var(--serif)}

/* quiz */
.nv-quiz-progress{font-weight:650;color:#3b4552}
.nv-qlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:12px}
.nv-q{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.nv-q-text{display:flex;gap:10px;font:600 16.5px/1.45 var(--serif);margin:0 0 10px}
.nv-q-n{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:800 12.5px var(--sans)}
.nv-choices{display:grid;gap:7px}
.nv-choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid #d6cdbd;border-radius:10px;background:#fdfcf9;font:15px/1.4 var(--sans);color:var(--ink);cursor:pointer}
.nv-choice:hover:not(:disabled){border-color:var(--accent);background:#fff}
.nv-choice:disabled{cursor:default;color:#3b4552}
.nv-choice-l{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#efe9de;font-weight:800;font-size:13px}
.nv-choice-mark{margin-left:auto;font-weight:900}
.nv-choice.is-right{border-color:#7cc196;background:var(--ok-soft)} .nv-choice.is-right .nv-choice-l{background:var(--ok);color:#fff}
.nv-choice.is-wrong{border-color:#e0a9a6;background:#fdf1f0} .nv-choice.is-wrong .nv-choice-l{background:#c46a64;color:#fff}
.nv-q-result{margin:9px 0 0;font-size:14.5px} .nv-q-result.is-right{color:var(--ok)} .nv-q-result.is-missed{color:var(--needs-2)} .nv-q-result.is-try{color:var(--warn);font-weight:650}

/* respond + focus mode */
.nv-write-wrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.nv-write-side{display:grid;gap:12px;position:sticky;top:70px}
.nv-checklist,.nv-insert{padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7}
.nv-checklist h3,.nv-insert h3{font-family:var(--sans);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.nv-checklist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.nv-checklist li{display:flex;gap:8px} .nv-checklist li span{flex:0 0 18px;font-weight:900;color:#6b6356} .nv-checklist li.is-ok span{color:var(--ok)}
.nv-insert-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px;max-height:340px;overflow:auto}
.nv-insert-list li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:7px 8px;border:1px solid var(--line2);border-left:5px solid #d9d2c4;border-radius:8px;background:#fff;font-size:13.5px}
.nv-insert-text{font-family:var(--serif)}
.nv-focusbar{display:flex;justify-content:flex-start;margin-bottom:8px}
.nv-focus-exit{display:none}
.nv-writing{min-height:320px;font:17px/1.65 var(--serif);padding:14px 16px}
.nv-wordcount{text-align:right;font-size:13px;color:var(--muted);margin-top:4px}
body.nv-focus-on{overflow:hidden}
.nv-write-wrap.is-focus{position:fixed;inset:0;z-index:60;background:var(--paper);padding:20px clamp(12px,3vw,40px);grid-template-columns:minmax(220px,300px) minmax(0,1fr);overflow:auto}
.nv-write-wrap.is-focus .nv-write-side{top:0}
.nv-write-wrap.is-focus .nv-writing{min-height:calc(100vh - 140px)}
.nv-write-wrap.is-focus .nv-focus-exit{display:inline-flex}
.nv-write-wrap.is-focus [data-act="focusMode"]{display:none}
.nv-savebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.nv-save-state{margin-right:auto;font-size:13.5px;color:var(--muted)}
.nv-save-state.is-ok{color:var(--ok)} .nv-save-state.is-warn{color:var(--warn);font-weight:650} .nv-save-state.is-error{color:var(--needs);font-weight:700}
.nv-turned{font-size:13.5px;font-weight:700;color:var(--ok)}
.nv-stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.nv-stat{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid #e3dccf;border-radius:999px;background:#faf8f4;color:#4b5563;font-size:12.5px}
.nv-stat b{color:var(--ink)} .nv-stat-time{background:#eef3fb;border-color:#d0dbef;color:#2c3b5a}
.nv-stat.is-warn{background:#fdeceb;border-color:#e0a9a6;color:#8c1d17} .nv-stat.is-source{background:#fff8e0;border-color:#ead8a9;color:#6b520f} .nv-stat.is-clean{background:#eef6f0;border-color:#cfe5d6;color:var(--ok)}
mark.nv-pasted{background:#ffe0e0;border-bottom:2px solid #d4676a;color:#111827;padding:0 1px;border-radius:2px}
.nv-pasted-swatch{background:#ffe0e0;border-color:#d4676a}
.nv-paste-legend{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* discussion */
.nv-compose{padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7;margin-bottom:12px}
.nv-locked-note{padding:10px 13px;border-radius:10px;background:#f2efe8;color:#3b4552;font-weight:600}
.nv-thread{display:grid;gap:12px}
.nv-post{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.nv-post.is-mine{border-color:#bcd7d3;background:#f6fbfa}
.nv-post header,.nv-reply header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-size:14px}
.nv-post time,.nv-reply time{color:var(--muted);font-size:12.5px}
.nv-post header .nv-link,.nv-reply header .nv-link{margin-left:auto;font-size:13px}
.nv-post-text{white-space:pre-wrap;font:15.5px/1.55 var(--serif)}
.nv-replies{margin:10px 0 0 14px;padding-left:12px;border-left:3px solid var(--line2);display:grid;gap:8px}
.nv-reply{padding:8px 10px;border-radius:9px;background:#faf8f3}
.nv-reply.is-mine{background:#eef6f5}
.nv-reply-box{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.nv-reply-box textarea{flex:1}

/* the pages where students read and write keep the width their writing boxes were made for */
body[data-view="week"]:not(.nv-side) .nv-app{max-width:1240px}
/* side-by-side with Sora: this page becomes a narrow companion */
body[data-view="week"].nv-side .nv-app{max-width:760px}
body[data-view="week"].nv-side .nv-write-wrap:not(.is-focus){grid-template-columns:1fr}
body[data-view="week"].nv-side .nv-write-wrap:not(.is-focus) .nv-write-side{position:static}

/* ---------- modal, toast, lists ---------- */
.nv-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,27,36,.48)}
.nv-modal-card{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.nv-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;max-width:min(560px,calc(100% - 32px));padding:11px 17px;border-radius:12px;background:var(--ink);color:#fff;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nv-toast.is-error{background:#8c1d17} .nv-toast.is-ok{background:var(--ok)}
.nv-didnt{position:fixed;right:16px;bottom:16px;z-index:85;width:min(380px,calc(100% - 32px));max-height:50vh;overflow:auto;padding:12px 14px;border:2px solid var(--needs);border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.nv-didnt h3{font-family:var(--sans);font-size:15px;color:var(--needs);margin:0 0 6px}
.nv-didnt ul{margin:0;padding-left:18px;font-size:13.5px}
.nv-table-wrap{overflow-x:auto}
.nv-table{width:100%;border-collapse:collapse;font-size:14px}
.nv-table th,.nv-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.nv-table th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nv-roster-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.nv-plan{display:grid;gap:4px}

/* ---------- teacher dashboard ---------- */
.nv-banner{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 12px;padding:20px 24px;border-radius:16px;background:linear-gradient(135deg,#1c2733,#24384a);color:#fff;box-shadow:var(--shadow)}
.nv-banner h1{color:#fff;margin:4px 0 0;font-size:30px}
.nv-banner .nv-eyebrow{color:#c8d3df} .nv-banner .nv-book-author{color:#d5dde6;margin:2px 0 8px}
.nv-banner-main{flex:1 1 420px;min-width:0}
.nv-banner-sora{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.nv-banner .nv-chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.nv-banner .nv-access{border-color:transparent}
.nv-banner-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.nv-joincode{text-align:right} .nv-joincode span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8d3df}
.nv-joincode b{font:800 30px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.14em}
.nv-banner .nv-btn{background:#fff;color:var(--ink);border-color:#fff} .nv-banner .nv-btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.nv-tracker{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;font-size:13.5px}
.nv-tracker-label{font-weight:800;letter-spacing:.04em}
.nv-tracker-bar{display:flex;width:180px;height:9px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden}
.nv-tracker-bar .is-done{background:#7fd1a1} .nv-tracker-bar .is-part{background:#f6d65a}
.nv-tracker-nums{color:#dfe6ee} .nv-tracker-nums b{color:#fff}
.nv-switcher{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.nv-class-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:700 14px var(--sans);color:var(--ink);cursor:pointer}
.nv-class-pill.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.nv-class-pill.is-add{border-style:dashed;color:var(--accent)}
.nv-class-pill-period{font-size:12px;font-weight:650;opacity:.8}

/* grading tiles (same anatomy as Macbeth) */
.nv-group-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.nv-group-head h3{margin:0;font:850 12.5px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--wine)}
.nv-group-count{font-size:12.5px;color:var(--muted)}
.nv-group-waiting{margin-left:auto;font-size:12.5px;font-weight:800;color:#a3261c} .nv-group-clear{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ok)}
.nv-tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.nv-tile{position:relative;display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--line);border-top:4px solid var(--acc,var(--gold));border-radius:14px;box-shadow:0 1px 2px rgba(20,32,47,.05);transition:box-shadow .15s}
.nv-tile:hover{box-shadow:0 10px 24px rgba(20,32,47,.10)}
.nv-tile.menu-open{z-index:6}
.nv-tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 0;cursor:pointer}
.nv-tile-id{min-width:0}
.nv-tile-title{margin:3px 0 4px;font:700 20px/1.15 var(--serif);color:var(--acc,var(--wine))}
.nv-tile-meta{display:flex;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#556071}
.nv-tile-meta span+span::before{content:"·";margin:0 7px;color:#a8a092}
.nv-badge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.nv-badge.is-needs{background:var(--needs);color:#fff;box-shadow:0 2px 6px rgba(140,29,23,.25)} .nv-badge.is-needs.has-redo{background:var(--needs-2)}
.nv-badge.is-done{width:28px;padding:0;background:var(--ok-soft);color:var(--ok);border:1px solid #bfe0cb}
.nv-badge.is-excluded{background:#f1eee8;color:#4b5563;border:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.nv-tile-body{flex:1;padding:12px 16px 0;cursor:pointer}
.nv-bar{display:flex;height:8px;border-radius:999px;background:#ece6db;overflow:hidden}
.nv-bar-done{background:#3f7a5a} .nv-bar-todo{background:#c8412f}
.nv-stats3{display:flex;justify-content:space-between;gap:8px;margin:10px 0 0}
.nv-stats3 div{margin:0;min-width:0} .nv-stats3 dt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.nv-stats3 dd{margin:1px 0 0;font-size:20px;line-height:1.15;font-weight:850;font-variant-numeric:tabular-nums}
.nv-stats3 .is-todo dd{color:#b42318}
.nv-tile-note{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.nv-excluded-note{margin:0;padding:10px 12px;background:#faf8f4;border:1px dashed #d3c8b5;border-radius:10px;font-size:13px;color:#4b5563}
.nv-tile-open{margin:14px 16px 0}
.nv-tile-open-sub{font-weight:600;opacity:.92}
.nv-tile-foot{display:grid;gap:8px;margin-top:14px;padding:11px 16px 12px;border-top:1px solid #eee7db;background:#fcfaf6;border-radius:0 0 13px 13px}
.nv-switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:750}
.nv-switch input{position:absolute;left:0;top:50%;transform:translateY(-50%);width:36px;height:20px;margin:0;opacity:0;cursor:pointer;z-index:1}
.nv-switch-track{position:relative;flex:0 0 36px;width:36px;height:20px;border-radius:999px;background:#bdb4a4;transition:background .15s}
.nv-switch-track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s}
.nv-switch input:checked+.nv-switch-track{background:#2f7a55} .nv-switch input:checked+.nv-switch-track::after{transform:translateX(16px)}
.nv-switch input:focus-visible+.nv-switch-track{outline:2px solid var(--accent);outline-offset:2px}
.nv-switch-text{color:#4b5563} .nv-switch.is-on .nv-switch-text{color:#1e6b43}
.nv-canvas-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.nv-canvas-state{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;font-weight:700;color:#556071}
.nv-canvas-state::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#bdb4a4}
.nv-canvas-state.is-ok::before{background:#2f7a55} .nv-canvas-state.is-pending::before{background:#c99a2e}
.nv-canvas-actions{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.nv-more{position:relative}
.nv-more>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:1px solid #cfc6b8;border-radius:8px;background:#fff;color:#374151;font-size:17px;font-weight:900;cursor:pointer}
.nv-more>summary::-webkit-details-marker{display:none}
.nv-menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:30;min-width:236px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(20,32,47,.18)}
.nv-menu button{display:block;width:100%;padding:9px 11px;border:0;border-radius:8px;background:transparent;text-align:left;font:650 13.5px var(--sans);color:var(--ink);cursor:pointer}
.nv-menu button:hover{background:#f6f1e7} .nv-menu hr{margin:5px 4px;border:0;border-top:1px solid #eee7da}
.nv-menu .is-nograde{color:#a3261c} .nv-menu .is-count{color:var(--ok)}
.nv-tile-msg{padding:8px 10px;border:1px solid #d5ddf3;border-radius:8px;background:#f4f7fb;color:#2c3b5a;font-size:12.5px;line-height:1.45;word-break:break-word}
.nv-tile-msg:empty{display:none}
.nv-tile.is-nograde{background:#fbfaf7} .nv-tile.is-nograde .nv-tile-title{color:#4b5563}
.nv-loading{display:flex;align-items:center;gap:10px;padding:26px 4px;color:var(--muted)}
.nv-spinner{width:16px;height:16px;border:2px solid #e2dbcf;border-top-color:var(--accent);border-radius:50%;animation:nvspin .8s linear infinite} @keyframes nvspin{to{transform:rotate(360deg)}}
.nv-drafts-note{margin:16px 0 0;padding:10px 13px;border-radius:10px;background:#f6f2e9;color:#3b4552;font-size:14px}

/* gradebook */
.nv-gb-scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line2);border-radius:12px}
.nv-gb{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.nv-gb th,.nv-gb td{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap;background:#fff}
.nv-gb thead th{background:#faf7f0;font-size:12px;color:#3b4552}
.nv-gb .nv-gb-week{border-left:1px solid var(--line2);text-transform:uppercase;letter-spacing:.06em;font-weight:850;color:var(--wine)}
.nv-gb .nv-gb-item.is-hidden{color:#5f584c;font-style:italic}
.nv-gb .nv-gb-name{position:sticky;left:0;z-index:2;text-align:left;min-width:170px;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line2)}
.nv-gb tbody .nv-gb-name{font-weight:650}
.nv-gb-cell{min-width:48px;padding:5px 8px;border:1px solid transparent;border-radius:7px;background:transparent;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer}
.nv-gb-cell:hover{border-color:var(--gold);background:#fff9ea}
.nv-gb-none{color:#5f6672;font-weight:400} .nv-gb-ex{color:#5b6472;font-style:italic;font-weight:600}
.nv-dot{color:#8a5a00;margin-left:2px}
.nv-gb-total{font-weight:800} .nv-gb-total small{font-weight:600;color:var(--muted)}
.nv-push-status{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#f6f1e7;color:#3d3426;font-size:13.5px}

/* setup */
.nv-tips{margin-top:10px;font-size:14px} .nv-tips summary{cursor:pointer;font-weight:700;color:var(--accent)} .nv-tips li{margin:6px 0}
.nv-keyedit{display:grid;gap:8px;margin:8px 0}
.nv-keyrow{display:grid;grid-template-columns:auto 130px minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:center}
.nv-weeklist{display:grid;gap:10px;margin-top:10px}
.nv-week-edit{border:1px solid var(--line);border-radius:12px;background:#fff}
.nv-week-edit>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.nv-week-edit>summary::-webkit-details-marker{display:none}
.nv-week-edit-n{font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.nv-week-edit-t{font:600 16px var(--serif);flex:1 1 200px} .nv-week-edit-t small{font:500 13px var(--sans);color:var(--muted);margin-left:6px}
.nv-week-form{padding:2px 16px 14px;border-top:1px solid var(--line2)}
.nv-ainote{padding:9px 12px;border-radius:9px;background:var(--warn-soft);border:1px solid #ead8a9;font-size:14px}
.nv-mc-list{display:grid;gap:10px;width:100%}
.nv-mc{padding:10px;border:1px solid var(--line2);border-radius:10px;background:#fcfbf7}
.nv-mc-head{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start} .nv-mc-head b{padding-top:8px}
.nv-mc-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
.nv-mc-choice{display:grid;grid-template-columns:auto auto 1fr;gap:6px;align-items:center}
.nv-mc-choice input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.nv-mc-choice span{font-weight:800;font-size:13px}
.nv-mc-why{font-size:13.5px}
.nv-problems{color:var(--warn)}
.nv-week-actions{border-top:1px solid var(--line2);padding-top:10px}

/* ---------- marking ---------- */
.nv-mhead{position:sticky;top:52px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-6px 0 14px;padding:10px 0;background:var(--paper)}
.nv-mtabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#ebe5d9;border-radius:12px;margin-right:auto}
.nv-mtab{border:0;background:transparent;padding:7px 13px;border-radius:9px;font:700 14px var(--sans);color:#3b4552;cursor:pointer}
.nv-mtab.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nv-mtop h1 small{font:600 15px var(--sans);color:var(--muted)}
.nv-legend{margin:10px 0;padding:10px 14px;border:1px solid #e6dcc6;border-radius:12px;background:#fffaf0;font-size:14px}
.nv-legend summary{cursor:pointer;font-weight:800}
.nv-akey{margin:8px 0;font-size:14px} .nv-akey summary{cursor:pointer;font-weight:750;color:var(--accent)}
.nv-mtools{border-top:1px solid var(--line2);padding-top:10px}
.nv-mgroups{display:grid;gap:18px}

  .nv-vrow-head{grid-template-columns:1fr auto} .nv-vrow-head .vb-loc{grid-column:1/-1;grid-row:2}
