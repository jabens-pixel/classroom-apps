<script>
// ============================================================================
// The builder: tiles take a teacher through setup, one step at a time.
//   1 Where students read (Sora or own copies) → 2 The book → 3 How it's built (weeks, arcs, days)
//   → 4 Break it up (readings + the activity tiles every unit starts with) → 5 Build (AI or by hand,
//   then check, approve and open each unit). Every step saves by itself, so a teacher can stop anywhere.
// ============================================================================
(function () {
  var B = NV.B = { classId: '', data: null, step: 0, f: {}, drafts: {}, open: {}, run: null, req: '', msgs: {}, dirtyForm: false };
  var A = NV.act = NV.act || {};
  function esc(s) { return NV.esc(s); }
  function cid() { return (NV.T && NV.T.classId) || B.classId; }
  function st() { return B.data.study; }
  function ch() { return B.data.choices || {}; }
  function lib(type) { return (ch().activities || {})[type] || { label: type, icon: '•', form: 'text', points: 5, desc: '' }; }
  function unitWord(structure) { return ((ch().structures || {})[structure || st().structure] || { unit: 'Week' }).unit; }
  function uw() { return unitWord(); }
  function uwl() { return uw().toLowerCase(); }
  function isSora() { return st().source !== 'own'; }
  function maxStep() { var s = st(); return !s.source ? 1 : !s.book ? 2 : Math.max(3, Math.min(5, Number(s.setupStep) || 3)); }
  function deepCopy(o) { return JSON.parse(JSON.stringify(o == null ? null : o)); }
  var STEPS = [
    { n: 1, t: 'Where students read', i: '📚' },
    { n: 2, t: 'The book', i: '📖' },
    { n: 3, t: 'How it’s built', i: '🧱' },
    { n: 4, t: 'Break it up', i: '✂️' },
    { n: 5, t: 'Build', i: '✨' }
  ];
  var DEFAULT_PATTERN = {
    weekly: [{ type: 'evidence' }, { type: 'quiz', count: 6 }, { type: 'analysis' }, { type: 'discussion' }],
    arcs: [{ type: 'evidence' }, { type: 'quiz', count: 8 }, { type: 'close_reading' }, { type: 'analysis' }, { type: 'discussion' }, { type: 'reflection' }],
    daily: [{ type: 'bellringer' }, { type: 'evidence' }, { type: 'quiz', count: 4 }]
  };
  var COUNT_HINT = { weekly: 'Most novels run 3–6 weeks.', arcs: 'Most novels have 3–6 arcs: beginning, rising action, turning point and so on.', daily: 'One reading a day. Up to 40 days.' };
  var COUNT_DEFAULT = { weekly: 4, arcs: 5, daily: 15 };

  // ---------------------------------------------------------------- loading and the frame
  function load(cb) {
    NV.rpc('getStudy', { classId: cid() }, { retry: true }).then(function (r) { B.classId = cid(); B.data = r; if (cb) cb(null); }).catch(function (e) { if (cb) cb(e); });
  }
  NV.views.build = function (app) {
    if (!cid()) { NV.go('dashboard'); return; }
    var fresh = !B.data || B.classId !== cid();
    if (fresh) { B.drafts = {}; B.open = {}; B.f = {}; B.msgs = {}; app.innerHTML = '<section class="nv-card nv-skeleton"><p>Opening the builder…</p></section>'; }
    if (NV.state.buildStep !== undefined && NV.state.buildStep !== null) { B.step = NV.state.buildStep; NV.state.buildStep = null; B.f = {}; }
    if (NV.state.buildOpen) { B.open[NV.state.buildOpen] = true; NV.state.buildOpen = 0; }
    if (!fresh) draw(app);
    load(function (err) {
      if (NV.state.view !== 'build') return;
      if (err) return NV.fail(app, err);
      if (B.data.study && B.data.study._unreadable) { app.innerHTML = '<section class="nv-card nv-error"><h1>This plan couldn’t be read</h1><p>Nothing was changed. Tell the app’s admin.</p></section>'; return; }
      if (!B.step) B.step = maxStep();
      if (fresh || !hasUnsaved()) draw(app);
    });
  };
  function hasUnsaved() { return B.dirtyForm || Object.keys(B.drafts).length > 0; }
  function draw(app) {
    app = app || NV.byId('app');
    var s = st(), step = Math.min(B.step || maxStep(), maxStep()); B.step = step;
    var body = step === 1 ? step1() : step === 2 ? step2() : step === 3 ? step3() : step === 4 ? step4() : step5();
    var k = B.data.klass || {};
    app.innerHTML = '<div class="nv-builder">' +
      '<div class="nv-build-head"><button type="button" class="nv-btn small ghost" data-act="bBack">← Dashboard</button><div class="nv-build-title"><span class="nv-eyebrow">' + esc(k.className || '') + (k.period ? ' · Period ' + esc(k.period) : '') + ' · Builder</span><h1>' + (s.book ? esc(s.book.title) : 'Build a novel study') + '</h1></div></div>' +
      stepper(step) + body + '</div>';
    B.dirtyForm = false;
  }
  function stepper(cur) {
    var top = maxStep();
    return '<nav class="nv-bsteps" aria-label="Setup steps">' + STEPS.map(function (x) {
      var done = x.n < top || (x.n === 5 && (st().units || []).some(function (u) { return u.status === 'approved'; }));
      var can = x.n <= top, on = x.n === cur;
      return '<button type="button" class="nv-bstep' + (on ? ' is-on' : '') + (done ? ' is-done' : '') + '" data-act="bStep" data-n="' + x.n + '"' + (can ? '' : ' disabled') + (on ? ' aria-current="step"' : '') + '>' +
        '<span class="nv-bstep-n" aria-hidden="true">' + (done && !on ? '✓' : x.n) + '</span><span class="nv-bstep-t">' + esc(x.t) + '</span></button>';
    }).join('') + '</nav>';
  }
  A.bStep = function (el) { var n = Number(el.dataset.n); guardForm(function () { B.step = n; B.f = {}; draw(); scrollTop(); }); };
  A.bBack = function () { NV.leave(function () { if (NV.T) NV.T.dash = null; NV.go('dashboard'); }); };
  function scrollTop() { try { window.scrollTo(0, 0); } catch (e) {} }
  function guardForm(fn) {
    if (B.dirtyForm && !confirm('You changed things on this step without saving. Leave the step anyway? Those changes are lost.')) return;
    B.dirtyForm = false; fn();
  }
  // Leaving the builder with unsaved typing asks first.
  var _leave = NV.leave;
  NV.leave = function (fn) {
    if (NV.state.view === 'build' && hasUnsaved()) {
      var units = Object.keys(B.drafts).map(function (n) { return uw() + ' ' + n; });
      if (!confirm('You have changes that aren’t saved' + (units.length ? ' (' + units.join(', ') + ')' : '') + '. Leave the builder anyway? They are lost.')) return;
      B.drafts = {}; B.dirtyForm = false;
    }
    _leave(fn);
  };
  window.addEventListener('beforeunload', function (e) { if (NV.state.view === 'build' && hasUnsaved()) { e.preventDefault(); e.returnValue = ''; return ''; } });
  document.addEventListener('input', function (e) { if (NV.state.view === 'build' && e.target.closest && e.target.closest('.nv-bform')) B.dirtyForm = true; });
  document.addEventListener('change', function (e) { if (NV.state.view === 'build' && e.target.closest && e.target.closest('.nv-bform')) B.dirtyForm = true; });

  /** Every save goes through here: the newest plan comes back and replaces ours. */
  function save(name, payload, btn, msgId) {
    payload.classId = cid(); payload.base = st().updatedAt || '';
    if (btn) btn.disabled = true; msg(msgId, 'Saving…');
    return NV.rpc(name, payload, { retry: true }).then(function (r) {
      B.data.study = r.study; if (r.choices) B.data.choices = r.choices; if (r.standards) B.data.standards = r.standards;
      if (NV.G) NV.G.stale = true;   // the guide reloads with the new plan next time it opens
      if (NV.T) NV.T.dash = null;
      if (r.study && r.study.book) (NV.boot.classes || []).forEach(function (c) { if (c.classId === cid()) c.bookTitle = r.study.book.title; });
      return r;
    }).catch(function (e) {
      if (btn) btn.disabled = false;
      msg(msgId, e.message, true);
      if (/another tab|co-teacher/.test(e.message)) NV.toast('Copy anything you typed, then reload the builder.', 'error');
      throw e;
    });
  }
  function msg(id, text, bad) { if (!id) return; B.msgs[id] = text; var el = NV.byId(id); if (el) { el.textContent = text || ''; el.classList.toggle('is-error', !!bad); if (el.classList.contains('nv-look-msg')) { el.classList.toggle('is-ok', !bad); B.lookBad = !!bad; } } }
  function footer(back, nextLabel, act, msgId) {
    return '<div class="nv-bfoot">' + (back ? '<button type="button" class="nv-btn" data-act="bStep" data-n="' + back + '">← Back</button>' : '<span></span>') +
      '<span class="nv-form-msg" id="' + msgId + '" role="status">' + esc(B.msgs[msgId] || '') + '</span>' +
      '<button type="button" class="nv-btn primary" data-act="' + act + '">' + nextLabel + '</button></div>';
  }
  function val(id) { var el = NV.byId(id); return el ? el.value : ''; }

  // ---------------------------------------------------------------- 1 · where students read
  function step1() {
    var s = st(), src = ch().sources || {};
    var tiles = [
      { k: 'sora', icon: '📱', pts: ['Every student borrows the e-book (or audiobook) in Sora. <b>Always Available</b> titles have no waitlist.', 'Students highlight in gold, pink and green and paste their Sora highlights back as evidence cards.', '“Open in Sora” and “Read side-by-side” buttons on every reading.'] },
      { k: 'own', icon: '📖', pts: ['A print copy, a class set or books students bring.', 'Readings by chapter or by page in your edition, with where to stop.', 'Sticky notes in three colors stand in for highlights.'] }
    ];
    return '<section class="nv-card nv-bform"><h2>Where will students read the book?</h2><p class="nv-muted">Books can’t live inside the app (Sora books are copy-protected), so the app sends students to the book and tells them exactly what to read today.</p>' +
      '<div class="nv-bigtiles">' + tiles.map(function (t) {
        var on = s.source === t.k;
        return '<button type="button" class="nv-bigtile' + (on ? ' is-on' : '') + '" data-act="bSource" data-v="' + t.k + '" aria-pressed="' + on + '"><span class="nv-bigtile-icon" aria-hidden="true">' + t.icon + '</span>' +
          '<b class="nv-bigtile-name">' + esc((src[t.k] || {}).label || t.k) + '</b><span class="nv-bigtile-note">' + esc((src[t.k] || {}).note || '') + '</span><ul>' + t.pts.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' +
          (on ? '<span class="nv-bigtile-on">✓ Chosen</span>' : '') + '</button>';
      }).join('') + '</div><p class="nv-form-msg" id="bMsg1" role="status"></p></section>';
  }
  A.bSource = function (el) {
    var v = el.dataset.v, s = st();
    if (s.source === v && s.book) { B.step = 2; B.f = {}; draw(); scrollTop(); return; }
    if (s.source && s.source !== v && s.book && !confirm('Switch to ' + (v === 'own' ? 'your own copies' : 'Sora') + '? The book’s title and readings stay; check the book step next.')) return;
    save('saveSetup', { source: v, setupStep: 2 }, el, 'bMsg1').then(function () { B.step = 2; B.f = {}; draw(); scrollTop(); }).catch(function () {});
  };

  // ---------------------------------------------------------------- 2 · the book
  function f2() {
    if (B.f.s2) return B.f.s2;
    var b = st().book || {};
    B.f.s2 = { title: b.title || '', author: b.author || '', gradeBand: b.gradeBand || '', soraUrl: b.soraUrl || '', access: b.access || 'always', audioUrl: b.audioUrl || '', coverUrl: b.coverUrl || '',
      printNote: b.printNote || '', edition: b.edition || '', totalChapters: b.totalChapters || '', totalPages: b.totalPages || '', key: deepCopy(st().highlightKey || []),
      subtitle: b.subtitle || '', narrator: b.narrator || '', format: b.format || '', publisher: b.publisher || '', series: b.series || '', levels: deepCopy(b.levels || []),
      soraLibrary: b.soraLibrary || '', found: null, looked: b.soraUrl || '' };
    return B.f.s2;
  }
  function readF2() {
    var f = f2(); if (!NV.byId('bkTitle')) return f;
    ['title', 'author', 'gradeBand', 'soraUrl', 'audioUrl', 'coverUrl', 'printNote', 'edition', 'totalChapters', 'totalPages'].forEach(function (k) { var el = NV.byId('bk_' + k); if (el) f[k] = el.value; });
    f.title = val('bkTitle'); f.key = readKey(); if (NV.byId('bSoraPaste')) f.soraUrl = val('bSoraPaste').trim();
    return f;
  }
  // ---------- finding the book in Sora: open Sora, copy the book's link, paste it, and the details fill in ----------
  function soraLib(f) { return (f && f.soraLibrary) || NV.store.get('nvSoraLib_' + NV.boot.email, ''); }
  function soraHome(f) { var l = soraLib(f); return l ? 'https://soraapp.com/library/' + encodeURIComponent(l) : 'https://soraapp.com/'; }
  function looksLikeSoraLink(u) { return /^https:\/\/\S*(soraapp\.com|overdrive\.com|libbyapp\.com)\S*\d{4,}/i.test(String(u || '').trim()); }
  function soraFinder(f) {
    var fd = f.found, lib = soraLib(f);
    var h = '<div class="nv-sorafind"><ol class="nv-sorafind-steps">' +
      '<li><b>Find the book in Sora.</b> <span>Look in your school’s <b>Always Available</b> collection for a title every student can borrow at once.</span>' +
      '<a class="nv-btn primary small" id="bOpenSora" href="' + esc(soraHome(f)) + '" target="_blank" rel="noopener">Open Sora' + (lib ? ' · ' + esc(lib) : '') + ' ↗</a></li>' +
      '<li><b>Copy its link.</b> <span>On the book’s page, copy the address from the browser bar (or Share → Copy link). A link from your Loans shelf works too.</span></li>' +
      '<li><b>Paste it here.</b> <span>The title, author and cover fill in by themselves.</span>' +
      '<div class="nv-input-row nv-sorafind-paste"><input class="nv-input" id="bSoraPaste" maxlength="800" value="' + esc(f.soraUrl) + '" placeholder="https://soraapp.com/library/…" aria-label="The book’s Sora link"><button type="button" class="nv-btn" data-act="bLookup" id="bLookupBtn">Fill in from Sora</button>' + (f.soraUrl ? '<a class="nv-btn ghost small" href="' + esc(f.soraUrl) + '" target="_blank" rel="noopener" title="Open this link the way students will">Check ↗</a>' : '') + '</div>' +
      '<p class="nv-form-msg nv-look-msg' + (B.lookBad ? ' is-error' : ' is-ok') + '" id="bLookMsg" role="status">' + esc(B.msgs.bLookMsg || '') + '</p></li></ol>';
    if (fd) {
      var lv = (f.levels || []).map(function (l) { return '<span class="nv-chip">' + esc(l.name + ' ' + l.value) + '</span>'; }).join('');
      h += '<div class="nv-sorafound">' + (f.coverUrl ? '<img class="nv-sorafound-cover" src="' + esc(f.coverUrl) + '" alt="Cover of ' + esc(f.title) + '" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<span class=&quot;nv-sorafound-cover is-none&quot; aria-hidden=&quot;true&quot;>📖</span>\'">' : '<span class="nv-sorafound-cover is-none" aria-hidden="true">📖</span>') +
        '<div class="nv-sorafound-copy"><span class="nv-eyebrow">' + (fd.source === 'catalog' ? 'From Sora’s catalog' : 'From the book’s OverDrive page') + '</span><b class="nv-sorafound-title">' + esc(f.title) + '</b>' + (f.subtitle ? '<span>' + esc(f.subtitle) + '</span>' : '') +
        (f.author ? '<span>by ' + esc(f.author) + '</span>' : '') +
        '<div class="nv-row nv-sorafound-chips">' + (f.format === 'audiobook' ? '<span class="nv-chip">🎧 Audiobook' + (f.narrator ? ' · read by ' + esc(f.narrator) : '') + '</span>' : f.format === 'ebook' ? '<span class="nv-chip">📖 E-book</span>' : '') + lv + (f.series ? '<span class="nv-chip">' + esc(f.series) + '</span>' : '') + (f.publisher ? '<span class="nv-chip">' + esc(f.publisher) + '</span>' : '') + '</div>' +
        (fd.availability && fd.availability.note ? '<p class="nv-small nv-sorafound-avail">' + esc(fd.availability.note) + '</p>' : '') +
        (f.format === 'audiobook' && !f.audioUrl ? '<p class="nv-small">This link is the <b>audiobook</b>. <button type="button" class="nv-link" data-act="bUseAsAudio">Use it as the audiobook link</button>, then paste the e-book’s link above.</p>' : '') +
        (f.others || []).map(function (o, i) { return '<p class="nv-small">Not this book? <button type="button" class="nv-link" data-act="bUseOther" data-i="' + i + '">Use “' + esc(o.title) + '”' + (o.author ? ' by ' + esc(o.author) : '') + ' instead</button></p>'; }).join('') +
        '<p class="nv-small nv-muted">Check the details below; you can change anything.</p></div></div>';
    }
    return h + '</div>';
  }
  var lookTimer = null;
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'bSoraPaste') return;
    clearTimeout(lookTimer);
    var v = e.target.value.trim(), f = f2();
    if (looksLikeSoraLink(v) && v !== f.looked) lookTimer = setTimeout(function () { lookup(v); }, 500);
  });
  A.bLookup = function () {
    var v = val('bSoraPaste').trim();
    if (!v) { msg('bLookMsg', 'Paste the book’s link from Sora first.', true); var x = NV.byId('bSoraPaste'); if (x) x.focus(); return; }
    lookup(v, true);
  };
  function lookup(url, asked) {
    var f = readF2(); f.soraUrl = url; f.looked = url;
    var btn = NV.byId('bLookupBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Looking it up…'; }
    B.lookBad = false; msg('bLookMsg', 'Reading the book’s details from Sora…');
    NV.rpc('lookupSoraTitle', { classId: cid(), url: url, library: soraLib(f) }, { retry: true, timeoutMs: 45000 }).then(function (r) {
      var f = readF2(); f.soraUrl = url; f.others = [];
      if (!r.ok) { B.msgs.bLookMsg = r.message; B.lookBad = true; f.found = null; draw(); B.dirtyForm = true; return; }
      // A link from the teacher's own Loans shelf only opens for them: use the book's own Sora link instead.
      if (r.soraUrl) { f.soraUrl = r.soraUrl; f.looked = r.soraUrl; f.others = r.others || []; }
      var b = r.book;
      if (f.title && b.title && f.title.trim().toLowerCase() !== b.title.toLowerCase() && !asked && !confirm('Replace “' + f.title + '” with “' + b.title + '” from Sora?')) { B.msgs.bLookMsg = ''; draw(); B.dirtyForm = true; return; }
      ['title', 'subtitle', 'author', 'narrator', 'format', 'publisher', 'series'].forEach(function (k) { if (b[k] || k === 'subtitle') f[k] = b[k] || ''; });
      if (b.coverUrl) f.coverUrl = b.coverUrl;
      f.levels = b.levels || [];
      if (b.soraLibrary) { f.soraLibrary = b.soraLibrary; NV.store.set('nvSoraLib_' + NV.boot.email, b.soraLibrary); }
      if (b.availability && b.availability.access) f.access = b.availability.access;
      f.found = { source: r.source, availability: b.availability || null };
      B.msgs.bLookMsg = 'Filled in: ' + b.title + (b.author ? ' by ' + b.author : '') + '.' + (r.swapped ? ' That was a link from your own Loans shelf, which only opens for you, so the box now holds the book’s own Sora link for students.' : '');
      draw(); B.dirtyForm = true;
    }).catch(function (e) { var f = f2(); f.looked = ''; B.msgs.bLookMsg = e.message; B.lookBad = true; draw(); B.dirtyForm = true; });
  }
  A.bUseOther = function (el) { var o = (f2().others || [])[Number(el.dataset.i)]; if (o) lookup(o.soraUrl, true); };
  A.bUseAsAudio = function () { var f = readF2(); f.audioUrl = f.soraUrl; f.soraUrl = ''; f.looked = ''; f.found = null; B.msgs.bLookMsg = 'Saved as the audiobook link. Now paste the e-book’s link.'; draw(); B.dirtyForm = true; var x = NV.byId('bSoraPaste'); if (x) x.focus(); };

  function step2() {
    var f = f2(), acc = ch().access || {}, sora = isSora();
    var grades = ['', '6', '7', '8', '9', '10', '11', '12'];
    var h = '<section class="nv-card nv-bform"><h2>' + (sora ? 'The book in Sora' : 'The book') + '</h2>' + (sora ? soraFinder(f) : '') +
      (f.coverUrl && !sora ? '<img class="nv-bk-thumb" src="' + esc(f.coverUrl) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
      '<div class="nv-form-grid"><label class="nv-field"><span>Title</span><input class="nv-input" id="bkTitle" maxlength="200" value="' + esc(f.title) + '" placeholder="The Great Gatsby"></label>' +
      '<label class="nv-field"><span>Author</span><input class="nv-input" id="bk_author" maxlength="120" value="' + esc(f.author) + '"></label>' +
      '<label class="nv-field"><span>Grade <small>(sets the standards the AI uses)</small></span><select class="nv-input" id="bk_gradeBand">' + grades.map(function (g) { return '<option value="' + g + '"' + (String(f.gradeBand) === g ? ' selected' : '') + '>' + (g ? 'Grade ' + g : 'Choose…') + '</option>'; }).join('') + '</select></label>' +
      '<label class="nv-field"><span>Cover image link <small>(' + (sora ? 'fills in from Sora' : 'optional') + ')</small></span><input class="nv-input" id="bk_coverUrl" maxlength="800" value="' + esc(f.coverUrl) + '" placeholder="https://…"></label>';
    if (sora) {
      h += '' +
        '<label class="nv-field nv-span2"><span>Audiobook link <small>(optional: the audiobook edition in Sora)</small></span><input class="nv-input" id="bk_audioUrl" maxlength="800" value="' + esc(f.audioUrl) + '"></label>' +
        '<label class="nv-field nv-span2"><span>For students who can’t use Sora <small>(optional)</small></span><input class="nv-input" id="bk_printNote" maxlength="300" value="' + esc(f.printNote) + '" placeholder="Print copies are on the shelf by the door."></label>';
    } else {
      h += '<label class="nv-field nv-span2"><span>Edition <small>(optional: page numbers in the plan follow this edition)</small></span><input class="nv-input" id="bk_edition" maxlength="200" value="' + esc(f.edition) + '" placeholder="Scribner paperback, 2004"></label>' +
        '<label class="nv-field nv-span2"><span>Where the copies are <small>(optional)</small></span><input class="nv-input" id="bk_printNote" maxlength="300" value="' + esc(f.printNote) + '" placeholder="Class set on the back shelf. Take the copy with your number."></label>';
    }
    h += '<label class="nv-field"><span>Chapters in the book <small>(helps split it evenly)</small></span><input class="nv-input" id="bk_totalChapters" type="number" min="0" max="500" value="' + esc(f.totalChapters) + '"></label>' +
      '<label class="nv-field"><span>Pages <small>(optional)</small></span><input class="nv-input" id="bk_totalPages" type="number" min="0" max="5000" value="' + esc(f.totalPages) + '"></label></div>';
    if (sora) {
      h += '<h3 class="nv-bh3">How students get it</h3><div class="nv-opts">' + Object.keys(acc).map(function (k) {
        var on = f.access === k;
        return '<button type="button" class="nv-opt' + (on ? ' is-on' : '') + '" data-act="bAccess" data-v="' + k + '" aria-pressed="' + on + '"><b>' + esc(acc[k].label) + '</b><span>' + esc(acc[k].note) + '</span></button>';
      }).join('') + '</div>' +
        '<details class="nv-tips"><summary>More about Sora</summary><ul>' +
        '<li>If your school uses <b>class sets</b> or <b>title assignments</b>, the book appears on students’ Sora shelves by itself. Choose “Class set” or “Assigned to you” so the app says that.</li>' +
        '<li>Sora shows how far through the book a reader is as a percent. In step 4 you can split the book by Sora %, so “stop at 25%” works on any device.</li>' +
        '<li>Sora books are copy-protected, so they can’t be shown inside this app. Students read in Sora (side-by-side) and bring their highlights back here as evidence.</li></ul></details>';
    }

  document.addEventListener('input', function (e) {
    if (NV.state.view !== 'build') return;
    var r = e.target.closest && e.target.closest('.nv-unit-edit'); if (!r || e.target.dataset.f === 'ask') return;
    markDraft(Number(r.dataset.n));
  });
  document.addEventListener('change', function (e) {
    if (NV.state.view !== 'build') return;
    var r = e.target.closest && e.target.closest('.nv-unit-edit'); if (!r || e.target.dataset.f === 'ask') return;
    if (e.target.type === 'checkbox' || e.target.type === 'radio' || e.target.type === 'date') markDraft(Number(r.dataset.n));
    if (e.target.dataset.a === 'graded') { var pts = e.target.closest('.nv-act').querySelector('[data-a="points"]'); if (pts) pts.disabled = !e.target.checked; }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'bReq') B.req = e.target.value; });
  document.addEventListener('change', function (e) { if (e.target.id === 'bRedo') B.redo = e.target.checked; });
  document.addEventListener('toggle', function (e) {
    var d = e.target; if (!d.classList || !d.classList.contains('nv-unit-edit')) return;
    var n = Number(d.dataset.n), was = !!B.open[n]; B.open[n] = d.open;
    if (d.open && !was && !d.querySelector('[data-f="reading"]')) redrawUnit(n);
  }, true);
  function nOf(el) { return Number(el.closest('.nv-unit-edit').dataset.n); }
  function editUnit(el, fn) { var n = nOf(el), u = readUnit(n); fn(u); B.drafts[n] = u; B.open[n] = true; redrawUnit(n); return n; }
  A.bAddAct = function (el) {
    var t = el.dataset.v, L = lib(t);
    var n = editUnit(el, function (u) { if (u.activities.length >= 12) { NV.toast('Up to 12 activities in one ' + uwl() + '.'); return; } u.activities.push({ id: '', type: t, title: L.label, prompt: '', points: t === 'quiz' ? 0 : L.points, graded: true, mc: t === 'quiz' ? [{ id: '', q: '', choices: ['', '', '', ''], answer: 0, why: '' }] : undefined, words: t === 'vocabulary' ? [] : undefined, directions: [] }); });
    var acts = document.querySelectorAll('.nv-unit-edit[data-n="' + n + '"] .nv-act'); if (acts.length) { var last = acts[acts.length - 1]; last.classList.add('is-new'); var t0 = last.querySelector('[data-a="prompt"], [data-q="q"]'); if (t0) t0.focus(); }
  };
  A.bActRemove = function (el) {
    var i = Number(el.dataset.i), n = nOf(el), approved = saved(n).status === 'approved';
    if (!confirm('Remove this activity' + (approved ? '? It disappears for students and from grading. Work students already did is kept and comes back if you add it back by undoing (don’t save).' : '?'))) return;
    editUnit(el, function (u) { u.activities.splice(i, 1); });
  };
  A.bActMove = function (el) { var i = Number(el.dataset.i), d = Number(el.dataset.d); editUnit(el, function (u) { var j = i + d; if (j < 0 || j >= u.activities.length) return; var x = u.activities.splice(i, 1)[0]; u.activities.splice(j, 0, x); }); };
  A.bAddMc = function (el) { var i = Number(el.dataset.i); editUnit(el, function (u) { var a = u.activities[i]; if ((a.mc || []).length >= 15) return NV.toast('A quiz holds up to 15 questions.'); a.mc.push({ id: '', q: '', choices: ['', '', '', ''], answer: 0, why: '' }); }); };
  A.bRemoveMc = function (el) { var q = el.closest('.nv-mc'), n = nOf(el); q.remove(); B.drafts[n] = readUnit(n); redrawUnit(n); };
  A.bAddWord = function (el) { var i = Number(el.dataset.i); editUnit(el, function (u) { var a = u.activities[i]; a.words = a.words || []; if (a.words.length >= 15) return NV.toast('Up to 15 words.'); a.words.push({ word: '', hint: '' }); }); };
  A.bRemoveWord = function (el) { var n = nOf(el); el.closest('.nv-vword').remove(); B.drafts[n] = readUnit(n); redrawUnit(n); };

  function unitMsg(n, t, bad) { msg('uMsg' + n, t, bad); }
  function saveUnitCall(n, approve, btn) {
    var u = readUnit(n);
    unitMsg(n, 'Saving…');
    return save('saveUnit', { unit: u, approve: approve }, btn, 'uMsg' + n).then(function (r) {
      delete B.drafts[n]; B.open[n] = true;
      B.msgs['uMsg' + n] = approve === true && !r.approved ? 'Saved as a draft. To approve, add: ' + r.problems.join('; ') + '.' : r.approved ? (approve === true ? 'Approved. Its grading tiles are on the dashboard. Open it to students when you’re ready.' : 'Saved.') : 'Saved as a draft.';
      redrawUnit(n); refreshTop();
      return r;
    });
  }
  /** The top card's counts change with every save; the unit editors stay as they are. */
  function refreshTop() {
    if (B.step !== 5) return;
    var top = document.querySelector('.nv-builder > .nv-card'), list = NV.byId('bUnits');
    if (!top || !list || top.contains(document.activeElement)) return;
    var tmp = document.createElement('div'); tmp.innerHTML = step5(); top.outerHTML = tmp.querySelector('.nv-card').outerHTML;
    var sp = document.querySelector('.nv-bsteps'); if (sp) sp.outerHTML = stepper(5);
  }
  A.bSaveUnit = function (el) { saveUnitCall(nOf(el), undefined, el).catch(function () {}); };
  A.bApprove = function (el) { saveUnitCall(nOf(el), true, el).catch(function () {}); };
  A.bUnapprove = function (el) {
    var n = nOf(el);
    if (!confirm('Put ' + uw() + ' ' + n + ' back to draft? Its grading tiles leave the dashboard and students can’t open it until you approve it again. Students’ work is kept.')) return;
    saveUnitCall(n, false, el).catch(function () {});
  };
  A.bOpenUnit = function (el) {
    var n = nOf(el), on = el.dataset.on === 'true';
    if (!on && !confirm('Hide ' + uw() + ' ' + n + ' from students? Their work is kept.')) return;
    el.disabled = true;
    NV.rpc('setRelease', { classId: cid(), week: n, on: on }, { retry: true }).then(function (r) {
      B.data.settings.release = r.release; B.data.settings.openOn = r.openOn || B.data.settings.openOn; if (NV.T) NV.T.dash = null;
      B.msgs['uMsg' + n] = on ? 'Open to students.' : 'Hidden from students. Their work is kept.'; redrawUnit(n);
    }).catch(function (e) { el.disabled = false; unitMsg(n, e.message, true); });
  };
  A.bBuildUnit = function (el) {
    var n = nOf(el), cur = readUnit(n);
    if (!cur.reading.label.trim()) { unitMsg(n, 'Type what students read first (for example “Chapters 1–3”). The AI builds from that.', true); return; }
    if (hasWriting(cur) && !confirm('Replace what’s written in ' + uw() + ' ' + n + ' with an AI draft? Nothing is saved until you press Save.')) return;
    el.disabled = true; unitMsg(n, 'Building… (about 20–40 seconds)');
    NV.rpc('draftUnit', { classId: cid(), unit: cur, request: B.req }).then(function (r) {
      B.drafts[n] = r.draft; B.open[n] = true; B.msgs['uMsg' + n] = 'Drafted. Check every detail against the book (the AI hasn’t read it), then Save & approve.'; redrawUnit(n);
    }).catch(function (e) { el.disabled = false; unitMsg(n, e.message, true); });
  };
  A.bActAi = function (el) {
    var n = nOf(el), i = Number(el.dataset.i), cur = readUnit(n), a = cur.activities[i];
    if (!cur.reading.label.trim()) { unitMsg(n, 'Type what students read first.', true); return; }
    if ((a.prompt || (a.mc || []).some(function (q) { return q.q; })) && !confirm('Write “' + a.title + '” again with AI? Nothing is saved until you press Save.')) return;
    el.disabled = true; unitMsg(n, 'Writing ' + a.title + '…');
    NV.rpc('draftActivity', { classId: cid(), n: n, type: a.type, reading: cur.reading.label, eq: cur.eq, request: B.req, points: a.points, graded: a.graded,
      existing: cur.activities.filter(function (x, j) { return j !== i; }).map(function (x) { return x.title + ': ' + (x.prompt || '').slice(0, 60); }) }).then(function (r) {
      var x = r.activity; x.id = a.id;   // same id: work students already did stays attached
      if (a.type === 'quiz') (x.mc || []).forEach(function (q, j) { q.id = (a.mc || [])[j] && a.mc[j].id ? a.mc[j].id : ''; });
      var u = readUnit(n); u.activities[i] = x; B.drafts[n] = u; B.open[n] = true; B.msgs['uMsg' + n] = 'Rewritten. Check it, then save.'; redrawUnit(n);
    }).catch(function (e) { el.disabled = false; unitMsg(n, e.message, true); });
  };
  A.bAskAi = function (el) {
    var n = nOf(el), cur = readUnit(n), box = el.parentNode.querySelector('[data-f="ask"]'), req = box ? box.value.trim() : '';
    if (!req) { if (box) box.focus(); unitMsg(n, 'Say what you want, then press Ask AI.', true); return; }
    if (!cur.reading.label.trim()) { unitMsg(n, 'Type what students read first.', true); return; }
    el.disabled = true; unitMsg(n, 'Asking for an activity…');
    NV.rpc('draftActivity', { classId: cid(), n: n, type: 'auto', reading: cur.reading.label, eq: cur.eq, request: req,
      existing: cur.activities.map(function (x) { return x.title + ': ' + (x.prompt || '').slice(0, 60); }) }).then(function (r) {
      var u = readUnit(n); u.activities.push(r.activity); B.drafts[n] = u; B.open[n] = true; B.msgs['uMsg' + n] = 'Added “' + r.activity.title + '”. Check it, then save.'; redrawUnit(n);
    }).catch(function (e) { el.disabled = false; unitMsg(n, e.message, true); });
  };

  // Build every unit, one after another. Each one is saved as a draft the moment it's written,
  // so stopping (or closing the tab) keeps every unit that finished.
  A.bBuildAll = function () {
    var s = st(), wl = uwl();
    var skipEdits = Object.keys(B.drafts).map(Number);
    var todo = (s.units || []).filter(function (u) { return u.status !== 'approved' && (u.reading || {}).label && skipEdits.indexOf(u.n) < 0 && (B.redo || !hasWriting(u)); });
    var noReading = (s.units || []).filter(function (u) { return u.status !== 'approved' && !(u.reading || {}).label; }).map(function (u) { return u.n; });
    if (!todo.length) {
      NV.toast(noReading.length ? 'Type the readings first (step 4): ' + uw() + ' ' + noReading.join(', ') + ' ' + (noReading.length === 1 ? 'has' : 'have') + ' none.' : 'Every draft already has writing. Tick “Also redo drafts that already have writing” to redo them.');
      return;
    }
    if (B.redo && todo.some(hasWriting) && !confirm('Rewrite ' + NV.plural(todo.length, wl) + ' with AI, including drafts that already have writing? Approved ' + wl + 's are not touched.')) return;
    B.run = { total: todo.length, done: 0, stop: false, msg: 'Building ' + uw() + ' ' + todo[0].n + '…', errors: [] };
    draw(); var i = 0;
    function next() {
      var run = B.run; if (!run) return;
      if (run.stop || i >= todo.length) return finish();
      var u = todo[i++]; run.msg = 'Building ' + uw() + ' ' + u.n + ' (' + i + ' of ' + run.total + ')… about 30 seconds each.'; paintRun();
      NV.rpc('draftUnit', { classId: cid(), n: u.n, request: B.req }).then(function (r) {
        return NV.rpc('saveUnit', { classId: cid(), base: st().updatedAt || '', unit: r.draft }, { retry: true }).then(function (x) { B.data.study = x.study; if (NV.T) NV.T.dash = null; });
      }).then(function () {
        run.done++; if (NV.state.view === 'build' && B.step === 5 && !B.drafts[u.n]) { redrawUnit(u.n); }
        paintRun(); next();
      }).catch(function (e) {
        run.done++; run.errors.push(uw() + ' ' + u.n + ': ' + e.message);
        if (/GEMINI|quota|key|another tab|co-teacher/i.test(e.message)) run.stop = true;
        paintRun(); next();
      });
    }
    function finish() {
      var run = B.run; B.run = null;
      B.lastRun = 'Built ' + NV.plural(run.done - run.errors.length, wl) + ' as drafts.' + (run.errors.length ? ' Not built: ' + run.errors.join(' · ') : '') + (run.stop && run.done < run.total ? ' Stopped.' : '') + ' Open each one, check it, and approve.';
      if (NV.state.view === 'build' && B.step === 5) { if (!Object.keys(B.drafts).length) draw(); else refreshTop(); }
      NV.toast(run.errors.length ? 'Done, with problems. See the note at the top.' : 'Every ' + wl + ' is drafted. Check each one, then approve.', run.errors.length ? 'error' : '');
    }
    next();
  };
  function paintRun() {
    var run = B.run; if (!run) return;
    var bar = document.querySelector('.nv-progress'), m = NV.byId('bRunMsg');
    if (bar) { bar.firstChild.style.width = (run.total ? Math.round(run.done / run.total * 100) : 0) + '%'; bar.setAttribute('aria-valuenow', run.done); }
    if (m) m.textContent = run.msg;
    var chip = document.querySelector('.nv-builder > .nv-card .nv-sub-head .nv-chip'); if (chip) chip.textContent = (st().units || []).filter(function (u) { return u.status === 'approved'; }).length + ' of ' + (st().units || []).length + ' approved';
  }
  A.bStopRun = function (el) { if (B.run) { B.run.stop = true; el.disabled = true; el.textContent = 'Stopping after this one…'; } };
  A.bApproveReady = function (el) {
    var list = (st().units || []).filter(function (u) { return u.status !== 'approved' && !B.drafts[u.n] && !(u.problems || []).length; });
    if (!list.length) return;
    if (!confirm('Approve ' + list.map(function (u) { return u.label; }).join(', ') + '? Check each one first: approved ' + uwl() + 's get grading tiles and can be opened to students.')) return;
    el.disabled = true; var i = 0;
    (function next() {
      if (i >= list.length) { NV.toast('Approved ' + NV.plural(list.length, uwl()) + '.'); draw(); return; }
      var u = list[i++];
      NV.rpc('saveUnit', { classId: cid(), base: st().updatedAt || '', unit: u, approve: true }, { retry: true }).then(function (r) { B.data.study = r.study; if (NV.T) NV.T.dash = null; next(); })
        .catch(function (e) { NV.toast(u.label + ': ' + e.message, 'error'); draw(); });
    })();
  };

  window.__MB.Build = 'ok';
})();
</script>
