<script>
// ============================================================================
// SaveGuard -- students never lose work.
//  * autosave 2 s after typing stops; reads ONLY the form on screen for that item
//  * a copy of unsaved writing stays in this browser (one key per tab) until the server has it;
//    copies left by closed tabs are OFFERED back next visit, never restored by themselves
//  * every save sends `base`; a newer copy elsewhere gets the choice: Load newer / Keep this tab's
//    (whatever isn't kept goes to the server's backups first)
//  * tabs talk: a save is announced; an idle tab of the same student re-reads
//  * Turn in: flushes the draft first, one click only; typing during it is saved afterwards
//  * leaving: save + local copy on hide; the browser warns while anything is unsaved
// ============================================================================
(function () {
  var doc = null;          // the open item
  var choiceOpen = false;
  var chan = null; try { chan = new BroadcastChannel('nv-saves'); } catch (e) { chan = null; }
  var extras = {};         // other unsaved fields (discussion drafts): name -> fn() => bool

  function copyPrefix(d) { return 'nvc|' + d.email + '|' + d.classId + '|' + d.key + '|'; }
  function myCopyKey(d) { return copyPrefix(d) + NV.tabId; }
  function heartbeat() { NV.store.set('nvt|' + NV.tabId, Date.now()); }
  heartbeat(); setInterval(heartbeat, 10000);

  function setStatus(text, kind) {
    var el = document.getElementById('nvSaveState'); if (!el) return;
    el.textContent = text; el.className = 'nv-save-state' + (kind ? ' is-' + kind : '');
  }
  function writeLocal() {
    if (!doc || doc.readOnly) return;
    NV.store.set(myCopyKey(doc), { data: doc.readForm(), at: Date.now(), base: doc.base, tab: NV.tabId });
  }
  function dropLocal() { if (doc) NV.store.del(myCopyKey(doc)); }
  function announce(at) {
    var msg = { email: doc.email, classId: doc.classId, key: doc.key, at: at, tab: NV.tabId };
    try { if (chan) chan.postMessage(msg); else NV.store.set('nvb', Object.assign({ n: Math.random() }, msg)); } catch (e) {}
  }

  NV.guard = {
    /** d: {classId, as, email, week, kind, key, data, base, submittedAt, readOnly, readForm(), setForm(data), onSaved?(res)} */
    open: function (d) {
      NV.guard.close();
      doc = Object.assign({ dirty: false, inflight: null, again: false, fails: 0, lastJson: JSON.stringify(d.data || {}), lastReload: 0 }, d);
      if (!doc.readOnly) NV.guard.offerCopies();
      setStatus(doc.readOnly ? 'Read-only' : 'All changes saved', doc.readOnly ? 'muted' : 'ok');
      return doc;
    },
    close: function () { if (doc && doc.dirty) { writeLocal(); NV.guard.save(false); } doc = null; },
    current: function () { return doc; },
    changed: function () {
      if (!doc || doc.readOnly) return;
      doc.dirty = true; writeLocal();
      var len = JSON.stringify(doc.readForm()).length;
      setStatus(len > 110000 ? 'Getting long: this item is near its size limit' : 'Saving soon…', len > 110000 ? 'warn' : '');
      clearTimeout(doc.timer); doc.timer = setTimeout(function () { NV.guard.save(false); }, 2000);
    },
    /** Autosave (submit=false) or Turn in (submit=true). Resolves {ok} | {ok:false}. */
    save: function (submit) {
      var d = doc; if (!d || d.readOnly) return Promise.resolve({ ok: true });
      clearTimeout(d.timer);
      if (d.inflight) { if (!submit) { d.again = true; return d.inflight; } return d.inflight.then(function () { return NV.guard.save(true); }); }
      var data = d.readForm(), json = JSON.stringify(data);
      if (!submit && json === d.lastJson) { d.dirty = false; dropLocal(); return Promise.resolve({ ok: true }); }
      setStatus(submit ? 'Turning in…' : 'Saving…');
      d.inflight = NV.rpc('saveWork', { classId: d.classId, as: d.as || '', week: d.week, act: d.act, data: data, base: d.base, submit: !!submit }, { retry: true, timeoutMs: 45000 })
        .then(function (res) {
          if (res && res.stale) return conflict(d, res, submit, data);
          d.base = res.savedAt; d.lastJson = json; d.fails = 0;
          if (submit) { d.submittedAt = res.submittedAt; d.subFp = res.subFp; }
          d.fp = res.fp;
          if (doc === d && JSON.stringify(d.readForm()) !== json) { d.dirty = true; writeLocal(); d.timer = setTimeout(function () { NV.guard.save(false); }, 1500); setStatus(d.submittedAt ? 'Edits not turned in yet. Saving…' : 'Saving…'); }
          else { d.dirty = false; if (doc === d) dropLocal(); else NV.store.del(copyPrefix(d) + NV.tabId); setStatus('All changes saved', 'ok'); }
          announce(res.savedAt);
          if (d.onSaved) d.onSaved(res, submit);
          return { ok: true, res: res };
        })
        .catch(function (err) {
          d.fails++; writeLocal();
          var msg = err && err.message || String(err);
          if (/too long|limit|read-only|could not be read|isn’t open|hasn’t opened|not in this class|signed in as/i.test(msg)) { setStatus(msg, 'error'); NV.toast(msg, 'error'); return { ok: false, error: msg }; }
          if (d.fails >= 3) setStatus('Your work isn’t reaching the server. Your sign-in may have expired: reload the page and your writing will be offered back.', 'error');
          else { setStatus('Couldn’t save yet. Trying again…', 'warn'); d.timer = setTimeout(function () { NV.guard.save(false); }, 5000); }
          return { ok: false, error: msg };
        })
        .then(function (r) { d.inflight = null; if (d.again) { d.again = false; if (d.dirty) NV.guard.save(false); } return r; });
      return d.inflight;
    },
    /** Turn in: flush the draft first, then submit with base; a second click is ignored by the caller's disabled button. */
    submit: function () {
      var d = doc; if (!d) return Promise.resolve({ ok: false });
      var flush = d.inflight || Promise.resolve();
      return flush.then(function () { return NV.guard.save(true); });
    },
    offerCopies: function () {
      var d = doc, now = Date.now(), serverJson = d.lastJson, offers = [];
      NV.store.keys(copyPrefix(d)).forEach(function (k) {
        var c = NV.store.get(k, null); if (!c || !c.data) { NV.store.del(k); return; }
        var tab = k.slice(copyPrefix(d).length), beat = NV.store.get('nvt|' + tab, 0);
        if (tab !== NV.tabId && now - beat < 30000) return;   // another tab that is still open owns it
        if (JSON.stringify(c.data) === serverJson) { NV.store.del(k); return; }
        offers.push({ key: k, copy: c, older: d.base && c.at < new Date(d.base).getTime() });
      });
      if (!offers.length) return;
      offers.sort(function (a, b) { return b.copy.at - a.copy.at; });
      d.offers = offers;
      var box = document.getElementById('nvOffer'); if (!box) return;
      var o = offers[0];
      box.hidden = false;
      box.innerHTML = '<p><b>Unsaved writing was found on this device</b> (from ' + NV.esc(new Date(o.copy.at).toLocaleString()) + ')' + (o.older ? '. It is <b>older</b> than the copy that’s saved.' : '.') +
        (offers.length > 1 ? ' There are ' + offers.length + ' copies; this is the newest.' : '') + '</p>' +
        '<div class="nv-row"><button type="button" class="nv-btn primary" data-act="offerRestore">Put it back</button><button type="button" class="nv-btn" data-act="offerDismiss">Not needed</button></div>';
    },
    hasUnsaved: function () { return !!(doc && (doc.dirty || doc.inflight)) || choiceOpen || Object.keys(extras).some(function (k) { try { return extras[k](); } catch (e) { return false; } }); },
    registerExtra: function (name, fn) { if (fn) extras[name] = fn; else delete extras[name]; }
  };

  // Restoring an offered copy puts it in the form and saves it (as this tab's edit).
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="offerRestore"],[data-act="offerDismiss"]'); if (!b || !doc || !doc.offers) return;
    var o = doc.offers.shift(), box = document.getElementById('nvOffer');
    if (b.dataset.act === 'offerRestore') {
      doc.setForm(o.copy.data); NV.store.del(o.key); NV.guard.changed();
      // the rest go to the server's backups so nothing is lost
      doc.offers.forEach(function (x) { NV.rpc('keepWorkCopy', { classId: doc.classId, as: doc.as || '', week: doc.week, act: doc.act, data: x.copy.data, reason: 'local-copy' }, { retry: true }).then(function () { NV.store.del(x.key); }).catch(function () {}); });
      doc.offers = [];
      NV.toast('Your writing is back. It’s saving now.');
    } else {
      var d = doc;
      NV.rpc('keepWorkCopy', { classId: d.classId, as: d.as || '', week: d.week, act: d.act, data: o.copy.data, reason: 'local-copy' }, { retry: true })
        .then(function () { NV.store.del(o.key); }).catch(function () { NV.toast('That copy is still kept on this device.'); });
    }
    if (box) { if (doc.offers && doc.offers.length) NV.guard.offerCopies(); else { box.hidden = true; box.innerHTML = ''; } }
  });

  /** A newer copy is on the server. Ask. Whatever isn't kept is backed up first. */
  function conflict(d, res, submit, mine) {
    return new Promise(function (resolve) {
      choiceOpen = true;
      NV.modal('<h2 id="nvModalTitle">This was changed somewhere else</h2><p>A newer version was saved ' + (res.serverAt ? 'at ' + NV.esc(NV.fmtDate(res.serverAt, true)) + ' ' : '') + 'in another tab or on another device. Which one do you want to keep?</p>' +
        '<p class="nv-muted">The one you don’t keep is saved as a backup your teacher can bring back.</p>' +
        '<div class="nv-row"><button type="button" class="nv-btn" id="nvKeepNewer">Load the newer version</button><button type="button" class="nv-btn primary" id="nvKeepMine">Keep this tab’s version</button></div>', { locked: true });
      NV.byId('nvKeepNewer').onclick = function () {
        this.disabled = true;
        NV.rpc('keepWorkCopy', { classId: d.classId, as: d.as || '', week: d.week, act: d.act, data: mine, reason: 'not-kept' }, { retry: true }).catch(function () {}).then(function () {
          d.base = res.serverAt; d.lastJson = JSON.stringify(res.server || {}); d.dirty = false;
          if (doc === d) { d.setForm(res.server || {}); dropLocal(); }
          if (res.submittedAt) d.submittedAt = res.submittedAt;
          choiceOpen = false; NV.closeModal(); setStatus('Loaded the newer version', 'ok');
          resolve({ ok: true, loadedNewer: true });
        });
      };
      NV.byId('nvKeepMine').onclick = function () {
        this.disabled = true;
        d.base = res.serverAt; choiceOpen = false; NV.closeModal();
        d.inflight = null;
        NV.guard.save(!!submit).then(resolve);
      };
    });
  }

  // Another tab of the same student saved: an idle tab re-reads (at most every 8 s).
  function onSaved(msg) {
    if (!doc || !msg || msg.tab === NV.tabId || msg.email !== doc.email || msg.classId !== doc.classId || msg.key !== doc.key) return;
    if (doc.dirty || doc.inflight || choiceOpen || doc.readOnly) return;
    var now = Date.now(); if (now - doc.lastReload < 8000) return; doc.lastReload = now;
    var d = doc;
    NV.rpc('getStudentItem', { classId: d.classId, as: d.as || '', week: d.week, act: d.act }).then(function (r) {
      if (doc !== d || d.dirty || d.inflight || !r.data) return;
      d.base = r.updatedAt || d.base; d.lastJson = JSON.stringify(r.data); d.submittedAt = r.submittedAt; d.setForm(r.data);
      setStatus('Updated from your other tab', 'ok');
    }).catch(function () {});
  }
  if (chan) chan.onmessage = function (e) { onSaved(e.data); };
  window.addEventListener('storage', function (e) { if (e.key === 'nvb' && e.newValue) { try { onSaved(JSON.parse(e.newValue)); } catch (x) {} } });

  // Leaving
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && doc && doc.dirty) { writeLocal(); NV.guard.save(false); } });
  window.addEventListener('pagehide', function () { if (doc && doc.dirty) { writeLocal(); NV.guard.save(false); } });
  window.addEventListener('beforeunload', function (e) { if (NV.guard.hasUnsaved()) { if (doc && doc.dirty) writeLocal(); e.preventDefault(); e.returnValue = ''; return ''; } });

  NV.hasUnsaved = function () { return NV.guard.hasUnsaved(); };
  NV.flushAll = function () { if (doc && doc.dirty) return NV.guard.save(false); return Promise.resolve(); };
  /** Switching screens saves first. */
  NV.leave = function (fn) {
    if (choiceOpen) return;
    if (!doc || (!doc.dirty && !doc.inflight)) { NV.guard.close(); fn(); return; }
    writeLocal();
    NV.guard.save(false).then(function (r) {
      if (r && r.ok === false && !confirm('Your latest typing hasn’t reached the server yet. It’s kept on this device and will be offered back. Leave this page anyway?')) return;
      doc = null; fn();
    });
  };
  window.__MB.SaveGuard = 'ok';
})();
</script>
