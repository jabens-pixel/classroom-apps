<script>
// ============================================================================
// Marking screens (exactly like Macbeth): groups Resubmitted → Ready to Grade → Not Submitted →
// Graded → Excluded, in roster (name) order inside each; scoring, excluding or clearing a student
// moves their row to its new group at once (place); marks save on the click, comments 2.5 s after
// typing stops and on blur (kept on this device until confirmed); saves for one student run in
// order and the last action wins; ⤢ Focused grading on every screen.
// ============================================================================
(function () {
  var M = NV.M = { data: null, hideNot: false, focus: null, order: [] };
  var A = NV.act = NV.act || {};
  function esc(s) { return NV.esc(s); }
  function cid() { return NV.T.classId; }
  var GROUPS = [
    { k: 'redo', label: 'Resubmitted', note: 'Changed after you graded it', hideEmpty: true },
    { k: 'ready', label: 'Ready to Grade', note: 'Turned in, not graded yet' },
    { k: 'none', label: 'Not Submitted', note: 'Not turned in yet' },
    { k: 'graded', label: 'Graded', note: 'Scored or marked' },
    { k: 'excluded', label: 'Excluded', note: 'Left out of the grade', hideEmpty: true }
  ];
  function groupOf(r) {
    var c = r.cell;
    if (c.redo) return 'redo';
    if (c.excluded) return 'excluded';
    if (M.data.item.kind === 'quiz') return c.submitted ? 'graded' : 'none';
    if (c.toGrade) return 'ready';
    if (c.handled) return 'graded';
    return 'none';
  }

  // ---------------------------------------------------------------- view
  NV.views.marking = function (app) {
    app.innerHTML = '<section class="nv-card nv-skeleton"><p>Opening the marking screen…</p></section>';
    load(app, NV.state.focusEmail || '');
  };
  function load(app, scrollTo) {
    NV.rpc('getMarking', { classId: cid(), itemKey: NV.state.itemKey }, { retry: true }).then(function (d) {
      if (NV.state.view !== 'marking') return;
      M.data = d;
      d.rows.forEach(function (r) { r.group = groupOf(r); });
      draw(app);
      restoreLocalComments();
      var target = scrollTo || firstToMark();
      if (target) setTimeout(function () { var el = document.querySelector('.nv-mrow[data-email="' + cssEsc(target) + '"]'); if (el) { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); el.classList.add('is-jump'); setTimeout(function () { el.classList.remove('is-jump'); }, 2400); } }, 120);
    }).catch(function (e) { NV.fail(app, e); });
  }
  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }
  function firstToMark() {
    var r = M.data.rows.filter(function (x) { return x.group === 'redo'; })[0] || M.data.rows.filter(function (x) { return x.group === 'ready'; })[0];
    return r ? r.email : '';
  }
  function draw(app) {
    var d = M.data, it = d.item, c = d.content;
    var tabs = '<nav class="nv-mtabs" aria-label="This week’s assignments">' + d.weekItems.map(function (w) {
      return '<button type="button" class="nv-mtab' + (w.key === it.key ? ' is-on' : '') + '" data-act="markTab" data-key="' + esc(w.key) + '"' + (w.key === it.key ? ' aria-current="page"' : '') + '>' + esc(w.kindLabel) + '</button>';
    }).join('') + '</nav>';
    var top = '<section class="nv-card nv-mtop"><div class="nv-eyebrow">' + esc(it.unitLabel) + (c.reading ? ' · ' + esc(c.reading) : '') + '</div><h1>' + esc((it.icon ? it.icon + ' ' : '') + it.kindLabel) + '<small> · ' + (it.type === 'auto' ? 'scores itself · ' + it.max + ' pts' : it.max + ' pts') + '</small></h1>' +
      (c.eq ? '<p class="nv-eq"><span>Essential question</span>' + esc(c.eq) + '</p>' : '') + promptHtml() + legendHtml() +
      '<div class="nv-row nv-mtools"><label class="nv-check"><input type="checkbox" id="mHideNot"' + (M.hideNot ? ' checked' : '') + '><span>Hide students who haven’t submitted</span></label>' +
      '<button type="button" class="nv-btn small ' + (d.classExcluded ? '' : 'ghost is-danger') + '" data-act="markNoGrade" data-on="' + (!d.classExcluded) + '">' + (d.classExcluded ? '↺ Count this ' + esc(it.kindLabel) + ' again for everyone' : '🚫 Don’t grade this ' + esc(it.kindLabel) + ' for anyone') + '</button>' +
      (!d.released ? '<span class="nv-chip is-warn">Hidden from students</span>' : '') + '</div>' +
      (d.classExcluded ? '<p class="nv-excluded-note">This is left out of every student’s grade in this class. Scores you enter are kept.</p>' : '') + '</section>';
    // Every group is on the page (an empty Resubmitted/Excluded is hidden), so a row can move into it.
    var groups = GROUPS.map(function (g) {
      var rows = d.rows.filter(function (r) { return r.group === g.k; });
      var collapsed = g.k === 'none' && M.hideNot;
      return '<section class="nv-mgroup nv-mgroup-' + g.k + (collapsed ? ' is-collapsed' : '') + '" data-group="' + g.k + '"' + (g.hideEmpty && !rows.length ? ' hidden' : '') + '><header><h2>' + g.label + '</h2><span class="nv-mgroup-count">' + rows.length + '</span><span class="nv-muted">' + (collapsed ? 'hidden' : g.note) + '</span></header>' +
        '<div class="nv-mgroup-list"' + (collapsed ? ' hidden' : '') + '>' + rows.map(rowHtml).join('') + '</div>' +
        (collapsed ? '' : '<p class="nv-empty nv-mgroup-empty"' + (rows.length ? ' hidden' : '') + '>No students here.</p>') + '</section>';
    }).join('');
    app.innerHTML = '<div class="nv-mhead"><button type="button" class="nv-btn" data-act="markBack">← Back to Dashboard</button>' + tabs + '<button type="button" class="nv-btn small" data-act="markRefresh">↻ Refresh</button></div>' + top +
      '<div class="nv-mgroups" id="nvMGroups">' + groups + '</div><div id="nvFocus" class="nv-focus-overlay" hidden></div>';
    NV.byId('mHideNot').onchange = function () { M.hideNot = this.checked; NV.store.set('nvHideNot', M.hideNot); draw(app); restoreLocalComments(); };
  }
  M.hideNot = NV.store.get('nvHideNot', false);
  function promptHtml() {
    var d = M.data, c = d.content, k = d.item.kind;
    if (k === 'quiz') return '<details class="nv-akey"><summary>Answer key (' + c.mc.length + ' questions)</summary><ol>' + c.mc.map(function (q) { return '<li>' + esc(q.q) + ' <b>' + 'ABCD'.charAt(q.answer) + ': ' + esc(q.choices[q.answer]) + '</b></li>'; }).join('') + '</ol></details><p class="nv-small nv-muted">Multiple choice scores itself: 1 point right first try, ½ point second try. You can exclude it for a student.</p>';
    if (k === 'evidence') return (c.prompt ? '<div class="nv-prompt">' + esc(c.prompt) + '</div>' : '') + '<p class="nv-small">Students collect at least three pieces of evidence: where it is, words from the book, and why it matters.' + (c.focus && c.focus.length ? ' This week’s colors: ' + c.focus.map(function (x) { var kk = (d.highlightKey || []).filter(function (h) { return h.color === x; })[0]; return '<span class="nv-key-chip nv-hlbg-' + esc(x) + '">' + esc(kk ? kk.label : x) + '</span>'; }).join(' ') : '') + '</p>';
    var dirs = (c.directions || []).length ? '<ol class="nv-directions">' + c.directions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' : '';
    var words = k === 'vocab' && (c.words || []).length ? '<p class="nv-small">Words: ' + c.words.map(function (w) { return '<b>' + esc(w.word) + '</b>'; }).join(', ') + '</p>' : '';
    return '<div class="nv-prompt">' + esc(c.prompt || '') + (c.minWords ? ' <small>(at least ' + c.minWords + ' words)</small>' : '') + '</div>' + dirs + words;
  }
  function legendHtml() {
    var d = M.data;
    if (d.rubric) return '<details class="nv-legend" open><summary>' + esc(d.item.kindLabel) + ' rubric — the full descriptors</summary><ol class="nv-rubric-list">' + d.rubric.map(function (r) { return '<li><b>' + r.score + ' · ' + esc(r.label) + '</b> ' + esc(r.text) + '</li>'; }).join('') + '</ol></details>';
    if (d.complete) return '<details class="nv-legend" open><summary>' + esc(d.item.kindLabel) + ' rubric — the full descriptors</summary><p><b>Complete (' + d.item.max + '):</b> ' + esc(d.complete.complete) + '</p><p><b>Partly complete (' + half(d.item.max) + '):</b> Some of it is there, or it’s thin on evidence.</p><p><b>Incomplete (0):</b> ' + esc(d.complete.incomplete) + '</p></details>';
    return '';
  }

  function half(max) { return Math.round(max) / 2; }   // the Partly band (scores go in halves)
  // ---------------------------------------------------------------- one row
  function bandLabel(score) {
    var d = M.data, it = d.item;
    if (score === null || score === undefined) return '';
    if (it.type === 'points') return score >= it.max ? 'Complete' : score > 0 ? 'Partly complete' : 'Incomplete';
    if (it.type === 'rubric') return ((d.rubric || []).filter(function (r) { return r.score === Math.round(score); })[0] || {}).label || '';
    return '';
  }
  function badges(r) {
    var it = M.data.item, c = r.cell, g = r.grade || {}, out = [];
    if (c.redo) out.push('<span class="nv-mbadge is-redo">↻ ' + (it.kind === 'discussion' ? 'REDONE' : 'RESUBMITTED') + ' — needs regrade</span>');
    else if (c.toGrade) out.push('<span class="nv-mbadge is-needs">Needs grading</span>');
    if (c.excluded) out.push('<span class="nv-mbadge">' + (c.classExcluded ? 'Not graded for this class' : 'Excluded') + '</span>');
    if (it.kind === 'quiz') { if (c.submitted) out.push('<span class="nv-mbadge is-graded">' + c.score + '/' + (c.max || it.max) + '</span>'); else if (c.started) out.push('<span class="nv-mbadge">In progress</span>'); }
    else if (c.score !== null && c.score !== undefined) out.push('<span class="nv-mbadge is-graded">' + esc(bandLabel(c.score)) + ' ' + c.score + '/' + it.max + '</span>');
    if (!c.submitted && !(it.kind === 'quiz' && c.started)) out.push(r.hasDraft ? '<span class="nv-mbadge is-draft">Draft — not submitted</span>' : '<span class="nv-mbadge">Not submitted</span>');
    if (r.workIsDraft && c.score !== null && c.score !== undefined) out.push('<span class="nv-mbadge is-draft">Teacher graded draft</span>');
    if (r.editsAfterSubmit) out.push('<span class="nv-mbadge is-draft">Edits not turned in yet</span>');
    var s = (r.stats || {})[it.kind === 'evidence' ? 'evidence' : 'response'], text = workText(r);
    if (s && s.pastedChars && text.length) { var p = Math.min(100, Math.round(s.pastedChars / text.length * 100)); if (p >= 10) out.push('<span class="nv-mbadge is-paste">📋 ' + p + '% pasted</span>'); }
    if (r.demo) out.push('<span class="nv-demo-tag">demo</span>');
    return out.join('');
  }
  function workText(r) {
    var k = M.data.item.kind, w = r.work || {};
    if (k === 'text') return w.text || '';
    if (k === 'close') return w.analysis || '';
    if (k === 'vocab') return (w.rows || []).map(function (x) { return x.why || ''; }).join('\n');
    if (k === 'evidence') return (w.cards || []).map(function (c) { return c.why || ''; }).join('\n');
    return '';
  }
  function workHtml(r) {
    var d = M.data, k = d.item.kind, w = r.work;
    if (r.unreadable) return '<p class="nv-error">This copy couldn’t be read. A backup is in the WorkBackups tab (editor tool: listWorkBackups).</p>';
    if (k === 'quiz') {
      if (!r.cell.started) return '<p class="nv-empty">Not started.</p>';
      return '<ol class="nv-mquiz">' + d.content.mc.map(function (q, i) {
        var a = (w.answers || [])[i] || { tries: [], state: 'open', points: 0 };
        return '<li class="is-' + esc(a.state) + '"><span class="nv-mquiz-q">' + esc(q.q) + '</span><span class="nv-mquiz-a">' + (a.tries.length ? a.tries.map(function (t) { return '<b class="' + (t === q.answer ? 'is-right' : 'is-wrong') + '">' + 'ABCD'.charAt(t) + '</b>'; }).join(' → ') : '—') + ' · ' + (a.state === 'open' ? 'not answered' : a.points + ' pt') + '</span></li>';
      }).join('') + '</ol>';
    }
    if (k === 'discussion') {
      var posts = (w && w.posts) || [];
      if (!posts.length) return '<p class="nv-empty">No posts yet.</p>';
      return posts.map(function (p) { return '<div class="nv-mpost' + (p.replyTo ? ' is-reply' : '') + '">' + (p.replyTo ? '<div class="nv-mpost-ctx">↳ Reply to <b>' + esc(p.replyTo) + '</b>: “' + esc(p.replyToText) + (p.replyToText.length >= 160 ? '…' : '') + '”</div>' : '<div class="nv-mpost-ctx">Post</div>') + '<div class="nv-post-text">' + esc(p.text) + '</div><time>' + esc(NV.fmtDate(p.createdAt, true)) + (p.editedAt ? ' · edited' : '') + '</time></div>'; }).join('');
    }
    if (!w || !NV.words(JSON.stringify(w))) return '<p class="nv-empty">Nothing written yet.</p>';
    var stats = r.stats || {};
    if (k === 'close') {
      return '<div class="nv-mmeta">' + (w.loc ? esc(w.loc) : '<span class="nv-muted">no location</span>') + '</div><blockquote class="nv-mpassage">' + esc(w.passage || '') + '</blockquote><div class="nv-mtext">' + (w.analysis ? NV.stats.highlightHtml(w.analysis, stats.response) : '<em>No analysis</em>') + '</div><div class="nv-mmeta">' + NV.plural(NV.words(w.analysis || ''), 'word') + '</div>' + NV.stats.chipsHtml(stats.response, w.analysis || '') + pasteLegend(stats.response);
    }
    if (k === 'vocab') {
      var rows = w.rows || [];
      return '<table class="nv-table nv-mvocab"><thead><tr><th>Word</th><th>Where</th><th>Meaning here</th><th>Why the author chose it</th></tr></thead><tbody>' + rows.map(function (x) { return '<tr><td><b>' + esc(x.word) + '</b></td><td>' + esc(x.loc) + '</td><td>' + esc(x.meaning) + '</td><td>' + NV.stats.highlightHtml(x.why, stats.response) + '</td></tr>'; }).join('') + '</tbody></table>' + NV.stats.chipsHtml(stats.response, workText(r)) + pasteLegend(stats.response);
    }
    if (k === 'text') {
      var text = w.text || '', cites = (text.match(/\((?:[^()]*?)(?:ch\.?|chapter|chap\.?|p\.|pp\.|pg\.?|page|part|section|loc\.?|\d{1,3}\s?%)[^()]*\)/ig) || []).length;
      return '<div class="nv-mtext">' + (text ? NV.stats.highlightHtml(text, stats.response) : '<em>Empty</em>') + '</div><div class="nv-mmeta">' + NV.plural(NV.words(text), 'word') + ' · ' + NV.plural(cites, 'citation') + (d.content.minWords ? ' · asked for ' + d.content.minWords + '+' : '') + '</div>' + (w.link ? '<p class="nv-mmeta">Link: <a href="' + esc(w.link) + '" target="_blank" rel="noopener">' + esc(w.link) + '</a></p>' : '') + NV.stats.chipsHtml(stats.response, text) + pasteLegend(stats.response);
    }
    var cards = w.cards || [];
    return '<ol class="nv-mcards">' + cards.map(function (c) { return '<li class="nv-hlside-' + esc(c.color || 'none') + '"><div class="nv-mcard-loc">' + (c.loc ? esc(c.loc) : '<span class="nv-muted">no location</span>') + (c.color ? ' · ' + esc(NV.colorName[c.color] || c.color) + (function () { var k = (d.highlightKey || []).filter(function (h) { return h.color === c.color; })[0]; return k ? ' = ' + esc(k.label) : ''; })() : '') + (c.src === 'sora' ? ' · from Sora' : '') + '</div><div class="nv-mcard-text">“' + esc(c.text) + '”</div><div class="nv-mcard-why">' + (c.why ? NV.stats.highlightHtml(c.why, stats.evidence) : '<span class="nv-muted">No explanation</span>') + '</div></li>'; }).join('') + '</ol>' +
      '<div class="nv-mmeta">' + NV.plural(cards.length, 'card') + ' · ' + cards.filter(function (c) { return c.loc && c.why && c.why.trim(); }).length + ' with a location and an explanation</div>' + NV.stats.chipsHtml(stats.evidence, workText(r)) + pasteLegend(stats.evidence);
  }
  function pasteLegend(s) { return s && s.pastes ? '<p class="nv-paste-legend"><span class="nv-swatch nv-pasted-swatch"></span>Pasted into the box</p>' : ''; }
  function panelHtml(r) {
    var it = M.data.item, c = r.cell, g = r.grade || {}, e = esc(r.email), ctx = cid() + '::' + it.key + '::' + r.email;
    var score = c.score, h = '<div class="nv-mpanel">';
    if (it.type === 'rubric') {
      h += '<div class="nv-bands" role="group" aria-label="Rubric level">' + (M.data.rubric || []).map(function (b) { var on = score !== null && score !== undefined && Math.round(score) === b.score; return '<button type="button" class="nv-band' + (on ? ' is-on' : '') + '" data-act="markBand" data-email="' + e + '" data-score="' + b.score + '" aria-pressed="' + on + '" title="' + esc(b.text) + '"><b>' + b.score + '</b><span>' + esc(b.label) + '</span></button>'; }).join('') + '</div>';
    } else if (it.type === 'points') {
      h += '<div class="nv-bands is-three" role="group" aria-label="Complete, partly complete or incomplete">' + [[it.max, 'Complete', '✓'], [half(it.max), 'Partly', '½'], [0, 'Incomplete', '✗']].map(function (b) { var on = score !== null && score !== undefined && Number(score) === b[0]; return '<button type="button" class="nv-band' + (on ? ' is-on' : '') + '" data-act="markBand" data-email="' + e + '" data-score="' + b[0] + '" aria-pressed="' + on + '"><b>' + b[2] + '</b><span>' + b[1] + ' (' + b[0] + ')</span></button>'; }).join('') + '</div>';
    } else {
      h += '<p class="nv-mauto">' + (c.submitted ? '<b>' + c.score + ' / ' + (c.max || it.max) + '</b> · scores itself' : c.started ? 'In progress · scores itself' : 'Not started · scores itself') + '</p>';
    }
    if (it.type !== 'auto') h += '<label class="nv-score-entry"><span>Score (0–' + it.max + ', halves allowed)</span><input type="number" class="nv-input nv-score-box" data-email="' + e + '" min="0" max="' + it.max + '" step="0.5" value="' + (score === null || score === undefined ? '' : score) + '"></label>';
    if (c.redo) h += '<button type="button" class="nv-btn small" data-act="markKeep" data-email="' + e + '">Keep ' + c.score + '/' + it.max + '</button>';
    h += '<label class="nv-check nv-exclude"><input type="checkbox" class="nv-ex-box" data-email="' + e + '"' + (c.studentExcluded ? ' checked' : '') + '><span>Exclude from grade</span></label>';
    h += '<label class="nv-field"><span>Optional feedback comment for the student</span><textarea class="nv-input nv-comment" rows="3" maxlength="6000" data-email="' + e + '" data-ctx="' + esc(ctx) + '">' + esc(g.comment || '') + '</textarea></label><span class="nv-mstate" id="ms_' + e.replace(/[^a-z0-9]/gi, '_') + '" aria-live="polite"></span>';
    return h + '</div>';
  }
  function rowHtml(r) {
    return '<article class="nv-mrow" data-email="' + esc(r.email) + '"><header class="nv-mrow-head"><h3>' + esc(r.name) + '</h3><div class="nv-mbadges">' + badges(r) + '</div>' +
      '<button type="button" class="nv-btn small ghost nv-focus-btn" data-act="markFocus" data-email="' + esc(r.email) + '" title="Open this student’s work full-screen beside the rubric">⤢ Focused grading</button></header>' +
      '<div class="nv-mrow-work">' + workHtml(r) + (r.submittedAt ? '<div class="nv-small nv-muted">Turned in ' + esc(NV.fmtDate(r.submittedAt, true)) + '</div>' : '') + '</div>' + panelHtml(r) + '</article>';
  }
  function rowOf(email) { return M.data.rows.filter(function (r) { return r.email === email; })[0]; }
  function refreshRow(email) {
    var r = rowOf(email), el = document.querySelector('.nv-mrow[data-email="' + cssEsc(email) + '"]'); if (!r || !el) return;
    // Repaint the badges and the band buttons only; the comment box keeps whatever is being typed.
    el.querySelector('.nv-mbadges').innerHTML = badges(r);
    var it = M.data.item, s = r.cell.score;
    el.querySelectorAll('.nv-band').forEach(function (b) { var on = s !== null && s !== undefined && (it.type === 'rubric' ? Math.round(s) === Number(b.dataset.score) : Number(s) === Number(b.dataset.score)); b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', on); });
    var box = el.querySelector('.nv-score-box'); if (box && document.activeElement !== box) box.value = s === null || s === undefined ? '' : s;
    var ex = el.querySelector('.nv-ex-box'); if (ex) ex.checked = !!r.cell.studentExcluded;
    var keep = el.querySelector('[data-act="markKeep"]'); if (keep && !r.cell.redo) keep.remove();
    updateFocusCount();
  }
  /** Mirrors the server's nvCellState_ (Grading.js) after a mark changes, so a live move and a fresh load agree. */
  function settle(r) {
    var c = r.cell, it = M.data.item;
    c.excluded = !!c.studentExcluded || !!c.classExcluded;
    if (it.kind === 'quiz') { c.handled = c.excluded || c.submitted; c.toGrade = false; c.redo = false; return; }
    var scored = c.score !== null && c.score !== undefined, mfp = (r.grade || {}).markedFp;
    c.handled = scored || c.excluded;
    c.redo = scored && !c.excluded && c.submitted && !!mfp && mfp !== c.fp;
    c.toGrade = !c.excluded && ((c.submitted && !scored) || c.redo);
  }
  // A scored student moves to Graded at once (Jaben, 2026-10-19); excluded → Excluded; cleared →
  // back where a fresh load would put them, in the same order a fresh load gives (M.data.rows).
  // Only a row that is out of place is moved: re-inserting one that is already in position
  // swallows the next click in it. While a pointer is down nothing moves (a score box's change
  // fires on mousedown elsewhere); the move waits until that click has landed.
  var PLACE = {}, pointerIsDown = false;
  document.addEventListener('pointerdown', function () { pointerIsDown = true; }, true);
  function pointerDone() { if (!pointerIsDown) return; pointerIsDown = false; setTimeout(placeWaiting, 0); }
  document.addEventListener('pointerup', pointerDone, true);
  document.addEventListener('pointercancel', pointerDone, true);
  window.addEventListener('blur', pointerDone);
  document.addEventListener('click', function () { setTimeout(placeWaiting, 0); }, true);
  function placeWaiting() { if (pointerIsDown) return; var k = Object.keys(PLACE); PLACE = {}; k.forEach(place); }
  function placeSoon(email) { if (pointerIsDown) PLACE[email] = true; else place(email); }
  function place(email) {
    if (NV.state.view !== 'marking' || !M.data) return;
    var r = rowOf(email); if (!r) return;
    r.group = groupOf(r);
    var inFocus = M.focus && M.focus.email === email;
    var el = inFocus ? M.focus.placeholder : document.querySelector('#nvMGroups .nv-mrow[data-email="' + cssEsc(email) + '"]');
    var list = document.querySelector('#nvMGroups .nv-mgroup[data-group="' + r.group + '"] .nv-mgroup-list');
    if (!el || !list) return;
    var idx = M.data.rows.indexOf(r), before = null;
    for (var n = list.firstChild; n; n = n.nextSibling) {
      if (n === el) continue;
      var em = n === (M.focus && M.focus.placeholder) ? M.focus.email : (n.nodeType === 1 && n.classList.contains('nv-mrow') ? n.dataset.email : null);
      if (em === null) continue;
      if (M.data.rows.indexOf(rowOf(em)) > idx) { before = n; break; }
    }
    var next = el.nextSibling; while (next && next !== before && !(next.nodeType === 1 && next.classList.contains('nv-mrow')) && next !== (M.focus && M.focus.placeholder)) next = next.nextSibling;
    if (el.parentNode !== list || (next || null) !== before) {
      var active = document.activeElement, hadFocus = !inFocus && active && el.contains(active);
      list.insertBefore(el, before);
      if (hadFocus && document.activeElement !== active) try { active.focus({ preventScroll: true }); } catch (e) {}
    }
    refreshGroupCounts();
  }
  function refreshGroupCounts() {
    GROUPS.forEach(function (g) {
      var sec = document.querySelector('#nvMGroups .nv-mgroup[data-group="' + g.k + '"]'); if (!sec) return;
      var n = M.data.rows.filter(function (r) { return r.group === g.k; }).length;
      sec.querySelector('.nv-mgroup-count').textContent = n;
      if (g.hideEmpty) sec.hidden = !n;
      var empty = sec.querySelector(':scope > .nv-mgroup-empty'); if (empty) empty.hidden = !!n;
    });
  }
  function msState(email, text, kind) { var el = NV.byId('ms_' + email.replace(/[^a-z0-9]/gi, '_')); if (el) { el.textContent = text; el.className = 'nv-mstate' + (kind ? ' is-' + kind : ''); } }

  // ---------------------------------------------------------------- saving marks
  // One queue per student: saves run in order; while one is on its way, newer marks replace the
  // waiting one (the last action wins). Comments travel the same queue, with compare-and-swap.
  var Q = {};
  /** Shows a mark on the page before the server confirms it (same fields the save will write). */
  function markLocally(r, patch) {
    if (patch.score !== undefined && M.data.item.kind !== 'quiz') { r.cell.score = patch.score; r.grade = r.grade || {}; r.grade.markedFp = r.viewFp; }
    if (patch.excluded !== undefined) r.cell.studentExcluded = patch.excluded;
  }
  /** A score or exclusion: show it, move the row to its group, then save. */
  function mark(email, patch) {
    var r = rowOf(email); if (!r) return;
    markLocally(r, patch); settle(r); refreshRow(email); placeSoon(email);
    return enqueue(email, patch);
  }
  function enqueue(email, patch) {
    var q = Q[email] = Q[email] || { busy: false, next: null };
    q.next = Object.assign(q.next || {}, patch);
    if (!q.busy) pump(email);
    return q;
  }
  function pump(email) {
    var q = Q[email]; if (!q || q.busy || !q.next) return;
    var patch = q.next; q.next = null; q.busy = true;
    var r = rowOf(email), it = M.data.item;
    var payload = Object.assign({ classId: cid(), itemKey: it.key, email: email }, patch);
    if (patch.score !== undefined) payload.markedFp = r ? r.viewFp : '';
    msState(email, 'Saving…');
    NV.rpc('saveGrade', payload, { retry: true }).then(function (res) {
      q.busy = false;
      if (res && res.conflict) {
        failed(email, patch, 'Someone else changed this comment (another tab or a co-teacher). It now says: “' + (res.current || '(empty)').slice(0, 120) + '”. Retry saves yours over it.', res.current);
        msState(email, 'Didn’t save', 'error');
      } else {
        var g = res.grade; r.grade = Object.assign(r.grade || {}, g);
        if (M.data.item.kind !== 'quiz') r.cell.score = g.score;   // the quiz's score is its own, not the grade row's
        r.cell.studentExcluded = g.excluded;
        // A mark still waiting in the queue is newer than this answer: keep showing it (last action wins).
        if (q.next) markLocally(r, q.next);
        settle(r);
        if (patch.comment !== undefined) { r.confirmedComment = g.comment; if (localCommentMatches(email, g.comment)) NV.store.del(lcKey(email)); }
        refreshRow(email); placeSoon(email); msState(email, 'Saved', 'ok'); clearFailed(email);
      }
      pump(email);
    }).catch(function (e) {
      q.busy = false; failed(email, patch, e.message); msState(email, 'Didn’t save', 'error'); pump(email);
    });
  }
  NV.flushMarks = function () {
    flushComments();
    return new Promise(function (resolve) {
      var t0 = Date.now();
      (function wait() { var busy = Object.keys(Q).some(function (k) { return Q[k].busy || Q[k].next; }); if (!busy || Date.now() - t0 > 30000) resolve(); else setTimeout(wait, 200); })();
    });
  };
  A.markBand = function (el) {
    var email = el.dataset.email, r = rowOf(email), s = Number(el.dataset.score);
    var cur = r.cell.score, isOn = cur !== null && cur !== undefined && (M.data.item.type === 'rubric' ? Math.round(cur) === s : Number(cur) === s);
    var next = isOn ? null : s;   // clicking the selected band again clears it
    mark(email, { score: next });
  };
  A.markKeep = function (el) { var email = el.dataset.email, r = rowOf(email); mark(email, { score: r.cell.score }); };
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.classList.contains('nv-score-box') && NV.state.view === 'marking') {
      var email = t.dataset.email, v = t.value.trim(), it = M.data.item;
      if (v === '') return mark(email, { score: null });
      var n = Number(v);
      if (!isFinite(n) || n < 0 || n > it.max || Math.round(n * 2) !== n * 2) { NV.toast('Scores go from 0 to ' + it.max + ' (halves allowed).', 'error'); t.value = rowOf(email).cell.score == null ? '' : rowOf(email).cell.score; return; }
      mark(email, { score: n });
    }
    if (t.classList.contains('nv-ex-box') && NV.state.view === 'marking') mark(t.dataset.email, { excluded: t.checked });
  });

  // ---------------------------------------------------------------- comments
  function lcKey(email) { return 'nvgc|' + cid() + '|' + M.data.item.key + '|' + email; }
  function localCommentMatches(email, text) { var x = NV.store.get(lcKey(email), null); return !x || x.text === text; }
  var CT = {};
  function queueComment(box, now) {
    // The comment is filed under the step it was typed on (its own data-ctx), never "whatever is on screen".
    var parts = String(box.dataset.ctx).split('::'); if (parts[0] !== cid() || parts[1] !== M.data.item.key) return;
    var email = parts.slice(2).join('::'), r = rowOf(email); if (!r) return;
    var text = box.value;
    NV.store.set(lcKey(email), { text: text, prev: r.confirmedComment !== undefined ? r.confirmedComment : ((r.grade || {}).comment || ''), at: Date.now() });
    clearTimeout(CT[email]);
    var send = function () { var prev = r.confirmedComment !== undefined ? r.confirmedComment : ((r.grade || {}).comment || ''); if (text === prev) { NV.store.del(lcKey(email)); return; } enqueue(email, { comment: text, prevComment: prev }); };
    if (now) send(); else { msState(email, 'Saving soon…'); CT[email] = setTimeout(send, 2500); }
  }
  function flushComments() { document.querySelectorAll('.nv-comment').forEach(function (b) { var em = b.dataset.email; if (CT[em]) { clearTimeout(CT[em]); CT[em] = null; queueComment(b, true); } }); }
  document.addEventListener('input', function (e) { if (e.target.classList && e.target.classList.contains('nv-comment') && NV.state.view === 'marking') queueComment(e.target, false); });
  document.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('nv-comment') && NV.state.view === 'marking' && CT[e.target.dataset.email]) { clearTimeout(CT[e.target.dataset.email]); queueComment(e.target, true); } });
  /** After a reload: comments that never reached the server are put back and saved. */
  function restoreLocalComments() {
    NV.store.keys('nvgc|' + cid() + '|' + M.data.item.key + '|').forEach(function (k) {
      var x = NV.store.get(k, null), email = k.split('|').slice(3).join('|'), r = rowOf(email); if (!x || !r) return;
      var cur = (r.grade || {}).comment || '';
      if (x.text === cur) { NV.store.del(k); return; }
      var box = document.querySelector('.nv-comment[data-email="' + cssEsc(email) + '"]'); if (!box) return;
      box.value = x.text; r.confirmedComment = x.prev; msState(email, 'Unsaved comment put back. Saving…', 'warn');
      enqueue(email, { comment: x.text, prevComment: x.prev });
    });
  }

  // ---------------------------------------------------------------- "Didn't save" list
  var FAILED = {};
  function failed(email, patch, why, current) {
    var r = rowOf(email); FAILED[email] = { patch: patch, why: why, name: r ? r.name : email, current: current, key: M.data.item.key };
    drawFailed();
  }
  function clearFailed(email) { if (FAILED[email] && FAILED[email].key === M.data.item.key) { delete FAILED[email]; drawFailed(); } }
  function drawFailed() {
    var box = NV.byId('nvDidntSave'), keys = Object.keys(FAILED);
    box.hidden = !keys.length;
    box.innerHTML = keys.length ? '<h3>Didn’t save</h3><ul>' + keys.map(function (k) { var f = FAILED[k]; return '<li><b>' + esc(f.name) + '</b>: ' + esc(f.why) + '<div class="nv-row"><button type="button" class="nv-btn small primary" data-act="failRetry" data-email="' + esc(k) + '">Retry</button><button type="button" class="nv-btn small ghost" data-act="failDismiss" data-email="' + esc(k) + '">Dismiss</button></div></li>'; }).join('') + '</ul>' : '';
  }
  A.failRetry = function (el) {
    var f = FAILED[el.dataset.email]; if (!f) return; delete FAILED[el.dataset.email]; drawFailed();
    var p = Object.assign({}, f.patch); if (p.comment !== undefined && f.current !== undefined) p.prevComment = f.current;
    enqueue(el.dataset.email, p);
  };
  A.failDismiss = function (el) { delete FAILED[el.dataset.email]; drawFailed(); };

  // ---------------------------------------------------------------- navigation
  A.markBack = function () { closeFocus(); NV.flushMarks().then(function () { NV.go('dashboard'); }); };
  A.markRefresh = function () { NV.flushMarks().then(function () { load(NV.byId('app'), ''); }); };
  A.markTab = function (el) { NV.flushMarks().then(function () { closeFocus(); NV.state.itemKey = el.dataset.key; NV.state.focusEmail = ''; NV.render(); }); };
  A.markNoGrade = function (el) {
    var on = el.dataset.on === 'true';
    if (on && !confirm('Leave this out of every student’s grade in this class? Scores you already entered are kept.')) return;
    NV.rpc('setNoGrade', { classId: cid(), itemKey: M.data.item.key, on: on }, { retry: true }).then(function () { load(NV.byId('app'), ''); }).catch(function (e) { NV.toast(e.message, 'error'); });
  };

  // ---------------------------------------------------------------- ⤢ Focused grading
  // The student's row is moved (not copied) into the overlay, so typing and saves carry on unchanged.
  function markable(r) { return r.group === 'ready' || r.group === 'redo'; }
  function stillToMark(r) { return r.cell.toGrade || r.cell.redo; }
  function updateFocusCount() {
    var el = NV.byId('nvFocusLeft'); if (!el) return;
    var n = M.data.rows.filter(function (r) { return markable(r) && stillToMark(r); }).length;
    el.textContent = n + ' left to mark';
  }
  A.markFocus = function (el) { openFocus(el.dataset.email); };
  function openFocus(email) {
    closeFocus();
    var row = document.querySelector('.nv-mrow[data-email="' + cssEsc(email) + '"]'), ov = NV.byId('nvFocus'); if (!row || !ov) return;
    M.focus = { email: email, placeholder: document.createComment('focus') };
    row.parentNode.insertBefore(M.focus.placeholder, row);
    ov.innerHTML = '<div class="nv-focus-bar"><button type="button" class="nv-btn small" data-act="focusPrev">← Back</button><span class="nv-focus-title">' + esc(M.data.item.label) + '</span><span class="nv-focus-left" id="nvFocusLeft"></span><button type="button" class="nv-btn small primary" data-act="focusNext">Next to mark →</button><button type="button" class="nv-btn small ghost" data-act="focusClose">✕ Close focus</button></div><div class="nv-focus-body" id="nvFocusBody"></div>';
    NV.byId('nvFocusBody').appendChild(row); ov.hidden = false; document.body.classList.add('nv-focus-grading');
    M.focus.history = M.focus.history || [];
    updateFocusCount();
    var c = row.querySelector('.nv-band, .nv-ex-box'); if (c) c.focus();
  }
  function closeFocus() {
    if (!M.focus) return;
    var row = document.querySelector('#nvFocusBody .nv-mrow'), ph = M.focus.placeholder;
    if (row && ph && ph.parentNode) ph.parentNode.replaceChild(row, ph);
    var ov = NV.byId('nvFocus'); if (ov) { ov.hidden = true; ov.innerHTML = ''; }
    document.body.classList.remove('nv-focus-grading'); M.focus = null;
  }
  var focusTrail = [];
  A.focusClose = function () { closeFocus(); };
  A.focusNext = function () {
    if (!M.focus) return;
    var order = M.data.rows.filter(function (r) { return !(M.hideNot && r.group === 'none'); });
    var cur = M.focus.email, idx = order.findIndex(function (r) { return r.email === cur; });
    for (var i = 1; i <= order.length; i++) {
      var r = order[(idx + i) % order.length];
      if (r.email !== cur && markable(r) && stillToMark(r)) { focusTrail.push(cur); return openFocus(r.email); }
    }
    NV.toast('Nothing left to mark here.');
  };
  A.focusPrev = function () { var p = focusTrail.pop(); if (p) openFocus(p); else NV.toast('This is the first one you opened.'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && M.focus && NV.byId('nvModal').hidden) closeFocus(); });

  // Leaving the marking screen by any route saves the marks first.
  var _leave = NV.leave;
  NV.leave = function (fn) {
    if (NV.state.view === 'marking') { closeFocus(); return NV.flushMarks().then(function () { _leave(fn); }); }
    return _leave(fn);
  };
  window.addEventListener('beforeunload', function (e) {
    if (NV.state.view !== 'marking') return;
    var pending = Object.keys(Q).some(function (k) { return Q[k].busy || Q[k].next; }) || Object.keys(CT).some(function (k) { return CT[k]; });
    if (pending) { flushComments(); e.preventDefault(); e.returnValue = ''; return ''; }
  });

  window.__MB.Marking = 'ok';
})();
</script>
