<script>
// ============================================================================
// Teacher guide for each unit (week / arc / day) + the Common Core standards button.
//   * NV.std    -- which CCSS ELA standards an activity, a unit and the whole study practice
//                  (grade from builder step 2, activity types, the study's focus areas).
//   * NV.G.plan -- the timed session plan, worked out from how the teacher teaches (mode, class
//                  length, sessions per unit, where students read) and the unit's activities.
//   * view "guide" -- one unit at a time: at a glance, session plan, book notes (AI, editable),
//                  standards, ideas to add, how to run each activity in this mode. Printable.
//   * NV.G.standardsModal -- the 🎯 Standards button (dashboard, builder, guide).
// Teacher-only. The look is in NovelTheme.
// ============================================================================
(function () {
  var G = NV.G = { data: null, classId: '', n: 0, edit: false, dirty: false, busy: false, run: null, msg: '', teachOpen: false };
  var A = NV.act = NV.act || {};
  function esc(s) { return NV.esc(s); }
  function cid() { return (NV.T && NV.T.classId) || G.classId; }

  // ---------------------------------------------------------------- standards
  var STRAND_ORDER = { RL: 1, W: 2, SL: 3, L: 4 };
  NV.std = {
    full: function (std, short) { var m = /^([A-Z]+)\.(\d+)$/.exec(short); return m ? m[1] + '.' + std.band + '.' + m[2] : short; },
    sort: function (codes) {
      return codes.slice().sort(function (a, b) {
        var x = /^([A-Z]+)\.[^.]+\.(\d+)/.exec(a) || [], y = /^([A-Z]+)\.[^.]+\.(\d+)/.exec(b) || [];
        return ((STRAND_ORDER[x[1]] || 9) - (STRAND_ORDER[y[1]] || 9)) || (Number(x[2]) - Number(y[2])) || (a < b ? -1 : 1);
      });
    },
    strandOf: function (code) { var m = /^([A-Z]+)\./.exec(code); return m ? m[1] : ''; },
    /** One activity: its type's standards, plus the focus areas' reading standards for the activities that
     *  analyze, plus any codes the AI attached that exist at this grade. */
    forAct: function (std, a, focus) {
      if (!std) return [];
      var out = [], seen = {};
      function add(c) { if (!seen[c] && std.statements[c]) { seen[c] = true; out.push(c); } }
      ((std.byActivity || {})[a.type] || []).forEach(function (s) { add(NV.std.full(std, s)); });
      if ((std.focusActs || []).indexOf(a.type) >= 0) (focus || []).forEach(function (f) { ((std.byFocus || {})[f] || []).forEach(function (s) { add(NV.std.full(std, s)); }); });
      (a.standards || []).forEach(function (c) { add(String(c).trim()); });
      return NV.std.sort(out);
    },
    forUnit: function (std, u, focus) {
      var acts = (u.activities || []).map(function (a) { return { a: a, codes: NV.std.forAct(std, a, focus) }; });
      var read = NV.std.forAct(std, { type: 'read' }, focus), all = {};
      read.concat.apply(read, acts.map(function (x) { return x.codes; })).forEach(function (c) { all[c] = true; });
      return { read: read, acts: acts, all: NV.std.sort(Object.keys(all)) };
    },
    /** code -> [{n, label, what}] across every unit of the study. */
    forStudy: function (std, study) {
      var map = {};
      (study.units || []).forEach(function (u) {
        if (!(u.reading && u.reading.label) && !(u.activities || []).length) return;
        var r = NV.std.forUnit(std, u, study.focusAreas);
        function note(c, what) { (map[c] = map[c] || []).push({ n: u.n, label: u.label || ((study.unitWord || 'Week') + ' ' + u.n), what: what }); }
        r.read.forEach(function (c) { note(c, 'Reading'); });
        r.acts.forEach(function (x) { x.codes.forEach(function (c) { note(c, x.a.title || x.a.type); }); });
      });
      return map;
    },
    chips: function (codes, std) {
      return codes.map(function (c) { return '<span class="nv-std-chip" title="' + esc(std.statements[c] || '') + '">' + esc(c) + '</span>'; }).join('');
    }
  };
  /** Which activity would add a standard nobody practices yet. */
  var ADDS = { 'SL.1': 'discussion', 'SL.4': 'discussion', 'SL.5': 'creative', 'W.1': 'analysis', 'W.2': 'analysis', 'W.3': 'creative', 'W.4': 'analysis', 'W.9': 'evidence', 'W.10': 'reflection',
    'L.4': 'vocabulary', 'L.5': 'vocabulary', 'L.6': 'vocabulary', 'RL.4': 'close_reading', 'RL.5': 'close_reading', 'RL.1': 'evidence', 'RL.2': 'reflection', 'RL.3': 'quiz' };
  var ADD_HOW = { 'RL.6': 'Pick “Point of View” as a focus area (step 3): written responses and discussions then work on it.', 'RL.7': 'Pair the book with a film clip, painting or audio version and compare what each one stresses.',
    'RL.9': 'Pair a reading with a source or historical text (the AI notes suggest companions), or pick “Historical / Social Context” as a focus area.', 'SL.4': 'Have students present a claim to the class (a short talk or a recorded video).', 'W.2': 'Ask for an explanatory piece: how the author builds an idea, in a Written Response.' };

  function actLabel(type) { var L = (((G.data || {}).choices || (NV.T && NV.T.dash && NV.T.dash.choices) || {}).activities || {})[type]; return L ? L.icon + ' ' + L.label : type; }

  /** The 🎯 Standards button: one unit (n) or the whole study. */
  G.standardsModal = function (study, std, n) {
    if (!std || !study) return;
    var word = study.unitWord || 'Week', units = study.units || [];
    function body(sel) {
      var h = '<div class="nv-std-head"><div><h2 id="nvModalTitle">🎯 Common Core standards</h2><p class="nv-muted">' + esc(std.bandLabel) + (std.gradeChosen ? '' : ' (no grade chosen yet: set it in builder step 2, “The book”)') + ' · Reading: Literature, Writing, Speaking &amp; Listening, Language. They follow the grade and the activities in each ' + esc(word.toLowerCase()) + '.</p></div></div>';
      h += '<div class="nv-std-pick" role="tablist"><button type="button" class="nv-chip-btn' + (!sel ? ' is-on' : '') + '" data-std-n="0">Whole study</button>' + units.map(function (u) { return '<button type="button" class="nv-chip-btn' + (sel === u.n ? ' is-on' : '') + '" data-std-n="' + u.n + '">' + esc(word + ' ' + u.n) + '</button>'; }).join('') + '</div>';
      if (sel) {
        var u = units[sel - 1]; if (!u) return h;
        var r = NV.std.forUnit(std, u, study.focusAreas);
        h += '<p class="nv-small"><b>' + esc(word + ' ' + sel) + (u.title ? ' · ' + esc(u.title) : '') + '</b>' + (u.reading && u.reading.label ? ' · ' + esc(u.reading.label) : '') + '</p>';
        h += '<div class="nv-std-acts">' + [{ a: { title: 'The reading', type: 'read' }, codes: r.read }].concat(r.acts).map(function (x) {
          return '<div class="nv-std-act"><b>' + (x.a.type === 'read' ? '📖 The reading' : esc(actLabel(x.a.type).split(' ')[0] + ' ' + (x.a.title || x.a.type))) + (x.a.graded === false ? ' <small class="nv-muted">practice</small>' : '') + '</b><div>' + (x.codes.length ? NV.std.chips(x.codes, std) : '<span class="nv-muted nv-small">—</span>') + '</div></div>';
        }).join('') + '</div>';
        h += listHtml(r.all.map(function (c) { return { code: c, where: [] }; }));
        h += '<div class="nv-row"><button type="button" class="nv-btn small" data-std-copy="' + sel + '">Copy for a lesson plan</button></div>';
      } else {
        var map = NV.std.forStudy(std, study), covered = NV.std.sort(Object.keys(map));
        if (!covered.length) h += '<p class="nv-empty">Nothing planned yet. Readings and activities you add in the builder show up here.</p>';
        h += listHtml(covered.map(function (c) { return { code: c, where: map[c] }; }));
        var missing = NV.std.sort(Object.keys(std.statements).filter(function (c) { return !map[c]; }));
        if (missing.length) h += '<details class="nv-std-missing"><summary>Not practiced yet: ' + missing.length + '</summary><ul>' + missing.map(function (c) {
          var short = c.replace('.' + std.band + '.', '.'), add = ADDS[short], how = ADD_HOW[short] || (add ? 'Add a ' + actLabel(add) + ' to a ' + word.toLowerCase() + '.' : '');
          return '<li><b>' + esc(c) + '</b> ' + esc(std.statements[c]) + (how ? '<br><span class="nv-std-how">→ ' + esc(how) + '</span>' : '') + '</li>';
        }).join('') + '</ul></details>';
        h += '<div class="nv-row"><button type="button" class="nv-btn small" data-std-copy="0">Copy the whole list</button></div>';
      }
      h += '<p class="nv-std-credit">' + esc(std.credit) + '</p><div class="nv-row"><button type="button" class="nv-btn" onclick="NV.closeModal()">Close</button></div>';
      return h;
    }
    function listHtml(rows) {
      return NV_STD_STRANDS(std).map(function (s) {
        var mine = rows.filter(function (r) { return NV.std.strandOf(r.code) === s.key; }); if (!mine.length) return '';
        return '<h3 class="nv-std-strand">' + esc(s.label) + '</h3><ul class="nv-std-list">' + mine.map(function (r) {
          var where = (r.where || []), byUnit = {};
          where.forEach(function (w) { (byUnit[w.n] = byUnit[w.n] || []).push(w.what); });
          return '<li><span class="nv-std-code">' + esc(r.code) + '</span><span class="nv-std-text">' + esc(std.statements[r.code] || '') +
            (where.length ? '<span class="nv-std-where">' + Object.keys(byUnit).map(function (k) { return esc(word + ' ' + k); }).join(' · ') + '</span>' : '') + '</span></li>';
        }).join('') + '</ul>';
      }).join('');
    }
    function copyText(sel) {
      var lines = [std.bandLabel + ' — Common Core ELA'];
      var codes = sel ? NV.std.forUnit(std, units[sel - 1], study.focusAreas).all : NV.std.sort(Object.keys(NV.std.forStudy(std, study)));
      if (sel) lines[0] = word + ' ' + sel + (units[sel - 1].title ? ': ' + units[sel - 1].title : '') + ' — ' + lines[0];
      codes.forEach(function (c) { lines.push(c + '  ' + std.statements[c]); });
      return lines.join('\n');
    }
    function paint(sel) {
      NV.modal('<div class="nv-std">' + body(sel) + '</div>');
      var card = document.querySelector('#nvModal .nv-modal-card'); if (card) card.classList.add('is-wide');
      document.querySelectorAll('[data-std-n]').forEach(function (b) { b.onclick = function () { paint(Number(b.dataset.stdN)); }; });
      document.querySelectorAll('[data-std-copy]').forEach(function (b) {
        b.onclick = function () {
          var t = copyText(Number(b.dataset.stdCopy));
          try { navigator.clipboard.writeText(t).then(function () { NV.toast('Copied.'); }, function () { fallback(t); }); } catch (e) { fallback(t); }
        };
      });
    }
    function fallback(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); NV.toast('Copied.'); } catch (e) { NV.toast('Select the text and copy it yourself.'); } ta.remove(); }
    paint(n || 0);
  };
  function NV_STD_STRANDS(std) { return std.strands || [{ key: 'RL', label: 'Reading: Literature' }, { key: 'W', label: 'Writing' }, { key: 'SL', label: 'Speaking & Listening' }, { key: 'L', label: 'Language' }]; }
  // The modal card shrinks back for every other modal.
  var _modal = NV.modal; NV.modal = function (html, opts) { var c = document.querySelector('#nvModal .nv-modal-card'); if (c) c.classList.remove('is-wide'); return _modal(html, opts); };

  // ---------------------------------------------------------------- how each activity runs, by mode
  // Content as data: edit the wording here.
  var TIPS = {
    launch: { inperson: 'Put the essential question on the board. Students write a two-minute first answer they will come back to at the end.', live: 'Post the essential question in the chat and do a “waterfall”: everyone types an answer and sends it at the same moment.', async: 'Post a short note or video that opens the unit: the essential question, what to read, and what is due when.', hybrid: 'Show the essential question on screen for both groups; everyone answers in the chat so remote and in-room answers sit together.' },
    read: { inperson: 'Quiet reading with Sora open (or books out). Read the first page aloud to set the voice, then circulate. The reading tracker on the dashboard shows who is behind.', live: 'Play the audiobook for the first few minutes, then quiet reading with a timer on screen, cameras optional. Students tick the Read step when they reach the stop.', async: 'Give a day to finish the reading by. Students tick “done” or “partway” in the Read step, so the dashboard shows who needs a nudge.', hybrid: 'One timer for both groups. Remote students can use the audiobook; the room reads silently.' },
    bellringer: { inperson: 'Up on the board as students walk in. Five minutes, then two volunteers share.', live: 'Post it as class opens; students answer in the app while you take attendance.', async: 'The first thing in each day’s work. A quick look tells you who started.', hybrid: 'Everyone answers in the app, so in-room and remote answers are in one place.' },
    evidence: { inperson: 'Model one highlight with the class color key on the board, then students turn their highlights into evidence cards.', live: 'Share your screen in Sora, highlight one line together, then show “Make cards” from Sora’s copied notes.', async: 'Post a two-minute screen recording: one highlight turned into an evidence card.', hybrid: 'Model it once on the shared screen for both groups.' },
    quiz: { inperson: 'Closed book, once the reading is finished. It scores itself: open its tile to see which questions most students missed and reteach those.', live: 'Give a fixed window during class. Treat it as a reading check, not a test.', async: 'Open it once the reading should be done. Review the most-missed questions at the next check-in.', hybrid: 'Everyone takes it in the app at the same time.' },
    close_reading: { inperson: 'Model with a different passage first (I do, we do, you do). Then pairs choose their own passage.', live: 'Model on a shared screen, then pairs in breakout rooms choose a passage; bring each pair back to share one author’s choice.', async: 'Post a short model analysis of a different passage; students follow the same steps.', hybrid: 'Put remote students in a breakout room together; pairs in the room work side by side.' },
    analysis: { inperson: 'Plan first (a claim plus two pieces of evidence with locations). Conference with a few students while the rest draft.', live: 'Plan together, then quiet drafting with cameras optional. Keep one breakout room open as a help room.', async: 'Set a plan-by day and a turn-in day; comment on plans before students draft.', hybrid: 'Same timer for both groups; conference with remote students in a breakout while the room drafts.' },
    vocabulary: { inperson: 'Introduce two or three words before the reading; students find the rest in context.', live: 'Quick poll on what a word might mean before reading; check it after.', async: 'Words first, then the reading; students come back to the meanings once they have met them.', hybrid: 'Same poll for both groups, in the app or the chat.' },
    discussion: { inperson: 'Socratic seminar or fishbowl: the inner circle talks, the outer circle tracks evidence, then swap. Students post in the app afterwards.', live: 'Breakout rooms of three or four, one question each; each room posts a summary and replies to another room.', async: 'Set a post-by day and a reply-by day. Post the first reply yourself to show what a good one looks like.', hybrid: 'Fishbowl in the room, a second circle in a breakout for remote students. Everyone posts in the app so the groups hear each other.' },
    creative: { inperson: 'Show one example you made and a short checklist: it still needs evidence from the book.', live: 'Students share screens in breakout rooms to show work in progress.', async: 'Give a checkpoint day to show a first draft.', hybrid: 'Gallery walk in the room plus a shared slide deck for remote students.' },
    reflection: { inperson: 'Back to the essential question: students compare their answer now with the one they wrote at the launch.', live: 'Two minutes of quiet writing, then three students read one line aloud.', async: 'Last task of the unit; read a few and open the next unit with one of them.', hybrid: 'Everyone writes in the app; read one in-room and one remote answer aloud.' }
  };
  var CHECK = {
    read: 'Who hasn’t started? (dashboard tracker)', bellringer: 'Who wrote one line vs. a real answer?', evidence: 'Are the cards evidence, or summary?', quiz: 'Which question did most students miss?',
    close_reading: 'Do they name a specific choice, or just say it’s “descriptive”?', analysis: 'Claim first? Evidence with a location?', vocabulary: 'Meaning in THIS sentence, not the dictionary’s first line?',
    discussion: 'Are they answering each other, or only you?', creative: 'Is the evidence still there?', reflection: 'Did their thinking change, and do they say why?'
  };

  // ---------------------------------------------------------------- the timed plan
  var MIN = { bellringer: 7, evidence: 10, close_reading: 25, vocabulary: 15, discussion: 30, creative: 40, reflection: 12 };
  function actMin(a) {
    if (a.type === 'quiz') return Math.max(6, Math.round(((a.mc || []).length || a.count || 6) * 1.5) + 2);
    if (a.type === 'analysis') return 45;
    return MIN[a.type] || 20;
  }
  /** Session-by-session plan. t = study.teaching; sessions = this unit's class sessions. Pure: no DOM. */
  G.plan = function (u, t, sessions, word) {
    t = t || {}; var mode = t.mode || 'inperson', sync = mode !== 'async', M = Number(t.minutes) || 50, S = Math.max(1, Number(sessions) || 1);
    var open = sync ? 5 : 0, close = sync ? 4 : 0, cap = Math.max(10, M - open - close);
    var acts = u.activities || [], has = function (type) { return acts.filter(function (a) { return a.type === type; }); };
    var first = [], during = [], after = [], evid = has('evidence');
    has('bellringer').forEach(function (a) { first.push({ kind: 'bellringer', label: a.title, min: actMin(a) }); });
    first.push({ kind: 'launch', label: 'Launch: the essential question', min: u.eq ? 8 : 5 });
    has('vocabulary').forEach(function (a) { first.push({ kind: 'vocabulary', label: a.title + ' (before reading)', min: actMin(a) }); });
    has('close_reading').forEach(function (a) { during.push({ kind: 'close_reading', label: a.title, min: actMin(a) }); });
    has('quiz').forEach(function (a) { after.push({ kind: 'quiz', label: a.title, min: actMin(a) }); });
    has('discussion').forEach(function (a) { after.push({ kind: 'discussion', label: a.title, min: actMin(a) }); });
    has('analysis').forEach(function (a) { after.push({ kind: 'analysis', label: a.title + ': plan', min: 15 }); after.push({ kind: 'analysis', label: a.title + ': draft', min: 30, split: true }); });
    has('creative').forEach(function (a) { after.push({ kind: 'creative', label: a.title, min: actMin(a), split: true }); });
    acts.forEach(function (a) { if (['bellringer', 'vocabulary', 'close_reading', 'quiz', 'discussion', 'analysis', 'creative', 'reflection', 'evidence'].indexOf(a.type) < 0) after.push({ kind: a.type, label: a.title, min: actMin(a) }); });
    has('reflection').forEach(function (a) { after.push({ kind: 'reflection', label: a.title, min: actMin(a) }); });
    var fixed = first.concat(during, after).reduce(function (n, x) { return n + x.min; }, 0) + evid.reduce(function (n, a) { return n + actMin(a); }, 0);
    var room = Math.max(0, S * cap - fixed), R = t.readWhere === 'home' ? 0 : t.readWhere === 'class' ? room : Math.min(room, 20 * Math.max(1, S - 1));
    // Reading time is the flexible part: if the plan doesn't fit, read a little less in class and pack again.
    function pack(R) {
      var seq = first.slice(), base = 'Reading time' + (u.reading && u.reading.label ? ': ' + u.reading.label : '');
      var r1 = during.length ? Math.round(R / 2 / 5) * 5 : R;
      if (r1 > 0) seq.push({ kind: 'read', label: base, min: r1, split: true });
      seq = seq.concat(during);
      if (R - r1 > 0) seq.push({ kind: 'read', label: base, min: R - r1, split: true, cont: r1 > 0 });
      evid.forEach(function (a) { seq.push({ kind: 'evidence', label: a.title + ': turn highlights into cards', min: actMin(a) }); });
      seq = seq.concat(after);
      // Long work splits across a session boundary; short tasks never do.
      var out = [], cur = null;
      function next() { cur = { n: out.length + 1, blocks: [], used: 0 }; out.push(cur); }
      next();
      seq.forEach(function (task) {
        var left = task.min, part = task.cont ? 1 : 0;
        while (left > 0) {
          var space = cap - cur.used;
          if (space <= 0) { next(); continue; }
          if (task.split || task.min > cap) {
            var take = Math.min(space, left);
            if (take < 8 && left > take) { cur.blocks.push({ kind: 'flex', label: 'Flex: catch up or start the next part', min: space }); cur.used = cap; next(); continue; }
            if (task.kind === 'read' && left - take > 0 && left - take < 8) left = take;   // a few minutes of reading left over: done at home
            cur.blocks.push({ kind: task.kind, label: task.label + (part ? ' (continued)' : ''), min: take }); cur.used += take; left -= take; part++;
          } else {
            if (left <= space || !cur.blocks.length) { cur.blocks.push({ kind: task.kind, label: task.label, min: left }); cur.used += left; left = 0; }
            else {
              var prev = cur.blocks[cur.blocks.length - 1];
              if (prev && prev.kind === 'read') prev.min += space;   // more reading time instead of a gap
              else if (space >= 5) cur.blocks.push({ kind: 'flex', label: 'Flex: catch-up reading or conferences', min: space });
              cur.used = cap; next();
            }
          }
        }
      });
      return out;
    }
    R = Math.round(R / 5) * 5;
    var out = pack(R);
    while (out.length > S && R > 0) { R = Math.max(0, R - 5); out = pack(R); }
    var cur = null;
    function next() { cur = { n: out.length + 1, blocks: [], used: 0 }; out.push(cur); }
    while (out.length < S) { next(); cur.blocks.push({ kind: 'flex', label: 'Flex session: catch-up reading, conferences, finish and revise work', min: cap }); cur.used = cap; }
    var quizAt = 0; out.forEach(function (s) { if (!quizAt && s.blocks.some(function (b) { return b.kind === 'quiz' || b.kind === 'discussion'; })) quizAt = s.n; });
    var stop = u.reading && (u.reading.stopAt || u.reading.label) || 'the stopping point';
    out.forEach(function (s, i) {
      var last = i === out.length - 1;
      if (sync) {
        s.blocks.unshift({ kind: 'open', label: i === 0 ? 'Arrival: agenda and where we are in the book' : 'Arrival: reading check-in (who reached the stop?)', min: open });
        if (cap - s.used >= 3 && s.blocks[s.blocks.length - 1].kind !== 'flex') s.blocks.push({ kind: 'flex', label: 'Buffer', min: cap - s.used });
        s.blocks.push({ kind: 'close', label: last ? 'Wrap-up: back to the essential question; what comes next' : 'Exit: one line on the essential question', min: close });
      }
      if (t.readWhere !== 'class' && (!quizAt || s.n < quizAt) && !last) s.hw = sync ? 'Before next class: keep reading toward ' + stop + '.' : 'Keep reading toward ' + stop + '.';
      s.total = s.blocks.reduce(function (n, b) { return n + b.min; }, 0);
      if (!sync) {
        s.teacher = [];
        if (i === 0) s.teacher.push('Post the launch: the essential question, the reading, and what is due when.');
        if (s.blocks.some(function (b) { return b.kind === 'discussion'; })) s.teacher.push('Reply to two posts yourself; remind students of the reply-by day.');
        if (i === Math.floor(out.length / 2) && out.length > 2) s.teacher.push('Check the reading tracker on the dashboard; message anyone who hasn’t started.');
        if (last) s.teacher.push('Grade from the tiles; ↗ Push sends scores and comments to Canvas.');
      }
    });
    return { mode: mode, sync: sync, minutes: M, sessions: S, cap: cap, sessionsList: out, overflow: Math.max(0, out.length - S), fixed: fixed, reading: R, word: word || 'Week' };
  };

  // ---------------------------------------------------------------- the "how you teach" form (builder step 3 and the guide)
  G.teachForm = function (t, choices, word, structure) {
    t = t || {}; var modes = choices.teachModes || {}, rw = choices.readWhere || {}, wl = String(word || 'Week').toLowerCase();
    var daily = structure === 'daily';
    return '<div class="nv-teach" data-teach>' +
      '<div class="nv-opts is-teach" role="group" aria-label="How your class meets">' + Object.keys(modes).map(function (k) {
        var on = t.mode === k;
        return '<button type="button" class="nv-opt' + (on ? ' is-on' : '') + '" data-act="gTeachMode" data-v="' + k + '" aria-pressed="' + on + '"><b>' + modes[k].icon + ' ' + esc(modes[k].label) + '</b><span>' + esc(modes[k].note) + '</span></button>';
      }).join('') + '</div><input type="hidden" data-t="mode" value="' + esc(t.mode || '') + '">' +
      '<div class="nv-form-grid is-three"><label class="nv-field"><span>' + (t.mode === 'async' ? 'Work time a day <small>(minutes)</small>' : 'Class length <small>(minutes)</small>') + '</span><input class="nv-input" type="number" min="15" max="240" step="5" data-t="minutes" value="' + esc(t.minutes || 50) + '"></label>' +

      '<div class="nv-row"><button type="button" class="nv-btn primary" data-act="gSaveNotes">Save notes</button><button type="button" class="nv-btn ghost" data-act="gCancelEdit">Cancel</button><span class="nv-form-msg" id="gNotesMsg" role="status"></span></div></div>';
  }
  function readNotes() {
    var root = NV.byId('gNotes'); if (!root) return null;
    var v = function (k) { var el = root.querySelector('[data-g="' + k + '"]'); return el ? el.value : ''; };
    var ls = function (k) { return v(k).split('\n').map(function (x) { return x.trim(); }).filter(String); };
    return { overview: v('overview'), questions: ls('questions'), misconceptions: ls('misconceptions'), support: ls('support'), extension: ls('extension'), prep: ls('prep'), watchFor: v('watchFor'), teacherNote: v('teacherNote'),
      keyMoments: ls('keyMoments').map(function (x) { var p = x.split('|').map(function (y) { return y.trim(); }); return p.length === 1 ? { where: '', what: p[0], ask: '' } : { where: p[0] || '', what: p[1] || '', ask: p.slice(2).join(' | ') }; }),
      companions: ls('companions').map(function (x) { var p = x.split('|').map(function (y) { return y.trim(); }); return { title: p[0] || '', by: p[1] || '', type: p[2] || '', why: p.slice(3).join(' | ') }; }) };
  }
  function redrawUnit() {
    var el = NV.byId('nvGuideUnit'); if (!el) return;
    G.typing = G.edit && NV.byId('gNotes') && document.querySelector('.nv-gedit') ? readNotes() : null;   // what's being typed survives the redraw
    el.innerHTML = unitGuide(G.n, false); G.typing = null;
  }

  A.gBack = function () { NV.leave(function () { if (NV.T) NV.T.dash = null; NV.go('dashboard'); }); };
  A.gUnit = function (el) { var n = Number(el.dataset.n); NV.leave(function () { G.n = n; G.edit = false; G.msg = ''; G.msgBad = false; draw(); try { window.scrollTo(0, 0); } catch (e) {} }); };
  A.gToBuilder = function (el) { var n = Number(el.dataset.n); NV.leave(function () { if (NV.B) { NV.B.open = NV.B.open || {}; NV.B.open[n] = true; } NV.go('build', { buildStep: 5, buildOpen: n }); }); };
  A.gStandards = function () { G.standardsModal(st(), G.data.standards, 0); };
  A.gStandardsUnit = function (el) { G.standardsModal(st(), G.data.standards, Number(el.dataset.n)); };
  A.gTeachOpen = function () { G.teachOpen = true; draw(); };
  A.gTeachClose = function () { G.teachOpen = false; G.teachDirty = false; draw(); };
  A.gSaveTeach = function (el) {
    var t = G.readTeach(document.querySelector('.nv-teach-card')), m = NV.byId('gTeachMsg');
    if (!t.mode) { if (m) { m.textContent = 'Choose how your class meets.'; m.classList.add('is-error'); } return; }
    el.disabled = true; if (m) m.textContent = 'Saving…';
    NV.rpc('saveSetup', { classId: cid(), base: st().updatedAt || '', teaching: t }, { retry: true }).then(function (r) {
      G.data.study = r.study; if (r.standards) G.data.standards = r.standards; G.teachOpen = false; G.teachDirty = false; if (NV.B) NV.B.data = null; if (NV.T) NV.T.dash = null; draw(); NV.toast('Saved. The plans now follow your schedule.');
    }).catch(function (e) { el.disabled = false; if (m) { m.textContent = e.message; m.classList.add('is-error'); } });
  };
  document.addEventListener('change', function (e) {
    if (NV.state.view !== 'guide' || !e.target.classList.contains('nv-gsessions')) return;
    var k = Math.floor(Number(e.target.value)); if (!(k >= 1 && k <= 30)) { NV.toast('Between 1 and 30.'); return; }
    var n = G.n, g = guideOf(n);
    NV.rpc('saveGuide', { classId: cid(), n: n, sessions: k, base: g ? g.updatedAt : '' }, { retry: true }).then(function (r) { G.data.guides[n] = r.guide; redrawUnit(); NV.toast('Saved: ' + NV.plural(k, 'session') + ' for ' + word() + ' ' + n + '.'); })
      .catch(function (err) { NV.toast(err.message, 'error'); });
  });
  document.addEventListener('input', function (e) { if (NV.state.view === 'guide' && e.target.closest && e.target.closest('.nv-gedit')) G.dirty = true; if (NV.state.view === 'guide' && e.target.closest && e.target.closest('.nv-teach-card')) G.teachDirty = true; });
  A.gEdit = function () { G.edit = true; G.dirty = false; G.msg = ''; redrawUnit(); var f = document.querySelector('.nv-gedit textarea'); if (f) f.focus(); };
  A.gCancelEdit = function () { if (G.dirty && !confirm('Throw away the changes to these notes?')) return; G.edit = false; G.dirty = false; redrawUnit(); };
  A.gSaveNotes = function (el) {
    var n = G.n, notes = readNotes(), g = guideOf(n), m = NV.byId('gNotesMsg');
    el.disabled = true; if (m) m.textContent = 'Saving…';
    NV.rpc('saveGuide', { classId: cid(), n: n, notes: notes, base: g ? g.updatedAt : '' }, { retry: true }).then(function (r) {
      G.data.guides[n] = r.guide; G.edit = false; G.dirty = false; G.msg = 'Saved.'; G.msgBad = false; draw();
    }).catch(function (e) { el.disabled = false; if (m) { m.textContent = e.message; m.classList.add('is-error'); } });
  };
  A.gAi = function (el) {
    var n = G.n, g = guideOf(n), req = NV.byId('gReq');
    if (g && g.notes && (g.source === 'teacher' || g.source === 'ai+teacher') && !confirm('Write these notes again with AI? Your edits to ' + word() + ' ' + n + '’s notes are replaced.')) return;
    G.busy = true; el.disabled = true; el.textContent = '✨ Writing…';
    var forClass = cid();
    NV.rpc('draftGuide', { classId: forClass, n: n, request: req ? req.value : '' }, { timeoutMs: 120000 }).then(function (r) {
      G.busy = false; if (!G.data || G.classId !== forClass) return;
      G.data.guides[n] = r.guide; G.msg = ''; if (NV.state.view === 'guide' && G.n === n && !G.edit) draw();
    }).catch(function (e) { G.busy = false; if (!G.data || G.classId !== forClass) return; G.msg = e.message; G.msgBad = true; if (NV.state.view === 'guide') redrawUnit(); });
  };
  A.gAiAll = function () {
    var units = (st().units || []).filter(function (u) { return u.reading && u.reading.label && !(guideOf(u.n) || {}).notes; });
    if (!units.length) return;
    var forClass = cid(), w = word(), run = G.run = { total: units.length, done: 0, written: 0, msg: 'Starting…', stop: false, classId: forClass }; draw();
    var i = 0, fails = [];
    function paint() { if (NV.state.view === 'guide' && !G.edit && G.data && G.classId === forClass) draw(); }
    (function next() {
      if (G.run !== run) return;
      // Stops when asked, when the teacher switches class, or when everything is done.
      if (i >= units.length || run.stop || cid() !== forClass) {
        G.run = null;
        NV.toast('Book notes written for ' + NV.plural(run.written, w.toLowerCase()) + (fails.length ? '. Not done: ' + fails.join(', ') : '') + '.');
        paint(); return;
      }
      var u = units[i++]; run.msg = 'Writing ' + w + ' ' + u.n + '…'; paint();
      NV.rpc('draftGuide', { classId: forClass, n: u.n, onlyIfEmpty: true }, { timeoutMs: 120000 }).then(function (r) {
        try { if (G.data && G.classId === forClass && r.guide) G.data.guides[u.n] = r.guide; } catch (e) {}
        run.done++; if (!r.skipped) run.written++; next();
      }).catch(function (e) { fails.push(w + ' ' + u.n); run.done++; run.msg = e.message; next(); });
    })();
  };
  A.gStopAll = function () { if (G.run) { G.run.stop = true; if (G.data) draw(); } };
  A.gPrint = function () { document.body.classList.add('nv-printing'); try { window.print(); } finally { setTimeout(function () { document.body.classList.remove('nv-printing'); }, 500); } };
  A.gPrintAll = function () {
    var box = document.createElement('div'); box.className = 'nv-print-all';
    box.innerHTML = (st().units || []).map(function (u) { return unitGuide(u.n, true); }).join('');
    document.body.appendChild(box); document.body.classList.add('nv-printing-all');
    try { window.print(); } finally { setTimeout(function () { box.remove(); document.body.classList.remove('nv-printing-all'); }, 500); }
  };
  // Leaving with unsaved notes asks first.
  var _leave = NV.leave;
  NV.leave = function (fn) {
    if (NV.state.view === 'guide' && ((G.edit && G.dirty) || G.teachDirty)) {
      if (!confirm('Your changes to this guide aren’t saved. Leave anyway?')) return;
      G.edit = false; G.dirty = false; G.teachDirty = false;
    }
    _leave(fn);
  };
  window.addEventListener('beforeunload', function (e) { if (NV.state.view === 'guide' && ((G.edit && G.dirty) || G.teachDirty)) { e.preventDefault(); e.returnValue = ''; return ''; } });
  // Every other page that has a study can open these two.
  A.openGuide = function (el) { NV.openGuide(el && el.dataset.n); };
  A.openStandards = function (el) {
    var src = NV.state.view === 'build' && NV.B && NV.B.data ? NV.B.data : NV.T && NV.T.dash;
    if (!src || !src.study || !src.standards) { NV.toast('Set up the book first.'); return; }
    var study = src.study;
    if (NV.state.view === 'build' && NV.B && NV.B.drafts) { study = JSON.parse(JSON.stringify(study)); Object.keys(NV.B.drafts).forEach(function (n) { var d = NV.B.drafts[n]; if (d && study.units[n - 1]) study.units[n - 1] = Object.assign({}, study.units[n - 1], d); }); }
    G.standardsModal(study, src.standards, Number(el && el.dataset.n) || 0);
  };
  window.__MB.Guide = 'ok';
})();
</script>
