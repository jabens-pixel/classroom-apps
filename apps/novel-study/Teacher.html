<script>
// ============================================================================
// Teacher dashboard: class banner → class switcher → Grading → Gradebook → Students (folded)
// → Book, weeks & Canvas. Plus the Admin page.
// ============================================================================
(function () {
  var T = NV.T = { dash: null, loadingFor: '', gbPushStatus: '', gbPushBusy: false, busy: {}, msgs: {}, lastRedos: null, openWeeks: {}, drafts: {}, hubTimer: null };
  var A = NV.act = NV.act || {};
  function esc(s) { return NV.esc(s); }
  function cid() { return T.classId; }
  var KIND_ACC = { quiz: '#2f5d8a', evidence: '#7a5c10', analysis: '#7a2e4d', discussion: '#2f6f5e', bellringer: '#5b4a8a', close_reading: '#2c5a6e', vocabulary: '#6b4a2c', creative: '#8a3a5c', reflection: '#3d5a3a' };

  /** The class used last (remembered on the server, so any computer), then this browser's copy, then
   *  the class with the most students. */
  function pickClass() {
    var cl = NV.boot.classes || [], has = function (id) { return !!id && cl.some(function (c) { return c.classId === id; }); };
    if (has(T.classId)) return T.classId;
    var saved = NV.store.get('nvTClass_' + NV.boot.email, '');
    T.classId = has(NV.boot.lastClassId) ? NV.boot.lastClassId : has(saved) ? saved : has(NV.boot.defaultClassId) ? NV.boot.defaultClassId : ((cl[0] || {}).classId || '');
    return T.classId;
  }
  function rememberClass(id) {
    NV.store.set('nvTClass_' + NV.boot.email, id); NV.boot.lastClassId = id;
    NV.rpc('rememberTeacherClass', { classId: id }).catch(function () {});
  }
  NV.loadDash = function (cb) {
    NV.rpc('getTeacherDashboard', { classId: cid() }, { retry: true }).then(function (d) { T.dash = d; if (cb) cb(null, d); }).catch(function (e) { if (cb) cb(e); });
  };

  // ---------------------------------------------------------------- dashboard
  NV.views.dashboard = function (app) {
    clearInterval(T.hubTimer);
    if (!pickClass()) { app.innerHTML = newClassCard(true); bindNewClass(); return; }
    if (!T.dash || T.dash.klass.classId !== cid()) app.innerHTML = '<section class="nv-card nv-skeleton"><p>Opening your class…</p></section>';
    else drawDash(app);
    NV.loadDash(function (err) {
      if (NV.state.view !== 'dashboard') return;
      if (err) return NV.fail(app, err);
      drawDash(app);
      T.lastRedos = T.dash.hub ? T.dash.hub.needsRegradeTotal : 0;
      T.hubTimer = setInterval(refreshHub, 60000);
    });
  };
  function refreshHub(manual) {
    if (NV.state.view !== 'dashboard' || document.visibilityState !== 'visible' || !T.dash || !T.dash.study || !T.dash.study.book) return;
    NV.rpc('getGradingHub', { classId: cid() }).then(function (h) {
      if (!T.dash) return;
      var before = T.lastRedos || 0; T.dash.hub = h; T.lastRedos = h.needsRegradeTotal;
      if (h.needsRegradeTotal > before && !manual) NV.toast('↻ Student redo needs grading');
      // A background refresh never repaints anything the teacher is typing in.
      var tiles = NV.byId('nvHubTiles'), head = NV.byId('nvHubHead');
      if (tiles && !tiles.contains(document.activeElement) && !tiles.querySelector('details[open]')) { tiles.innerHTML = hubTilesHtml(); }
      if (head) head.innerHTML = hubHeadline();
      if (manual) NV.toast('Counts are up to date.');
    }).catch(function (e) { if (manual) NV.toast(e.message, 'error'); });
  }
  function drawDash(app) {
    var d = T.dash, st = d.study || {}, hasBook = !!st.book;
    var focused = document.activeElement && app.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (focused && app.querySelector('.nv-dash')) return;   // never repaint a field being typed in
    var openSetup = !hasBook || !(st.units || []).some(function (w) { return w.status === 'approved'; });
    app.innerHTML = '<div class="nv-dash">' + bannerHtml() + switcherHtml() + gradingCard() + gradebookCard() + studentsCard() +
      '<details class="nv-card nv-fold" id="nvSetup"' + (openSetup || T.setupOpen ? ' open' : '') + '><summary><h2>Book, plan &amp; Canvas</h2><span class="nv-muted">Where students read, how the book is broken up, the activities, and the Canvas link</span></summary>' +
      planCard() + canvasCard() + '</details></div>';
    var s = NV.byId('nvSetup'); if (s) s.addEventListener('toggle', function () { T.setupOpen = s.open; });
  }

  function bannerHtml() {
    var d = T.dash, k = d.klass, st = d.study || {}, b = st.book;
    var roster = d.roster.filter(function (s) { return !s.demo; }), n = roster.length;
    var borrowed = roster.filter(function (s) { return (d.progress[s.email] || {}).borrowedAt; }).length;
    var wk = currentWeek(), tracker = '';
    if (wk) {
      var c = { done: 0, partway: 0, none: 0 };
      roster.forEach(function (s) { var p = ((d.progress[s.email] || {}).weeks || {})[wk.n] || {}; c[p.status === 'done' ? 'done' : p.status === 'partway' ? 'partway' : 'none']++; });
      tracker = '<div class="nv-tracker" title="What students said in the Read step"><span class="nv-tracker-label">' + esc(wk.label || ('Week ' + wk.n)) + ' reading</span>' +
        '<span class="nv-tracker-bar" role="img" aria-label="' + c.done + ' done, ' + c.partway + ' partway, ' + c.none + ' not started"><span class="is-done" style="width:' + pct(c.done, n) + '%"></span><span class="is-part" style="width:' + pct(c.partway, n) + '%"></span></span>' +
        '<span class="nv-tracker-nums"><b>' + c.done + '</b> done · <b>' + c.partway + '</b> partway · <b>' + c.none + '</b> not started</span></div>';
    }
    return '<section class="nv-banner"><div class="nv-banner-main"><div class="nv-eyebrow">' + esc(k.className) + (k.period ? ' · Period ' + esc(k.period) : '') + '</div>' +
      '<h1>' + (b ? esc(b.title) : 'No book yet') + '</h1>' + (b && b.author ? '<div class="nv-book-author">by ' + esc(b.author) + '</div>' : '') +
      (b ? '<div class="nv-banner-sora">' + (st.source === 'own' ? '<span class="nv-access nv-access-own">📖 Own copies</span><span class="nv-chip">Have their copy: <b>' + borrowed + '</b> of ' + n + '</span>'
        : (b.soraUrl ? '<a class="nv-btn small" href="' + esc(b.soraUrl) + '" target="_blank" rel="noopener">Open in Sora ↗</a>' : '<span class="nv-chip is-warn">No Sora link yet</span>') +
        '<span class="nv-access nv-access-' + esc(b.access) + '">' + esc(((d.access || {})[b.access] || {}).label || '') + '</span>' +
        (b.access !== 'assigned' ? '<span class="nv-chip">Borrowed in Sora: <b>' + borrowed + '</b> of ' + n + '</span>' : '')) + '</div>' : '') + tracker + '</div>' +
      '<div class="nv-banner-side"><div class="nv-joincode" title="Students join with this code"><span>Class code</span><b>' + esc(k.joinCode) + '</b></div>' +
      (b ? '<div class="nv-row nv-banner-tools"><button type="button" class="nv-btn small" data-act="openGuide">📋 Teacher guide</button><button type="button" class="nv-btn small" data-act="openStandards">🎯 Standards</button></div>' : '') +
      '<div class="nv-row"><button type="button" class="nv-btn small" data-act="studentView">Student view</button><button type="button" class="nv-btn small ghost" data-act="renameClass">Rename</button></div></div></section>';
  }
  function pct(a, n) { return n ? Math.round(a / n * 1000) / 10 : 0; }
  /** The unit students are on: today's (day by day), else the newest open one. */
  function currentWeek() {
    var st = T.dash.study || {}, set = T.dash.settings || {}, rel = set.release || {}, openOn = set.openOn || {}, today = T.dash.today || '', best = null;
    (st.units || []).forEach(function (u) {
      if (u.status !== 'approved') return;
      var keys = (u.activities || []).map(function (a) { return 'w' + u.n + '_' + a.id; }).concat(['w' + u.n + '__read']);
      var open = keys.some(function (k) { return rel[k] === true || (rel[k] !== false && openOn[u.n] && openOn[u.n] <= today); });
      if (open) best = u;
    });
    return best;
  }
  function switcherHtml() {
    var cl = NV.boot.classes || [];
    return '<nav class="nv-switcher" aria-label="Your classes">' + cl.map(function (c) {
      var on = c.classId === cid();
      return '<button type="button" class="nv-class-pill' + (on ? ' is-on' : '') + '" data-act="switchClass" data-class="' + esc(c.classId) + '" aria-pressed="' + on + '">' + esc(c.className) + (c.period ? '<span class="nv-class-pill-period">P' + esc(c.period) + '</span>' : '') + '</button>';
    }).join('') + '<button type="button" class="nv-class-pill is-add" data-act="newClass">+ New class</button></nav>';
  }
  A.switchClass = function (el) { T.classId = el.dataset.class; rememberClass(T.classId); T.dash = null; NV.render(); };
  A.studentView = function () { NV.state.role = 'student'; NV.state.classId = cid(); NV.state.as = ''; NV.go('home'); };
  function newClassCard(first) {
    return '<section class="nv-card"><h1>' + (first ? 'Make your first class' : 'New class') + '</h1><p class="nv-muted">Each class gets its own book, weeks and join code. You can use the same book in several classes.</p>' +
      '<form id="nvNewClass" class="nv-inline-form"><label class="nv-field"><span>Class name</span><input class="nv-input" id="ncName" maxlength="120" required placeholder="English 9"></label>' +
      '<label class="nv-field nv-field-sm"><span>Period</span><input class="nv-input" id="ncPeriod" maxlength="30" placeholder="2"></label><button class="nv-btn primary" type="submit">Make class</button></form><p class="nv-form-msg" id="ncMsg" role="alert"></p></section>';
  }
  function bindNewClass() {
    var f = NV.byId('nvNewClass'); if (!f) return;
    f.onsubmit = function (e) {
      e.preventDefault(); var b = f.querySelector('button'); b.disabled = true;
      NV.rpc('createClass', { className: NV.byId('ncName').value, period: NV.byId('ncPeriod').value }, { retry: true }).then(function (r) {
        NV.boot.classes = r.classes; T.classId = r.classId; T.dash = null; NV.closeModal(); rememberClass(r.classId); NV.go('dashboard');
      }).catch(function (err) { b.disabled = false; NV.byId('ncMsg').textContent = err.message; });
    };
  }
  A.newClass = function () { NV.modal(newClassCard(false).replace('<section class="nv-card">', '<div>').replace(/<\/section>$/, '</div>') + '<p><button class="nv-btn ghost" onclick="NV.closeModal()">Cancel</button></p>'); bindNewClass(); };
  A.renameClass = function () {
    var k = T.dash.klass;
    NV.modal('<h2 id="nvModalTitle">Rename class</h2><label class="nv-field"><span>Class name</span><input class="nv-input" id="rnName" maxlength="120" value="' + esc(k.className) + '"></label><label class="nv-field"><span>Period</span><input class="nv-input" id="rnPeriod" maxlength="30" value="' + esc(k.period) + '"></label><div class="nv-row"><button class="nv-btn primary" id="rnSave">Save</button><button class="nv-btn" onclick="NV.closeModal()">Cancel</button></div>');
    NV.byId('rnSave').onclick = function () { this.disabled = true; NV.rpc('renameClass', { classId: cid(), className: NV.byId('rnName').value, period: NV.byId('rnPeriod').value }, { retry: true }).then(function (r) { NV.boot.classes = r.classes; NV.closeModal(); T.dash = null; NV.render(); }).catch(function (e) { NV.toast(e.message, 'error'); }); };
  };

  // ---------------------------------------------------------------- Grading card
  function hubHeadline() {
    var h = T.dash.hub; if (!h) return '';
    return h.needsGradingTotal > 0 ? '<span class="nv-chip is-needs">' + h.needsGradingTotal + ' to grade' + (h.needsRegradeTotal ? ' · ↻ ' + NV.plural(h.needsRegradeTotal, 'redo') : '') + '</span>' : '<span class="nv-chip is-ok">Nothing waiting on you</span>';
  }
  function gradingCard() {
    return '<section class="nv-card nv-dash-card" id="gradingCard"><div class="nv-card-head"><div class="nv-card-title"><h2>Grading</h2><span id="nvHubHead">' + hubHeadline() + '</span></div>' +
      '<div class="nv-card-actions"><button type="button" class="nv-btn small" data-act="refreshHub" title="Recount everything">↻ Refresh</button></div></div>' +
      '<p class="nv-card-sub">Open an assignment to grade it. A red number is work waiting on you; ↻ means a student redid something after you graded it.</p><div id="nvHubTiles">' + hubTilesHtml() + '</div></section>';
  }
  A.refreshHub = function () { refreshHub(true); };
  function hubTilesHtml() {
    var h = T.dash.hub, st = T.dash.study || {};
    if (!st.book) return '<p class="nv-empty">Start in the builder: choose where students read, set up the book, break it up and pick activities. Approved activities appear here as grading tiles.</p><p><button type="button" class="nv-btn primary" data-act="openBuilder">Start building →</button></p>';
    if (!h) return '<div class="nv-loading"><span class="nv-spinner" aria-hidden="true"></span>Counting what needs grading…</div>';
    var out = h.groups.map(function (g) {
      var waiting = g.items.reduce(function (n, t) { return n + (t.allExcluded ? 0 : t.needsGrading); }, 0);
      return '<div class="nv-group-head"><h3>' + esc(g.unitLabel) + (g.date ? ' · ' + esc(NV.fmtDay(g.date)) : '') + (g.title ? ' · ' + esc(g.title) : '') + '</h3><span class="nv-group-count">' + NV.plural(g.items.length, 'assignment') + '</span><button type="button" class="nv-link nv-group-guide" data-act="openGuide" data-n="' + g.week + '" title="The teacher guide for ' + esc(g.unitLabel) + '">📋 Guide</button>' +
        (waiting ? '<span class="nv-group-waiting">' + waiting + ' to grade</span>' : '<span class="nv-group-clear">Nothing waiting</span>') + '</div><div class="nv-tile-grid">' + g.items.map(function (t) { return tileHtml(t, g); }).join('') + '</div>';
    }).join('');
    var uw = (h.unitWord || 'Week');
    if (h.drafts && h.drafts.length) out += '<p class="nv-drafts-note">' + (h.drafts.length === 1 ? uw + ' ' + h.drafts[0] + ' is' : uw + 's ' + shortList(h.drafts) + ' are') + ' still a draft. Approve ' + (h.drafts.length === 1 ? 'it' : 'them') + ' in the <button type="button" class="nv-link" data-act="openBuilder">builder</button> to grade ' + (h.drafts.length === 1 ? 'it' : 'them') + ' here.</p>';
    if (!h.groups.length) out = '<p class="nv-empty">No ' + uw.toLowerCase() + ' is approved yet. In the builder, finish ' + uw + ' 1 and press <b>Save &amp; approve</b>.</p>' + out;
    return out;
  }
  function shortList(a) { if (a.length <= 6) return a.join(', '); return a.slice(0, 5).join(', ') + ' and ' + (a.length - 5) + ' more'; }
  function canvasLinked() { return !!(T.dash.canvas && T.dash.canvas.connected && (T.dash.settings.canvas || {}).courseId) || !!(T.dash.lmsHub && (T.dash.settings.canvas || {}).courseId); }
  function tileHtml(t, g) {
    var total = t.totalItems, done = t.graded, todo = t.needsGrading, rest = Math.max(0, total - done - todo);
    var status = t.allExcluded ? 'excluded' : todo ? 'needs' : 'done';
    var badge = status === 'needs' ? '<span class="nv-badge is-needs' + (t.needsRegrade ? ' has-redo' : '') + '" title="' + (t.needsRegrade ? t.needsRegrade + ' redone after grading · ' : '') + t.fresh + ' new · ' + todo + ' waiting on you">' + (t.needsRegrade ? '↻ ' : '') + todo + '</span>'
      : status === 'done' ? '<span class="nv-badge is-done" title="Nothing waiting on you here">✓</span>' : '<span class="nv-badge is-excluded" title="Left out of every student’s grade. Scores already entered are kept.">Not graded</span>';
    var worth = t.allExcluded ? 'Excluded for this class' : t.max + ' pts';
    var note = t.kind === 'quiz' ? 'Multiple choice scores itself · ' + t.answered + ' of ' + total + ' answered' : t.type === 'rubric' ? 'Scored on a 7-level rubric' : t.kind === 'discussion' ? 'A post or reply counts as turned in' : 'Complete / partly / incomplete, or any score';
    var action = status === 'needs' ? '<button type="button" class="nv-btn primary nv-tile-open" data-act="openMarking" data-key="' + esc(t.key) + '">Grade ' + todo + (t.needsRegrade ? ' <span class="nv-tile-open-sub">· ' + NV.plural(t.needsRegrade, 'redo') + '</span>' : '') + '<span aria-hidden="true"> →</span></button>'
      : '<button type="button" class="nv-btn nv-tile-open" data-act="openMarking" data-key="' + esc(t.key) + '">' + (status === 'done' && done ? 'Review graded work' : 'Open') + '<span aria-hidden="true"> →</span></button>';
    var body = t.allExcluded ? '<p class="nv-excluded-note">Left out of the grade for this class. Any scores you entered are kept; choose <b>Count it again</b> in the ⋯ menu to bring it back.</p>'
      : '<div class="nv-bar" role="img" aria-label="' + done + ' graded, ' + todo + ' to grade, ' + rest + ' not submitted, of ' + total + ' students"><span class="nv-bar-done" style="width:' + pct(done, total) + '%"></span><span class="nv-bar-todo" style="width:' + pct(todo, total) + '%"></span></div>' +
        '<dl class="nv-stats3"><div class="' + (todo ? 'is-todo' : '') + '"><dt>To grade</dt><dd>' + todo + '</dd></div><div><dt>Graded</dt><dd>' + done + '</dd></div><div><dt>Not submitted</dt><dd>' + rest + '</dd></div></dl>' +
        '<p class="nv-tile-note">Of ' + total + ' students' + (note ? ' · ' + esc(note) : '') + '</p>';
    var due = t.due ? '<span title="' + esc(new Date(t.due).toLocaleString()) + '">Due ' + esc(NV.fmtDate(t.due)) + '</span>' : '';
    var linked = canvasLinked(), cv = !linked ? ['Canvas not linked', ''] : !t.canvas.linked ? ['Not in Canvas yet', 'is-pending'] : t.canvas.lastPushAt ? ['Pushed ' + NV.fmtDate(t.canvas.lastPushAt), 'is-ok'] : ['In Canvas', 'is-ok'];
    var hides = 'students cannot open ' + (g.unitLabel || 'this') + '’s ' + t.kindLabel;
    var sw = '<label class="nv-switch' + (t.released ? ' is-on' : '') + '" title="' + (t.released ? 'Students can open this. Turn off and ' + hides + '; their work is kept.' : 'Hidden: ' + hides + '. Turn on to open it.') + '"><input type="checkbox" class="nvRelease" data-key="' + esc(t.key) + '"' + (t.released ? ' checked' : '') + '><span class="nv-switch-track" aria-hidden="true"></span><span class="nv-switch-text">' + (t.released ? 'Open to students' : 'Hidden from students') + '</span></label>';
    var busy = T.busy[t.key];
    var menu = '<details class="nv-more"><summary aria-label="More actions for ' + esc(t.label) + '" title="More actions">⋯</summary><div class="nv-menu" role="menu">' +
      '<button type="button" role="menuitem" data-act="tileCanvas" data-key="' + esc(t.key) + '">' + (linked ? 'Due date &amp; Canvas…' : 'Set up Canvas…') + '</button>' +
      '<button type="button" role="menuitem" data-act="tileCsv" data-key="' + esc(t.key) + '"' + (busy ? ' disabled' : '') + '>Download Canvas CSV</button><hr>' +
      '<button type="button" role="menuitem" class="' + (t.allExcluded ? 'is-count' : 'is-nograde') + '" data-act="tileNoGrade" data-key="' + esc(t.key) + '" data-on="' + (!t.allExcluded) + '">' + (t.allExcluded ? '↺ Count it again' : 'Don’t grade for this class') + '</button></div></details>';
    return '<article class="nv-tile nv-tile-' + t.kind + (t.released ? ' is-released' : ' is-hidden') + (status === 'needs' ? ' has-needs' : '') + (t.allExcluded ? ' is-nograde' : '') + '" style="--acc:' + (KIND_ACC[t.actType] || '#4a4f7a') + '" aria-label="' + esc(t.label) + '">' +
      '<header class="nv-tile-head" data-act="openMarking" data-key="' + esc(t.key) + '"><div class="nv-tile-id"><span class="nv-eyebrow">' + esc(g.unitLabel) + (g.reading ? ' · ' + esc(g.reading) : '') + '</span><h4 class="nv-tile-title">' + esc((t.icon ? t.icon + ' ' : '') + t.kindLabel) + '</h4>' +
      '<span class="nv-tile-meta"><span>' + esc(worth) + '</span>' + due + '</span></div>' + badge + '</header>' +
      '<div class="nv-tile-body" data-act="openMarking" data-key="' + esc(t.key) + '">' + body + '</div>' + action +
      '<footer class="nv-tile-foot">' + sw + '<div class="nv-canvas-row"><span class="nv-canvas-state ' + cv[1] + '">' + esc(cv[0]) + '</span><span class="nv-canvas-actions">' +
      (linked ? '<button type="button" class="nv-btn small" data-act="tilePush" data-key="' + esc(t.key) + '"' + (busy ? ' disabled' : '') + ' title="Send scores, excused work and new comments to Canvas now. The assignment is made the first time and reused after that.">↗ Push</button>' : '') + menu + '</span></div>' +
      '<div class="nv-tile-msg" id="msg_' + esc(t.key) + '" aria-live="polite">' + esc(T.msgs[t.key] || '') + '</div></footer></article>';
  }
  document.addEventListener('change', function (e) {
    var r = e.target.closest('.nvRelease'); if (!r) return;
    var key = r.dataset.key, on = r.checked; r.disabled = true;
    NV.rpc('setRelease', { classId: cid(), itemKey: key, on: on }, { retry: true }).then(function (res) {
      T.dash.settings.release = res.release;
      (T.dash.hub.groups || []).forEach(function (g) { g.items.forEach(function (t) { if (t.key === key) t.released = on; }); });
      var tiles = NV.byId('nvHubTiles'); if (tiles) tiles.innerHTML = hubTilesHtml();
      NV.toast(on ? 'Open to students.' : 'Hidden from students. Their work is kept.');
    }).catch(function (err) { r.checked = !on; r.disabled = false; NV.toast(err.message, 'error'); });
  });
  A.openMarking = function (el) { NV.leave(function () { NV.go('marking', { itemKey: el.dataset.key, focusEmail: el.dataset.email || '' }); }); };
  function closeMenu(el) { var d = el.closest('details'); if (d) d.open = false; var t = el.closest('.nv-tile'); if (t) t.classList.remove('menu-open'); }
  A.tileNoGrade = function (el) {
    closeMenu(el);
    var on = el.dataset.on === 'true';
    if (on && !confirm('Leave this out of every student’s grade in this class? Scores you already entered are kept.')) return;
    NV.rpc('setNoGrade', { classId: cid(), itemKey: el.dataset.key, on: on }, { retry: true }).then(function (r) { T.dash.settings.noGrade = r.noGrade; refreshHub(true); refreshGradebook(); })
      .catch(function (e) { NV.toast(e.message, 'error'); });
  };
  function pushSummary(r) {
    if (r.notInCanvas) return 'Not in Canvas yet.';
    var bits = ['Sent ' + NV.plural(r.sent || 0, 'score') + (r.comments ? ' and ' + NV.plural(r.comments, 'comment') : '') + ' to Canvas' + (r.created ? ' (made the assignment)' : '') + '.'];
    if (r.excused && r.excused.length) bits.push(NV.plural(r.excused.length, 'student') + ' marked Excused.');
    if (r.unexcused && r.unexcused.length) bits.push('Excusal lifted for ' + r.unexcused.join(', ') + '.');
    if (r.unmarked && r.unmarked.length) bits.push('Not marked yet (left blank): ' + r.unmarked.join(', ') + '.');
    if (r.unmatched && r.unmatched.length) bits.push('Not found in the Canvas course: ' + r.unmatched.join(', ') + '.');
    (r.warnings || []).forEach(function (w) { bits.push(w); });
    return bits.join(' ');
  }
  A.tilePush = function (el) {
    var key = el.dataset.key; T.busy[key] = true; el.disabled = true; setMsg(key, 'Sending to Canvas…');
    NV.rpc('pushCanvasGrades', { classId: cid(), itemKey: key }).then(function (r) {
      T.busy[key] = false; setMsg(key, pushSummary(r));

  function drawAdmin(app, r) {
    app.innerHTML = '<section class="nv-card"><h1>Admin</h1><p class="nv-muted">Teachers listed here can make classes and use the Teacher view. Everyone else who signs in is a student.</p>' +
      '<form id="adForm" class="nv-inline-form"><label class="nv-field"><span>School email</span><input class="nv-input" id="adEmail" type="email" required></label><label class="nv-field"><span>Name</span><input class="nv-input" id="adName"></label><label class="nv-field nv-field-sm"><span>Role</span><select class="nv-input" id="adRole"><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label><button class="nv-btn primary" type="submit">Add or update</button></form><p class="nv-form-msg" id="adMsg" role="alert"></p>' +
      '<div class="nv-table-wrap"><table class="nv-table"><thead><tr><th>Person</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>' + r.users.map(function (u) {
        return '<tr><td>' + esc(u.name) + '<div class="nv-small nv-muted">' + esc(u.email) + '</div></td><td>' + esc(u.role) + '</td><td>' + (u.status === 'active' ? '<span class="nv-chip is-ok">Active</span>' : '<span class="nv-chip">Off</span>') + '</td><td><button class="nv-btn small" data-act="adToggle" data-email="' + esc(u.email) + '" data-name="' + esc(u.name) + '" data-role="' + esc(u.role) + '" data-status="' + (u.status === 'active' ? 'inactive' : 'active') + '">' + (u.status === 'active' ? 'Turn off' : 'Turn on') + '</button></td></tr>';
      }).join('') + '</tbody></table></div></section>' +
      '<section class="nv-card"><h2>Every class</h2>' + (r.classes.length ? '<ul class="nv-plain">' + r.classes.map(function (c) { return '<li><b>' + esc(c.className) + '</b>' + (c.period ? ' · Period ' + esc(c.period) : '') + ' · ' + esc(c.teacherEmail) + ' · code ' + esc(c.joinCode) + '</li>'; }).join('') + '</ul>' : '<p class="nv-muted">No classes yet.</p>') + '</section>';
    NV.byId('adForm').onsubmit = function (e) { e.preventDefault(); NV.rpc('adminSetAccess', { email: NV.byId('adEmail').value, name: NV.byId('adName').value, role: NV.byId('adRole').value, status: 'active' }).then(function (x) { drawAdmin(app, x); NV.toast('Saved.'); }).catch(function (err) { NV.byId('adMsg').textContent = err.message; }); };
  }
  A.adToggle = function (el) { NV.rpc('adminSetAccess', { email: el.dataset.email, name: el.dataset.name, role: el.dataset.role, status: el.dataset.status }).then(function (x) { drawAdmin(NV.byId('app'), x); }).catch(function (e) { NV.toast(e.message, 'error'); }); };

  NV.teacher = { hubTilesHtml: hubTilesHtml, refreshHub: refreshHub, refreshGradebook: refreshGradebook, pushSummary: pushSummary };
  window.__MB.Teacher = 'ok';
})();
</script>
