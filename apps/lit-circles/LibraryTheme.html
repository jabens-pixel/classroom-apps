<!-- ======================================================================
     Literature Circles — theme ("Reading Room", 2026-10-14)
     Spliced in last by Index.html (include_('LibraryTheme')), so it restyles every screen:
     student pages, the writing workspace and focus mode, the teacher dashboard, grading and
     the gradebook. Presentation only: nothing here changes what is saved or graded.
     A soft-focus black-and-white library wall is the backdrop (embedded below, so nothing extra to upload).
     Page titles sit on dark glass; work sits on white cards with a black outline and clipped
     corners. Roboto Condensed for headings and labels, Roboto for reading and writing.
     Lime marks "you are here" and "needs you".
     ====================================================================== -->

  /* older variable names used around the app */
  --paper:var(--rr-paper);--sheet:var(--rr-paper);--ink:var(--rr-ink);--muted:var(--rr-muted);--rule:var(--rr-rule);
  --wine:var(--rr-ink);--teal:var(--rr-ink);--gold:var(--rr-warn);
  --accent-green:var(--rr-ink);--accent-green-dim:#000;--accent-blue:var(--rr-muted);--accent-orange:var(--rr-warn);
  --text-white:var(--rr-ink);--text-dim:var(--rr-muted);--bg-black:#1a140f;--bg-panel:var(--rr-paper);--bg-card:var(--rr-chip);--bg-card-hover:#E6E6E1;
  --success:var(--rr-ok);--success-bg:var(--rr-ok-bg);--error:var(--rr-bad);--error-bg:var(--rr-bad-bg);--radius:0px;
}

/* ================================================================ the room */
html{background:#1a140f}
body{background:transparent!important;color:var(--rr-ink);font-family:var(--rr-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(10,7,4,.58),rgba(10,7,4,.70)),var(--rr-photo) center 30%/cover no-repeat,#1a140f}
h1,h2,h3,h4,.platform-title h2,.pathway-copy h3,.journey-step h3,.lch-tile-title{font-family:var(--rr-display)!important;font-weight:700!important;text-transform:none!important;letter-spacing:-.005em!important;color:var(--rr-ink);text-wrap:balance}
h2{border:0!important;padding-bottom:0;display:block}
h3{color:var(--rr-ink)}
p{text-wrap:pretty}
a{color:var(--rr-ink)}
label{font-family:var(--rr-display);text-transform:none!important;letter-spacing:0!important;font-size:15.5px;font-weight:700;color:var(--rr-ink)}
.muted,.hint,.platform-title p{color:var(--rr-muted)!important}
::selection{background:var(--rr-lime);color:var(--rr-ink)}
:focus-visible{outline:3px solid var(--rr-lime)!important;outline-offset:2px!important;box-shadow:0 0 0 5px var(--rr-ink)!important}

/* text that sits straight on the photo */
.backlink{display:inline-flex!important;align-items:center;gap:6px;font-family:var(--rr-display)!important;color:#fff!important;font-size:15px!important;font-weight:700!important;letter-spacing:.02em!important;text-transform:uppercase!important;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.7);background:rgba(12,9,6,.6);padding:6px 12px}
.backlink:hover{background:var(--rr-ink);color:var(--rr-lime)!important}

/* dark glass title panels */
.student-home-compact,.week-hero,.prep-focus-hero,.feedback-hero,.lch-hero,.lch-markhead,.focus-strategy-hero,.prep-section-title{background:var(--rr-glass)!important;color:#fff!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.student-home-compact *,.week-hero *,.prep-focus-hero *,.feedback-hero *,.lch-hero *,.lch-markhead *,.focus-strategy-hero *,.prep-section-title *{color:inherit}
.student-home-compact h2,.week-hero h2,.prep-focus-hero h2,.feedback-hero h2,.lch-hero h2,.lch-markhead h2,.focus-strategy-hero h2,.prep-section-title h3{color:#fff!important}
.student-home-compact p,.week-hero p,.prep-focus-hero p,.feedback-hero p,.lch-hero p,.focus-strategy-hero p,.prep-section-title p{color:#EDEDE8!important}
.eyebrow,.week-kicker,.small-label,.choice-label,.week-label,.lch-eyebrow,.lc-ck-kicker,.week-focus-kicker{font-family:var(--rr-display)!important;font-size:14px!important;font-weight:700!important;letter-spacing:.04em!important;text-transform:uppercase!important;color:var(--rr-ink)!important;opacity:1!important}
.student-home-compact .eyebrow,.week-hero .week-label,.prep-focus-hero .eyebrow,.feedback-hero .eyebrow,.lch-hero .lch-eyebrow,.lch-markhead .lch-eyebrow,.focus-strategy-hero .small-label{color:#fff!important}

/* clipped-corner card with a black outline: the card is the outline, :before is the white face */
.week-focus-card,.journey-step,.prep-pathway-card,.strategy-pick-card,.lch .lch-tile{position:relative;isolation:isolate;background:var(--rr-ink)!important;border:0!important;border-radius:0!important;box-shadow:none!important;clip-path:polygon(var(--rr-cut) 0,calc(100% - var(--rr-cut)) 0,100% var(--rr-cut),100% calc(100% - var(--rr-cut)),calc(100% - var(--rr-cut)) 100%,0 100%,0 var(--rr-cut))!important}
.week-focus-card:before,.journey-step:before,.prep-pathway-card:before,.strategy-pick-card:before,.lch .lch-tile:before{content:''!important;position:absolute!important;inset:2px!important;z-index:-1!important;width:auto!important;height:auto!important;background:var(--rr-paper)!important;background-image:none!important;border-radius:0!important;clip-path:polygon(calc(var(--rr-cut) - 1px) 0,calc(100% - var(--rr-cut) + 1px) 0,100% calc(var(--rr-cut) - 1px),100% calc(100% - var(--rr-cut) + 1px),calc(100% - var(--rr-cut) + 1px) 100%,0 100%,0 calc(var(--rr-cut) - 1px))!important;display:block!important}

/* ================================================================ header */
body>header{background:#0b0b0b!important;border-bottom:0!important;box-shadow:none!important;padding:12px max(20px,calc((100vw - 1240px)/2))!important;gap:16px}
header h1,header .lc-wordmark{font-family:var(--rr-display)!important;font-size:22px!important;font-weight:700!important;letter-spacing:.01em!important;text-transform:uppercase!important;color:#fff!important}
header h1 .brand,header .lc-wordmark .brand{color:var(--rr-lime)!important}
.lc-logo{width:30px!important;height:32px!important}
.lc-logo path:nth-of-type(1){fill:var(--rr-lime)}
.lc-logo path:nth-of-type(2){stroke:#111}
.lc-logo path:nth-of-type(3){stroke:#111}
/* the version badge stays visible: it is how you check a deploy worked */
header h1.lc-brand .app-version,header .app-version{display:inline-block!important;align-self:center;margin-left:10px;padding:2px 8px!important;border:1px solid #4a4a4a!important;border-radius:0!important;background:transparent!important;color:#BDBDB8!important;font:700 12px/1.3 var(--rr-display)!important;letter-spacing:.02em!important;text-transform:none!important;white-space:nowrap}
header .who{color:#CFCFCA;font-size:13.5px}
header a{color:#fff!important;font-family:var(--rr-display);font-size:15px!important;font-weight:700!important;text-transform:uppercase!important;letter-spacing:.03em!important;text-decoration:none;border-bottom:2px solid transparent}
header a:hover{border-bottom-color:var(--rr-lime)}
.platform-btn,.class-tab{font-family:var(--rr-display)!important;border-radius:0!important;border:1px solid #6b6b6b!important;background:transparent!important;color:#fff!important;font-size:14px!important;font-weight:700!important;text-transform:uppercase!important;letter-spacing:.03em!important;box-shadow:none!important;padding:6px 12px!important;min-height:0!important}
.platform-btn.active,.class-tab.active{background:var(--rr-lime)!important;border-color:var(--rr-lime)!important;color:var(--rr-ink)!important}
.platform-btn:hover:not(.active){border-color:#fff!important}
main{padding-top:30px!important}

/* ================================================================ controls */
button,.btn{font-family:var(--rr-display)!important;font-weight:700;font-size:15.5px;letter-spacing:.01em;text-transform:none;border-radius:0!important;clip-path:none;background:var(--rr-ink);color:#fff;border:1px solid var(--rr-ink);box-shadow:none!important;transition:background .12s,color .12s}
button:hover,.btn:hover{background:#2b2b2b;transform:none!important}
button:disabled{background:#9a9a96!important;border-color:#9a9a96!important;color:#fff!important}
button.secondary,.btn.secondary{background:var(--rr-paper);border-color:var(--rr-ink);color:var(--rr-ink)}
button.secondary:hover,.btn.secondary:hover{background:var(--rr-lime);border-color:var(--rr-ink);color:var(--rr-ink)}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],input[type=time],input[type=datetime-local],textarea,select{font-family:var(--rr-body);font-size:15.5px;background:var(--rr-paper)!important;color:var(--rr-ink)!important;border:1.5px solid #8C8C88!important;border-radius:0!important;box-shadow:none}
input::placeholder,textarea::placeholder{color:#6E6E6A!important;opacity:1}
input:focus,textarea:focus,select:focus{border-color:var(--rr-ink)!important;outline:none!important;box-shadow:0 0 0 3px var(--rr-lime)!important}
#app textarea,#app .rich-editor{font-family:var(--rr-body)!important;font-size:17px;line-height:1.65;color:var(--rr-ink)!important;background:var(--rr-paper)!important;background-image:none!important;border:1.5px solid #8C8C88!important;border-radius:0!important}
#app .rich-editor:focus,#app textarea:focus{border-color:var(--rr-ink)!important;outline:none!important;box-shadow:0 0 0 3px var(--rr-lime)!important}
#app .rich-editor:empty:before{color:#6E6E6A!important;opacity:1}
#app .lch textarea,#app .lch input,#app .lch-comment{font-size:14px!important;line-height:1.5}

.status-chip,.badge,.teacher-chip,.focus-crumb,.current-choice{font-family:var(--rr-display);border-radius:0!important;font-weight:700;letter-spacing:.01em;text-transform:none}
.status-chip.pending,.badge.pending{background:var(--rr-chip)!important;color:var(--rr-ink)!important;border:0!important}
.status-chip.done,.badge.done{background:var(--rr-ok-bg)!important;color:var(--rr-ok)!important;border:0!important}
.msg{border-radius:0!important;border:0!important;box-shadow:none!important;background:var(--rr-chip)!important;color:var(--rr-ink)!important}
.msg.success{background:var(--rr-ok-bg)!important;color:var(--rr-ok)!important}
.msg.error{background:var(--rr-bad-bg)!important;color:var(--rr-bad)!important}
.msg strong{color:inherit}

/* white panels for long pages (forms, lists) */
.card,.strategy-block,.teammate-card,.focused-strategy-form,.focus-guide,.lc-ck-side,.teacher-roster,.teacher-stage-panel,.teacher-manage,.assignment-rubric-panel{background:var(--rr-paper)!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.card{border-left:0!important}

/* ================================================================ student home */
.student-home-compact{display:block!important;max-width:760px;min-height:0!important;padding:34px 44px 34px!important;margin:-30px 0 26px!important;overflow:visible!important}
.student-home-compact:before,.student-home-compact:after{content:none!important;display:none!important}
.student-home-compact h2{font-size:clamp(40px,6vw,68px)!important;line-height:1.02!important;margin:12px 0 16px!important;letter-spacing:-.015em!important}
.student-home-compact p{font-size:16.5px!important;line-height:1.55!important;max-width:60ch}
.student-home-compact .book-meta{display:flex!important;justify-content:flex-start!important;gap:0;margin:20px 0 0!important}
.student-home-compact .book-meta span{background:none!important;border:0!important;border-radius:0!important;padding:0 16px!important;font:700 17px var(--rr-display)!important;color:#fff!important}
.student-home-compact .book-meta span:first-child{padding-left:0!important}
.student-home-compact .book-meta span+span{border-left:1px solid #9a9a96!important}
.week-focus-list{display:grid;gap:16px!important}
.week-focus-card{display:grid!important;grid-template-columns:116px minmax(0,1fr) 230px 64px!important;align-items:stretch;min-height:0!important;padding:0!important;color:var(--rr-ink)!important;text-align:left;font-family:var(--rr-body)!important;font-weight:400!important;transition:transform .15s}
.week-focus-card:hover{transform:translateX(4px)!important}
.week-focus-card .week-focus-number,.week-focus-card.week-2 .week-focus-number,.week-focus-card.week-3 .week-focus-number,.week-focus-card.week-4 .week-focus-number{background:var(--rr-ink)!important;color:#fff!important;border:0!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:22px 0;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.week-focus-card.rr-current .week-focus-number{background:var(--rr-lime)!important;color:var(--rr-ink)!important}
.week-focus-word{font:700 17px/1 var(--rr-display)!important;letter-spacing:.02em!important;color:inherit!important}
.week-focus-digit{font:700 64px/1 var(--rr-display)!important;font-style:normal!important;color:inherit!important;margin-top:4px}
.week-focus-main{padding:26px 28px!important;min-width:0;align-self:center}
.week-focus-kicker{font-size:17px!important;letter-spacing:.02em!important}
.essential-question{border:0!important;padding:0!important;margin-top:4px!important;background:none!important}
.essential-question span{display:none!important}
.essential-question strong{display:block;max-width:none!important;margin-top:2px;font:700 25px/1.2 var(--rr-display)!important;color:var(--rr-ink)!important;letter-spacing:-.005em}
.eq-subquestions{display:flex;flex-wrap:wrap;gap:4px 0!important;margin:12px 0 0!important;padding:0!important;list-style:none}
.eq-subquestions li{background:none!important;border:0!important;padding:0!important;font-size:13.5px!important;line-height:1.45;color:var(--rr-muted)!important}
.eq-subquestions li+li:before{content:'·'!important;padding:0 10px!important;color:var(--rr-faint)}
.week-focus-side{background:transparent!important;border:0!important;border-left:1px solid var(--rr-rule)!important;margin:20px 0;padding:6px 20px!important;display:flex;flex-direction:column;justify-content:center;gap:6px}
.week-focus-reading{font:700 16px var(--rr-display)!important;color:var(--rr-ink)!important}
.week-focus-reading strong{display:block;margin-top:3px;font:400 14.5px var(--rr-body)!important;color:var(--rr-muted)!important}
.week-focus-progress{background:var(--rr-chip);padding:7px 10px;margin-top:6px;color:var(--rr-ink)!important;font:700 15.5px var(--rr-display)!important}
.week-focus-card.rr-current .week-focus-progress{background:var(--rr-lime)}
.week-focus-progress small{display:block;font:400 12.5px var(--rr-body)!important;color:var(--rr-muted)!important;margin-top:3px}
.week-focus-card.rr-current .week-focus-progress small{color:var(--rr-ink)!important}
.week-focus-go{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.week-focus-go button{width:100%!important;margin:0!important;min-height:0!important;padding:8px 10px!important;font:700 14px/1.2 var(--rr-display)!important;text-align:left!important;border-radius:0!important;box-shadow:none!important;text-transform:none!important;letter-spacing:.01em!important;cursor:pointer}
.week-focus-go .week-go-resume{background:var(--rr-ink)!important;color:#fff!important;border:1.5px solid var(--rr-ink)!important}
.week-focus-go .week-go-all{background:#fff!important;color:var(--rr-ink)!important;border:1.5px solid var(--rr-ink)!important}
.week-focus-go button:hover,.week-focus-go button:focus-visible{background:var(--rr-lime)!important;color:var(--rr-ink)!important;border-color:var(--rr-ink)!important}
.week-focus-card:focus-visible{outline:3px solid var(--rr-lime);outline-offset:3px}
.week-focus-arrow{background:transparent!important;color:var(--rr-ink)!important;font-size:28px;display:flex;align-items:center;justify-content:center}
.week-focus-card.locked{opacity:1!important}
.week-focus-card.locked:before{background:#E9E9E4!important}
.week-focus-card.locked .week-focus-number{background:#3a3a3a!important}
.week-focus-card.locked .essential-question strong,.week-focus-card.locked .week-focus-kicker{color:#5a5a5a!important}
.week-focus-card.locked .week-focus-arrow{font-size:0!important}
.week-focus-card.locked .week-focus-arrow:after{content:'Locked';font:700 13px var(--rr-display);letter-spacing:.06em;text-transform:uppercase;color:var(--rr-faint);writing-mode:vertical-rl;transform:rotate(180deg)}
/* the links under the weeks share one white panel */
.student-standards-row{display:flex!important;justify-content:flex-end!important;margin:22px 0 0!important;padding:12px 18px!important;background:var(--rr-paper);border-bottom:1px solid var(--rr-rule)}
.student-standards-btn{background:transparent!important;color:var(--rr-ink)!important;border:0!important;padding:4px 0!important;font:700 15px var(--rr-display)!important}
.student-standards-btn:hover{background:var(--rr-lime)!important}
.student-standards-row+.dashboard-actions{display:flex;flex-wrap:wrap;align-items:center;gap:0!important;margin:0!important;padding:14px 18px 6px!important;background:var(--rr-paper)}
.student-standards-row+.dashboard-actions button.secondary{border:0!important;border-right:1px solid #BDBDB8!important;background:transparent!important;padding:8px 16px!important;font-size:16px}
.student-standards-row+.dashboard-actions button.secondary:first-child{padding-left:0!important}
.student-standards-row+.dashboard-actions button.secondary:last-of-type{border-right:0!important}
.student-standards-row+.dashboard-actions button.secondary:hover{background:var(--rr-lime)!important}
.student-standards-row+.dashboard-actions~div,.student-standards-row+.dashboard-actions~.card{margin:0!important;padding:10px 18px 18px!important;background:var(--rr-paper)!important}
.student-standards-row+.dashboard-actions~div button.secondary{padding:9px 16px}

/* ================================================================ week hub */
.week-hero{padding:28px 34px!important;margin:12px 0 22px!important;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.week-hero h2{font-size:clamp(32px,4.4vw,48px)!important;margin:6px 0 8px!important}
.week-hero p{font-size:16px;max-width:65ch}
.reading-badge,.reading-focus-badge{background:var(--rr-lime)!important;color:var(--rr-ink)!important;border:0!important;border-radius:0!important;box-shadow:none!important;font:700 17px var(--rr-display)!important;padding:9px 16px!important;white-space:normal}
.journey-step-grid{gap:16px!important}
.journey-step{padding:26px 24px 24px!important;overflow:visible!important;transition:transform .15s;cursor:pointer}
.journey-step:hover{transform:translateY(-3px)!important}
.journey-step .step-no{position:static!important;display:inline-flex!important;align-items:center;justify-content:center;width:44px!important;height:44px!important;background:var(--rr-ink)!important;border:0!important;color:#fff!important;font:700 26px var(--rr-display)!important;margin:0 0 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.journey-step .step-no:before{content:none!important}
.journey-step h3{font-size:24px!important;line-height:1.15;margin:0 0 8px}
.journey-step p{color:var(--rr-muted)!important;font-size:14.5px;line-height:1.55}
.journey-step .step-action{display:inline-block!important;width:auto!important;margin-top:6px;color:var(--rr-ink)!important;font:700 16px var(--rr-display)!important;border-bottom:3px solid var(--rr-lime);padding-bottom:1px}
.journey-step .step-status{position:absolute!important;top:28px!important;right:22px!important}

/* ================================================================ choosing a pathway */
.prep-focus-hero{padding:28px 34px!important;margin-bottom:18px!important}
.prep-focus-hero h2{font-size:clamp(34px,4.6vw,52px)!important}
.prep-section-title{padding:18px 28px!important;margin:0 0 16px!important;text-align:left!important}
.prep-section-title h3{font-size:28px!important;margin:0 0 4px}
.prep-pathway-grid{gap:18px!important}
.prep-pathway-card{display:flex!important;flex-direction:column;align-items:stretch;text-align:left;color:var(--rr-ink)!important;padding:0!important;transition:transform .15s}
.prep-pathway-card:hover{transform:translateY(-3px)!important}
.prep-pathway-card.current{border:0!important;outline:0!important}
.prep-pathway-card.current:before{inset:4px!important}
.prep-pathway-card.current .pathway-copy{box-shadow:inset 0 -8px 0 var(--rr-lime)}
.prep-pathway-card.current .pathway-picture{margin:4px 4px 0}
.pathway-picture{height:170px!important;flex:none;margin:2px 2px 0;background-color:var(--rr-chip)!important;background-repeat:no-repeat!important;background-position:center!important;background-size:contain!important;display:flex;align-items:flex-end;justify-content:flex-start;padding:0!important}
.pathway-picture:before,.pathway-picture:after{display:none!important}

.pathway-emoji{font-size:0!important;margin:0 0 12px 22px!important;filter:none!important}
.library-path-label{font:700 14px var(--rr-display)!important;font-style:normal!important;letter-spacing:.04em;text-transform:uppercase;color:#fff!important;background:var(--rr-ink)!important;border:0!important;border-radius:0;padding:6px 10px!important}
.pathway-copy{padding:20px 24px 24px!important;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.pathway-copy h3{font-size:28px!important;color:var(--rr-ink)!important;margin:4px 0 8px}
.pathway-copy p{font-size:15px!important;color:var(--rr-muted)!important;line-height:1.6;font-weight:400}
.pathway-copy .choice-action{margin-top:auto;padding-top:16px;color:var(--rr-ink)!important;font:700 17px var(--rr-display)!important;border-bottom:3px solid var(--rr-lime)!important;padding-bottom:2px}
.current-choice{background:var(--rr-lime)!important;color:var(--rr-ink)!important}

/* strategy picker */
.strategy-picker-grid{gap:16px!important}
.strategy-pick-card{color:var(--rr-ink)!important;font-family:var(--rr-body)!important;transition:transform .15s}
.strategy-pick-card:hover{transform:translateY(-3px)!important}
.strategy-pick-card.selected,.strategy-pick-card.is-selected,.strategy-pick-card[aria-pressed="true"]{background:var(--rr-ink)!important}
.strategy-pick-card.selected:before,.strategy-pick-card.is-selected:before{inset:4px!important;background:var(--rr-paper)!important}
.strategy-picture{background:var(--rr-chip)!important;border-radius:0!important}
.strategy-pick-card h3,.strategy-pick-card strong{font-family:var(--rr-display)!important;font-size:23px!important;color:var(--rr-ink)!important}
.strategy-pick-card p,.strategy-pick-card span{color:var(--rr-muted)}
.strategy-check{border:2px solid var(--rr-ink)!important;background:var(--rr-paper)!important;border-radius:0!important}
.selected .strategy-check,.is-selected .strategy-check{background:var(--rr-lime)!important;color:var(--rr-ink)!important}
.selection-counter{display:inline-block;font:700 18px var(--rr-display)!important;color:var(--rr-ink)!important;background:var(--rr-lime);padding:6px 14px}
#app .prep-focus-shell>h2,#app .prep-focus-shell>p,#app .prep-focus-shell>.muted{color:#fff!important;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.assignment-rubric-panel{padding:24px!important}
.assignment-rubric-head h3,.assignment-rubric-head h2{font-size:28px}
.rubric-points-chip,.completion-grade-score{background:var(--rr-lime)!important;color:var(--rr-ink)!important;border-radius:0!important;font-family:var(--rr-display)!important;font-weight:700!important}
.assignment-rubric-level{background:var(--rr-chip)!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:var(--rr-muted)}
.assignment-rubric-level:first-child{background:var(--rr-lime)!important;color:var(--rr-ink)!important}
.assignment-rubric-level .rubric-score,.assignment-rubric-level strong{color:var(--rr-ink)!important;font-family:var(--rr-display)!important}
.start-work-row button{min-height:52px;padding:0 26px;font-size:18px}

/* ================================================================ writing workspace (Step 1) */
.focus-progress .crumbs{gap:6px}
.focus-crumb{background:var(--rr-paper)!important;border:0!important;color:var(--rr-ink)!important;padding:6px 12px!important;font-size:15px}
.focus-crumb.active{background:var(--rr-lime)!important;color:var(--rr-ink)!important}
.focus-progress .muted{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.focus-strategy-hero{gap:24px!important;padding:24px!important}
.focus-strategy-visual{background:var(--rr-paper)!important;border-radius:0!important;box-shadow:none!important}

<script>
/* Presentation only: drop the decorative emoji the page text starts some labels with
   (book, lock, printer), so labels read as plain words, and mark the week the student is on
   (the first open week that is not finished) so the theme can light it up. */
(function () {
  'use strict';
  var EMOJI = /^\s*(?:[\u2600-\u27BF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDD00-\uDFFF])\uFE0F?\s*/;
  var SEL = '.reading-badge,.reading-focus-badge,#app button,#app .muted,.week-focus-arrow,.pathway-emoji';
  function clean(root) {
    (root.querySelectorAll ? root.querySelectorAll(SEL) : []).forEach(function (el) {
      var n = el.firstChild;
      if (n && n.nodeType === 3 && EMOJI.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(EMOJI, '');
    });
  }
  function markCurrent(root) {
    var cards = root.querySelectorAll ? root.querySelectorAll('.week-focus-card') : [];
    var found = false;
    Array.prototype.forEach.call(cards, function (c) {
      var p = c.querySelector('.week-focus-progress');
      var t = p ? (p.firstChild && p.firstChild.nodeType === 3 ? p.firstChild.nodeValue : p.textContent) : '';
      var m = /(\d+)\s*of\s*(\d+)/.exec(t || '');
      var done = m && +m[1] >= +m[2];
      var on = !found && !c.classList.contains('locked') && !done;
      if (on) found = true;
      if (c.classList.contains('rr-current') !== on) c.classList.toggle('rr-current', on);
    });
  }
  var queued = false;
  function soon() { if (queued) return; queued = true; setTimeout(function () { queued = false; clean(document); markCurrent(document); }, 0); }
  try { new MutationObserver(soon).observe(document.body || document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  soon();
})();
</script>
