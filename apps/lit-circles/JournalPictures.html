<!-- ======================================================================
     Literature Circles — Pictures in the Reader's Journal (2026-10-20d)
     Rides along after BackendClient (LC_INCLUDE_WITH in Code.js).

     Students add pictures to their journal three ways: upload a file (a saved
     internet picture, or a photo of a paper drawing), paste a copied picture
     into the journal, or draw one in the app. The picture goes INTO the writing,
     below the line the cursor is on. Each picture has a caption and, unless it
     is a drawing, a "Where it's from" line (optional, with a reminder), edited
     in a small box. ↑ / ↓ move a picture a line up or down; ✕ (or backspacing
     over it) removes it; Ctrl+Z brings it back.

     How it is stored: the picture file is shrunk in the browser (max 1600 px)
     and saved in the teacher's Drive by saveJournalImage. The writing holds only
     an empty marker, <div data-jp="file id">, where the picture sits; the
     caption / source / kind live in data.journalImages (same order as the
     markers). Both save the usual way (draft, stale check, backups). The marker
     has no text, so word counts, the checklist, highlights and paste stats
     ignore pictures. On screen the marker is drawn through a shadow root, which
     is never saved and never counted as writing.

     Safety: a picture is dropped from journalImages only when its marker is
     removed while the student is editing; when the page opens, any picture in
     the list that has no marker (older saves, an older tab) is put back at the
     end of the journal. A picture that hasn't reached Drive yet is kept on this
     device and can be retried. Teachers see the pictures in place on the
     marking screen. A teacher viewing a real student can't add, move or remove.
     ====================================================================== -->

<script>

    } else {

      if (e.key === 'Backspace') { q.setStartBefore(ln[0]); q.setEnd(c, r.startOffset); if (emptyBetween(q)) { var pv = sib(ln[0], -1); if (isMarker(pv)) m = pv; } }
      else { q.setStart(c, r.startOffset); q.setEndAfter(ln[1]); if (emptyBetween(q)) { var nx = sib(ln[1], 1); if (isMarker(nx)) m = nx; } }
    }
    if (!m) return;
    e.preventDefault(); e.stopPropagation();
    removePic(ed, m, wk);
  }, true);
  // typing after a removal: the browser's own undo takes over again
  document.addEventListener('input', function (e) { var ed = $('journalText'); if (JP.undo && ed && e.target && (e.target === ed || ed.contains(e.target))) JP.undo = null; }, true);

  /** Something in the writing changed: draw new pictures, and keep journalImages matching the markers. */
  function sync(ed, wk) {
    if (ed !== $('journalText') || journalWeek() !== wk) return;
    var ids = [], seen = {};
    each(ed.querySelectorAll('[data-jp]'), function (m) {
      var id = m.getAttribute('data-jp');
      if (!ID_RE.test(id || '')) { m.removeAttribute('data-jp'); return; }

      seen[id] = 1; ids.push(id);
    });
    var pics = list(wk), by = {};
    pics.forEach(function (p) { if (p && p.id) by[p.id] = p; });
    var next = ids.map(function (id) { return by[id] || JP.gone[id] || { id: id, kind: 'upload', caption: '', source: '' }; });
    var same = next.length === pics.length && next.every(function (p, i) { return p === pics[i]; });
    if (!same) {
      pics.forEach(function (p) { if (p && p.id && !seen[p.id]) JP.gone[p.id] = p; });
      pics.length = 0; next.forEach(function (p) { pics.push(p); delete JP.gone[p.id]; });
      changed(wk);
    }
    each(ed.querySelectorAll('[data-jp]'), function (m) {
      if (m.getAttribute('contenteditable') !== 'false') m.setAttribute('contenteditable', 'false');
      if (!m.classList.contains('lc-jp-in')) m.classList.add('lc-jp-in');
      if (!m.shadowRoot) paint(m);
    });
    if (!same) refreshPanel(wk);
  }
  /** After each render: pictures in the list but not in the writing go at the end; then watch the editor. */
  function mountEditor(wk) {
    var ed = $('journalText'); if (!ed) return;
    if (ed.__jpObs && ed.__jpWk === wk) return;
    ed.__jpWk = wk;
    var have = {}, added = 0;
    each(ed.querySelectorAll('[data-jp]'), function (m) { have[m.getAttribute('data-jp')] = 1; });
    list(wk).forEach(function (p) { if (p && p.id && ID_RE.test(p.id) && !have[p.id]) { var m = makeMarker(p.id); ed.appendChild(m); lineAfter(m); have[p.id] = 1; added++; } });

    if (added) changed(wk);

  }
  // where the cursor was in the journal (buttons and dialogs take the focus away)
  document.addEventListener('selectionchange', function () {
    var ed = $('journalText'), s = W.getSelection && W.getSelection(); if (!ed || !s || !s.rangeCount) return;
    var r = s.getRangeAt(0); if (ed.contains(r.startContainer)) JP.range = { ed: ed, r: r.cloneRange() };
  });

  // ------------------------------------------------------------------ caption & source box
  function openCaption(wk, id) {
    var p = null; list(wk).forEach(function (x) { if (x.id === id) p = x; }); if (!p) return;
    var old = document.querySelector('.lc-jp-ed'); if (old) old.remove();
    var drawn = p.kind === 'drawing', wrap = document.createElement('div');
    wrap.className = 'lc-jp-ed'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', 'Picture caption');

      (JP.cache[id] ? '<div class="lc-jp-thumb"><img alt="" src="' + JP.cache[id] + '"></div>' : '') +
      '<label for="lcJpCap">What it shows — and why you added it</label><input type="text" id="lcJpCap" class="lc-jp-cap" maxlength="300" value="' + esc(p.caption || '') + '">' +
      (drawn ? '' : '<label for="lcJpSrc">Where it’s from</label><input type="text" id="lcJpSrc" class="lc-jp-src" data-paste-ok="1" maxlength="500" placeholder="Website name or link" value="' + esc(p.source || '') + '">' +
        '<p class="lc-jp-warn"' + (String(p.source || '').trim() ? ' hidden' : '') + '>Add where this picture came from (a website name or link).</p>') +
      '<div class="lc-jp-edfoot"><button type="button" data-ja="done">Done</button></div></div>';
    document.body.appendChild(wrap);
    function repaint() { var ed = $('journalText'); if (!ed) return; each(ed.querySelectorAll('[data-jp]'), function (m) { if (m.getAttribute('data-jp') === id) paint(m); }); }
    function close() { wrap.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(e) { if (e.key === 'Escape' || (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT')) { e.preventDefault(); e.stopPropagation(); close(); } }
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('input', function (e) {
      var el = e.target; if (!el || isPreview()) return;

    var f = wrap.querySelector('#lcJpCap'); if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 0);
  }
  JP.openCaption = openCaption;

  // ------------------------------------------------------------------ the buttons under the journal
  function pendingHtml(q) {
    return '<figure class="lc-jp-card"><div class="lc-jp-img">' + (q.preview ? '<img alt="" src="' + q.preview + '">' : '') + '</div>' +
      (q.error ? '<p class="lc-jp-err">Not saved yet: ' + esc(q.error) + '</p><div class="lc-jp-row"><button type="button" data-jp="retry" data-jp-q="' + q.key + '">Try again</button><button type="button" class="secondary" data-jp="discard" data-jp-q="' + q.key + '">Discard</button></div>'
        : '<p class="lc-jp-kind">Saving picture…</p>') + '</figure>';
  }
  function panelHtml(wk) {
    var pics = list(wk), q = JP.pending.filter(function (x) { return x.email === me() && x.wk === wk; }), full = pics.length + q.length >= JP.maxImages;
    return '<div class="lc-jp-head"><strong>Pictures</strong><span>Add a picture from the internet or one you drew. It goes into your journal below the line your cursor is on. Say what it shows and why it matters to your reading.</span></div>' +
      (isPreview() ? '<p class="lc-jp-hint">Teacher view · pictures can’t be added, moved or removed here.</p>' :
        '<div class="lc-jp-actions"><button type="button" class="secondary" data-jp="upload"' + (full ? ' disabled' : '') + '>⬆ Upload a picture</button><button type="button" class="secondary" data-jp="draw"' + (full ? ' disabled' : '') + '>✎ Draw a picture</button>' +
        '<span class="lc-jp-hint">' + (full ? 'That’s the most pictures one journal can hold (' + JP.maxImages + ').' : 'or copy a picture and paste it into your journal · a photo of a paper drawing works too') + '</span>' +
        '<input type="file" id="lcJpFile" accept="image/*" hidden></div>') +
      (q.length ? '<div class="lc-jp-grid">' + q.map(pendingHtml).join('') + '</div>' : '');
  }
  function refreshPanel(wk) { var p = $('lcJpPanel'); if (p && Number(p.getAttribute('data-wk')) === wk) p.innerHTML = panelHtml(wk); }
  function mount() {
    var wk = journalWeek(), old = $('lcJpPanel');
    if (!wk) { if (old) old.remove(); return; }
    var ed = $('journalText'), host = ed.closest('.focused-strategy-form') || ed.parentNode;
    var panel = old;
    if (!panel || !host.contains(panel)) { if (panel) panel.remove(); panel = document.createElement('div'); panel.id = 'lcJpPanel'; panel.className = 'lc-jp'; host.appendChild(panel); }
    panel.setAttribute('data-wk', wk);
    mountEditor(wk);
    panel.innerHTML = panelHtml(wk);
  }
  JP.refresh = mount;
  var _render = W.render;
  W.render = function () { var out = _render.apply(this, arguments); try { mount(); } catch (e) {} return out; };

  document.addEventListener('mousedown', function (e) { if (e.target && e.target.closest && e.target.closest('#lcJpPanel button')) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('[data-jp]'); if (!b || !b.closest('#lcJpPanel')) return;
    var wk = journalWeek(); if (!wk || isPreview()) return;
    var a = b.getAttribute('data-jp');
    if (a === 'upload') { var f = $('lcJpFile'); if (f) { f.value = ''; f.click(); } }
    else if (a === 'draw') openPad(wk);
    else if (a === 'retry') { var q = JP.pending.filter(function (x) { return x.key === b.getAttribute('data-jp-q'); })[0]; if (q) send(q); }
    else if (a === 'discard') { if (!W.confirm('Discard this picture? It hasn’t been saved.')) return; dropPending(b.getAttribute('data-jp-q')); refreshPanel(wk); }
  });
  document.addEventListener('change', function (e) {
    if (!e.target || e.target.id !== 'lcJpFile') return;
    var wk = journalWeek(), f = e.target.files && e.target.files[0]; if (!wk || !f) return;
    addFile(wk, f, 'upload');
  });

  // ------------------------------------------------------------------ paste / drop a picture
  function imageFrom(dt) {
    if (!dt) return null;
    var items = dt.items ? Array.prototype.slice.call(dt.items) : [];
    for (var i = 0; i < items.length; i++) if (items[i].kind === 'file' && /^image\//.test(items[i].type)) { var f = items[i].getAsFile(); if (f) return f; }
    var files = dt.files ? Array.prototype.slice.call(dt.files) : [];
    for (var j = 0; j < files.length; j++) if (/^image\//.test(files[j].type)) return files[j];
    return null;
  }
  function inJournal(t) { var el = t && (t.nodeType === 1 ? t : t.parentElement); return !!(el && el.closest && (el.closest('#journalText') || el.closest('#lcJpPanel'))); }
  // window capture runs before the page's own paste guards (which keep text plain)
  W.addEventListener('paste', function (e) {
    var wk = journalWeek(); if (!wk || !inJournal(e.target)) return;
    var f = imageFrom(e.clipboardData); if (!f) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (isPreview()) return;
    addFile(wk, f, 'paste');
  }, true);
  W.addEventListener('dragover', function (e) {
    var wk = journalWeek(); if (!wk || !inJournal(e.target)) return;
    var types = e.dataTransfer && e.dataTransfer.types ? Array.prototype.slice.call(e.dataTransfer.types) : [];
    if (types.indexOf('Files') < 0) return;
    e.preventDefault(); var p = $('lcJpPanel'); if (p) p.classList.add('is-drop');
  }, true);
  W.addEventListener('dragleave', function () { var p = $('lcJpPanel'); if (p) p.classList.remove('is-drop'); }, true);
  W.addEventListener('drop', function (e) {
    var p = $('lcJpPanel'); if (p) p.classList.remove('is-drop');
    var wk = journalWeek(); if (!wk || !inJournal(e.target)) return;
    var f = imageFrom(e.dataTransfer); if (!f) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (isPreview()) return;
    try { var ed = $('journalText'), r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null; if (ed && r && ed.contains(r.startContainer)) JP.range = { ed: ed, r: r }; } catch (err) {}

  }, true);

  // ------------------------------------------------------------------ shrink, then save to Drive
  function shrink(file, done) {

    var url = URL.createObjectURL(file), img = new Image();

        var s = Math.min(1, JP.maxSide / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));

    img.src = url;
  }
  function addFile(wk, file, kind) {
    if (list(wk).length + JP.pending.filter(function (x) { return x.email === me() && x.wk === wk; }).length >= JP.maxImages) { toast('That’s the most pictures one journal can hold (' + JP.maxImages + ').', true); return; }
    shrink(file, function (dataUrl, err) {
      if (!dataUrl) { toast(err || 'That picture couldn’t be added.', true); return; }
      queue(wk, dataUrl, kind);
    });
  }
  var LS = 'lc_jp_pending_';
  function keepLocal() { try { var mine = JP.pending.filter(function (x) { return x.email === me(); }).map(function (x) { return { key: x.key, email: x.email, wk: x.wk, kind: x.kind, preview: x.preview }; }); if (mine.length) W.localStorage.setItem(LS + me(), JSON.stringify(mine)); else W.localStorage.removeItem(LS + me()); } catch (e) {} }
  function dropPending(key) { JP.pending = JP.pending.filter(function (x) { return x.key !== key; }); keepLocal(); }
  function queue(wk, dataUrl, kind) {
    var q = { key: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), email: me(), wk: wk, kind: kind, preview: dataUrl, error: '' };
    JP.pending.push(q); keepLocal(); refreshPanel(wk); send(q);
  }
  function send(q) {
    q.error = ''; refreshPanel(q.wk);
    var m = /^data:([^;]+);base64,(.*)$/.exec(q.preview || ''); if (!m) { q.error = 'the picture is damaged'; refreshPanel(q.wk); return; }

      if (!r || !r.id) { q.error = 'no answer from the server'; refreshPanel(q.wk); return; }
      if (q.email !== me()) return;
      JP.cache[r.id] = q.preview;
      list(q.wk).push({ id: r.id, kind: q.kind, caption: '', source: q.kind === 'drawing' ? 'My drawing' : '', addedAt: new Date().toISOString() });
      dropPending(q.key);
      var ed = $('journalText');
      if (journalWeek() === q.wk && ed && ed.__jpObs) { insertMarker(ed, r.id); sync(ed, q.wk); }
      changed(q.wk); refreshPanel(q.wk);
      if (journalWeek() === q.wk) openCaption(q.wk, r.id);
    }, function (msg) { q.error = String(msg || 'it couldn’t be saved'); refreshPanel(q.wk); }, { quiet: true });
  }
  // pictures that never reached Drive on an earlier visit are offered again
  function restorePending() {
    var raw = null; try { raw = JSON.parse(W.localStorage.getItem(LS + me()) || 'null'); } catch (e) { raw = null; }
    (raw || []).forEach(function (x) { if (x && x.preview && !JP.pending.some(function (y) { return y.key === x.key; })) JP.pending.push({ key: x.key, email: x.email, wk: Number(x.wk), kind: x.kind, preview: x.preview, error: 'not sent before you left — press Try again' }); });
  }
  var _apply = W.applyLoadedStudentState;
  if (typeof _apply === 'function') W.applyLoadedStudentState = function () { var out = _apply.apply(this, arguments); try { if (!isPreview()) restorePending(); } catch (e) {} return out; };
  W.addEventListener('beforeunload', function (e) {
    if (!JP.pending.some(function (x) { return x.email === me(); })) return;
    e.preventDefault(); e.returnValue = 'A picture is still saving.'; return e.returnValue;
  });

  // ------------------------------------------------------------------ the drawing pad
  var COLORS = ['#111111', '#B0281F', '#1F5FB0', '#1D7A3A', '#E07B00', '#7A3DB0', '#7A4E2A', '#F2C200'];
  function openPad(wk) {
    var wrap = document.createElement('div'); wrap.className = 'lc-jp-pad'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', 'Draw a picture');
    wrap.innerHTML = '<div class="lc-jp-padbox"><div class="lc-jp-padtop"><strong>Draw a picture</strong><div class="lc-jp-tools">' +
      COLORS.map(function (c, i) { return '<button type="button" class="lc-jp-sw" data-pc="' + c + '" aria-label="Colour ' + (i + 1) + '" aria-pressed="' + (i === 0) + '" style="background:' + c + '!important"></button>'; }).join('') +
      '<button type="button" class="secondary" data-pt="thin" aria-pressed="false">Thin</button><button type="button" class="secondary" data-pt="med" aria-pressed="true">Medium</button><button type="button" class="secondary" data-pt="thick" aria-pressed="false">Thick</button>' +
      '<button type="button" class="secondary" data-pt="eraser" aria-pressed="false">Eraser</button><button type="button" class="secondary" data-pa="undo">↶ Undo</button><button type="button" class="secondary" data-pa="clear">Clear</button></div></div>' +
      '<canvas class="lc-jp-canvas" width="1400" height="980"></canvas>' +
      '<div class="lc-jp-padfoot"><button type="button" class="secondary" data-pa="cancel">Cancel</button><button type="button" data-pa="add">Add to my journal</button></div></div>';
    document.body.appendChild(wrap);
    var cv = wrap.querySelector('canvas'), g = cv.getContext('2d'), color = COLORS[0], size = 6, eraser = false, drawing = false, last = null, undo = [], dirty = false;
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.lineCap = 'round'; g.lineJoin = 'round';
    function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
    function snap() { try { undo.push(g.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 25) undo.shift(); } catch (e) {} }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.setPointerCapture(e.pointerId); snap(); drawing = true; last = pos(e); dot(last, e); });
    cv.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pos(e); line(last, p, e); last = p; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { drawing = false; last = null; }); });
    function width(e) { var pr = e && e.pressure && e.pointerType === 'pen' ? 0.4 + e.pressure : 1; return (eraser ? size * 4 : size) * pr; }
    function dot(p, e) { g.beginPath(); g.fillStyle = eraser ? '#fff' : color; g.arc(p.x, p.y, width(e) / 2, 0, Math.PI * 2); g.fill(); dirty = true; }
    function line(a, b, e) { g.beginPath(); g.strokeStyle = eraser ? '#fff' : color; g.lineWidth = width(e); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); dirty = true; }
    function press(sel, el) { Array.prototype.forEach.call(wrap.querySelectorAll(sel), function (x) { x.setAttribute('aria-pressed', String(x === el)); }); }
    function close() { wrap.remove(); document.removeEventListener('keydown', onKey, true); }
    function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); if (!dirty || W.confirm('Close the drawing without adding it?')) close(); } if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); } }
    function doUndo() { var s = undo.pop(); if (s) g.putImageData(s, 0, 0); }
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-pc')) { color = b.getAttribute('data-pc'); eraser = false; press('[data-pc]', b); var er = wrap.querySelector('[data-pt="eraser"]'); er.setAttribute('aria-pressed', 'false'); return; }
      var t = b.getAttribute('data-pt');
      if (t === 'eraser') { eraser = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(eraser)); return; }
      if (t) { size = t === 'thin' ? 3 : t === 'thick' ? 14 : 6; press('[data-pt="thin"],[data-pt="med"],[data-pt="thick"]', b); return; }
      var a = b.getAttribute('data-pa');
      if (a === 'undo') doUndo();
      else if (a === 'clear') { snap(); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); }
      else if (a === 'cancel') { if (!dirty || W.confirm('Close the drawing without adding it?')) close(); }
      else if (a === 'add') {
        if (!dirty) { toast('Draw something first.', true); return; }
        var out = document.createElement('canvas'), s = Math.min(1, JP.maxSide / cv.width); out.width = Math.round(cv.width * s); out.height = Math.round(cv.height * s);
        out.getContext('2d').drawImage(cv, 0, 0, out.width, out.height);

      }
    });
  }

  // ------------------------------------------------------------------ PDF / AI text: say where a picture is
  var _strip = W.stripHtmlToText;
  if (typeof _strip === 'function') W.stripHtmlToText = function (html) {
    if (typeof html === 'string' && html.indexOf('data-jp') >= 0) html = html.replace(/<div\b[^>]*\bdata-jp="([A-Za-z0-9_-]{6,128})"[^>]*>\s*<\/div>/g, function (_, id) {
      var p = findPic(id) || {}, s = sourceLine(p);
      return '<div>\n[Picture' + (p.caption ? ': ' + esc(p.caption) : '') + (s ? ' — ' + esc(s) : '') + ']\n</div>';
    });
    return _strip.call(this, html);
  };

  // ------------------------------------------------------------------ teacher view (marking screen)
  function figureHtml(p, cls) {
    var s = sourceLine(p, 'teacher');
    return '<figure class="' + cls + '"><div class="lc-jp-img" data-jp-img="' + esc(p.id) + '" data-jp-alt="' + esc(p.caption || 'Journal picture') + '"><span class="lc-jp-wait">Loading picture…</span></div>' +
      '<figcaption>' + (p.caption ? esc(p.caption) : '<em>No caption</em>') + '<small>' + (s ? esc(s) : 'Source not given') + '</small></figcaption></figure>';
  }
  /** The journal's HTML with each picture drawn where the student put it. placed[id] = true for each. */
  W.lcJournalInlineHtml = function (html, pics, placed) {
    var by = {}; (Array.isArray(pics) ? pics : []).forEach(function (p) { if (p && p.id) by[p.id] = p; });
    var out = String(html || '').replace(/<div data-jp="([A-Za-z0-9_-]{6,128})"><\/div>/g, function (_, id) {
      if (placed) placed[id] = true;
      return figureHtml(by[id] || { id: id }, 'lc-jp-fig');
    });
    if (out !== html) setTimeout(function () { fillImages(document); }, 0);
    return out;
  };
  /** Read-only gallery for pictures that aren't placed in the writing. */
  W.lcJournalPicturesHtml = function (pics) {
    if (!Array.isArray(pics) || !pics.length) return '';
    setTimeout(function () { fillImages(document); }, 0);
    return '<div class="lch-sec lc-jp-t"><h5>Pictures (' + pics.length + ')</h5><div class="lc-jp-grid">' + pics.map(function (p) { return figureHtml(p, 'lc-jp-card'); }).join('') + '</div></div>';
  };
  // marking rows are repainted in place: fill any new picture placeholders
  try { new MutationObserver(function () { if (document.querySelector('[data-jp-img]:not([data-jp-done])')) fillImages(document); }).observe(document.body || document.documentElement, { childList: true, subtree: true }); } catch (e) {}

  W.__MB.JournalPictures = 'ok';
})();
