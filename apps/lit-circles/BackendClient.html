<!-- ======================================================================
     Literature Circles — teacher dashboard + grading (BackendClient)
     Release 2026-09-27a. Spliced into Index.html by include_('BackendClient').
     Same design as the Macbeth / Short Story apps: class pills → Grading tiles →
     Gradebook → Students → Release & Resources, and one marking screen per step.
     Every handler is delegated from the document (data-lch="…"), so a partial
     repaint never leaves a control unbound.
     ====================================================================== -->
<style id="lchStyles">
.lch{--lch-ink:#17372b;--lch-muted:#5d7368;--lch-line:#dce9e2;--lch-soft:#f6faf8;--lch-green:#176944;--lch-green2:#2f7a55;--lch-red:#b42318;--lch-red2:#8c1d17;--lch-gold:#9a6400;max-width:1240px;margin:0 auto;color:var(--lch-ink)}
.lch *{box-sizing:border-box}
.lch button.lch-btn,.lch .lch-btn{clip-path:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 13px;border-radius:10px;border:1px solid #bcd7c8;background:#fff;color:#1c5c40;font:700 13.5px/1.2 Roboto,Arial,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer;box-shadow:none;white-space:nowrap}
.lch button.lch-btn:hover{background:#f0f8f4;border-color:#7fb99a;box-shadow:none}
.lch button.lch-btn.primary{background:#176944;border-color:#176944;color:#fff}
.lch button.lch-btn.primary:hover{background:#0f5536;border-color:#0f5536}
.lch button.lch-btn.danger{color:#a3261c;border-color:#e3b5ae}
.lch button.lch-btn.small{min-height:30px;padding:5px 10px;font-size:12.5px;border-radius:8px}
.lch button.lch-btn:disabled{opacity:1;color:#6b7f75;background:#f1f5f3;border-color:#d5e2db;cursor:wait}
.lch-classbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.lch button.lch-pill{clip-path:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid #cfe0d7;background:#fff;color:#17372b;font:800 13.5px Roboto,Arial,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer;box-shadow:none}
.lch button.lch-pill:hover{border-color:#7fb99a;background:#f5fbf8;box-shadow:none}
.lch button.lch-pill.active{background:#17372b;border-color:#17372b;color:#fff}
.lch-pill-period{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#e6f2ec;color:#17372b;font-size:12px;font-weight:900}
.lch button.lch-pill.active .lch-pill-period{background:#fff;color:#17372b}
.lch-spacer{flex:1}
.lch button.lch-chip{clip-path:none;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:5px 12px;border-radius:999px;border:1px solid #cfe0d7;background:#fff;color:#35554a;font:750 12.5px Roboto,Arial,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer;box-shadow:none}
.lch button.lch-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#b9c7c0}
.lch button.lch-chip.is-ok{color:#1e6b43;border-color:#bfe0cb;background:#f2faf5}.lch button.lch-chip.is-ok::before{background:#2f7a55}
.lch button.lch-chip.is-warn{color:#8a5a00;border-color:#ead8a9;background:#fffaf0}.lch button.lch-chip.is-warn::before{background:#c99a2e}
.lch button.lch-chip.is-bad{color:#a3261c;border-color:#efc7c1;background:#fff6f4}.lch button.lch-chip.is-bad::before{background:#b42318}
.lch-newclass[hidden]{display:none!important}
.lch-newclass{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px;padding:14px 16px;border:1px dashed #b9d4c6;border-radius:14px;background:#fbfdfc}
.lch-newclass label{margin:0 0 4px}.lch-newclass input{width:220px}
.lch-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 0 16px;padding:20px 24px;border:1px solid var(--lch-line);border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(23,55,43,.06)}
.lch-eyebrow{display:block;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#176944}
.lch-hero h2{margin:4px 0 6px;font-size:28px;line-height:1.1}
.lch-hero h2 .lch-period{font-size:15px;font-weight:800;color:#48685a;margin-left:8px}
.lch-hero p{margin:0;color:var(--lch-muted);font-size:14px}
.lch-hero p b{color:#17372b;letter-spacing:.06em}
.lch-hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.lch-card{padding:20px 22px!important;margin:0 0 18px!important;border-radius:20px!important}
.lch-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lch-card-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.lch-card-title h3{margin:0;font-size:20px;color:#17372b}
.lch-card-actions{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.lch-card-sub{margin:6px 0 2px;color:var(--lch-muted);font-size:13.5px;line-height:1.45;max-width:820px}
.lch-mini{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;border:1px solid #d5e5dc;background:#f4faf7;color:#2c4e40;font-size:12px;font-weight:800;white-space:nowrap}
.lch-mini.is-todo{background:#b42318;border-color:#b42318;color:#fff}
.lch-mini.is-clear{background:#e8f5ec;border-color:#bfe0cb;color:#1e6b43}
details.lch-card>summary{list-style:none;cursor:pointer}
details.lch-card>summary::-webkit-details-marker{display:none}
details.lch-card>summary .lch-fold{font-size:13px;font-weight:800;color:#1c5c40}
details.lch-card[open]>summary .lch-fold-closed,details.lch-card:not([open])>summary .lch-fold-open{display:none}
/* grading tiles */
.lch-week-group{margin-top:18px}
.lch-week-group:first-child{margin-top:12px}
.lch-group-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 10px;padding:0 0 8px;border-bottom:2px solid var(--acc,#3f8f68)}
.lch-group-head h4{margin:0;font-size:16px;font-weight:850;color:#17372b}
.lch-group-count{font-size:12.5px;font-weight:700;color:#4f6a5e}
.lch-group-waiting{font-size:12.5px;font-weight:850;color:#b42318}
.lch-group-clear{font-size:12.5px;font-weight:800;color:#1e6b43}
.lch-group-actions{margin-left:auto;display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px}
.lch-group-msg{margin:0 0 10px}
/* 2026-10-18c: five tiles across, all the same size (Step 1, Step 2, Reading Quiz, Step 3, Step 4).
   Narrow tiles: smaller title, stat labels may wrap, so nothing runs into anything else. */
.lch-tile-grid.lch-step-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:0}
.lch .lch-step-grid .lch-tile-head{padding:12px 12px 0;gap:6px}
.lch .lch-step-grid .lch-tile-body{padding:10px 12px 0}
.lch .lch-step-grid .lch-tile-title{font-size:17px!important;line-height:1.15}
.lch .lch-step-grid .lch-tile-eyebrow{font-size:10px;letter-spacing:.06em}
.lch .lch-step-grid .lch-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lch .lch-step-grid .lch-stat dt{white-space:normal!important;font-size:9.5px!important;line-height:1.15;letter-spacing:.02em!important;min-height:22px}
.lch .lch-step-grid .lch-stat dd{font-size:19px}
.lch .lch-step-grid .lch-tile-note{font-size:11.5px}
.lch .lch-step-grid button.lch-open{margin:12px 12px 0;padding:7px 8px;font-size:13px;line-height:1.2;white-space:normal;text-align:center}
.lch .lch-step-grid .lch-tile-foot{padding:10px 12px 11px}
.lch .lch-step-grid .lch-canvas-row{flex-wrap:wrap;row-gap:6px}
.lch .lch-step-grid .lch-status{font-size:12px;padding:0 7px;height:26px;min-width:26px}
.lch .lch-step-grid .lch-status.is-live{font-size:9.5px;padding:0 6px}
.lch-bar-todo.is-soft{background:#d99a2b}
@media(max-width:1100px){.lch-tile-grid.lch-step-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.lch-tile-grid.lch-step-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.lch-tile-grid.lch-step-grid{grid-template-columns:1fr}.lch-step-grid>.lch-tile.is-quiz{grid-column:auto}.lch-group-actions{margin-left:0}}
.lch-tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px;margin-top:14px}
.lch-tile{position:relative;display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--lch-line);border-top:5px solid var(--acc,#3f8f68);border-radius:16px;box-shadow:0 1px 2px rgba(20,47,36,.05);transition:box-shadow .15s ease}
.lch-tile:hover{box-shadow:0 10px 24px rgba(20,47,36,.10)}
.lch-tile.menu-open{z-index:6}
/* 2026-10-18e: the Library theme clips every tile to its cut-corner shape (clip-path), which also clips
   anything that sticks out of the tile. In the narrow five-across tiles the ⋯ menu (246px) is wider
   than the tile, so it was cut off. Here the menu is pinned to the tile's own width, above its foot. */
.lch-step-grid .lch-tile-foot{position:relative}
.lch-step-grid .lch-more{position:static}
.lch-step-grid .lch-menu{left:6px;right:6px;min-width:0;max-height:min(340px,70vh);overflow:auto}
.lch .lch-step-grid .lch-menu button{white-space:normal;line-height:1.3;padding:8px 9px;font-size:13px}
.lch-tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 0;cursor:pointer}
.lch-tile-id{min-width:0}
.lch-tile-eyebrow{display:block;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#4f6a5e}
.lch-tile-title{margin:3px 0 4px;font-size:19px;line-height:1.15;font-weight:800;color:#17372b}
.lch-tile-meta{display:flex;flex-wrap:wrap;font-size:12px;font-weight:700;color:#4f6a5e}
.lch-tile-meta span+span::before{content:"·";margin:0 7px;color:#9fb3a9}
.lch-status{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.lch-status.is-needs{background:#b42318;color:#fff;box-shadow:0 2px 6px rgba(140,29,23,.25)}
.lch-status.is-needs.has-redo{background:#8c1d17}
.lch-status.is-caught{width:28px;padding:0;background:#e8f5ec;color:#1e6b43;border:1px solid #bfe0cb}
.lch-status.is-excluded{background:#f1f3f2;color:#4b5563;border:1px solid var(--lch-line);font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.lch-tile-body{flex:1;padding:12px 16px 0;cursor:pointer}
.lch-bar{display:flex;height:8px;border-radius:999px;background:#e7eeea;overflow:hidden}
.lch-bar-done{background:#3f7a5a}.lch-bar-todo{background:#c8412f}
.lch-stats{display:flex;justify-content:space-between;gap:8px;margin:10px 0 0}
.lch-stat{margin:0;min-width:0}
.lch-stat dt{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#5d7368;white-space:nowrap}
.lch-stat dd{margin:1px 0 0;font-size:20px;line-height:1.15;font-weight:900;color:#17372b;font-variant-numeric:tabular-nums}
.lch-stat.is-todo dd{color:#b42318}
.lch-tile-note{margin:8px 0 0;font-size:12px;line-height:1.4;color:#5d7368}
.lch-excluded-note{margin:0;padding:10px 12px;background:#f8faf9;border:1px dashed #c8d7cf;border-radius:10px;font-size:12.5px;line-height:1.45;color:#4b5563}
.lch button.lch-open{margin:14px 16px 0;min-height:42px;font-size:14px}
.lch-open-sub{font-weight:650;opacity:.92}
.lch-tile-foot{display:grid;gap:8px;margin-top:14px;padding:11px 16px 12px;border-top:1px solid #e7efea;background:#f9fcfa;border-radius:0 0 15px 15px;cursor:default}
.lch-switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;font-weight:750;margin:0;color:#4b5563;text-transform:none;letter-spacing:0}
.lch-switch input{position:absolute;left:0;top:50%;transform:translateY(-50%);width:36px;height:20px;margin:0;opacity:0;cursor:pointer;z-index:1}
.lch-switch-track{position:relative;flex:0 0 36px;width:36px;height:20px;border-radius:999px;background:#b9c4bf;transition:background .15s ease}
.lch-switch-track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s ease}
.lch-switch input:checked+.lch-switch-track{background:#2f7a55}
.lch-switch input:checked+.lch-switch-track::after{transform:translateX(16px)}
.lch-switch input:focus-visible+.lch-switch-track{outline:2px solid #176944;outline-offset:2px}
.lch-switch.is-on .lch-switch-text{color:#1e6b43}
.lch-canvas-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.lch-canvas-state{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0;font-size:12px;font-weight:700;color:#4f6a5e}
.lch-canvas-state>span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lch-canvas-state::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#b9c4bf}
.lch-canvas-state.is-ok::before{background:#2f7a55}.lch-canvas-state.is-pending::before{background:#c99a2e}
.lch-canvas-actions{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.lch-more{position:relative}
.lch-more>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:1px solid #c9d9d0;border-radius:8px;background:#fff;color:#374151;font-size:17px;font-weight:900;line-height:1;cursor:pointer;user-select:none}
.lch-more>summary::-webkit-details-marker{display:none}
.lch-more>summary:hover,.lch-more[open]>summary{border-color:#176944;color:#176944}
.lch-menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:30;min-width:246px;padding:6px;background:#fff;border:1px solid var(--lch-line);border-radius:12px;box-shadow:0 16px 36px rgba(20,47,36,.18)}
.lch .lch-menu button{clip-path:none;display:block;width:100%;margin:0;padding:9px 11px;border:0;border-radius:8px;background:transparent;text-align:left;font:650 13.5px Roboto,Arial,sans-serif;color:#17372b;text-transform:none;letter-spacing:0;cursor:pointer;box-shadow:none}
.lch .lch-menu button:hover{background:#f0f7f3;box-shadow:none}
.lch-menu hr{margin:5px 4px;border:0;border-top:1px solid #e7efea}
.lch .lch-menu button.is-danger{color:#a3261c}.lch .lch-menu button.is-restore{color:#1e6b43}
.lch-tile-msg{padding:8px 10px;border:1px solid #d5e2ef;border-radius:8px;background:#f4f8fb;color:#27405a;font-size:12px;line-height:1.45;word-break:break-word}
.lch-tile-msg:empty{display:none}
.lch-tile-msg.is-error{border-color:#efc7c1;background:#fff6f4;color:#8c1d17}
.lch-tile.is-nograde{background:#fafbfa}
.lch-loading{display:flex;align-items:center;gap:10px;padding:22px 4px;color:#5d7368;font-size:14px}
/* gradebook */
.lch-gb-scroll{overflow:auto;max-width:100%;margin-top:12px;border:1px solid #e3ece7;border-radius:14px}
.lch-gb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.lch-gb th,.lch-gb td{padding:6px 3px;border-bottom:1px solid #edf2ef;text-align:center;white-space:nowrap;background:#fff}
.lch-gb thead th{position:sticky;top:0;z-index:2;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#4f6a5e;font-weight:900;background:#f7fbf9}
.lch-gb thead tr.lch-gb-weeks th{font-size:11.5px;color:#17372b;border-bottom:0}
.lch-gb .gb-name{position:sticky;left:0;z-index:3;text-align:left;min-width:170px;max-width:220px;padding-left:12px;box-shadow:1px 0 0 #e3ece7;white-space:normal}
.lch-gb thead .gb-name{z-index:4}
.lch-gb .gb-name small{display:block;color:#5d7368;font-weight:500}
.lch-gb .gb-wk{border-left:2px solid #e3ece7}
.lch-gb .gb-wtot{font-weight:900;background:#f9fcfa}
.lch-gb .gb-unit{border-left:2px solid #cfe0d7;font-weight:900}
.lch-gb .gb-unit small{display:block;font-size:10.5px;color:#5d7368;font-weight:700}
.lch button.gb-cell{clip-path:none;min-width:28px;min-height:28px;padding:3px 6px;border:1px solid transparent;border-radius:7px;background:transparent;color:#17372b;font:800 13px Roboto,Arial,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer;box-shadow:none}
.lch button.gb-cell:hover{border-color:#7fb99a;background:#f2faf6;box-shadow:none}
.lch button.gb-cell.is-empty{color:#6b7f75;font-weight:500}
.lch button.gb-cell.is-pending{color:#9a6400}
.lch button.gb-cell.is-redo{color:#2c3b7a}
.lch button.gb-cell.is-ex{color:#6b7280;font-weight:600;font-style:italic}
.lch-gb-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:12px;color:#4f6a5e}
.lch-gb-legend b{color:#17372b}
/* students */
.lch-groupsview{margin:14px 0 18px}
.lch-gv-head{display:flex;align-items:center;gap:10px}.lch-gv-head h4{margin:0;font-size:18px}
.lch-gv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:10px}
.lch-grp{border:1px solid #d8e2dc;padding:12px 14px;background:#fff}
.lch-grp.is-bad{border-color:#c47a00;box-shadow:inset 4px 0 0 #e0a100}
.lch-grp-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.lch-grp-head strong{font-size:15.5px}.lch-grp-head span{font-size:12.5px;color:#5d6470}
.lch-grp ul{list-style:none;margin:8px 0 0;padding:0}
.lch-grp li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #eef2ef;font-size:13.5px}
.lch-grp li small{color:#5d6470}.lch-grp li em{display:block;font-style:normal;font-size:12.5px;color:#8a4b00}
.lch-grp-note{margin:6px 0 0;font-size:12.5px;color:#8a4b00}
.lch-roster{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.lch-roster th,.lch-roster td{padding:9px 8px;border-bottom:1px solid #edf2ef;text-align:left;vertical-align:top}
.lch-roster th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#4f6a5e}
.lch-roster td small{display:block;color:#5d7368}
.lch-roster select{width:auto;max-width:230px;padding:6px 8px;border-radius:9px;font-size:13px}
.lch-weekdots{display:flex;gap:4px}
.lch-weekdot{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 6px;border-radius:999px;border:1px solid #d5e5dc;font-size:11px;font-weight:800;color:#4f6a5e;background:#fff}
.lch-weekdot.is-done{background:#e8f5ec;border-color:#bfe0cb;color:#1e6b43}
.lch-weekdot.is-going{background:#fffaf0;border-color:#ead8a9;color:#8a5a00}
.lch-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.lch-tool{padding:14px 16px;border:1px solid #e3ece7;border-radius:14px;background:#fbfdfc}
.lch-tool h4{margin:0 0 6px;font-size:15px;color:#17372b}
.lch-tool p{margin:0 0 10px;font-size:13px;color:#5d7368;line-height:1.45}
.lch-tool textarea{min-height:84px}
.lch-joincode{font-size:24px;font-weight:900;letter-spacing:.12em;color:#17372b}
/* release */
.lch-access{display:grid;gap:10px;margin-top:14px}
.lch-access-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 14px;border:1px solid #e3ece7;border-radius:14px;background:#fff;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;color:#17372b;font-weight:400}
.lch-access-item.is-on{border-color:#bfe0cb;background:#f7fcf9}

  // 2026-10-18f: open on the class the teacher had open last. The page used to start on the first
  // class in the list (the test class) after every update or reload. The server keeps the last
  // class per teacher (any device); this browser keeps a copy in case that read fails.
  function lastClassKey() { return 'lch_last_class::' + keyOf((W.platform.bootstrap && W.platform.bootstrap.email) || ''); }
  function rememberClass(id) {
    id = keyOf(id); if (!id) return;
    try { W.localStorage.setItem(lastClassKey(), id); } catch (e) {}
    if (LCH.rememberedClass === id) return;
    LCH.rememberedClass = id;
    rpc('rememberLiteratureTeacherClass', { classId: id }).catch(function () { if (LCH.rememberedClass === id) LCH.rememberedClass = ''; });
  }
  function restoreLastClass() {
    if (LCH.classRestored) return; LCH.classRestored = true;
    var b = W.platform.bootstrap || {}, local = '';
    try { local = W.localStorage.getItem(lastClassKey()) || ''; } catch (e) {}
    LCH.rememberedClass = keyOf(b.lastClassId || '');
    var want = [b.lastClassId, local, b.defaultClassId].map(keyOf).filter(function (id) { return id && W.platformClassById(id); })[0];
    if (want) W.platform.activeClassId = want;
  }
  W.showTeacherPortal = function () {
    W.platform.mode = 'teacher'; W.renderHeader();
    if (!W.platform.bootstrap) { W.loadPlatformBootstrap(W.showTeacherPortal); return; }
    var classes = W.platform.bootstrap.classes || [];
    if (!classes.length) { W.platform.teacherView = 'dashboard'; renderNoClasses(); return; }
    // The Teacher button always means "my dashboard" (browser Back restoring a marking route is the exception).
    var restoring = !!(W.lcHistory && W.lcHistory.applying);
    if (!restoring) restoreLastClass();
    if (!W.platform.activeClassId || !W.platformClassById(W.platform.activeClassId)) W.platform.activeClassId = classes[0].classId;
    if (!restoring || !W.platform.teacherView || ['dashboard', 'marking', 'quizzes'].indexOf(W.platform.teacherView) < 0) W.platform.teacherView = 'dashboard';
    W.loadTeacherDashboard(W.platform.activeClassId);
  };
  W.renderTeacherNoClasses = function () { renderNoClasses(); };
  W.selectTeacherClass = function (id) { switchClass(id); };
  /** Every (re)load of a class waits for marks still saving, so it never paints counts from before them. */
  W.loadTeacherDashboard = function (id) {
    id = keyOf(id || classId()); W.platform.activeClassId = id; rememberClass(id);
    var app = $('app'); keepAddEmails();
    if (!dash()) app.innerHTML = '<div class="lch"><div class="lch-loading"><span class="spinner"></span> ' + (LCH.saves.size ? 'Saving your last marks…' : 'Loading your class…') + '</div></div>';
    var sentAt = 0;
    return waitForSaves().then(function () {
      sentAt = Date.now();
      return Promise.all([loadDashboardData(id), loadHub(id, false, true).catch(function (e) { return null; })]);
    }).then(function (res) {
      if (keyOf(W.platform.activeClassId) !== id) return;
      var keep = editedSince(id, sentAt) && dash() ? settings() : null;
      W.platform.dashboard = res[0];
      if (keep) W.platform.dashboard.classInfo.settings = keep;
      else if (res[1] && !editedSince(id, sentAt)) applySettings(res[1].settings, id);
      LCH.lastView = W.platform.teacherView === 'marking' ? 'marking' : W.platform.teacherView === 'quizzes' ? 'quizzes' : 'dashboard'; // fresh data: no second refresh
      W.renderTeacherDashboard();
    }).catch(function (e) {
      app.innerHTML = '<div class="lch"><div class="card lch-card"><h3>Couldn’t load this class</h3><p class="lch-card-sub">' + esc(errMsg(e)) + '</p><button class="lch-btn primary" data-lch="reload-class">Try again</button></div></div>';
    });
  };
  W.renderTeacherDashboard = function () {
    try { if (typeof W.lcHistorySyncBeforeRender === 'function') W.lcHistorySyncBeforeRender(); } catch (e) {}
    if (W.platform.mode !== 'teacher') return;
    if (!dash()) { W.loadTeacherDashboard(classId()); return; }
    var view = W.platform.teacherView === 'marking' ? 'marking' : W.platform.teacherView === 'quizzes' ? 'quizzes' : 'dashboard';
    var cameBack = (LCH.lastView === 'marking' || LCH.lastView === 'quizzes') && view === 'dashboard';
    LCH.lastView = view;
    if (view === 'marking') renderMarking(); else if (view === 'quizzes') renderQuizzes(); else renderDashboard();
    if (cameBack) refreshAfterGrading();
  };

  function switchClass(id) {
    id = keyOf(id); if (id === classId() && dash()) return;
    keepAddEmails();
    W.platform.activeClassId = id; W.platform.dashboard = null; W.platform.teacherView = 'dashboard'; dropFocus();
    W.loadTeacherDashboard(id);
  }

  }

      '<p class="lch-card-sub">One row per week, one tile per step. You mark Step 1 (Lit Circle Submission, 7) and Step 4 (Reflection, 7) on their rubrics; Step 2 (Plan, 3), the Reading Quiz (10) and Step 3 (Peer, 2) score themselves and you can adjust them. Counts refresh every minute.</p>' +

  // 10-08a: one row per week, one tile per step (like Macbeth's grading tiles). The week's

  function weekGroupHtml(t) {

      '<div class="lch-group-head"><h4>Week ' + w + ' · ' + esc(WEEK_TITLES[w - 1]) + '</h4><span class="lch-group-count">' + (t.allExcluded ? '' : t.pointsPossible + ' pts') + '</span>' + waiting +
      '<span class="lch-group-actions">' + sw + push + '</span></div>' +
      '<div class="lch-tile-msg lch-group-msg" id="lchMsg-week-' + w + '" aria-live="polite">' + (LCH.msgs[classId() + ':week-' + w] || '') + '</div>' +
      '<div class="lch-tile-grid lch-step-grid">' + STAGES.map(function (st) { return stepTileHtml(t, st, busy); }).join('') + '</div></section>';
  }
  function canvasStateFor(t) {
    var s = settings(), linked = 0, last = '';
    STAGES.forEach(function (st) { var x = (t.schedule || {})[st] || {}; if (x.linked) linked++; if (x.lastGradeSyncAt && x.lastGradeSyncAt > last) last = x.lastGradeSyncAt; });
    if (!s.canvas.courseId) return { cls: 'is-off', text: 'Canvas not linked', can: false };

  }
  function stepCanvasState(t, st) {
    var s = settings(), x = (t.schedule || {})[st] || {};
    if (!s.canvas.courseId) return { cls: 'is-off', text: 'Canvas not linked', can: false };
    if (st === 'quiz' && !x.linked && !((((t.stages || {}).quiz || {}).quiz || {}).approved)) return { cls: 'is-off', text: 'No quiz yet', title: 'A Canvas assignment is made once a group has an approved quiz.', can: false };

  }
  function stepTileHtml(t, st, weekBusy) {

    var cv = stepCanvasState(t, st), due = ((t.schedule || {})[st] || {}).dueAt || '', ex = !!x.allExcluded;
    var qi = x.quiz || {}, qReady = st === 'quiz' && qi.groups > 0 && qi.approved >= qi.groups, qOpen = st === 'quiz' && quizOpen(w);

    var st8 = ex ? { kind: 'excluded' } : meta.teacher ? (x.toGrade ? { kind: 'needs', count: x.toGrade, redo: x.redo } : (x.graded ? { kind: 'done' } : { kind: 'none' })) : { kind: 'auto' };

      : st8.kind === 'done' ? '<span class="lch-status is-caught" title="Everything turned in is graded">✓</span>'

    if (st === 'quiz' && !ex && qOpen) badge = '<span class="lch-status is-live" title="Students can take this quiz right now">Open now</span>';

    return '<article class="lch-tile ' + (ex ? 'is-nograde' : '') + (st === 'quiz' ? ' is-quiz' : '') + (LCH.openMenu === menuKey(asg) ? ' menu-open' : '') + '" style="--acc:' + WEEK_STRIPE[w - 1] + '" data-week="' + w + '" data-stage="' + st + '" aria-label="Week ' + w + ' ' + meta.step + '">' +
      '<div class="lch-tile-head" data-lch="' + openAct + '" data-week="' + w + '" data-stage="' + st + '"><div class="lch-tile-id"><span class="lch-tile-eyebrow">Week ' + w + ' · ' + (st === 'quiz' ? 'Quiz' : meta.step) + '</span><h4 class="lch-tile-title">' + esc(meta.title) + '</h4><span class="lch-tile-meta"><span>' + (ex ? 'Not graded' : meta.max + ' pts') + '</span>' + (due ? '<span title="Due ' + esc(shortDate(due, true)) + '">Due ' + esc(shortDate(due)) + '</span>' : '') + '</span></div>' + badge + '</div>' +

      '<div class="lch-tile-foot">' + qsw + '<div class="lch-canvas-row"><span class="lch-canvas-state ' + cv.cls + '" title="' + esc(cv.title || cv.text) + '"><span>' + esc(cv.text) + '</span></span><span class="lch-canvas-actions">' + push + menu + '</span></div><div class="lch-tile-msg" id="lchMsg-' + asg + '" aria-live="polite">' + (LCH.msgs[classId() + ':' + asg] || '') + '</div></div></article>';

  // ---------- Gradebook
  function cellFor(s, st) {
    var x = s.stages[st] || {}, v = num(x.effective), status = x.status;
    if (status === 'excluded') return { text: 'ex', cls: 'is-ex', tip: 'Left out' + (x.classExcluded ? ' for the class' : ' for this student') };
    if (status === 'na') return { text: 'n/a', cls: 'is-ex', tip: st === 'quiz' ? 'Their group has no quiz this week' : 'No groupmates to rate' };
    if (status === 'inProgress') return { text: '…', cls: 'is-pending', tip: 'Started the quiz — it is still open' };
    if (status === 'notTaken') return { text: '—', cls: 'is-empty', tip: 'Hasn’t taken the quiz' };
    if (status === 'pending') return { text: '•', cls: 'is-pending', tip: 'Turned in — waiting for you to mark it' };
    if (status === 'redo') return { text: fmt(v) + '↻', cls: 'is-redo', tip: 'Redone after you marked it ' + fmt(v) + '/' + x.max };
    if (status === 'missing') return { text: '—', cls: 'is-empty', tip: 'Not turned in' };
    if (status === 'notStarted') return { text: '—', cls: 'is-empty', tip: 'Week not started' };
    if (status === 'override') return { text: fmt(v), cls: '', tip: 'Adjusted by you: ' + fmt(v) + '/' + x.max };
    if (status === 'auto') return { text: fmt(v), cls: '', tip: (x.complete ? 'Complete' : 'Not complete') + ' — scored automatically' };
    return { text: fmt(v), cls: '', tip: fmt(v) + '/' + x.max };
  }
  function gradebookInner(d) {
    var students = d.students || [], s = settings();
    // A week nobody has started and students can't open yet folds to one narrow column.
    var active = [1, 2, 3, 4].map(function (w) { return s.releasedWeeks.indexOf(w) >= 0 || students.some(function (stu) { var wk = stu.summary && stu.summary.weeks && stu.summary.weeks[w - 1]; return wk && wk.started; }); });
    // The Reading Quiz column only appears in a week where some group has a quiz.
    var hasQuiz = [1, 2, 3, 4].map(function (w) { return students.some(function (stu) { var wk = stu.summary && stu.summary.weeks && stu.summary.weeks[w - 1], q = wk && wk.stages && wk.stages.quiz; return q && q.status && q.status !== 'na' && q.status !== 'excluded'; }); });
    function weekStages(w) { return STAGES.filter(function (st) { return st !== 'quiz' || hasQuiz[w - 1]; }); }

    var head2 = '<tr>' + [1, 2, 3, 4].map(function (w) {
      if (!active[w - 1]) return '<th class="gb-wk" title="Not open to students and nobody has started it">not open</th>';
      return weekStages(w).map(function (st, i) { return '<th class="' + (i === 0 ? 'gb-wk' : '') + '" title="' + esc(stepHeading(st)) + ' (' + STAGE[st].max + ' pts)">' + STAGE[st].abbr + '<br><span style="font-weight:600">/' + STAGE[st].max + '</span></th>'; }).join('') + '<th class="gb-wtot">Week<br><span style="font-weight:600">/' + weekMax(w) + '</span></th>';
    }).join('') + '</tr>';
    var rows = students.map(function (stu) {
      var sum = stu.summary || { weeks: [] };
      var cells = (sum.weeks || []).map(function (wk) {
        if (!active[wk.week - 1]) return '<td class="gb-wk"><span style="color:#6b7f75">—</span></td>';
        var c = weekStages(wk.week).map(function (st, i) {
          var cell = cellFor(wk, st);
          return '<td class="' + (i === 0 ? 'gb-wk' : '') + '"><button class="gb-cell ' + cell.cls + '" data-lch="gb-jump" data-week="' + wk.week + '" data-stage="' + st + '" data-email="' + esc(stu.email) + '" title="' + esc(stu.name + ' · Week ' + wk.week + ' ' + STAGE[st].short + ': ' + cell.tip) + '">' + esc(cell.text) + '</button></td>';
        }).join('');

        return c + '<td class="gb-wtot">' + tot + '</td>';

    }).join('');
    return '<div class="lch-card-head"><div class="lch-card-title"><h3>Gradebook</h3><span class="lch-mini">' + plural(students.length, 'student') + '</span></div><div class="lch-card-actions"><button class="lch-btn small primary" data-lch="push-all" title="Send scores, excused work and new comments for every open week that is already in Canvas"' + (LCH.busy[classId() + ':push-all'] ? ' disabled' : '') + '>↗ Push all to Canvas</button><button class="lch-btn small" data-lch="csv-all">Download CSV</button></div></div>' +
      '<div class="lch-tile-msg" id="lchMsg-push-all" aria-live="polite" style="margin-top:8px">' + (LCH.msgs[classId() + ':push-all'] || '') + '</div>' +
      '<p class="lch-card-sub">Each week is worth its full points (19, or 29 in a week with a Reading Quiz); only work you leave out lowers that. The unit total counts only weeks a student has started. Click any cell to open that step’s marking screen.</p>' +
      (students.length ? searchBoxHtml('gb') + '<div class="lch-gb-scroll"><table class="lch-gb"><thead>' + head1 + head2 + '</thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="lch-gb-legend"><span><b>•</b> turned in, waiting for you</span><span><b>↻</b> redone after you marked it</span><span><b>—</b> not turned in / not started</span><span><b>ex</b> left out</span><span><b>…</b> quiz still open</span><span><b>n/a</b> no groupmates to rate / no quiz for that group</span></div>'
        : '<div class="lch-empty-state" style="margin-top:12px">No students yet. Share the join code <b>' + esc(d.classInfo.joinCode) + '</b>, or add emails under Students.</div>');
  }

  // ---------- Students
  function activeGroups(d) {
    var groups = (d.activeGroups || []).slice(); if (groups.length) return groups;
    var seen = {}; (d.students || []).forEach(function (s) { if (s.groupId && !seen[s.groupId]) { seen[s.groupId] = true; groups.push({ groupId: s.groupId, bookTitle: s.bookTitle || 'Untitled Book', memberEmails: s.groupMembers || [] }); } });
    return groups;
  }
  /** Every group in the class at a glance, with anything that looks like a setup mistake called out:
   *  a teammate email that isn't in this class (usually a typo), a student with no group, a group of
   *  one, two groups for the same book, a student listed in two groups. */
  function editDist(a, b) {
    a = String(a); b = String(b); if (Math.abs(a.length - b.length) > 3) return 9;
    var prev = []; for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) { var cur = [i]; for (var k = 1; k <= b.length; k++) cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1)); prev = cur; }
    return prev[b.length];
  }
  function groupProblems(d) {
    var students = d.students || [], groups = activeGroups(d), byEmail = {}, inGroups = {}, issues = 0;
    students.forEach(function (s) { byEmail[keyOf(s.email).toLowerCase()] = s; });
    groups.forEach(function (g) { (g.memberEmails || []).forEach(function (m) { var e = keyOf(m).toLowerCase(); (inGroups[e] = inGroups[e] || []).push(g.groupId); }); });
    var titles = {}; groups.forEach(function (g) { var t = String(g.bookTitle || '').trim().toLowerCase(); (titles[t] = titles[t] || []).push(g); });
    var out = groups.map(function (g) {
      var members = (g.memberEmails || []).map(function (m) {
        var e = keyOf(m).toLowerCase(), s = byEmail[e], o = { email: e, student: s || null, note: '' };
        if (!s) {
          var best = '', bestD = 3; students.forEach(function (x) { var xe = keyOf(x.email).toLowerCase(); if (e.split('@')[1] !== xe.split('@')[1]) return; var dd = editDist(e.split('@')[0], xe.split('@')[0]); if (dd < bestD) { bestD = dd; best = xe; } });
          o.note = 'Not in this class' + (best ? ' — did they mean ' + best + '?' : ' — a typo, or a student who hasn’t joined with the class code yet');
          o.typo = true; issues++;
        } else if ((inGroups[e] || []).length > 1) { o.note = 'Listed in more than one group'; issues++; }
        return o;
      });
      var notes = [];
      var real = members.filter(function (m) { return m.student; }).length;
      if (real < 2) { notes.push('Only ' + real + ' student in this group'); issues++; }
      var same = titles[String(g.bookTitle || '').trim().toLowerCase()] || [];
      if (same.length > 1) { notes.push(same.length + ' groups are reading “' + (g.bookTitle || 'Untitled') + '” — were they meant to be one group?'); issues++; }
      return { g: g, members: members, notes: notes };
    });
    var loners = students.filter(function (s) { return !s.groupId; });
    issues += loners.length;
    return { list: out, loners: loners, issues: issues };
  }
  function classGroupsHtml(d) {
    var P = groupProblems(d);
    if (!P.list.length && !P.loners.length) return '';
    var cards = P.list.map(function (x) {
      var g = x.g, wr = (g.weekReading || []).map(function (r, i) { return r ? 'W' + (i + 1) + ' ' + r : ''; }).filter(Boolean).join(' · ');
      var bad = x.notes.length || x.members.some(function (m) { return m.note; });

        '<ul>' + x.members.map(function (m) {

            (m.typo ? '<button class="lch-btn small" data-lch="group-drop" data-group="' + esc(g.groupId) + '" data-email="' + esc(m.email) + '">Take out of group</button>' : '') + '</li>';
        }).join('') + '</ul></div>';
    }).join('');
    var lone = P.loners.length ? '<div class="lch-grp is-bad"><div class="lch-grp-head"><strong>No group yet</strong><span>' + P.loners.length + ' student' + (P.loners.length === 1 ? '' : 's') + '</span></div><ul>' +
      P.loners.map(function (s) { return '<li class="is-bad"><span><b>' + esc(s.name) + '</b> <small>' + esc(s.email) + '</small><em>Will be asked to set up a group, or put them in one with the Group menu below</em></span></li>'; }).join('') + '</ul></div>' : '';
    return '<div class="lch-groupsview"><div class="lch-gv-head"><h4>Groups (' + P.list.length + ')</h4>' + (P.issues ? '<span class="lch-mini is-todo">' + P.issues + ' to check</span>' : '<span class="lch-mini is-clear">All groups look right</span>') + '</div>' +
      '<p class="lch-note">Each group as the students set it up. Anything flagged is a likely setup mistake. Fix a student’s group with the Group menu in the roster below (their work moves with them); take a mistyped email out with its button.</p>' +

  function studentsInner(d) {

      var opts = '<option value="">No group (student sets one up)</option>' + groups.map(function (g) { return '<option value="' + esc(g.groupId) + '" ' + (keyOf(s.groupId) === keyOf(g.groupId) ? 'selected' : '') + '>' + esc((g.bookTitle || 'Untitled') + ' · ' + plural((g.memberEmails || []).length, 'student')) + '</option>'; }).join('') + '<option value="__new__">＋ New group…</option>';
      var dots = (s.summary && s.summary.weeks || []).map(function (wk) {

      return '<tr><td><strong>' + esc(s.name) + '</strong><small>' + esc(s.email) + '</small></td><td>' + (s.bookTitle ? esc(s.bookTitle) + '<small>' + esc(mates.length ? 'with ' + mates.length + ' groupmate' + (mates.length === 1 ? '' : 's') : 'no groupmates yet') + '</small>' : '<span style="color:#6b7f75">No group yet</span>') + '</td><td><div class="lch-weekdots">' + dots + '</div></td><td><select data-lch-change="move-group" data-email="' + esc(s.email) + '" aria-label="Group for ' + esc(s.name) + '">' + opts + '</select></td><td>' + (arch || '<span style="color:#6b7f75">—</span>') + '</td><td><button class="lch-btn small" data-lch="view-student" data-email="' + esc(s.email) + '">Open as student</button> <button class="lch-btn small danger" data-lch="remove-student" data-email="' + esc(s.email) + '" data-name="' + esc(s.name) + '">Remove</button></td></tr>';
    }).join('');

      (students.length ? '<div style="overflow-x:auto"><table class="lch-roster"><thead><tr><th>Student</th><th>Book</th><th>Weeks</th><th>Group</th><th>Past books</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
      '<p class="lch-note">Moving a student between two groups reading the same book keeps their own work. Moving to a different book archives the current one first (restore it any time from “Past books”). Removing a student from the roster keeps their work and grades.</p>' +
      '<div class="lch-tools"><div class="lch-tool"><h4>Add students</h4><p>Paste school emails, one per line or separated by commas.</p><textarea id="lchAddEmails" placeholder="student1@yourschool.org&#10;student2@yourschool.org">' + esc(LCH.addEmails[classId()] || '') + '</textarea><div style="margin-top:9px"><button class="lch-btn primary" data-lch="add-students">Add students</button></div></div>' +

  }

  // ------------------------------------------------------------------ marking screen
  function markKey(w, st) { return classId() + '::' + w + '::' + st; }
  function openMarking(week, stage, email) {
    W.platform.teacherView = 'marking'; W.platform.teacherWeek = Number(week) || 1; W.platform.teacherStage = STAGE[stage] ? stage : 'submission';
    LCH.flashEmail = email || ''; dropFocus();

  }
  function markState() { return { week: Math.max(1, Math.min(4, Number(W.platform.teacherWeek) || 1)), stage: STAGE[W.platform.teacherStage] ? W.platform.teacherStage : 'submission' }; }
  function renderMarking() {

  // Dates are picked as a date box + a time box. The time box starts at 11:59 PM for a due date
  // (12:00 AM for "Available from"), and a cleared time box falls back to that, so picking only a

  var DUE_TIME = '23:59', OPEN_TIME = '00:00';
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoParts(iso) {
    var d = iso ? new Date(iso) : null;

    return { date: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()), time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()) };
  }
  function isoFromParts(date, time, fallback) {

  }

      W.setFocusedAutosaveStatus('Saving…', 'saving');
      var forSubmit = (fa.waiters[wk] || []).length > 0;
      W.callServer('saveWeeklyDraft', [W.state.email, wk, snap.prepType, snap.choices, snap.data], function () {
        fa.inFlight[wk] = false; fa.fails[wk] = 0; paintSaveTrouble();
        W.state.weeklyDrafts = W.state.weeklyDrafts || {};
        W.state.weeklyDrafts[wk] = { prepType: snap.prepType, choices: snap.choices.slice(), data: JSON.parse(JSON.stringify(snap.data)), updatedAt: new Date().toISOString() };
        if (fa.dirty[wk]) { W.flushFocusedAutosave(wk); return; }
        W.setFocusedAutosaveStatus('✓ Draft saved', 'saved');
        W.resolveFocusedAutosaveWaiters(wk);
      }, function (msg) {
        fa.inFlight[wk] = false; fa.dirty[wk] = true;
        var permanent = /signed in as|too long|Set up your group|Invalid week/i.test(String(msg || ''));
        if (permanent) {
          W.setFocusedAutosaveStatus('Not saved: ' + msg, 'error');
          W.resolveFocusedAutosaveWaiters(wk);
          return;
        }
        fa.fails[wk] = (fa.fails[wk] || 0) + 1; paintSaveTrouble();
        W.setFocusedAutosaveStatus('Not saved yet — retrying…', 'error');
        // A flush that a Submit is waiting on doesn't schedule its own retry: the submission
        // carries the same writing, and a late draft would reappear over the submitted work.
        if (!forSubmit) {
          var wait = Math.min(30000, 1500 * Math.pow(2, Math.min(fa.fails[wk], 5)));
          fa.retryTimers[wk] = setTimeout(function () { W.flushFocusedAutosave(wk); }, wait);
        }
        W.resolveFocusedAutosaveWaiters(wk);
      }, { quiet: true });
    };
    var flushAll = function () { Object.keys(fa.dirty || {}).forEach(function (wk) { if (fa.dirty[wk] && !fa.inFlight[wk]) W.flushFocusedAutosave(Number(wk)); }); };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushAll(); });
    W.addEventListener('pagehide', flushAll);
    W.addEventListener('beforeunload', function (e) {
      var pending = Object.keys(fa.dirty || {}).some(function (wk) { return fa.dirty[wk] || fa.inFlight[wk]; });
      if (!pending) return;
      flushAll();
      var failing = Object.keys(fa.fails || {}).some(function (wk) { return fa.fails[wk] > 0; });
      if (failing) { e.preventDefault(); e.returnValue = 'Your latest writing has not saved yet.'; return e.returnValue; }
    });
  }
  function paintSaveTrouble() {
    var fa = W.focusedAutosave || {}, bad = Object.keys(fa.fails || {}).some(function (wk) { return fa.fails[wk] >= 2; });
    var el = document.querySelector('.lc-save-trouble');
    if (bad && !el) { el = document.createElement('div'); el.className = 'lc-save-trouble'; el.setAttribute('role', 'alert'); el.textContent = 'Your latest writing hasn’t reached the server yet. Keep this tab open — it keeps retrying. If this stays, copy your writing somewhere safe and tell your teacher.'; document.body.appendChild(el); }
    else if (!bad && el) el.remove();
  }

  // A teacher opening a student's view must not move where that student resumes.
  if (typeof W.saveStudentResumeClient === 'function') {
    var _saveResume = W.saveStudentResumeClient;
    W.saveStudentResumeClient = function () {
      var b = W.platform.bootstrap || {}, me = keyOf(b.email).toLowerCase();
      if ((b.role === 'teacher' || b.role === 'admin') && W.state && W.state.email && keyOf(W.state.email).toLowerCase() !== me) {
        try { W.state.resume = W.studentResumeSnapshot(); } catch (e) {}
        return;
      }
      return _saveResume.apply(this, arguments);
    };
  }

  // ------------------------------------------------------------------ version check (all roles)
  var lastCheck = 0;
  function verParts(v) { var m = /^(\d{4})-(\d{2})-(\d{2})([a-z]*)$/.exec(String(v || '')); if (!m) return null; var x = 0; for (var i = 0; i < m[4].length; i++) x = x * 26 + (m[4].charCodeAt(i) - 96); return [+m[1], +m[2], +m[3], x]; }
  function verCmp(a, b) { var pa = verParts(a), pb = verParts(b); if (!pa || !pb) return 0; for (var i = 0; i < 4; i++) if (pa[i] !== pb[i]) return pa[i] < pb[i] ? -1 : 1; return 0; }
  function isStaff() { var b = (W.platform && W.platform.bootstrap) || {}; return b.role === 'teacher' || b.role === 'admin'; }
  function bust(url, v) { return url ? url + (url.indexOf('?') >= 0 ? '&' : '?') + 'lcv=' + encodeURIComponent(v) : ''; }
  var TRY_KEY = 'lc_update_try';
  function lastTry() { try { return JSON.parse(W.localStorage.getItem(TRY_KEY) || 'null'); } catch (e) { return null; } }
  /**
   * Which build a reload would really give: the link this tab came from serves `serverBuild` (the
   * server code answering right now). A newer build that only exists on another link (a new
   * deployment) or only in the editor (pasted but not deployed) can't be reached by reloading —
   * that is what used to leave "a newer version is ready" on screen after a reload.
   */
  function checkVersion(force) {
    var now = Date.now(); if (!force && now - lastCheck < 120000) return; lastCheck = now;
    rpc('getAppVersion', {}).then(function (v) {
      var mine = W.LC_CLIENT_VERSION || ''; if (!v || !mine) return;
      var plan = null;
      if (verCmp(v.serverBuild, mine) > 0) plan = { to: v.serverBuild, url: bust(v.url, v.serverBuild) };                 // this link has it: reload
      else if (verCmp(v.version, mine) > 0 && v.liveUrl && v.liveUrl !== v.url) plan = { to: v.version, url: bust(v.liveUrl, v.version) }; // another link has it
      else if (verCmp(v.version, mine) > 0) plan = { to: v.version, url: '', stuck: true };                              // not deployed to this link
      if (!plan) { try { W.localStorage.removeItem(TRY_KEY); } catch (e) {} var old = document.querySelector('.lc-update-bar'); if (old) old.remove(); return; }
      var t = lastTry();
      if (!plan.stuck && t && t.from === mine && t.to === plan.to && now - (t.at || 0) < 10 * 60000) plan.stuck = true; // we went there and still got this build
      if (plan.stuck && !isStaff()) return; // students can't fix a deployment: don't nag them
      showUpdate(v, plan);
    }).catch(function () {});
  }
  function showUpdate(v, plan) {
    var old = document.querySelector('.lc-update-bar'); if (old) old.remove();
    var bar = document.createElement('div'); bar.className = 'lc-update-bar'; bar.setAttribute('role', 'status');
    LCH.update = plan;
    if (plan.stuck) {
      bar.innerHTML = '<span><b>This link is still running v' + esc(W.LC_CLIENT_VERSION) + '</b>, but v' + esc(plan.to) + ' has been saved. Reloading won’t change that until it is deployed to this link: in Apps Script, Deploy → Manage deployments → pencil (edit) on this deployment → Version: New version → Deploy. Students keep using v' + esc(W.LC_CLIENT_VERSION) + ' meanwhile.</span><button type="button" data-lch="update-dismiss">OK</button>';
    } else {
      bar.innerHTML = '<span>A newer version of Literature Circles is ready (v' + esc(plan.to) + ').</span>' +
        (plan.url ? '<a class="lc-update-go" data-lch="update-reload" href="' + esc(plan.url) + '" target="_top">Reload</a>' : '<span><b>Press your browser’s reload button.</b></span>');
    }
    document.body.appendChild(bar);
  }
  /** The Reload link opens the new build itself (a real link, so the browser always allows it).
   *  If marks are still saving, the first click waits for them and the link says when it's safe. */
  function reloadForUpdate(el, e) {
    var plan = LCH.update || {};
    var a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); // commits a comment or typed score
    var pending = LCH.saves.size || Object.keys(LCH.failed).length || dirtyComments();
    if (!pending || el.getAttribute('data-ready') === '1') {
      LCH.leaving = true;
      try { W.localStorage.setItem(TRY_KEY, JSON.stringify({ from: W.LC_CLIENT_VERSION, to: plan.to, at: Date.now() })); } catch (err) {}
      return; // let the link navigate
    }
    if (e) e.preventDefault();
    el.textContent = 'Saving your marks…';
    waitForSaves().then(function () {
      if (Object.keys(LCH.failed).length || dirtyComments()) { el.textContent = 'Some marks didn’t save — open anyway'; }
      else el.textContent = 'Saved — open the new version';
      el.setAttribute('data-ready', '1');
    });
  }
  /** A comment box whose text isn't what the sheet holds (typed and not saved, or a save that failed). */
  function dirtyComments() {
    return Array.prototype.some.call(document.querySelectorAll('.lch-comment'), function (b) { var s = b.getAttribute('data-saved') || ''; return b.value !== s && b.value !== s.replace(/^\r?\n/, ''); });
  }
  W.addEventListener('beforeunload', function (e) {
    if (LCH.leaving || !(LCH.saves.size || Object.keys(LCH.failed).length || dirtyComments() || qzAnyDirty())) return;
    e.preventDefault(); e.returnValue = 'Some marks haven’t saved yet.'; return e.returnValue;
  });
  W.lcCheckVersionNow = function () { checkVersion(true); };
  W.addEventListener('focus', function () { checkVersion(false); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkVersion(false); });
  setTimeout(function () { checkVersion(true); }, 4000);

  // A missing include is named on screen instead of failing silently.
  // Checked after a moment: files that ride along after BackendClient (Checklists) report themselves later.
  setTimeout(function () { if (W.__LC_MISSING && W.__LC_MISSING.length) W.showError('The Apps Script project is missing: ' + W.__LC_MISSING.join(', ') + '. Add the file(s) from the release zip and redeploy.'); }, 500);

  // The old grading screens in Index.html are never shown any more; their save functions sent
  // feedback:'' with every score, which would wipe a comment. They can't run now: each one says so.
  ['saveLcGrade', 'saveTeacherStageGrade', 'saveAutoStageOverride', 'saveBatchLiteratureGrade', 'toggleLiteratureGradeExcluded'].forEach(function (n) {
    W[n] = function () {
      var m = 'That is an old grading screen and nothing was saved. Reload Literature Circles and grade from the Teacher dashboard.';
      if (typeof W.showError === 'function') W.showError(m); else toast(m, true);
      return false;
    };
  });

  // 2026-10-19a: on a slow first load (e.g. right after an update) the start-up answer can arrive
  // before this file has loaded, and Index.html then opens the FIRST class with its old screens.
  // Once this file is here, open the class the teacher used last instead.
  try {
    if (W.platform && W.platform.mode === 'teacher' && W.platform.bootstrap && !(W.lcHistory && W.lcHistory.applying)) {
      setTimeout(function () { if (!LCH.classRestored && W.platform.mode === 'teacher') { W.platform.dashboard = null; W.showTeacherPortal(); } }, 0);
    }
  } catch (e) {}
  W.__MB.BackendClient = 'ok';
})();
</script>
