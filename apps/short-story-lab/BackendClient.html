  async function reconcileCanvasDates_(classId, opts) {

  function localInputFromIso_(iso) {
    if (!iso) return '';
    const d = new Date(iso); if (Number.isNaN(d.getTime())) return '';
    const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return z.toISOString().slice(0,16);
  }
  function isoFromLocalInput_(v) { if (!v) return ''; const d=new Date(v); return Number.isNaN(d.getTime())?'':d.toISOString(); }
  // A date picker leaves the time at 00:00, and an assignment "due Friday" at
  // 00:00 is really due Thursday night -- which is not what anyone means.
  // Picking a date now fills in 11:59 PM.
  const DEFAULT_DUE_TIME = '23:59';
  const DEFAULT_OPEN_TIME = '00:00';
  // A single <input type="datetime-local"> cannot do this. Typing a date into
  // it leaves .value as "" until the TIME segment is filled too, and no input
  // or change event fires in between -- verified in Chromium: eight keystrokes
  // of a date produced eight keydowns and an empty value throughout. So there
  // is no moment at which "the date was picked" can be observed, and the two
  // earlier attempts to snap the time could never have fired.
  //
  // A separate date box and time box do exactly what was asked: the time box
  // already reads 11:59 PM before the date is touched.
  function splitIsoLocal_(iso) {
    if (!iso) return { date: '', time: '' };
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return { date: '', time: '' };
    const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString();
    return { date: z.slice(0, 10), time: z.slice(11, 16) };
  }
  // The date box is what decides whether there is a date at all. An empty time
  // box falls back to the default rather than throwing the date away.
  function joinDateTime_(dateId, timeId, fallbackTime) {
    const d = document.getElementById(dateId), t = document.getElementById(timeId);
    const dv = d ? String(d.value || '').trim() : '';
    if (!dv) return '';
    let tv = t ? String(t.value || '').trim() : '';
    if (!/^\d\d:\d\d/.test(tv)) { tv = fallbackTime; if (t) t.value = tv; }
    return dv + 'T' + tv.slice(0, 5);
  }
  function dueDateFieldHtml_(label, dateId, timeId, iso, defaultTime, hint) {
    const v = splitIsoLocal_(iso);

      <p class="toolbar-note">Save makes or updates every ticked assignment in Canvas, with these dates, in its module. Assignments open to students are published; hidden ones stay unpublished until you open them. Pick a date and the due time is 11:59 PM that day unless you change it; "Lock after" closes the assignment in Canvas.</p>

  // v36: the story tiles keep their places while you work. Releasing a story
  // used to re-sort the grid at once (released stories first), so the tile you
  // clicked jumped away and the next story in line slid under the pointer --
  // a second click then opened that one instead. The order is worked out when
  // the class dashboard loads and kept until the next load.
  function sortedHubStoryIds_() {
    let cid = backend.activeClassId;
    if (backend.hubOrderLoadedFor !== cid) return freshHubStoryOrder_(); // settings not loaded yet
    if (backend.hubStoryOrder && backend.hubStoryOrderKey === cid && backend.hubStoryOrder.length === STORY_ORDER.length) return backend.hubStoryOrder.slice();
    backend.hubStoryOrder = freshHubStoryOrder_();
    backend.hubStoryOrderKey = cid;
    return backend.hubStoryOrder.slice();
  }
  function freshHubStoryOrder_() {
    const schedule = canvasSchedule_();
    const canvas = canvasSettings_();
    const links = canvas.assignments || {};
    const originalIndex = Object.fromEntries(STORY_ORDER.map((id, i) => [id, i]));
    const dueTime = (id) => {
      const key = canvasAssignmentKeyClient_("story", id);
      const sch = schedule[key] || {};
      const link = links[key] || {};
      const raw = sch.dueAt || link.dueAt || "";
      if (!raw) return Number.POSITIVE_INFINITY;
      const t = new Date(raw).getTime();
      return Number.isNaN(t) ? Number.POSITIVE_INFINITY : t;
    };
    return STORY_ORDER.slice().sort((a, b) => {
      const aAssigned = state.releasedStories.includes(a);
      const bAssigned = state.releasedStories.includes(b);
      if (aAssigned !== bAssigned) return aAssigned ? -1 : 1;
      if (aAssigned && bAssigned) {
        const ad = dueTime(a), bd = dueTime(b);
        if (ad !== bd) return ad - bd;
      }
      return originalIndex[a] - originalIndex[b];
    });
  }

}">All ${kind==='story'?'Reading Stories':'Writing Journey'} dates &amp; Canvas…</button><button class="btn hubExportBtn" ${attrs} data-status-id="${esc(statusId)}">Download Canvas CSV</button><hr>${extraMenu||`<button class="btn hubNoGradeBtn ${r.allExcluded?'is-excluded':''}" ${attrs}>${r.allExcluded?'Count it again':"Don't grade"}</button>`}</div></details></span></div><div class="hub-tile-msg" id="${esc(statusId)}" aria-live="polite"></div></footer>`;

  // Canvas CSV for one assignment, from the Hub. Reading stories keep their

    let kind = btn.dataset.kind, key = btn.dataset.key;

      let res = await rpc("exportAssignmentGradesCsv", { classId: backend.activeClassId, kind: kind, key: key });
      downloadTextFile_(res.filename, res.content);
      let parts = [`Downloaded ${res.filename} (${res.sent} student score(s)), out of ${res.pointsPossible} points.`];

  batchGradeFinalDraft = function () {

  // ---- Batch grading: one discussion board, the whole class at once ----

  // both halves of the assignment ("post fulfilled all elements... comments

  // discBatchExcludeToggle / discBatchComment) for the usual reason: handlers
  // are wired by one global querySelectorAll pass, so a shared class name
  // would fire another surface's handler too.
  function discussionCacheKey_(classId, topic) { return classId + "::discussion::" + topic; }
  function getDiscBatchResponses_() { return backend.discussionResponseCache[discussionCacheKey_(backend.activeClassId, backend.batchDiscussion)]; }
  function getDiscBatchResponse_(email) { let list = getDiscBatchResponses_(); return list ? list.find((r) => r.email === email) : null; }
  function applyDiscBatchLocalUpdate_(email, patch) {

  }

    } catch (e) { alert("Could not save that grade -- try again: " + e.message); }
  }

  function discBatchSortRank_(r) { if (r.needsReview && !r.excluded) return -1; if (!discHasPosted_(r)) return 1; return r.excluded || hasOfficialScore_(r.score) ? 2 : 0; }
  function discBatchSortCompare_(a, b) { let ra = discBatchSortRank_(a), rb = discBatchSortRank_(b); if (ra !== rb) return ra - rb; return String(a.name || "").localeCompare(String(b.name || "")); }
  function discBatchStatusBadgeHtml_(r) {
    if (r.needsReview && !r.excluded) return reviewBadgeHtml_(r, { kind: "disc", email: r.email, max: DISCUSSION_MAX });
    if (!discHasPosted_(r)) return `<span class="mini-chip batch-status-badge">Not submitted</span>`;

  // Posts and comments shown separately, with a count on each, because the

  function discussionEvidenceHtml(r) {

  function discBatchScoreRow(r, email) {

  async function loadDiscussionResponses(topic, forceRefresh) {
    backend.batchDiscussion = topic;

    let key = discussionCacheKey_(classId, topic);
    let cached = backend.discussionResponseCache[key];
    if (state.view === "batchGradeDiscussion") render();

    try {
      let fresh = await rpc("getDiscussionResponses", { classId: classId, topic: topic });

  function getActivityBatchResponse_(email) { let list = getActivityBatchResponses_(); return list ? list.find((r) => r.email === email) : null; }

  // The free-text part of an activity is what gets pasted into, so that is

  function activityFreeText_(value) {

    let manual = row.querySelector(".activityBatchManualScore"); if (manual) manual.value = hasOfficialScore_(r.score) ? r.score : "";
    let cb=row.querySelector(".activityBatchExcludeToggle"); if(cb) cb.checked=r.excluded;
    resortBatchRows_(row, activityBatchSortRank_(r), r.name);

  async function loadActivityResponses(itemKey, forceRefresh) {

  async function loadDashboard(classId, rerender = true) {

      backend.rememberedClass = classId;

    if (cached) { backend.dashboard = cached; applyDashboardState_(cached); if (rerender) render(); }
    else { backend.dashboard = null; if (rerender) render(); }

    // Start the roster/gradebook payload and the Grading Hub payload together.
    // On the initial bootstrap (rerender=false), wait for BOTH before the first
    // teacher render. That removes the old "open another page and come back"
    // timing issue on Apps Script cold starts.
    let hubPromise = loadGradingHub(classId, rerender);

  // Loads the Grading Hub's per-assignment submitted/graded/needs-grading

  // getClassDashboard above so the roster/gradebook can render immediately

  // the dashboard, and explicitly invalidated (invalidateGradingHubCache_)
  // anywhere a grade is saved or a release toggle changes, so the counts
  // never go stale while a teacher is actively grading.
  // Counts on this page are a snapshot from when it loaded. Students keep
  // submitting while it is open, so give the teacher a way to re-check without

  async function runHubRefresh_(btn) {
    if (!backend.activeClassId) return;

    let note = wrap ? wrap.querySelector(".hub-refresh-when") : null;
    document.querySelectorAll(".hubRefreshBtn").forEach((b) => { b.disabled = true; });
    if (note) note.textContent = "Checking…";
    else if (wrap) wrap.insertAdjacentHTML("beforeend", '<small class="hub-refresh-when">Checking…</small>');
    try {
      // "The marking" is both halves: the needs-grading counts AND the roster
      // and gradebook behind them, so refresh both rather than only the one
      // on screen.
      invalidateDashboardCache_();
      // loadDashboard starts the Grading Hub fetch itself and, with
      // rerender=false, waits for it -- calling both would ask the server for
      // the hub summary twice.
      await loadDashboard(backend.activeClassId, false);
      render();
    } catch (e) {
      document.querySelectorAll(".hubRefreshBtn").forEach((b) => { b.disabled = false; });
      let n2 = wrap ? wrap.querySelector(".hub-refresh-when") : null;
      if (n2) n2.textContent = "Could not refresh — " + ((e && e.message) || "try again");

    }
  }

    // If the Teacher Dashboard is entered before its first class payload has

    if (backend.enabled && backend.ready && backend.user && !backend.previewAsStudent && backend.user.role !== "student" && state.view === "manage" && backend.activeClassId && backend.dashboard && backend.dashboardStale && !backend._dashboardRefreshing) {

        const klass = currentClass();
        const settings = klass ? parseSettings(klass.settingsJson, backend.dashboard && backend.dashboard.classSettings) : null;
        let restored = normalizeState(cloneJson_(backend.localRecoveryState), settings);
        restored.className = klass ? klass.className : state.className;
        restored.__localEditSeq = Math.max(stateEditSeq_(state), stateEditSeq_(restored)) + 1;

        backend.localRecoveryAvailable = false;

        queueStudentSnapshot_(cloneJson_(state));
        render();

  // ---- v30: Read aloud (Grade Drafting / Revision / Final Draft) ----------
  // Uses the browser's own voices (speechSynthesis): no server call, no new

        // Long run with no sentence end: break at a space, or hard at 400
        // characters (never inside an emoji's surrogate pair).
        end = true;

  function readAloudId_(text) {

  function readAloudPrefs_() {

  }
  function readAloudSavePref_(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
  function readAloudVoices_() {

    // Mac's downloadable Premium/Enhanced voices, then Chrome's Google voices.

  }

  // and a star, so it can't be missed.
  function readAloudVoiceLabel_(v) {
    let name = String(v.name || "").replace(/^(Microsoft|Google)\s+/, "");
    name = name.replace(/\s*\(.*\)\s*$/, "").replace(/\s+Online$/i, "").replace(/\s*-\s*English.*$/i, "");
    let q = readAloudVoiceQuality_(v);
    return (q === "standard" ? "" : "★ ") + name + (q === "premium" ? " — Premium" : q === "natural" ? " — Natural" : q === "enhanced" ? " — Enhanced" : "");
  }
  function readAloudVoiceOptions_() {
    let list = readAloudVoices_(), cur = readAloudVoice_();
    let groups = [["premium", "Premium voices"], ["natural", "Natural voices"], ["enhanced", "Enhanced voices"], ["standard", "Standard voices"]];
    let opt = (v) => `<option value="${esc(readAloudVoiceKey_(v))}" ${cur && readAloudVoiceKey_(v) === readAloudVoiceKey_(cur) ? "selected" : ""}>${esc(readAloudVoiceLabel_(v))}</option>`;

  function readAloudBarHtml_(id) {

    let rate = readAloudPrefs_().rate;
    let rates = [0.75, 0.9, 1, 1.15, 1.3, 1.5].map((r) => `<option value="${r}" ${r === rate ? "selected" : ""}>${r}×</option>`).join("");
    let voices = readAloudVoiceOptions_();
    let n = (readAloud.chunks[id] || []).filter((c) => c.trim()).length;
    return `<div class="ra-bar" data-ra="${id}"><button type="button" class="btn ra-btn raPlayBtn" data-ra="${id}">${playLabel}</button><button type="button" class="btn ra-btn raStopBtn ${active ? "" : "ra-hide"}" data-ra="${id}">■ Stop</button><label class="ra-opt">Speed <select class="raRateSel" aria-label="Reading speed">${rates}</select></label><label class="ra-opt ${voices ? "" : "ra-hide"}">Voice <select class="raVoiceSel" aria-label="Reading voice">${voices}</select></label><span class="ra-status">${active ? readAloudStatus_() : n + " sentence" + (n === 1 ? "" : "s")}</span></div>`;
  }
  // The passage itself, split into sentence spans. Text only -- storyHtml_
  // escapes each piece exactly as it escapes the whole.
  function readAloudTextHtml_(id, text) {
    let chunks = readAloud.chunks[id] || (readAloud.chunks[id] = readAloudChunks_(text));
    return chunks.map((c, i) => `<span class="ra-chunk${readAloud.id === id && i === readAloud.idx ? " ra-on" : ""}" data-ra-i="${i}">${storyHtml_(c)}</span>`).join("");
  }
  // One call for a renderer: {bar, body}. body goes inside an element that
  // already has white-space:pre-wrap.
  // `where` keeps identical passages apart: an unrevised student's draft,
  // revision and final draft are often the same text, and two students can
  // hand in the same story.
  function readAloudBlock_(text, where) {
    let t = String(text || "");
    if (!t.trim()) return { id: "", bar: "", body: storyHtml_(t), attrs: "" };
    let id = readAloudId_(String(where || "") + "|" + t);
    readAloud.chunks[id] = readAloud.chunks[id] || readAloudChunks_(t);
    return { id: id, bar: readAloudBarHtml_(id), body: readAloudTextHtml_(id, t), attrs: `data-ra-text="${id}"${readAloud.id === id ? ' class="ra-active"' : ""}` };
  }
  function readAloudStatus_() {
    let chunks = readAloud.chunks[readAloud.id] || [];
    let spoken = chunks.filter((c) => c.trim());
    let pos = chunks.slice(0, readAloud.idx + 1).filter((c) => c.trim()).length;
    return (readAloud.playing ? "Reading " : "Paused at ") + "sentence " + Math.max(1, Math.min(pos, spoken.length)) + " of " + spoken.length;
  }
  function readAloudPaint_() {
    document.querySelectorAll(".ra-bar").forEach((bar) => {
      let id = bar.dataset.ra, active = readAloud.id === id;
      let play = bar.querySelector(".raPlayBtn"), stop = bar.querySelector(".raStopBtn"), st = bar.querySelector(".ra-status");
      if (play) play.textContent = active && readAloud.playing ? "❚❚ Pause" : active ? "▶ Resume" : "🔊 Read aloud";
      if (stop) stop.classList.toggle("ra-hide", !active);
      if (st) { let n = (readAloud.chunks[id] || []).filter((c) => c.trim()).length; st.textContent = active ? readAloudStatus_() : n + " sentence" + (n === 1 ? "" : "s"); }
    });
    let prev = document.querySelector(".ra-chunk.ra-on");
    let wasVisible = false;
    if (prev) { let b = prev.getBoundingClientRect(); wasVisible = b.bottom > 0 && b.top < window.innerHeight; }
    document.querySelectorAll(".ra-chunk.ra-on").forEach((el) => el.classList.remove("ra-on"));
    document.querySelectorAll("[data-ra-text]").forEach((el) => el.classList.toggle("ra-active", el.dataset.raText === readAloud.id));
    if (!readAloud.id) return;
    let on = document.querySelector('[data-ra-text="' + readAloud.id + '"] .ra-chunk[data-ra-i="' + readAloud.idx + '"]');
    if (on) {
      on.classList.add("ra-on");
      // Follow along only while the reader is following too: if the teacher
      // has scrolled away (to the rubric, say), the page stays put.
      let b = on.getBoundingClientRect();
      if (wasVisible && (b.top < 70 || b.bottom > window.innerHeight - 20)) { try { on.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {} }
    }
  }
  function readAloudStop_() {
    readAloud.token++;
    readAloud.id = ""; readAloud.idx = 0; readAloud.playing = false;
    try { if (readAloudSupported_()) window.speechSynthesis.cancel(); } catch (e) {}
    readAloudPaint_();
  }
  function readAloudPause_() {
    readAloud.token++;
    readAloud.playing = false;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    readAloudPaint_();
  }
  function readAloudFrom_(id, idx) {
    if (!readAloudSupported_()) return;
    let chunks = readAloud.chunks[id];
    if (!chunks) return;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    let token = ++readAloud.token;
    readAloud.id = id; readAloud.idx = Math.max(0, idx || 0); readAloud.playing = true;
    // Watchdog, once a second: stop as soon as the passage leaves the page
    // (not just at the next sentence), and move on if Chrome ever finishes a
    // sentence without telling us.
    let quiet = 0;
    let watch = setInterval(() => {
      if (token !== readAloud.token) { clearInterval(watch); return; }
      if (!document.querySelector('[data-ra-text="' + id + '"]')) { clearInterval(watch); readAloudStop_(); return; }
      let ss = window.speechSynthesis;
      quiet = ss && !ss.speaking && !ss.pending ? quiet + 1 : 0;
      if (quiet >= 3) { quiet = 0; readAloud.idx++; next(); }
    }, 1000);
    const next = () => {
      if (token !== readAloud.token) return;
      while (readAloud.idx < chunks.length && !chunks[readAloud.idx].trim()) readAloud.idx++;
      if (readAloud.idx >= chunks.length) { readAloudStop_(); return; }
      // Left the screen (or the passage changed): stop rather than read on.
      if (!document.querySelector('[data-ra-text="' + id + '"]')) { readAloudStop_(); return; }
      readAloudPaint_();
      let u = new SpeechSynthesisUtterance(chunks[readAloud.idx].trim());
      let v = readAloudVoice_();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
      u.rate = readAloudPrefs_().rate;
      u.onend = () => { if (token !== readAloud.token) return; readAloud.idx++; next(); };
      u.onerror = (e) => {
        if (token !== readAloud.token) return;
        if (e && (e.error === "interrupted" || e.error === "canceled")) return;
        readAloud.idx++; next();
      };
      readAloud.utter = u; // keep a reference: Chrome can drop onend for a collected utterance
      window.speechSynthesis.speak(u);
    };
    next();
  }
  if (readAloudSupported_()) {
    document.addEventListener("click", (e) => {
      let t = e.target && e.target.closest ? e.target : null;
      if (!t) return;
      let play = t.closest(".raPlayBtn");
      if (play) {
        let id = play.dataset.ra;
        if (readAloud.id === id && readAloud.playing) readAloudPause_();
        else readAloudFrom_(id, readAloud.id === id ? readAloud.idx : 0);
        return;
      }
      if (t.closest(".raStopBtn")) { readAloudStop_(); return; }
      // While a passage is being read (or paused), clicking a sentence in it
      // jumps there -- unless the teacher is selecting text.
      let chunk = t.closest(".ra-chunk");
      if (chunk && readAloud.id) {
        let host = chunk.closest("[data-ra-text]");
        let sel = window.getSelection ? window.getSelection() : null;
        if (host && host.dataset.raText === readAloud.id && (!sel || sel.isCollapsed)) readAloudFrom_(readAloud.id, Number(chunk.dataset.raI) || 0);
      }
    });
    document.addEventListener("change", (e) => {
      let t = e.target;
      if (!t || !t.classList) return;
      if (t.classList.contains("raRateSel")) {
        readAloudSavePref_("shortStoryReadAloudRate", t.value);
        document.querySelectorAll(".raRateSel").forEach((s) => { s.value = t.value; });
        if (readAloud.playing) readAloudFrom_(readAloud.id, readAloud.idx);
      } else if (t.classList.contains("raVoiceSel")) {
        readAloudSavePref_("shortStoryReadAloudVoice", t.value);
        document.querySelectorAll(".raVoiceSel").forEach((s) => { s.value = t.value; });
        if (readAloud.playing) readAloudFrom_(readAloud.id, readAloud.idx);
      }
    });
    // Voices load asynchronously in Chrome; fill any voice menus once they arrive.
    try {
      window.speechSynthesis.addEventListener("voiceschanged", () => {
        let opts = readAloudVoiceOptions_();
        document.querySelectorAll(".raVoiceSel").forEach((s) => { s.innerHTML = opts; let l = s.closest(".ra-opt"); if (l) l.classList.toggle("ra-hide", !opts); });
      });
    } catch (e) {}
    window.addEventListener("pagehide", () => { try { window.speechSynthesis.cancel(); } catch (e) {} });
  }

  // ---- v37: Gemini feedback beside the rubric (Grade Drafting) -------------
  // The button sits in the grading panel, under the rubric. Gemini reads the
  // student's saved rough draft and writes 1 praise + 5 suggestions in the
  // teacher's voice ("I loved your…", "To improve, I would…", "One question I
  // had was…"). Each one is a button: a click puts it in the feedback box and
  // saves it as the Drafting comment; a second click takes it back out.
  // Nothing reaches the student unless it is in the feedback box. The picks
  // are kept per class and student (and in this browser), so a repaint or a
  // reload never loses them.
  backend.geminiDrafts = backend.geminiDrafts || {};
  const GEMINI_PICKS_LS = "ssl_gemini_picks_v37";
  function geminiDraftKey_(email) { return backend.activeClassId + "::" + email; }
  function geminiPicksStore_() { try { return JSON.parse(localStorage.getItem(GEMINI_PICKS_LS) || "{}") || {}; } catch (e) { return {}; } }
  function geminiPicksRemember_(key, g) {
    try {
      let all = geminiPicksStore_();
      if (g && g.items) all[key] = { items: g.items, at: g.at || Date.now() };
      else delete all[key];
      let keys = Object.keys(all).sort((x, y) => (all[y].at || 0) - (all[x].at || 0));
      keys.slice(80).forEach((k) => delete all[k]);
      localStorage.setItem(GEMINI_PICKS_LS, JSON.stringify(all));
    } catch (e) {}
  }
  function geminiDraftFor_(email) {
    let key = geminiDraftKey_(email);
    if (!backend.geminiDrafts[key]) {
      let saved = geminiPicksStore_()[key];
      if (saved && saved.items) backend.geminiDrafts[key] = { items: saved.items, at: saved.at };
    }
    return backend.geminiDrafts[key] || {};
  }
  function geminiPickList_(g) {
    let it = (g && g.items) || {};
    let list = [];
    if (it.praise) list.push({ kind: "praise", tag: "Praise", text: String(it.praise) });
    (it.suggestions || []).forEach((sg, i) => { if (sg && sg.text) list.push({ kind: "suggestion", tag: sg.focus || ("Suggestion " + (i + 1)), text: String(sg.text) }); });
    return list;
  }
  function geminiPanelHasPicks_(r) { return !!(r && backend.batchStageKey === "drafting" && geminiPickList_(geminiDraftFor_(r.email)).length); }
  function geminiCommentBox_(email) { return document.querySelector('.stageBatchComment[data-email="' + (window.CSS && CSS.escape ? CSS.escape(email) : email) + '"]'); }
  function geminiCurrentComment_(email, r) {
    let box = geminiCommentBox_(email);
    return String(box ? box.value : (r && r.comment) || "");
  }
  function geminiTeacherBoxHtml_(r) {
    if (!r || backend.batchStageKey !== "drafting") return "";
    if (!String(((r.evidence || {}).draftText) || "").trim()) return "";
    let em = esc(r.email);
    let g = geminiDraftFor_(r.email);
    let picks = geminiPickList_(g);
    let comment = geminiCurrentComment_(r.email, r);
    let askLabel = g.busy ? "Gemini is reading the draft…" : picks.length ? "↻ Ask Gemini again" : "✦ Gemini feedback";
    let status = g.error ? `<span class="gemini-teacher-status" role="status">${esc(g.error)}</span>` : `<span class="gemini-teacher-status" role="status"></span>`;
    let body;
    if (g.busy) body = `<p class="gemini-teacher-note">Gemini is reading the draft. This usually takes 10–20 seconds.</p>`;
    else if (picks.length) {
      let n = picks.filter((p) => comment.indexOf(p.text) >= 0).length;
      body = `<p class="gemini-teacher-note">Click a comment to put it in your feedback box. Click it again to take it out. Edit the wording in the box.</p>
        <ul class="gemini-picks">${picks.map((p, i) => {
          let added = comment.indexOf(p.text) >= 0;
          return `<li><button type="button" class="geminiPick ${p.kind}${added ? " added" : ""}" data-email="${em}" data-i="${i}" aria-pressed="${added}"><span class="gemini-pick-top"><span class="gemini-pick-tag">${esc(p.tag)}</span><span class="gemini-pick-state">${added ? "✓ In feedback" : "+ Add"}</span></span><span class="gemini-pick-text">${esc(p.text)}</span></button></li>`;
        }).join("")}</ul>
        <div class="gemini-teacher-actions"><button type="button" class="btn geminiPickAll" data-email="${em}" ${n < picks.length ? "" : "hidden"}>Add all ${picks.length}</button><button type="button" class="btn geminiTeacherDiscardBtn" data-email="${em}">Clear list</button></div>`;
    } else body = `<p class="gemini-teacher-note">Gemini reads the rough draft and writes 1 thing you loved and 5 suggestions (tense, story logic, dialogue, what to cut, slowing the climax…). Click the ones you want into your feedback box.</p>`;
    return `<div class="gemini-panel gemini-teacher-box" data-email="${em}"><div class="gemini-teacher-head"><button type="button" class="btn geminiTeacherAskBtn${picks.length ? " again" : ""}" data-email="${em}" ${g.busy ? "disabled" : ""}>${askLabel}</button>${status}</div>${body}</div>`;
  }
  function repaintGeminiTeacherBox_(email) {
    let sel = '.gemini-teacher-box[data-email="' + (window.CSS && CSS.escape ? CSS.escape(email) : email) + '"]';
    let box = document.querySelector(sel);
    let r = getStageBatchResponse_(email);
    if (!box || !r) return;
    let panel = box.closest(".grade-row-dok");
    let scroll = panel ? panel.scrollTop : 0;
    let hadFocus = document.activeElement && box.contains(document.activeElement) ? (document.activeElement.dataset.i || document.activeElement.className) : null;
    box.outerHTML = geminiTeacherBoxHtml_(r);
    if (panel) { panel.classList.toggle("has-gemini-picks", geminiPanelHasPicks_(r)); panel.scrollTop = scroll; }
    if (hadFocus !== null) {
      let nb = document.querySelector(sel);
      let f = nb && (nb.querySelector('.geminiPick[data-i="' + hadFocus + '"]') || nb.querySelector(".geminiTeacherAskBtn"));
      if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  async function geminiTeacherAsk_(email) {
    let classId = backend.activeClassId, key = geminiDraftKey_(email);
    let g = geminiDraftFor_(email);
    if (g.busy) return;
    g = backend.geminiDrafts[key] = { items: g.items, at: g.at, busy: true, error: "" };
    repaintGeminiTeacherBox_(email);
    try {
      let res = await rpc("getTeacherDraftFeedback", { classId: classId, studentEmail: email });
      let items = { praise: String((res && res.praise) || ""), suggestions: Array.isArray(res && res.suggestions) ? res.suggestions : [] };
      if (!items.praise && !items.suggestions.length && res && res.feedback) items.suggestions = String(res.feedback).split(/\n\s*\n/).filter((t) => t.trim()).map((t) => ({ focus: "", text: t.trim() }));
      if (items.praise || items.suggestions.length) { g.items = items; g.at = Date.now(); geminiPicksRemember_(key, g); }
      else g.error = "Gemini returned no feedback. Try again.";
    } catch (e) {
      g.error = "Gemini could not draft feedback: " + (e && e.message ? e.message : String(e));
    }
    g.busy = false;
    if (backend.activeClassId === classId && state.view === "batchGradeStage") repaintGeminiTeacherBox_(email);
  }
  // Puts the comment text in the feedback box (praise first, suggestions in
  // the order clicked) or takes it out, then saves it like a typed comment.
  function geminiSetComment_(email, next) {
    let r = getStageBatchResponse_(email);
    if (!r) return;
    let box = geminiCommentBox_(email);
    next = String(next || "").replace(/\n{3,}/g, "\n\n").trim();
    r.comment = next; r.needsReview = false;
    if (box) {
      box.value = next;
      // grow the box to show what was added (up to about 24 lines)
      try { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight + 4, 560) + "px"; } catch (e) {}
    }
    updateStageBatchRowUI_(email);
    saveStageBatchGradeItem_(email, { score: r.score, excluded: r.excluded, comment: next });
    repaintGeminiTeacherBox_(email);
  }
  function geminiTogglePick_(email, i) {
    let p = geminiPickList_(geminiDraftFor_(email))[i];
    let r = getStageBatchResponse_(email);
    if (!p || !r) return;
    let cur = geminiCurrentComment_(email, r);
    let at = cur.indexOf(p.text);
    let next;
    if (at >= 0) next = cur.slice(0, at).replace(/\s+$/, "") + (cur.slice(0, at).trim() && cur.slice(at + p.text.length).trim() ? "\n\n" : "") + cur.slice(at + p.text.length).replace(/^\s+/, "");
    else if (p.kind === "praise") next = cur.trim() ? p.text + "\n\n" + cur.trim() : p.text;
    else next = cur.trim() ? cur.trim() + "\n\n" + p.text : p.text;
    geminiSetComment_(email, next);
  }
  function geminiAddAll_(email) {
    let r = getStageBatchResponse_(email);
    if (!r) return;
    let cur = geminiCurrentComment_(email, r).trim();
    let list = geminiPickList_(geminiDraftFor_(email));
    let praise = list.filter((p) => p.kind === "praise" && cur.indexOf(p.text) < 0).map((p) => p.text);
    let rest = list.filter((p) => p.kind !== "praise" && cur.indexOf(p.text) < 0).map((p) => p.text);
    geminiSetComment_(email, praise.concat(cur ? [cur] : [], rest).join("\n\n"));
  }
  document.addEventListener("click", (e) => {
    let t = e.target && e.target.closest ? e.target : null;
    if (!t) return;
    let pick = t.closest(".geminiPick");
    if (pick) { geminiTogglePick_(pick.dataset.email, Number(pick.dataset.i)); return; }
    let all = t.closest(".geminiPickAll");
    if (all) { geminiAddAll_(all.dataset.email); return; }
    let ask = t.closest(".geminiTeacherAskBtn");
    if (ask) { geminiTeacherAsk_(ask.dataset.email); return; }
    let discard = t.closest(".geminiTeacherDiscardBtn");
    if (discard) {
      let key = geminiDraftKey_(discard.dataset.email);
      delete backend.geminiDrafts[key];
      geminiPicksRemember_(key, null);
      backend.geminiDrafts[key] = {};
      repaintGeminiTeacherBox_(discard.dataset.email);
    }
  });
  // Typing in the feedback box updates which comments show "✓ In feedback".
  let geminiInputTimer = null;
  document.addEventListener("input", (e) => {
    let t = e.target;
    if (!t || !t.classList || !t.classList.contains("stageBatchComment")) return;
    let email = t.dataset.email;
    if (!geminiPickList_(geminiDraftFor_(email)).length) return;
    clearTimeout(geminiInputTimer);
    geminiInputTimer = setTimeout(() => {
      let box = document.querySelector('.gemini-teacher-box[data-email="' + (window.CSS && CSS.escape ? CSS.escape(email) : email) + '"]');
      if (!box) return;
      let cur = t.value;
      let list = geminiPickList_(geminiDraftFor_(email));
      box.querySelectorAll(".geminiPick").forEach((b) => {
        let p = list[Number(b.dataset.i)]; if (!p) return;
        let added = cur.indexOf(p.text) >= 0;
        b.classList.toggle("added", added); b.setAttribute("aria-pressed", String(added));
        let st = b.querySelector(".gemini-pick-state"); if (st) st.textContent = added ? "✓ In feedback" : "+ Add";
      });
      let allBtn = box.querySelector(".geminiPickAll");
      let missing = list.some((p) => cur.indexOf(p.text) < 0);
      if (allBtn) allBtn.hidden = !missing;
    }, 250);
  });

  // ---- v38: browser Back / Forward on teacher screens ----------------------
  // AppLogic's history entries carry the screen; these add which story, stage,
  // board or lab a marking screen shows, plus the class and preview, and
  // reopen it (with its list reloaded) on Back / Forward.
  window.__sslNavRoute = function (view) {
    let r = { classId: backend.activeClassId || "", preview: backend.previewAsStudent ? "1" : "" };
    if (view === "batchGrade") { r.story = backend.batchStoryId || ""; r.assessment = backend.batchStoryAssessment || "dok"; }
    else if (view === "batchGradeStage") r.stage = backend.batchStageKey || "";
    else if (view === "batchGradeDiscussion") r.discussion = backend.batchDiscussion || "";
    else if (view === "batchGradeActivity") r.activity = backend.batchActivityKey || "";
    return r;
  };
  window.__sslNavApply = function (t) {
    if (!backend.enabled || !backend.ready || !t) return false;
    if (t.view === "batchGrade" && t.story) { openStoryAssessment_(t.story, t.assessment); return true; }
    if (t.view === "batchGradeStage" && t.stage) { backend.batchStageKey = t.stage; render(); loadStageResponses(t.stage); return true; }
    if (t.view === "batchGradeFinal") { render(); loadAllCriterionResponses_(); return true; }
    if (t.view === "batchGradeDiscussion" && t.discussion) { backend.batchDiscussion = t.discussion; render(); loadDiscussionResponses(t.discussion); return true; }
    if (t.view === "batchGradeActivity" && t.activity) { backend.batchActivityKey = t.activity; render(); loadActivityResponses(t.activity); return true; }
    if (t.view === "manage" && backend.activeClassId && backend.user && backend.user.role !== "student" && !backend.previewAsStudent) { render(); loadGradingHub(backend.activeClassId); return true; }
    return false;
  };

  // ---- v33: "Read it aloud" practice recorder ------------------------------
  // The pop-up says it's ready; only then is the revised draft sent, and only
  // to the recorder's own address.
  function practiceRecorderOrigin_() { try { return new URL(backend.practiceRecorderUrl).origin; } catch (e) { return ""; } }
  function practiceRecorderText_() {
    let box = document.getElementById("revisionText");
    return String(box ? box.value : (state.writing && state.writing.revisionText) || "");
  }
  document.addEventListener("click", (e) => {
    let b = e.target && e.target.closest ? e.target.closest(".practiceRecorderBtn") : null;
    if (!b || !backend.practiceRecorderUrl) return;
    let w = null;
    try { w = window.open(backend.practiceRecorderUrl, "shortStoryRecorder", "popup,width=1040,height=820"); } catch (err) { w = null; }
    if (!w) {
      let note = b.parentElement && b.parentElement.querySelector(".practice-recorder-note");
      if (note) note.innerHTML = `Your browser blocked the pop-up. Allow pop-ups for this page, or <a href="${esc(backend.practiceRecorderUrl)}" target="_blank" rel="noopener">open the recorder here</a> and paste your story in.`;
    }
  });
  window.addEventListener("message", (e) => {
    let origin = practiceRecorderOrigin_();
    if (!origin || e.origin !== origin) return;
    if (!e.data || e.data.type !== "ss-recorder-ready" || !e.source) return;
    try { e.source.postMessage({ type: "ss-story", title: "Your revised draft", text: practiceRecorderText_() }, origin); } catch (err) {}
  });

  // ---- v32: "Keep 5/7" on resubmitted work ---------------------------------
  // Same as Macbeth: one click gives the resubmitted version the score the
  // earlier version had, which clears the resubmission and moves the student
  // to Graded. Any comment typed in the row is saved with it.
  function keepGradeSame_(btn) {
    let kind = btn.dataset.kind, email = btn.dataset.email, crit = btn.dataset.crit;
    let row = btn.closest(".batch-row");
    let box = (sel) => (row ? row.querySelector(sel + '[data-email="' + email + '"]' + (crit ? '[data-crit="' + crit + '"]' : "")) : null);
    if (kind === "dok") {

    let assignSel = document.getElementById("studentAssignSelect");
    if (assignSel) assignSel.onchange = () => {
      backend.studentAssign = assignSel.value;
      document.querySelectorAll(".assign-pane").forEach((x) => x.classList.toggle("hide", x.dataset.assign !== assignSel.value));
      let box = document.querySelector(".student-work-box"); if (box) box.scrollTop = 0;
    };
    document.querySelectorAll(".modalDiscJump").forEach((b) => (b.onclick = () => {
      document.getElementById("modalRoot").innerHTML = "";
      backend.batchDiscussion = b.dataset.discussion;
      state.view = "batchGradeDiscussion";
      render();
      loadDiscussionResponses(b.dataset.discussion);
    }));
    // v25: activity grading inside the student window (prewriting labs and
    // story extensions), with an obvious way to count an excluded score.
    const actEntry = (key) => key.indexOf("story:") === 0 ? ((gs.stories[key.slice(6)] || {}).extension || null) : ((gs.activities || {})[key] || null);
    const actRaw = (e) => !e ? null : (e.rawScore !== undefined && e.rawScore !== null ? e.rawScore : e.score);
    const saveAct = async (key, patch) => {
      let e = actEntry(key);
      if (e) { e.rawScore = patch.score; e.score = patch.excluded ? null : patch.score; e.excluded = !!patch.excluded; e.comment = patch.comment; }
      renderStudentModal(r);
      try {
        await queueGradeMutation_({ classId: backend.activeClassId, studentEmail: r.student.email, itemType: "activity", itemKey: key, score: hasOfficialScore_(patch.score) ? patch.score : null, excluded: !!patch.excluded, comment: patch.comment || "" });
        invalidateDashboardCache_();
        await refreshStudentModal();
      } catch (err) { alert("Could not save that grade -- reloading this student to double check: " + err.message); await refreshStudentModal(); }
    };
    document.querySelectorAll(".modalActScoreBtn").forEach((btn) => (btn.onclick = () => {
      let key = btn.dataset.key, e = actEntry(key) || {}, clicked = Number(btn.dataset.score);
      let cur = e.excluded ? null : actRaw(e);
      saveAct(key, { score: cur === clicked ? null : clicked, excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalActManualScore").forEach((input) => (input.onchange = () => {
      let key = input.dataset.key, e = actEntry(key) || {}, score = teacherScoreValue_(input, ACTIVITY_RUBRIC_MAX);
      if (score === undefined) return;
      saveAct(key, { score: score, excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalActExclude").forEach((cb) => (cb.onchange = () => {
      let key = cb.dataset.key, e = actEntry(key) || {};
      saveAct(key, { score: actRaw(e), excluded: cb.checked, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalActCount").forEach((b) => (b.onclick = () => {
      let key = b.dataset.key, e = actEntry(key) || {};
      saveAct(key, { score: actRaw(e), excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalActComment").forEach((ta) => (ta.onblur = () => {
      let key = ta.dataset.key, e = actEntry(key) || {};
      if (String(e.comment || "") === ta.value) return;
      saveAct(key, { score: actRaw(e), excluded: !!e.excluded, comment: ta.value });
    }));
    const annEntry = (key) => ((gs.stories[key] || {}).annotation || null);
    const annRaw = (e) => !e ? null : (e.rawScore !== undefined && e.rawScore !== null ? e.rawScore : e.score);
    const saveAnn = async (key, patch) => {
      let e = annEntry(key);
      if (e) { e.rawScore = patch.score; e.score = patch.excluded ? null : patch.score; e.excluded = !!patch.excluded; e.comment = patch.comment; }
      renderStudentModal(r);
      try {
        await queueGradeMutation_({ classId: backend.activeClassId, studentEmail: r.student.email, itemType: "annotation", itemKey: key, score: hasOfficialScore_(patch.score) ? patch.score : null, excluded: !!patch.excluded, comment: patch.comment || "" });
        invalidateDashboardCache_();
        await refreshStudentModal();
      } catch (err) { alert("Could not save that grade -- reloading this student to double check: " + err.message); await refreshStudentModal(); }
    };
    document.querySelectorAll(".modalAnnScoreBtn").forEach((btn) => (btn.onclick = () => {
      let key = btn.dataset.key, e = annEntry(key) || {}, clicked = Number(btn.dataset.score);
      let cur = e.excluded ? null : annRaw(e);
      saveAnn(key, { score: cur === clicked ? null : clicked, excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalAnnManualScore").forEach((input) => (input.onchange = () => {
      let key = input.dataset.key, e = annEntry(key) || {}, score = teacherScoreValue_(input, ANNOTATION_MAX);
      if (score === undefined) return;
      saveAnn(key, { score: score, excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalAnnExclude").forEach((cb) => (cb.onchange = () => {
      let key = cb.dataset.key, e = annEntry(key) || {};
      saveAnn(key, { score: annRaw(e), excluded: cb.checked, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalAnnCount").forEach((b) => (b.onclick = () => {
      let key = b.dataset.key, e = annEntry(key) || {};
      saveAnn(key, { score: annRaw(e), excluded: false, comment: e.comment || "" });
    }));
    document.querySelectorAll(".modalAnnComment").forEach((ta) => (ta.onblur = () => {
      let key = ta.dataset.key, e = annEntry(key) || {};
      if (String(e.comment || "") === ta.value) return;
      saveAnn(key, { score: annRaw(e), excluded: !!e.excluded, comment: ta.value });
    }));
  }

  if (backend.enabled) { setAccountHeader(); bootstrap(); }
  else { backend.ready = true; render(); }
  // A tab going to the background is the classic moment to lose the last
  // 650ms of typing. Flush immediately rather than waiting for the debounce.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) flushStudentSaveSoon_();
    else { checkForNewAppVersion_(); refreshStudentWorkIfStale_(); }
  });
  // v11: a window can regain focus without a visibility change (two windows
  // side by side), and a Chromebook can sit open overnight. Check on focus,
  // and every few minutes while the tab is visible and idle.
  window.addEventListener("focus", () => { refreshStudentWorkIfStale_(); });
  // v12: closing the tab or the laptop lid. The browser copy is already
  // current (every keystroke writes it), and the next visit sends anything
  // the server didn't get; this just tries to send it right away too.
  window.addEventListener("pagehide", () => { try { flushStudentSaveSoon_(); } catch (e) {} });
  setInterval(() => { if (!document.hidden) refreshStudentWorkIfStale_(); }, 3 * 60 * 1000);

  // ---- v51: on every marking screen, a search box for a student; on every
  // teacher screen, a "↑ Dashboard" button once you have scrolled down. ----
  backend.gradeSearch = backend.gradeSearch || "";
  function gsNorm_(t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function gradeSearchApply_() {
    let box = document.getElementById("gradeSearch");
    if (!box) return;
    let q = gsNorm_(backend.gradeSearch).trim();
    let rows = Array.from(document.querySelectorAll("#app .batch-row[data-email]"));
    let shown = 0;
    rows.forEach((r) => {
      let hay = gsNorm_((r.dataset.studentName || "") + " " + (r.dataset.email || "") + " " + ((r.querySelector("h5") || {}).textContent || ""));
      let hit = !q || q.split(/\s+/).every((w) => hay.indexOf(w) !== -1);
      r.classList.toggle("gs-hidden", !hit);
      if (hit) shown++;
    });
    document.querySelectorAll("#app .batch-grade-group").forEach((g) => {
      let any = g.querySelector(".batch-row[data-email]:not(.gs-hidden)");
      g.classList.toggle("gs-group-dim", !!q && !any);
    });
    let n = document.getElementById("gradeSearchCount");
    if (n) n.textContent = q ? (shown ? shown + " of " + rows.length + " students" : "No student matches") : (rows.length ? rows.length + " students" : "");
  }
  function gradeToolsInsert_() {
    let back = document.getElementById("backToDashboard");
    if (!back) return;
    let head = back.closest(".sectionhead");
    if (!head || document.getElementById("gradeSearch")) { gradeSearchApply_(); return; }
    head.insertAdjacentHTML("afterend", `<div class="grade-search-bar" role="search"><label class="grade-search-label" for="gradeSearch">Find a student</label><input type="search" id="gradeSearch" autocomplete="off" placeholder="Type a name…" value="${esc(backend.gradeSearch)}"><span id="gradeSearchCount" class="grade-search-count" aria-live="polite"></span></div>`);
    gradeSearchApply_();
  }
  document.addEventListener("input", (e) => {
    if (e.target && e.target.id === "gradeSearch") { backend.gradeSearch = e.target.value; gradeSearchApply_(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target && e.target.id === "gradeSearch" && e.key === "Escape") { e.target.value = ""; backend.gradeSearch = ""; gradeSearchApply_(); }
  });
  let gsTimer = null;
  try {
    new MutationObserver(() => {
      clearTimeout(gsTimer);
      gsTimer = setTimeout(() => { if (document.getElementById("backToDashboard")) gradeToolsInsert_(); }, 60);
    }).observe(document.getElementById("app"), { childList: true, subtree: true });
  } catch (e) {}
  function floatDashUpdate_() {
    let b = document.getElementById("floatDashBtn");
    if (!b) return;
    let teacher = backend.enabled && backend.user && backend.user.role !== "student" && !backend.previewAsStudent;
    let focus = !!document.querySelector(".batch-row.focus-mode");
    let onDash = state.view === "manage";
    b.textContent = onDash ? "↑ Top" : "↑ Dashboard";
    b.title = onDash ? "Back to the top of the Teacher Dashboard" : "Back to the Teacher Dashboard";
    b.hidden = !(teacher && !focus && (window.scrollY || document.documentElement.scrollTop || 0) > 500);
  }
  (function floatDashInit_() {
    if (document.getElementById("floatDashBtn")) return;
    let b = document.createElement("button");
    b.type = "button"; b.id = "floatDashBtn"; b.className = "float-dash-btn"; b.hidden = true;
    b.onclick = () => {
      if (state.view !== "manage") {
        let back = document.getElementById("backToDashboard");
        if (back) back.click();
        else { state.view = "manage"; render(); loadGradingHub(backend.activeClassId); }
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(floatDashUpdate_, 400);
    };
    document.body.appendChild(b);
    window.addEventListener("scroll", floatDashUpdate_, { passive: true });
  })();
  {
    const renderBeforeTools_ = render;
    render = function () {
      if (state.view === "manage") backend.gradeSearch = "";
      let out = renderBeforeTools_.apply(this, arguments);
      try { gradeToolsInsert_(); floatDashUpdate_(); } catch (e) { console.warn("grade tools", e); }
      return out;
    };
  }
  (function gradeToolsStyles_() {
    if (document.getElementById("gradeToolsStyles")) return;
    const st = document.createElement("style");
    st.id = "gradeToolsStyles";
    st.textContent = `
      .grade-search-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px;padding:9px 12px;background:#fffdf8;border:1px solid #ddd5c8;border-radius:10px;box-shadow:0 2px 8px rgba(40,30,20,.06)}
      .grade-search-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#5f5a50}
      #gradeSearch{flex:1 1 220px;max-width:420px;min-width:0;padding:8px 11px;border:1px solid #cfc6b8;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:#111827}
      .grade-search-count{font-size:12.5px;color:#5f5a50}
      #app .batch-row.gs-hidden{display:none!important}
      #app .batch-grade-group.gs-group-dim{opacity:.55}
      .mini-chip.sub-time{background:#eef1f8!important;border-color:#c9d3ea!important;color:#23345f!important;text-transform:none;letter-spacing:0;font-weight:700}
      .mini-chip.sub-late{background:#fdeceb!important;border-color:#e6b5b2!important;color:#8c1d17!important;text-transform:none;letter-spacing:0;font-weight:800}
      .mini-chip.sub-ontime{background:#eafff2!important;border-color:#bfe8cf!important;color:#0d6b3d!important;text-transform:none;letter-spacing:0;font-weight:700}
      .float-dash-btn{position:fixed;right:18px;bottom:18px;z-index:800;padding:10px 16px;border-radius:999px;border:1px solid #23345f;background:#23345f;color:#fff;font:inherit;font-size:14px;font-weight:800;box-shadow:0 6px 18px rgba(20,30,60,.28);cursor:pointer}
      .float-dash-btn:hover{background:#18264a}
      .float-dash-btn[hidden]{display:none}

      .gb-entry{display:inline-flex;align-items:center;gap:2px;border:1px solid #d6cdbd;border-radius:7px;background:#fff;padding:1px 2px 1px 4px}
      .gb-entry.is-empty{background:#fbf8f2}
      .gb-entry.is-saved{border-color:#4f765d;box-shadow:0 0 0 2px #cfe6d5}
      .gb-entry.is-bad{border-color:#b42318;box-shadow:0 0 0 2px #f6d0cc}
      .gbScoreInput{width:3.2em;border:0;background:transparent;font:inherit;font-weight:800;font-size:14px;text-align:right;padding:4px 1px;color:#111827;-moz-appearance:textfield}
      .gbScoreInput::-webkit-outer-spin-button,.gbScoreInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
      .gbScoreInput:focus{outline:none}
      .gb-entry:focus-within{border-color:#23345f;box-shadow:0 0 0 2px #c9d3ea}
      .gb-max{font-size:12px;color:#5f5a50;padding-right:2px}
      .gb-open{border:0;background:none;color:#23345f;font-weight:800;cursor:pointer;padding:3px 4px;border-radius:5px;font-size:13px}
      .gb-open:hover{background:#eef1f8}
    `;
    document.head.appendChild(st);
  })();


})();

__MB.BackendClient = 'ok';
</script>
