function activityTableRowHtml(cols, values) {
  values = values || [];
  return `<tr>${cols.map((c, i) => `<td><input type="text" class="actTableCell" data-col="${i}" value="${esc(values[i] || "")}" placeholder="${esc(c)}"></td>`).join("")}<td><button type="button" class="btn actRemoveRow" title="Remove row" style="padding:4px 9px;font-size:12px">✕</button></td></tr>`;
}

// The controls for one activity -- table, fields, free response, reflection.
// Shared by the full-page view and (for anything still opened as a pop-out)
// the modal, so the two can never drift apart.
function activityBodyHtml_(title) {
  let detail = ACTIVITY_DETAILS[title] || { prompt: "Complete the activity described by your teacher." };
  let saved = state.activityResponses[title];
  let isStructured = !!(detail.table || detail.fields);
  let bodyHtml = "";
  if (detail.table) {
    let cols = detail.table;
    let savedRows = saved && Array.isArray(saved.table) ? saved.table : null;
    let rows = savedRows && savedRows.length ? savedRows : detail.presetRows || Array.from({ length: detail.minRows || 1 }, () => []);
    bodyHtml += `<div style="overflow:auto"><table class="rubric" id="actTable"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody id="actTableBody">${rows.map((r) => activityTableRowHtml(cols, r)).join("")}</tbody></table></div><button type="button" class="btn" id="actAddRow" style="margin-top:8px">+ Add Row</button>`;
  }
  if (detail.fields) {
    let savedFields = saved && Array.isArray(saved.fields) ? saved.fields : [];
    // Wrapped so a wide page can set these in two columns. Character Lab has
    // sixteen of them, and one per row across a full-width page is a great
    // deal of scrolling for answers that are usually a sentence.
    bodyHtml += `<div class="activity-fields-grid">${detail.fields.map((f, i) => `<div class="field"><label>${esc(f.label)}</label><textarea class="actField writingbox short" data-idx="${i}" placeholder="${esc(f.placeholder || "")}">${esc(savedFields[i] || "")}</textarea></div>`).join("")}</div>`;
  }
  if (!isStructured) {
    let legacyVal = typeof saved === "string" ? saved : String((saved && saved.response) || "");
    bodyHtml += `<div class="field activity-main-field"><label><strong>${esc(detail.mainLabel || "Your response")}</strong></label><textarea id="activityResponse" class="activity-response activity-main-box" placeholder="${esc(detail.mainPlaceholder || "Record your thinking or response here...")}">${esc(legacyVal)}</textarea></div>`;
  }
  if (detail.reflection) {
    let savedReflection = (saved && typeof saved === "object" && saved.reflection) || "";
    bodyHtml += `<div class="field activity-reflection-field" style="margin-top:14px"><label><strong>${esc(detail.reflection)}</strong></label><textarea id="actReflection" class="writingbox short" placeholder="Your answer...">${esc(savedReflection)}</textarea></div>`;
  }
  return { html: bodyHtml, detail: detail, isStructured: isStructured };
}

// Reads whatever the activity controls currently hold and stores it. Same
// shape the teacher's View Work modal already reads.
function collectActivityResponse_(title) {
  let detail = ACTIVITY_DETAILS[title] || {};
  let isStructured = !!(detail.table || detail.fields);
  if (!isStructured) {
    let el = document.getElementById("activityResponse");
    let main = el ? el.value : "";
    // A free-response activity with a reflection has TWO boxes. This used to
    // return the first box as a bare string, which silently threw the
    // reflection away on every save -- the Zombie warm-up is the only
    // activity in the unit shaped this way, which is why it alone lost work.
    if (!detail.reflection) return main;
    let refl = document.getElementById("actReflection");
    return { response: main, reflection: refl ? refl.value : "" };
  }
  let response = {};
  if (detail.table)
    response.table = Array.from(document.querySelectorAll("#actTableBody tr"))
      .map((tr) => Array.from(tr.querySelectorAll(".actTableCell")).map((inp) => inp.value));
  if (detail.fields) response.fields = Array.from(document.querySelectorAll(".actField")).map((t) => t.value);
  if (detail.reflection) response.reflection = document.getElementById("actReflection").value;
  return response;
}

// A prewriting activity is a graded assignment, so it gets a page of its own
// rather than a pop-out: room for the prompt, the same writing-process strip
// the rough draft has, the rubric, the due date and a real Save.
function activityStoryOwner_(title) {
  let found = "";
  STORY_ORDER.forEach((id) => {
    let ext = typeof STORY_EXTENSION_ACTIVITY !== "undefined" ? STORY_EXTENSION_ACTIVITY[id] : null;
    if (ext && ext.title === title) found = id;
  });
  return found;
}
function activityGradedKey_(title) {
  let pre = (typeof PREWRITING_GRADED_ACTIVITIES !== "undefined" ? PREWRITING_GRADED_ACTIVITIES : [])
    .find((a) => (a.titles || []).indexOf(title) !== -1 || a.label === title);
  if (pre) return "pre:" + pre.key;
  let story = activityStoryOwner_(title);
  return story ? "story:" + story : "";
}
// Words across every box in an activity -- table cells, fields, free response
// and the reflection -- so the count means "what I wrote for this activity".
function activityWordCount_(title) {
  let saved = state.activityResponses[title];
  if (!saved) return 0;
  if (typeof saved === "string") return wordCount(saved);
  let parts = [];
  if (saved.response) parts.push(saved.response);
  if (Array.isArray(saved.table)) saved.table.forEach((row) => (row || []).forEach((c) => parts.push(c)));
  if (Array.isArray(saved.fields)) saved.fields.forEach((f) => parts.push(f));
  if (saved.reflection) parts.push(saved.reflection);
  return wordCount(parts.join(" "));
}

function activityPage(title) {
  let built = activityBodyHtml_(title);

  let pkey = activityProcessKey_(title);

  let backTo = ownerStory ? "story:" + ownerStory : "writing";

  let graded = !!gradedKey;
  let due = typeof assignmentDueChipHtml_ === "function" && graded ? assignmentDueChipHtml_("activity", gradedKey) : "";
  let started = activityHasWork_(title);
  let status = graded && typeof assignmentStatusChipHtml_ === "function"
    ? assignmentStatusChipHtml_("activity", gradedKey, { started: started, done: isSubmitted_("activity", gradedKey) }) : "";
  return `<div class="activity-page">

    </div>

      <p class="activity-prompt">${esc(detail.prompt || "")}</p>

      ${typeof writingProcessStripHtml_ === "function" ? writingProcessStripHtml_(pkey, { words: activityWordCount_(title) }) : ""}
      <div class="activity-page-actions">
        ${graded ? `<button class="btn primary assignmentSubmitBtn" id="saveActivityPage" data-submit-kind="activity" data-submit-key="${esc(gradedKey)}">${isSubmitted_("activity", gradedKey) ? "✓ Submitted" : "Submit for grading"}</button>` : `<button class="btn primary" id="saveActivityPage">Save my work</button>`}
        <span id="activitySavedNote" class="toolbar-note" role="status" aria-live="polite"></span>
      </div>
      <p class="toolbar-note">Your work saves automatically as you type. ${graded ? "Submit for grading only when this activity is finished. Editing after submission returns it to In progress." : "Check the save status before leaving this page."}</p>
    </div>
  </div>`;

function openActivity(title) {
  // Kept for any caller that still wants a pop-out, but it now renders from
  // the SAME builder as the full-page view -- an earlier extraction left two

  let built = activityBodyHtml_(title);

  document.getElementById("cancelModal").onclick = () => (document.getElementById("modalRoot").innerHTML = "");
  function bindRowRemovers() {
    document.querySelectorAll(".actRemoveRow").forEach((b) => (b.onclick = () => {
      let body = document.getElementById("actTableBody");
      if (body && body.children.length > 1) b.closest("tr").remove();

    addRowBtn.onclick = () => {
      document.getElementById("actTableBody").insertAdjacentHTML("beforeend", activityTableRowHtml(detail.table, []));

  document.getElementById("saveActivity").onclick = () => {
    // One collector, used by the page and the pop-out. The copy that used to

    state.activityResponses[title] = collectActivityResponse_(title);
    save();
    document.getElementById("modalRoot").innerHTML = "";
    if (!window.SHORTSTORY_BACKEND || !window.SHORTSTORY_BACKEND.enabled) alert("Check the save status before closing the app.");
  };
}

// Tap-to-toggle for glossary terms (CSS handles hover/keyboard-focus on its
// own; this covers touch devices, where :hover isn't reliable). One document
// click-listener is enough for the app's lifetime, so it's only ever
// attached once, guarded by window.__glossDocBound.
function bindGlossary() {
  document.querySelectorAll(".glossterm").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      let wasOpen = el.classList.contains("open");
      document.querySelectorAll(".glossterm.open").forEach((o) => o.classList.remove("open"));
      el.classList.toggle("open", !wasOpen);
    };
  });
  if (!window.__glossDocBound) {
    document.addEventListener("click", () => document.querySelectorAll(".glossterm.open").forEach((o) => o.classList.remove("open")));
    window.__glossDocBound = true;
  }
}

function bind() {
  bindGlossary();
  // Delegated for the same reason the focus buttons are: a connected class
  // re-renders parts of the page after the normal bind pass.
  if (!window.__sssSourceCheckBound) {
    document.addEventListener("click", (e) => {
      let b = e.target && e.target.closest ? e.target.closest(".sourceCheckBtn") : null;
      if (!b) return;
      e.preventDefault();
      let kind = b.dataset.sourceKind || "", key = b.dataset.sourceKey || "";
      let out = document.querySelector(`[data-source-out="${kind}:${key}"]`);
      if (!out) return;
      b.disabled = true;
      let prev = b.textContent;
      b.textContent = "Checking\u2026";
      // Indexing twelve stories takes a beat on a Chromebook; let the label paint.
      setTimeout(() => {
        try { out.innerHTML = sourceCheckResultHtml_(kind, key, sourceCheckTextFor_(kind, key)); }
        catch (err) { out.innerHTML = `<p class="source-check-empty">The check could not run: ${esc(err && err.message ? err.message : err)}</p>`; }
        b.disabled = false; b.textContent = prev;
      }, 20);
    });
    window.__sssSourceCheckBound = true;
  }
  // Delegate Focus/Read Mode clicks at the document level. Connected-class
  // renders can replace parts of the page after the normal bind pass; the
  // delegated handler keeps every current and future focus button reliable.
  if (!window.__sssFocusClickBound) {
    document.addEventListener("click", (e) => {
      let b = e.target && e.target.closest ? e.target.closest("[data-focus-mode]") : null;
      if (!b) return;
      e.preventDefault();
      let mode = b.dataset.focusMode || "";
      let turningOff = window.__sssFocusMode === mode;
      window.__sssFocusLabel = turningOff ? "" : (b.dataset.focusLabel || "");
      setFocusMode_(turningOff ? "" : mode);
    });
    window.__sssFocusClickBound = true;
  }
  if (!window.__sssFocusEscBound) {
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && window.__sssFocusMode) setFocusMode_("");
    });
    window.__sssFocusEscBound = true;
  }
  let dupUnitBtn = document.getElementById("dupUnitBtn");
  if (dupUnitBtn)
    dupUnitBtn.onclick = () =>
      alert("Unit duplication is managed from the connected class backend. Once deployed, use Teacher Dashboard > Create a Class to start a new section of this same unit — each class gets its own code and release settings automatically.");
  document.querySelectorAll("[data-role]").forEach((b) => {
    b.classList.toggle("active", b.dataset.role === state.role);
    b.onclick = () => {
      state.role = b.dataset.role;
      save();
      render();
    };
  });
  document.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { state.view = b.dataset.goto; save(); render(); }));
  document.querySelectorAll(".openActivity").forEach((b) => (b.onclick = () => { state.view = "activity:" + b.dataset.activity; save(); render(); }));
  document.querySelectorAll(".openStoryFromCard").forEach(
    (b) =>
      (b.onclick = (e) => {
        if (e) e.stopPropagation();
        let id = b.dataset.story;
        if (!released(id)) return alert("This story has not been released yet.");
        state.view = "story:" + id;
        save();
        render();
        window.scrollTo(0, 0);
      }),
  );
  document.querySelectorAll(".studentContinueStoryCard").forEach((card) => {
    const openContinueStory = () => {
      let id = card.dataset.story;
      if (!id) return;
      if (!released(id)) return alert("This story has not been released yet.");
      state.view = "story:" + id;
      save();
      render();
      window.scrollTo(0, 0);
    };
    card.onclick = openContinueStory;
    card.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openContinueStory();
      }
    };
  });
  document.querySelectorAll("[data-estep]").forEach((b) => (b.onclick = () => { state.essay.step = b.dataset.estep; save(); render(); }));
  document.querySelectorAll("[data-wstep]").forEach((b) => (b.onclick = () => {
    let key = WRITING_STEP_RELEASE_KEY[b.dataset.wstep];
    if (!stageReleased(key)) return alert("This stage has not been released yet.");
    state.writing.step = b.dataset.wstep;
    save();
    render();
  }));
  let postWhatIf = document.getElementById("postWhatIf");
  if (postWhatIf)
    postWhatIf.onclick = () => {
      let box = document.getElementById("whatIfDraft");
      let text = box ? box.value.trim() : "";
      if (!text) return;
      state.writing.whatIfPosts.push({ id: "local-" + Date.now() + "-" + Math.random().toString(36).slice(2), name: "You", text, date: new Date().toLocaleString(), parentId: "" });
      save();
      render();
    };
  document.querySelectorAll(".postWhatIfComment").forEach(
    (b) =>
      (b.onclick = () => {

// ---- Browser Back, inside the app -------------------------------------
// The app is served inside Apps Script's sandbox iframe, which starts its
// life with no history entries of its own. So the browser's Back button had
// nothing of ours to go back to and jumped straight out to Google. We keep
// our own stack of screens and push one history entry per screen change;
// Back then walks back through the app the way a student expects.
//
// Back from the very first screen still leaves the app, which is correct --
// there is nowhere else to go, and trapping Back forever would be worse than
// the original problem.
const NAV_ = { ready: false, replaying: false, current: null, busy: false };

// v38: every history entry carries the screen it stands for (never any
// writing), so Back AND Forward land on the right screen. Teacher screens add
// which story / stage / board they show (BackendClient sets __sslNavRoute).
function navSnapshot_() {
  let v = String(state.view || "home");
  let r = {
    view: v,
    step: (v === "writing" && state.writing && state.writing.step) || "",
    essayStep: (v === "essay" && state.essay && state.essay.step) || "",
    role: String(state.role || "")
  };
  if (typeof window.__sslNavRoute === "function") { try { Object.assign(r, window.__sslNavRoute(v) || {}); } catch (e) {} }
  return r;
}
function navSame_(a, b) { return !!a && !!b && stableNavStr_(a) === stableNavStr_(b); }
function stableNavStr_(r) { return Object.keys(r || {}).sort().map((k) => k + "=" + (r[k] == null ? "" : String(r[k]))).join("&"); }
function navWrite_(route, replace) {
  try { history[replace ? "replaceState" : "pushState"]({ ssl: 1, route: route }, ""); } catch (e) {}
}
// Anything typed in a box that saves when you click out of it (teacher
// comments, notes) is saved before the screen changes.
function navFlushTyping_() {
  let a = document.activeElement;
  try { if (a && a !== document.body && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)) a.blur(); } catch (e) {}
  try { if (window.SHORTSTORY_BACKEND && typeof window.SHORTSTORY_BACKEND.flushStudentSave === "function") window.SHORTSTORY_BACKEND.flushStudentSave(); } catch (e) {}
}

function navInit_() {
  if (NAV_.ready) return;
  if (typeof history === "undefined" || !history.pushState) return;
  NAV_.ready = true;
  NAV_.current = navSnapshot_();
  navWrite_(NAV_.current, true);
  window.addEventListener("popstate", function (e) {
    if (!NAV_.ready) return;
    let cur = NAV_.current;
    // A modal is the most recent thing opened, so Back shuts that before it
    // moves off the page. Put the entry back so closing a modal doesn't also
    // eat a screen.
    let mr = document.getElementById("modalRoot");
    if (mr && mr.innerHTML.trim()) {
      navFlushTyping_();
      mr.innerHTML = "";
      document.body.classList.remove("modal-open");
      navWrite_(cur, false);
      return;
    }
    let target = e.state && e.state.ssl && e.state.route;
    if (!target || !cur) return;
    // History from another role, preview or class never switches who you
    // are behind the Student / Teacher / Admin buttons: stay where you are.
    if (NAV_.busy || target.role !== cur.role || (target.preview || "") !== (cur.preview || "") || (target.classId || "") !== (cur.classId || "")) { navWrite_(cur, true); return; }
    NAV_.busy = true;
    navFlushTyping_();
    NAV_.replaying = true;
    try {
      state.view = target.view;
      if (target.step && state.writing) state.writing.step = target.step;
      if (target.essayStep && state.essay) state.essay.step = target.essayStep;
      let handled = typeof window.__sslNavApply === "function" && window.__sslNavApply(target);
      if (!handled) render();
      // Students resume where they left off; that is saved like any other move.
      if (state.role === "student") save();
    } finally {
      NAV_.replaying = false; NAV_.busy = false;
      NAV_.current = navSnapshot_();
      navWrite_(NAV_.current, true);
    }
  });
}

function navTrack_() {
  navInit_();
  if (!NAV_.ready) return;
  let now = navSnapshot_();
  if (NAV_.replaying) { NAV_.current = now; return; }
  if (navSame_(now, NAV_.current)) return;
  // While the app is still signing in, screens replace each other instead of
  // stacking up, so Back never lands on a half-loaded screen.
  let B = window.SHORTSTORY_BACKEND;
  let booting = !!(B && B.enabled && !B.ready);
  NAV_.current = now;
  navWrite_(now, booting);
}

function render() {
  let activeView = String(state.view || "home");
  let changedPage = !!window.__sssRenderedView && window.__sssRenderedView !== activeView;
  window.__sssRenderedView = activeView;
  // Home, the Library, a story page and the Writing Workshop are student
  // pages whoever is looking at them. Nearly all of the student visual
  // identity is scoped to body.role-student in the stylesheet, so without
  // this a teacher previewing those pages got half a theme -- most visibly
  // the Writing Workshop banner, which lost its navy plate and left white
  // heading text sitting on cream. The teacher/admin class stays on as well
  // so the teacher chrome (topbar, dashboard surfaces) is unaffected.
  let studentFacingView = activeView === "home" || activeView === "library" || activeView === "writing" || activeView === "essay" || activeView.startsWith("story:") || activeView.startsWith("activity:");
  if (window.__sssFocusMode && !(activeView === "writing" || activeView.startsWith("story:"))) setFocusMode_("");
  document.body.classList.toggle("student-page", studentFacingView);
  document.body.classList.toggle("role-student", state.role === "student" || studentFacingView);
  document.body.classList.toggle("role-teacher", state.role === "teacher");
  document.body.classList.toggle("role-admin", state.role === "admin");
  document.body.classList.toggle("view-story", String(state.view || "").startsWith("story:"));
  document.body.classList.toggle("view-writing", state.view === "writing");
  document.body.classList.toggle("view-manage", state.view === "manage");
  // An activity page is somewhere to do the work, so it hides the app chrome.
  // The Back button on the page is the way out.
  document.body.classList.toggle("view-activity", String(state.view || "").indexOf("activity:") === 0);
  sidebar();
  let app = document.getElementById("app");
  let v = activeView;
  if (v.startsWith("story:")) app.innerHTML = story(v.split(":")[1]);
  else if (v === "library") app.innerHTML = storyLibraryPage_();
  else if (v.indexOf("activity:") === 0) app.innerHTML = activityPage(v.slice(9));
  else if (v === "essay") app.innerHTML = writingWorkshop();
  else if (v === "writing") app.innerHTML = writingWorkshop();
  else if (v === "manage") app.innerHTML = manage();
  else if (v === "batchGrade") app.innerHTML = batchGrade();
  else if (v === "batchGradeStage") app.innerHTML = batchGradeStage();
  else if (v === "batchGradeFinal") app.innerHTML = batchGradeFinalDraft();
  else if (v === "batchGradeDiscussion") app.innerHTML = batchGradeDiscussion();
  else if (v === "batchGradeActivity") app.innerHTML = batchGradeActivity();
  else if (v === "admin") app.innerHTML = admin();
  else app.innerHTML = home();
  navTrack_();
  bind();
  if (changedPage) {
    window.scrollTo(0, 0);
    app.tabIndex = -1;
    app.focus({ preventScroll: true });
  }
}

(function bindModalBackdropDismiss() {
  const root = document.getElementById("modalRoot");

  root.addEventListener("click", function (e) {

      const dismiss = e.target.querySelector(".modal-dismiss");
      if (dismiss) dismiss.click();
      else root.innerHTML = "";
    }
  });
})();
function storyHtml_(text) { return esc(String(text || "")); }

// Text offsets in the story, measured the same way the server and the

      textBox.addEventListener("keyup", (e) => { if (e.shiftKey || e.key === "Shift") check(); });
      textBox.addEventListener("touchend", () => setTimeout(() => annShowChip_(id), 250));
      textBox.addEventListener("click", (e) => {
        let mk = e.target.closest && e.target.closest(".ann-mark");
        let sel = window.getSelection ? window.getSelection() : null;
        if (mk && (!sel || sel.isCollapsed)) annFocusCard_(id, mk.dataset.ann);
      });
    }
    if (!document.__annDocBound) {
      document.__annDocBound = true;
      document.addEventListener("mousedown", (e) => {
        if (e.target.closest && (e.target.closest("#annChip") || e.target.closest("#annEditor") || e.target.closest(".ann-mark"))) return;
        annHideChip_();
        if (document.getElementById("annEditor") && !(e.target.closest && e.target.closest(".story-text"))) annCloseEditor_();
      });
    }
  }
  if (!cardOnly) {
    annRenderRail_(id);
    if (!window.__annResizeBound) {
      window.__annResizeBound = true;
      let t = null;
      window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { let m2 = String(state.view || "").match(/^story:(.+)$/); if (m2 && storyAnnotationsOn_(m2[1])) { annCloseEditor_(); annRenderRail_(m2[1]); } }, 200); });
    }
    let det = document.querySelector("details.story-text");
    if (det && !det.__annToggle) { det.__annToggle = true; det.addEventListener("toggle", () => annRenderRail_(id)); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => annPlaceRail_(id));
  }
  let card = document.getElementById("annotationCard");
  if (!card) return;
  card.classList.toggle("ann-rail-on", annRailActive_());
  annBindFields_(id, card);
  card.querySelectorAll(".annJumpBtn").forEach((b) => (b.onclick = () => {
    let mk = document.querySelector('.ann-mark[data-ann="' + b.dataset.ann + '"]');
    if (!mk) return;
    let details = mk.closest("details"); if (details && !details.open) details.open = true;
    mk.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => annFocusCard_(id, b.dataset.ann), 350);
  }));
  annBindDeletes_(id, card);
  card.querySelectorAll(".annotationSubmitBtn").forEach((b) => (b.onclick = () => {
    let c = annotationCounts_(id);
    if (c.complete < ANNOTATION_MIN) { alert(`You have ${c.complete} complete annotation${c.complete === 1 ? "" : "s"}. At least ${ANNOTATION_MIN} need highlighted words, a note, and a reflection before you submit.`); return; }
    markSubmitted_("annotation", id);
    let y = window.scrollY; render(); window.scrollTo(window.scrollX, y);
  }));
  card.querySelectorAll(".openRubric").forEach((x) => (x.onclick = () => openRubricModal(x.dataset.rubric || "story", x.dataset.rubricItem || "")));
}

// Run the annotation binding after every normal bind().
const __bindBeforeAnnotations_ = bind;
bind = function () {
  let r = __bindBeforeAnnotations_.apply(this, arguments);
  try { bindStoryAnnotations_(); } catch (e) { console.error("annotations", e); }
  return r;
};
__MB.AppLogic = 'ok';
</script>
