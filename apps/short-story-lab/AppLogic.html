// ---- Source-overlap check ------------------------------------------------
// Finds runs of consecutive words in a student's answer that appear word for
// word in the story they are writing about. Runs entirely in the browser: the
// story text is already on the page (storyTextStore), so no story text is sent
// to the server, stored, or logged anywhere.
//
// It is NOT a plagiarism detector. It compares against the unit's own stories
// and nothing else -- it cannot see the internet and cannot detect AI writing.
// Quoting the story is usually what the assignment asks for, so a match is only
// interesting when it is NOT inside quotation marks; that is the distinction

// Normalized words plus their offsets in the ORIGINAL string, so a match can be
// highlighted in the student's own text with their punctuation intact.
function sourceTokens_(text) {

  text = String(text || "");
  while ((m = re.exec(text)) !== null) {

    if (w) out.push({ w: w, s: m.index, e: m.index + m[0].length });
  }

}

function sourceNgramSet_(sourceText, n) {
  let t = sourceTokens_(sourceText), set = new Set();
  for (let i = 0; i + n <= t.length; i++) {

    for (let j = 0; j < n; j++) k += (j ? " " : "") + t[i + j].w;
    set.add(k);
  }
  return set;
}

// Building the index for a 10,000-word story takes a moment, and the Final
// Draft check runs against all ten. Cache per story so it happens once.
function sourceNgramIndex_(id, sourceText, n) {
  let key = String(id || "") + "#" + n + "#" + String(sourceText || "").length;
  if (!sourceIndexCache_[key]) sourceIndexCache_[key] = sourceNgramSet_(sourceText, n);
  return sourceIndexCache_[key];

// Spans of the answer that sit inside quotation marks. Straight quotes toggle;
// curly quotes pair. Single quotes are deliberately ignored -- apostrophes in
// "didn't" and possessives would open phantom quotations on every other line.
function quotedSpans_(text) {
  text = String(text || "");

  for (let i = 0; i < text.length; i++) {
    let c = text[i];
    if (c === "“") open = i;
    else if (c === "”") { if (open >= 0) { spans.push([open, i + 1]); open = -1; } }
    else if (c === '"') { if (open >= 0) { spans.push([open, i + 1]); open = -1; } else open = i; }
  }
  return spans;
}

// A match counts as quoted when nearly all of it sits inside a quotation. The
// tolerance is there because a closing mark often lands a character or two
// outside the matched run once a student adds their own words around it.
function spanIsQuoted_(a, b, spans) {
  let len = b - a;
  if (len <= 0) return false;
  let covered = 0;
  for (let i = 0; i < spans.length; i++) {
    let lo = Math.max(a, spans[i][0]), hi = Math.min(b, spans[i][1]);
    if (hi > lo) covered += hi - lo;
  }
  return covered / len >= 0.8;
}

      words: m.wEnd - m.wStart + 1,

// Runs at paste time, in the browser, on text the student just put on screen.
function pasteCameFromSource_(key, head) {
  try {
    head = String(head || "").trim();
    if (head.length < 25) return false;
    let k = String(key || ""), kind = "", id = "";
    if (k.indexOf("dok:") === 0) { kind = "story"; id = k.slice(4); }
    else if (k.indexOf("act:") === 0) { kind = "activity"; id = k.slice(4); }
    else if (k === "finalDraft") { kind = "finalDraft"; id = "finalDraft"; }
    else return false;
    let sources = sourceTextsFor_(kind, id);
    if (!sources.length) return false;
    return sourceMatches_(head, sources, { minWords: 6 }).length > 0;
  } catch (e) { return false; }
}

function sourceMatchSummary_(responseText, matches) {
  matches = matches || [];
  let words = sourceTokens_(responseText).length;
  let unquoted = matches.filter((m) => !m.quoted);
  let matchedWords = matches.reduce((a, m) => a + m.words, 0);
  return {
    total: matches.length,
    quoted: matches.length - unquoted.length,
    unquoted: unquoted.length,
    words: words,
    matchedWords: matchedWords,
    unquotedWords: unquoted.reduce((a, m) => a + m.words, 0),
    pct: words ? Math.round((matchedWords / words) * 100) : 0,
    unquotedPct: words ? Math.round((unquoted.reduce((a, m) => a + m.words, 0) / words) * 100) : 0
  };
}

// The student's own words, with matched runs marked. Green = quoted properly,
// amber = word for word but with no quotation marks.
function sourceMatchHtml_(responseText, matches) {
  let text = String(responseText || "");
  let out = "", pos = 0;
  (matches || []).slice().sort((a, b) => a.start - b.start).forEach((m) => {
    if (m.start < pos) return;
    out += esc(text.slice(pos, m.start));
    out +=
      `<mark class="srcmatch ${m.quoted ? "quoted" : "unquoted"}" title="${m.words} words matching ${esc(m.source)}${m.quoted ? " — inside quotation marks" : " — not in quotation marks"}">` +
      esc(text.slice(m.start, m.end)) +
      `</mark>`;
    pos = m.end;
  });
  out += esc(text.slice(pos));
  return out.replace(/\n/g, "<br>");
}

// One sentence a teacher or student can act on, rather than a percentage that
// looks like a verdict.
function sourceMatchVerdict_(summary) {
  if (!summary.total) return { level: "clean", line: "No passages match the story word for word." };
  if (!summary.unquoted)
    return {
      level: "clean",
      line: `${summary.total} quoted passage${summary.total === 1 ? "" : "s"} ${summary.total === 1 ? "matches" : "match"} the story word for word, and ${summary.total === 1 ? "it is" : "they are all"} inside quotation marks.`
    };
  return {
    level: "check",
    line: `${summary.unquoted} passage${summary.unquoted === 1 ? "" : "s"} (${summary.unquotedWords} word${summary.unquotedWords === 1 ? "" : "s"}) ${summary.unquoted === 1 ? "matches" : "match"} the story word for word with no quotation marks.`
  };
}

// Which story text an answer should be compared against. Story responses and
// story-linked labs check their own story; the Final Draft is an original piece
// so it checks against every story in the unit.
function sourceTextsFor_(kind, key) {
  let ids = [];
  if (kind === "story") ids = [key];
  else if (kind === "activity") {
    let gk = typeof activityGradedKey_ === "function" ? String(activityGradedKey_(key) || "") : "";
    if (gk.indexOf("story:") === 0) ids = [gk.slice(6)];
  } else if (kind === "finalDraft") ids = (typeof STORY_ORDER !== "undefined" ? STORY_ORDER : []).slice();
  let out = [];
  ids.forEach((id) => {
    let text = typeof storyRawText === "function" ? storyRawText(id) : "";
    if (text && String(text).trim())
      out.push({ id: id, label: (typeof STORIES !== "undefined" && STORIES[id] && STORIES[id].title) || id, text: String(text) });
  });
  return out;
}

// The student-facing panel. Same matcher, same wording as the teacher's view --
// nobody is surprised later by something they could not have seen.
function sourceCheckPanelHtml_(kind, key, responseText) {
  let sources = sourceTextsFor_(kind, key);
  if (!sources.length) return "";
  let label = sources.length > 1 ? "the unit's stories" : sources[0].label;
  return `<div class="source-check" data-source-kind="${esc(kind)}" data-source-key="${esc(key)}"><button type="button" class="btn sourceCheckBtn" data-source-kind="${esc(kind)}" data-source-key="${esc(key)}">Check my quoting</button><span class="source-check-hint">Compares your answer with ${esc(label)} and shows anything copied word for word.</span><div class="source-check-out" data-source-out="${esc(kind)}:${esc(key)}"></div></div>`;
}

function sourceCheckResultHtml_(kind, key, responseText, opts) {
  opts = opts || {};
  let text = String(responseText || "");
  if (!text.trim()) return `<p class="source-check-empty">Nothing written yet.</p>`;
  let sources = sourceTextsFor_(kind, key);
  if (!sources.length) return `<p class="source-check-empty">The story text isn't loaded in the app, so there's nothing to compare against.</p>`;
  let matches = sourceMatches_(text, sources);
  let summary = sourceMatchSummary_(text, matches);
  let verdict = sourceMatchVerdict_(summary);
  let teacher = !!opts.teacher;
  let guidance = summary.unquoted
    ? (teacher
        ? "Word-for-word text with no quotation marks. Worth asking about before assuming anything — students often mean to quote and forget the marks."
        : "Either put those words in quotation marks and name the story, or say the idea in your own words. Quoting is fine — quoting without marks is what gets flagged.")
    : (summary.total
        ? (teacher ? "Every matching passage is inside quotation marks." : "Your quotations are marked properly. Nice.")
        : (teacher ? "Nothing in this answer repeats the story word for word." : "Nothing here copies the story word for word."));
  return `<div class="source-check-result ${verdict.level}"><div class="source-check-verdict"><strong>${esc(verdict.line)}</strong></div><p>${esc(guidance)}</p>${matches.length ? `<div class="source-check-text">${sourceMatchHtml_(text, matches)}</div><div class="source-check-legend"><mark class="srcmatch quoted">in quotation marks</mark><mark class="srcmatch unquoted">not in quotation marks</mark></div>` : ""}<small>This compares your answer with the stories in this unit only. It does not search the internet and it cannot tell whether something was written by AI.</small></div>`;
}

// Read what is on the page right now, not what was last saved -- a student
// presses this mid-sentence and expects it to reflect what they can see.
function sourceCheckTextFor_(kind, key) {
  if (kind === "story") { let el = document.getElementById("dok"); return el ? el.value : String((state.dok || {})[key] || ""); }
  if (kind === "finalDraft") { let el = document.getElementById("finalText"); return el ? el.value : String((state.writing || {}).finalText || ""); }
  if (kind === "activity") {
    let parts = [];
    let main = document.getElementById("activityResponse"); if (main) parts.push(main.value);
    document.querySelectorAll(".actTableCell").forEach((t) => parts.push(t.value));
    document.querySelectorAll(".actField").forEach((t) => parts.push(t.value));
    let refl = document.getElementById("actReflection"); if (refl) parts.push(refl.value);
    return parts.filter((x) => x && String(x).trim()).join("\n\n");
  }
  return "";
}

// ---- What the teacher sees while grading --------------------------------
// One highlighted copy of the answer plus one line under it. Pink means the
// run was pasted in from outside the app; amber means it matches the story,
// whether it was pasted or typed. Quoting the story is what the assignment
// asks for, so amber is information, not an accusation.

// Locate each recorded paste inside the finished answer. The head is stored,
// the length is known, so a run that has not been rewritten is found exactly;
// one the student has since edited simply is not marked.
function pasteSpans_(text, process) {
  text = String(text || "");
  let events = (process && Array.isArray(process.pasteEvents) ? process.pasteEvents : []).filter((e) => e && e.head && Number(e.chars) > 0);
  if (!events.length || !text) return [];
  let flat = text.replace(/\s+/g, " ");
  let map = [];                       // flat index -> original index
  let run = "", last = -1;
  for (let i = 0; i < text.length; i++) {
    if (/\s/.test(text[i])) { if (last === 1) continue; run += " "; map.push(i); last = 1; }
    else { run += text[i]; map.push(i); last = 0; }
  }
  let spans = [], used = [];
  events.forEach((e) => {
    let head = String(e.head).replace(/\s+/g, " ").trim();
    if (head.length < 12) return;
    let from = 0, at = -1;
    while (true) {
      at = run.indexOf(head, from);
      if (at < 0) return;
      if (!used.some((u) => at >= u[0] && at < u[1])) break;
      from = at + 1;
    }
    let len = Math.max(head.length, Math.min(Number(e.chars) || head.length, run.length - at));
    used.push([at, at + len]);
    let a = map[at];
    // A run that reaches the end of the answer must include the last character,
    // or a wholly pasted answer reports as 99%.
    let b = at + len >= map.length ? text.length : map[at + len];
    spans.push({ start: a, end: Math.max(a + 1, b), kind: e.fromSource ? "source" : "outside" });
  });
  return spans;
}

function authorshipSpans_(text, process, kind, key) {
  let spans = pasteSpans_(text, process).slice();
  // Text that matches the story but was typed rather than pasted still counts
  // as quoting, and is the case the paste log cannot see.
  try {
    if (kind && typeof sourceTextsFor_ === "function") {
      let sources = sourceTextsFor_(kind, key);
      if (sources.length) sourceMatches_(text, sources).forEach((m) => spans.push({ start: m.start, end: m.end, kind: "source" }));
    }
  } catch (e) { /* highlighting must never block grading */ }
  spans.sort((a, b) => a.start - b.start || b.end - a.end);
  let out = [];
  spans.forEach((sp) => {
    let prev = out[out.length - 1];
    // Pasted-from-outside wins where the two overlap: it is the stronger claim.
    if (prev && sp.start < prev.end) {
      if (sp.end > prev.end) prev.end = sp.end;
      if (sp.kind === "outside") prev.kind = "outside";
      return;
    }
    out.push({ start: sp.start, end: sp.end, kind: sp.kind });
  });
  return out;
}

function authorshipMarkedHtml_(text, spans) {
  text = String(text || "");
  if (!text.trim()) return "<em>No written response submitted yet.</em>";
  let out = "", pos = 0;
  (spans || []).forEach((sp) => {
    if (sp.start < pos) return;
    out += esc(text.slice(pos, sp.start));
    out += '<mark class="authmark ' + sp.kind + '">' + esc(text.slice(sp.start, sp.end)) + "</mark>";
    pos = sp.end;
  });
  out += esc(text.slice(pos));
  return out.replace(/\n/g, "<br>");
}

// The one line under the box, and the chip beside the name.
function authorshipNote_(text, spans, process) {
  let t = String(text || "");
  let total = t.length;
  let words = typeof wordCount === "function" ? wordCount(t) : 0;
  let outside = 0, fromSource = 0;
  (spans || []).forEach((sp) => { let n = sp.end - sp.start; if (sp.kind === "outside") outside += n; else fromSource += n; });
  let pct = total ? Math.round((outside / total) * 100) : 0;
  let m = typeof writingProcessMetrics_ === "function" ? writingProcessMetrics_(process) : null;
  let tracked = !!(m && (m.inputEvents || m.activeMsRaw || m.pasteCount));
  // Word count first, because that is the thing a teacher actually wants at a
  // glance. The old line said "1,032 typed", which is CHARACTERS and read as a
  // word count -- so it is spelled out now and the word figure leads.
  let bits = [];
  if (total) bits.push(words.toLocaleString() + " word" + (words === 1 ? "" : "s"));
  if (tracked) {
    bits.push(m.minutes + " min active");
    // Always stated, including when it is none: "no pastes" is information.
    bits.push(m.pasteCount
      ? m.pasteCount + " paste" + (m.pasteCount === 1 ? "" : "s") + " (" + m.pastedChars.toLocaleString() + " character" + (m.pastedChars === 1 ? "" : "s") + ")"
      : "no pastes");
  } else if (total) {
    bits.push("no process data \u2014 written before tracking was on");
  }
  if (outside) bits.push(outside.toLocaleString() + " character" + (outside === 1 ? "" : "s") + " (" + pct + "%) pasted from outside");
  if (fromSource) bits.push(fromSource.toLocaleString() + " matching the story text");
  return { line: bits.join(" \u00b7 "), outside: outside, fromSource: fromSource, pct: pct, total: total, words: words };
}

function authorshipChipHtml_(note) {
  if (!note || !note.outside) return "";
  return '<span class="mini-chip paste-chip">\u{1F4CB} ' + note.pct + "% pasted</span>";
}


// Sentence-level change map. A lightly edited sentence is shown once as an
// original/revised pair instead of turning every changed word into a checkerboard.
function revisionUnits_(text) {
  text = String(text || "").replace(/\r\n?/g, "\n").trim();
  if (!text) return [];
  let units = text.match(/[^.!?\n]+(?:[.!?]+[\"'”’\)\]]*)?(?:\s+|$)|\n+/g) || [text];
  return units.filter((x) => x && x.trim()).map((raw) => ({
    raw: raw.replace(/\s+$/g, " "),
    key: raw.replace(/\s+/g, " ").trim().toLowerCase()
  }));
}
function revisionDiffHtml_(before, after) {
  before = String(before || ""); after = String(after || "");
  if (!before && !after) return `<em>No revision text yet.</em>`;
  if (before === after) return `<div class="diff-unchanged-note">No changes yet — the revised draft still matches the rough draft.</div>`;
  let A = revisionUnits_(before), B = revisionUnits_(after), n = A.length, m = B.length;
  // LCS on sentence-sized units is both stable and small for classroom stories.
  let dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = A[i].key === B[j].key ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0,j=0,ops=[];
  while(i<n || j<m){
    if(i<n && j<m && A[i].key===B[j].key){ ops.push({type:"same",text:B[j].raw}); i++;j++; }
    else if(j<m && (i===n || dp[i][j+1] >= dp[i+1][j])){ ops.push({type:"add",text:B[j].raw}); j++; }
    else { ops.push({type:"del",text:A[i].raw}); i++; }
  }
  let html="", k=0, sameBuffer="";
  function flushSame(){ if(!sameBuffer) return; html += `<div class="diff-same-passage">${esc(sameBuffer.trim())}</div>`; sameBuffer=""; }
  while(k<ops.length){
    if(ops[k].type==="same"){ sameBuffer += ops[k].text; k++; continue; }
    flushSame();
    let dels=[], adds=[];
    while(k<ops.length && ops[k].type!=="same"){
      if(ops[k].type==="del") dels.push(ops[k].text);
      else adds.push(ops[k].text);
      k++;
    }
    html += `<div class="diff-change-pair">${dels.length ? `<div class="diff-before"><span>Original</span>${esc(dels.join("").trim())}</div>` : ""}${adds.length ? `<div class="diff-after"><span>Revised</span>${esc(adds.join("").trim())}</div>` : ""}</div>`;
  }
  flushSame();
  return html || `<em>No visible changes.</em>`;
}

function save() {
  try {
    localStorage.setItem("shortStoryState", JSON.stringify(state));
  } catch (e) {
    console.warn("Local save skipped (storage unavailable):", e);
  }
}

function esc(s) {
  // Accept strings, numbers, booleans, and other scalar values safely.
  // v24 introduced numeric combined-grade values in several render paths;
  // calling .replace() directly on a number caused the app to fall into the
  // misleading "Backend setup needed" error screen.
  return String(s ?? "").replace(
    new RegExp("[&<>\"']", "g"),
    (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m],
  );
}


function studioAsset_(name) {
  let a = typeof window !== "undefined" ? window.SHORT_STORY_STUDIO_ART : null;
  return a && a[name] ? a[name] : "";
}

function studioStoryImage_(id) {

}

function focusButtonHtml_(mode, label) {
  // Previously gated on state.role === "student", which meant a teacher
  // previewing a story or the Writing Workshop saw no Read Mode / Focus
  // button at all -- and reasonably concluded the feature wasn't there.
  // Focus mode belongs to the page, not to who is looking at it.
  let active = window.__sssFocusMode === mode;
  let inactiveText = mode === "story" ? (label || "Read Mode") : (label || "Focus Writing");
  let activeText = mode === "story"
    ? "✕ Exit Read Mode"
    : (inactiveText === "Focused Revision" ? "✕ Exit Focused Revision" : "✕ Exit Focus");
  return `<button type="button" class="btn focus-mode-btn ${active ? "is-active" : ""}" data-focus-mode="${mode}" data-focus-label="${esc(inactiveText)}" aria-pressed="${active ? "true" : "false"}">${active ? activeText : `◱ ${esc(inactiveText)}`}</button>`;
}

function setFocusMode_(mode) {
  mode = mode || "";
  window.__sssFocusMode = mode;
  document.body.classList.remove("focus-mode", "focus-story", "focus-writing", "focus-revision-stage");
  if (mode) {
    document.body.classList.add("focus-mode", "focus-" + mode);
    if (mode === "writing" && window.__sssFocusLabel === "Focused Revision") document.body.classList.add("focus-revision-stage");
    window.scrollTo(0, 0);
  } else {
    window.__sssFocusLabel = "";
  }
  document.querySelectorAll(".focus-mode-btn").forEach((b) => {
    let active = !!mode && b.dataset.focusMode === mode;
    b.classList.toggle("is-active", active);
    b.setAttribute("aria-pressed", active ? "true" : "false");
    let focusLabel = b.dataset.focusLabel || (b.dataset.focusMode === "story" ? "Read Mode" : "Focus Writing");
    if (b.dataset.focusMode === "story") b.textContent = active ? "✕ Exit Read Mode" : `◱ ${focusLabel}`;
    else b.textContent = active ? (focusLabel === "Focused Revision" ? "✕ Exit Focused Revision" : "✕ Exit Focus") : `◱ ${focusLabel}`;
  });
}

// Normalizes a saved multiple-choice answer (a legacy plain index, a picks
// array, or nothing yet) into attempt/scoring info. Students get up to two
// tries: full credit on the first try, half credit on the second, and the
// correct answer is revealed once both tries are used.
function answerInfo(key, raw) {
  let qa = QUESTIONS[key];
  if (!qa) return null;
  let correctIdx = qa[2];
  let picks = Array.isArray(raw) ? raw : raw !== undefined && raw !== null ? [raw] : [];
  let attempts = picks.length;
  let correct = picks.includes(correctIdx);
  let score = attempts === 0 ? null : correct ? (picks[0] === correctIdx ? 1 : 0.5) : attempts >= 2 ? 0 : null;
  let locked = correct || attempts >= 2;
  return { picks, attempts, correctIdx, correct, score, locked };
}

function released(id) {
  return state.role !== "student" || state.releasedStories.includes(id);
}

// Same idea as released(id) above, but for a Writing Workshop assignment
// (Prewriting/Drafting/Revision/Final Draft) instead of a reading story --
// lets a teacher hide a stage from students until the class is ready for it,
// exactly like the existing story-release toggle. Teachers/admins always see
// everything; a student sees only what's in state.releasedWritingStages.
function stageReleased(key) {
  return state.role !== "student" || state.releasedWritingStages.includes(key);
}

// Same again, for one of the three graded discussion boards (What If /
// Movie Pitch / Thesis). An unassigned board is hidden from students with a
// short "not open yet" note in its place, rather than showing an empty board
// they can't be graded on.
function discussionReleased(key) {
  return state.role !== "student" || state.releasedDiscussions.includes(key);
}
function discussionClosedNote(key) {
  return `<div class="card"><h3>${esc(DISCUSSION_LABELS[key])}</h3><p class="toolbar-note">Your teacher hasn't opened this discussion yet. It'll appear here once they do.</p></div>`;
}

function storyPager(id) {
  let idx = STORY_ORDER.indexOf(id);
  let prevId = idx > 0 ? STORY_ORDER[idx - 1] : null;
  let nextId = idx >= 0 && idx < STORY_ORDER.length - 1 ? STORY_ORDER[idx + 1] : null;

  let backHtml = prevId
    ? `<button class="btn story-pager-btn" data-view="story:${prevId}">← Back: ${esc(STORIES[prevId].title)}</button>`
    : `<button class="btn story-pager-btn" data-view="home">← Back to Overview</button>`;

  let nextHtml;
  if (!nextId) {
    nextHtml = `<button class="btn primary story-pager-btn" data-view="writing">Continue to the Writing Workshop →</button>`;
  } else if (released(nextId)) {
    nextHtml = `<button class="btn primary story-pager-btn" data-view="story:${nextId}">Next: ${esc(STORIES[nextId].title)} →</button>`;
  } else {
    nextHtml = `<button class="btn story-pager-btn locked" disabled>🔒 Next: ${esc(STORIES[nextId].title)} (not yet released)</button>`;
  }
  return `<div class="story-pager">${backHtml}${nextHtml}</div>`;
}

// Small, hand-drawn inline SVG line-icon set (v66-icon-set). Every icon is
// stroke-only ("currentColor"), so it inherits whatever text color its
// container already uses -- no separate light/dark or role variants needed.
// Kept intentionally tiny (no external icon font/library) to match the
// app's existing rule of never depending on outside assets.
function svgIcon_(name) {

function storyProgressInfo_(id) {
  let info = answerInfo(id, state.answers[id]);
  let mcDone = !!(info && info.locked);
  let dokStarted = !!String(state.dok[id] || "").trim();
  let dokDone = isSubmitted_("story", id);
  let extension = STORY_EXTENSION_ACTIVITY[id];
  let extensionAssigned = !!extension && gradedActivityAssigned_("story:" + id);
  let extensionDone = extensionAssigned && isSubmitted_("activity", "story:" + id);
  let annotationsAssigned = typeof storyAnnotationsOn_ === "function" && storyAnnotationsOn_(id);
  let annotationsDone = annotationsAssigned && isSubmitted_("annotation", id);
  let annotationsStarted = annotationsAssigned && myAnnotations_(id).length > 0;
  // Writing is complete for navigation only after explicit turn-in.
  return { mcDone, dokDone, extensionAssigned, extensionDone, annotationsAssigned, annotationsDone,
    done: mcDone && dokDone && (!extensionAssigned || extensionDone) && (!annotationsAssigned || annotationsDone),
    started: !!(info && info.attempts) || dokStarted || (extensionAssigned && activityHasWork_(extension.title)) || annotationsStarted };
}

function activityHasWork_(title) {
  let value = state.activityResponses[title];
  if (typeof value === "string") return !!value.trim();
  if (!value || typeof value !== "object") return false;
  if (String(value.response || "").trim() || String(value.reflection || "").trim()) return true;
  if (Array.isArray(value.fields) && value.fields.some((v) => String(v || "").trim())) return true;
  let preset = (ACTIVITY_DETAILS[title] || {}).presetRows || [];
  return Array.isArray(value.table) && value.table.some((row, i) => Array.isArray(row) && row.some((v, j) => {
    let text = String(v || "").trim();
    return text && text !== String((preset[i] || [])[j] || "").trim();
  }));
}

// Approximate reading time in minutes from a story's word count (225 wpm).
// wordCount itself is always an approximation -- see the note at the top of
// StoryData.html for which figures are closely computed vs. rough estimates.
function readTime(id) {
  let s = STORIES[id];
  if (!s || !s.wordCount) return null;
  return Math.max(1, Math.round(s.wordCount / 225));
}

function assignmentDueInfo_(kind, key) {
  const schedule = state.assignmentSchedule && state.assignmentSchedule[String(kind||'') + ':' + String(key||'')];
  if (!schedule || !schedule.dueAt) return null;
  const d = new Date(schedule.dueAt);
  if (Number.isNaN(d.getTime())) return null;
  return {date:d, label:d.toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})};
}
function assignmentDueChipHtml_(kind, key) {
  const info = assignmentDueInfo_(kind,key);
  if (!info) return '';
  // Students reported not noticing that anything was due. A date that looks
  // like every other bit of small print isn't a deadline, so the chip now
  // says how close it is and colours itself accordingly.
  const ms = info.date.getTime() - Date.now();
  const day = 86400000;
  let cls = 'is-later', word = '';
  if (ms < 0) { cls = 'is-overdue'; word = 'Past due · '; }
  else if (info.date.toDateString() === new Date().toDateString()) { cls = 'is-soon'; word = 'Due today · '; }
  else if (ms < 3 * day) { cls = 'is-soon'; word = 'Due soon · '; }
  return `<span class="assignment-due-chip ${cls}">${word ? esc(word) : 'Due '}${esc(info.label)}</span>`;
}

// Explicit turn-in state. Student writing still autosaves continuously, but the
// teacher grading queue only treats work as submitted after the student presses
// Submit for grading. Any later edit reopens the assignment as In progress so a
// teacher never mistakes a half-finished revision for a fresh submission.
function submissionKey_(kind, key) { return String(kind || "") + ":" + String(key || ""); }
function submissionRecord_(kind, key) { return (state.submissions || {})[submissionKey_(kind, key)] || null; }
function isSubmitted_(kind, key) { let r = submissionRecord_(kind, key); return !!(r && r.submittedAt); }
function clearSubmission_(kind, key) {
  state.submissions = state.submissions && typeof state.submissions === "object" ? state.submissions : {};
  let k = submissionKey_(kind, key);
  if (state.submissions[k]) delete state.submissions[k];
  document.querySelectorAll(".assignmentSubmitBtn").forEach((button) => {
    if (button.dataset.submitKind === kind && button.dataset.submitKey === key) button.textContent = "Submit for grading";
  });
  document.querySelectorAll("[data-assignment-kind]").forEach((chip) => {
    if (chip.dataset.assignmentKind === kind && chip.dataset.assignmentKey === key && chip.classList.contains("is-done")) {
      chip.classList.remove("is-done"); chip.classList.add("is-progress"); chip.textContent = "◐ In progress";
    }
  });
}

function markSubmitted_(kind, key) {
  state.submissions = state.submissions && typeof state.submissions === "object" ? state.submissions : {};
  state.submissions[submissionKey_(kind, key)] = { submittedAt: new Date().toISOString() };
  save();
}
function submitButtonHtml_(kind, key, label) {
  let done = isSubmitted_(kind, key);
  return `<div class="assignment-submit-row"><button type="button" class="btn primary assignmentSubmitBtn" data-submit-kind="${esc(kind)}" data-submit-key="${esc(key)}">${done ? "✓ Submitted" : esc(label || "Submit for grading")}</button><span class="toolbar-note">${done ? "Your teacher can now see this as ready to grade. Editing it again will return it to In progress." : "Your work autosaves while you write. Submit only when this assignment is ready for your teacher."}</span></div>`;
}

// "Not started / In progress / Submitted / Graded" for one assignment, so a
// student can tell at a glance which ones they still owe. Reads the work they
// have actually saved, and the grade summary when the class backend is on.
function assignmentStatusChipHtml_(kind, key, opts) {
  opts = opts || {};
  const backend = typeof window !== "undefined" ? window.SHORTSTORY_BACKEND : null;
  const gs = (backend && backend.gradeSummary) || {};
  let rec = null;
  if (kind === 'activity') rec = gs.activities && gs.activities[key];
  else if (kind === 'annotation') rec = gs.stories && gs.stories[key] && gs.stories[key].annotation;
  else if (kind === 'story') rec = gs.stories && gs.stories[key];
  else if (kind === 'stage') rec = gs.writingStages && gs.writingStages[key];
  if (rec && rec.excluded) return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-excluded">Not counted</span>`;
  if (rec && rec.score !== null && rec.score !== undefined) {
    return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-graded">✓ Graded${rec.possible ? ` · ${rec.score}/${rec.possible}` : ''}</span>`;
  }
  if (kind === 'finalDraft' && gs.rubricTotal && Number(gs.rubricTotal.possible || 0) > 0 && !gs.rubricTotal.pending && Number(gs.rubricTotal.earned || 0) >= 0) {
    return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-graded">✓ Graded · ${gs.rubricTotal.earned}/${gs.rubricTotal.possible}</span>`;
  }
  const started = !!opts.started, done = opts.done !== undefined ? !!opts.done : isSubmitted_(kind, key);
  if (done) return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-done">✓ Turned in</span>`;
  if (started) return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-progress">◐ In progress</span>`;
  return `<span data-assignment-kind="${esc(kind)}" data-assignment-key="${esc(key)}" class="assignment-status-chip is-todo">● Not started yet</span>`;
}

// "Full text" badge (2026-10-31): marks the stories whose own text is pasted into this copy
// (#storyTextStore) -- but only when some stories don't have it. In a copy where every story has
// its text, a badge on all of them would say nothing, so none is shown.
function fullTextBadges_() {
  if (fullTextBadges_.v == null) {
    let have = STORY_ORDER.map((x) => !!storyRawText(x));
    fullTextBadges_.v = have.some(Boolean) && !have.every(Boolean);
  }
  return fullTextBadges_.v;
}
function fullTextBadgeHtml_(id) {
  return fullTextBadges_() && storyRawText(id) ? `<span class="fulltext-badge" title="The whole story is right here in the app">📖 Full text</span>` : "";
}

function storyTile(id) {
  let s = STORIES[id];
  let eq = EQ.find((e) => e.id === STORY_EQ[id]);
  let mins = readTime(id);
  let meta = [];
  if (s.wordCount) meta.push(`~${s.wordCount.toLocaleString()} words`);
  if (mins) meta.push(`~${mins} min`);
  if (s.lexile) meta.push(`Lexile ${s.lexile}`);
  let due = assignmentDueChipHtml_("story", id);
  let locked = !released(id);
  let progress = storyProgressInfo_(id);
  let status = state.role !== "student" ? "Preview" : locked ? "Locked" : progress.done ? "Submitted" : progress.started ? "In progress" : "Ready";
  let statusClass = locked ? "is-locked" : progress.done ? "is-done" : progress.started ? "is-progress" : "is-ready";
  let tileSrc = studioStoryImage_(id);
  let img = tileSrc ? `<img src="${esc(tileSrc)}" alt="" loading="lazy" onerror="this.style.opacity=0">` : "";
  return `<button class="tile openStoryFromCard ${statusClass}" data-story="${id}" ${locked ? "disabled" : ""}><div class="tile-art">${img}<div class="tilenum">${s.order}</div><div class="tile-status">${status === "Submitted" ? "✓ " : status === "In progress" ? "◐ " : status === "Locked" ? "🔒 " : ""}${status}</div>${eq ? `<div class="tileeq" style="--tile-accent:${eq.color}">${esc(eq.label)}</div>` : ""}${locked ? `<div class="tilelock"><span>🔒</span><small>Not released yet</small></div>` : ""}</div><div class="tilebody"><h4>${esc(s.title)}</h4><div class="tilemeta">${fullTextBadgeHtml_(id)}${meta.map((m) => `<span>${esc(m)}</span>`).join("")}${due}</div></div></button>`;
}

function myGradesCard() {
  let backend = typeof window !== "undefined" ? window.SHORTSTORY_BACKEND : null;
  if (!backend || !backend.enabled || state.role !== "student") return "";
  let gs = backend.gradeSummary || {};
  let gradedStories = STORY_ORDER.filter((id) => gs.stories && gs.stories[id] && gs.stories[id].visible !== false && gs.stories[id].possible > 0).length;
  let gradedStages = WRITING_STAGE_ORDER.filter((key) => gs.writingStages && gs.writingStages[key] && gs.writingStages[key].visible !== false && gs.writingStages[key].score !== null && gs.writingStages[key].score !== undefined).length;
  let gradedFinal = STORY_RUBRIC_ORDER.filter((key) => gs.storyRubric && gs.storyRubric[key] && gs.storyRubric[key].visible !== false && gs.storyRubric[key].score !== null && gs.storyRubric[key].score !== undefined).length;
  let gradedDiscussions = DISCUSSION_ORDER.filter((key) => gs.discussions && gs.discussions[key] && gs.discussions[key].visible !== false && gs.discussions[key].score !== null && gs.discussions[key].score !== undefined).length;
  let gradedActivities = PREWRITING_ACTIVITY_ORDER.filter((key) => { let r = gs.activities && gs.activities["pre:" + key]; return r && r.visible !== false && r.score !== null && r.score !== undefined; }).length;
  let feedbackCount = 0;
  STORY_ORDER.forEach((id) => { let r=gs.stories&&gs.stories[id]; if (r&&r.visible!==false&&r.dok&&r.dok.comment) feedbackCount++; });
  WRITING_STAGE_ORDER.forEach((key) => { let r=gs.writingStages&&gs.writingStages[key]; if (r&&r.visible!==false&&r.comment) feedbackCount++; });
  STORY_RUBRIC_ORDER.forEach((key) => { let r=gs.storyRubric&&gs.storyRubric[key]; if (r&&r.visible!==false&&r.comment) feedbackCount++; });
  DISCUSSION_ORDER.forEach((key) => { let r=gs.discussions&&gs.discussions[key]; if (r&&r.visible!==false&&r.comment) feedbackCount++; });
  PREWRITING_ACTIVITY_ORDER.forEach((key)=>{ let r=gs.activities&&gs.activities["pre:"+key]; if(r&&r.visible!==false&&r.comment) feedbackCount++; });
  STORY_ORDER.forEach((id)=>{ let r=gs.stories&&gs.stories[id]&&gs.stories[id].extension; if(r&&r.visible!==false&&r.comment) feedbackCount++; });
  let anyGraded = gradedStories + gradedStages + gradedFinal + gradedDiscussions + gradedActivities > 0;
  let summary = anyGraded
    ? `${gradedStories} reading · ${gradedActivities} activity${gradedActivities === 1 ? "" : "ies"} · ${gradedStages} writing stage${gradedStages === 1 ? "" : "s"} · ${gradedFinal} final-draft criteria · ${gradedDiscussions} discussion${gradedDiscussions === 1 ? "" : "s"}`
    : "Nothing has been graded yet. This area will update as your teacher scores your work.";
  return `<div class="card student-grade-center"><div class="student-grade-center-copy"><div class="pill">Student Dashboard</div><h2>Grades &amp; Feedback</h2><p>${summary}</p>${feedbackCount ? `<p class="toolbar-note">You have ${feedbackCount} teacher feedback comment${feedbackCount === 1 ? "" : "s"} available.</p>` : `<p class="toolbar-note">Teacher comments will appear here with the assignment they belong to.</p>`}</div><button type="button" class="btn primary openGradesFeedback">View Grades &amp; Feedback</button></div>`;
}

function studentGradeStatusHtml_(score, possible, pending) {
  if (score === null || score === undefined) {
    if (pending && possible) return `<span class="grade-center-score pending">—/${possible} · pending</span>`;
    return `<span class="grade-center-score ungraded">Not graded</span>`;
  }
  return `<span class="grade-center-score ${pending ? "pending" : ""}">${score}/${possible}${pending ? " · pending" : ""}</span>`;
}

function studentFeedbackHtml_(comment) {
  return comment ? `<div class="student-feedback-note"><strong>Teacher feedback</strong><p>${esc(comment)}</p></div>` : `<div class="student-feedback-note empty">No teacher comment yet.</div>`;
}

function openGradesFeedback() {
  let backend = typeof window !== "undefined" ? window.SHORTSTORY_BACKEND : null;
  if (!backend || !backend.gradeSummary) return alert("Grades are not available yet.");
  let gs = backend.gradeSummary;
  let reading = STORY_ORDER.map((id) => {
    let a = gs.stories && gs.stories[id];
    if (!a || a.visible === false) return "";
    let dok = a.dok || {};
    let ext = a.extension || {};
    let ann = a.annotation || {};
    let mcEarned = a.mc && a.mc.score !== null ? (a.mc.score === 1 ? READING_MC_POINTS : a.mc.score === .5 ? READING_MC_POINTS / 2 : 0) : "—";
    let parts = [`Multiple choice ${mcEarned}/${READING_MC_POINTS}`, `DOK ${dok.score !== null && dok.score !== undefined ? dok.score : "—"}/${READING_DOK_POINTS}`];
    if (ext.visible !== false && ext.assigned) parts.push(`Extension ${ext.score !== null && ext.score !== undefined ? ext.score : "—"}/${ACTIVITY_RUBRIC_MAX}`);
    if (ann.visible && ann.assigned) parts.push(`Annotations ${ann.score !== null && ann.score !== undefined ? ann.score : "—"}/${ANNOTATION_MAX}`);
    let detail = parts.join(" · ");
    let feedback = [];
    if (dok.comment) feedback.push(`<div class="student-feedback-note"><strong>DOK feedback</strong><p>${esc(dok.comment)}</p></div>`);
    if (ext.visible !== false && ext.assigned && ext.comment) feedback.push(`<div class="student-feedback-note"><strong>Extension feedback</strong><p>${esc(ext.comment)}</p></div>`);
    if (ann.visible && ann.assigned && ann.comment) feedback.push(`<div class="student-feedback-note"><strong>Annotation feedback</strong><p>${esc(ann.comment)}</p></div>`);
    if (!feedback.length) feedback.push(`<div class="student-feedback-note empty">No teacher comment yet.</div>`);
    let expected = READING_MC_POINTS + READING_DOK_POINTS + ((ext.visible !== false && ext.assigned) ? ACTIVITY_RUBRIC_MAX : 0) + ((ann.visible && ann.assigned) ? ANNOTATION_MAX : 0);
    return `<div class="grade-center-item"><div class="grade-center-item-head"><div><strong>${esc(STORIES[id].title)}</strong><small>${detail}</small></div>${studentGradeStatusHtml_(a.hasAnyResult ? a.earned : null, a.possible || expected, !!a.pending)}</div>${feedback.join("")}</div>`;
  }).join("");

  let prewritingActivities = PREWRITING_ACTIVITY_ORDER.map((key) => {
    let r = gs.activities && gs.activities["pre:" + key];
    if (!r || r.visible === false) return "";
    let rub = taskRubric_("activity", "pre:" + key);
    let level = r.score !== null && r.score !== undefined ? rubricLevelName_(rub, r.score) : "";
    let desc = r.score !== null && r.score !== undefined ? rubricLevelText_(rub, r.score) : "";
    return `<div class="grade-center-item"><div class="grade-center-item-head"><div><strong>${esc(PREWRITING_ACTIVITY_LABELS[key])}</strong>${level ? `<small>${esc(level)}${desc ? ` · ${esc(desc)}` : ""}</small>` : `<small>${esc(rub.label)} rubric · 7 points</small>`}</div>${studentGradeStatusHtml_(r.score, r.possible || ACTIVITY_RUBRIC_MAX, false)}</div>${studentFeedbackHtml_(r.comment)}</div>`;
  }).join("");

  let stages = WRITING_STAGE_ORDER.map((key) => {
    let r = gs.writingStages && gs.writingStages[key];
    if (!r || r.visible === false) return "";
    let rub = taskRubric_("writingStage", key);
    let level = r.score !== null && r.score !== undefined ? rubricLevelName_(rub, r.score) : "";
    let desc = r.score !== null && r.score !== undefined ? rubricLevelText_(rub, r.score) : "";
    return `<div class="grade-center-item"><div class="grade-center-item-head"><div><strong>${esc(WRITING_STAGE_LABELS[key])}</strong>${level ? `<small>${esc(level)}${desc ? ` · ${esc(desc)}` : ""}</small>` : ""}</div>${studentGradeStatusHtml_(r.score, r.possible || WRITING_STAGE_MAX, false)}</div>${studentFeedbackHtml_(r.comment)}${key === "drafting" && typeof draftNotesGradeCenterHtml_ === "function" ? draftNotesGradeCenterHtml_() : ""}</div>`;
  }).join("");

  let finalRows = STORY_RUBRIC_ORDER.map((key) => {
    let r = gs.storyRubric && gs.storyRubric[key];
    let c = STORY_RUBRIC[key];
    if (!r || r.visible === false) return "";
    let level = r.score !== null && r.score !== undefined ? c.levels.find((l) => l.points === r.score) : null;
    return `<div class="grade-center-item"><div class="grade-center-item-head"><div><strong>${esc(c.label)}</strong>${level ? `<small>${esc(level.text)}</small>` : ""}</div>${studentGradeStatusHtml_(r.score, r.possible || STORY_RUBRIC_MAX, r.pending)}</div>${studentFeedbackHtml_(r.comment)}</div>`;
  }).join("");

  let discussions = DISCUSSION_ORDER.map((key) => {
    let r = gs.discussions && gs.discussions[key];
    if (!r || r.visible === false) return "";
    let rub = taskRubric_("discussion", key);
    let level = r.score !== null && r.score !== undefined ? rubricLevelName_(rub, r.score) : "";
    let desc = r.score !== null && r.score !== undefined ? rubricLevelText_(rub, r.score) : "";
    return `<div class="grade-center-item"><div class="grade-center-item-head"><div><strong>${esc(DISCUSSION_LABELS[key])}</strong>${level ? `<small>${esc(level)}${desc ? ` · ${esc(desc)}` : ""}</small>` : ""}</div>${studentGradeStatusHtml_(r.score, r.possible || DISCUSSION_MAX, false)}</div>${studentFeedbackHtml_(r.comment)}</div>`;
  }).join("");

  let readingTotal = gs.total || {earned:0,possible:0};
  let activityTotal = gs.activitiesTotal || {earned:0,possible:0};
  let stagesTotal = gs.writingStagesTotal || {earned:0,possible:0};
  let finalTotal = gs.rubricTotal || {earned:0,possible:0};
  let discussionTotal = gs.discussionsTotal || {earned:0,possible:0};
  let sections = [
    reading ? `<h3>Reading Responses</h3><div class="grade-center-list">${reading}</div>` : "",
    prewritingActivities ? `<h3>Prewriting &amp; Practice</h3><div class="grade-center-list">${prewritingActivities}</div>` : "",
    stages ? `<h3>Writing Workshop</h3><div class="grade-center-list">${stages}</div>` : "",
    finalRows ? `<h3>Final Draft Rubric</h3><div class="grade-center-list">${finalRows}</div>` : "",
    discussions ? `<h3>Discussions</h3><div class="grade-center-list">${discussions}</div>` : "",
  ].filter(Boolean).join("");
  document.getElementById("modalRoot").innerHTML = `<div class="modal"><div class="modalbox grade-center-modal"><div class="grade-center-modal-top"><div><div class="pill">Student Dashboard</div><h2>Grades &amp; Feedback</h2><p class="toolbar-note">Only assignments your teacher has assigned and chosen to grade appear here.</p></div><button type="button" class="btn modal-dismiss" id="closeGradesFeedback">Close</button></div><div class="grade-center-summary"><div><strong>Reading</strong><span>${readingTotal.possible ? readingTotal.earned + "/" + readingTotal.possible + (readingTotal.pending ? " · pending" : "") : "—"}</span></div><div><strong>Prewriting / Practice</strong><span>${activityTotal.possible ? activityTotal.earned + "/" + activityTotal.possible : "—"}</span></div><div><strong>Writing</strong><span>${stagesTotal.possible ? stagesTotal.earned + "/" + stagesTotal.possible : "—"}</span></div><div><strong>Final Draft</strong><span>${finalTotal.possible ? finalTotal.earned + "/" + finalTotal.possible + (finalTotal.pending ? " · pending" : "") : "—"}</span></div><div><strong>Discussions</strong><span>${discussionTotal.possible ? discussionTotal.earned + "/" + discussionTotal.possible : "—"}</span></div></div>${sections || '<p class="toolbar-note">No assigned grades are available yet.</p>'}</div></div>`;
  let close = document.getElementById("closeGradesFeedback");
  if (close) close.onclick = () => (document.getElementById("modalRoot").innerHTML = "");
}

function generalRubricReferenceHtml_(rubric) {
  return `<div class="rubric-reference-list">${rubric.levels.map((l) => `<div class="rubric-reference-row"><div class="rubric-reference-score"><strong>${esc(l.label)}</strong><span>${l.points} pts</span></div><div>${l.text ? esc(l.text) : "No descriptor in the source rubric."}</div></div>`).join("")}</div>`;
}

function storyRubricReferenceHtml_() {
  return `<div class="story-rubric-reference">${STORY_RUBRIC_ORDER.map((key) => { let c = STORY_RUBRIC[key]; return `<section><h3>${esc(c.label)}</h3>${c.levels.map((l) => `<div class="rubric-reference-row"><div class="rubric-reference-score"><strong>${l.points} pts</strong></div><div>${esc(l.text)}</div></div>`).join("")}</section>`; }).join("")}</div>`;
}

function openRubricModal(kind, item) {
  let title = "Rubric";
  let subtitle = "Use this before you submit so you know what your teacher will be looking for.";
  let body = "";
  let itemRubric = null;
  if (item && typeof taskRubric_ === "function") {
    let cut = String(item).indexOf(":");
    let t = cut > 0 ? String(item).slice(0, cut) : "", k = cut > 0 ? String(item).slice(cut + 1) : "";
    if (t && (typeof TASK_RUBRICS === "undefined" || TASK_RUBRICS[t + ":" + k] || TASK_RUBRICS[t + ":*"])) itemRubric = taskRubric_(t, k);
  }
  if (itemRubric) { title = itemRubric.label + " Rubric"; subtitle = "This rubric is written for this assignment · 7 points. Use it before you submit so you know what your teacher will be looking for."; body = generalRubricReferenceHtml_(itemRubric); }
  else if (kind === "written") { title = "Written Response Rubric"; body = generalRubricReferenceHtml_(WRITTEN_RESPONSE_RUBRIC); }
  else if (kind === "discussion") { title = "Discussion Rubric"; body = generalRubricReferenceHtml_(DISCUSSION_RUBRIC); }
  else if (kind === "activity") { title = "Written Response Rubric"; subtitle = "This same 7-point rubric is used for labs, practice activities, story extensions, Drafting, and Revision."; body = generalRubricReferenceHtml_(WRITTEN_RESPONSE_RUBRIC); }
  else { title = "Final Draft Short Story Rubric"; subtitle = "Your final story is scored in four areas: Plot, Character Development, Setting, and Theme — 7 points each, 28 points total."; body = storyRubricReferenceHtml_(); }
  document.getElementById("modalRoot").innerHTML = `<div class="modal"><div class="modalbox rubric-modal-box"><div class="rubric-modal-head"><div><div class="pill">Before You Submit</div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="btn modal-dismiss" id="closeRubricModal">Close</button></div>${body}</div></div>`;
  document.getElementById("closeRubricModal").onclick = () => (document.getElementById("modalRoot").innerHTML = "");
}

function rubricButtonHtml(kind, label, item) {
  return `<button type="button" class="btn rubric-preview-btn openRubric" data-rubric="${esc(kind)}"${item ? ` data-rubric-item="${esc(item)}"` : ""}>${esc(label || "View Rubric")}</button>`;
}

// The name of the rubric level a score corresponds to ("Very Good" for a 6),
// or "" if the score doesn't match a level -- used so a student sees what
// their score MEANS on the teacher's rubric, not just a number out of 7.
function rubricLevelName_(rubric, score) {
  let l = rubric && rubric.levels ? rubric.levels.find((x) => x.points === score) : null;
  return l ? l.label : "";
}
function rubricLevelText_(rubric, score) {
  let l = rubric && rubric.levels ? rubric.levels.find((x) => x.points === score) : null;
  return l && l.text ? l.text : "";
}

// Shows a student their teacher-graded Final Draft rubric score, once any of
// it has been graded. Mirrors myGradesCard() above, but for the Writing
// Workshop's Plot/Character Development/Setting/Theme rubric instead of the
// reading unit's per-story MC+DOK grade.
function myStoryRubricGradeCard() {
  let backend = typeof window !== "undefined" ? window.SHORTSTORY_BACKEND : null;
  if (!backend || !backend.enabled || state.role !== "student") return "";
  let gs = backend.gradeSummary;
  if (!gs || !gs.storyRubric || !gs.rubricTotal || !gs.rubricTotal.possible) return "";
  let rows = STORY_RUBRIC_ORDER.map((key) => {
    let c = STORY_RUBRIC[key];

    if (r.pending) return `<div class="grade-pill pending">${esc(c.label)}<br><strong>${r.score}/${r.possible}</strong><small>Based on your self-assessment -- your teacher hasn't reviewed this yet</small></div>`;
    return `<div class="grade-pill">${esc(c.label)}<br><strong>${r.score}/${r.possible}</strong>${r.comment ? `<div class="grade-comment">${esc(r.comment)}</div>` : ""}</div>`;
  }).join("");

  return `<div class="card"><h3>Your Final Draft Grade</h3><p class="toolbar-note">Total: <strong>${gs.rubricTotal.earned}/${gs.rubricTotal.possible}</strong>${totalNote}</p><div class="grade-pill-row">${rows}</div></div>`;
}

function gradedActivityAssigned_(itemKey) {
  if (String(itemKey).startsWith("pre:")) {
    let key = String(itemKey).slice(4);
    return state.releasedWritingStages.includes("prewriting") && state.releasedPrewritingActivities.includes(key);
  }
  if (String(itemKey).startsWith("story:")) {
    let id = String(itemKey).slice(6);
    return state.releasedStories.includes(id) && state.releasedStoryActivities.includes(id);
  }
  return true;
}

function resourceCard(r, gradedItemKey) {
  let [type, title, target] = r;
  if (gradedItemKey && !gradedActivityAssigned_(gradedItemKey)) return "";
  let isUrl = new RegExp("^https?:/{2}", "i").test(target || "");
  // A graded assignment's only way in used to be a pale button that looked
  // exactly like "View Rubric" and "Back" -- students said they couldn't tell
  // an assignment existed. It's now the primary action on the card.
  let started = activityHasWork_(title);
  let action = isUrl
    ? `<a target="_blank" rel="noopener" href="${esc(target)}">Open resource ↗</a>`
    : `<p>${esc(target || "")}</p><button class="btn ${gradedItemKey ? "primary assignment-open-btn" : ""} openActivity" data-activity="${esc(title)}">${gradedItemKey ? (started ? "Continue assignment →" : "Start assignment →") : "Open activity"}</button>`;
  let graded = !!gradedItemKey;
  let due = graded && typeof assignmentDueChipHtml_ === "function" ? assignmentDueChipHtml_("activity", gradedItemKey) : "";
  return `<div class="activity card ${graded ? "assignment-card compact-assignment" : ""}"><div class="icon">${type === "Video" ? svgIcon_("play") : type === "Activity" ? svgIcon_("task") : svgIcon_("link")}</div><div>${graded ? `<div class="assignment-flags"><span class="assignment-kicker">Graded Assignment · ${ACTIVITY_RUBRIC_MAX} points</span>${assignmentStatusChipHtml_("activity", gradedItemKey, {started:started})}${due}</div><div class="assignment-title-row"><h3>${esc(title)}</h3><div class="stage-title-actions">${rubricButtonHtml("activity", "View Rubric", "activity:" + gradedItemKey)}</div></div>` : `<div class="pill">${esc(type)}</div><h3>${esc(title)}</h3>`}${action}</div></div>`;
}

// Renders the short warm-up question shown before the reading on a story's
// page (LEAD_QUESTIONS[id] -- a poll, true/false, or agree/disagree). Once
// a student has picked an option it's locked in (state.leadPoll[id]) and a
// "See how the class answered" button appears; that button's click handler
// (wired in bind()) fetches the live tally from the backend on demand,
// since this render() pass is synchronous and has no network access itself.
function leadPollBox(id) {
  let lead = LEAD_QUESTIONS[id];
  if (!lead) return "";
  let typeLabel = lead.type === "tf" ? "True or False" : lead.type === "agree" ? "Agree or Disagree" : "Quick Poll";
  state.leadPoll = state.leadPoll && typeof state.leadPoll === "object" ? state.leadPoll : {};
  let picked = state.leadPoll[id];
  let body;
  if (picked === undefined || picked === null) {
    body = `<div class="opts">${lead.options
      .map((o, i) => `<button class="opt" data-leadopt="${i}" data-story="${id}">${esc(o)}</button>`)
      .join("")}</div>`;
  } else {
    body = `<div class="quiz-status good">Your answer: ${esc(lead.options[picked] || "")}</div><div style="margin-top:10px"><button class="btn" id="leadPollBtn-${id}" data-story="${id}">See how the class answered</button><div id="leadPollResult-${id}" style="margin-top:8px"></div></div>`;
  }
  return `<div class="question story-lead-poll"><strong>Quick Poll · ${esc(typeLabel)}</strong><p>${esc(lead.prompt)}</p>${body}</div>`;
}

// Turns a getLeadPollTally() result ({total, counts}) into simple horizontal
// bar rows, one per option, ordered to match LEAD_QUESTIONS[id].options.
function leadPollTallyHtml(id, res) {
  let lead = LEAD_QUESTIONS[id];
  if (!lead) return "";
  if (!res || !res.total) return `<p class="toolbar-note">No answers recorded yet.</p>`;
  let rows = lead.options
    .map((o, i) => {
      let n = (res.counts && res.counts[String(i)]) || 0;
      let pct = res.total ? Math.round((n / res.total) * 100) : 0;
      return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(o)}</span><span>${n} (${pct}%)</span></div><div class="progressbar"><span style="width:${pct}%"></span></div></div>`;
    })
    .join("");
  return `<p class="toolbar-note">${res.total} response${res.total === 1 ? "" : "s"} so far</p>${rows}`;
}

// Story text lives as plain HTML in Index.html's #storyTextStore, NOT as a
// JS string in StoryData.html -- that's deliberate. Plain HTML text content
// has no escaping rules for quotes, apostrophes, backticks, or line breaks,
// so pasting a story in there can never break this app's JavaScript the way
// a JS string literal can. This just reads that element's text back out.
function storyRawText(id) {
  let el = document.querySelector('[data-story-text="' + id + '"]');
  if (!el) return "";
  let t = (el.textContent || "").trim();
  if (!t || t === "PASTE STORY TEXT HERE") return "";
  return el.textContent;
}

function storyTextParagraphs(text) {
  if (typeof text !== "string" || !text.trim()) return [];
  return text
    .replace(/\r\n/g, "\n")
    .split(/\n\s*\n/)
    .map((p) => p.replace(/\s+/g, " ").trim())
    .filter(Boolean);
}

function story(id) {
  let s = STORIES[id],
    qa = QUESTIONS[id],
    info = answerInfo(id, state.answers[id]);
  let optsHtml = qa[1]
    .map((o, i) => {
      let picked = info.picks.includes(i);
      let isCorrectOpt = i === info.correctIdx;
      let cls = "opt";
      let disabled = "";
      if (info.locked && isCorrectOpt) cls += " correct";
      else if (picked && !isCorrectOpt) cls += " wrong";
      if (info.locked || picked) disabled = "disabled";
      return `<button class="${cls}" data-answer="${i}" ${disabled}>${String.fromCharCode(65 + i)}. ${esc(o)}</button>`;
    })
    .join("");
  let statusHtml = "";
  if (info.locked) {
    if (info.score === 1) statusHtml = `<div class="quiz-status good">✓ Correct on the first try — ${READING_MC_POINTS}/${READING_MC_POINTS} points.</div>`;
    else if (info.score === 0.5) statusHtml = `<div class="quiz-status good">✓ Correct on the second try — ${READING_MC_POINTS / 2}/${READING_MC_POINTS} points.</div>`;
    else statusHtml = `<div class="quiz-status warn">The correct answer is highlighted above — 0/${READING_MC_POINTS} points. Review the story before moving on.</div>`;
  } else if (info.attempts === 1) {
    statusHtml = `<div class="quiz-status warn">Not quite — you have one more try.</div>`;
  }
  let qbox = `<div class="question"><strong>Comprehension Check · ${READING_MC_POINTS} points</strong><p>${esc(qa[0])}</p><div class="opts">${optsHtml}</div>${statusHtml}</div>`;
  let storyParagraphs = storyTextParagraphs(storyRawText(id));
  let hasText = storyParagraphs.length > 0;
  let readBtn = hasText
    ? s.readLink
      ? `<a class="btn" target="_blank" rel="noopener" href="${esc(s.readLink)}">Open original source ↗</a>`
      : `<span class="toolbar-note">The full text is right below -- scroll down to read, then answer the questions.</span>`
    : s.readLink
      ? `<a class="btn primary" target="_blank" rel="noopener" href="${esc(s.readLink)}">Read the full story ↗</a>`
      : `<span class="toolbar-note">Read this story in whatever your class uses (Actively Learn, your anthology, or a link/PDF your teacher provides), then come back here.</span>`;
  let glossHint = GLOSSARY[id] && GLOSSARY[id].length ? `<p class="toolbar-note">Tap or hover an underlined word for its definition.</p>` : "";
  let storyDueChip = typeof assignmentDueChipHtml_ === "function" ? assignmentDueChipHtml_("story", id) : "";
  let textPanel = hasText
    ? `<details class="story-text" open><summary>📖 Read “${esc(s.title)}”</summary><div class="story-read-toolbar"><div><span class="story-read-toolbar-kicker">Reading tools</span><strong>Ready to focus on the story?</strong></div><div class="stage-title-actions">${storyDueChip}${focusButtonHtml_("story", "Read Mode")}</div></div>${glossHint}${typeof annHowToHtml_ === "function" && storyAnnotationsOn_(id) ? annHowToHtml_(id) : ""}${storyParagraphs.map((p, pi) => `<p data-para="${pi}">${highlightGlossary(esc(p), id)}</p>`).join("")}${typeof storyAnnotationsOn_ === "function" && storyAnnotationsOn_(id) ? `<div class="ann-rail" id="annRail" role="complementary" aria-label="Your annotations"></div>` : ""}</details>`
    : "";
  let res = (ACTIVITIES[id] || []).map((r) => resourceCard(r, "story:" + id)).join("");
  let storyImage = studioStoryImage_(id);
  let bannerStyle = storyImage ? ` style="--story-banner:url('${esc(storyImage)}')"` : "";
  let studioNote = STUDIO_CRAFT_NOTES[id] || "Notice the writer's choice, then name the effect it creates.";
  let eqTag = EQ.find((e) => e.id === STORY_EQ[id]);
  let eqConnection = EQ_CONNECTION[id] || "Keep this question in mind while you read. You will return to it after the story.";
  let storyPrelude = `<div class="story-prelude-grid" aria-label="Before reading"><section class="story-prelude-card prelude-essential"><div class="prelude-icon">✦</div><div><span class="prelude-kicker">Essential Question</span><h3>${eqTag ? esc(eqTag.label) : "Reading Focus"}</h3><p>${eqTag ? esc(eqTag.q) : "What craft choices shape the way this story works?"}</p><small>${esc(eqConnection)}</small></div></section><section class="story-prelude-card prelude-lab"><div class="prelude-icon">✎</div><div><span class="prelude-kicker">Reading Lab</span><h3>Notice the craft</h3><p>${esc(studioNote)}</p><small>Track one moment where the writer's choice changes the mood, tension, or meaning.</small></div></section><section class="story-prelude-card prelude-before"><div class="prelude-icon">◫</div><div><span class="prelude-kicker">Before You Read</span><h3>${esc(s.focus)}</h3><p>${esc(s.blurb)}</p>${readBtn}</div></section></div>`;
  let afterReading = `<section class="story-after-reading" aria-label="Questions and assignments after reading"><div class="after-reading-head"><div><span>After Reading</span><h3>Questions &amp; Assignments</h3></div><p>Finish the story first, then work through these in order.</p></div>${qbox}<div class="story-assignment-stack"><h3 class="assignments-heading"><span class="assignments-heading-mark">✦</span>Assignments to turn in</h3><div class="question dok assignment-card compact-assignment"><div class="assignment-flags"><span class="assignment-kicker">Graded Assignment</span>${assignmentStatusChipHtml_("story", id, {started:!!(state.dok[id]||"").trim(), done:isSubmitted_("story", id)})}${assignmentDueChipHtml_("story", id)}</div><div class="assignment-title-row"><strong>End-of-Story Craft Response (DOK)</strong>${rubricButtonHtml("written", "View Rubric", "dok:" + id)}</div><p>${esc(qa[3])}</p><textarea id="dok" placeholder="Make a claim and use specific evidence from the story...">${esc(state.dok[id] || "")}</textarea>${typeof writingProcessStripHtml_ === "function" ? writingProcessStripHtml_(storyResponseProcessKey_(id), { words: wordCount(state.dok[id] || "") }) : ""}${submitButtonHtml_("story", id)}</div>${typeof storyAnnotationCardHtml_ === "function" ? storyAnnotationCardHtml_(id) : ""}${res || `<p class="toolbar-note">No extension activity is assigned for this story.</p>`}</div></section>`;
  return `<div class="sectionhead story-page-head story-banner" data-story="${id}"${bannerStyle}><div class="story-title-block"><div class="pill">Story ${s.order} of ${STORY_ORDER.length}</div>${fullTextBadgeHtml_(id)}<h2>${esc(s.title)}</h2><p class="story-byline">${esc(s.author)}${s.year ? `, ${s.year}` : ""}</p><p class="story-banner-focus">${esc(s.focus)}</p></div></div><div class="story-page-grid ${hasText ? "has-inline-story-text" : "external-story"}"><div class="story-reading-column">${storyPrelude}${readingSupportBox(id)}${leadPollBox(id)}${textPanel}${recapBox(id)}${afterReading}</div></div>${storyPager(id)}`;
}

// Reading-support glossary tooltip: wraps every GLOSSARY[id] term found in
// already-HTML-escaped story text with a small hover/tap definition popup.
// Runs as a single-pass regex replace so inserted markup is never re-matched
// (avoids double-wrapping if one term's definition happens to contain
// another term). Case-insensitive, whole-word only. Longer terms are tried
// first so a multi-word term like "marine biologist" isn't shadowed by a
// shorter one.
function highlightGlossary(escapedText, id) {
  let terms = GLOSSARY[id];
  if (!terms || !terms.length) return escapedText;
  let sorted = [...terms].sort((a, b) => b.term.length - a.term.length);
  let alt = sorted.map((t) => t.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  let re = new RegExp("\\b(" + alt + ")\\b", "gi");
  return escapedText.replace(re, (m) => {
    let t = sorted.find((x) => x.term.toLowerCase() === m.toLowerCase());
    if (!t) return m;
    return `<span class="glossterm" tabindex="0">${m}<span class="glossdef"><strong>${esc(t.term)}</strong> — ${esc(t.def)}</span></span>`;
  });
}

// Collapsible "Plain-English Recap" -- a short, original, plain-language
// retelling for struggling readers to check their understanding before or
// during reading. Closed by default so it doesn't spoil the story for
// students who don't need it.
function recapBox(id) {
  let text = RECAP[id];
  if (!text) return "";
  return `<details class="recap-box"><summary>💡 Plain-English Recap (extra support)</summary><p>${esc(text)}</p></details>`;
}

// Reading-support panel for stories with difficult older prose. Four tabs of
// scaffolding, all closed by default so a student who doesn't need it isn't
// wading past it: how the sentences work, a small dictionary of period
// wording, a section-by-section plain-English walkthrough, and strategies.
// Renders nothing unless READING_SUPPORT has an entry for this story.
function readingSupportBox(id) {
  let r = typeof READING_SUPPORT !== "undefined" ? READING_SUPPORT[id] : null;
  if (!r) return "";
  let section = (open, icon, title, body) =>
    `<details class="support-section"${open ? " open" : ""}><summary><span class="support-ico">${icon}</span>${esc(title)}</summary><div class="support-body">${body}</div></details>`;

  let style = (r.styleNotes || []).map((n) =>
    `<div class="support-note"><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p></div>`).join("");
  let phrases = (r.phrases || []).map((p) =>
    `<div class="support-phrase"><span class="support-old">${esc(p.phrase)}</span><span class="support-arrow">→</span><span class="support-new">${esc(p.means)}</span></div>`).join("");
  let beats = (r.beats || []).map((b) =>
    `<div class="support-beat"><strong>${esc(b.title)}</strong><p>${esc(b.text)}</p></div>`).join("");
  let strat = (r.strategies || []).map((t) => `<li>${esc(t)}</li>`).join("");

  return `<section class="reading-support" aria-label="Reading support">
    <div class="support-head"><div><span class="support-kicker">Reading support${r.era ? ` · ${esc(r.era)}` : ""}</span><h3>Struggling with the old-fashioned language?</h3>${r.intro ? `<p>${esc(r.intro)}</p>` : ""}</div></div>
    ${r.styleNotes && r.styleNotes.length ? section(false, "✎", "How these sentences work", style) : ""}
    ${r.phrases && r.phrases.length ? section(false, "⇄", "Old wording, in plain English", `<div class="support-phrase-grid">${phrases}</div>`) : ""}
    ${r.beats && r.beats.length ? section(false, "☰", "What happens, section by section", `<p class="support-warn">A plain summary of the whole story, including the ending. Use it if you get lost — not instead of reading.</p>${beats}`) : ""}
    ${r.strategies && r.strategies.length ? section(false, "◎", "If you get stuck, try this", `<ul class="support-strategies">${strat}</ul>`) : ""}
  </section>`;
}

// Prominent Essential-Question callout at the top of a story page, above the
// lead-in poll -- distinct from the small "EQx" cards on the home page and
// the subdued question boxes below it, so a student can't miss which of the
// 4 unifying questions this story connects to before reading anything else.
function eqBanner(id) {
  let eqTag = EQ.find((e) => e.id === STORY_EQ[id]);
  if (!eqTag) return "";
  let connection = EQ_CONNECTION[id];
  return `<div class="eqbanner" style="--eq-color:${eqTag.color}"><div class="eqbanner-eyebrow"><span>Essential Question</span><span class="eqbanner-cat">${esc(eqTag.label)}</span></div><p>${esc(eqTag.q)}</p>${connection ? `<p class="eqbanner-connection">${esc(connection)}</p>` : ""}</div>`;
}

function essayNav(active) {
  let steps = [
    ["thesis", "1. Thesis"],
    ["discussion", "2. Discussion"],
    ["body1", "3. Body 1"],
    ["body2", "4. Body 2"],
    ["body3", "5. Body 3"],
    ["intro", "6. Introduction"],
    ["conclusion", "7. Conclusion"],
    ["assemble", "8. Put It Together"],
    ["self", "9. Self-Evaluation"],
  ];
  return `<div class="essay-steps">${steps.map(([id, l]) => `<button class="stepbtn ${active === id ? "active" : ""} ${essayStepDone(id) ? "done" : ""}" data-estep="${id}">${l}</button>`).join("")}</div>`;
}

function essayStepDone(id) {
  let e = state.essay;
  if (id === "thesis") return !!e.thesis.trim();
  if (id === "discussion") return e.discussion.length > 0;
  if (id.startsWith("body")) return !!e.bodies[+id.slice(-1) - 1].trim();
  if (id === "intro") return !!e.intro.trim();
  if (id === "conclusion") return !!e.conclusion.trim();
  if (id === "assemble") return e.intro.trim() && e.bodies.every((x) => x.trim()) && e.conclusion.trim();
  if (id === "self")
    return ["Meaning", "Style", "Form", "Conventions"].every((c) => e.selfEval[c] !== undefined && e.selfEval[c] !== "");
  return false;
}

function sentenceList(text) {
  return (text.trim().match(new RegExp("[^.!?]+[.!?]+|[^.!?]+$", "g")) || []).map((x) => x.trim()).filter(Boolean);
}

function coach(text, type) {
  let sent = sentenceList(text),
    words = text.trim().split(new RegExp("\\s+")).filter(Boolean).length,
    quote = new RegExp("[“”\"]").test(text),
    explain = new RegExp("\\b(shows|reveals|demonstrates|suggests|illustrates|because|therefore|this means|this matters|indicates)\\b", "i").test(text),
    transition = new RegExp("\\b(furthermore|however|therefore|ultimately|additionally|because|as a result|thus|in contrast)\\b", "i").test(text);
  let checks = [];
  if (type === "body") {
    checks = [
      ["Topic sentence", sent.length > 0 && sent[0].split(new RegExp("\\s+")).length >= 7, "Begin with a clear claim that connects this paragraph to your thesis."],
      ["Text evidence", quote || new RegExp("\\b(the story|the narrator|the author)\\b", "i").test(text), "Include a specific quotation or clearly identified evidence from a story."],
      ["Explanation / analysis", explain, "Explain how the evidence proves your topic sentence; use analytical language such as “reveals,” “shows,” or “because.”"],
      ["Concluding sentence", sent.length >= 4, "End the paragraph by connecting the paragraph's idea back to the larger thesis."],
    ];
  } else if (type === "intro") {
    checks = [
      ["Opening/context", sent.length >= 2, "Give the reader enough context before the thesis."],
      ["Thesis is last", !!state.essay.thesis && sent.length && sent[sent.length - 1].replace(new RegExp("[.!?]+$"), "").trim() === state.essay.thesis.replace(new RegExp("[.!?]+$"), "").trim(), "Place your saved thesis statement as the final sentence of the introduction."],
      ["Focused length", words >= 60, "Develop the introduction enough to establish context and direction."],
    ];
  } else {
    checks = [
      ["Restates central idea", sent.length && new RegExp("structure|suspense|voice|narration|symbol|meaning|craft", "i").test(text), "Return to your central argument without simply copying the thesis."],
      ["Synthesizes ideas", sent.length >= 3 && explain, "Explain what the combined evidence shows across the stories as a whole."],
      ["Final significance", sent.length >= 4, "End with a “so what?” insight about why this craft choice matters to a reader."],
      ["No new quotation", !quote, "A conclusion usually synthesizes rather than introducing a brand-new quotation."],
    ];
  }
  let good = checks.filter((x) => x[1]).length;
  return `<div class="coach"><h4>Writing Coach · ${good}/${checks.length} checks</h4>${checks.map(([n, ok, tip]) => `<div class="check ${ok ? "good" : "warn"}"><strong>${ok ? "✓" : "△"} ${n}</strong>${ok ? "" : ` — ${tip}`}</div>`).join("")}<small>This feedback is a built-in writing check, not a grade. Your teacher's judgment and the rubric remain the final standard.</small></div>`;
}

function thesisGuide() {
  let chosenStories = state.essay.stories || [];
  return `<div class="card"><h3>Step 1 · Thesis Creation</h3><p>Build your thesis in order.</p><div class="thesis-flow"><section class="thesis-stage"><h3><span class="stage-num">1</span>Choose the essential question you will answer</h3><div class="theme-list">${EQ.map((q) => `<label class="theme-card"><input type="radio" name="theme" class="themePick" value="${q.id}" ${state.essay.theme === q.id ? "checked" : ""}><span><strong>${eqLabel(q)}</strong><br>${q.q}</span></label>`).join("")}</div></section><section class="thesis-stage"><h3><span class="stage-num">2</span>Choose at least two stories that show this at work</h3><p>Pick the stories you'll actually build your argument from. You can change this anytime.</p><div class="theme-list">${STORY_ORDER.map((id) => { let s = STORIES[id]; return `<label class="theme-card"><input type="checkbox" class="storyPick" value="${id}" ${chosenStories.includes(id) ? "checked" : ""}><span><strong>${esc(s.title)}</strong><br><small>${esc(s.focus)}</small></span></label>`; }).join("")}</div>${chosenStories.length < 2 ? `<p class="toolbar-note">Choose at least two stories to build a strong cross-text argument.</p>` : ""}</section><section class="thesis-stage"><h3><span class="stage-num">3</span>Plan what your thesis must do</h3><p>A strong literary-analysis thesis:</p><ul><li><strong>Answers the essential question directly.</strong></li><li><strong>Makes an arguable claim</strong> rather than stating a fact.</li><li><strong>Previews the reasoning</strong> your body paragraphs will prove.</li><li><strong>Draws on at least two stories</strong> to show the craft move at work in more than one place.</li></ul><div class="thesis-preview"><strong>Thesis pattern:</strong><br>In short stories such as <em>[Story A]</em> and <em>[Story B]</em>, writers use <strong>[chosen craft element]</strong> to <strong>[what it does for the reader]</strong>, ultimately showing that <strong>[larger insight]</strong>.</div></section><section class="thesis-stage"><h3><span class="stage-num">4</span>Write and revise your thesis</h3><textarea id="thesisBox" class="writingbox short" placeholder="Write one complete thesis statement...">${esc(state.essay.thesis)}</textarea><div id="thesisCoach">${coach(state.essay.thesis, "body")}</div><p class="toolbar-note">When your thesis makes a clear claim, continue to the Thesis Discussion.</p></section></div></div>`;
}

function discussion() {
  return `<div class="card assignment-card"><div class="assignment-kicker">Graded Discussion</div><div class="assignment-title-row"><h3>Step 2 · Thesis Discussion</h3>${rubricButtonHtml("discussion", "View Discussion Rubric")}</div><p>Post your thesis for classmates to read. Before revising, respond to peer feedback by asking: Is my claim arguable? Is it specific? Does it explain <em>why</em> this craft element matters?</p><div class="thesis-preview">${state.essay.thesis ? esc(state.essay.thesis) : "Complete your thesis first."}</div><button class="btn primary" id="postThesis" ${state.essay.thesis ? "" : "disabled"}>Post Thesis to Discussion</button><p class="toolbar-note">In this prototype, discussion posts are saved on this device. When the class backend is connected, these posts can be shared across the class.</p>${state.essay.discussion.length ? state.essay.discussion.map((p) => `<div class="discussion-post"><strong>Student Thesis</strong><p>${esc(p.text)}</p><small>Posted ${esc(p.date)}</small></div>`).join("") : "<p>No thesis has been posted yet.</p>"}</div>`;
}

function bodyStep(n) {
  let idx = n - 1,
    text = state.essay.bodies[idx];
  let chosenStories = (state.essay.stories || []).map((id) => STORIES[id]).filter(Boolean);
  let picker = chosenStories.length
    ? `<details open><summary><strong>Stories you're arguing from (${chosenStories.length})</strong></summary>${chosenStories.map((s) => `<div class="evidence-choice"><strong>${esc(s.title)}</strong> · <em>${esc(s.focus)}</em><br><small>Go back to this story's page to find a specific quotation or moment to use as evidence.</small><br><button class="btn" data-goto="story:${s.id}" style="margin-top:6px">Open ${esc(s.title)} →</button></div>`).join("")}</details>`
    : `<p class="toolbar-note">You haven't picked any stories for this essay yet — go back to Step 1 and choose at least two.</p>`;
  return `<div class="card"><h3>Step ${n + 2} · Body Paragraph ${n}</h3><p>Build one complete paragraph using <strong>Topic Sentence → Evidence → Explanation → Concluding Sentence</strong>.</p><div class="thesis-preview"><strong>Your thesis:</strong> ${esc(state.essay.thesis || "Draft your thesis first.")}</div>${picker}<textarea class="writingbox bodyBox" data-body="${idx}" placeholder="Write Body Paragraph ${n} here. Quote or closely reference a specific moment from one of your chosen stories.">${esc(text)}</textarea><div id="bodyCoach${idx}">${coach(text, "body")}</div></div>`;
}

function introStep() {
  let sent = sentenceList(state.essay.intro),
    thesis = state.essay.thesis;
  let preview = "";
  if (state.essay.intro) {
    let last = sent.pop() || "";
    preview = `<div class="essay-preview">${esc(sent.join(" "))}${sent.length ? " " : ""}<span class="thesis-highlight">${esc(last)}</span></div>`;
  }
  return `<div class="card"><h3>Step 6 · Introduction</h3><p>Write the introduction as its own section. Name the stories and the craft element your argument will address. Your <strong>saved thesis must be the final sentence</strong>.</p><div class="thesis-preview"><strong>Thesis to place last:</strong> ${esc(thesis || "Complete your thesis first.")}</div><textarea id="introBox" class="writingbox" placeholder="Write your introduction here. End with your thesis statement...">${esc(state.essay.intro)}</textarea>${preview}<div id="introCoach">${coach(state.essay.intro, "intro")}</div></div>`;
}

function conclusionStep() {
  return `<div class="card"><h3>Step 7 · Conclusion</h3><p>Bring the argument together: return to your thesis, synthesize what your body paragraphs prove, and end with why this craft choice matters to a reader. Avoid simply repeating the introduction.</p><textarea id="conclusionBox" class="writingbox" placeholder="Write your conclusion here...">${esc(state.essay.conclusion)}</textarea><div id="conclusionCoach">${coach(state.essay.conclusion, "conclusion")}</div></div>`;
}

function assembleStep() {
  let e = state.essay;
  let full = [e.intro, ...e.bodies, e.conclusion].filter((x) => x.trim()).join("\n\n");
  return `<div class="card"><h3>Step 8 · Put It Together</h3><p>This view combines each piece without deleting the separate drafts. Return to any step to revise.</p><div class="progressbar"><span style="width:${([e.intro, ...e.bodies, e.conclusion].filter((x) => x.trim()).length / 5) * 100}%"></span></div><p><strong>${[e.intro, ...e.bodies, e.conclusion].filter((x) => x.trim()).length}/5 major sections complete</strong></p><div class="essay-preview">${esc(full || "Your completed sections will appear here.")}</div><button class="btn" id="copyEssay">Copy Full Essay</button></div>`;

function rubricTable() {
  let bands = ["7 to >6 pts", "6 to >5 pts", "5 to >4 pts", "4 to >1 pts", "1 to >0 pts"];

function selfEvalStep() {
  let e = state.essay,
    bands = ["7 to >6 pts", "6 to >5 pts", "5 to >4 pts", "4 to >1 pts", "1 to >0 pts"];
  let labels = ["Exceeds / Deep", "Strong / Good", "Developing / Basic", "Limited / Weak", "Beginning / Poor"];
  return `<div class="card"><h3>Step 9 · Self-Evaluation</h3><p>Read your assembled essay and click the rubric description that best matches your work for each criterion. Then explain your choice in the comment box directly below it.</p>${["Meaning", "Style", "Form", "Conventions"]
    .map((c) => {

function essay() {
