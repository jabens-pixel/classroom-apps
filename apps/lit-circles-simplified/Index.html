var STRATEGY_VISUALS={
  summarizer:{icon:'🧭',tag:'Find the essential events and shape them into a clear map of the reading.'},
  researcher:{icon:'🔎',tag:'Investigate something from the book that makes the story easier to understand.'},
  connector:{icon:'🔗',tag:'Build meaningful connections between the text and life beyond the page.'},
  questioner:{icon:'💬',tag:'Ask thick questions that open up interpretation and conversation.'},
  literaryLuminary:{icon:'✨',tag:'Choose powerful passages and explain why the group should notice them.'},
  predictor:{icon:'🔮',tag:'Use evidence to predict what may happen next, then check your thinking.'},
  inferences:{icon:'🧊',tag:'Read beneath the surface and infer what the text suggests without stating.'},
  illustrator:{icon:'🎭',tag:'Study what a character says, does, and thinks to understand who they are.'}
};
var STRATEGY_GUIDES={
  summarizer:{steps:['Write a 1–2 minute summary of this week’s reading in your own words.','Identify 7 key events or ideas. Add a page number to every key point.','Choose only details the group actually needs in order to understand what happened and why it matters.'],quality:'Strong work is selective, accurate, and useful to someone who needs the big picture before discussion begins.'},
  researcher:{steps:['Choose two details from the reading that made you curious: setting, history, culture, author, language, music, or another relevant topic.','Research each topic and record what you learned. Connect each finding back to a page or moment in the book.','Add your source links, then explain how the research changed or deepened your understanding of the story.'],quality:'Strong research does more than report a fact—it makes a specific part of the book clearer or more meaningful.'},
  connector:{steps:['Find five moments in the reading that connect to your life, another text, history, your community, or the wider world.','Include the page number or scene for each connection.','Explain the important part: how does making this connection help you understand the character, conflict, mood, theme, or plot more deeply?'],quality:'A thick connection explains meaning. Avoid stopping at “this reminds me of…”—show why the connection matters.'},
  questioner:{steps:['Write five thick questions that came from specific moments in this week’s reading.','Include a page number or scene with each question.','After each question, push your own thinking: why is the question important, and what might the answer reveal about the book?'],quality:'Strong questions cannot be answered with one word. They make the group interpret, debate, or look back at evidence.'},
  literaryLuminary:{steps:['Choose four short passages that deserve the group’s attention. Include the page number.','Record the passage accurately.','For each passage, explain why it matters and what you want the group to notice when it is read aloud.'],quality:'Choose passages because they reveal something important—not simply because they sound interesting.'},
  predictor:{steps:['Make four predictions about what may happen next.','For each prediction, use more than one piece of textual evidence and include page numbers.','Return to the prediction when possible and record what actually happened. If the book has not resolved it yet, write “Not resolved yet.”'],quality:'A strong prediction is evidence-based. The reasoning matters more than whether your prediction turns out to be correct.'},
  inferences:{steps:['Look for evidence in dialogue, actions, conflict, setting, inner thoughts, and decisions.','For each category, summarize the moment and include a page number.','State what you infer from that evidence—what can you reasonably understand even though the author did not say it directly?'],quality:'An inference must be supported by evidence. Make the invisible thinking visible.'},
  illustrator:{steps:['Choose a character to study closely.','Find three scenes that reveal something about the character through words, actions, thoughts, or decisions. Include page numbers.','Explain what each scene reveals. Then consider how the character has changed since earlier in the book.'],quality:'Strong character analysis moves from evidence to insight: “This scene shows…” followed by what it reveals and why.'}
};
function prepDraftForWeek(wk){
  var existing=(state.weeklyDrafts&&state.weeklyDrafts[wk])||state.weeklyWork[wk];
  var d=draft['week'+wk]||(draft['week'+wk]=existing?JSON.parse(JSON.stringify(existing)):{prepType:'',choices:[],data:{}});
  d.data=d.data||{};d.choices=d.choices||[];return d;
}
function prepFlowStage(wk){state.prepFlow=state.prepFlow||{};return state.prepFlow[wk]||'pathway';}
function setPrepFlowStage(wk,stage){state.prepFlow=state.prepFlow||{};state.prepFlow[wk]=stage;}
function prepFocusIndex(wk){state.prepFocus=state.prepFocus||{};return Number(state.prepFocus[wk]||0);}
function setPrepFocusIndex(wk,i){state.prepFocus=state.prepFocus||{};state.prepFocus[wk]=i;}
function hybridMomentIndex(wk){state.hybridMomentFocus=state.hybridMomentFocus||{};return Number(state.hybridMomentFocus[wk]||0);}
function setHybridMomentIndex(wk,i){state.hybridMomentFocus=state.hybridMomentFocus||{};state.hybridMomentFocus[wk]=i;}
function pathIcon(type){return '<span class="library-path-label">'+(type==='strategies'?'I · Read closely':type==='hybrid'?'II · Make connections':'III · Leave a trace')+'</span>';}
function pathwayLabel(type){return type==='strategies'?'Two Reading Strategies':(type==='hybrid'?'Hybrid Reading':'Reader’s Journal');}

}
var studentResumeSaveTimer=null;
function saveStudentResumeClient(){
  if(!state.email||platform.mode!=='student')return;
  var snap=studentResumeSnapshot();state.resume=snap;
  try{localStorage.setItem('lc_resume_'+state.email,JSON.stringify(snap));}catch(e){}
  clearTimeout(studentResumeSaveTimer);
  studentResumeSaveTimer=setTimeout(function(){callServer('saveStudentResume',[state.email,snap],function(){},function(){},{quiet:true});},250);
}
function localStudentResume(email){try{return JSON.parse(localStorage.getItem('lc_resume_'+email)||'null');}catch(e){return null;}}
function resumeAllowedView(v){return ['dashboard','week','week_strategies','week_plan','week_peer','week_reflection','feedback','growth'].indexOf(v)>=0;}
function restoreStudentResume(forceHome){
  if(!state.group){state.view='setup';render();return;}
  if(forceHome){state.view='dashboard';render();return;}
  var r=state.resume||localStudentResume(state.email)||null;
  if(!r||!resumeAllowedView(r.view)){state.view='dashboard';render();return;}
  var wk=Math.max(1,Math.min(4,Number(r.week)||1));
  var c=platformClassById(platform.activeClassId);
  if(c&&c.settings&&c.settings.releasedWeeks&&c.settings.releasedWeeks.indexOf(wk)<0){state.view='dashboard';render();return;}
  state.week=wk;
  setPrepFlowStage(wk,r.flowStage||'pathway');setPrepFocusIndex(wk,Number(r.focusIndex)||0);setHybridMomentIndex(wk,Number(r.hybridMoment)||0);
  state.view=r.view;render();
}
function smartWeekDestination(wk){
  var work=state.weeklyWork[wk], draftWork=state.weeklyDrafts&&state.weeklyDrafts[wk], mates=getGroupmatesLocal();
  if(!work || !work.prepType){
    state.view='week_strategies';
    if(draftWork&&draftWork.prepType){
      var needed=draftWork.prepType==='hybrid'?3:(draftWork.prepType==='strategies'?2:1);
      setPrepFlowStage(wk,(draftWork.prepType==='journal'||(draftWork.choices||[]).length===needed)?'workspace':'picker');
    } else setPrepFlowStage(wk,'pathway');
    return;
  }
  if(!discussionPlanFor(wk)){state.view='week_plan';return;}
  var given=uniquePeerGivenCount(wk);
  if(mates.length && given<mates.length){state.view='week_peer';return;}
  if(mates.length && !(state.selfAssessments&&state.selfAssessments[wk])){state.view='week_peer';return;}
  if(!state.reflections[wk]){state.view='week_reflection';return;}
  state.view='week';
}

function choosePrepPathway(wk,type){
  var d=prepDraftForWeek(wk),changing=d.prepType&&d.prepType!==type;
  if(changing&&state.weeklyWork[wk]&&!window.confirm('You already have saved Week '+wk+' work in a different pathway. Change pathways? Your saved work will remain until you save the new pathway.'))return;
  if(changing){var plan=d.data&&d.data.discussionPlan;d.data={};if(plan)d.data.discussionPlan=plan;d.choices=[];}
  d.prepType=type;
  if(type==='journal'){d.choices=['journal'];setPrepFlowStage(wk,'workspace');}
  else{
    if(type==='strategies'&&d.choices.length>2)d.choices=d.choices.slice(0,2);
    if(type==='hybrid'&&d.choices.length>3)d.choices=d.choices.slice(0,3);
    setPrepFlowStage(wk,'picker');
  }
  setPrepFocusIndex(wk,0);setHybridMomentIndex(wk,0);saveStudentResumeClient();render();
  if(type==='journal')setTimeout(function(){scheduleFocusedAutosave(wk);},0);
}
function returnToPathway(wk){syncFocusedPrep(wk);setPrepFlowStage(wk,'pathway');saveStudentResumeClient();render();}
function returnToPicker(wk){syncFocusedPrep(wk);setPrepFlowStage(wk,'picker');saveStudentResumeClient();render();}
function pickFocusedStrategy(wk,key){
  var d=prepDraftForWeek(wk),limit=d.prepType==='hybrid'?3:2,idx=d.choices.indexOf(key);
  if(idx>=0)d.choices.splice(idx,1);else if(d.choices.length<limit)d.choices.push(key);else{showError('Choose exactly '+limit+' strategies. Remove one before adding another.');return;}
  render(true);
}
function startFocusedWork(wk){
  var d=prepDraftForWeek(wk),limit=d.prepType==='hybrid'?3:2;
  if(d.choices.length!==limit){showError('Choose exactly '+limit+' strategies before starting your work.');return;}
  setPrepFocusIndex(wk,0);setHybridMomentIndex(wk,0);setPrepFlowStage(wk,'workspace');saveStudentResumeClient();render();
  setTimeout(function(){scheduleFocusedAutosave(wk);},0);
}
function syncFocusedPrep(wk){
  var d=prepDraftForWeek(wk);if(!d.prepType)return;
  if(d.prepType==='journal'){var je=$('journalText');if(je)d.data.journalText=je.innerHTML;return;}
  if(d.prepType==='hybrid'){
    d.data.hybridMoments=d.data.hybridMoments||['','',''];var mi=hybridMomentIndex(wk),me=$('hybridMoment'+mi);if(me)d.data.hybridMoments[mi]=me.innerHTML;return;
  }
  var fi=prepFocusIndex(wk),key=d.choices[fi];if(key){var oldData=d.data[key]||{},fresh=collectStrategyData(key);if(oldData.imageUrl)fresh.imageUrl=oldData.imageUrl;d.data[key]=fresh;}
}
function moveStrategyFocus(wk,delta){
  var d=prepDraftForWeek(wk),now=prepFocusIndex(wk);syncFocusedPrep(wk);var next=Math.max(0,Math.min(d.choices.length-1,now+delta));setPrepFocusIndex(wk,next);saveStudentResumeClient();render();
}
function moveHybridMoment(wk,delta){
  var now=hybridMomentIndex(wk);syncFocusedPrep(wk);setHybridMomentIndex(wk,Math.max(0,Math.min(2,now+delta)));saveStudentResumeClient();render();
}
function continueWeekJourney(wk){syncFocusedPrep(wk);state.week=wk;state.view='week';saveStudentResumeClient();render();}

// True background autosave for the focused Lit Circle workspace.
// Drafts are saved separately from submissions so autosave never changes teacher completion status.
var focusedAutosave={timers:{},inFlight:{},dirty:{},waiters:{},retryTimers:{}};
function setFocusedAutosaveStatus(text,kind){
  var el=$('prepSavedMsg');if(!el)return;
  el.textContent=text;el.className='focus-save-status'+(kind?' '+kind:'');
}
function resolveFocusedAutosaveWaiters(wk){
  var list=focusedAutosave.waiters[wk]||[];focusedAutosave.waiters[wk]=[];
  list.forEach(function(fn){try{fn();}catch(e){reportClientError(e,'autosave completion');}});
}
function focusedAutosaveSnapshot(wk){
  syncFocusedPrep(wk);
  var d=prepDraftForWeek(wk),g=collectCurrentPrepData(d);if(g.error)return null;
  var plan=(d.data&&d.data.discussionPlan)||discussionPlanFor(wk);
  var data=JSON.parse(JSON.stringify(g.data||{}));if(plan)data.discussionPlan=JSON.parse(JSON.stringify(plan));
  return{prepType:g.prepType,choices:(g.choices||[]).slice(),data:data};
}
function scheduleFocusedAutosave(wk){
  if(!state.email||state.view!=='week_strategies'||prepFlowStage(wk)!=='workspace')return;
  focusedAutosave.dirty[wk]=true;
  setFocusedAutosaveStatus('Unsaved changes','saving');
  clearTimeout(focusedAutosave.timers[wk]);
  focusedAutosave.timers[wk]=setTimeout(function(){flushFocusedAutosave(wk);},1200);
}
function flushFocusedAutosave(wk,onSettled){
  if(onSettled){focusedAutosave.waiters[wk]=focusedAutosave.waiters[wk]||[];focusedAutosave.waiters[wk].push(onSettled);}
  clearTimeout(focusedAutosave.timers[wk]);focusedAutosave.timers[wk]=null;
  clearTimeout(focusedAutosave.retryTimers[wk]);focusedAutosave.retryTimers[wk]=null;
  if(focusedAutosave.inFlight[wk])return;
  if(!focusedAutosave.dirty[wk]){resolveFocusedAutosaveWaiters(wk);return;}
  var snap=focusedAutosaveSnapshot(wk);
  if(!snap){resolveFocusedAutosaveWaiters(wk);return;}
  focusedAutosave.dirty[wk]=false;focusedAutosave.inFlight[wk]=true;
  setFocusedAutosaveStatus('Saving…','saving');
  callServer('saveWeeklyDraft',[state.email,wk,snap.prepType,snap.choices,snap.data],function(){
    focusedAutosave.inFlight[wk]=false;
    state.weeklyDrafts=state.weeklyDrafts||{};
    state.weeklyDrafts[wk]={prepType:snap.prepType,choices:snap.choices.slice(),data:JSON.parse(JSON.stringify(snap.data)),updatedAt:new Date().toISOString()};
    if(focusedAutosave.dirty[wk]){flushFocusedAutosave(wk);return;}
    setFocusedAutosaveStatus('✓ Draft saved','saved');
    resolveFocusedAutosaveWaiters(wk);
  },function(){
    focusedAutosave.inFlight[wk]=false;focusedAutosave.dirty[wk]=true;
    setFocusedAutosaveStatus('Autosave retrying…','error');
    // Do not interrupt the student's writing with an error banner. Retry quietly.
    focusedAutosave.retryTimers[wk]=setTimeout(function(){flushFocusedAutosave(wk);},5000);
    resolveFocusedAutosaveWaiters(wk);
  },{quiet:true});
}

// Any typing/editing in the focused workspace queues a backend save after a short pause.
document.addEventListener('input',function(e){
  if(state.view!=='week_strategies'||prepFlowStage(state.week)!=='workspace')return;
  var t=e.target;if(!t||!t.closest||!t.closest('.focus-workspace'))return;
  if(t.type==='file')return; // image bytes upload only when the student intentionally submits
  scheduleFocusedAutosave(state.week);
},true);

// After a successful save, reveal the next-step card without making the student hunt for it.
finishSavePrep=function(wk,d){
  // First settle the latest draft autosave. This prevents a slower stale autosave from
  // finishing after the final submission and recreating an older draft.
  focusedAutosave.dirty[wk]=true;
  flushFocusedAutosave(wk,function(){
    callServer('saveWeeklyWork',[state.email,wk,d.prepType,d.choices,d.data],function(){
      state.weeklyWork[wk]={prepType:d.prepType,choices:d.choices.slice(),data:JSON.parse(JSON.stringify(d.data)),updatedAt:new Date().toString()};
      if(state.weeklyDrafts)delete state.weeklyDrafts[wk];
      focusedAutosave.dirty[wk]=false;clearTimeout(focusedAutosave.retryTimers[wk]);
      setFocusedAutosaveStatus('✓ Submitted','saved');
      var slot=$('afterSaveContinue');
      if(slot)slot.innerHTML='<div class="focus-complete-card"><strong>Week '+wk+' Lit Circle work is submitted.</strong><p>Next, turn this thinking into a plan for the discussion you will lead.</p><button style="margin-top:12px" onclick="continueWeekJourney('+wk+')">Continue to Week '+wk+' Journey →</button></div>';
    },null,{button:$('savePrepBtn')});
  });
};

<script>
// ===========================================================================
// FAST TEACHER GRADING + AUTOMATIC-GRADE OVERRIDES — 2026-09-18
// ===========================================================================

lcUpdateDashboardGradeClient=function(email,key,score,feedback,rubric,maxPoints){
  var dash=(platform.dashboard&&platform.dashboard.students)||[];
  var inferred=/_preparation$/.test(key)?3:(/_peer$/.test(key)?2:7);
  var max=maxPoints==null?inferred:Number(maxPoints);
  var stored=(score===''||score==null)?'':Number(score);
  for(var i=0;i<dash.length;i++)if(String(dash[i].email)===String(email)){
    dash[i].grades=dash[i].grades||{};
    dash[i].grades[key]={score:stored,maxPoints:max,feedback:feedback||'',rubric:rubric||{}};
    break;
  }
};

// Gradebook uses a teacher override for auto-marked stages when one exists; otherwise
// it keeps the normal completion grade.
lcWeekGradeClient=function(stu,w){
  var ws=(stu.weeks||[])[w-1]||{},grades=stu.grades||{};
  var sub=grades['w'+w+'_submission'],prepG=grades['w'+w+'_preparation'],peerG=grades['w'+w+'_peer'],ref=grades['w'+w+'_reflection'];
  function val(g){return g&&g.score!==''&&g.score!=null&&!isNaN(Number(g.score))?Number(g.score):null;}
  var subScore=val(sub),prepOverride=val(prepG),peerOverride=val(peerG),refScore=val(ref);
  var hasAny=!!(ws.prep||ws.plan||ws.peerGiven||ws.reflection),pending=false,score=0;
  if(subScore!=null)score+=subScore;else if(ws.prep)pending=true;
  var prep=prepOverride!=null?prepOverride:(ws.planComplete?3:0);
  var peer=peerOverride!=null?peerOverride:(ws.peerComplete?2:0);
  score+=prep+peer;
  if(refScore!=null)score+=refScore;else if(ws.reflection)pending=true;
  return{hasAny:hasAny,score:hasAny?score:null,pending:pending,sub:subScore,prep:prep,peer:peer,ref:refScore,prepOverride:prepOverride,peerOverride:peerOverride,ws:ws};
};

function lcAutoStageDefaultScore(r,stage){
  if(stage==='preparation')return r.complete?3:0;
  if(stage==='peer')return r.expected===0?null:(r.complete?2:0);
  return null;
}
function lcAutoStageEffectiveScore(r,stage){
  if(r.grade&&r.grade.score!==''&&r.grade.score!=null&&!isNaN(Number(r.grade.score)))return Number(r.grade.score);
  return lcAutoStageDefaultScore(r,stage);
}
function lcAutoNextEmail(email,data){
  var list=(data.responses||[]).filter(function(r){return r.complete;}).sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));});
  if(list.length<2)return'';
  var idx=list.findIndex(function(r){return r.email===email;});if(idx<0)return list[0].email;
  return list[(idx+1)%list.length].email;
}
function lcAutoGradeControls(r,stage){
  var max=stage==='preparation'?3:2,def=lcAutoStageDefaultScore(r,stage),eff=lcAutoStageEffectiveScore(r,stage),hasOverride=!!(r.grade&&r.grade.score!==''&&r.grade.score!=null),choices=[];
  if(stage==='preparation')choices=[3,2,1,0];else choices=[2,1,0];
  if(!r.complete)return'<div class="auto-stage-gradebox"><div class="auto-current">'+(def==null?'N/A':def+'/'+max)+'<small>automatic</small></div></div>';
  return'<div class="auto-stage-gradebox" data-email="'+esc(r.email)+'"><div class="auto-current">'+eff+'/'+max+'<small>'+(hasOverride?'teacher override':'automatic full credit')+'</small></div><div class="auto-override-buttons">'+
    '<button class="auto-reset '+(!hasOverride?'selected':'')+'" title="Use the automatic completion grade" onclick="saveAutoStageOverride(\''+esc(r.email)+'\',\''+stage+'\',\'\',this)">Auto</button>'+
    choices.map(function(n){return'<button class="'+(hasOverride&&eff===n?'selected':'')+'" onclick="saveAutoStageOverride(\''+esc(r.email)+'\',\''+stage+'\','+n+',this)">'+n+'</button>';}).join('')+
    '</div><div class="auto-override-note">Completed work defaults to '+max+'/'+max+'. Lower it only when the completed work does not meet expectations.</div></div>';
}

renderAutoStageTable=function(data){
  var complete=[],incomplete=[];(data.responses||[]).slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));}).forEach(function(r){(r.complete?complete:incomplete).push(r);});
  function rows(list){return list.map(function(r){
    var ev;if(data.stage==='preparation')ev=compactPlanEvidence(r.plan);
    else ev=r.expected?((r.givenTo||[]).length?('Feedback submitted for: '+(r.givenTo||[]).join(', ')):'No peer feedback submitted yet.'):'No groupmates are currently attached.';
    return'<div class="auto-stage-row" data-email="'+esc(r.email)+'"><div class="auto-stage-name"><strong>'+esc(r.name)+'</strong><small>'+esc(r.email)+(r.bookTitle?' · '+esc(r.bookTitle):'')+'</small></div><div class="auto-stage-evidence">'+esc(ev)+'</div>'+lcAutoGradeControls(r,data.stage)+'</div>';
  }).join('');}
  return'<div class="auto-stage-groups"><section class="auto-stage-group complete"><div class="auto-stage-group-head"><strong>Completed</strong><span>'+complete.length+'</span></div>'+rows(complete)+'</section><section class="auto-stage-group incomplete"><div class="auto-stage-group-head"><strong>Not Completed</strong><span>'+incomplete.length+'</span></div>'+rows(incomplete)+'</section></div>';
};

function saveAutoStageOverride(email,stage,score,btn){
  var r=lcFindStageResponse(email);if(!r)return;
  var max=stage==='preparation'?3:2,key='w'+(platform.teacherWeek||1)+'_'+stage;
  var old=r.grade?JSON.parse(JSON.stringify(r.grade)):null;
  var oldDash=null,dash=(platform.dashboard&&platform.dashboard.students)||[];
  for(var i=0;i<dash.length;i++)if(dash[i].email===email){oldDash=dash[i].grades&&dash[i].grades[key]?JSON.parse(JSON.stringify(dash[i].grades[key])):null;break;}
  var stored=(score===''||score==null)?'':Number(score);
  r.grade={score:stored,maxPoints:max,feedback:'',rubric:{completionOverride:stored!==''},excluded:false,updatedAt:new Date().toISOString()};
  lcUpdateDashboardGradeClient(email,key,stored,'',r.grade.rubric,max);
  platform.stageScrollEmail=lcAutoNextEmail(email,platform.stageResponses);
  renderTeacherDashboard();
  callServer('saveLiteratureGrade',[{classId:platform.activeClassId,studentEmail:email,itemKey:key,score:stored,maxPoints:max,rubric:r.grade.rubric,feedback:''}],function(){},function(err){
    r.grade=old;
    for(var j=0;j<dash.length;j++)if(dash[j].email===email){dash[j].grades=dash[j].grades||{};if(oldDash)dash[j].grades[key]=oldDash;else delete dash[j].grades[key];break;}
    renderTeacherDashboard();showError('That grade did not save. '+(err&&err.message?err.message:String(err||'')));
  },{quiet:true});
}

// Teacher-scored work now advances immediately. The server save happens in the background;
// if it fails, the old grade is restored and the submission returns to the needs-grading queue.
saveTeacherStageGrade=function(email,stage,score,btn){
  score=Number(score);if(isNaN(score)||score<0||score>7){showError('Enter a score from 0 to 7.');return;}
  var r=lcFindStageResponse(email);if(!r)return;
  var w=platform.teacherWeek||1,key='w'+w+'_'+(stage==='submission'?'submission':'reflection'),feedback=$('batchFeedback_'+safeId(email))?$('batchFeedback_'+safeId(email)).value:'',rubricKey=stage==='reflection'?'reflection':(r.prepType==='journal'?'journal':(r.prepType==='hybrid'?'hybrid':'strategies')),next=lcNextNeedsEmail(email,stage);
  var payload={classId:platform.activeClassId,studentEmail:email,itemKey:key,score:score,maxPoints:7,rubric:{rubricKey:rubricKey,level:score,manual:[7,6,5,4,0].indexOf(score)<0},feedback:feedback};
  var old=r.grade?JSON.parse(JSON.stringify(r.grade)):null,oldResub=!!r.resubmitted;
  var dash=(platform.dashboard&&platform.dashboard.students)||[],oldDash=null;
  for(var i=0;i<dash.length;i++)if(dash[i].email===email){oldDash=dash[i].grades&&dash[i].grades[key]?JSON.parse(JSON.stringify(dash[i].grades[key])):null;break;}
  lcUpdateStageGradeLocal(r,score,feedback,payload.rubric);
  lcUpdateDashboardGradeClient(email,key,score,feedback,payload.rubric,7);
  platform.stageScrollEmail=next;
  renderTeacherDashboard();
  callServer('saveLiteratureGrade',[payload],function(){},function(err){
    r.grade=old;r.resubmitted=oldResub;
    for(var j=0;j<dash.length;j++)if(dash[j].email===email){dash[j].grades=dash[j].grades||{};if(oldDash)dash[j].grades[key]=oldDash;else delete dash[j].grades[key];break;}
    platform.stageScrollEmail=email;renderTeacherDashboard();showError('That grade did not save. '+(err&&err.message?err.message:String(err||'')));
  },{quiet:true});
};

autoSaveBatchRubric=function(email,stage,score,btn){
  var input=$('batchManualScore_'+safeId(email));if(input)input.value=score;
  saveTeacherStageGrade(email,stage,score,btn);
};

// Support scrolling to the next row for both teacher-scored and completion-graded stages.
var _fastRenderTeacherStagePanel=renderTeacherStagePanel;
renderTeacherStagePanel=function(data){
  var out=_fastRenderTeacherStagePanel(data);
  if(platform.stageScrollEmail)setTimeout(function(){
    var target=platform.stageScrollEmail;platform.stageScrollEmail='';
    var nodes=document.querySelectorAll('[data-email]'),el=null;
    for(var i=0;i<nodes.length;i++)if(nodes[i].getAttribute('data-email')===target){el=nodes[i];break;}
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },25);
  return out;
};
</script>

// A teacher-entered grade counts even when the student never submitted the work.
lcTeacherGradeState=function(r,stage){
  var hasGrade=!!(r.grade&&r.grade.score!==''&&r.grade.score!=null&&!isNaN(Number(r.grade.score)));
  if(stage!=='submission'&&stage!=='reflection')return r.complete?{rank:0,cls:'complete',text:'Complete'}:{rank:1,cls:'incomplete',text:'Not completed'};
  if(!r.submitted){
    if(hasGrade)return{rank:2,cls:'graded',text:'Graded '+r.grade.score+'/7 · no submission'};
    return{rank:1,cls:'missing',text:'Not completed'};
  }
  if(r.resubmitted)return{rank:0,cls:'resubmitted',text:'Resubmitted · needs grading'};
  if(hasGrade)return{rank:2,cls:'graded',text:'Graded '+r.grade.score+'/7'};
  return{rank:0,cls:'needs',text:'Needs grading'};
};
lcBatchStatus=function(r,stage){return lcTeacherGradeState(r,stage);};

function lcMissingGradeButtons(r,stage){

renderBatchAssessmentRow=function(r,stage){

    return '<div class="batch-assessment-row" data-email="'+esc(r.email)+'" data-grade-rank="'+status.rank+'" data-student-name="'+esc(r.name||'')+'">'+head+'<div class="missing-grade-layout"><div class="missing-grade-evidence">'+missingText+'</div><div class="missing-grade-panel">'+lcMissingGradeButtons(r,stage)+'<div class="manual-grade-box"><div><label>Teacher score</label><div class="manual-score-wrap"><input id="batchManualScore_'+safeId(r.email)+'" type="number" min="0" max="7" step="0.5" value="'+esc(score)+'" onkeydown="if(event.key===\'Enter\'){saveManualBatchGrade(\''+esc(r.email)+'\',\''+stage+'\',this);}"><span>/ 7</span></div></div><div><label>Optional feedback</label><textarea class="batch-feedback" id="batchFeedback_'+safeId(r.email)+'" placeholder="Optional feedback comment for the student">'+esc(feedback)+'</textarea></div></div><div class="batch-save-row"><span class="grader-save-status" id="batchSaveStatus_'+safeId(r.email)+'">'+(score!==''?'Saved '+score+'/7':'Choose a score or type a grade')+'</span><button onclick="saveManualBatchGrade(\''+esc(r.email)+'\',\''+stage+'\',this)">Save & Next</button></div></div></div></div>';

// Stay within the queue the teacher is currently marking: completed work advances through
// completed/unmarked work; not-completed grading advances through other ungraded missing work.
lcNextNeedsEmail=function(email,stage){

  return list.length?list[0].email:'';
};

lcAutoGradeControls=function(r,stage){

lcAutoNextEmail=function(email,data){

// Include teacher-entered grades in weekly totals even when no student work exists.
lcWeekGradeClient=function(stu,w){

  var subScore=val(sub),prepOverride=val(prepG),peerOverride=val(peerG),refScore=val(ref);
  var hasAny=!!(ws.prep||ws.plan||ws.peerGiven||ws.reflection||subScore!=null||prepOverride!=null||peerOverride!=null||refScore!=null),pending=false,score=0;
  if(subScore!=null)score+=subScore;else if(ws.prep)pending=true;
  var prep=prepOverride!=null?prepOverride:(ws.planComplete?3:0),peer=peerOverride!=null?peerOverride:(ws.peerComplete?2:0);
  score+=prep+peer;
  if(refScore!=null)score+=refScore;else if(ws.reflection)pending=true;
  return{hasAny:hasAny,score:hasAny?score:null,pending:pending,sub:subScore,prep:prep,peer:peer,ref:refScore,prepOverride:prepOverride,peerOverride:peerOverride,ws:ws};
};

<script>
// Auto-scored overrides now update in place. This avoids rebuilding the teacher
// dashboard (and therefore avoids jumping to the top of a long roster).
function lcPaintAutoGradebox(box,r,stage,saving,failed){
  if(!box||!r)return;
  var max=stage==='preparation'?3:2;
  var hasOverride=!!(r.grade&&r.grade.score!==''&&r.grade.score!=null&&!isNaN(Number(r.grade.score)));
  var eff=lcAutoStageEffectiveScore(r,stage);
  var current=box.querySelector('.auto-current');
  if(current){
    var label=failed?'save failed':(saving?'saving…':(hasOverride?'teacher override':(r.complete?'automatic full credit':'automatic not-complete score')));
    current.innerHTML=eff+'/'+max+'<small>'+label+'</small>';
  }
  var buttons=box.querySelectorAll('.auto-override-buttons button');
  Array.prototype.forEach.call(buttons,function(b){
    b.classList.remove('selected');
    if(!hasOverride&&b.classList.contains('auto-reset'))b.classList.add('selected');
    if(hasOverride&&!b.classList.contains('auto-reset')&&Number((b.textContent||'').trim())===Number(r.grade.score))b.classList.add('selected');
  });
}

saveAutoStageOverride=function(email,stage,score,btn){
  var r=lcFindStageResponse(email);if(!r)return;
  var max=stage==='preparation'?3:2,key='w'+(platform.teacherWeek||1)+'_'+stage;
  var old=r.grade?JSON.parse(JSON.stringify(r.grade)):null;
  var dash=(platform.dashboard&&platform.dashboard.students)||[],oldDash=null;
  for(var i=0;i<dash.length;i++)if(dash[i].email===email){oldDash=dash[i].grades&&dash[i].grades[key]?JSON.parse(JSON.stringify(dash[i].grades[key])):null;break;}
  var stored=(score===''||score==null)?'':Number(score);
  r.grade={score:stored,maxPoints:max,feedback:'',rubric:{completionOverride:stored!==''},excluded:false,updatedAt:new Date().toISOString()};
  lcUpdateDashboardGradeClient(email,key,stored,'',r.grade.rubric,max);

  var box=btn&&btn.closest?btn.closest('.auto-stage-gradebox'):null;
  lcPaintAutoGradebox(box,r,stage,true,false);

  callServer('saveLiteratureGrade',[{classId:platform.activeClassId,studentEmail:email,itemKey:key,score:stored,maxPoints:max,rubric:r.grade.rubric,feedback:''}],function(){
    lcPaintAutoGradebox(box,r,stage,false,false);
  },function(err){
    r.grade=old;
    for(var j=0;j<dash.length;j++)if(dash[j].email===email){dash[j].grades=dash[j].grades||{};if(oldDash)dash[j].grades[key]=oldDash;else delete dash[j].grades[key];break;}
    lcPaintAutoGradebox(box,r,stage,false,true);
    showError('That grade did not save. '+(err&&err.message?err.message:String(err||'')));
  },{quiet:true});
};
</script>

<script>
// ===========================================================================
// INDIVIDUAL-ASSIGNMENT GRADEBOOK + GROUP / ARCHIVE TEACHER TOOLS — 2026-09-18

function lcNumGrade(g){return g&&g.score!==''&&g.score!=null&&!isNaN(Number(g.score))?Number(g.score):null;}
function lcGbStageState(stu,w,stage){
  var ws=(stu.weeks||[])[w-1]||{},grades=stu.grades||{},g=grades['w'+w+'_'+stage]||null,score=lcNumGrade(g),max=stage==='preparation'?3:(stage==='peer'?2:7),pending=false,label='—',sub='';
  if(stage==='submission'){
    if(score!=null)label=score+'/'+max;
    else if(ws.prep){label='Unmarked';pending=true;sub='submitted';}
  }else if(stage==='preparation'){
    if(score!=null)label=score+'/'+max;
    else if(ws.planComplete)label='3/3';
    else if(ws.plan){label='0/3';sub='incomplete';}
  }else if(stage==='peer'){
    if(ws.peerExpected===0){label='N/A';sub='no groupmates';}
    else if(score!=null)label=score+'/'+max;
    else if(ws.peerComplete)label='2/2';
    else if((ws.peerGiven||0)>0){label='0/2';sub='incomplete';}
  }else if(stage==='reflection'){
    if(score!=null)label=score+'/'+max;
    else if(ws.reflection){label='Unmarked';pending=true;sub='submitted';}
  }
  return{label:label,pending:pending,sub:sub,score:score,max:max};
}
function lcGbStageHeader(w,stage){
  var meta=lcStageMeta(stage),short=stage==='submission'?'Lit Circle':(stage==='preparation'?'Preparation':(stage==='peer'?'Peer Assessment':'Reflection'));
  return '<th class="lc-gb-stage-head week-'+w+'"><div class="lc-gb-stage-title">'+short+'</div><div class="lc-gb-stage-points">'+meta.points+' pts</div><div class="lc-gb-mini-actions"><button class="lc-canvas-secondary" title="Canvas settings" onclick="openLcCanvasStageModal('+w+',\''+stage+'\')">Canvas</button><button class="lc-canvas-secondary" title="Download Canvas CSV" onclick="downloadLcCanvasStageCsv('+w+',\''+stage+'\')">CSV</button></div></th>';
}
renderLcGradebookView=function(d){
  var students=d.students||[],canvas=(d.classInfo.settings&&d.classInfo.settings.canvas)||{},linked=!!canvas.courseId,released=(d.classInfo.settings&&d.classInfo.settings.releasedWeeks)||[],stages=['submission','preparation','peer','reflection'];
  var head='<div class="lc-gradebook-head"><div><h2>Gradebook</h2><p>Every Lit Circles assignment has its own grade column and its own Canvas controls. Weeks are shaded from light to dark green so you can scan the class quickly.</p></div><div>'+(linked?'<div class="canvas-link-note">Canvas: '+esc(canvas.courseName||canvas.courseId)+'</div>':'<div class="canvas-unlinked-note">Connect Canvas to create and sync each assignment independently.</div>')+'</div></div>';
  var top=[1,2,3,4].map(function(w){return'<th class="week-'+w+'" colspan="4"><div class="lc-gb-weekband">Week '+w+' · 19 pts</div></th>';}).join('');
  var second=[1,2,3,4].map(function(w){return stages.map(function(stage){return lcGbStageHeader(w,stage);}).join('');}).join('');
  var rows=students.slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));}).map(function(stu){
    var total=0,possible=0,cells='';
    [1,2,3,4].forEach(function(w){
      var wg=lcWeekGradeClient(stu,w);if(released.indexOf(w)>=0){possible+=19;if(wg.score!=null)total+=wg.score;}
      stages.forEach(function(stage){var x=lcGbStageState(stu,w,stage);cells+='<td class="week-'+w+'"><div class="lc-gb-cell '+(x.pending?'pending':'')+'">'+x.label+(x.pending?' •':'')+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</div></td>';});
    });
    return'<tr><td class="lc-student-cell"><strong>'+esc(stu.name)+'</strong><small>'+esc(stu.email)+(stu.bookTitle?' · '+esc(stu.bookTitle):'')+'</small></td>'+cells+'<td class="lc-overall-cell">'+(possible?'<strong>'+total+'/'+possible+'</strong>':'—')+'</td></tr>';
  }).join('');
  var cols='<colgroup><col class="lc-col-student">'+Array(16).fill('<col class="lc-col-stage">').join('')+'<col class="lc-col-overall"></colgroup>'; return'<section class="lc-gradebook-shell">'+head+'<div class="lc-gradebook-scroll"><table class="lc-gradebook individual">'+cols+'<thead><tr><th rowspan="2">Student</th>'+top+'<th rowspan="2">Overall</th></tr><tr>'+second+'</tr></thead><tbody>'+rows+'</tbody></table></div></section>';
};

function lcActiveGroupsForRoster(d){
  var groups=(d.activeGroups||[]).slice();if(groups.length)return groups;
  var seen={};(d.students||[]).forEach(function(s){if(s.groupId&&!seen[s.groupId]){seen[s.groupId]=true;groups.push({groupId:s.groupId,bookTitle:s.bookTitle||'Untitled Book',memberEmails:(s.groupMembers||[]).slice(),weekReading:(s.weekReading||[]).slice()});}});return groups;
}
function lcGroupOptionLabel(g){var tail=String(g.groupId||'').slice(-4).toUpperCase();return (g.bookTitle||'Untitled Book')+' · '+(g.memberEmails||[]).length+' student'+((g.memberEmails||[]).length===1?'':'s')+' · '+tail;}
function lcMoveGroupOptions(d,s){var groups=lcActiveGroupsForRoster(d),html='<option value="">Unassigned / setup needed</option>';groups.forEach(function(g){html+='<option value="'+esc(g.groupId)+'" '+(String(s.groupId||'')===String(g.groupId)?'selected':'')+'>'+esc(lcGroupOptionLabel(g))+'</option>';});html+='<option value="__new__">＋ Create a new group…</option>';return html;}
function moveLcStudentGroup(email){
  var sel=$('lcGroupMove_'+safeId(email));if(!sel)return;var target=sel.value,student=(platform.dashboard.students||[]).find(function(s){return s.email===email;});
  if(target==='__new__'){
    var title=prompt('Book title for the new group:',student&&student.bookTitle?student.bookTitle:'');if(title===null)return;title=String(title||'').trim();if(!title){showError('Enter a book title.');return;}
    var groups=lcActiveGroupsForRoster(platform.dashboard),current=groups.find(function(g){return student&&g.groupId===student.groupId;}),readings=current&&current.weekReading?current.weekReading:['','','',''];
    platformRpc('teacherCreateLiteratureGroupForStudent',[{classId:platform.activeClassId,studentEmail:email,bookTitle:title,weekReading:readings}],function(){showInfo('New group created and student moved.');loadTeacherDashboard(platform.activeClassId);},function(e){showError(e&&e.message?e.message:String(e));});return;
  }
  if(String(target||'')===String(student&&student.groupId||''))return;
  var targetGroup=lcActiveGroupsForRoster(platform.dashboard).find(function(g){return String(g.groupId)===String(target);});
  var msg=targetGroup?'Move '+(student?student.name:email)+' to '+targetGroup.bookTitle+'?':'Remove '+(student?student.name:email)+' from the current group and return them to setup?';
  if(!confirm(msg))return;
  platformRpc('teacherMoveLiteratureStudentGroup',[{classId:platform.activeClassId,studentEmail:email,targetGroupId:target}],function(){showInfo('Group updated.');loadTeacherDashboard(platform.activeClassId);},function(e){showError(e&&e.message?e.message:String(e));});
}
function restoreLcArchivedBook(email,groupId,bookTitleEncoded,btn){
  var bookTitle=decodeURIComponent(bookTitleEncoded||'');
  if(!confirm('Restore "'+bookTitle+'" as this student\'s active Literature Circle? If they currently have another active book, it will be archived first.'))return;
  platformRpc('teacherRestoreLiteratureArchive',[{classId:platform.activeClassId,studentEmail:email,groupId:groupId}],function(r){showInfo('Restored '+(r.bookTitle||bookTitle)+'.');loadTeacherDashboard(platform.activeClassId);},function(e){showError(e&&e.message?e.message:String(e));},btn);
}
renderLcRosterView=function(d){
  var students=d.students||[],groups=lcActiveGroupsForRoster(d);
  var rows=students.slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));}).map(function(s){
    var chips=(s.weeks||[]).map(function(w){var done=w.prep&&w.planComplete&&(w.peerExpected===0||w.peerComplete)&&w.reflection;return'<span class="lc-progress-chip '+(done?'done':'')+'">W'+w.week+' '+(done?'✓':'in progress')+'</span>';}).join('');
    var mates=(s.groupMembers||[]).filter(function(e){return String(e||'').toLowerCase()!==String(s.email||'').toLowerCase();});
    var archives=(s.archivedBooks||[]);var archiveHtml=archives.length?'<div class="lc-archive-list">'+archives.map(function(a){var when=a.archivedAt?new Date(a.archivedAt).toLocaleDateString():'';return'<div class="lc-archive-item"><span><strong>'+esc(a.bookTitle||'Past book')+'</strong>'+(when?'<br>'+esc(when):'')+'</span><button class="secondary" onclick="restoreLcArchivedBook(\''+esc(s.email)+'\',\''+esc(a.groupId)+'\',\''+encodeURIComponent(String(a.bookTitle||''))+'\',this)">Restore</button></div>';}).join('')+'</div>':'<span class="muted">None</span>';
    return'<tr><td><strong>'+esc(s.name)+'</strong></td><td>'+esc(s.email)+'</td><td>'+(s.bookTitle?esc(s.bookTitle):'<span class="muted">Not assigned</span>')+'</td><td>'+(mates.length?esc(mates.join(', ')):'—')+'</td><td><div class="lc-group-tools"><select id="lcGroupMove_'+safeId(s.email)+'">'+lcMoveGroupOptions(d,s)+'</select><button onclick="moveLcStudentGroup(\''+esc(s.email)+'\')">Move</button></div></td><td>'+archiveHtml+'</td><td><div class="lc-roster-progress">'+chips+'</div></td></tr>';
  }).join('');
  var groupSummary=groups.length?groups.map(function(g){return'<div class="lc-archive-item"><span><strong>'+esc(g.bookTitle||'Untitled Book')+'</strong><br>'+esc((g.memberEmails||[]).join(', ')||'No members')+'</span><span class="teacher-mini">'+esc(String(g.groupId||'').slice(-4).toUpperCase())+'</span></div>';}).join(''):'<p class="muted">No active groups yet.</p>';
  var demo='<div class="lc-roster-card"><h3>Demo Students</h3><p class="muted">Load or remove the 10 Week 1 demo students used to test grading.</p><button onclick="loadLiteratureDemoStudents(this)">Load 10 Demo Students</button> <button class="secondary" onclick="removeLiteratureDemoStudents(this)">Remove Demo Students</button></div>';
  return'<section class="lc-roster-shell"><div class="lc-roster-head"><div><h2>Class Roster & Group Tools</h2><p>Move students between active groups, return a student to setup, create a new group for an unusual situation, or restore an archived Literature Circle.</p></div></div><div style="overflow-x:auto"><table class="lc-roster-table tools"><thead><tr><th>Student</th><th>Email</th><th>Book</th><th>Groupmates</th><th>Move / Reassign</th><th>Archived Circles</th><th>Progress</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="lc-group-note"><strong>How moves behave:</strong> moving between groups reading the same book preserves the student\'s own Lit Circle work, drafts, reflections, and self-assessments. Moving to a different book archives the current circle first. Choosing <strong>Unassigned</strong> sends the student back to setup on their next visit.</div><div class="lc-roster-manage"><div class="lc-roster-card"><h3>Active Groups</h3><div class="lc-archive-list">'+groupSummary+'</div></div><div class="lc-roster-card"><h3>Add Students</h3><label>Student emails</label><textarea id="lcRosterEmails" placeholder="student1@school.org\nstudent2@school.org"></textarea><button id="addLcStudentsBtn" style="margin-top:9px" onclick="addLcStudents()">Add Students</button></div><div class="lc-roster-card"><h3>Class Access</h3><div class="teacher-mini">Join code</div><div class="join-code">'+esc(d.classInfo.joinCode)+'</div><p class="muted">Students can join this class with the code above.</p></div>'+demo+'</div></section>';
};

  "What does this book argue is true about people — and do you believe it?"

var LC_WEEK_SUBQUESTIONS=[

  "Return to this week's Essential Question: Whose version of this story are we getting, and what would change if someone else told it? Explain one way perspective shapes what the reader understands or feels.",

}

function lcTimeAfter(a,b){var da=new Date(a||''),db=new Date(b||'');return !isNaN(da.getTime())&&!isNaN(db.getTime())&&da.getTime()>db.getTime()+1000;}

// Excluded grades are treated as handled work, display as EX, and are skipped by Canvas.
lcIsTeacherGraded=function(r){return !!(r&&r.grade&&(r.grade.excluded||(r.grade.score!==''&&r.grade.score!=null)));};
lcTeacherGradeState=function(r,stage){
  if(stage!=='submission'&&stage!=='reflection')return r.complete?{rank:0,cls:'complete',text:'Complete'}:{rank:1,cls:'incomplete',text:'Not completed'};

  if(!r.submitted){if(hasGrade)return{rank:2,cls:'graded',text:'Graded '+r.grade.score+'/7 · no submission'};return{rank:1,cls:'missing',text:'Not completed'};}
  if(r.resubmitted)return{rank:0,cls:'resubmitted',text:'Resubmitted · needs grading'};
  if(hasGrade)return{rank:2,cls:'graded',text:'Graded '+r.grade.score+'/7'};

};
lcBatchStatus=function(r,stage){return lcTeacherGradeState(r,stage);};

function toggleLiteratureGradeExcluded(email,stage,btn){

};

renderLcGradebookView=function(d){
  var students=d.students||[],canvas=(d.classInfo.settings&&d.classInfo.settings.canvas)||{},linked=!!canvas.courseId,released=(d.classInfo.settings&&d.classInfo.settings.releasedWeeks)||[],stages=['submission','preparation','peer','reflection'];var head='<div class="lc-gradebook-head"><div><h2>Gradebook</h2><p>Every Lit Circles assignment has its own grade column and Canvas controls. EX means the assignment is excluded from that student’s grade.</p></div><div>'+(linked?'<div class="canvas-link-note">Canvas: '+esc(canvas.courseName||canvas.courseId)+'</div>':'<div class="canvas-unlinked-note">Connect Canvas to create and sync each assignment independently.</div>')+'</div></div>',top=[1,2,3,4].map(function(w){return'<th class="week-'+w+'" colspan="4"><div class="lc-gb-weekband">Week '+w+' · 19 pts</div></th>';}).join(''),second=[1,2,3,4].map(function(w){return stages.map(function(stage){return lcGbStageHeader(w,stage);}).join('');}).join('');
  var rows=students.slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));}).map(function(stu){var total=0,possible=0,cells='';[1,2,3,4].forEach(function(w){stages.forEach(function(stage){var x=lcGbStageState(stu,w,stage),assigned=released.indexOf(w)>=0;if(assigned&&!x.excluded&&!(stage==='peer'&&x.label==='N/A')){possible+=x.max;if(x.score!=null)total+=x.score;else if(stage==='preparation'&&x.label==='3/3')total+=3;else if(stage==='peer'&&x.label==='2/2')total+=2;}cells+='<td class="week-'+w+'"><div class="lc-gb-cell '+(x.pending?'pending ':'')+(x.excluded?'excluded':'')+'">'+(x.excluded?'<span class="lc-gb-excluded">EX</span>':x.label)+(x.pending?' •':'')+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</div></td>';});});return'<tr><td class="lc-student-cell"><strong>'+esc(stu.name)+'</strong><small>'+esc(stu.email)+(stu.bookTitle?' · '+esc(stu.bookTitle):'')+'</small></td>'+cells+'<td class="lc-overall-cell">'+(possible?'<strong>'+total+'/'+possible+'</strong>':'—')+'</td></tr>';}).join('');var cols='<colgroup><col class="lc-col-student">'+Array(16).fill('<col class="lc-col-stage">').join('')+'<col class="lc-col-overall"></colgroup>';return'<section class="lc-gradebook-shell">'+head+'<div class="lc-gradebook-scroll"><table class="lc-gradebook individual">'+cols+'<thead><tr><th rowspan="2">Student</th>'+top+'<th rowspan="2">Overall</th></tr><tr>'+second+'</tr></thead><tbody>'+rows+'</tbody></table></div></section>';
};
</script>


<script>
// A new teacher score re-includes a previously excluded item locally, matching the backend save.
lcUpdateStageGradeLocal=function(r,score,feedback,rubric){r.grade=r.grade||{};r.grade.score=score;r.grade.feedback=feedback;r.grade.rubric=rubric;r.grade.excluded=false;r.grade.updatedAt=new Date().toISOString();r.resubmitted=false;};
lcUpdateDashboardGradeClient=function(email,key,score,feedback,rubric,maxPoints){var dash=(platform.dashboard&&platform.dashboard.students)||[],inferred=/_preparation$/.test(key)?3:(/_peer$/.test(key)?2:7),max=maxPoints==null?inferred:Number(maxPoints),stored=(score===''||score==null)?'':Number(score);for(var i=0;i<dash.length;i++)if(String(dash[i].email)===String(email)){dash[i].grades=dash[i].grades||{};dash[i].grades[key]={score:stored,maxPoints:max,feedback:feedback||'',rubric:rubric||{},excluded:false,updatedAt:new Date().toISOString()};break;}};

<script>
// ---------------------------------------------------------------------------
// Step 4 clarity fix: Step 3 is ratings; Step 4 is written reflection + EQ.
// Students may open Step 4 to preview/draft it, but final saving still requires
// the discussion-day self-rating when they have groupmates.
// ---------------------------------------------------------------------------
openWeekSection = function(section) {
  state.view = 'week_' + section;
  saveStudentResumeClient();
  render();
};

viewWeek = function() {
  var wk=state.week,g=state.group,work=state.weeklyWork[wk],mates=getGroupmatesLocal();
  var submissionDone=!!(work&&work.prepType), planDone=!!discussionPlanFor(wk), given=uniquePeerGivenCount(wk), peerDone=mates.length>0&&given>=mates.length, discussionSelfDone=!!(state.selfAssessments&&state.selfAssessments[wk]), selfDone=!!state.reflections[wk];
  function step(no,title,desc,status,section){
    return '<div class="journey-step" onclick="openWeekSection(\''+section+'\')"><div class="step-status">'+status+'</div><div class="step-no">'+no+'</div><h3>'+title+'</h3><p>'+desc+'</p><div class="step-action">Open step →</div></div>';
  }
  return '<a class="backlink" onclick="goHome()">← Back to all weeks</a>'+ 
    '<section class="week-hero"><div><div class="week-label">Week '+wk+' Journey</div><h2>'+(['Entry · World and Character','Conflict and Choice','Craft and Perspective','Synthesis and Transfer'][wk-1])+'</h2><p>Move through these four distinct stages: prepare your thinking, plan your discussion, exchange feedback, then write your reflection.</p></div><div class="reading-badge">📖 '+esc(g.weekReading[wk-1]||'Reading range not set')+'</div></section>'+ 
    '<div class="journey-step-grid">'+
      step(1,'Lit Circle Submission','Complete this week’s two reading strategies. This is your main reading response for the week.',submissionDone?'<span class="badge done">Saved</span>':'<span class="badge pending">Not started</span>','strategies')+
      step(2,'Plan Your 5-Minute Discussion','Use your reading work to build a focused plan for leading your group for at least five minutes.',planDone?'<span class="badge done">Ready</span>':'<span class="badge pending">Plan needed</span>','plan')+
      step(3,'Discussion Day · Peer + Self Ratings','Lead the discussion, assess each groupmate, then rate your own Participation, Leadership, and Active Engagement.',mates.length?((peerDone&&discussionSelfDone)?'<span class="badge done">Ratings complete</span>':(peerDone?'<span class="badge pending">Self-rate next</span>':'<span class="badge pending">Peer '+given+'/'+mates.length+'</span>')):'<span class="badge pending">No teammates</span>','peer')+
      step(4,wk===4?'Final Reflection · Essential Question':'Written Reflection · Essential Question','Now step away from the rating rubric. Review what your peers noticed, answer this week\'s Essential Question with evidence, and set a specific next step.',selfDone?'<span class="badge done">Reflection saved</span>':'<span class="badge pending">Reflection not started</span>','reflection')+
    '</div>';
};

viewWeekReflection = function(){
  var wk=state.week,received=(state.peerFeedbackReceived[wk]||[]).length,mates=getGroupmatesLocal(),selfDone=!!(state.selfAssessments&&state.selfAssessments[wk]);
  var gate=(mates.length&&!selfDone)
    ? '<div class="msg info" style="margin-bottom:16px"><strong>Step 4 is your written reflection—not another rating.</strong> You can preview the questions now, but finish your Step 3 self-rating before you submit this reflection.</div>'
    : '<div class="msg success" style="margin-bottom:16px"><strong>Step 3 is complete.</strong> Use the ratings and comments as evidence, then move beyond the rubric and explain what you learned.</div>';
  return '<a class="backlink" onclick="backToWeekHub()">← Back to Week '+wk+'</a><div class="card"><div class="week-kicker">Step 4 · Week '+wk+'</div><h2 style="margin:4px 0 4px">'+(wk===4?'Final Reflection + Essential Question':'Written Reflection + Essential Question')+'</h2><p class="muted">This is different from Step 3. Do not rate yourself again. Instead, interpret the feedback, return to the week’s Essential Question, use evidence from the book, and decide what you will carry forward.</p>'+gate+(received?'<div class="msg success">You have '+received+' peer feedback submission'+(received===1?'':'s')+' available as evidence for this reflection.</div>':'<div class="msg info">No peer comments have arrived yet. You can review the prompts and return after your groupmates submit feedback.</div>')+renderReflectionSection(wk)+'<div style="margin-top:14px"><button class="secondary" id="exportReflectionBtn" onclick="doExportReflectionSection('+wk+')">Download a Copy (PDF)</button> <span id="exportReflectionMsg" class="muted"></span></div></div>';
};

var _lcStep4SaveReflection = doSaveReflection;
doSaveReflection = function(wk){
  var mates=getGroupmatesLocal();
  if(mates.length && !(state.selfAssessments&&state.selfAssessments[wk])){
    showError('Finish Step 3 by saving your discussion-day self-rating before submitting the written reflection.');
    return;
  }
  return _lcStep4SaveReflection(wk);
};
</script>

<script>
// ---------------------------------------------------------------------------
// Internal navigation history
// Keep browser/in-app Back navigation inside Literature Circles instead of
// falling through to Google Apps Script authentication / launcher pages.
// ---------------------------------------------------------------------------
var lcHistory = { ready:false, applying:false, lastKey:'', replaceNext:false };

function lcHistorySnapshot(){
  if(platform && platform.mode==='teacher'){
    return {
      lcInternal:true,
      mode:'teacher',
      classId:platform.activeClassId||'',
      teacherView:platform.teacherView||'dashboard',
      teacherWeek:Number(platform.teacherWeek||1),
      teacherStage:platform.teacherStage||'submission'
    };
  }
  if(platform && platform.mode==='admin'){
    return {lcInternal:true,mode:'admin'};
  }
  var wk=Number(state.week||1);
  return {
    lcInternal:true,
    mode:'student',
    email:state.email||'',
    view:state.view||'login',
    week:wk,
    flowStage:prepFlowStage(wk),
    focusIndex:prepFocusIndex(wk),
    hybridMoment:hybridMomentIndex(wk)
  };
}
function lcHistoryKey(r){
  if(!r)return'';
  if(r.mode==='teacher')return ['teacher',r.classId||'',r.teacherView||'',r.teacherWeek||1,r.teacherStage||''].join('|');
  if(r.mode==='admin')return 'admin';
  return ['student',r.email||'',r.view||'login',r.week||1,r.flowStage||'',r.focusIndex||0,r.hybridMoment||0].join('|');
}
function lcHistoryUrl(r){
  // A harmless hash makes the current in-app route visible to browser history
  // without changing or reloading the Apps Script deployment URL.
  var base=String(window.location.href||'').split('#')[0];
  if(r.mode==='teacher')return base+'#lc-teacher-'+encodeURIComponent(r.teacherView||'dashboard')+'-w'+(r.teacherWeek||1);
  if(r.mode==='admin')return base+'#lc-admin';
  return base+'#lc-'+encodeURIComponent(r.view||'home')+'-w'+(r.week||1);
}
function lcHistoryWrite(method,snap){
  try{window.history[method](snap,'',lcHistoryUrl(snap));}
  catch(e){window.history[method](snap,'');}
}
function lcHistorySyncBeforeRender(){
  if(!lcHistory.ready||lcHistory.applying)return;
  var snap=lcHistorySnapshot(),key=lcHistoryKey(snap);
  if(!key)return;
  try{
    if(!lcHistory.lastKey){
      lcHistoryWrite('replaceState',snap);
    }else if(key!==lcHistory.lastKey){
      // Never leave an authenticated user's login screen behind in history.
      var wasLogin=lcHistory.lastKey.indexOf('|login|')>=0;
      var isLogin=snap.mode==='student'&&snap.view==='login';
      if(lcHistory.replaceNext||isLogin||wasLogin){
        lcHistoryWrite('replaceState',snap);
      }else{
        lcHistoryWrite('pushState',snap);
      }
    }else{
      lcHistoryWrite('replaceState',snap);
    }
  }catch(e){}
  lcHistory.replaceNext=false;
  lcHistory.lastKey=key;
}
function lcHistoryApply(route){
  if(!route||!route.lcInternal)return false;
  lcHistory.applying=true;
  try{
    if(route.mode==='teacher'){
      platform.mode='teacher';
      platform.teacherView=route.teacherView||'dashboard';
      platform.teacherWeek=Math.max(1,Math.min(4,Number(route.teacherWeek)||1));
      platform.teacherStage=route.teacherStage||'submission';
      platform.stageResponses=null;
      platform.stageFocusEmail='';
      if(route.classId && String(route.classId)!==String(platform.activeClassId||'')){
        platform.activeClassId=route.classId;
        loadTeacherDashboard(route.classId);
      }else if(platform.dashboard){
        renderTeacherDashboard();
      }else{
        showTeacherPortal();
      }
    }else if(route.mode==='admin'){
      platform.mode='admin';
      if(platform.adminAccess)renderAdminPortal();else loadAdminAccess();
    }else{
      // Do not let browser history reopen a different student's work after
      // Switch student on a shared device.
      if(route.email && state.email && String(route.email).toLowerCase()!==String(state.email).toLowerCase()){
        lcHistory.applying=false;
        lcHistory.replaceNext=true;
        render();
        return true;
      }
      if(route.email && !state.email){
        lcHistory.applying=false;
        lcHistory.replaceNext=true;
        render();
        return true;
      }
      platform.mode='student';
      state.week=Math.max(1,Math.min(4,Number(route.week)||1));
      if(resumeAllowedView(route.view)||route.view==='setup'||route.view==='login')state.view=route.view;
      setPrepFlowStage(state.week,route.flowStage||'pathway');
      setPrepFocusIndex(state.week,Number(route.focusIndex)||0);
      setHybridMomentIndex(state.week,Number(route.hybridMoment)||0);
      render();
      if(state.email)saveStudentResumeClient();
    }
  }finally{
    lcHistory.lastKey=lcHistoryKey(lcHistorySnapshot());
    lcHistory.applying=false;
  }
  return true;
}
function lcMarkBackNavigation(){lcHistory.replaceNext=true;}

// Track every student route change, including direct state.view changes from
// buttons such as Growth Story and Peer Feedback.
var _lcRenderWithInternalHistory=render;
render=function(preserveScroll){
  lcHistorySyncBeforeRender();
  return _lcRenderWithInternalHistory(preserveScroll);
};

// Teacher pages render through their own function, so track those routes too.
var _lcRenderTeacherWithInternalHistory=renderTeacherDashboard;
renderTeacherDashboard=function(){
  lcHistorySyncBeforeRender();
  return _lcRenderTeacherWithInternalHistory.apply(this,arguments);
};

// Explicit app Back controls navigate to a known Literature Circles parent
// route and replace the child route rather than relying on browser history.
var _lcGoHomeInternal=goHome;
goHome=function(){lcMarkBackNavigation();return _lcGoHomeInternal();};
var _lcBackWeekInternal=backToWeekHub;
backToWeekHub=function(){lcMarkBackNavigation();return _lcBackWeekInternal();};
var _lcEditSetupInternal=editSetup;
editSetup=function(){lcMarkBackNavigation();return _lcEditSetupInternal();};
var _lcReturnPathInternal=returnToPathway;
returnToPathway=function(wk){lcMarkBackNavigation();return _lcReturnPathInternal(wk);};
var _lcReturnPickerInternal=returnToPicker;
returnToPicker=function(wk){lcMarkBackNavigation();return _lcReturnPickerInternal(wk);};

window.addEventListener('popstate',function(ev){
  var route=ev.state;
  if(route&&route.lcInternal){
    lcHistoryApply(route);
  }
});

(function initLcInternalHistory(){
  try{
    var snap=lcHistorySnapshot();
    lcHistoryWrite('replaceState',snap);
    lcHistory.lastKey=lcHistoryKey(snap);
    lcHistory.ready=true;
  }catch(e){
    lcHistory.ready=false;
  }
})();
</script>
