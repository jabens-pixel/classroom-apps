<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Brand colors: Green #00AD67 (dominant),
         Blue #3986AC (secondary), Orange #ed9c0d (accent), on black/charcoal for an edgier, high-contrast look. */
      --bg-black: #0a0d0c; --bg-panel: #12211a; --bg-card: #16241d; --bg-card-hover: #1c2f25;
      --accent-green: #00AD67; --accent-green-dim: #028a54; --accent-blue: #3986AC; --accent-orange: #ed9c0d;
      --text-white: #f3f7f5; --text-dim: #93aca1;
      --success: #00AD67; --success-bg: #0f2b1f; --error: #ff5c4d; --error-bg: #3a1512;
      --radius: 4px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; min-height: 100vh;
      background:
        linear-gradient(160deg, rgba(0,173,103,0.10) 0%, transparent 30%),
        linear-gradient(-20deg, rgba(57,134,172,0.10) 0%, transparent 35%),
        var(--bg-black);
      color: var(--text-white);
    }
    header {
      background: var(--bg-panel); color: var(--text-white); padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      border-bottom: 3px solid var(--accent-green);
      box-shadow: 0 0 18px rgba(0,173,103,0.35);
    }
    header h1 {
      font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 21px; margin: 0;
      color: var(--text-white); letter-spacing: 1.2px; text-transform: uppercase;
    }
    header h1 .brand { color: var(--accent-green); }
    header .who { font-size: 13px; color: var(--text-dim); }
    header a { color: var(--accent-green); cursor: pointer; text-decoration: none; font-weight: 700; font-size: 12.5px; margin-left: 14px; text-transform: uppercase; letter-spacing: 0.4px; }
    header a:hover { color: var(--accent-orange); }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    .card {
      background: var(--bg-panel); border: 1px solid rgba(0,173,103,0.25); border-left: 3px solid var(--accent-green);
      border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    }
    h2, h3 { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; color: var(--text-white); text-transform: uppercase; letter-spacing: 0.6px; }
    h2 { margin-top: 0; border-bottom: 2px solid var(--accent-green); padding-bottom: 8px; display: inline-block; }
    h3 { margin-bottom: 8px; color: var(--accent-green); }
    label { display: block; font-weight: 700; margin: 14px 0 4px; font-size: 12.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    input[type=text], input[type=email], input[type=number], textarea, select {
      width: 100%; padding: 9px 10px; border: 1.5px solid rgba(0,173,103,0.3); border-radius: var(--radius); font-size: 14px;
      font-family: inherit; background: var(--bg-card); color: var(--text-white);
    }
    input::placeholder, textarea::placeholder { color: var(--text-dim); opacity: 0.7; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(0,173,103,0.25); }
    textarea { min-height: 70px; resize: vertical; }
    .hint { color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
    .hint.reminder { color: var(--accent-orange); background: rgba(237,156,13,0.10); border: 1px solid rgba(237,156,13,0.3); border-radius: var(--radius); padding: 8px 10px; margin: 8px 0 4px; font-size: 12.5px; }
    .hint.example { color: #8fc6e0; background: rgba(57,134,172,0.12); border: 1px solid rgba(57,134,172,0.35); border-radius: var(--radius); padding: 8px 10px; margin: 8px 0 4px; font-size: 12.5px; }
    .rubric-desc { line-height: 1.5; margin: 2px 0 8px; }
    .rubric-desc div { margin-bottom: 3px; }
    .rubric-desc strong { color: var(--text-white); }
    .starter-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
    .starter-pill { background: rgba(57,134,172,0.12); border: 1px solid rgba(57,134,172,0.35); color: #8fc6e0; border-radius: 12px; padding: 3px 10px; font-size: 12px; font-style: italic; }
    button, .btn {
      background: var(--accent-green); color: #06120c; border: none; padding: 11px 22px; border-radius: var(--radius);
      font-size: 13.5px; cursor: pointer; font-weight: 700; font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase; letter-spacing: 0.6px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      transition: box-shadow 0.15s ease, background 0.15s ease;
    }
    button:hover, .btn:hover { background: #00d17d; box-shadow: 0 0 14px rgba(0,173,103,0.6); }
    button.secondary { background: transparent; color: var(--accent-green); border: 1.5px solid var(--accent-green-dim); clip-path: none; }
    button.secondary:hover { background: rgba(0,173,103,0.12); box-shadow: none; }
    button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 140px; }
    .chapter-row { display: flex; align-items: center; gap: 8px; }
    .chapter-row input { width: 70px; flex: none; text-align: center; }
    .week-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; margin-top: 18px; overflow:visible; }
    .week-tile { position:relative; border: 1px solid rgba(0,173,103,0.25); border-top: 3px solid var(--accent-blue); border-radius: 7px; padding: 15px; background: var(--bg-card); text-align: left; cursor: pointer; min-height:165px; } .week-tile:not(:last-child)::after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--accent-orange);font-size:20px;font-weight:700;z-index:2}.week-tile.locked{opacity:.58;border-top-color:#66756e;cursor:not-allowed}.week-tile.locked:hover{box-shadow:none;border-color:rgba(0,173,103,.25);background:var(--bg-card)}
    .week-tile:hover { border-color: var(--accent-green); background: var(--bg-card-hover); box-shadow: 0 0 12px rgba(0,173,103,0.25); }
    .week-tile .wk { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; color: var(--accent-green); text-transform: uppercase; letter-spacing: 0.5px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 3px 9px; border-radius: var(--radius); margin-top: 6px; }
    .badge.done { background: var(--success-bg); color: #6be6a6; }
    .badge.pending { background: rgba(237,156,13,0.15); color: var(--accent-orange); }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .pill { border: 1.5px solid rgba(0,173,103,0.3); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; font-size: 13px; background: var(--bg-card); color: var(--text-white); }
    .pill:hover { background: var(--bg-card-hover); }
    .pill.selected { background: var(--accent-green); color: #06120c; border-color: var(--accent-green); font-weight: 700; }
    .rich-editor {
      width: 100%; min-height: 70px; padding: 9px 10px; border: 1.5px solid rgba(0,173,103,0.3); border-radius: var(--radius);
      font-size: 14px; font-family: inherit; background: var(--bg-card); color: var(--text-white);
      white-space: pre-wrap; word-wrap: break-word; overflow-y: auto;
    }
    .rich-editor:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(0,173,103,0.25); }
    .rich-editor:empty:before { content: attr(data-placeholder); color: var(--text-dim); opacity: 0.7; }
    mark { padding: 1px 2px; border-radius: 2px; }
    /* 2026-10-27b: strategies are UNDERLINED in their colour (easier to read than highlighter) */
    mark.hl-summarizer{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#d4ad00;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-researcher{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#5e9e2a;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-connector{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#1b8fd0;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-questioner{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#d63d74;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-literaryLuminary{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#e07b12;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-predictor{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#9440ad;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-inferences{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#1f978b;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    mark.hl-illustrator{background:transparent!important;color:inherit;padding:0;border-radius:0;text-decoration:underline;text-decoration-color:#cf3f3f;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-skip-ink:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .hl-pill { padding: 6px 12px; font-size: 12px; }
    .check-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border: 1px solid rgba(0,173,103,0.2); border-radius: var(--radius); }
    .check-row input { width: auto; }
    .strategy-block { border-left: 4px solid var(--accent-blue); padding: 12px 14px; margin-top: 14px; background: var(--bg-card); border-radius: 0 var(--radius) var(--radius) 0; }
    .repeat-item { border-bottom: 1px dashed rgba(0,173,103,0.2); padding-bottom: 10px; margin-bottom: 10px; }
    .repeat-item:last-child { border-bottom: none; }
    .teammate-card { border: 1px solid rgba(0,173,103,0.2); border-radius: var(--radius); padding: 12px 14px; margin-top: 10px; background: var(--bg-card); }
    .msg { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 14px; font-size: 14px; position: relative; }
    .msg.error { background: var(--error-bg); color: #ffd3cc; border-left: 3px solid var(--error); }
    .msg.success { background: var(--success-bg); color: #cdf3dc; border-left: 3px solid var(--success); }
    .msg.info { background: rgba(57,134,172,0.15); color: #8fc6e0; border-left: 3px solid var(--accent-blue); }
    .msg .msg-close { position: absolute; top: 6px; right: 10px; cursor: pointer; opacity: 0.7; font-size: 13px; }
    .muted { color: var(--text-dim); font-size: 13px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,173,103,0.3); border-top-color: var(--accent-green); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .backlink { display: inline-block; margin-bottom: 12px; color: var(--accent-green); cursor: pointer; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    .email-box-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
    .paste-blocked { border-color: var(--error) !important; box-shadow: 0 0 0 2px rgba(255,92,77,0.3) !important; }
    .paste-note { color: var(--error); font-size: 12.5px; margin-top: 4px; }
    .growth-timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; }
    .growth-week { border: 1px solid rgba(0,173,103,0.25); border-top: 3px solid var(--accent-blue); border-radius: var(--radius); padding: 14px; background: var(--bg-card); }
    .growth-week-label { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; color: var(--accent-green); text-transform: uppercase; letter-spacing: 0.5px; font-size: 13px; }
    .growth-strat { font-weight: 700; margin-top: 4px; font-size: 13.5px; }
    .growth-quote { font-style: italic; color: var(--text-dim); margin-top: 8px; font-size: 13px; border-left: 2px solid var(--accent-green-dim); padding-left: 8px; }
    .growth-goal { margin-top: 10px; font-size: 12.5px; color: var(--accent-orange); }
    .growth-spotlight { border-left: 3px solid var(--accent-orange); padding-left: 14px; }
    .growth-spotlight p { margin: 10px 0; }
    .score-bars { margin-top: 10px; }
    .score-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 11.5px; }
    .score-label { flex: 0 0 92px; color: var(--text-dim); }
    .score-track { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
    .score-fill { height: 100%; background: var(--accent-green); }
    .score-val { flex: 0 0 26px; text-align: right; color: var(--text-dim); }
    @media print {
      .no-print { display: none !important; }
      header { display: none !important; }
      body { background: #fff !important; color: #111 !important; }
      .card { background: #fff !important; border-color: #ccc !important; box-shadow: none !important; }
      .growth-week { background: #f7f7f7 !important; }
      h2, h3 { color: #111 !important; }
      .growth-quote, .muted, .score-label, .score-val { color: #444 !important; }
    }

    /* === 2026 Literature Circles Journey Redesign === */
    :root {
      --bg-black:#f4f8f6; --bg-panel:#ffffff; --bg-card:#ffffff; --bg-card-hover:#f1f8f4;
      --text-white:#17372b; --text-dim:#63786e; --success-bg:#e9f8f0; --error-bg:#fff0ed;
      --radius:18px;
    }
    body { background:
      radial-gradient(circle at 8% 8%, rgba(0,173,103,.10), transparent 26rem),
      radial-gradient(circle at 92% 18%, rgba(57,134,172,.10), transparent 24rem),
      #f4f8f6; color:#17372b; }
    header { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96); backdrop-filter:blur(14px);
      border-bottom:1px solid #dce9e2; box-shadow:0 8px 30px rgba(23,55,43,.07); padding:14px 24px; }
    header h1 { color:#17372b; font-size:22px; text-transform:none; letter-spacing:.2px; }
    header .who { color:#667c71; }
    header a { color:#267451; text-transform:none; letter-spacing:0; }
    main { max-width:1240px; padding:34px 24px 80px; }
    .card { background:#fff; color:#17372b; border:1px solid #dce9e2; border-left:0; border-radius:22px;
      box-shadow:0 12px 34px rgba(23,55,43,.07); padding:24px; }
    h2,h3 { color:#17372b; text-transform:none; letter-spacing:0; }
    h2 { border-bottom:0; padding-bottom:0; }
    h3 { color:#245d47; }
    label { color:#3c5b4e; text-transform:none; letter-spacing:0; font-size:13px; }
    .muted,.hint { color:#687e73; }
    input[type=text], input[type=email], input[type=number], textarea, select, .rich-editor {
      background:#fbfdfc; color:#17372b; border:1.5px solid #cfe0d7; border-radius:12px; padding:11px 12px; }
    input::placeholder, textarea::placeholder { color:#91a298; }
    input:focus, textarea:focus, select:focus, .rich-editor:focus { border-color:#00AD67; box-shadow:0 0 0 4px rgba(0,173,103,.10); }
    button,.btn { clip-path:none; border-radius:12px; text-transform:none; letter-spacing:0; padding:10px 18px; box-shadow:none; }
    button:hover,.btn:hover { box-shadow:0 8px 20px rgba(0,173,103,.16); }

// ---------------------------------------------------------------------------
// Server calls — with loading state, a "still working" notice, and a hard
// button-disable so a slow Apps Script response never looks like a silent freeze.
// ---------------------------------------------------------------------------
var inFlightCount = 0;

function callServer(fnName, args, onOk, onErr, opts) {
  opts = opts || {};
  var btn = opts.button || null;
  var btnOriginalText = btn ? btn.innerHTML : null;
  var slowTimer = null;
  var infoBox = null;
  var done = false;

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving…';
  }
  inFlightCount++;

  if (!opts.quiet) {
    slowTimer = setTimeout(function () {
      if (done) return;
      infoBox = showInfo('Still working — this can take a few extra seconds, especially the first time. Please don\'t close this tab.');
    }, 6000);
  }

  function cleanup() {
    done = true;
    inFlightCount = Math.max(0, inFlightCount - 1);
    if (slowTimer) clearTimeout(slowTimer);
    if (infoBox && infoBox.parentNode) infoBox.parentNode.removeChild(infoBox);
    if (btn) { btn.disabled = false; btn.innerHTML = btnOriginalText; }
  }

  try {
    google.script.run
      .withSuccessHandler(function (res) { cleanup(); try { onOk(res); } catch (e) { reportClientError(e, fnName + ' success handler'); } })
      .withFailureHandler(function (err) {
        cleanup();
        var msg = err && err.message ? err.message : String(err);
        if (onErr) onErr(msg); else showError(msg);
      })[fnName].apply(null, args);
  } catch (e) {
    cleanup();
    reportClientError(e, fnName + ' (call setup)');
  }
}

function reportClientError(e, where) {
  console.error('Client error in ' + where + ':', e);
  var detail = (e && e.message) ? e.message : (e ? String(e) : 'unknown error');
  showError('Something went wrong (' + where + '): ' + detail + '. Try again — if it keeps happening, tell your teacher this exact message.');
}

// Any uncaught client-side exception becomes a visible message instead of a silent stall.
window.onerror = function (message, source, lineno, colno, error) {
  reportClientError(error || message, 'page');
  return false;
};
window.addEventListener('unhandledrejection', function (event) {
  reportClientError(event.reason, 'async operation');
});

// ---------------------------------------------------------------------------
// Paste blocking — this is a STUDENT writing safeguard only.
// Teachers/admins can paste normally everywhere in their portals (Canvas
// connection, roster, grading feedback, settings, etc.). Student fields remain
// paste-blocked unless a field is explicitly marked data-paste-ok="1".
// ---------------------------------------------------------------------------
function pasteAllowedForTarget(t) {
  if (!t) return false;
  if (t.getAttribute && t.getAttribute('data-paste-ok') === '1') return true;
  if (typeof platform !== 'undefined' && platform &&
      (platform.mode === 'teacher' || platform.mode === 'admin')) return true;
  return false;
}

document.addEventListener('paste', function (e) {
  var t = e.target;
  if (!t || (t.tagName !== 'TEXTAREA' && t.tagName !== 'INPUT')) return;
  if (pasteAllowedForTarget(t)) return;
  e.preventDefault();
  flashPasteBlocked(t);
}, true);
// Dragging highlighted text into a field is another way to paste — block that
// only in protected student-response fields as well.
document.addEventListener('drop', function (e) {
  var t = e.target;
  if (!t || (t.tagName !== 'TEXTAREA' && t.tagName !== 'INPUT')) return;
  if (pasteAllowedForTarget(t)) return;
  e.preventDefault();
  flashPasteBlocked(t);
}, true);

function flashPasteBlocked(el) {
  el.classList.add('paste-blocked');
  clearTimeout(el._pasteFlashTimer);
  el._pasteFlashTimer = setTimeout(function () { el.classList.remove('paste-blocked'); }, 700);

  if (!el.parentNode) return;
  var existing = el.nextSibling;
  if (!(existing && existing.classList && existing.classList.contains('paste-note'))) {
    var note = document.createElement('div');
    note.className = 'paste-note';
    note.textContent = 'Pasting is turned off here — please type your response in your own words.';
    el.parentNode.insertBefore(note, el.nextSibling);
    existing = note;
  }
  clearTimeout(existing._pasteNoteTimer);
  existing._pasteNoteTimer = setTimeout(function () {
    if (existing.parentNode) existing.parentNode.removeChild(existing);
  }, 4500);
}

function showBanner(msg, cls) {
  var app = $('app');
  var div = document.createElement('div');
  div.className = 'msg ' + cls;
  var text = document.createElement('span');
  text.textContent = msg;
  div.appendChild(text);
  var close = document.createElement('span');
  close.className = 'msg-close';
  close.textContent = '✕';
  close.onclick = function () { if (div.parentNode) div.parentNode.removeChild(div); };
  div.appendChild(close);
  app.prepend(div);
  window.scrollTo(0, 0);
  return div;
}
function showError(msg) { return showBanner(msg, 'error'); }
function showInfo(msg) { return showBanner(msg, 'info'); }

// ---------------------------------------------------------------------------
// Rich-text highlighting for Journal / Hybrid free-write boxes. Students select a
// passage of their own writing and click a strategy tag to wrap just that
// selection in a colored <mark> (shown as a coloured underline since 2026-10-27b).
// ---------------------------------------------------------------------------
var RICH_EDITOR_ALLOWED_TAGS = { MARK: 1, BR: 1, DIV: 1, SPAN: 1, B: 1, I: 1, U: 1 };

// Strips any element the editor doesn't itself produce (defense against a student typing raw
// HTML like <img onerror=...> directly into a contenteditable box) while keeping the text/marks
// that matter. Unwraps disallowed elements instead of deleting them outright, so no writing is lost.
function sanitizeEditorHtml(html) {
  var tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  sanitizeNode_(tmp);
  try { if (tmp.querySelector('mark')) lcHlTidy_(tmp); } catch (e) {}
  return tmp.innerHTML;
}
function sanitizeNode_(node) {
  var child = node.firstChild;
  while (child) {
    var next = child.nextSibling; // capture before this child might get moved/removed below
    if (child.nodeType === 1) {
      if (!RICH_EDITOR_ALLOWED_TAGS[child.tagName]) {
        var firstPromoted = child.firstChild;
        while (child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        next = firstPromoted || next; // re-scan whatever just got promoted up a level
      } else {
        var keepClass = child.getAttribute('class');
        var keepTag = child.getAttribute('data-tag');
        // A journal picture sits in the writing as an empty <div data-jp="file id"> (JournalPictures.html).
        var keepJp = child.tagName === 'DIV' && !String(child.textContent || '').trim() && !child.querySelector('*') ? child.getAttribute('data-jp') : null;
        Array.prototype.slice.call(child.attributes).forEach(function (attr) { child.removeAttribute(attr.name); });
        if (keepJp && /^[A-Za-z0-9_-]{6,128}$/.test(keepJp)) { child.setAttribute('data-jp', keepJp); child.textContent = ''; }
        if (child.tagName === 'MARK' && keepClass && /^hl-[a-zA-Z0-9_]+$/.test(keepClass)) child.setAttribute('class', keepClass);
        if (child.tagName === 'MARK' && keepTag) child.setAttribute('data-tag', keepTag);
        sanitizeNode_(child);
      }
    } else if (child.nodeType !== 3) {
      node.removeChild(child); // drop comments and anything else that isn't text or an element
    }
    child = next;
  }
}

// Saved data from before this feature existed is a plain JS string (from a <textarea>.value), not
// real HTML — setting that directly as innerHTML would misparse any '<' or '&' the student typed.
// Detect which kind we have by looking specifically for tags THIS editor produces (mark/br/div/
// etc.) rather than any '<...>' pattern — a plain-text entry that happens to contain something
// like "<weird>" as literal words should still be escaped, not misread as markup.
function looksLikeRichEditorHtml(s) {
  return /<(mark|br|div|span|b|i|u)[\s>/]/i.test(s || '');
}
function toSafeEditorHtml(raw) {
  if (!raw) return '';
  if (looksLikeRichEditorHtml(raw)) return sanitizeEditorHtml(raw);
  return esc(raw).replace(/\n/g, '<br>');
}

function stripHtmlToText(html) {
  if (!html) return '';
  var tmp = document.createElement('div');
  tmp.innerHTML = toSafeEditorHtml(html);
  return tmp.textContent || '';
}

function computeTagsFromHtml(html) {
  if (!html) return [];
  var tmp = document.createElement('div');
  tmp.innerHTML = toSafeEditorHtml(html);
  var marks = tmp.querySelectorAll('mark[data-tag]');
  var seen = {}, out = [];
  Array.prototype.forEach.call(marks, function (m) {
    var tag = m.getAttribute('data-tag');
    if (tag && !seen[tag]) { seen[tag] = true; out.push(tag); }
  });
  return out;
}

function unwrapEl(el) {
  var parent = el.parentNode;
  if (!parent) return;
  while (el.firstChild) parent.insertBefore(el.firstChild, el);
  parent.removeChild(el);
  parent.normalize();
}

// 2026-10-27b: highlighting works word by word. The old version wrapped the selection in ONE <mark>;
// a selection across lines then put whole lines inside the mark, which colours nothing but leaves thin
// coloured bars above and below the writing and splits the first word onto its own line ("P" / "g.").
// Now every piece of text in the selection gets its own mark inside its own line, and highlighting over
// an existing highlight replaces its colour for just that part.
function lcHlIsHl_(n) { return !!(n && n.nodeType === 1 && n.tagName === 'MARK' && (n.hasAttribute('data-tag') || /(^|\s)hl-/.test(n.className || ''))); }
function lcHlOuter_(n, container) { var p = n.parentNode; while (p && p !== container) { if (lcHlIsHl_(p)) return p; p = p.parentNode; } return null; }
function lcHlSkip_(n, container) { // text inside a picture card or anything not editable is never wrapped
  var p = n.parentNode; while (p && p !== container) { if (p.nodeType === 1 && (p.hasAttribute('data-jp') || p.getAttribute('contenteditable') === 'false')) return true; p = p.parentNode; } return false;
}
var LC_HL_BLOCK = { DIV: 1, P: 1, LI: 1, UL: 1, OL: 1, BLOCKQUOTE: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1 };
// Wrap each selected piece of text in its own element made by make(); returns the new elements.
function lcHlWrapRange_(container, range, make) {
  var root = range.commonAncestorContainer; if (root.nodeType === 3) root = root.parentNode;
  var w = document.createTreeWalker(root, 4, null), n, jobs = [];
  while ((n = w.nextNode())) {
    if (!range.intersectsNode(n) || !container.contains(n) || lcHlSkip_(n, container)) continue;
    var s = n === range.startContainer ? range.startOffset : 0, e = n === range.endContainer ? range.endOffset : n.nodeValue.length;
    if (e > s) jobs.push([n, s, e]);
  }
  var made = [];
  jobs.forEach(function (j) {
    var t = j[0];
    if (j[2] < t.nodeValue.length) t.splitText(j[2]);
    if (j[1] > 0) t = t.splitText(j[1]);
    if (!t.nodeValue.replace(/[\s\u200b\u00a0]+/g, '')) return; // don't colour bare spaces / line breaks
    var el = make(); t.parentNode.insertBefore(el, t); el.appendChild(t); made.push(el);
  });
  return made;
}
// Take el out of any highlight around it, splitting that highlight so the parts before/after keep their colour.
function lcHlLift_(el, container) {
  var o;
  while ((o = lcHlOuter_(el, container))) {
    var r = document.createRange();
    r.setStartBefore(o); r.setEndBefore(el); o.parentNode.insertBefore(r.extractContents(), o);
    r = document.createRange(); r.setStartAfter(el); r.setEndAfter(o); o.parentNode.insertBefore(r.extractContents(), o.nextSibling);
    unwrapEl(o);
  }
}
// Repairs and tidies the highlights in an editor (or a loose element holding saved writing):
// a highlight holding whole lines (the old bug) becomes word-level highlights again and the split lines
// at its edges are joined back up; empty highlights (the thin bars) go; touching same-colour ones merge.
function lcHlTidy_(box) {
  var marks = Array.prototype.slice.call(box.querySelectorAll('mark')).filter(lcHlIsHl_);
  marks.forEach(function (m) {
    if (!m.parentNode) return;
    var hasBlock = false; Array.prototype.forEach.call(m.childNodes, function (c) { if (c.nodeType === 1 && (LC_HL_BLOCK[c.tagName] || c.querySelector('div,p,li,[data-jp]') || c.hasAttribute('data-jp'))) hasBlock = true; });
    if (!hasBlock) return;
    var cls = m.className, tag = m.getAttribute('data-tag');
    var first = m.firstChild, last = m.lastChild, prev = m.previousSibling, next = m.nextSibling;
    // join the line the selection started in with the piece of it that was pulled into the mark (same at the end)
    var join = function (a, b, atEnd) { // a stays, b's contents move into a
      if (!a || !b || a.nodeType !== 1 || b.nodeType !== 1 || !LC_HL_BLOCK[a.tagName] || !LC_HL_BLOCK[b.tagName] || a.hasAttribute('data-jp') || b.hasAttribute('data-jp')) return false;
      if (atEnd) { while (b.firstChild) a.appendChild(b.firstChild); } else { while (b.lastChild) a.insertBefore(b.lastChild, a.firstChild); }
      return true;
    };
    var r = document.createRange(); r.selectNodeContents(m);
    var made = lcHlWrapRange_(m, r, function () { var x = document.createElement('mark'); x.className = cls; if (tag) x.setAttribute('data-tag', tag); return x; });
    made.forEach(function (x) { lcHlLift_(x, m); });
    if (join(prev, first, true)) { first.parentNode && first.parentNode.removeChild(first); }
    if (join(next, last === first ? null : last, false)) { last.parentNode && last.parentNode.removeChild(last); }
    unwrapEl(m);
  });
  Array.prototype.slice.call(box.querySelectorAll('mark')).filter(lcHlIsHl_).forEach(function (m) {
    if (m.parentNode && !String(m.textContent || '').replace(/[\s\u200b\u00a0]+/g, '') && !m.querySelector('[data-jp]')) unwrapEl(m);
  });
  Array.prototype.slice.call(box.querySelectorAll('mark')).filter(lcHlIsHl_).forEach(function (m) {
    var n = m.nextSibling;
    if (n && lcHlIsHl_(n) && n.className === m.className && n.getAttribute('data-tag') === m.getAttribute('data-tag')) { while (m.firstChild) n.insertBefore(m.firstChild, n.firstChild); m.parentNode.removeChild(m); }
  });
}
function lcHlChanged_(container) {
  try { lcHlTidy_(container); } catch (e) {}
  try { container.normalize(); } catch (e) {}
  if (state.view === 'week_strategies' && prepFlowStage(state.week) === 'workspace') scheduleFocusedAutosave(state.week);
}

function applyHighlight(editorId, key) {
  var container = $(editorId);
  var sel = window.getSelection();
  if (!container || !sel.rangeCount || sel.isCollapsed) {
    showError('Select some text in your entry first, then click a strategy to underline it.');
    return;
  }
  var range = sel.getRangeAt(0);
  if (!container.contains(range.commonAncestorContainer)) {
    showError('Select text inside your entry first.');
    return;
  }
  var made = lcHlWrapRange_(container, range.cloneRange(), function () {
    var mark = document.createElement('mark'); mark.className = 'hl-' + key; mark.setAttribute('data-tag', key); return mark;
  });
  if (!made.length) { showError('Select some words in your entry first, then click a strategy to underline them.'); return; }
  made.forEach(function (m) { lcHlLift_(m, container); });
  sel.removeAllRanges();
  lcHlChanged_(container);
}

function removeHighlightInSelection(editorId) {
  var container = $(editorId);
  var sel = window.getSelection();
  if (!container || !sel.rangeCount) return;
  var range = sel.getRangeAt(0);
  if (!container.contains(range.commonAncestorContainer)) return;
  if (sel.isCollapsed) { // just the cursor: take off the highlight it is in
    var m = range.startContainer; m = m.nodeType === 3 ? lcHlOuter_(m, container) : (lcHlIsHl_(m) ? m : lcHlOuter_(m, container));
    if (m) unwrapEl(m);
  } else { // only the selected words lose their colour
    var made = lcHlWrapRange_(container, range.cloneRange(), function () { var x = document.createElement('span'); x.setAttribute('data-lc-unhl', '1'); return x; });
    made.forEach(function (x) { lcHlLift_(x, container); unwrapEl(x); });
  }
  sel.removeAllRanges();
  lcHlChanged_(container);
}

function renderHighlightToolbar(editorId) {
  // onmousedown="event.preventDefault()" is the actual fix here: without it, the browser collapses
  // the student's text selection the instant they mousedown on a pill (before the click/onclick
  // handler ever runs) — so applyHighlight always saw an empty selection and highlighting looked
  // completely broken, even though the highlighting logic itself was fine.
  var pills = STRATEGY_KEYS.map(function (k) {
    return '<div class="pill hl-pill ' + 'hl-' + k + '" onmousedown="event.preventDefault()" onclick="applyHighlight(\'' + editorId + '\',\'' + k + '\')">' + STRATEGY_DEFS[k].label + '</div>';
  }).join('');
  return '<p class="hint" style="margin-top:12px;">Select some text above, then click a strategy to underline it in that color (optional):</p>' +
    '<div class="pill-row">' + pills +
    '<div class="pill hl-pill" style="background:transparent;border-color:var(--error);color:var(--error);" onmousedown="event.preventDefault()" onclick="removeHighlightInSelection(\'' + editorId + '\')">✕ Remove underline</div>' +
    '</div>';
}

function renderPrepForm(wk, d) {
  if (!d.prepType) return '<p class="muted">Pick an option above to begin.</p>';
  if (d.prepType === 'journal') {
    return '<div class="strategy-block">' +
      '<p class="muted">Write a journal that shows how you\'re using reading strategies while you read. Your goal is a journal (at least one page) that will guide your five-minute Lit Circle discussion. Jot down ideas, questions, passages you don\'t understand, connections, quick research, sketches — whatever helps you think out loud. This is a journal, not an essay, so be creative! Your journal will be assessed on your use of strategies, depth of insight, and how well it prepares you for your discussion.</p>' +
      '<p class="hint reminder">📌 Remember to: reference page numbers for what you\'re writing about, and explain how it helped you understand the book better — right in your entry below.</p>' +
      '<div id="journalText" class="rich-editor" contenteditable="true" data-placeholder="Start writing..." style="min-height:220px;">' + toSafeEditorHtml(d.data.journalText || '') + '</div>' +
      renderHighlightToolbar('journalText') +
      '</div>';
  }
  // Hybrid no longer has students click to pick 3 named strategies — instead they get 3 fixed
  // "moment" boxes and write a paragraph in each, then use the underline tool to mark which parts
  // of their own paragraph show which strategy (a single paragraph can show more than one).
  if (d.prepType === 'hybrid') {
    var moments = d.data.hybridMoments || ['', '', ''];
    var intro = '<div class="strategy-block"><p class="muted">Reading strategies aren\'t meant to stand alone — one naturally leads to another. Think of 3 moments from this week\'s reading where you noticed yourself using more than one strategy at once (a connection might spark a prediction; a striking passage might raise a question). For each moment, write a paragraph about what happened and what you noticed. Then use the highlight tool under each box to mark the sentences that show each strategy, in that strategy\'s color — the same paragraph can show more than one strategy.</p></div>';
    var boxes = [0, 1, 2].map(function (i) {
      return '<div class="strategy-block"><label style="margin-top:0;">Moment #' + (i + 1) + '</label>' +
        '<p class="hint reminder">📌 Remember to: reference the page number, and underline the sentences that show each strategy you used.</p>' +
        '<div id="hybridMoment' + i + '" class="rich-editor" contenteditable="true" data-placeholder="Write about this moment..." style="min-height:130px;">' + toSafeEditorHtml(moments[i] || '') + '</div>' +
        renderHighlightToolbar('hybridMoment' + i) +
        '</div>';
    }).join('');
    return intro + boxes;
  }

  var limit = 2;
  var picker = '<div class="pill-row">' + STRATEGY_KEYS.map(function (k) {
    var sel = d.choices.indexOf(k) !== -1;
    return '<div class="pill' + (sel ? ' selected' : '') + '" onclick="toggleStrategyChoice(' + wk + ',\'' + k + '\',' + limit + ')">' + STRATEGY_DEFS[k].label + '</div>';
  }).join('') + '</div>' +
  '<p class="hint">Pick exactly ' + limit + '. Selected: ' + d.choices.length + '/' + limit + '</p>';

  var forms = d.choices.map(function (k) { return renderStrategySubForm(k, d.data[k] || {}); }).join('');
  return picker + forms;
}

// Reads whatever is currently on screen back into the draft before a pill-toggle forces a
// re-render of the whole prep form — otherwise re-rendering would reset every field to
// whatever was last saved into `d.data`, silently discarding anything typed since then.
function syncVisibleFieldsIntoDraft(wk) {
  var d = draft['week' + wk];
  if (!d || !d.prepType) return;
  if (d.prepType === 'journal') {
    var je = $('journalText');
    if (je) d.data.journalText = je.innerHTML;
    return;
  }
  if (d.prepType === 'hybrid') {
    if (!d.data.hybridMoments) d.data.hybridMoments = ['', '', ''];
    for (var i = 0; i < 3; i++) {
      var me = $('hybridMoment' + i);
      if (me) d.data.hybridMoments[i] = me.innerHTML;
    }
    return;
  }
  d.choices.forEach(function (k) { d.data[k] = collectStrategyData(k); });
}

function toggleStrategyChoice(wk, key, limit) {
  var d = draft['week' + wk];
  syncVisibleFieldsIntoDraft(wk); // preserve anything already typed into the strategies staying selected
  var idx = d.choices.indexOf(key);
  if (idx !== -1) { d.choices.splice(idx, 1); }
  else {
    if (d.choices.length >= limit) { showError('You can only pick ' + limit + '. Remove one first.'); return; }
    d.choices.push(key);
  }
  $('prepFormArea').innerHTML = renderPrepForm(wk, d);
}

function renderStrategySubForm(key, existingData) {
  var def = STRATEGY_DEFS[key];
  var html = '<div class="strategy-block"><h3 style="margin-top:0;">' + def.label + '</h3><p class="muted">' + esc(def.blurb) + '</p>';
  if (def.reminder) html += '<p class="hint reminder">📌 ' + esc(def.reminder) + '</p>';
  if (def.example) html += '<p class="hint example">💡 <strong>Example:</strong> ' + esc(def.example.replace(/^Example:\s*/, '')) + '</p>';
  if (def.starters && def.starters.length) {
    html += '<p class="hint" style="margin-bottom:2px;">Need a way to start? Try one of these:</p>' +
      '<div class="starter-row">' + def.starters.map(function (s) { return '<span class="starter-pill">' + esc(s) + '</span>'; }).join('') + '</div>';
  }

  if (def.repeat) {
    var items = existingData.items || [];
    for (var i = 0; i < def.repeat; i++) {
      var item = items[i] || {};
      html += '<div class="repeat-item"><strong>#' + (i+1) + '</strong>';
      def.fields.forEach(function (f) {
        html += '<label>' + f.label + '</label>' + fieldInput(key + '__item' + i + '__' + f.key, f.type, item[f.key] || '', f.pasteAllowed);
      });
      html += '</div>';
    }
  } else if (def.fixedRows) {
    def.fixedRows.forEach(function (rowLabel, i) {
      var item = (existingData.items || [])[i] || {};
      html += '<div class="repeat-item"><strong>' + rowLabel + '</strong>';
      def.fields.forEach(function (f) {
        html += '<label>' + f.label + '</label>' + fieldInput(key + '__row' + i + '__' + f.key, f.type, item[f.key] || '', f.pasteAllowed);
      });
      html += '</div>';
    });
  } else {
    def.fields.forEach(function (f) {
      html += '<label>' + f.label + '</label>' + fieldInput(key + '__' + f.key, f.type, existingData[f.key] || '', f.pasteAllowed);
    });
    if (def.image) {
      html += '<label>Optional: upload a photo or drawing to go with this</label><input type="file" accept="image/*" id="' + key + '__imageFile">' +
        (existingData.imageUrl ? '<p class="hint">Current: <a href="' + esc(existingData.imageUrl) + '" target="_blank">view uploaded image</a></p>' : '');
    }
  }

  html += '</div>';
  return html;
}

function fieldInput(id, type, value, pasteAllowed) {
  var pasteAttr = pasteAllowed ? ' data-paste-ok="1"' : '';
  if (type === 'textarea') return '<textarea id="f_' + id + '"' + pasteAttr + '>' + esc(value) + '</textarea>';
  return '<input type="text" id="f_' + id + '" value="' + esc(value) + '"' + pasteAttr + '>';
}

function collectStrategyData(key) {
  var def = STRATEGY_DEFS[key];
  var out = {};
  if (def.repeat || def.fixedRows) {
    var count = def.repeat || def.fixedRows.length;
    var items = [];
    for (var i = 0; i < count; i++) {
      var prefix = def.repeat ? 'item' + i : 'row' + i;
      var item = {};
      def.fields.forEach(function (f) {
        var el = $('f_' + key + '__' + prefix + '__' + f.key);
        item[f.key] = el ? el.value : '';
      });
      items.push(item);
    }
    out.items = items;
  } else {
    def.fields.forEach(function (f) {
      var el = $('f_' + key + '__' + f.key);
      out[f.key] = el ? el.value : '';
    });
  }
  return out;
}

// Reads whatever is currently in the on-screen form fields for this week's prep — used by both
// "Save Prep" and "Get AI Feedback" so the two never fall out of sync with each other.
function collectCurrentPrepData(d) {
  if (d.prepType === 'journal') {
    var journalEl = $('journalText');
    var journalHtml = journalEl ? journalEl.innerHTML : (d.data.journalText || '');
    return {
      prepType: 'journal', choices: ['journal'],
      data: { journalText: journalHtml, journalTags: computeTagsFromHtml(journalHtml) }
    };
  }
  if (d.prepType === 'hybrid') {
    var moments = [0, 1, 2].map(function (i) {
      var me = $('hybridMoment' + i);
      return me ? me.innerHTML : ((d.data.hybridMoments && d.data.hybridMoments[i]) || '');
    });
    return {
      prepType: 'hybrid', choices: [],
      data: {
        hybridMoments: moments,
        hybridTags: moments.map(function (m) { return computeTagsFromHtml(m); })
      }
    };
  }

  var limit = 2;
  if (d.choices.length !== limit) { return { error: 'Please select exactly ' + limit + ' strategies.' }; }
  var newData = {};
  d.choices.forEach(function (k) { newData[k] = collectStrategyData(k); });
  return { prepType: d.prepType, choices: d.choices.slice(), data: newData };
}

// Turns collected prep data into a short, readable plain-text summary to send to the AI —
// keeps STRATEGY_DEFS knowledge on the client so Code.gs doesn't need to know strategy shapes.
function tagLabels(keys) {
  return (keys || []).map(function (k) { return STRATEGY_DEFS[k] ? STRATEGY_DEFS[k].label : k; }).join(', ');
}

function buildPrepSummaryText(g) {
  if (g.prepType === 'journal') {
    var tags = tagLabels(g.data.journalTags);
    return 'Journal entry:\n' + (stripHtmlToText(g.data.journalText) || '(nothing written yet)') +
      (tags ? '\n\n(Underlined as: ' + tags + ')' : '');
  }
  if (g.prepType === 'hybrid') {
    var moments = g.data.hybridMoments || [];
    var momentTags = g.data.hybridTags || [];
    var hLines = ['Hybrid Reading Strategy — 3 integrated moments:', ''];
    moments.forEach(function (m, i) {
      hLines.push('Moment #' + (i + 1) + ': ' + (stripHtmlToText(m) || '(nothing written yet)'));
      var tagsForMoment = tagLabels(momentTags[i]);
      if (tagsForMoment) hLines.push('(Underlined as: ' + tagsForMoment + ')');
      hLines.push('');
    });
    return hLines.join('\n');
  }
  var lines = [];
  g.choices.forEach(function (k) {
    var def = STRATEGY_DEFS[k];
    var val = g.data[k] || {};
    lines.push(def.label + ':');
    if (def.repeat || def.fixedRows) {
      var items = val.items || [];
      items.forEach(function (item, i) {
        var filledIn = def.fields.some(function (f) { return (item[f.key] || '').trim(); });
        if (!filledIn) return; // skip rows the student hasn't touched — keeps the AI prompt focused
        var rowLabel = def.fixedRows ? def.fixedRows[i] : ('#' + (i + 1));
        var parts = def.fields.map(function (f) { return f.label + ': ' + (item[f.key] || '(blank)'); });
        lines.push('- ' + rowLabel + ' — ' + parts.join(' | '));
      });
    } else {
      def.fields.forEach(function (f) {
        lines.push('- ' + f.label + ': ' + (val[f.key] || '(blank)'));
      });
    }
    lines.push('');
  });
  return lines.join('\n');
}

function prepLabelFor(g) {
  if (g.prepType === 'journal') return 'Journal Entry';
  if (g.prepType === 'hybrid') return 'Hybrid Reading Strategy (3 Integrated Moments)';
  var names = g.choices.map(function (k) { return STRATEGY_DEFS[k].label; }).join(', ');
  return '2 Reading Strategies (' + names + ')';
}

function doGetAIFeedback(wk) {
  var d = draft['week' + wk];
  if (!d || !d.prepType) { showError('Choose a prep type and fill it in first.'); return; }

  var gathered = collectCurrentPrepData(d);
  if (gathered.error) { showError(gathered.error); return; }

  var summary = buildPrepSummaryText(gathered);
  var resultBox = $('aiFeedbackResult');
  if (resultBox) resultBox.innerHTML = '';

  callServer('getAIFeedback',
    [state.group.bookTitle, state.group.weekReading[wk - 1] || '', prepLabelFor(gathered), summary],
    function (feedbackText) {
      if (resultBox) {
        resultBox.innerHTML = '<div class="msg info" style="margin-top:10px;"><strong>🤖 AI Feedback:</strong><br>' + esc(feedbackText).replace(/\n/g, '<br>') + '</div>';
      }
    }, null, { button: $('aiFeedbackBtn') });
}

function doSavePrep(wk) {
  var d = draft['week' + wk];
  if (!d.prepType) { showError('Choose a prep type first.'); return; }

  var gathered = collectCurrentPrepData(d);
  if (gathered.error) { showError(gathered.error); return; }
  d.choices = gathered.choices;
  var existingDiscussionPlan = discussionPlanFor(wk) || (d.data && d.data.discussionPlan);
  d.data = gathered.data;
  if (existingDiscussionPlan) d.data.discussionPlan = existingDiscussionPlan;

  // Handle optional illustrator image upload, if present and a file was chosen
  var illustratorKey = 'illustrator';
  var fileInput = d.choices && d.choices.indexOf(illustratorKey) !== -1 ? $('f_' + illustratorKey + '__imageFile') : null;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    var reader = new FileReader();
    reader.onload = function () {
      var base64 = reader.result.split(',')[1];
      callServer('saveIllustration', [base64, fileInput.files[0].type, fileInput.files[0].name], function (url) {
        d.data.illustrator.imageUrl = url;
        finishSavePrep(wk, d);
      }, null, { button: $('savePrepBtn') });
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    finishSavePrep(wk, d);
  }
}

function finishSavePrep(wk, d) {
  callServer('saveWeeklyWork', [state.email, wk, d.prepType, d.choices, d.data], function () {
    state.weeklyWork[wk] = { prepType: d.prepType, choices: d.choices, data: d.data, updatedAt: new Date().toString() };
    var msg = $('prepSavedMsg');
    if (msg) msg.textContent = '✓ Saved';
  }, null, { button: $('savePrepBtn') });
}

// ---------------- Peer assessment ----------------

function renderPeerAssessmentSection(wk) {
  var mates = getGroupmatesLocal();
  if (!mates.length) return '<p class="muted">Add teammates in your group setup to give peer feedback.</p>';

  return mates.map(function (mate) {
    var already = state.peerAssessmentsGiven.some(function (p) { return p.week === wk && p.assessedEmail === mate.toLowerCase(); });
    return '<div class="teammate-card">' +
      '<strong>' + esc(mate) + '</strong> ' + (already ? '<span class="badge done">Submitted</span>' : '<span class="badge pending">Not yet</span>') +
      '<div id="peerFormArea_' + safeId(mate) + '">' +
      (already ? '<p class="muted" style="margin-top:8px;">You can submit again if you\'d like to update your feedback.</p>' : '') +
      '<button class="secondary" style="margin-top:8px;" onclick="openPeerForm(' + wk + ',\'' + mate + '\')">' + (already ? 'Submit again' : 'Give feedback') + '</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

function safeId(email) { return email.replace(/[^a-zA-Z0-9]/g, '_'); }

function openPeerForm(wk, mate) {
  var area = $('peerFormArea_' + safeId(mate));
  area.innerHTML = renderPeerForm(wk, mate);
}

// Matches the actual "Peer Review - Lit Circles" rubric: each of the 3 criteria gets its own
// rating scale AND its own comment box, rather than one shared comment at the end.
// descriptions come verbatim from the teacher's Peer Review - Lit Circles rubric, so students
// can see exactly what earns a 5 vs a 4/3/1 for each criterion before they pick a rating.
var PEER_CRITERIA = [
  { key: 'participation', label: 'Participation', descriptions: {
      '5': 'Student is fully prepared with their book and reading strategies completed.',
      '4': 'Student is mostly prepared with their book and reading strategies completed.',
      '3': 'Student is partially prepared with their book and reading strategies completed.',
      '1': 'Incomplete.'
    } },
  { key: 'leadership', label: 'Leadership', descriptions: {
      '5': 'Student effectively leads a five-minute discussion, engaging all group members and facilitating a deeper understanding of the book.',
      '4': 'Student mostly leads the discussion, involving most group members and facilitating some understanding of the book.',
      '3': 'Student partially leads a discussion, involving some group members but not facilitating a significant understanding of the book.',
      '1': 'Incomplete.'
    } },
  { key: 'activeEngagement', label: 'Active Engagement', descriptions: {
      '5': 'Student is actively engaged throughout the conversation, consistently contributing to the depth of knowledge for their group.',
      '4': 'Student is mostly engaged throughout the conversation, frequently contributing to the depth of knowledge for their group.',
      '3': 'Student is partially engaged throughout the conversation, sometimes contributing to the depth of knowledge for their group.',
      '1': 'Incomplete.'
    } }
];

var PEER_MAX_TOTAL = PEER_CRITERIA.length * 5;

// In-progress ratings/comments for a given (week, teammate) pair. Scoped per pair — rather than
// one shared object for whichever teammate's form happens to be open — so switching between
// grading multiple teammates (or any unrelated re-render) can never mix up or silently reset
// selections. Mirrors the draft['week'+wk] pattern already used for strategy prep.
function peerDraftKey(wk, mate) { return 'peer' + wk + '_' + safeId(mate); }
function getPeerDraft(wk, mate) {
  var key = peerDraftKey(wk, mate);
  return draft[key] || (draft[key] = { ratings: {}, comments: {} });
}

function peerTotal(d) {
  return PEER_CRITERIA.reduce(function (sum, c) { return sum + (Number(d.ratings[c.key]) || 0); }, 0);
}

function renderPeerForm(wk, mate) {
  var d = getPeerDraft(wk, mate);
  var idSuffix = safeId(mate);

  function ratingCards(name, descriptions) {
    return '<div class="peer-rating-grid" id="pr_' + idSuffix + '_' + name + '">' + POINTS_OPTIONS.map(function (o) {
      var sel = d.ratings[name] === o.v;
      return '<button type="button" class="peer-rating-card' + (sel ? ' selected' : '') + '" data-val="' + o.v + '" onclick="selectRating(' + wk + ',\'' + mate + '\',\'' + name + '\',\'' + o.v + '\')">' +
        '<span class="peer-rating-score">' + esc(o.v) + '</span>' +
        '<span class="peer-rating-copy"><strong>' + esc(o.label.replace(/^\d+\s*[–-]\s*/,'')) + '</strong><span>' + esc((descriptions && descriptions[o.v]) || '') + '</span></span>' +
        '</button>';
    }).join('') + '</div>';
  }
  var blocks = PEER_CRITERIA.map(function (c) {
    return '<section class="peer-criterion-block">' +
      '<div class="peer-criterion-title">' + esc(c.label) + '</div>' +
      '<div class="peer-criterion-help">Choose the description that best matches what you observed during today’s Literature Circle.</div>' +
      ratingCards(c.key, c.descriptions) +
      '<label class="peer-comment-label">Specific evidence or feedback for ' + esc(c.label) + '</label>' +
      '<textarea id="peerComment_' + idSuffix + '_' + c.key + '" placeholder="What did you actually notice? Be specific and helpful." oninput="syncPeerComment(' + wk + ',\'' + mate + '\',\'' + c.key + '\')">' + esc(d.comments[c.key] || '') + '</textarea>' +
      '</section>';
  }).join('');
  return '' +
    '<div class="peer-rubric-intro"><strong>Use the rubric as you rate.</strong> The score and its description are now one choice. Pick the card that best matches what you observed, then give one specific comment.</div>' +
    '<div style="margin-top:10px;">' +
    blocks +
    '<p class="hint" id="peerTotal_' + idSuffix + '" style="margin-top:10px;">Rubric total: ' + peerTotal(d) + ' / ' + PEER_MAX_TOTAL + '</p>' +
    '<div style="margin-top:10px;"><button id="peerSubmitBtn_' + idSuffix + '" onclick="doSubmitPeer(' + wk + ',\'' + mate + '\')">Submit Feedback</button></div>' +
    '</div>';
}

function selectRating(wk, mate, name, val) {
  var d = getPeerDraft(wk, mate);
  d.ratings[name] = val;
  var idSuffix = safeId(mate);
  var row = $('pr_' + idSuffix + '_' + name);
  if (row) {
    Array.prototype.forEach.call(row.children, function (el) {
      el.className = el.getAttribute('data-val') === val ? 'peer-rating-card selected' : 'peer-rating-card';
    });
  }
  var totalEl = $('peerTotal_' + idSuffix);
  if (totalEl) totalEl.textContent = 'Total: ' + peerTotal(d) + ' / ' + PEER_MAX_TOTAL;
}

function syncPeerComment(wk, mate, key) {
  var d = getPeerDraft(wk, mate);
  var el = $('peerComment_' + safeId(mate) + '_' + key);
  if (el) d.comments[key] = el.value;
}

function doSubmitPeer(wk, mate) {
  var d = getPeerDraft(wk, mate);
  if (!d.ratings.participation || !d.ratings.leadership || !d.ratings.activeEngagement) {
    showError('Please rate all three criteria.'); return;
  }
  var missing = [];
  PEER_CRITERIA.forEach(function (c) {
    var el = $('peerComment_' + safeId(mate) + '_' + c.key);
    var val = el ? el.value.trim() : (d.comments[c.key] || '');
    d.comments[c.key] = val;
    if (!val) missing.push(c.label);
  });
  if (missing.length) { showError('Please add a comment for: ' + missing.join(', ') + '.'); return; }

  var ratings = { participation: d.ratings.participation, leadership: d.ratings.leadership, activeEngagement: d.ratings.activeEngagement };
  var comments = { participation: d.comments.participation, leadership: d.comments.leadership, activeEngagement: d.comments.activeEngagement };

  callServer('submitPeerAssessment', [state.email, mate, wk, ratings, comments], function () {
    // Remove any prior submission for this same (week, mate) before pushing the new one, so
    // re-submitting doesn't leave a stale duplicate entry (and a stale duplicate line in a PDF
    // export) sitting alongside the fresh one.
    state.peerAssessmentsGiven = state.peerAssessmentsGiven.filter(function (p) {
      return !(p.week === wk && p.assessedEmail === mate.toLowerCase());
    });
    state.peerAssessmentsGiven.push({
      week: wk, assessedEmail: mate.toLowerCase(),
      participation: ratings.participation, participationComment: comments.participation,
      leadership: ratings.leadership, leadershipComment: comments.leadership,
      activeEngagement: ratings.activeEngagement, activeEngagementComment: comments.activeEngagement
    });
    delete draft[peerDraftKey(wk, mate)];
    render(true); // redraw the Feedback Loop page in place to show the updated "Submitted" badge
  }, null, { button: $('peerSubmitBtn_' + safeId(mate)) });
}

function openFeedbackInbox(){

}
function peerFeedbackCriterionHtml(label,score,comment){

}
function teacherFeedbackFor(wk){var t=state.teacherFeedback||{};return Array.isArray(t[wk])?t[wk]:(Array.isArray(t[String(wk)])?t[String(wk)]:[]);}
function teacherFeedbackCount(){return [1,2,3,4].reduce(function(n,wk){return n+teacherFeedbackFor(wk).length;},0);}
function teacherFeedbackHtml(items){
  return '<div class="feedback-teacher"><div class="feedback-peer-label">From your teacher</div>'+items.map(function(it){
    var score=it.excused?'Excused':(typeof it.score==='number'?(String(it.score)+' / '+it.max):'');

  }).join('')+'</div>';
}
function viewFeedbackInbox(){
  var total=Object.keys(state.peerFeedbackReceived||{}).reduce(function(n,w){return n+((state.peerFeedbackReceived[w]||[]).length);},0),tTotal=teacherFeedbackCount();
  var cards=[1,2,3,4].map(function(wk){
    var list=(state.peerFeedbackReceived&&state.peerFeedbackReceived[wk])||[],tItems=teacherFeedbackFor(wk);
    if(!list.length&&!tItems.length)return '<section class="feedback-week-card empty"><div class="feedback-week-head"><h3>Week '+wk+'</h3><span class="badge pending">No feedback yet</span></div><p class="muted">Your teacher’s scores and comments appear here once they’re posted to Canvas. Your groupmates’ feedback appears as soon as they submit their peer assessments.</p></section>';
    var responses=list.map(function(fb,i){return '<div class="feedback-response"><div class="feedback-peer-label">Peer response '+(i+1)+'</div>'+peerFeedbackCriterionHtml('Participation',fb.participation,fb.participationComment)+peerFeedbackCriterionHtml('Leadership',fb.leadership,fb.leadershipComment)+peerFeedbackCriterionHtml('Active Engagement',fb.activeEngagement,fb.activeEngagementComment)+'</div>';}).join('');
    var badges=(list.length?'<span class="badge done">'+list.length+' peer response'+(list.length===1?'':'s')+'</span>':'<span class="badge pending">No peer feedback yet</span>');
    return '<section class="feedback-week-card"><div class="feedback-week-head"><h3>Week '+wk+'</h3><span class="feedback-badges">'+badges+'</span></div>'+(tItems.length?teacherFeedbackHtml(tItems):'')+responses+(list.length?'<button class="secondary" style="margin-top:16px" onclick="state.week='+wk+';state.view=\'week_reflection\';saveStudentResumeClient();render();">Use this feedback in my self-assessment →</button>':'')+'</section>';
  }).join('');
  return '<a class="backlink" onclick="goHome()">← Back to my journey</a><section class="feedback-hero"><div class="eyebrow">My Feedback</div><h2>What your teacher and your peers noticed.</h2><p>Your teacher’s scores and comments show here once they’re posted to Canvas, along with what your groupmates said after each discussion. Use them to notice patterns, celebrate strengths, and choose one specific thing to improve.</p></section><div class="feedback-week-grid">'+cards+'</div>'+(total?'<div class="card" style="margin-top:20px"><strong>'+total+' peer feedback response'+(total===1?'':'s')+' received so far.</strong> Your self-assessment pages use this same feedback automatically.</div>':'');
}

function pointsLabel(v) {
  var found = POINTS_OPTIONS.filter(function (o) { return o.v === String(v); })[0];
  return found ? found.label : v;
}

function renderReflectionSection(wk) {
  var isGrowth = (wk === 4);
  var questions = reflectionQuestionsForWeek(wk);
  var goalLabel = isGrowth ? GROWTH_GOAL_LABEL : REFLECTION_GOAL_LABEL;
  var type = isGrowth ? 'growth' : 'weekly';

  var existing = state.reflections[wk];
  var d = draft['reflect' + wk] || (draft['reflect' + wk] = (existing && existing.type === type)
    ? { answers: Object.assign({}, existing.answers), goal: existing.goal || '' }
    : { answers: {}, goal: '' });

  var received = state.peerFeedbackReceived[wk] || [];
  var selfRating = state.selfAssessments && state.selfAssessments[wk]; if (selfRating && selfRating.away) selfRating = null;
  var selfHtml = selfRating ? '<div style="margin-bottom:16px"><label style="margin-top:0">Your discussion-day self-rating</label><div class="self-rating-summary"><span class="self-rating-chip">Participation · '+esc(pointsLabel(selfRating.participation))+'</span><span class="self-rating-chip">Leadership · '+esc(pointsLabel(selfRating.leadership))+'</span><span class="self-rating-chip">Active Engagement · '+esc(pointsLabel(selfRating.activeEngagement))+'</span></div><p class="hint">Compare these ratings with what your peers noticed below. Differences are useful evidence for reflection.</p></div>' : '';
  var receivedHtml;
  if (received.length) {
    var items = received.map(function (fb) {
      return '<div class="teammate-card">' +
        '<div><strong>Participation:</strong> ' + esc(pointsLabel(fb.participation)) + '</div>' +
        '<div class="muted">' + esc(fb.participationComment || '') + '</div>' +
        '<div style="margin-top:8px;"><strong>Leadership:</strong> ' + esc(pointsLabel(fb.leadership)) + '</div>' +
        '<div class="muted">' + esc(fb.leadershipComment || '') + '</div>' +
        '<div style="margin-top:8px;"><strong>Active Engagement:</strong> ' + esc(pointsLabel(fb.activeEngagement)) + '</div>' +
        '<div class="muted">' + esc(fb.activeEngagementComment || '') + '</div>' +
        '</div>';
    }).join('');
    receivedHtml = '<div style="margin-bottom:14px;"><label style="margin-top:0;">Feedback you received this week</label>' + items + '</div>';
  } else {
    receivedHtml = '<p class="hint">No feedback from teammates yet this week — that\'s ok, you can still reflect below and come back later.</p>';
  }

  var qHtml = questions.map(function (q, i) {
    var val = d.answers[q.key] || '';
    var eqClass = q.key === 'essentialQuestionReflection' ? ' class="eq-reflection-label"' : '';
    return '<label' + eqClass + '>' + (i + 1) + '. ' + esc(q.text) + '</label>' +
      '<textarea id="refl_' + wk + '_' + q.key + '">' + esc(val) + '</textarea>';
  }).join('');
  qHtml = '<div class="reflection-eq-callout"><span>Return to the week</span><strong>' + esc(LC_WEEK_ESSENTIAL_QUESTIONS[wk-1]) + '</strong></div>' + qHtml;

  var savedNote = (existing && existing.type === type && existing.updatedAt)
    ? '<p class="hint">Last saved ' + esc(formatDate(existing.updatedAt)) + '.</p>' : '';

  return '' +
    selfHtml +
    receivedHtml +
    qHtml +
    '<label>' + esc(goalLabel) + '</label>' +
    '<textarea id="reflGoal_' + wk + '">' + esc(d.goal) + '</textarea>' +
    savedNote +
    '<div style="margin-top:14px;">' +
    '<button id="saveReflBtn_' + wk + '" onclick="doSaveReflection(' + wk + ')">Save Reflection</button> ' +
    '<span id="reflSavedMsg_' + wk + '" class="muted"></span>' +
    '</div>';
}

function doSaveReflection(wk) {
  var isGrowth = (wk === 4);
  var questions = reflectionQuestionsForWeek(wk);
  var type = isGrowth ? 'growth' : 'weekly';

  var answers = {};
  var missingQs = [];
  questions.forEach(function (q) {
    var el = $('refl_' + wk + '_' + q.key);
    var val = el ? el.value.trim() : '';
    answers[q.key] = val;
    if (!val) missingQs.push(q.key);
  });
  var goalEl = $('reflGoal_' + wk);
  var goal = goalEl ? goalEl.value.trim() : '';

  // Keep whatever the student has typed so far even if they can't save yet.
  draft['reflect' + wk] = { answers: answers, goal: goal };

  if (missingQs.length) { showError('Please answer all the reflection questions before saving.'); return; }
  if (!goal) { showError('Please fill in your goal before saving.'); return; }

  callServer('saveReflection', [state.email, wk, type, answers, goal], function () {
    state.reflections[wk] = { type: type, answers: answers, goal: goal, updatedAt: new Date().toISOString() };
    var msg = $('reflSavedMsg_' + wk);
    if (msg) msg.textContent = 'Saved!';
  }, null, { button: $('saveReflBtn_' + wk) });
}

// ---------------------------------------------------------------------------
// Growth story (personal end-of-unit infographic)
// ---------------------------------------------------------------------------
function averagePeerScores(fbList) {
  if (!fbList || !fbList.length) return null;
  var sums = { participation: 0, leadership: 0, activeEngagement: 0 };
  fbList.forEach(function (fb) {
    sums.participation += Number(fb.participation) || 0;
    sums.leadership += Number(fb.leadership) || 0;
    sums.activeEngagement += Number(fb.activeEngagement) || 0;
  });
  var n = fbList.length;
  return { participation: sums.participation / n, leadership: sums.leadership / n, activeEngagement: sums.activeEngagement / n };
}

function renderScoreBars(avg) {
  function bar(label, val) {
    var pct = Math.max(0, Math.min(100, (val / 5) * 100));
    return '<div class="score-row"><span class="score-label">' + esc(label) + '</span>' +
      '<div class="score-track"><div class="score-fill" style="width:' + pct.toFixed(0) + '%;"></div></div>' +
      '<span class="score-val">' + val.toFixed(1) + '</span></div>';
  }
  return '<div class="score-bars">' +
    bar('Participation', avg.participation) +
    bar('Leadership', avg.leadership) +
    bar('Active Engagement', avg.activeEngagement) +
    '</div>';
}

function viewGrowthStory() {
  var g = state.group;

  var weeksHtml = [1, 2, 3, 4].map(function (wk) {
    var w = state.weeklyWork[wk];
    var refl = state.reflections[wk];
    var isGrowth = (wk === 4);
    var stratLabel = w ? prepLabelFor(w) : 'Not completed yet';

    var highlight = '';
    if (refl) {
      if (isGrowth) highlight = refl.answers.understandingChange || refl.answers.growthOverTime || '';
      else highlight = refl.answers.growthFromFeedback || refl.answers.strengthFromFeedback || '';
    }

    var avg = averagePeerScores(state.peerFeedbackReceived[wk]);

    return '<div class="growth-week">' +
      '<div class="growth-week-label">Week ' + wk + '</div>' +
      '<div class="growth-strat">' + esc(stratLabel) + '</div>' +
      (highlight ? '<div class="growth-quote">“' + esc(highlight) + '”</div>' : '') +
      (avg ? renderScoreBars(avg) : '') +
      (refl && refl.goal ? '<div class="growth-goal">🎯 ' + esc(refl.goal) + '</div>' : '') +
      '</div>';
  }).join('');

  var growthRefl = state.reflections[4];
  var spotlightHtml = '';
  if (growthRefl && growthRefl.type === 'growth') {
    spotlightHtml = '<div class="card"><div class="growth-spotlight">' +
      '<h3 style="margin-top:0;">Your Growth, In Your Own Words</h3>' +
      reflectionQuestionsForWeek(4).map(function (q) {
        return '<p><strong>' + esc(q.text) + '</strong><br>' + esc(growthRefl.answers[q.key] || '(blank)') + '</p>';
      }).join('') +
      '</div></div>';
  } else {
    spotlightHtml = '<div class="card"><p class="hint">Finish your Week 4 Growth Reflection to unlock the "in your own words" spotlight here.</p></div>';
  }

  return '' +
    '<a class="backlink no-print" onclick="goHome()">&larr; Back to overview</a>' +
    '<div class="card">' +
    '<h2>Your Literature Circle Growth Story</h2>' +
    '<p class="muted">' + esc(g.bookTitle) + ' &nbsp;·&nbsp; ' + esc(state.email) + '</p>' +
    '</div>' +
    '<div class="card no-print" style="margin-bottom:16px;"><button onclick="window.print()">🖨️ Print / Save as PDF</button></div>' +
    '<div class="card"><div class="growth-timeline">' + weeksHtml + '</div></div>' +
    spotlightHtml;
}

// PDF export

function buildReflectionBlock(wk) {
  var refl = state.reflections[wk];
  var isGrowth = (wk === 4);
  var questions = reflectionQuestionsForWeek(wk);
  var goalLabel = isGrowth ? GROWTH_GOAL_LABEL : REFLECTION_GOAL_LABEL;
  var heading = isGrowth ? 'Growth Self Assessment' : 'Self Assessment';

  var lines = [];
  var selfRating = state.selfAssessments && state.selfAssessments[wk]; if (selfRating && selfRating.away) selfRating = null;
  if (selfRating) {
    lines.push('Discussion-Day Rubric Self-Rating');
    lines.push('Participation: ' + pointsLabel(selfRating.participation));
    lines.push('Leadership: ' + pointsLabel(selfRating.leadership));
    lines.push('Active Engagement: ' + pointsLabel(selfRating.activeEngagement));
    lines.push('');
  }
  if (refl) {
    questions.forEach(function (q, i) {
      lines.push((i + 1) + '. ' + q.text);
      lines.push(refl.answers[q.key] || '(blank)');
      lines.push('');
    });
    lines.push(goalLabel + ': ' + (refl.goal || '(blank)'));
  } else {
    lines.push('(No reflection saved for this week yet.)');
  }
  return { heading: heading, text: lines.join('\n') };
}

function buildPeerAssessmentBlock(wk) {
  var given = state.peerAssessmentsGiven.filter(function (p) { return p.week === wk; });
  var lines = [];
  if (!given.length) {
    lines.push('(No peer feedback submitted for this week yet.)');
  } else {
    given.forEach(function (p) {
      lines.push('Feedback for: ' + p.assessedEmail);
      lines.push('Participation: ' + pointsLabel(p.participation) + ' — ' + (p.participationComment || '(no comment)'));
      lines.push('Leadership: ' + pointsLabel(p.leadership) + ' — ' + (p.leadershipComment || '(no comment)'));
      lines.push('Active Engagement: ' + pointsLabel(p.activeEngagement) + ' — ' + (p.activeEngagementComment || '(no comment)'));
      lines.push('');
    });
  }
  return { heading: 'Peer Assessment Submitted', text: lines.join('\n') };
}

// Whole-unit export ("Export My Work" on the dashboard) — everything saved so far, across
// whichever weeks have data, one section per week with both blocks.
function buildReportSections() {
  var g = state.group;
  var sections = [];
  for (var wk = 1; wk <= 4; wk++) {
    var w = state.weeklyWork[wk];
    var refl = state.reflections[wk];
    var given = state.peerAssessmentsGiven.some(function (p) { return p.week === wk; });
    if (!w && !refl && !given) continue; // nothing saved for this week yet — leave it out of the export

    sections.push({
      week: wk,
      reading: g.weekReading[wk - 1] || '',
      blocks: [
        { heading: 'Lit Circle Submission: ' + (w ? prepLabelFor(w) : '(not saved)'), text: w ? buildPrepSummaryText(w) : '(No Lit Circle submission saved for this week yet.)' },
        buildPeerAssessmentBlock(wk),
        buildReflectionBlock(wk)
      ]
    });
  }
  return sections;
}

// Single-section exports ("Submit to Teacher (PDF)" on each of the 3 weekly sub-pages) — just
// the one section's content for that one week, reusing the same generic exportReportPdf call.
function buildStrategiesSection(wk) {
  var g = state.group;
  var w = state.weeklyWork[wk];
  return [{
    week: wk, reading: g.weekReading[wk - 1] || '',
    blocks: [{ heading: 'Lit Circle Submission: ' + (w ? prepLabelFor(w) : '(not saved)'), text: w ? buildPrepSummaryText(w) : '(No Lit Circle submission saved for this week yet.)' }]
  }];
}
function buildPeerSection(wk) {
  var g = state.group;
  return [{ week: wk, reading: g.weekReading[wk - 1] || '', blocks: [buildPeerAssessmentBlock(wk)] }];
}
function buildReflectionSectionForExport(wk) {
  var g = state.group;
  return [{ week: wk, reading: g.weekReading[wk - 1] || '', blocks: [buildReflectionBlock(wk)] }];
}

function exportSections(sections, btnId, msgId) {
  var msg = $(msgId);
  if (msg) msg.textContent = '';
  callServer('exportReportPdf', [state.email, state.group.bookTitle, state.group.memberEmails.join(', '), sections],
    function (res) {
      downloadBase64Pdf(res.base64, res.filename);
      if (msg) msg.textContent = 'Downloaded!';
    }, null, { button: $(btnId) });
}

function doExportPdf() {
  var sections = buildReportSections();
  if (!sections.length) { showError('Save at least one Lit Circle submission, peer assessment, or self assessment before exporting.'); return; }
  exportSections(sections, 'exportPdfBtn', 'exportMsg');
}

function doExportStrategiesSection(wk) {
  if (!state.weeklyWork[wk]) { showError('Save your Lit Circle submission before downloading it.'); return; }
  exportSections(buildStrategiesSection(wk), 'exportStrategiesBtn', 'exportStrategiesMsg');
}
function doExportPeerSection(wk) {
  var given = state.peerAssessmentsGiven.filter(function (p) { return p.week === wk; });
  if (!given.length) { showError('Submit at least one teammate\'s feedback before exporting.'); return; }
  exportSections(buildPeerSection(wk), 'exportPeerBtn', 'exportPeerMsg');
}
function doExportReflectionSection(wk) {
  if (!state.reflections[wk]) { showError('Save your self assessment before downloading it.'); return; }
  exportSections(buildReflectionSectionForExport(wk), 'exportReflectionBtn', 'exportReflectionMsg');
}

function downloadBase64Pdf(base64, filename) {
  var byteChars = atob(base64);
  var byteNumbers = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
  var byteArray = new Uint8Array(byteNumbers);
  var blob = new Blob([byteArray], { type: 'application/pdf' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename || 'Lit Circle Report.pdf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

var platform = { bootstrap:null, mode:'student', activeClassId:'', dashboard:null, grading:null, adminAccess:null };

function platformRpc(fnName, args, onOk, onErr, btn) {
  callServer(fnName, args || [], onOk, onErr, {button:btn || null});
}
function platformClassById(id){
  var list=(platform.bootstrap&&platform.bootstrap.classes)||[];
  for(var i=0;i<list.length;i++) if(String(list[i].classId)===String(id)) return list[i];
  return null;
}
function loadPlatformBootstrap(after){
  platformRpc('getLiteratureBootstrap',[],function(b){
    platform.bootstrap=b||{role:'student',classes:[]};
    var teacherBtn=$('teacherPortalBtn'), adminBtn=$('adminPortalBtn');
    if(teacherBtn) teacherBtn.style.display=(b.role==='teacher'||b.role==='admin')?'inline-block':'none';
    if(adminBtn) adminBtn.style.display=b.role==='admin'?'inline-block':'none';

// Override the legacy header with role-aware navigation while keeping the student identity visible.
function renderHeader(){
  var who=$('whoBox'); if(!who) return;
  var b=platform.bootstrap||{};
  var identity=state.email||b.email||'';
  var parts=[];
  if(identity) parts.push(esc(identity));
  if(platform.mode==='student' && state.email){
    var feedbackTotal=Object.keys(state.peerFeedbackReceived||{}).reduce(function(n,w){return n+((state.peerFeedbackReceived[w]||[]).length);},0)+teacherFeedbackCount();
    parts.push('<a onclick="goHome()">Home</a>');
    parts.push('<a onclick="openFeedbackInbox()">Feedback'+(feedbackTotal?' ('+feedbackTotal+')':'')+'</a>');

  who.innerHTML=parts.join(' ');
  ['studentPortalBtn','teacherPortalBtn','adminPortalBtn'].forEach(function(id){var el=$(id);if(el)el.classList.remove('active');});

function studentTeacherCard(s){

// Keep the reflection evidence readable for grading.
compactPrepEvidence = function(work){
  if(!work)return 'No Lit Circle submission or discussion plan saved.';
  var lines=[];
  if(work.prepType){
    lines.push('Submission type: '+(prepLabelFor(work)||work.prepType||'—'));
    if(work.choices&&work.choices.length)lines.push('Strategies: '+work.choices.join(', '));
    lines.push('',buildPrepSummaryText(work));
  } else {
    lines.push('No Lit Circle submission saved yet.');
  }
  var p=work.data&&work.data.discussionPlan;
  if(p)lines.push('\n--- 5-Minute Discussion Plan ---','Focus: '+(p.focus||''),'Evidence: '+(p.evidence||''),'Opening question: '+(p.question1||''),'Follow-up: '+(p.question2||''),'0–1: '+(p.open||''),'1–3: '+(p.explore||''),'3–4: '+(p.deepen||''),'4–5+: '+(p.close||''),'Backup: '+(p.backup||''));
  return lines.join('\n').substring(0,6000);
};
function compactPeerGivenEvidence(st,w){
  var list=(st.peerAssessmentsGiven||[]).filter(function(p){return Number(p.week)===Number(w);});
  if(!list.length)return 'No peer assessments submitted yet.';
  return list.map(function(p){return 'Submitted for '+p.assessedEmail;}).join('\n');
}
compactReflectionEvidence = function(st,w){
  var r=st.reflections&&st.reflections[w], received=(st.peerFeedbackReceived&&st.peerFeedbackReceived[w])||[], lines=[];
  if(received.length){
    lines.push('--- PEER FEEDBACK RECEIVED ---');
    received.forEach(function(fb,i){lines.push('Peer '+(i+1)+': Participation '+fb.participation+'/5 · Leadership '+fb.leadership+'/5 · Engagement '+fb.activeEngagement+'/5');if(fb.participationComment)lines.push('Participation: '+fb.participationComment);if(fb.leadershipComment)lines.push('Leadership: '+fb.leadershipComment);if(fb.activeEngagementComment)lines.push('Engagement: '+fb.activeEngagementComment);lines.push('');});
  } else lines.push('No peer feedback received yet.','');
  lines.push('--- STUDENT SELF ASSESSMENT ---');
  if(!r){lines.push('No self assessment saved.');return lines.join('\n');}
  Object.keys(r.answers||{}).forEach(function(k){lines.push(k+': '+r.answers[k]);});
  lines.push('Goal: '+(r.goal||''));return lines.join('\n\n');
};
