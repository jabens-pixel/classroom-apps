<script>
// ============================================================================
// Student pages: classes → home (your show, this week, the Listening Library, all weeks) → a week's
// steps: lessons (read/watch), fill-in work (logs, plans, scripts, Canva links), the parts quiz,
// discussions. Every box autosaves (SaveGuard) and long boxes record writing stats.
// ============================================================================
(function () {
  var S = PC.S = { home: null, item: null, loading: false };
  PC.act = PC.act || {};
  var A = PC.act;
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || !A[el.dataset.act]) return;
    if (el.tagName === 'A' && !el.getAttribute('target')) e.preventDefault();
    A[el.dataset.act](el, e);
  });
  function esc(s) { return PC.esc(s); }
  function asArg() { return PC.state.as || ''; }
  function readOnly() { return !!(S.home && S.home.me && S.home.me.readOnly); }
  function me() { return (S.home && S.home.me) || {}; }
  // ---------------------------------------------------------------- classes
  PC.views.classes = function (app) {
    var b = PC.boot, list = (b.studentClasses || []).slice();
    var teaching = PC.boot.role !== 'student' ? (b.classes || []) : [];
    var h = '<section class="pc-card"><h1>Your classes</h1>';
    if (teaching.length) h += '<p class="pc-muted">You’re a teacher, so the Student view opens your own practice copy of a class: what students see, saved under your account.</p>';
    var all = teaching.map(function (c) { return Object.assign({ teacherSelf: true }, c); }).concat(list);
    h += all.length ? '<div class="pc-class-list">' + all.map(function (c) {
      return '<button type="button" class="pc-class-pick" data-act="pickClass" data-class="' + esc(c.classId) + '"><span class="pc-class-pick-name">' + esc(c.className) + (c.period ? ' <small>Period ' + esc(c.period) + '</small>' : '') + '</span>' +
        '<span class="pc-class-pick-book">Podcast Studio</span>' + (c.teacherSelf ? '<span class="pc-chip">Your class</span>' : '') + '</button>';
    }).join('') + '</div>' : '<p>You haven’t joined a class yet.</p>';
    h += '</section><section class="pc-card"><h2>Join a class</h2><p class="pc-muted">Type the class code from your teacher and your real name.</p>' +
      '<form class="pc-join" id="pcJoin"><label class="pc-field"><span>Class code</span><input id="joinCode" class="pc-input pc-code-input" autocomplete="off" maxlength="8" required></label>' +
      '<label class="pc-field"><span>First name</span><input id="joinFirst" class="pc-input" autocomplete="given-name" maxlength="40" required></label>' +
      '<label class="pc-field"><span>Last name</span><input id="joinLast" class="pc-input" autocomplete="family-name" maxlength="40" required></label>' +
      '<button type="submit" class="pc-btn primary">Join</button><p class="pc-form-msg" id="joinMsg" role="alert"></p></form></section>';
    app.innerHTML = h;
    PC.byId('pcJoin').onsubmit = function (e) {
      e.preventDefault(); var btn = this.querySelector('button'); btn.disabled = true; PC.byId('joinMsg').textContent = '';
      PC.rpc('joinClass', { code: PC.byId('joinCode').value, firstName: PC.byId('joinFirst').value, lastName: PC.byId('joinLast').value }, { retry: true }).then(function (r) {
        PC.boot.studentClasses = r.classes; PC.state.classId = r.classId; PC.store.set('pcClass_' + PC.boot.email, r.classId); PC.go('home');
      }).catch(function (err) { btn.disabled = false; PC.byId('joinMsg').textContent = err.message; });
    };
  };
  // ---------------------------------------------------------------- your name (added by email)
  // A teacher added this student by email, so the app doesn't know their name yet. They type it once;
  // it fills every class that has no name for them (setMyName).
  PC.views.name = function (app) {
    var b = PC.boot, cs = b.addedTo || [];
    app.innerHTML = '<section class="pc-card pc-name-card"><span class="pc-eyebrow">Welcome to Podcast Studio</span><h1>What’s your name?</h1>' +
      '<p>' + (cs.length ? 'Your teacher added you to <b>' + cs.map(esc).join('</b>, <b>') + '</b>. ' : '') + 'Type your name the way your teacher should see it. You only do this once.</p>' +
      '<form class="pc-join" id="pcName" autocomplete="on"><label class="pc-field"><span>First name</span><input id="nmFirst" class="pc-input" autocomplete="given-name" maxlength="40" required value="' + esc(b.suggestFirst || '') + '"></label>' +
      '<label class="pc-field"><span>Last name</span><input id="nmLast" class="pc-input" autocomplete="family-name" maxlength="40" required value="' + esc(b.suggestLast || '') + '"></label>' +
      '<button type="submit" class="pc-btn primary" id="nmSave">Continue</button><p class="pc-form-msg" id="nmMsg" role="alert"></p></form>' +
      '<p class="pc-small pc-muted">Signed in as ' + esc(b.email) + '</p></section>';
    var f = PC.byId('nmFirst'); setTimeout(function () { if (f.value && PC.byId('nmLast').value) PC.byId('nmSave').focus(); else f.focus(); }, 40);
    PC.byId('pcName').onsubmit = function (e) {
      e.preventDefault(); var btn = PC.byId('nmSave'); btn.disabled = true; PC.byId('nmMsg').textContent = '';
      PC.rpc('setMyName', { firstName: PC.byId('nmFirst').value, lastName: PC.byId('nmLast').value }, { retry: true }).then(function (r) {
        b.needsName = false; b.studentClasses = r.studentClasses || b.studentClasses; PC.toast('Thanks, ' + r.name.split(' ')[0] + '!', 'ok');
        var sc = b.studentClasses || [];
        if (!PC.state.classId && sc.length === 1) PC.state.classId = sc[0].classId;
        PC.go(PC.state.classId ? 'home' : 'classes');
      }).catch(function (err) { btn.disabled = false; PC.byId('nmMsg').textContent = err.message; });
    };
  };
  A.pickClass = function (el) { PC.state.classId = el.dataset.class; PC.state.as = ''; PC.store.set('pcClass_' + PC.boot.email, el.dataset.class); PC.go('home'); };

  // ---------------------------------------------------------------- shared bits
  function ribbon() {
    var m = me();
    if (PC.state.as) return '<div class="pc-ribbon' + (m.readOnly ? '' : ' is-demo') + '"><span>' + (m.readOnly ? 'Viewing <b>' + esc(m.name) + '</b>’s work · read-only' : 'Using demo student <b>' + esc(m.name) + '</b> · saves work') + '</span><button type="button" class="pc-btn small" data-act="backToDashboard">← Back to dashboard</button></div>';
    if (m.teacherSelf) return '<div class="pc-ribbon is-preview"><span>Student view of your own class. Hidden weeks and items show here for you, marked “Hidden from students”.</span></div>';
    return '';
  }
  A.backToDashboard = function () { PC.leave(function () { PC.state.role = 'teacher'; PC.state.as = ''; PC.go('dashboard'); }); };
  function unitOf(n) { return (S.home && S.home.units || []).filter(function (u) { return u.n === Number(n); })[0]; }
  function actOf(u, id) { return u ? (u.activities || []).filter(function (a) { return a.id === id; })[0] : null; }
  function itemStatus(u, a) {
    var key = 'w' + u.n + '_' + a.id, st = (S.home.status || {})[key] || {}, g = (S.home.grades || {})[key];
    if (a.form === 'lesson') return { cls: 'none', text: 'Read & watch' };
    if (g && (g.excluded || (g.score !== null && g.score !== undefined))) return { cls: 'graded', text: g.excluded ? 'Left out of grade' : 'Graded' };
    if (a.form === 'quiz' && st.state === 'submitted') return { cls: 'graded', text: 'Scored' };
    if (a.form === 'discussion' && st.state === 'submitted') return { cls: 'in', text: (st.posts ? 'Posted' : '') + (st.replies ? (st.posts ? ' · ' : '') + PC.plural(st.replies, 'reply', 'replies') : '') };
    if (st.state === 'submitted') return { cls: 'in', text: st.edited ? 'Turned in · edited' : 'Turned in' };
    if (st.state === 'draft') return { cls: 'progress', text: 'In progress' };
    return { cls: 'none', text: 'Not started yet' };
  }
  function libEpisode(id) { return ((S.home && S.home.library) || []).filter(function (e) { return e.id === id; })[0]; }
  function canvaLink(k) { return ((S.home && S.home.canva) || {})[k] || ''; }
  function canvaBtn(k, label) {
    var u = canvaLink(k);
    var local = '<button type="button" class="pc-btn pc-canva-btn" data-act="studioResource" data-resource="'+esc(k)+'">'+(k === 'cover' ? 'Open cover maker' : 'Open run-sheet starter')+'</button>';
    return local + (u ? '<a class="pc-btn pc-canva-btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(label)+' ↗</a>' : '');
  }
  function downloadResource(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
  }
  var RUN_EXAMPLE = [
    ['0:00–0:25','Cold open','A vivid guest moment or scene that raises the central question.'],
    ['0:25–1:00','Introduce the show','Name the show, topic and question; introduce the guest or other voice.'],
    ['1:00–2:15','Build the context','Explain the background with a checked detail from your research.'],
    ['2:15–4:15','Another voice','Interview, recorded response, co-host perspective or guest performance; follow the strongest answer.'],
    ['4:15–6:30','Explore and explain','Connect what you heard to your research; develop the story or consider another perspective.'],
    ['6:30–7:35','Bring it together','Answer the central question and leave listeners with a clear insight.'],
    ['7:35–8:00','Close and credit','Credit people, sources and music; give a purposeful sign-off.']
  ];
  function runTable(blank) {
    return '<table class="pc-resource-table"><thead><tr><th>Time</th><th>Segment</th><th>Words / action / sound</th></tr></thead><tbody>'+RUN_EXAMPLE.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+ (blank ? '&nbsp;' : esc(x)) +'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
  }
  function coverCanvas(title, subtitle) {
    var c=document.createElement('canvas');c.width=c.height=1600;var x=c.getContext('2d');
    x.fillStyle='#376c61';x.fillRect(0,0,1600,1600);x.strokeStyle='#f5e8c9';x.lineWidth=8;x.strokeRect(45,45,1510,1510);x.lineWidth=2;x.strokeRect(64,64,1472,1472);
    x.fillStyle='#272822';x.fillRect(85,92,1430,125);x.fillStyle='#f5e8c9';x.font='36px "Public Sans", sans-serif';x.textAlign='center';x.fillText('AN ORIGINAL PODCAST',800,172);
    // Original record emblem and radiating sound marks.
    x.fillStyle='#272822';x.beginPath();x.arc(800,650,325,0,Math.PI*2);x.fill();
    [295,265,235,205].forEach(function(r){x.strokeStyle='#659d8c';x.lineWidth=3;x.beginPath();x.arc(800,650,r,0,Math.PI*2);x.stroke();});
    x.fillStyle='#e6b653';x.beginPath();x.arc(800,650,110,0,Math.PI*2);x.fill();x.fillStyle='#272822';x.beginPath();x.arc(800,650,18,0,Math.PI*2);x.fill();
    for(var side=-1;side<=1;side+=2){x.fillStyle='#f5e8c9';x.beginPath();x.moveTo(800+side*400,430);x.lineTo(800+side*600,280);x.lineTo(800+side*545,420);x.lineTo(800+side*640,400);x.lineTo(800+side*415,590);x.lineTo(800+side*485,435);x.closePath();x.fill();}
    x.fillStyle='#f5e8c9';x.fillRect(85,1030,1430,390);x.fillStyle='#272822';
    title=(title||'YOUR SHOW').toUpperCase();var size=150,lines=[];
    function wrap(){lines=[];var line='';title.split(/\s+/).forEach(function(w){var test=line?line+' '+w:w;if(x.measureText(test).width>1300&&line){lines.push(line);line=w;}else line=test;});if(line)lines.push(line);}
    do{x.font='800 '+size+'px "Barlow Condensed", Impact, sans-serif';wrap();if(lines.length<=2&&lines.every(function(t){return x.measureText(t).width<=1300;}))break;size-=4;}while(size>24);
    var start=1220-(lines.length-1)*size*.54;lines.forEach(function(line,i){x.fillText(line,800,start+i*size*1.08);});
    x.fillStyle='#f5e8c9';var subsize=36;do{x.font=subsize+'px "Public Sans", sans-serif';if(x.measureText(subtitle).width<=1360)break;subsize-=2;}while(subsize>12);x.fillText(subtitle||'Stories worth listening to.',800,1492);return c;
  }
  A.studioResource = function(el) {
    var k=el.dataset.resource;
    if(k==='runsheet') {
      PC.modal('<h2 id="pcModalTitle">The eight-minute run sheet</h2><p>A starting structure, not a script to copy. Crews extend the substantive segments for a longer episode. Adjust the timing to fit your story.</p>'+runTable(false)+'<p>Write your own plan in the saved Run sheet table on <b>Script &amp; Run Sheet</b>. The download includes this example and a printable blank.</p><div class="pc-row"><button type="button" class="pc-btn primary" id="pcRunDownload">Download printable starter</button><button type="button" class="pc-btn" onclick="PC.closeModal()">Close</button></div>');
      PC.byId('pcRunDownload').onclick=function(){var html='<!doctype html><html lang="en"><meta charset="utf-8"><title>Podcast Studio — Run sheet</title><style>body{font:16px Georgia;margin:40px;color:#272822}h1{border-bottom:5px solid #376c61;padding-bottom:15px}table{border-collapse:collapse;width:100%;margin:24px 0}th,td{border:1px solid #888;padding:14px;text-align:left}th{background:#eee}section{break-before:page}section td{height:65px}button{padding:12px}@media print{button{display:none}}</style><button onclick="window.print()">Print / Save as PDF</button><h1>Podcast Studio · Run sheet</h1><p>Solo: 8 minutes. Crews: longer, with a meaningful contribution from everyone.</p>'+runTable(false)+'<section><h1>Your episode plan</h1><p>Show: ____________________ &nbsp; Episode: ____________________</p><p>Central question: ____________________________________________________</p>'+runTable(true)+'<p>Other voice and permission: __________________________________________</p><p>Sources / credits: __________________________________________________</p></section></html>';downloadResource(new Blob([html],{type:'text/html'}),'Podcast-Studio-Run-Sheet.html');};
      return;
    }
    var titleField=document.querySelector('[data-field="coverTitle"]'),subField=document.querySelector('[data-field="coverSubtitle"]');
    var show=(S.home&&S.home.show)||{};
    var title=(titleField&&titleField.value)||show.name||'Your Show',sub=(subField&&subField.value)||show.tagline||'Stories worth listening to.';
    PC.modal('<h2 id="pcModalTitle">Vintage cover maker</h2><p>Set your cover title and tagline in the saved fields on <b>Cover Art</b>, then reopen this maker. Your show name is used if those fields are blank.</p><div id="pcCoverPreview" class="pc-cover-preview"></div><p>Download the square PNG and upload it into your Canva episode. This is finished cover artwork; add separate text or other elements in Canva if you want to develop it further.</p><div class="pc-row"><button type="button" class="pc-btn primary" id="pcCoverDownload" disabled>Preparing cover…</button><a class="pc-btn" href="https:&#47;&#47;www.canva.com/" target="_blank" rel="noopener">Open Canva ↗</a><button type="button" class="pc-btn" onclick="PC.closeModal()">Close</button></div>');
    var mount=PC.byId('pcCoverPreview'),button=PC.byId('pcCoverDownload');
    Promise.resolve(document.fonts ? document.fonts.ready : null).then(function(){if(!mount.isConnected)return;var c=coverCanvas(title,sub);c.setAttribute('role','img');c.setAttribute('aria-label',title+' podcast cover');mount.appendChild(c);button.disabled=false;button.textContent='Download cover PNG';button.onclick=function(){c.toBlob(function(blob){if(blob)downloadResource(blob,'Podcast-Studio-Cover.png');else PC.toast('The cover could not be downloaded. Please try again.','error');},'image/png');};});
  };

  var CANVA_LABEL = { cover: 'Cover art template in Canva', runsheet: 'Run sheet template in Canva' };

  function loadHome(cb) {
    S.loading = true;
    PC.rpc('getStudentHome', { classId: PC.state.classId, as: asArg() }, { retry: true }).then(function (r) { S.home = r; S.loading = false; cb(null, r); })
      .catch(function (e) { S.loading = false; cb(e); });
  }

  // ---------------------------------------------------------------- home
  function heroHtml(h) {
    var sh = h.show;
    return '<section class="pc-card pc-hero pc-studio-hero"><div class="pc-hero-copy"><div class="pc-eyebrow">' + esc(h.klass.className) + (h.klass.period ? ' · Period ' + esc(h.klass.period) : '') + '</div><h1 class="pc-unit-title">' + ((h.unitTitle || 'Podcast Studio') === 'Podcast Studio' ? '<span>Podcast</span><span>Studio</span>' : esc(h.unitTitle)) + '</h1>' +
      '<p class="pc-hero-note">Listen like a producer. Plan your own show.<br>Record it and build it in Canva.</p><p class="pc-duration-note">Solo: 8 minutes · Crews: longer episodes</p></div><div class="pc-broadcast-art pc-art-mic" aria-hidden="true"></div>' +
      '<div class="pc-myshow"><span class="pc-eyebrow">Your show</span>' + (sh ? '<b>' + esc(sh.name) + '</b>' + (sh.tagline ? '<span class="pc-show-tagline">' + esc(sh.tagline) + '</span>' : '') + (sh.crew ? '<span class="pc-show-crew">' + esc(sh.crew === 'Crew' ? 'Crew' + (sh.members ? ': ' + sh.members : '') : 'Solo') + '</span>' : '') : '<b>Your story starts here.</b><span class="pc-show-tagline">Name your show in Week 2.</span>') + '</div></section>';
  }
  function currentUnit(h) { var open = (h.units || []).filter(function (u) { return u.anyOpen; }); return open[open.length - 1] || null; }
  function unitCardHtml(h, u) {
    var art = {1:'headphones',2:'notebook',3:'mic'}[u.n] || 'mic';
    var copy = {1:'Explore great podcasts. Notice what makes them work.',2:'Develop your idea. Plan your episode. Write a strong script.',3:'Record your audio. Build your episode in Canva. Publish it.'};
    var done = u.activities.filter(function(a) { var st = itemStatus(u,a); var grade = (h.grades || {})['w' + u.n + '_' + a.id]; return !(grade && grade.excluded) && (st.cls === 'in' || st.cls === 'graded'); }).length;
    return '<article class="pc-week-card pc-week-' + u.n + '"><div class="pc-week-poster"><div class="pc-week-head"><span class="pc-eyebrow">' + esc(u.label) + '</span><h3>' + esc(u.title || u.label) + '</h3></div>' +
      '<div class="pc-week-art pc-art-' + art + '" aria-hidden="true"></div><p class="pc-week-copy">' + esc(copy[u.n] || u.summary || '') + '</p>' +
      '<button type="button" class="pc-btn primary pc-week-open" data-act="openWeek" data-week="' + u.n + '">Open ' + esc(u.label) + ' →</button></div>' +
      '<details class="pc-week-progress"><summary>Activities &amp; progress <span>' + done + ' / ' + u.activities.filter(function(a){return a.form !== 'lesson';}).length + ' completed</span></summary>' +
      (u.eq ? '<p class="pc-eq-mini">' + esc(u.eq) + '</p>' : '') + '<ul class="pc-week-items">' + u.activities.map(function (a) {
        if (!u.open[a.id] && !me().teacherSelf) return '<li class="is-locked"><span>' + esc(a.icon + ' ' + a.title) + '</span><em>🔒 Not open yet</em></li>';
        var st = itemStatus(u, a);
        return '<li class="is-' + st.cls + '"><span>' + esc(a.icon + ' ' + a.title) + '</span><em>' + esc(st.text) + (u.due[a.id] ? ' · due ' + esc(PC.fmtDate(u.due[a.id])) : '') + (!u.open[a.id] ? ' · hidden from students' : '') + '</em></li>';
      }).join('') + '</ul></details></article>';
  }
  function libraryHtml(lib, opts) {
    opts = opts || {};
    return '<div class="pc-lib">' + (lib || []).map(function (e) {
      if (opts.compact) return '<article class="pc-lib-item pc-lib-compact"><div class="pc-lib-top"><span class="pc-lib-format">' + esc(e.format) + '</span><span class="pc-lib-len">' + esc(e.length) + '</span></div><h4><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + ' ↗</a></h4><div class="pc-lib-show">' + esc(e.show) + '</div>' + (e.note ? '<p class="pc-lib-note">' + esc(e.note) + '</p>' : '') + '<details class="pc-listening-notes"><summary>Listening notes</summary><p class="pc-lib-craft"><b>Listen for:</b> ' + esc(e.craft) + '</p><p class="pc-small">' + esc(e.why) + '</p>' + (e.alt ? '<p class="pc-small"><a href="' + esc(e.alt) + '" target="_blank" rel="noopener">Another place to listen ↗</a></p>' : '') + '</details></article>';
      return '<article class="pc-lib-item"><div class="pc-lib-top"><span class="pc-lib-format">' + esc(e.format) + '</span><span class="pc-lib-len">' + esc(e.length) + '</span></div>' +
        '<h4><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + ' ↗</a></h4><div class="pc-lib-show">' + esc(e.show) + '</div>' +
        '<p class="pc-lib-craft"><b>Listen for:</b> ' + esc(e.craft) + '</p><p class="pc-small">' + esc(e.why) + '</p>' +
        (e.note ? '<p class="pc-lib-note">' + esc(e.note) + '</p>' : '') + (e.alt ? '<p class="pc-small"><a href="' + esc(e.alt) + '" target="_blank" rel="noopener">Another place to listen ↗</a></p>' : '') + '</article>';
    }).join('') + '</div>';
  }
  PC.libraryHtml = libraryHtml;
  PC.views.home = function (app) {
    if (!PC.state.classId) return PC.go('classes');
    app.innerHTML = '<section class="pc-card pc-skeleton"><p>Opening Podcast Studio…</p></section>';
    loadHome(function (err, h) {
      if (err) return PC.fail(app, err);
      if (PC.state.view !== 'home') return;
      var out = ribbon() + '<div class="pc-crumbs"><button type="button" class="pc-link" data-act="toClasses">← Your classes</button><span>' + esc(h.klass.className) + '</span></div>' + heroHtml(h);
      var cur = currentUnit(h);
      if (cur) out += '<section class="pc-now"><h2>This week</h2><p>' + esc(cur.label) + ' — ' + esc(cur.title) + '</p><button type="button" class="pc-btn primary" data-act="openWeek" data-week="' + cur.n + '">Open ' + esc(cur.label) + ' →</button></section>';
      var res = h.resume;
      if (res && res.view === 'week' && h.units.some(function (u) { return u.n === res.week; })) {
        var ru = unitOf(res.week), ra = actOf(ru, res.step);
        if (ra) out += '<button type="button" class="pc-resume" data-act="openWeek" data-week="' + res.week + '" data-step="' + esc(res.step) + '"><span>Pick up where you left off</span><b>' + esc(ru.label) + ' · ' + esc(ra.title) + ' →</b></button>';
      }
      out += '<section class="pc-home-weeks" aria-label="All weeks">';
      if (!h.units.length) out += '<p>Your teacher hasn’t opened Week 1 yet.</p>';
      out += '<div class="pc-weeks">' + h.units.map(function (u) { return unitCardHtml(h, u); }).join('') + '</div></section>';
      out += '<details class="pc-card pc-fold pc-home-library" id="pcLibFold"' + (PC.store.get('pcLibOpen', true) ? ' open' : '') + '><summary><span class="pc-record" aria-hidden="true"></span><h2>Listening Library</h2><span class="pc-muted">Real episodes to study. Each one opens on the show’s own site.</span></summary>' + libraryHtml(h.library, {compact:true}) + '</details>';
      app.innerHTML = out;
      var lf = PC.byId('pcLibFold'); if (lf) lf.addEventListener('toggle', function () { PC.store.set('pcLibOpen', lf.open); });
    });
  };
  A.toClasses = function () { PC.leave(function () { PC.state.classId = ''; PC.go('classes'); }); };
  A.openWeek = function (el) {
    PC.leave(function () {
      var u = unitOf(el.dataset.week), first = u ? u.activities.filter(function (a) { return u.open[a.id] || me().teacherSelf; })[0] : null;
      PC.go('week', { week: Number(el.dataset.week), step: el.dataset.step || (first ? first.id : '') });
    });

      }).catch(function (e) { b.disabled = false; PC.toast(e.message, 'error'); });
    };
  };

  window.__MB.Student = 'ok';
})();
</script>
