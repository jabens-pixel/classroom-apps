<script>
// ============================================================================
// Read aloud wherever the teacher reads student writing (cross-app, Short Story 2026.10.19.31).
// Browser voices only (speechSynthesis): no server call, no permission. One sentence at a time
// (Chrome stops long utterances), the sentence is highlighted, click a sentence to jump to it,
// best voice first (Edge "Natural", Mac "Premium"/"Enhanced"), and it stops when the passage
// leaves the page. A "🔊 Read aloud" button sits above each block of student writing.
// ============================================================================
(function () {
  var synth = window.speechSynthesis, R = PC.say = { block: null, saved: '', sents: [], i: 0, utt: null, paused: false };
  function esc(s) { return PC.esc(s); }
  function voices() { try { return synth ? synth.getVoices() : []; } catch (e) { return []; } }
  function rank(v) {
    var n = v.name || '', l = String(v.lang || '').toLowerCase(), s = 0;
    if (/^en/.test(l)) s += 10; if (/en-us/.test(l)) s += 2;
    if (/natural/i.test(n)) s += 30; if (/premium/i.test(n)) s += 25; if (/enhanced/i.test(n)) s += 20; if (/google/i.test(n)) s += 8;
    return s;
  }
  function bestVoices() { return voices().filter(function (v) { return /^en/i.test(v.lang || ''); }).sort(function (a, b) { return rank(b) - rank(a); }); }
  function splitSentences(text) {
    text = String(text || '');
    try {
      if (window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter('en', { granularity: 'sentence' }).segment(text)).map(function (x) { return x.segment; });
    } catch (e) {}
    return text.match(/[^.!?\n]+[.!?]*["”’)]*\s*|\n+/g) || [text];
  }
  function bar() {
    var b = PC.byId('pcSayBar');
    if (!b) { b = document.createElement('div'); b.id = 'pcSayBar'; b.className = 'pc-saybar'; b.setAttribute('role', 'region'); b.setAttribute('aria-label', 'Read aloud'); document.body.appendChild(b); }
    var vs = bestVoices(), cur = PC.store.get('pcSayVoice', ''), rate = PC.store.get('pcSayRate', 1);
    b.innerHTML = '<span class="pc-saybar-title">🔊 Reading aloud</span><button type="button" class="pc-btn small" data-act="sayPause">' + (R.paused ? 'Resume' : 'Pause') + '</button><button type="button" class="pc-btn small" data-act="sayStop">Stop</button>' +
      '<label>Speed <select class="pc-input" id="pcSayRate">' + [0.8, 0.9, 1, 1.15, 1.3, 1.5].map(function (r) { return '<option value="' + r + '"' + (Number(rate) === r ? ' selected' : '') + '>' + r + '×</option>'; }).join('') + '</select></label>' +
      (vs.length ? '<label>Voice <select class="pc-input" id="pcSayVoice">' + vs.slice(0, 20).map(function (v, i) { return '<option value="' + esc(v.name) + '"' + ((cur ? v.name === cur : i === 0) ? ' selected' : '') + '>' + esc(v.name) + '</option>'; }).join('') + '</select></label>' : '') +
      '<span class="pc-small">Click a sentence to jump to it.</span>';
    b.hidden = false;
    var rs = PC.byId('pcSayRate'); if (rs) rs.onchange = function () { PC.store.set('pcSayRate', Number(this.value)); restartHere(); };
    var vsel = PC.byId('pcSayVoice'); if (vsel) vsel.onchange = function () { PC.store.set('pcSayVoice', this.value); restartHere(); };
  }
  function pickVoice() { var name = PC.store.get('pcSayVoice', ''), vs = bestVoices(); return vs.filter(function (v) { return v.name === name; })[0] || vs[0] || null; }
  function speakFrom(i) {
    if (!R.block || !document.body.contains(R.block)) { R.stop(); return; }
    R.i = i;
    var spans = R.block.querySelectorAll('.pc-say-s');
    spans.forEach(function (s, k) { s.classList.toggle('is-saying', k === i); });
    if (i >= R.sents.length) { R.stop(); return; }
    var t = R.sents[i];
    if (!t.trim()) return speakFrom(i + 1);
    var u = new SpeechSynthesisUtterance(t), v = pickVoice();
    if (v) u.voice = v; u.rate = Number(PC.store.get('pcSayRate', 1)) || 1;
    u.onend = function () { if (R.utt === u && !R.paused) speakFrom(i + 1); };
    u.onerror = function () { if (R.utt === u) R.stop(); };
    R.utt = u;   // keep a reference: Chrome drops events for utterances it garbage-collects
    synth.speak(u);
    if (spans[i]) try { spans[i].scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  function restartHere() { if (!R.block) return; var i = R.i; R.utt = null; synth.cancel(); R.paused = false; bar(); speakFrom(i); }
  R.start = function (block) {
    if (!synth) { PC.toast('This browser can’t read aloud.'); return; }
    R.stop();
    var text = block.innerText || block.textContent || '';
    R.block = block; R.saved = block.innerHTML; R.sents = splitSentences(text); R.i = 0; R.paused = false;
    block.innerHTML = R.sents.map(function (s, k) { return '<span class="pc-say-s" data-say-i="' + k + '">' + esc(s) + '</span>'; }).join('');
    block.classList.add('is-reading');
    bar(); speakFrom(0);
  };
  R.stop = function () {
    var b = R.block; R.block = null; R.utt = null;
    try { synth && synth.cancel(); } catch (e) {}
    if (b) { b.innerHTML = R.saved; b.classList.remove('is-reading'); }
    var bb = PC.byId('pcSayBar'); if (bb) bb.hidden = true;
  };
  var A = PC.act = PC.act || {};
  A.sayStart = function (el) {
    var row = el.closest('.pc-mfield, .pc-mrow-work'), block = row ? row.querySelector('.pc-readable') : null;
    if (block) R.start(block);
  };
  A.sayPause = function () { if (!R.block) return; if (R.paused) { R.paused = false; synth.resume(); if (!synth.speaking) speakFrom(R.i); } else { R.paused = true; synth.pause(); } bar(); };
  A.sayStop = function () { R.stop(); };
  document.addEventListener('click', function (e) { var s = e.target.closest('.pc-say-s'); if (!s || !R.block || !R.block.contains(s)) return; R.utt = null; synth.cancel(); R.paused = false; bar(); speakFrom(Number(s.dataset.sayI)); });
  // The passage leaving the page stops the voice (screen change, row moved into focus and back, reload).
  var _go = PC.go; PC.go = function () { R.stop(); return _go.apply(this, arguments); };
  window.addEventListener('pagehide', function () { R.stop(); });
  if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = function () { if (R.block) bar(); };
  window.__MB.ReadAloud = 'ok';
})();
</script>
