<script>
// ============================================================================
// Teacher dashboard: class banner → class switcher → Grading → Gradebook → Students (folded)
// → Release & Resources (week switches, Canva template links, Canvas). Plus the Admin page.
// ============================================================================
(function () {
  var T = PC.T = { dash: null, loadingFor: '', gbPushStatus: '', gbPushBusy: false, busy: {}, msgs: {}, weekMsgs: {}, modules: {}, lastRedos: null, openWeeks: {}, drafts: {}, hubTimer: null };
  var A = PC.act = PC.act || {};
  function esc(s) { return PC.esc(s); }
  function cid() { return T.classId; }
  // Each tile's top stripe is its week's colour (the same colours as the student week cards).
  var WEEK_ACC = { 1: '#285f59', 2: '#9d3826', 3: '#79500b' };

  /** The class used last (remembered on the server, so any computer), then this browser's copy, then
   *  the class with the most students. */
  function pickClass() {
    var cl = PC.boot.classes || [], has = function (id) { return !!id && cl.some(function (c) { return c.classId === id; }); };
    if (has(T.classId)) return T.classId;
    var saved = PC.store.get('pcTClass_' + PC.boot.email, '');
    T.classId = has(PC.boot.lastClassId) ? PC.boot.lastClassId : has(saved) ? saved : has(PC.boot.defaultClassId) ? PC.boot.defaultClassId : ((cl[0] || {}).classId || '');
    return T.classId;
  }
  function rememberClass(id) {
    PC.store.set('pcTClass_' + PC.boot.email, id); PC.boot.lastClassId = id;
    PC.rpc('rememberTeacherClass', { classId: id }).catch(function () {});
  }
  PC.loadDash = function (cb) {
    PC.rpc('getTeacherDashboard', { classId: cid() }, { retry: true }).then(function (d) { T.dash = d; if (cb) cb(null, d); }).catch(function (e) { if (cb) cb(e); });
  };

  // ---------------------------------------------------------------- dashboard
  PC.views.dashboard = function (app) {
    clearInterval(T.hubTimer);
    if (!pickClass()) { app.innerHTML = newClassCard(true); bindNewClass(); return; }
    if (!T.dash || T.dash.klass.classId !== cid()) app.innerHTML = '<section class="pc-card pc-skeleton"><p>Opening your class…</p></section>';
    else drawDash(app);
    PC.loadDash(function (err) {
      if (PC.state.view !== 'dashboard') return;
      if (err) return PC.fail(app, err);
      drawDash(app);
      T.lastRedos = T.dash.hub ? T.dash.hub.needsRegradeTotal : 0;
      T.hubTimer = setInterval(refreshHub, 60000);
    });
  };
  function refreshHub(manual) {
    if (PC.state.view !== 'dashboard' || document.visibilityState !== 'visible' || !T.dash) return;
    PC.rpc('getGradingHub', { classId: cid() }).then(function (h) {
      if (!T.dash) return;
      var before = T.lastRedos || 0; T.dash.hub = h; T.lastRedos = h.needsRegradeTotal;
      if (h.needsRegradeTotal > before && !manual) PC.toast('↻ Student redo needs grading');
      // A background refresh never repaints anything the teacher is typing in.
      var tiles = PC.byId('pcHubTiles'), head = PC.byId('pcHubHead');
      if (tiles && !tiles.contains(document.activeElement) && !tiles.querySelector('details[open]')) { tiles.innerHTML = hubTilesHtml(); }
      if (head) head.innerHTML = hubHeadline();
      if (manual) PC.toast('Counts are up to date.');
    }).catch(function (e) { if (manual) PC.toast(e.message, 'error'); });
  }
  function drawDash(app) {
    var focused = document.activeElement && app.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (focused && app.querySelector('.pc-dash')) return;   // never repaint a field being typed in
    var rel = (T.dash.settings || {}).release || {}, nothingOpen = !Object.keys(rel).some(function (k) { return rel[k] === true; });
    app.innerHTML = '<div class="pc-dash">' + bannerHtml() + switcherHtml() + gradingCard() + gradebookCard() + studentsCard() +
      '<details class="pc-card pc-fold" id="pcSetup"' + (nothingOpen || T.setupOpen ? ' open' : '') + '><summary><h2>Release &amp; Resources</h2><span class="pc-muted">Open each week to students, your Canva template links, and the Canvas link</span></summary>' +
      releaseCard() + canvaCard() + canvasCard() + '</details></div>';
    var s = PC.byId('pcSetup'); if (s) s.addEventListener('toggle', function () { T.setupOpen = s.open; });
  }

  function bannerHtml() {
    var d = T.dash, k = d.klass, wk = currentWeek();
    var roster = d.roster.filter(function (s) { return !s.demo; }), n = roster.length, shows = d.shows || {};
    var named = roster.filter(function (s) { return (shows[s.email] || {}).name; }).length, crews = roster.filter(function (s) { return (shows[s.email] || {}).crew === 'Crew'; }).length;
    return '<section class="pc-banner"><div class="pc-banner-main"><div class="pc-eyebrow">' + esc(k.className) + (k.period ? ' · Period ' + esc(k.period) : '') + '</div>' +
      '<h1>Podcast Studio</h1><div class="pc-book-author">' + (wk ? 'Students are on <b>Week ' + wk.n + ': ' + esc(wk.title) + '</b>' : 'No week is open to students yet. Open Week 1 in Release &amp; Resources (bottom of this page).') + '</div>' +
      '<div class="pc-banner-sora"><span class="pc-chip">Shows named: <b>' + named + '</b> of ' + n + '</span><span class="pc-chip">In a crew: <b>' + crews + '</b></span></div></div>' +
      '<div class="pc-banner-side"><div class="pc-joincode" title="Students join with this code"><span>Class code</span><b>' + esc(k.joinCode) + '</b></div>' +
      '<div class="pc-row"><button type="button" class="pc-btn small" data-act="studentView">Student view</button><button type="button" class="pc-btn small ghost" data-act="renameClass">Rename</button></div></div></section>';
  }
  function pct(a, n) { return n ? Math.round(a / n * 1000) / 10 : 0; }
  /** The week students are on: the newest week with anything open. */
  function currentWeek() {
    var rel = (T.dash.settings || {}).release || {}, best = null;
    ((T.dash.study || {}).units || []).forEach(function (u) { if (u.activities.some(function (a) { return rel['w' + u.n + '_' + a.id] === true; })) best = u; });
    return best;
  }
  function switcherHtml() {
    var cl = PC.boot.classes || [];
    return '<nav class="pc-switcher" aria-label="Your classes">' + cl.map(function (c) {
      var on = c.classId === cid();
      return '<button type="button" class="pc-class-pill' + (on ? ' is-on' : '') + '" data-act="switchClass" data-class="' + esc(c.classId) + '" aria-pressed="' + on + '">' + esc(c.className) + (c.period ? '<span class="pc-class-pill-period">P' + esc(c.period) + '</span>' : '') + '</button>';
    }).join('') + '<button type="button" class="pc-class-pill is-add" data-act="newClass">+ New class</button></nav>';
  }
  A.switchClass = function (el) { T.classId = el.dataset.class; rememberClass(T.classId); T.dash = null; PC.render(); };
  A.studentView = function () { PC.state.role = 'student'; PC.state.classId = cid(); PC.state.as = ''; PC.go('home'); };
  function newClassCard(first) {
    return '<section class="pc-card"><h1>' + (first ? 'Make your first class' : 'New class') + '</h1><p class="pc-muted">Each class gets its own join code, release switches and Canvas link.</p>' +
      '<form id="pcNewClass" class="pc-inline-form"><label class="pc-field"><span>Class name</span><input class="pc-input" id="ncName" maxlength="120" required placeholder="English 9"></label>' +
      '<label class="pc-field pc-field-sm"><span>Period</span><input class="pc-input" id="ncPeriod" maxlength="30" placeholder="2"></label><button class="pc-btn primary" type="submit">Make class</button></form><p class="pc-form-msg" id="ncMsg" role="alert"></p></section>';
  }
  function bindNewClass() {
    var f = PC.byId('pcNewClass'); if (!f) return;
    f.onsubmit = function (e) {
      e.preventDefault(); var b = f.querySelector('button'); b.disabled = true;
      PC.rpc('createClass', { className: PC.byId('ncName').value, period: PC.byId('ncPeriod').value }, { retry: true }).then(function (r) {
        PC.boot.classes = r.classes; T.classId = r.classId; T.dash = null; PC.closeModal(); rememberClass(r.classId); PC.go('dashboard');
      }).catch(function (err) { b.disabled = false; PC.byId('ncMsg').textContent = err.message; });
    };
  }
  A.newClass = function () { PC.modal(newClassCard(false).replace('<section class="pc-card">', '<div>').replace(/<\/section>$/, '</div>') + '<p><button class="pc-btn ghost" onclick="PC.closeModal()">Cancel</button></p>'); bindNewClass(); };
  A.renameClass = function () {
    var k = T.dash.klass;
    PC.modal('<h2 id="pcModalTitle">Rename class</h2><label class="pc-field"><span>Class name</span><input class="pc-input" id="rnName" maxlength="120" value="' + esc(k.className) + '"></label><label class="pc-field"><span>Period</span><input class="pc-input" id="rnPeriod" maxlength="30" value="' + esc(k.period) + '"></label><div class="pc-row"><button class="pc-btn primary" id="rnSave">Save</button><button class="pc-btn" onclick="PC.closeModal()">Cancel</button></div>');
    PC.byId('rnSave').onclick = function () { this.disabled = true; PC.rpc('renameClass', { classId: cid(), className: PC.byId('rnName').value, period: PC.byId('rnPeriod').value }, { retry: true }).then(function (r) { PC.boot.classes = r.classes; PC.closeModal(); T.dash = null; PC.render(); }).catch(function (e) { PC.toast(e.message, 'error'); }); };
  };

  // ---------------------------------------------------------------- Grading card
  function hubHeadline() {
    var h = T.dash.hub; if (!h) return '';
    return h.needsGradingTotal > 0 ? '<span class="pc-chip is-needs">' + h.needsGradingTotal + ' to grade' + (h.needsRegradeTotal ? ' · ↻ ' + PC.plural(h.needsRegradeTotal, 'redo') : '') + '</span>' : '<span class="pc-chip is-ok">Nothing waiting on you</span>';
  }
  function gradingCard() {
    return '<section class="pc-card pc-dash-card" id="gradingCard"><div class="pc-card-head"><div class="pc-card-title"><h2>Grading</h2><span id="pcHubHead">' + hubHeadline() + '</span></div>' +
      '<div class="pc-card-actions"><button type="button" class="pc-btn small" data-act="refreshHub" title="Recount everything">↻ Refresh</button></div></div>' +
      '<p class="pc-card-sub">Open an assignment to grade it. A red number is work waiting on you; ↻ means a student redid something after you graded it.</p><div id="pcHubTiles">' + hubTilesHtml() + '</div></section>';
  }
  A.refreshHub = function () { refreshHub(true); };
  function hubTilesHtml() {
    var h = T.dash.hub;
    if (!h) return '<div class="pc-loading"><span class="pc-spinner" aria-hidden="true"></span>Counting what needs grading…</div>';
    var out = h.groups.map(function (g) {
      var waiting = g.items.reduce(function (n, t) { return n + (t.allExcluded ? 0 : t.needsGrading); }, 0);
      return '<div class="pc-group-head"><h3>' + esc(g.unitLabel) + (g.date ? ' · ' + esc(PC.fmtDay(g.date)) : '') + (g.title ? ' · ' + esc(g.title) : '') + '</h3><span class="pc-group-count">' + PC.plural(g.items.length, 'assignment') + '</span>' +
        (waiting ? '<span class="pc-group-waiting">' + waiting + ' to grade</span>' : '<span class="pc-group-clear">Nothing waiting</span>') +
        '<button type="button" class="pc-btn small pc-week-canvas" data-act="weekCanvas" data-week="' + g.week + '" title="Due dates, “available from” dates and Canvas modules for every ' + esc(g.unitLabel) + ' assignment, saved to Canvas in one go">' + (canvasLinked() ? 'Due dates &amp; Canvas…' : 'Set up Canvas…') + '</button></div>' +
        (T.weekMsgs[g.week] ? '<p class="pc-week-msg" role="status">' + esc(T.weekMsgs[g.week]) + ' <button type="button" class="pc-link" data-act="weekMsgClose" data-week="' + g.week + '">Dismiss</button></p>' : '') + '<div class="pc-tile-grid">' + g.items.map(function (t) { return tileHtml(t, g); }).join('') + '</div>';
    }).join('');
    return out;
  }
  function canvasLinked() { return !!(T.dash.canvas && T.dash.canvas.connected && (T.dash.settings.canvas || {}).courseId) || !!(T.dash.lmsHub && (T.dash.settings.canvas || {}).courseId); }
  function tileHtml(t, g) {
    var total = t.totalItems, done = t.graded, todo = t.needsGrading, rest = Math.max(0, total - done - todo);
    var status = t.allExcluded ? 'excluded' : todo ? 'needs' : 'done';
    var badge = status === 'needs' ? '<span class="pc-badge is-needs' + (t.needsRegrade ? ' has-redo' : '') + '" title="' + (t.needsRegrade ? t.needsRegrade + ' redone after grading · ' : '') + t.fresh + ' new · ' + todo + ' waiting on you">' + (t.needsRegrade ? '↻ ' : '') + todo + '</span>'
      : status === 'done' ? '<span class="pc-badge is-done" title="Nothing waiting on you here">✓</span>' : '<span class="pc-badge is-excluded" title="Left out of every student’s grade. Scores already entered are kept.">Not graded</span>';
    var worth = t.allExcluded ? 'Excluded for this class' : t.max + ' pts';
    var note = t.kind === 'quiz' ? 'Multiple choice scores itself · ' + t.answered + ' of ' + total + ' answered' : t.type === 'rubric' ? 'Rubric: 7 · 6 · 5 · 4 · 0' : t.type === 'criteria' ? 'Your Final Episode rubric: each criterion out of 7' : t.kind === 'discussion' ? 'Complete / partly / incomplete · a post or reply counts as turned in' : 'Complete / partly / incomplete, or any score';
    var action = status === 'needs' ? '<button type="button" class="pc-btn primary pc-tile-open" data-act="openMarking" data-key="' + esc(t.key) + '">Grade ' + todo + (t.needsRegrade ? ' <span class="pc-tile-open-sub">· ' + PC.plural(t.needsRegrade, 'redo') + '</span>' : '') + '<span aria-hidden="true"> →</span></button>'
      : '<button type="button" class="pc-btn pc-tile-open" data-act="openMarking" data-key="' + esc(t.key) + '">' + (status === 'done' && done ? 'Review graded work' : 'Open') + '<span aria-hidden="true"> →</span></button>';
    var body = t.allExcluded ? '<p class="pc-excluded-note">Left out of the grade for this class. Any scores you entered are kept; choose <b>Count it again</b> in the ⋯ menu to bring it back.</p>'
      : '<div class="pc-bar" role="img" aria-label="' + done + ' graded, ' + todo + ' to grade, ' + rest + ' not submitted, of ' + total + ' students"><span class="pc-bar-done" style="width:' + pct(done, total) + '%"></span><span class="pc-bar-todo" style="width:' + pct(todo, total) + '%"></span></div>' +
        '<dl class="pc-stats3"><div class="' + (todo ? 'is-todo' : '') + '"><dt>To grade</dt><dd>' + todo + '</dd></div><div><dt>Graded</dt><dd>' + done + '</dd></div><div><dt>Not submitted</dt><dd>' + rest + '</dd></div></dl>' +
        '<p class="pc-tile-note">Of ' + total + ' students' + (note ? ' · ' + esc(note) : '') + '</p>';
    var due = t.due ? '<span title="' + esc(new Date(t.due).toLocaleString()) + '">Due ' + esc(PC.fmtDate(t.due)) + '</span>' : '';
    var linked = canvasLinked(), cv = !linked ? ['Canvas not linked', ''] : !t.canvas.linked ? ['Not in Canvas yet', 'is-pending'] : t.canvas.lastPushAt ? ['Pushed ' + PC.fmtDate(t.canvas.lastPushAt), 'is-ok'] : ['In Canvas', 'is-ok'];
    var hides = 'students cannot open ' + (g.unitLabel || 'this') + '’s ' + t.kindLabel;
    var sw = '<label class="pc-switch' + (t.released ? ' is-on' : '') + '" title="' + (t.released ? 'Students can open this. Turn off and ' + hides + '; their work is kept.' : 'Hidden: ' + hides + '. Turn on to open it.') + '"><input type="checkbox" class="pcRelease" data-key="' + esc(t.key) + '"' + (t.released ? ' checked' : '') + '><span class="pc-switch-track" aria-hidden="true"></span><span class="pc-switch-text">' + (t.released ? 'Open to students' : 'Hidden from students') + '</span></label>';
    var busy = T.busy[t.key];
    var menu = '<details class="pc-more"><summary aria-label="More actions for ' + esc(t.label) + '" title="More actions">⋯</summary><div class="pc-menu" role="menu">' +
      '<button type="button" role="menuitem" data-act="tileCanvas" data-key="' + esc(t.key) + '">' + (linked ? 'Due dates &amp; Canvas (' + esc(g.unitLabel) + ')…' : 'Set up Canvas…') + '</button>' +
      '<button type="button" role="menuitem" data-act="tileCsv" data-key="' + esc(t.key) + '"' + (busy ? ' disabled' : '') + '>Download Canvas CSV</button><hr>' +
      '<button type="button" role="menuitem" class="' + (t.allExcluded ? 'is-count' : 'is-nograde') + '" data-act="tileNoGrade" data-key="' + esc(t.key) + '" data-on="' + (!t.allExcluded) + '">' + (t.allExcluded ? '↺ Count it again' : 'Don’t grade for this class') + '</button></div></details>';
    return '<article class="pc-tile pc-tile-' + t.kind + (t.released ? ' is-released' : ' is-hidden') + (status === 'needs' ? ' has-needs' : '') + (t.allExcluded ? ' is-nograde' : '') + '" style="--acc:' + (WEEK_ACC[t.week] || '#4a4f7a') + '" aria-label="' + esc(t.label) + '">' +
      '<header class="pc-tile-head" data-act="openMarking" data-key="' + esc(t.key) + '"><div class="pc-tile-id"><span class="pc-eyebrow">' + esc(g.unitLabel) + ' · ' + esc(t.kind === 'quiz' ? 'Quiz' : t.kind === 'discussion' ? 'Discussion' : t.type === 'criteria' ? 'Your rubric' : t.type === 'rubric' ? 'Rubric' : 'Complete / incomplete') + '</span><h4 class="pc-tile-title">' + esc((t.icon ? t.icon + ' ' : '') + t.kindLabel) + '</h4>' +
      '<span class="pc-tile-meta"><span>' + esc(worth) + '</span>' + due + '</span></div>' + badge + '</header>' +
      '<div class="pc-tile-body" data-act="openMarking" data-key="' + esc(t.key) + '">' + body + '</div>' + action +
      '<footer class="pc-tile-foot">' + sw + '<div class="pc-canvas-row"><span class="pc-canvas-state ' + cv[1] + '"' + (linked && t.canvas.linked ? ' title="' + esc(t.canvas.moduleName ? 'In the Canvas module “' + t.canvas.moduleName + '”' : 'Not in a Canvas module') + '"' : '') + '>' + esc(cv[0]) + '</span><span class="pc-canvas-actions">' +
      (linked ? '<button type="button" class="pc-btn small" data-act="tilePush" data-key="' + esc(t.key) + '"' + (busy ? ' disabled' : '') + ' title="Send scores, excused work and new comments to Canvas now. The assignment is made the first time and reused after that.">↗ Push</button>' : '') + menu + '</span></div>' +
      '<div class="pc-tile-msg" id="msg_' + esc(t.key) + '" aria-live="polite">' + esc(T.msgs[t.key] || '') + '</div></footer></article>';
  }
  document.addEventListener('change', function (e) {
    var r = e.target.closest('.pcRelease'); if (!r) return;
    var key = r.dataset.key, on = r.checked; r.disabled = true;
    PC.rpc('setRelease', { classId: cid(), itemKey: key, on: on }, { retry: true }).then(function (res) {
      T.dash.settings.release = res.release;
      (T.dash.hub.groups || []).forEach(function (g) { g.items.forEach(function (t) { if (t.key === key) t.released = on; }); });
      var tiles = PC.byId('pcHubTiles'); if (tiles) tiles.innerHTML = hubTilesHtml();
      var rc = PC.byId('pcReleaseCard'); if (rc) rc.outerHTML = releaseCard();
      var bn = document.querySelector('.pc-banner'); if (bn) bn.outerHTML = bannerHtml();
      PC.toast(on ? 'Open to students.' : 'Hidden from students. Their work is kept.');
    }).catch(function (err) { r.checked = !on; r.disabled = false; PC.toast(err.message, 'error'); });
  });
  A.openMarking = function (el) { PC.leave(function () { PC.go('marking', { itemKey: el.dataset.key, focusEmail: el.dataset.email || '' }); }); };
  function closeMenu(el) { var d = el.closest('details'); if (d) d.open = false; var t = el.closest('.pc-tile'); if (t) t.classList.remove('menu-open'); }
  A.tileNoGrade = function (el) {
    closeMenu(el);
    var on = el.dataset.on === 'true';
    if (on && !confirm('Leave this out of every student’s grade in this class? Scores you already entered are kept.')) return;
    PC.rpc('setNoGrade', { classId: cid(), itemKey: el.dataset.key, on: on }, { retry: true }).then(function (r) { T.dash.settings.noGrade = r.noGrade; refreshHub(true); refreshGradebook(); })
      .catch(function (e) { PC.toast(e.message, 'error'); });
  };
  function pushSummary(r) {
    if (r.notInCanvas) return 'Not in Canvas yet.';
    var bits = ['Sent ' + PC.plural(r.sent || 0, 'score') + (r.comments ? ' and ' + PC.plural(r.comments, 'comment') : '') + ' to Canvas' + (r.created ? ' (made the assignment)' : '') + '.'];
    if (r.excused && r.excused.length) bits.push(PC.plural(r.excused.length, 'student') + ' marked Excused.');
    if (r.unexcused && r.unexcused.length) bits.push('Excusal lifted for ' + r.unexcused.join(', ') + '.');
    if (r.unmarked && r.unmarked.length) bits.push('Not marked yet (left blank): ' + r.unmarked.join(', ') + '.');
    if (r.unmatched && r.unmatched.length) bits.push('Not found in the Canvas course: ' + r.unmatched.join(', ') + '.');
    (r.warnings || []).forEach(function (w) { bits.push(w); });
    return bits.join(' ');
  }
  A.tilePush = function (el) {
    var key = el.dataset.key; T.busy[key] = true; el.disabled = true; setMsg(key, 'Sending to Canvas…');
    PC.rpc('pushCanvasGrades', { classId: cid(), itemKey: key }).then(function (r) {
      T.busy[key] = false; setMsg(key, pushSummary(r));
      (T.dash.hub.groups || []).forEach(function (g) { g.items.forEach(function (t) { if (t.key === key) t.canvas = { linked: true, lastPushAt: r.lastPushAt, htmlUrl: r.htmlUrl }; }); });
      refreshTilesKeepMsgs();
    }).catch(function (e) { T.busy[key] = false; setMsg(key, e.message); refreshTilesKeepMsgs(); });
  };
  function setMsg(key, m) { T.msgs[key] = m; var el = PC.byId('msg_' + key); if (el) el.textContent = m; }
  function refreshTilesKeepMsgs() { var tiles = PC.byId('pcHubTiles'); if (tiles) tiles.innerHTML = hubTilesHtml(); }
  A.tileCsv = function (el) {
    closeMenu(el);
    var key = el.dataset.key;
    PC.rpc('exportCanvasCsv', { classId: cid(), itemKey: key }).then(function (r) {
      var blob = new Blob([r.csv], { type: 'text/csv' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = r.filename; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      setMsg(key, 'Downloaded ' + r.filename + '. Import it in Canvas: Grades → Import.');
    }).catch(function (e) { setMsg(key, e.message); });
  };
  // ---------------------------------------------------------------- Week N · Due dates & Canvas (2026-10-22a, from Lit Circles)
  // One window per week: every graded assignment's due date and "available from" date, the week's
  // Canvas module and (if it differs) each assignment's own module. Save makes or updates them all in
  // Canvas. A tile's "Due dates & Canvas…" opens its week here.
  function openCanvasSetup() { T.setupOpen = true; var s = PC.byId('pcSetup'); if (s) { s.open = true; var c = PC.byId('pcCanvasCard'); if (c) c.scrollIntoView({ behavior: 'smooth' }); } }
  A.tileCanvas = function (el) {
    var key = el.dataset.key; closeMenu(el);
    if (!canvasLinked()) return openCanvasSetup();
    openWeekCanvas(Number((/^w(\d+)_/.exec(key) || [])[1]), key);
  };
  A.weekCanvas = function (el) { if (!canvasLinked()) return openCanvasSetup(); openWeekCanvas(Number(el.dataset.week), ''); };
  A.weekMsgClose = function (el) { delete T.weekMsgs[el.dataset.week]; refreshTilesKeepMsgs(); };
  var DUE_TIME = '23:59', OPEN_TIME = '00:00';
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Picks every email address out of whatever is pasted: one per line, a spreadsheet column, a Canvas

  var BS_EMAIL_RE = /[^\s<>(),;:\x22\x27\[\]]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
  function bsParse(text) {
    var out = [], bad = [], seen = {}, dup = 0;
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim(); if (!line) return;
      var ems = line.match(BS_EMAIL_RE);
      if (!ems) { if (!/^(name|email|e-mail|student|first|last|login)\b/i.test(line)) bad.push(line); return; }
      ems.forEach(function (e) { e = String(e).toLowerCase().replace(/^mailto:/, '').replace(/\.+$/, ''); if (seen[e]) { dup++; return; } seen[e] = 1; out.push({ email: e }); });
    });
    return { entries: out, bad: bad, dup: dup };

    var p = bsParse(ta.value), have = bsRosterEmails(PC.byId('bsClass').value);
    var already = have ? p.entries.filter(function (x) { return have[x.email]; }) : [], fresh = have ? p.entries.filter(function (x) { return !have[x.email]; }) : p.entries;
    btn.disabled = !fresh.length; btn.textContent = fresh.length ? 'Add ' + PC.plural(fresh.length, 'student') : 'Add students';
    if (!p.entries.length && !p.bad.length) { box.innerHTML = ''; return; }
    var doms = {}; p.entries.forEach(function (x) { var d = x.email.split('@')[1]; doms[d] = (doms[d] || 0) + 1; });
    var domList = Object.keys(doms).sort(function (a, b) { return doms[b] - doms[a]; });
    // A domain used by only a few addresses when most use another is probably a typo.
    var odd = domList.length > 1 ? domList.slice(1).filter(function (d) { return doms[d] <= Math.max(1, Math.floor(p.entries.length * 0.2)); }) : [];
    box.innerHTML = '<div class="pc-bs-summary"><span class="pc-chip is-ok">' + fresh.length + ' ready to add</span>' + (already.length ? '<span class="pc-chip">' + already.length + ' already in this class</span>' : '') + (p.dup ? '<span class="pc-chip">' + PC.plural(p.dup, 'duplicate') + ' ignored</span>' : '') +
      domList.map(function (d) { var o = odd.indexOf(d) >= 0; return '<span class="pc-chip' + (o ? ' is-warn' : '') + '" title="' + (o ? 'Different from most of the list: check for a typo' : 'Email domain') + '">@' + esc(d) + ' · ' + doms[d] + '</span>'; }).join('') + '</div>' +
      (p.bad.length ? '<p class="pc-bs-bad"><b>Not an email, skipped (' + p.bad.length + '):</b> ' + p.bad.slice(0, 6).map(esc).join(' · ') + (p.bad.length > 6 ? ' …' : '') + '</p>' : '') +
      (fresh.length ? '<div class="pc-bs-list"><table class="pc-table"><thead><tr><th>Email</th><th>Name</th></tr></thead><tbody>' + fresh.slice(0, 200).map(function (x) { var o = odd.indexOf(x.email.split('@')[1]) >= 0; return '<tr><td>' + esc(x.email) + (o ? ' <span class="pc-chip is-warn">check</span>' : '') + '</td><td class="pc-muted">the student types it</td></tr>'; }).join('') + '</tbody></table>' + (fresh.length > 200 ? '<p class="pc-small pc-muted">…and ' + (fresh.length - 200) + ' more.</p>' : '') + '</div>' : '');
  }
  function bsAddNow(btn) {
    var p = bsParse(PC.byId('bsText').value), classId = PC.byId('bsClass').value, have = bsRosterEmails(classId);
    var entries = have ? p.entries.filter(function (x) { return !have[x.email]; }) : p.entries; if (!entries.length) return;
    btn.disabled = true; btn.textContent = 'Adding…'; PC.byId('bsMsg').textContent = '';
    PC.rpc('addStudentsByEmail', { classId: classId, entries: entries }).then(function (r) {
      var n = r.added + r.readded, bits = ['Added ' + PC.plural(n, 'student') + ' to ' + r.className + '.'];
      if (r.readded) bits.push(r.readded + ' had been removed before and are back, with their earlier work.');
      if (r.already.length) bits.push(r.already.length + ' were already in the class.');
      if (r.invalid.length) bits.push('Skipped: ' + r.invalid.slice(0, 5).join(', ') + (r.invalid.length > 5 ? '…' : '') + '.');
      PC.closeModal(); PC.toast(bits.join(' '), 'ok'); T.studentsOpen = true;
      if (String(classId) === String(cid())) PC.loadDash(function () { drawDash(PC.byId('app')); });
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Add students'; PC.byId('bsMsg').textContent = e.message; });
  }
  A.renameStudent = function (el) {
    var n = prompt('Name for ' + el.dataset.email, el.dataset.name); if (!n || n === el.dataset.name) return;
    PC.rpc('renameStudent', { classId: cid(), email: el.dataset.email, name: n }, { retry: true }).then(function () { PC.loadDash(function () { drawDash(PC.byId('app')); }); }).catch(function (e) { PC.toast(e.message, 'error'); });
  };
  A.removeStudent = function (el) {
    if (!confirm('Remove ' + el.dataset.name + ' from this class? They will no longer see it. Their work is kept, and adding them again (by email or with the code) brings it back.')) return;
    PC.rpc('removeStudent', { classId: cid(), email: el.dataset.email }, { retry: true }).then(function () { PC.loadDash(function () { drawDash(PC.byId('app')); }); }).catch(function (e) { PC.toast(e.message, 'error'); });
  };

  // ---------------------------------------------------------------- Release (every activity, lessons too)
  function releaseCard() {
    var rel = (T.dash.settings || {}).release || {}, units = (T.dash.study || {}).units || [];
    return '<section class="pc-sub" id="pcReleaseCard"><h3>Open to students</h3><p class="pc-small pc-muted">A week appears for students once anything in it is open. Turning something off only hides it: nothing students wrote is ever deleted, and grades are kept.</p>' +
      '<div class="pc-rel-weeks">' + units.map(function (u) {
        var keys = u.activities.map(function (a) { return 'w' + u.n + '_' + a.id; }), openN = keys.filter(function (k) { return rel[k] === true; }).length;
        return '<article class="pc-rel-week" style="--acc:' + (WEEK_ACC[u.n] || '#4a4f7a') + '"><header><div><span class="pc-eyebrow">Week ' + u.n + '</span><h4>' + esc(u.title) + '</h4><span class="pc-small pc-muted">' + openN + ' of ' + keys.length + ' open</span></div>' +
          '<div class="pc-row">' + (openN < keys.length ? '<button type="button" class="pc-btn small primary" data-act="weekOpen" data-week="' + u.n + '" data-on="true">Open all of Week ' + u.n + '</button>' : '') + (openN ? '<button type="button" class="pc-btn small ghost" data-act="weekOpen" data-week="' + u.n + '" data-on="false">Hide all</button>' : '') + '</div></header>' +
          '<ul class="pc-rel-list">' + u.activities.map(function (a) {
            var k = 'w' + u.n + '_' + a.id, on = rel[k] === true, what = a.form === 'lesson' ? 'students can’t read this lesson' : 'students can’t open or turn in “' + a.title + '”';
            return '<li><span class="pc-rel-name">' + esc(a.icon + ' ' + a.title) + '<small>' + (a.form === 'lesson' ? 'Lesson · not graded' : a.form === 'quiz' ? 'Quiz · ' + a.points + ' pts' : a.points + ' pts') + '</small></span>' +
              '<label class="pc-switch' + (on ? ' is-on' : '') + '" title="' + (on ? 'Open. Turn off and ' + what + '; their work is kept.' : 'Hidden: ' + what + '. Turn on to open it.') + '"><input type="checkbox" class="pcRelItem" data-key="' + esc(k) + '"' + (on ? ' checked' : '') + '><span class="pc-switch-track" aria-hidden="true"></span><span class="pc-switch-text">' + (on ? 'Open to students' : 'Hidden from students') + '</span></label></li>';
          }).join('') + '</ul></article>';
      }).join('') + '</div></section>';
  }
  function afterRelease(release) {
    T.dash.settings.release = release;
    (T.dash.hub.groups || []).forEach(function (g) { g.items.forEach(function (t) { t.released = release[t.key] === true; }); });
    var tiles = PC.byId('pcHubTiles'); if (tiles) tiles.innerHTML = hubTilesHtml();
    var rc = PC.byId('pcReleaseCard'); if (rc) rc.outerHTML = releaseCard();
    var b = document.querySelector('.pc-banner'); if (b) b.outerHTML = bannerHtml();
  }
  document.addEventListener('change', function (e) {
    var r = e.target.closest('.pcRelItem'); if (!r) return;
    var key = r.dataset.key, on = r.checked; r.disabled = true;
    PC.rpc('setRelease', { classId: cid(), itemKey: key, on: on }, { retry: true }).then(function (res) { afterRelease(res.release); PC.toast(on ? 'Open to students.' : 'Hidden from students. Their work is kept.'); })
      .catch(function (err) { r.checked = !on; r.disabled = false; PC.toast(err.message, 'error'); });
  });
  A.weekOpen = function (el) {
    var on = el.dataset.on === 'true'; el.disabled = true;
    PC.rpc('setWeekRelease', { classId: cid(), week: Number(el.dataset.week), on: on }, { retry: true }).then(function (res) { afterRelease(res.release); PC.toast(on ? 'Week ' + el.dataset.week + ' is open to students.' : 'Week ' + el.dataset.week + ' is hidden. Students’ work is kept.'); })
      .catch(function (e) { el.disabled = false; PC.toast(e.message, 'error'); });
  };

  // ---------------------------------------------------------------- Canva template links
  function canvaCard() {
    var c = T.dash.canva || {};
    return '<section class="pc-sub" id="pcCanvaCard"><h3>Ready-to-use resources</h3><p class="pc-small pc-muted">The cover maker, printable run-sheet starter, research notebook and question preparation are built into the student pages. No template setup is needed. You can optionally add your own Canva template links below; these appear alongside the built-in resources.</p>' +
      '<div class="pc-form-grid"><label class="pc-field"><span>Optional Canva cover template</span><input class="pc-input" id="cvaCover" placeholder="https:&#47;&#47;www.canva.com/design/…" value="' + esc(c.cover || '') + '"></label>' +
      '<label class="pc-field"><span>Optional Canva run-sheet template</span><input class="pc-input" id="cvaRun" placeholder="https:&#47;&#47;www.canva.com/design/…" value="' + esc(c.runsheet || '') + '"></label></div>' +
      '<div class="pc-row"><button type="button" class="pc-btn small primary" data-act="saveCanva">Save template links</button><span class="pc-form-msg" id="cvaMsg" role="status"></span></div></section>';
  }
  A.saveCanva = function (el) {
    el.disabled = true;
    PC.rpc('saveCanvaLinks', { classId: cid(), links: { cover: PC.byId('cvaCover').value, runsheet: PC.byId('cvaRun').value } }, { retry: true }).then(function (r) {
      el.disabled = false; T.dash.canva = r.canva; PC.byId('cvaMsg').textContent = 'Saved.';
    }).catch(function (e) { el.disabled = false; PC.byId('cvaMsg').textContent = e.message; });
  };

  // ---------------------------------------------------------------- Canvas card
  function canvasCard() {
    var d = T.dash, c = d.canvas || {}, s = (d.settings || {}).canvas || {};
    var h = '<section class="pc-sub" id="pcCanvasCard"><h3>Canvas</h3>';
    if (d.lmsHub) h += '<p class="pc-small pc-chip is-ok">Pushes go through your LMS Hub.</p>';
    if (!c.connected) {
      h += '<p class="pc-muted">Connect once with a Canvas access token (Canvas → Account → Settings → New Access Token). Your token is stored for you only.</p><div class="pc-form-grid"><label class="pc-field"><span>Canvas address</span><input class="pc-input" id="cvUrl" placeholder="https:&#47;&#47;yourschool.instructure.com"></label><label class="pc-field"><span>Access token</span><input class="pc-input" id="cvToken" type="password" autocomplete="off"></label></div><div class="pc-row"><button class="pc-btn primary" data-act="cvConnect">Connect Canvas</button><span class="pc-form-msg" id="cvMsg" role="status"></span></div>';
    } else {
      h += '<p>Connected to <b>' + esc(c.baseUrl) + '</b>. <button type="button" class="pc-link" data-act="cvDisconnect">Disconnect</button></p>';
      h += s.courseId ? '<p>This class pushes to <b>' + esc(s.courseName || s.courseId) + '</b>' + (s.assignmentGroupName ? ', assignment group <b>' + esc(s.assignmentGroupName) + '</b>' : '') + '. <button type="button" class="pc-link" data-act="cvUnlink">Change course</button></p><p class="pc-small pc-muted">Each assignment is made in Canvas the first time you press ↗ Push on its tile (or Save in a week’s Due dates &amp; Canvas…), and reused after that. Excluded work is sent as Excused.</p>' + unitModuleHtml(s)
        : '<div class="pc-row"><button class="pc-btn" data-act="cvCourses">Choose the Canvas course…</button><span class="pc-form-msg" id="cvMsg" role="status"></span></div><div id="cvPick"></div>';
    }
    return h + '</section>';
  }
  // The module every Podcast Studio assignment goes in (a week or one assignment can differ).
  function unitModuleHtml(s) {
    var mods = T.modules[s.courseId], cur = s.unitModule && s.unitModule.moduleId ? String(s.unitModule.moduleId) : '';
    if (!mods) setTimeout(loadUnitModules, 0);
    var opts = mods ? '<option value="">(No module)</option>' + mods.map(function (m) { return '<option value="' + esc(m.id) + '"' + (String(m.id) === cur ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('')
      : '<option value="' + esc(cur) + '">' + esc(cur ? (s.unitModule.moduleName || 'Loading…') : 'Loading modules…') + '</option>';
    return '<div class="pc-unit-module"><label class="pc-field"><span>Canvas module for Podcast Studio assignments</span><select class="pc-input" id="cvUnitModule">' + opts + '</select></label>' +
      '<button type="button" class="pc-btn small" data-act="cvSaveModule"' + (mods ? '' : ' disabled') + '>Save module</button><span class="pc-form-msg" id="cvModMsg" role="status"></span></div>' +
      '<p class="pc-small pc-muted">Assignments go in this module when they’re made in Canvas, unless a week or one assignment is set to a different module (each week’s <b>Due dates &amp; Canvas…</b> on the Grading card). Saving also moves the assignments already in Canvas that use this default.</p>';
  }
  var loadingMods = false;
  function loadUnitModules() {
    var s = (T.dash.settings || {}).canvas || {}; if (loadingMods || !s.courseId || T.modules[s.courseId]) return;
    loadingMods = true;
    PC.rpc('listCanvasModules', { classId: cid() }).then(function (r) {
      loadingMods = false; T.modules[s.courseId] = r.modules;
      var box = document.querySelector('.pc-unit-module'); if (box && document.activeElement !== PC.byId('cvUnitModule')) box.outerHTML = unitModuleHtml(s).replace(/<p class=.pc-small pc-muted.>[\s\S]*$/, '');
    }).catch(function (e) { loadingMods = false; var m = PC.byId('cvModMsg'); if (m) m.textContent = 'Couldn’t load the modules: ' + e.message; });
  }
  A.cvSaveModule = function (el) {
    var sel = PC.byId('cvUnitModule'), id = sel.value, name = id ? sel.options[sel.selectedIndex].text : '';
    el.disabled = true; PC.byId('cvModMsg').textContent = 'Saving…';
    PC.rpc('saveUnitModule', { classId: cid(), module: { moduleId: id, moduleName: name } }).then(function (r) {
      el.disabled = false; if (r.canvas) T.dash.settings.canvas = r.canvas; else T.dash.settings.canvas.unitModule = r.unitModule;
      PC.byId('cvModMsg').textContent = 'Saved.' + (r.moved.length ? ' Moved ' + PC.plural(r.moved.length, 'assignment') + ' already in Canvas.' : '') + (r.warnings.length ? ' ' + r.warnings.join(' ') : '');
      refreshHub();
    }).catch(function (e) { el.disabled = false; PC.byId('cvModMsg').textContent = e.message; });
  };
  A.cvConnect = function (el) { el.disabled = true; PC.rpc('saveCanvasConnection', { baseUrl: PC.byId('cvUrl').value, token: PC.byId('cvToken').value }).then(function (r) { T.dash.canvas = r.canvas; PC.boot.canvas = r.canvas; T.setupOpen = true; drawDash(PC.byId('app')); PC.toast('Canvas is connected' + (r.canvas.name ? ' as ' + r.canvas.name : '') + '.'); }).catch(function (e) { el.disabled = false; PC.byId('cvMsg').textContent = e.message; }); };
  A.cvDisconnect = function () { if (!confirm('Disconnect Canvas for your account?')) return; PC.rpc('clearCanvasConnection', {}).then(function (r) { T.dash.canvas = r.canvas; drawDash(PC.byId('app')); }); };
  A.cvUnlink = function () { if (!confirm('Unlink this class from its Canvas course? Assignments already in Canvas stay there.')) return; PC.rpc('unlinkCanvasCourse', { classId: cid() }).then(function () { PC.loadDash(function () { T.setupOpen = true; drawDash(PC.byId('app')); }); }); };
  A.cvCourses = function (el) {
    el.disabled = true; PC.byId('cvMsg').textContent = 'Loading your courses…';
    PC.rpc('listCanvasCourses', {}).then(function (r) {
      PC.byId('cvMsg').textContent = '';
      PC.byId('cvPick').innerHTML = '<div class="pc-form-grid"><label class="pc-field"><span>Course</span><select class="pc-input" id="cvCourse"><option value="">Choose…</option>' + r.courses.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + (c.term ? ' (' + esc(c.term) + ')' : '') + '</option>'; }).join('') + '</select></label><label class="pc-field"><span>Assignment group <small>(optional)</small></span><select class="pc-input" id="cvGroup"><option value="">Canvas default</option></select></label></div><button class="pc-btn primary" data-act="cvLink">Link this class</button>';
      PC.byId('cvCourse').onchange = function () { var id = this.value; if (!id) return; PC.rpc('listCanvasGroups', { courseId: id }).then(function (g) { PC.byId('cvGroup').innerHTML = '<option value="">Canvas default</option>' + g.groups.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + '</option>'; }).join(''); }); };
    }).catch(function (e) { el.disabled = false; PC.byId('cvMsg').textContent = e.message; });
  };
  A.cvLink = function (el) {
    var c = PC.byId('cvCourse').value; if (!c) return PC.toast('Choose a course.');
    el.disabled = true; PC.rpc('linkCanvasCourse', { classId: cid(), courseId: c, assignmentGroupId: PC.byId('cvGroup').value }).then(function (r) { T.dash.settings.canvas = r.canvas; T.setupOpen = true; drawDash(PC.byId('app')); PC.toast('Linked to ' + r.canvas.courseName + '.'); }).catch(function (e) { el.disabled = false; PC.toast(e.message, 'error'); });
  };

  // ---------------------------------------------------------------- Admin
  PC.views.admin = function (app) {
    app.innerHTML = '<section class="pc-card pc-skeleton"><p>Loading access…</p></section>';
    PC.rpc('adminListAccess', {}, { retry: true }).then(function (r) { drawAdmin(app, r); }).catch(function (e) { PC.fail(app, e); });
  };
  function drawAdmin(app, r) {
    app.innerHTML = '<section class="pc-card"><h1>Admin</h1><p class="pc-muted">Teachers listed here can make classes and use the Teacher view. Everyone else who signs in is a student.</p>' +
      '<form id="adForm" class="pc-inline-form"><label class="pc-field"><span>School email</span><input class="pc-input" id="adEmail" type="email" required></label><label class="pc-field"><span>Name</span><input class="pc-input" id="adName"></label><label class="pc-field pc-field-sm"><span>Role</span><select class="pc-input" id="adRole"><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label><button class="pc-btn primary" type="submit">Add or update</button></form><p class="pc-form-msg" id="adMsg" role="alert"></p>' +
      '<div class="pc-table-wrap"><table class="pc-table"><thead><tr><th>Person</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>' + r.users.map(function (u) {
        return '<tr><td>' + esc(u.name) + '<div class="pc-small pc-muted">' + esc(u.email) + '</div></td><td>' + esc(u.role) + '</td><td>' + (u.status === 'active' ? '<span class="pc-chip is-ok">Active</span>' : '<span class="pc-chip">Off</span>') + '</td><td><button class="pc-btn small" data-act="adToggle" data-email="' + esc(u.email) + '" data-name="' + esc(u.name) + '" data-role="' + esc(u.role) + '" data-status="' + (u.status === 'active' ? 'inactive' : 'active') + '">' + (u.status === 'active' ? 'Turn off' : 'Turn on') + '</button></td></tr>';
      }).join('') + '</tbody></table></div></section>' +
      '<section class="pc-card"><h2>Every class</h2>' + (r.classes.length ? '<ul class="pc-plain">' + r.classes.map(function (c) { return '<li><b>' + esc(c.className) + '</b>' + (c.period ? ' · Period ' + esc(c.period) : '') + ' · ' + esc(c.teacherEmail) + ' · code ' + esc(c.joinCode) + '</li>'; }).join('') + '</ul>' : '<p class="pc-muted">No classes yet.</p>') + '</section>';
    PC.byId('adForm').onsubmit = function (e) { e.preventDefault(); PC.rpc('adminSetAccess', { email: PC.byId('adEmail').value, name: PC.byId('adName').value, role: PC.byId('adRole').value, status: 'active' }).then(function (x) { drawAdmin(app, x); PC.toast('Saved.'); }).catch(function (err) { PC.byId('adMsg').textContent = err.message; }); };
  }
  A.adToggle = function (el) { PC.rpc('adminSetAccess', { email: el.dataset.email, name: el.dataset.name, role: el.dataset.role, status: el.dataset.status }).then(function (x) { drawAdmin(PC.byId('app'), x); }).catch(function (e) { PC.toast(e.message, 'error'); }); };

  PC.teacher = { hubTilesHtml: hubTilesHtml, refreshHub: refreshHub, refreshGradebook: refreshGradebook, pushSummary: pushSummary };
  window.__MB.Teacher = 'ok';
})();
</script>
