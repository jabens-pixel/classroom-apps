<style>
/* ============================================================================
   Podcast Studio -- the look. Presentation only (no saving or grading logic). Included LAST.
   Raleway for headings (the class slide deck's face), Public Sans for the interface. A dark studio
   top bar, warm grey paper, one raspberry accent (the deck's microphone) for actions, red only for
   work waiting on the teacher. Each week has its own colour (teal, amber, raspberry).
   ========================================================================== */
:root{
  --paper:#f3f1ee; --card:#ffffff; --ink:#17191f; --muted:#555c67; --line:#dedad4; --line2:#ebe7e1;
  --accent:#a3324f; --accent-2:#842740; --accent-soft:#f8e8ed; --wine:#842740; --gold:#7a5410;
  --needs:#b42318; --needs-2:#8c1d17; --ok:#1e6b43; --ok-soft:#e8f5ec; --warn:#8a5a00; --warn-soft:#fff6df;
  --w1:#1f6f78; --w2:#8a5a12; --w3:#a3324f; --studio:#1b1b1d;
  --serif:'Raleway','Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --page-max:1640px; --gutter:clamp(16px,2.4vw,40px);
  --r:14px; --shadow:0 1px 2px rgba(23,25,31,.06),0 6px 18px rgba(23,25,31,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);line-height:1.2;margin:0 0 .4em}
h1{font-size:30px;font-weight:700} h2{font-size:22px;font-weight:650} h3{font-size:17px;font-weight:650} h4{font-size:16px}
p{margin:.4em 0 .8em} a{color:var(--accent)} small{font-size:.82em}
.pc-muted{color:var(--muted)} .pc-small{font-size:13.5px} .pc-empty{color:var(--muted);font-style:italic;margin:10px 0}
.pc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.pc-plain{padding-left:18px}
.pc-eyebrow{display:block;font:800 11px/1.3 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar: Student · Teacher · Admin ---------- */
.pc-top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pc-top-inner{max-width:var(--page-max);margin:0 auto;display:flex;align-items:center;gap:16px;padding:9px 18px;flex-wrap:wrap}
.pc-brand{display:flex;align-items:center;gap:10px;font:700 18px var(--serif);letter-spacing:.01em}
.pc-brand-mark{width:22px;height:26px;border-radius:3px 6px 6px 3px;background:linear-gradient(90deg,#c9a24a 0 4px,#f6efe0 4px);box-shadow:inset -2px 0 0 rgba(0,0,0,.08)}
.pc-roles{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
.pc-role{border:0;background:transparent;color:#e8edf3;font:700 13.5px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer}
.pc-role:hover{background:rgba(255,255,255,.12)}
.pc-role.is-on{background:#fff;color:var(--ink)}
.pc-role:focus-visible{outline:2px solid #f6d65a;outline-offset:2px}
.pc-account{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#d6dde6;min-width:0}
.pc-account-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.pc-build{font-size:11px;padding:2px 7px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:#e8edf3}
.pc-update{position:sticky;top:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:#fff3cd;color:#4a3a06;font-weight:600;font-size:14px;border-bottom:1px solid #e9d38a}

/* ---------- layout + cards ---------- */
.pc-app{max-width:var(--page-max);margin:0 auto;padding:20px var(--gutter) 80px}
.pc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;margin:0 0 16px}
.pc-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pc-card-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0} .pc-card-title h2{margin:0}
.pc-card-actions{display:flex;gap:8px;margin-left:auto}
.pc-card-sub{color:var(--muted);font-size:14px;max-width:820px;margin:6px 0 4px}
.pc-skeleton{color:var(--muted)}
.pc-error{border-color:#e6b4ae;background:#fff7f5}
.pc-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pc-fold>summary::-webkit-details-marker{display:none}
.pc-fold>summary h2{margin:0}
.pc-fold>summary h2::before{content:"▸";display:inline-block;margin-right:9px;color:var(--gold);transition:transform .15s}
.pc-fold[open]>summary h2::before{transform:rotate(90deg)}
.pc-fold[open]>summary{margin-bottom:12px}
.pc-sub{border-top:1px solid var(--line2);padding-top:16px;margin-top:16px}
.pc-crumbs{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:var(--muted);font-size:14px;flex-wrap:wrap}

/* ---------- controls ---------- */
.pc-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 15px;border:1px solid #c9c0b0;border-radius:10px;background:#fff;color:var(--ink);font:650 14.5px var(--sans);text-decoration:none;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.pc-btn:hover{border-color:var(--accent);background:#fbfaf6}
.pc-btn:focus-visible,.pc-input:focus-visible,.pc-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pc-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pc-btn.primary:hover{background:var(--accent-2)}
.pc-btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.pc-btn.ghost:hover{background:var(--accent-soft)}
.pc-btn.small{min-height:32px;padding:5px 11px;font-size:13px;border-radius:8px}
.pc-btn.is-danger{color:var(--needs)} .pc-btn.is-danger:hover{background:#fdeceb}
.pc-btn:disabled{background:#eceae6;border-color:#d4d0c9;color:#5d636c;cursor:wait}
.pc-btn.primary:disabled{background:#c99aa7;border-color:#c99aa7;color:#2a1018}
.pc-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pc-icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px}
.pc-icon-btn:hover{background:#f3eee5;color:var(--needs)}
.pc-field{display:flex;flex-direction:column;gap:4px;margin:8px 0;min-width:0}
.pc-field>span{font-weight:700;font-size:13.5px} .pc-field>span small{font-weight:500;color:var(--muted)} .pc-field>small{color:var(--muted)}
.pc-field-sm{max-width:160px}
.pc-input{width:100%;min-width:0;font:15px/1.45 var(--sans);color:var(--ink);background:#fff;border:1px solid #cbc2b3;border-radius:9px;padding:9px 11px}
textarea.pc-input{resize:vertical}
.pc-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,92,88,.15);outline:none}
.pc-input:disabled,.pc-input[readonly]{background:#f7f4ee;color:#3b4552}
.pc-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.pc-inline-form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.pc-inline-form .pc-field{flex:1 1 200px}
.pc-form-msg{font-size:13.5px;color:var(--muted)} p.pc-form-msg{color:var(--needs);font-weight:600}
.pc-check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px}
.pc-check input{width:18px;height:18px;accent-color:var(--accent)}
.pc-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:#faf8f3;color:#3d4653;font-size:12.5px;font-weight:650;white-space:nowrap}
.pc-chip.is-ok{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.pc-chip.is-warn{background:var(--warn-soft);border-color:#ead8a9;color:var(--warn)}
.pc-chip.is-needs{background:var(--needs);border-color:var(--needs);color:#fff}
.pc-demo-tag{display:inline-block;padding:0 6px;border-radius:5px;background:#eef0ff;color:#3b4890;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}

/* highlight colors (the class key) */
.pc-swatch{display:inline-block;flex:0 0 auto;width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);vertical-align:-3px}

/* ---------- student: classes + home ---------- */
.pc-class-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pc-class-pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.pc-class-pick:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.pc-class-pick-name{font:700 17px var(--serif)} .pc-class-pick-book{color:var(--muted);font-size:14px}
.pc-join{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
.pc-code-input{text-transform:uppercase;letter-spacing:.18em;font-weight:800}
.pc-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start;padding:24px} .pc-book-author{color:var(--muted);font-size:16px;margin-bottom:10px;font-family:var(--serif);font-style:italic}
.pc-hero-note{color:var(--muted);font-size:14.5px;margin:4px 0 10px}
.pc-resume{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px;margin:0 0 16px;padding:14px 18px;border:1px solid #bcd7d3;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-2);font:600 15px var(--sans);cursor:pointer;text-align:left}
.pc-resume b{font-size:16px} .pc-resume:hover{border-color:var(--accent)}
.pc-weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.pc-week-card{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pc-week-head h3{font-size:19px;margin:3px 0 0}
.pc-eq-mini{font-family:var(--serif);font-style:italic;color:#3b4552;font-size:14.5px;margin:0}
.pc-week-items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pc-week-items li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 8px;border-radius:7px;background:#faf8f3}
.pc-week-items li span{font-weight:700} .pc-week-items li em{font-style:normal;color:var(--muted);text-align:right}
.pc-week-items li.is-in em,.pc-week-items li.is-graded em{color:var(--ok);font-weight:700}
.pc-week-items li.is-progress em{color:var(--warn);font-weight:700}
.pc-week-items li.is-locked{background:transparent;border:1px dashed var(--line)} .pc-week-items li.is-locked em{color:var(--muted)}
.pc-week-open{margin-top:auto}

/* ---------- student: a week ---------- */
.pc-week-banner{margin:0 0 14px}
.pc-week-banner h1{font-size:32px;margin:4px 0 8px}
.pc-eq{position:relative;margin:8px 0 4px;padding:12px 16px 12px 18px;border-left:4px solid var(--gold);background:#fbf6ea;border-radius:0 10px 10px 0;font:500 17px/1.45 var(--serif);color:#2a2f38}
.pc-eq span{display:block;font:800 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.pc-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 16px;padding:5px;background:#ebe5d9;border-radius:14px}
.pc-step{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 8px;border:0;border-radius:10px;background:transparent;color:#3b4552;font:700 14.5px var(--sans);cursor:pointer}
.pc-step:hover{background:rgba(255,255,255,.6)}
.pc-step.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pc-step-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#d6cebf;color:#3b4552;font-size:12.5px;font-weight:800}
.pc-step.is-on .pc-step-n{background:var(--accent);color:#fff}
.pc-step.st-in .pc-step-n,.pc-step.st-graded .pc-step-n{background:var(--ok);color:#fff}
.pc-step.is-locked{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px)}
.pc-step-dot{position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pc-step.st-in .pc-step-dot,.pc-step.st-graded .pc-step-dot{background:var(--ok)}
.pc-practice{display:inline-block;margin:0 0 10px;padding:4px 11px;border-radius:999px;background:#f0ede6;color:#4b5563;font-size:12.5px;font-weight:700}
.pc-next{display:flex;justify-content:flex-end;margin-top:14px}
.pc-graded-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.pc-graded-badge{display:inline-flex;padding:4px 11px;border-radius:999px;background:var(--wine);color:#fff;font-size:12.5px;font-weight:750}
.pc-status{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:750;border:1px solid var(--line);background:#fff;color:#3b4552}
.pc-status-in,.pc-status-graded{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)}
.pc-status-progress{background:var(--warn-soft);border-color:#ead8a9;color:var(--warn)}
.pc-due{font-size:13px;color:var(--muted);font-weight:650}
.pc-prompt{margin:6px 0 12px;padding:12px 15px;border:1px solid var(--line2);border-radius:10px;background:#fff;font:500 16.5px/1.5 var(--serif)}
.pc-howscored{margin:6px 0 12px;font-size:14px} .pc-howscored summary{cursor:pointer;font-weight:700;color:var(--accent)}
.pc-rubric-list{margin:8px 0;padding-left:18px;display:grid;gap:5px;font-size:14px}
.pc-feedback{margin:10px 0 14px;padding:12px 15px;border-radius:10px;background:var(--ok-soft);border:1px solid #bfe0cb}
.pc-feedback h3{font-family:var(--sans);font-size:15px;color:var(--ok);margin:0 0 4px}
.pc-offer{margin:10px 0;padding:12px 15px;border:2px solid #e6c56a;border-radius:12px;background:var(--warn-soft)}
.pc-offer p{margin:0 0 6px}
.pc-ribbon{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#24303d;color:#fff;font-size:14px}
.pc-ribbon.is-demo{background:#3b4890} .pc-ribbon.is-preview{background:#5b4a1a}
.pc-ribbon .pc-btn{background:#fff}
/* evidence log */


/* quiz */
.pc-quiz-progress{font-weight:650;color:#3b4552}
.pc-qlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:12px}
.pc-q{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pc-q-text{display:flex;gap:10px;font:600 16.5px/1.45 var(--serif);margin:0 0 10px}
.pc-q-n{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font:800 12.5px var(--sans)}
.pc-choices{display:grid;gap:7px}
.pc-choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid #d6cdbd;border-radius:10px;background:#fdfcf9;font:15px/1.4 var(--sans);color:var(--ink);cursor:pointer}
.pc-choice:hover:not(:disabled){border-color:var(--accent);background:#fff}
.pc-choice:disabled{cursor:default;color:#3b4552}
.pc-choice-l{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#efe9de;font-weight:800;font-size:13px}
.pc-choice-mark{margin-left:auto;font-weight:900}
.pc-choice.is-right{border-color:#7cc196;background:var(--ok-soft)} .pc-choice.is-right .pc-choice-l{background:var(--ok);color:#fff}
.pc-choice.is-wrong{border-color:#e0a9a6;background:#fdf1f0} .pc-choice.is-wrong .pc-choice-l{background:#c46a64;color:#fff}
.pc-q-result{margin:9px 0 0;font-size:14.5px} .pc-q-result.is-right{color:var(--ok)} .pc-q-result.is-missed{color:var(--needs-2)} .pc-q-result.is-try{color:var(--warn);font-weight:650}

/* respond + focus mode */
.pc-write-wrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.pc-write-side{display:grid;gap:12px;position:sticky;top:70px}
.pc-checklist{padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7}
.pc-checklist h3{font-family:var(--sans);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.pc-checklist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.pc-checklist li{display:flex;gap:8px} .pc-checklist li span{flex:0 0 18px;font-weight:900;color:#6b6356} .pc-checklist li.is-ok span{color:var(--ok)}
.pc-focusbar{display:flex;justify-content:flex-start;margin-bottom:8px}
.pc-focus-exit{display:none}
.pc-writing{min-height:320px;font:17px/1.65 var(--serif);padding:14px 16px}
.pc-wordcount{text-align:right;font-size:13px;color:var(--muted);margin-top:4px}
body.pc-focus-on{overflow:hidden}
.pc-write-wrap.is-focus{position:fixed;inset:0;z-index:60;background:var(--paper);padding:20px clamp(12px,3vw,40px);grid-template-columns:minmax(220px,300px) minmax(0,1fr);overflow:auto}
.pc-write-wrap.is-focus .pc-write-side{top:0}
.pc-write-wrap.is-focus .pc-writing{min-height:calc(100vh - 140px)}
.pc-write-wrap.is-focus .pc-focus-exit{display:inline-flex}
.pc-write-wrap.is-focus [data-act="focusMode"]{display:none}
.pc-savebar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.pc-save-state{margin-right:auto;font-size:13.5px;color:var(--muted)}
.pc-save-state.is-ok{color:var(--ok)} .pc-save-state.is-warn{color:var(--warn);font-weight:650} .pc-save-state.is-error{color:var(--needs);font-weight:700}
.pc-turned{font-size:13.5px;font-weight:700;color:var(--ok)}
.pc-stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pc-stat{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid #e3dccf;border-radius:999px;background:#faf8f4;color:#4b5563;font-size:12.5px}
.pc-stat b{color:var(--ink)} .pc-stat-time{background:#eef3fb;border-color:#d0dbef;color:#2c3b5a}
.pc-stat.is-warn{background:#fdeceb;border-color:#e0a9a6;color:#8c1d17} .pc-stat.is-source{background:#fff8e0;border-color:#ead8a9;color:#6b520f} .pc-stat.is-clean{background:#eef6f0;border-color:#cfe5d6;color:var(--ok)}
mark.pc-pasted{background:#ffe0e0;border-bottom:2px solid #d4676a;color:#111827;padding:0 1px;border-radius:2px}
.pc-pasted-swatch{background:#ffe0e0;border-color:#d4676a}
.pc-paste-legend{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* discussion */
.pc-compose{padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:#fcfbf7;margin-bottom:12px}
.pc-locked-note{padding:10px 13px;border-radius:10px;background:#f2efe8;color:#3b4552;font-weight:600}
.pc-thread{display:grid;gap:12px}
.pc-post{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pc-post.is-mine{border-color:#bcd7d3;background:#f6fbfa}
.pc-post header,.pc-reply header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-size:14px}
.pc-post time,.pc-reply time{color:var(--muted);font-size:12.5px}
.pc-post header .pc-link,.pc-reply header .pc-link{margin-left:auto;font-size:13px}
.pc-post-text{white-space:pre-wrap;font:15.5px/1.55 var(--serif)}
.pc-replies{margin:10px 0 0 14px;padding-left:12px;border-left:3px solid var(--line2);display:grid;gap:8px}
.pc-reply{padding:8px 10px;border-radius:9px;background:#faf8f3}
.pc-reply.is-mine{background:#eef6f5}
.pc-reply-box{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.pc-reply-box textarea{flex:1}

/* the pages where students read and write keep the width their writing boxes were made for */
body[data-view="week"] .pc-app{max-width:1240px}


/* ---------- modal, toast, lists ---------- */
.pc-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,27,36,.48)}
.pc-modal-card{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.pc-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;max-width:min(560px,calc(100% - 32px));padding:11px 17px;border-radius:12px;background:var(--ink);color:#fff;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pc-toast.is-error{background:#8c1d17} .pc-toast.is-ok{background:var(--ok)}
.pc-didnt{position:fixed;right:16px;bottom:16px;z-index:85;width:min(380px,calc(100% - 32px));max-height:50vh;overflow:auto;padding:12px 14px;border:2px solid var(--needs);border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.pc-didnt h3{font-family:var(--sans);font-size:15px;color:var(--needs);margin:0 0 6px}
.pc-didnt ul{margin:0;padding-left:18px;font-size:13.5px}
.pc-table-wrap{overflow-x:auto}
.pc-table{width:100%;border-collapse:collapse;font-size:14px}
.pc-table th,.pc-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.pc-table th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.pc-roster-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}

/* ---------- teacher dashboard ---------- */
.pc-banner{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:0 0 12px;padding:20px 24px;border-radius:16px;background:var(--studio);color:#fff;box-shadow:var(--shadow);border-left:6px solid var(--accent)}
.pc-banner h1{color:#fff;margin:4px 0 0;font-size:30px}
.pc-banner .pc-eyebrow{color:#c8d3df} .pc-banner .pc-book-author{color:#d5dde6;margin:2px 0 8px}
.pc-banner-main{flex:1 1 420px;min-width:0}
.pc-banner-sora{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.pc-banner .pc-chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.pc-banner-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pc-joincode{text-align:right} .pc-joincode span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8d3df}
.pc-joincode b{font:800 30px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.14em}
.pc-banner .pc-btn{background:#fff;color:var(--ink);border-color:#fff} .pc-banner .pc-btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.pc-switcher{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pc-class-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font:700 14px var(--sans);color:var(--ink);cursor:pointer}
.pc-class-pill.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.pc-class-pill.is-add{border-style:dashed;color:var(--accent)}
.pc-class-pill-period{font-size:12px;font-weight:650;opacity:.8}

/* grading tiles (same anatomy as Macbeth) */
.pc-group-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.pc-group-head h3{margin:0;font:850 12.5px var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--wine)}
.pc-group-count{font-size:12.5px;color:var(--muted)}
.pc-group-waiting{margin-left:auto;font-size:12.5px;font-weight:800;color:#a3261c} .pc-group-clear{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ok)}
.pc-tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pc-tile{position:relative;display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--line);border-top:4px solid var(--acc,var(--gold));border-radius:14px;box-shadow:0 1px 2px rgba(20,32,47,.05);transition:box-shadow .15s}
.pc-tile:hover{box-shadow:0 10px 24px rgba(20,32,47,.10)}
.pc-tile.menu-open{z-index:6}
.pc-tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 0;cursor:pointer}
.pc-tile-id{min-width:0}
.pc-tile-title{margin:3px 0 4px;font:700 20px/1.15 var(--serif);color:var(--acc,var(--wine))}
.pc-tile-meta{display:flex;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#556071}
.pc-tile-meta span+span::before{content:"·";margin:0 7px;color:#a8a092}
.pc-badge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:900;white-space:nowrap}
.pc-badge.is-needs{background:var(--needs);color:#fff;box-shadow:0 2px 6px rgba(140,29,23,.25)} .pc-badge.is-needs.has-redo{background:var(--needs-2)}
.pc-badge.is-done{width:28px;padding:0;background:var(--ok-soft);color:var(--ok);border:1px solid #bfe0cb}
.pc-badge.is-excluded{background:#f1eee8;color:#4b5563;border:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.pc-tile-body{flex:1;padding:12px 16px 0;cursor:pointer}
.pc-bar{display:flex;height:8px;border-radius:999px;background:#ece6db;overflow:hidden}
.pc-bar-done{background:#3f7a5a} .pc-bar-todo{background:#c8412f}
.pc-stats3{display:flex;justify-content:space-between;gap:8px;margin:10px 0 0}
.pc-stats3 div{margin:0;min-width:0} .pc-stats3 dt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.pc-stats3 dd{margin:1px 0 0;font-size:20px;line-height:1.15;font-weight:850;font-variant-numeric:tabular-nums}
.pc-stats3 .is-todo dd{color:#b42318}
.pc-tile-note{margin:8px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.pc-excluded-note{margin:0;padding:10px 12px;background:#faf8f4;border:1px dashed #d3c8b5;border-radius:10px;font-size:13px;color:#4b5563}
.pc-tile-open{margin:14px 16px 0}
.pc-tile-open-sub{font-weight:600;opacity:.92}
.pc-tile-foot{display:grid;gap:8px;margin-top:14px;padding:11px 16px 12px;border-top:1px solid #eee7db;background:#fcfaf6;border-radius:0 0 13px 13px}
.pc-switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:750}
.pc-switch input{position:absolute;left:0;top:50%;transform:translateY(-50%);width:36px;height:20px;margin:0;opacity:0;cursor:pointer;z-index:1}
.pc-switch-track{position:relative;flex:0 0 36px;width:36px;height:20px;border-radius:999px;background:#bdb4a4;transition:background .15s}
.pc-switch-track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s}
.pc-switch input:checked+.pc-switch-track{background:#2f7a55} .pc-switch input:checked+.pc-switch-track::after{transform:translateX(16px)}
.pc-switch input:focus-visible+.pc-switch-track{outline:2px solid var(--accent);outline-offset:2px}
.pc-switch-text{color:#4b5563} .pc-switch.is-on .pc-switch-text{color:#1e6b43}
.pc-canvas-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.pc-canvas-state{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;font-weight:700;color:#556071}
.pc-canvas-state::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:#bdb4a4}
.pc-canvas-state.is-ok::before{background:#2f7a55} .pc-canvas-state.is-pending::before{background:#c99a2e}
.pc-canvas-actions{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.pc-more{position:relative}
.pc-more>summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;border:1px solid #cfc6b8;border-radius:8px;background:#fff;color:#374151;font-size:17px;font-weight:900;cursor:pointer}
.pc-more>summary::-webkit-details-marker{display:none}
.pc-menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:30;min-width:236px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(20,32,47,.18)}
.pc-menu button{display:block;width:100%;padding:9px 11px;border:0;border-radius:8px;background:transparent;text-align:left;font:650 13.5px var(--sans);color:var(--ink);cursor:pointer}
.pc-menu button:hover{background:#f6f1e7} .pc-menu hr{margin:5px 4px;border:0;border-top:1px solid #eee7da}
.pc-menu .is-nograde{color:#a3261c} .pc-menu .is-count{color:var(--ok)}
.pc-tile-msg{padding:8px 10px;border:1px solid #d5ddf3;border-radius:8px;background:#f4f7fb;color:#2c3b5a;font-size:12.5px;line-height:1.45;word-break:break-word}
.pc-tile-msg:empty{display:none}
.pc-tile.is-nograde{background:#fbfaf7} .pc-tile.is-nograde .pc-tile-title{color:#4b5563}
.pc-loading{display:flex;align-items:center;gap:10px;padding:26px 4px;color:var(--muted)}
.pc-spinner{width:16px;height:16px;border:2px solid #e2dbcf;border-top-color:var(--accent);border-radius:50%;animation:pcspin .8s linear infinite} @keyframes pcspin{to{transform:rotate(360deg)}}

/* gradebook */
.pc-gb-scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line2);border-radius:12px}
.pc-gb{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
.pc-gb th,.pc-gb td{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap;background:#fff}
.pc-gb thead th{background:#faf7f0;font-size:12px;color:#3b4552}
.pc-gb .pc-gb-week{border-left:1px solid var(--line2);text-transform:uppercase;letter-spacing:.06em;font-weight:850;color:var(--wine)}
.pc-gb .pc-gb-item.is-hidden{color:#5f584c;font-style:italic}
.pc-gb .pc-gb-name{position:sticky;left:0;z-index:2;text-align:left;min-width:170px;max-width:220px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line2)}
.pc-gb tbody .pc-gb-name{font-weight:650}
.pc-gb-cell{min-width:48px;padding:5px 8px;border:1px solid transparent;border-radius:7px;background:transparent;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer}
.pc-gb-cell:hover{border-color:var(--gold);background:#fff9ea}
.pc-gb-none{color:#5f6672;font-weight:400} .pc-gb-ex{color:#5b6472;font-style:italic;font-weight:600}
.pc-dot{color:#8a5a00;margin-left:2px}
.pc-gb-total{font-weight:800} .pc-gb-total small{font-weight:600;color:var(--muted)}
.pc-push-status{margin:8px 0 0;padding:8px 10px;border-radius:10px;background:#f6f1e7;color:#3d3426;font-size:13.5px}
/* setup */

.pc-week-edit{border:1px solid var(--line);border-radius:12px;background:#fff}
.pc-week-edit>summary{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.pc-week-edit>summary::-webkit-details-marker{display:none}
.pc-week-edit-n{font:800 12.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.pc-week-edit-t{font:600 16px var(--serif);flex:1 1 200px} .pc-week-edit-t small{font:500 13px var(--sans);color:var(--muted);margin-left:6px}
.pc-week-form{padding:2px 16px 14px;border-top:1px solid var(--line2)}
.pc-ainote{padding:9px 12px;border-radius:9px;background:var(--warn-soft);border:1px solid #ead8a9;font-size:14px}
.pc-week-actions{border-top:1px solid var(--line2);padding-top:10px}

/* ---------- marking ---------- */
.pc-mhead{position:sticky;top:52px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-6px 0 14px;padding:10px 0;background:var(--paper)}
.pc-mtabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:#ebe5d9;border-radius:12px;margin-right:auto}
.pc-mtab{border:0;background:transparent;padding:7px 13px;border-radius:9px;font:700 14px var(--sans);color:#3b4552;cursor:pointer}
.pc-mtab.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pc-mtop h1 small{font:600 15px var(--sans);color:var(--muted)}
.pc-legend{margin:10px 0;padding:10px 14px;border:1px solid #e6dcc6;border-radius:12px;background:#fffaf0;font-size:14px}
.pc-legend summary{cursor:pointer;font-weight:800}
.pc-akey{margin:8px 0;font-size:14px} .pc-akey summary{cursor:pointer;font-weight:750;color:var(--accent)}
.pc-mtools{border-top:1px solid var(--line2);padding-top:10px}
.pc-mgroups{display:grid;gap:18px}
.pc-mgroup{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px}
.pc-mgroup>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pc-mgroup>header h2{margin:0;font-size:19px}
.pc-mgroup-count{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:999px;background:#efe9de;font-weight:850;font-size:13px}
.pc-mgroup-redo .pc-mgroup-count{background:var(--needs-2);color:#fff} .pc-mgroup-ready .pc-mgroup-count{background:var(--needs);color:#fff}
.pc-mgroup.is-collapsed{padding:10px 14px}
.pc-mrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.9fr);column-gap:20px;row-gap:10px;align-items:start;margin:12px 0;padding:14px 16px;border:1px solid #e6dfd3;border-radius:14px;background:#fff}
.pc-mrow.is-jump{box-shadow:0 0 0 3px var(--gold)}
.pc-mrow-head{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pc-mrow-head h3{margin:0 8px 0 0;font-size:18px}
.pc-mbadges{display:flex;flex-wrap:wrap;gap:6px}
.pc-focus-btn{margin-left:auto}
.pc-mbadge{display:inline-flex;align-items:center;padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:#faf8f3;font-size:12px;font-weight:750;color:#3b4552}
.pc-mbadge.is-needs{background:#fdeceb;border-color:#e0a9a6;color:#8c1d17} .pc-mbadge.is-redo{background:var(--needs-2);border-color:var(--needs-2);color:#fff}
.pc-mbadge.is-graded{background:var(--ok-soft);border-color:#bfe0cb;color:var(--ok)} .pc-mbadge.is-draft{background:#eef2ff;border-color:#a9b6e0;color:#2c3b7a}
.pc-mbadge.is-paste{background:#fdeceb;border-color:#e0a9a6;color:#8c1d17}
.pc-mrow-work{min-width:0}
.pc-mtext{white-space:pre-wrap;font:16px/1.6 var(--serif);padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#fdfcf8;max-height:520px;overflow:auto}
.pc-mmeta{font-size:13px;color:var(--muted);margin:6px 0 0}
.pc-mquiz{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.pc-mquiz li{display:flex;flex-direction:column} .pc-mquiz-a{color:var(--muted);font-size:13px}
.pc-mquiz b.is-right{color:var(--ok)} .pc-mquiz b.is-wrong{color:var(--needs)}
.pc-mpost{padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:#fdfcf8;margin-bottom:8px}
.pc-mpost.is-reply{margin-left:16px;border-left:4px solid #cfd8e5}
.pc-mpost-ctx{font-size:12.5px;color:var(--muted);margin-bottom:3px} .pc-mpost time{font-size:12px;color:var(--muted)}
.pc-mpanel{position:sticky;top:120px;display:grid;gap:9px;padding:12px;border:1px solid #e6dcc6;border-radius:12px;background:#fffaf0}
.pc-mpanel{container-type:inline-size}
.pc-bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
@container (min-width:430px){.pc-bands{grid-template-columns:repeat(7,minmax(0,1fr))}}
.pc-bands.is-two{grid-template-columns:1fr 1fr}
.pc-band{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:1px solid #d9cdb5;border-radius:9px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.pc-band b{font-size:16px} .pc-band span{font-size:10.5px;font-weight:700;color:#4b5563;text-align:center;line-height:1.15}
.pc-band:hover{border-color:var(--accent)}
.pc-band.is-on{background:var(--accent);border-color:var(--accent);color:#fff} .pc-band.is-on span{color:#e6f2f1}
.pc-score-entry{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650} .pc-score-entry input{width:90px}
.pc-mauto{margin:0;font-size:15px}
.pc-exclude{font-size:14px}
.pc-mstate{font-size:12.5px;color:var(--muted);min-height:16px} .pc-mstate.is-ok{color:var(--ok)} .pc-mstate.is-error{color:var(--needs);font-weight:700} .pc-mstate.is-warn{color:var(--warn)}
.pc-focus-overlay{position:fixed;inset:0;z-index:70;background:var(--paper);overflow:auto;padding:0 clamp(10px,3vw,36px) 30px}
.pc-focus-bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;background:var(--paper);border-bottom:1px solid var(--line)}
.pc-focus-title{font:700 17px var(--serif);margin-right:auto}
.pc-focus-left{font-weight:800;color:var(--needs)}
.pc-focus-body .pc-mrow{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);margin-top:16px}
.pc-focus-body .pc-mtext{max-height:none}
.pc-focus-body .pc-focus-btn{display:none}
body.pc-focus-grading{overflow:hidden}

/* ---------- v2: units, today's reading{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:2px 0 4px;font:600 15.5px/1.4 var(--serif);color:var(--ink)}
.pc-now{border-color:#bcd7d3}
.pc-weeks.is-one{grid-template-columns:1fr}
.pc-week-card.is-current{border:2px solid var(--accent);box-shadow:var(--shadow)}
.pc-steps{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
.pc-step-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc-write-wrap.is-short{grid-template-columns:1fr}
.pc-writing.is-short{min-height:120px}
.pc-bands.is-three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ---------- small screens: no horizontal scroll at 1024 / 640 / 390 ---------- */
@media (max-width:1024px){
  .pc-write-wrap{grid-template-columns:1fr} .pc-write-side{position:static}
  .pc-write-wrap.is-focus{grid-template-columns:1fr}
}
@media (max-width:900px){
  .pc-mrow,.pc-focus-body .pc-mrow{grid-template-columns:1fr} .pc-mpanel{position:static}
  .pc-mhead{top:0}
}
@media (max-width:700px){
  .pc-app{padding:14px 12px 70px}
  h1{font-size:25px} .pc-week-banner h1{font-size:25px}
  .pc-card{padding:16px}
  .pc-hero{grid-template-columns:1fr;gap:14px;padding:18px}
  .pc-join{grid-template-columns:1fr}
  .pc-form-grid{grid-template-columns:1fr}
  .pc-steps{gap:3px;padding:4px}
  .pc-steps{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
  .pc-step{flex-direction:column;gap:2px;min-height:52px;padding:5px 2px;font-size:12px}
  .pc-tile-grid{grid-template-columns:1fr}
  .pc-bands{grid-template-columns:repeat(4,minmax(0,1fr))} .pc-bands.is-two{grid-template-columns:1fr 1fr}
  .pc-banner{padding:16px} .pc-banner-side{align-items:flex-start}
  .pc-joincode{text-align:left}
  .pc-top-inner{padding:8px 12px;gap:10px} .pc-account-email{max-width:150px} .pc-build{display:none}
  .pc-reply-box{flex-direction:column;align-items:stretch}
  .pc-table thead{display:none} .pc-table tr{display:grid;border-bottom:1px solid var(--line2);padding:6px 0} .pc-table td{border:0;padding:4px 6px}
  .pc-roster-actions{justify-content:flex-start}
}

/* ---------- Podcast Studio ---------- */
.pc-top{background:var(--studio)}
.pc-brand{font-family:var(--serif);font-weight:800;letter-spacing:.01em}
.pc-brand-mark{position:relative;width:14px;height:22px;border-radius:7px;background:var(--accent);box-shadow:none;margin:0 4px 6px}
.pc-brand-mark::after{content:"";position:absolute;left:-5px;right:-5px;top:9px;height:14px;border:2px solid #f3c6d2;border-top:0;border-radius:0 0 10px 10px}
h1,h2{letter-spacing:-.005em}
.pc-studio-hero{background:var(--studio);color:#f4f2ef;border-color:#2b2b2f;grid-template-columns:auto minmax(0,1fr)}
.pc-studio-hero h1{color:#fff;font-size:38px;font-weight:700;margin:4px 0}
.pc-studio-hero .pc-eyebrow{color:#c9c6c0}
.pc-studio-hero .pc-hero-note{color:#dedbd5}
.pc-studio-hero .pc-small.pc-muted{color:#c9c6c0}
.pc-mic-art{position:relative;width:110px;height:132px}
.pc-mic-head{position:absolute;left:37px;top:6px;width:36px;height:62px;border-radius:18px;background:var(--accent);box-shadow:inset 0 -14px 0 rgba(0,0,0,.12)}
.pc-mic-head::before{content:"";position:absolute;left:8px;right:8px;top:16px;height:4px;border-radius:2px;background:#1b1b1d;box-shadow:0 9px 0 #1b1b1d,0 18px 0 #1b1b1d}
.pc-mic-stem{position:absolute;left:25px;top:40px;width:60px;height:44px;border:4px solid #e7b3c1;border-top:0;border-radius:0 0 30px 30px}
.pc-mic-stem::after{content:"";position:absolute;left:24px;top:44px;width:4px;height:22px;background:#e7b3c1;box-shadow:-14px 22px 0 -0px transparent}
.pc-wave{position:absolute;top:10px;width:22px;height:60px;border:4px solid #e7b3c1;border-radius:50%;border-color:transparent #e7b3c1 transparent transparent}
.pc-wave.w1{right:0} .pc-wave.w2{left:0;transform:scaleX(-1)}
.pc-myshow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-top:8px;padding:10px 14px;border:1px solid #3a3a40;border-radius:12px;background:#242428}
.pc-myshow b{font:700 20px var(--serif);color:#fff} .pc-myshow span:not(.pc-eyebrow):not(.pc-chip){color:#dedbd5} .pc-myshow .pc-eyebrow{flex-basis:100%;color:#c9c6c0}
.pc-myshow .pc-chip{background:#3a3a40;color:#fff;border-color:#55555c}
.pc-week-card{border-top:4px solid var(--wk,var(--accent))}
.pc-week-1{--wk:var(--w1)} .pc-week-2{--wk:var(--w2)} .pc-week-3{--wk:var(--w3)}
.pc-week-card.is-current{border:2px solid var(--wk,var(--accent));border-top-width:5px}
.pc-week-banner{padding:18px 20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--wk,var(--accent))}
.pc-week-banner .pc-eyebrow{color:var(--wk,var(--muted))}
.pc-week-sum{margin:0 0 8px;color:#3b4049;font-size:15.5px}
.pc-eq{border-left-color:var(--wk,var(--gold));background:#f7f5f1} .pc-eq span{color:#5a5047}
.pc-step.is-lesson .pc-step-n{background:transparent;font-size:16px}
.pc-step.is-on.is-lesson .pc-step-n{background:transparent}
/* lessons */
.pc-lesson-sec{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line2)}
.pc-lesson-sec:first-of-type{border-top:0;padding-top:4px}
.pc-lesson-sec h3{font-size:21px;margin:0 0 4px}
.pc-lesson-sub{margin:0 0 10px;color:var(--muted);font-size:15.5px}
.pc-lesson-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin:10px 0}
.pc-lesson-cards article{padding:14px 16px;border-radius:12px;background:var(--studio);color:#ecebe8}
.pc-lesson-cards h4{color:#fff;font:700 16.5px var(--serif);margin:0 0 6px}
.pc-lesson-cards p{margin:0;font-size:14.5px;line-height:1.5}
.pc-lesson-list,.pc-lesson-steps{margin:6px 0 10px;padding-left:22px;display:grid;gap:5px;font-size:15.5px}
.pc-lesson-steps li::marker{font-weight:800;color:var(--accent)}
.pc-video{position:relative;width:100%;max-width:820px;aspect-ratio:16/9;margin:10px 0 6px;border-radius:12px;overflow:hidden;background:#000}
.pc-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pc-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:12px}
.pc-parts-group{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfaf8}
.pc-parts-group h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-2);margin:0 0 8px}
.pc-parts-group dl{margin:0;display:grid;gap:8px} .pc-parts-group dt{font-weight:800} .pc-parts-group dd{margin:1px 0 0;font-size:14.5px;line-height:1.45;color:#2f343c}
/* Listening Library */
.pc-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;margin-top:10px}
.pc-lib-item{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pc-lib-item h4{margin:4px 0 0;font:700 16.5px/1.3 var(--serif)} .pc-lib-item h4 a{color:var(--ink);text-decoration:none} .pc-lib-item h4 a:hover{color:var(--accent);text-decoration:underline}
.pc-lib-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pc-lib-format{font:800 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2)} .pc-lib-len{font-size:12.5px;color:var(--muted);font-weight:700}
.pc-lib-show{color:var(--muted);font-size:14px;font-weight:650}
.pc-lib-craft{margin:6px 0 0;font-size:14px}
.pc-lib-item .pc-small{margin:2px 0}
.pc-lib-note{margin:4px 0 0;padding:6px 9px;border-radius:8px;background:var(--warn-soft);color:#5c3c00;font-size:13px}
/* fill-in forms */
.pc-fld{margin:0 0 18px}
.pc-flabel-wrap{display:flex;flex-direction:column;gap:1px;margin:0 0 6px}
.pc-flabel{font-weight:800;font-size:15.5px} .pc-fhint{font-size:13.5px;color:var(--muted)}
.pc-req{color:var(--needs)}
.pc-fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.pc-wordcount{font-size:12.5px;font-weight:750;color:var(--muted)}
.pc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pc-rows{display:grid;gap:6px}
.pc-rows-head,.pc-rowline{display:grid;grid-template-columns:var(--cols);gap:6px;align-items:start}
.pc-rows{--cols:repeat(auto-fit,minmax(0,1fr))}
.pc-rows-head{font:800 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pc-rows-head,.pc-rowline{display:flex}
.pc-col-sm{flex:0 0 92px;min-width:0} .pc-col-md{flex:1 1 160px;min-width:0} .pc-col-lg{flex:2 1 260px;min-width:0} .pc-col-x{flex:0 0 34px}
.pc-rowline .pc-input{width:100%} .pc-rowline textarea.pc-input{min-height:42px;resize:vertical}
.pc-choice-row{display:flex;flex-wrap:wrap;gap:6px}
.pc-radio{position:relative;display:inline-flex;align-items:center;padding:7px 14px;border:1px solid #cfcac2;border-radius:999px;background:#fff;cursor:pointer;font-weight:650;font-size:14.5px}
.pc-radio input{position:absolute;opacity:0;pointer-events:none}
.pc-radio.is-on{background:var(--accent);border-color:var(--accent);color:#fff}
.pc-radio:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pc-linkrow{display:flex;gap:6px;align-items:center} .pc-linkrow .pc-input{flex:1 1 auto;min-width:0}
.pc-ep-other{margin-top:6px}
.pc-assignment{margin:4px 0 14px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fbfaf8}
.pc-assignment summary{cursor:pointer;font:700 17px var(--serif)}
.pc-assignment h4{margin:12px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-2)}
.pc-assignment ul,.pc-assignment ol{margin:4px 0;padding-left:22px;display:grid;gap:3px;font-size:15px}
.pc-chip.is-wrap{white-space:normal}
.pc-canva-btn{border-color:#7d2ae8;color:#4d1a96}
.pc-canva-dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#00c4cc,#7d2ae8)}
.pc-recorded{margin-top:2px}
.pc-link-warn{margin:6px 0 0;padding:7px 10px;border-radius:8px;background:var(--warn-soft);color:#5c3c00;font-size:13.5px;font-weight:650}
.pc-old-text{margin:0 0 8px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:#fbfaf8} .pc-old-text p{margin:2px 0 0;white-space:pre-wrap}
/* rubrics */
.pc-crit-table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.4;min-width:640px}
.pc-crit-table th,.pc-crit-table td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.pc-crit-table thead th{background:#f5f2ed;font-size:12.5px;white-space:nowrap}
.pc-crit-table tbody th{width:180px;background:#fbfaf8} .pc-crit-table tbody th small{display:block;font-weight:600;color:var(--muted)}
.pc-crit-scores{list-style:none;margin:6px 0;padding:0;display:grid;gap:4px}
.pc-crit-scores li{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:8px;background:#fff}
.pc-crit{display:grid;gap:5px;padding:8px 0;border-bottom:1px dashed #e0d6c2}
.pc-crit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.pc-crit-score{display:inline-flex;align-items:center;gap:3px;font-weight:750} .pc-crit-box{width:66px;padding:5px 7px}
.pc-bands.is-crit{grid-template-columns:repeat(4,minmax(0,1fr))!important}
.pc-bands.is-crit .pc-band span{font-size:10px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-crit-total{margin:4px 0 0;font-size:14px}
/* marking: fill-in work */
.pc-mfield{margin:0 0 12px}
.pc-mflabel{font:800 11.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--accent-2);margin-bottom:3px}
.pc-mfield p{margin:2px 0}
.pc-mrows th,.pc-mrows td{font-size:13.5px;vertical-align:top}
.pc-mlink{word-break:break-all;font-weight:700}
.pc-say-btn{float:right;margin:-4px 0 4px 8px}
.pc-mtext.is-reading{cursor:pointer}
.pc-say-s.is-saying{background:#fde68a;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.pc-saybar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;max-width:calc(100vw - 24px);padding:10px 14px;border-radius:14px;background:var(--studio);color:#f4f2ef;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13.5px}
.pc-saybar label{display:inline-flex;align-items:center;gap:6px} .pc-saybar select{padding:3px 6px;min-height:30px;max-width:190px}
.pc-saybar-title{font-weight:800}
/* teacher: release & resources */
.pc-rel-weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;margin-top:10px}
.pc-rel-week{padding:12px 14px;border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:12px;background:#fff}
.pc-rel-week header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.pc-rel-week h4{margin:2px 0}
.pc-rel-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.pc-rel-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;background:#faf9f7}
.pc-rel-list .pc-switch{flex:0 0 auto} .pc-rel-list .pc-switch-text{white-space:nowrap}
.pc-rel-name{display:flex;flex-direction:column;font-weight:700;font-size:14px;min-width:0} .pc-rel-name small{font-weight:600;color:var(--muted)}
@media (max-width:700px){
  .pc-steps{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .pc-step-label{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;line-height:1.15}
  .pc-studio-hero{grid-template-columns:1fr} .pc-mic-art{display:none} .pc-studio-hero h1{font-size:30px}
  .pc-rows-head{display:none}
  .pc-rowline{flex-wrap:wrap;padding:8px;border:1px solid var(--line2);border-radius:10px;background:#fbfaf8}
  .pc-col-sm,.pc-col-md,.pc-col-lg{flex:1 1 100%} .pc-rowline .pc-sr{position:static;width:auto;height:auto;clip:auto;font:800 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .pc-col-x{flex:0 0 auto;margin-left:auto}
  .pc-saybar{bottom:6px}
  .pc-say-btn{float:none;margin:0 0 6px}
}

/* Vintage Broadcast chapter headers and illustrated production steps — 2026-10-20b.
   Scoped to week pages so the approved home remains unchanged. */
.pc-broadcast-banner.pc-week-banner{
 --chapter:#3d6d62;--chapter-ink:#fff1cf;
 display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:center;gap:0 24px;
 padding:0;margin:0 0 20px;background:var(--chapter) var(--grain);color:var(--chapter-ink);
 border:0;border-radius:3px;box-shadow:0 3px 0 #292923;overflow:hidden;position:relative;isolation:isolate;
}
.pc-broadcast-banner.pc-week-2{--chapter:#dc805f;--chapter-ink:#292923}
.pc-broadcast-banner.pc-week-3{--chapter:#e9bc62;--chapter-ink:#292923}

.pc-chapter-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;color:var(--chapter-ink);font:700 10px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.16em;margin-bottom:14px}

.pc-week-2 .pc-chapter-art{transform:rotate(-6deg)}
.pc-chapter-question{grid-column:1/-1;display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:20px;background:#292923;color:#f7ebce;padding:16px 30px;border-top:1px solid rgba(247,235,206,.35)}
