<script>
// ============================================================================
// Writing stats on every composition box (student and teacher see them).
// Writing time (2-minute idle cutoff), sittings, pastes in, which stretches were pasted.
// Stored apart from the work (saveWritingStats), merged box by box on the server, never recorded
// while a teacher is viewing a real student. No keystroke log.
// ============================================================================
(function () {
  var IDLE = 120000, NEW_SITTING = 20 * 60000;
  var live = null;   // { ctx, boxes: {name: stats}, dirty, timer }

  function blank() { return { ms: 0, sittings: 0, pastes: 0, pastedChars: 0, blocked: 0, pasted: [], last: 0 }; }

  PC.stats = {
    /** Start tracking the [data-stat-box] fields under root. ctx: {classId, key, as, readOnly, initial} */
    attach: function (root, ctx) {
      PC.stats.flush();
      if (!root || ctx.readOnly) { live = null; return; }
      var boxes = {};
      Object.keys(ctx.initial || {}).forEach(function (k) { boxes[k] = Object.assign(blank(), ctx.initial[k]); });
      live = { ctx: ctx, boxes: boxes, dirty: false, started: {} };
      root.querySelectorAll('[data-stat-box]').forEach(function (el) { PC.stats.bind(el); });
    },
    bind: function (el) {
      if (!live || el.__pcStats) return; el.__pcStats = true;
      var name = el.getAttribute('data-stat-box');
      el.addEventListener('input', function () {
        var b = live.boxes[name] = live.boxes[name] || blank(), now = Date.now();
        if (!live.started[name]) { live.started[name] = true; if (!b.last || now - b.last > NEW_SITTING) b.sittings++; }
        if (b.last && now - b.last < IDLE) b.ms += now - b.last;
        b.last = now; live.dirty = true; schedule();
      });
      el.addEventListener('paste', function (e) {
        var t = ''; try { t = (e.clipboardData || window.clipboardData).getData('text') || ''; } catch (x) {}
        if (t.trim().length < 20) return;
        var b = live.boxes[name] = live.boxes[name] || blank();
        b.pastes++; b.pastedChars += t.length; b.pasted.push(t.slice(0, 2000)); if (b.pasted.length > 40) b.pasted.shift();
        live.dirty = true; schedule();
      });
    },
    get: function (name) { return live && live.boxes[name] ? live.boxes[name] : null; },
    flush: function () {
      if (!live || !live.dirty) return;
      live.dirty = false; clearTimeout(live.timer);
      var c = live.ctx, payload = { classId: c.classId, key: c.key, as: c.as || '', stats: JSON.parse(JSON.stringify(live.boxes)) };
      PC.rpc('saveWritingStats', payload, { retry: true }).catch(function () { if (live) live.dirty = true; });
    },

    /** Chips for a box: writing time, sittings, pastes. */
    chipsHtml: function (s, text) {
      s = s || {};
      var min = Math.round((Number(s.ms) || 0) / 60000), chars = String(text || '').length, pc = Number(s.pastedChars) || 0;
      var share = chars ? Math.min(100, Math.round(pc / chars * 100)) : 0, out = [];
      out.push('<span class="pc-stat pc-stat-time" title="Time spent typing in this box (pauses over 2 minutes don’t count)"><b>' + (min < 1 && s.ms ? '<1' : min) + '</b> min writing</span>');
      out.push('<span class="pc-stat" title="Separate times this box was worked on"><b>' + (Number(s.sittings) || 0) + '</b> ' + ((Number(s.sittings) || 0) === 1 ? 'sitting' : 'sittings') + '</span>');
      out.push(s.pastes ? '<span class="pc-stat ' + (share >= 30 ? 'is-warn' : 'is-source') + '" title="Text pasted into this box"><b>' + s.pastes + '</b> ' + (s.pastes === 1 ? 'paste' : 'pastes') + ' · ' + share + '% pasted</span>' : '<span class="pc-stat is-clean">No pastes</span>');
      if (s.blocked) out.push('<span class="pc-stat is-warn"><b>' + s.blocked + '</b> blocked</span>');
      return '<div class="pc-stats">' + out.join('') + '</div>';
    },
    /** Teacher view: the text with pasted stretches highlighted. */
    highlightHtml: function (text, s) {
      text = String(text || ''); var pasted = ((s || {}).pasted || []).filter(function (p) { return p && p.trim().length >= 20; });
      if (!pasted.length) return PC.esc(text);
      var marks = [];
      pasted.forEach(function (p) { var t = p.trim(), i = text.indexOf(t); if (i >= 0) marks.push([i, i + t.length]); });
      marks.sort(function (a, b) { return a[0] - b[0]; });
      var out = '', pos = 0;
      marks.forEach(function (m) { if (m[0] < pos) m[0] = pos; if (m[1] <= m[0]) return; out += PC.esc(text.slice(pos, m[0])) + '<mark class="pc-pasted" title="Pasted in">' + PC.esc(text.slice(m[0], m[1])) + '</mark>'; pos = m[1]; });
      return out + PC.esc(text.slice(pos));
    }
  };
  function schedule() { if (!live) return; clearTimeout(live.timer); live.timer = setTimeout(PC.stats.flush, 20000); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') PC.stats.flush(); });
  window.addEventListener('pagehide', function () { PC.stats.flush(); });
  window.__MB.WritingStats = 'ok';
})();
</script>
