    } catch (e) {
      document.getElementById("modalRoot").innerHTML =
        `<div class="modal"><div class="modalbox"><h3>Could not load work</h3><p>${esc(e.message)}</p><button class="btn modal-dismiss" id="closeStudent">Close</button></div></div>`;
      document.getElementById("closeStudent").onclick = () =>
        (document.getElementById("modalRoot").innerHTML = "");
    }
  }
  function activityHasContent(v) {
    if (v == null) return false;
    if (typeof v === "string") return v.trim().length > 0;
    if (typeof v === "object") {
      if (Array.isArray(v.table) && v.table.some((row) => Array.isArray(row) && row.some((c) => String(c || "").trim())))
        return true;
      if (Array.isArray(v.fields) && v.fields.some((f) => String(f || "").trim())) return true;
      if (v.reflection && String(v.reflection).trim()) return true;
      return false;
    }
    return false;
  }
  function formatActivityResponseHtml(title, v) {
    if (typeof v === "string") return `<p>${esc(v)}</p>`;
    let detail = (typeof ACTIVITY_DETAILS !== "undefined" && ACTIVITY_DETAILS[title]) || {};
    let h = "";
    if (Array.isArray(v.table) && v.table.length) {
      let cols = detail.table || [];
      h += `<div style="overflow:auto"><table class="rubric"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${v.table.map((row) => `<tr>${row.map((c) => `<td>${esc(c || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if (Array.isArray(v.fields) && v.fields.length) {
      let labels = detail.fields || [];
      h += v.fields
        .map((val, i) =>
          val && String(val).trim()
            ? `<p><strong>${esc((labels[i] && labels[i].label) || "Field " + (i + 1))}:</strong> ${esc(val)}</p>`
            : "",
        )
        .join("");
    }
    if (v.reflection && String(v.reflection).trim())
      h += `<p><strong>${esc(detail.reflection || "Reflection")}:</strong> ${esc(v.reflection)}</p>`;
    return h || '<p class="toolbar-note">No response submitted.</p>';
  }
  function scoreButtonRow(key, dok, email) {
    let emailAttr = email ? ` data-email="${esc(email)}"` : "";
    let attrs = `data-key="${esc(key)}"${emailAttr}`;
    return (
      rubricLevelRow_(dok.score, "score-btn", attrs) +
      teacherScoreInputHtml_("dokManualScore", dok.score, attrs) +
      offRubricNoteHtml_(dok.score)
    );
  }

  function mcItemHtml(key, s, gs) {
    let scene = (gs && gs.scenes && gs.scenes[key]) || { mc: { score: null, excluded: false } };
    let q = QUESTIONS[key];
    let info = answerInfo(key, s.answers[key]);
    let pickLabels = (info.picks || []).map((i) => (q ? q[1][i] : null) || "?").join(" → ") || "No answer";
    let mcLabel =
      scene.mc.score === 1
        ? "✓ Correct on the first try — " + MC_POINTS + " pts"
        : scene.mc.score === 0.5
          ? "✓ Correct on the second try — " + MC_POINTS / 2 + " pts"
          : scene.mc.score === 0
            ? "✗ Incorrect after 2 tries — 0 pts"
            : "Not attempted yet";
    return `<div class="item-grade-block" data-scene="${key}">
      <h5>Chapter ${CHAPTERS[key] ? CHAPTERS[key].act : key}</h5>
      <div class="grade-row-mc"><div class="mc-summary">${esc(q ? q[0] : "")}<br><small>Answer: ${esc(pickLabels)} — ${mcLabel}</small></div><label class="exclude-toggle"><input type="checkbox" class="mcExcludeToggle" data-key="${key}" ${scene.mc.excluded ? "checked" : ""}> Exclude MC from grade</label></div>
    </div>`;
  }

  function dokItemHtml(key, s, gs) {
    let scene = (gs && gs.scenes && gs.scenes[key]) || { dok: { score: null, excluded: false, comment: "" } };
    let dokText = String((s.dok || {})[key] || "").trim();
    let q = QUESTIONS[key];
    return `<div class="item-grade-block" data-scene="${key}">
      <h5>Chapter ${CHAPTERS[key] ? CHAPTERS[key].act : key}</h5>
      <p class="dok-prompt">${esc(q ? q[3] : "")}</p>
      <div class="response-box">${dokText ? esc(dokText) : "<em>No written response submitted yet.</em>"}</div>
      <div class="grade-row-dok">${scoreButtonRow(key, scene.dok)}<label class="exclude-toggle"><input type="checkbox" class="dokExcludeToggle" data-key="${key}" ${scene.dok.excluded ? "checked" : ""}> Exclude written response from grade</label><textarea class="dokComment" data-key="${key}" placeholder="Optional feedback comment for the student">${esc(scene.dok.comment || "")}</textarea></div>
    </div>`;
  }

  function renderStudentModal(r) {
    // Grading a scene calls this again to redraw with the new score, but rebuilding
    // .modalbox's innerHTML resets its scroll position to the top — annoying when a
    // teacher is working their way down a long list of scenes. Remember where they
    // were (and which tab they were on) and put both back after the rebuild.
    let modalRootEl = document.getElementById("modalRoot");
    let existingBox = modalRootEl.querySelector(".modalbox");
    let savedScroll = existingBox ? existingBox.scrollTop : 0;
    let existingActiveTab = modalRootEl.querySelector(".detailTab.active");
    let savedTab = existingActiveTab ? existingActiveTab.dataset.tab : "reading";
    let s = normalizeState(r.state || {}, null);
    let gs = r.gradeSummary || { scenes: {}, acts: {} };
    let rubricLegend = `<div class="rubric-legend">${DOK_RUBRIC.slice(1)
      .map((d, i) => `<span class="rubric-chip" title="${esc(d)}">${i + 1}</span>`)
      .join("")}<small class="rubric-legend-note">Hover a number for the full rubric descriptor. Click a scene's written-response score to grade it; use the checkboxes to leave a question out of the final grade.</small></div>`;
    let dokSection = [1, 2, 3, 4, 5, 6, 7, 8, 9]
      .map((act) => {
        let keys = Object.keys(CHAPTERS)
          .filter((k) => CHAPTERS[k].act === act)
          .sort(sceneSort);
        let mcBlocks = keys.map((k) => mcItemHtml(k, s, gs)).join("");
        let dokBlocks = keys.map((k) => dokItemHtml(k, s, gs)).join("");
        let actTotal = gs.acts[act] || { earned: 0, possible: 0 };
        return `<div class="grade-act-block" id="actBlock${act}"><h4>Chapter ${act} <span class="pill" id="actTotal${act}">${actTotal.earned}/${actTotal.possible}</span>${actPendingNoteHtml_(actTotal)}</h4><h5 class="act-subhead">Multiple Choice</h5>${mcBlocks}<h5 class="act-subhead">Written Responses</h5>${dokBlocks}</div>`;
      })
      .join("");
    let evidence = (s.evidence || [])
      .map(
        (x) =>
          `<div class="response-box"><strong>Chapter ${x.act} · ${esc((EQ.find((e) => e.id === x.eq) || {}).label || x.eq)}</strong><br>“${esc(x.quote)}”<p>${esc(x.note)}</p></div>`,
      )
      .join("");
    let acts = Object.entries(s.activityResponses || {})
      .filter(([, v]) => activityHasContent(v))
      .map(([k, v]) => `<div class="response-box"><strong>${esc(k)}</strong>${formatActivityResponseHtml(k, v)}</div>`)
      .join("");
    let e = s.essay || {};
    // A read-only summary of where this student's essay grades stand. Marking
    // happens on the Grade the Essay screen, where the whole class is in one
    // place -- this is here so the scores are visible beside the drafts.
    let eg = (r.gradeSummary || {}).essay;
    let essayScores = eg
      ? `<div class="essay-score-strip">${ESSAY_GRADE_STEPS.map((k) => {
          if (k === "final") {
            let t = eg.finalTotal || {};
            return `<span class="mini-chip ${t.hasAnyResult ? "batch-badge-graded" : ""}">Final Essay ${t.hasAnyResult ? t.earned + "/" + t.possible : "not scored"}</span>`;
          }
          let rec = (eg.steps || {})[k] || {};
          let val = rec.excluded
            ? "excused"
            : hasScore_(rec.score)
              ? k === "thesis"
                ? Number(rec.score) > 0
                  ? "complete"
                  : "not complete"
                : rec.score + "/" + rec.possible
              : rec.submitted
                ? "not marked yet"
                : "not done";
          let cls = rec.excluded ? "batch-badge-excluded" : hasScore_(rec.score) ? "batch-badge-graded" : rec.submitted ? "batch-badge-needs" : "";
          return `<span class="mini-chip ${cls}">${esc(ESSAY_GRADE_LABELS[k])} ${esc(val)}</span>`;
        }).join("")}</div>`
      : "";
    let essay = essayScores + `<div class="response-box"><strong>Thesis</strong><p>${esc(e.thesis || "Not drafted")}</p></div>${(e.bodies || []).map((b, i) => `<div class="response-box"><strong>Body Paragraph ${i + 1}${i >= 3 ? " (extra)" : ""}</strong><p>${esc(b || "Not drafted")}</p></div>`).join("")}${String(e.rebuttal || "").trim() ? `<div class="response-box"><strong>Counterargument</strong><p>${esc(e.rebuttal)}</p></div>` : ""}<div class="response-box"><strong>Introduction</strong><p>${esc(e.intro || "Not drafted")}</p></div><div class="response-box"><strong>Conclusion</strong><p>${esc(e.conclusion || "Not drafted")}</p></div>`;
    let self = ["Meaning", "Style", "Form", "Conventions"]
      .map(
        (c) =>
          `<div class="response-box"><strong>${c}</strong><br>Selected level: ${e.selfEval && e.selfEval[c] !== undefined ? Number(e.selfEval[c]) + 1 : "Not selected"}<p>${esc((e.selfComments || {})[c] || "No comment")}</p></div>`,
      )
      .join("");
    let roster2 = (backend.dashboard && backend.dashboard.students) || [];
    let myIdx = roster2.findIndex((x) => x.email === r.student.email);
    let prevStu = myIdx > 0 ? roster2[myIdx - 1] : null;
    let nextStu = myIdx >= 0 && myIdx < roster2.length - 1 ? roster2[myIdx + 1] : null;
    let navHtml =
      roster2.length > 1
        ? `<div class="student-nav"><button class="btn" id="prevStudentBtn" ${prevStu ? "" : "disabled"}>← ${prevStu ? esc(prevStu.name) : "Prev"}</button><span class="toolbar-note">${myIdx >= 0 ? myIdx + 1 : "?"} of ${roster2.length}</span><button class="btn" id="nextStudentBtn" ${nextStu ? "" : "disabled"}>${nextStu ? esc(nextStu.name) : "Next"} →</button></div>`
        : "";
    let tabDefs = [
      ["reading", "Reading"],
      ["evidence", "Evidence"],
      ["activities", "Activities"],
      ["essay", "Essay"],
      ["self", "Self-Assessment"],
    ];
    let tabsHtml = tabDefs
      .map(([id, label]) => `<button class="btn detailTab${id === savedTab ? " active" : ""}" data-tab="${id}">${label}</button>`)
      .join("");
    let paneHtml = (id, inner) =>
      `<div id="detail-${id}" class="detailPane${id === savedTab ? "" : " hide"}">${inner}</div>`;
    document.getElementById("modalRoot").innerHTML =
      `<div class="modal"><div class="modalbox" style="max-width:1000px;max-height:90vh;overflow:auto"><div class="pill">Student Work</div><h2>${esc(r.student.name)}</h2><p>${esc(r.student.email)} · Last saved ${r.updatedAt ? esc(new Date(r.updatedAt).toLocaleString()) : "not yet"}</p>${navHtml}<div class="student-detail-tabs">${tabsHtml}</div>${paneHtml("reading", `<h3>Reading &amp; Grading, by Scene</h3>${rubricLegend}${dokSection}`)}${paneHtml("evidence", `<h3>Evidence Bank</h3>${evidence || "<p>No evidence saved yet.</p>"}`)}${paneHtml("activities", `<h3>Activities</h3>${acts || "<p>No activity responses yet.</p>"}`)}${paneHtml("essay", `<h3>Essay Drafts</h3>${essay}`)}${paneHtml("self", `<h3>Self-Assessment</h3>${self}`)}<div class="modal-actions"><button class="btn primary modal-dismiss" id="closeStudent">Close</button></div></div></div>`;
    let newBox = document.getElementById("modalRoot").querySelector(".modalbox");
    if (newBox) newBox.scrollTop = savedScroll;
    document.getElementById("closeStudent").onclick = () => {
      document.getElementById("modalRoot").innerHTML = "";
      if (state.view === "manage") render();
    };
    let prevBtn = document.getElementById("prevStudentBtn");
    if (prevBtn && prevStu) prevBtn.onclick = () => openStudentWork(prevStu.email);
    let nextBtn = document.getElementById("nextStudentBtn");
    if (nextBtn && nextStu) nextBtn.onclick = () => openStudentWork(nextStu.email);
    async function saveGradeItem(itemType, key, patch) {
      try {
        await rpc("setGradeItem", {
          classId: backend.activeClassId,
          studentEmail: r.student.email,
          itemType,
          itemKey: key,
          score: patch.score !== undefined ? patch.score : null,
          excluded: !!patch.excluded,
          comment: patch.comment !== undefined ? patch.comment : (gs.scenes[key] && gs.scenes[key].dok.comment) || "",
        });
        if (backend.dashboard) {
          let stu = backend.dashboard.students.find((x) => x.email.toLowerCase() === r.student.email.toLowerCase());
          if (stu) stu.gradeSummary = gs;
        }
      } catch (e) {
        alert("Could not save that grade -- reloading this student to double check: " + e.message);
        await refreshStudentModal();
      }
    }
    async function refreshStudentModal() {
      try {
        let fresh = await rpc("getStudentWork", { classId: backend.activeClassId, studentEmail: r.student.email });
        normalizeGradeSummary_(fresh.gradeSummary);
        backend.studentDetail = fresh;
        renderStudentModal(fresh);
      } catch (e) {
        alert(e.message);
      }
    }
    document.querySelectorAll(".score-btn").forEach((btn) => {
      btn.onclick = () => {
        let key = btn.dataset.key;
        let score = Number(btn.dataset.score);
        let selected = btn.classList.contains("selected");
        let newScore = selected ? null : score;
        applyLocalGradeItemUpdate(gs, key, "dok", { excluded: false, score: newScore });
        renderStudentModal(r);
        saveGradeItem("dok", key, { excluded: false, score: newScore });
      };
    });
    document.querySelectorAll(".dokExcludeToggle").forEach((cb) => {
      cb.onchange = () => {
        let key = cb.dataset.key;
        let scene = gs.scenes[key];
        applyLocalGradeItemUpdate(gs, key, "dok", { excluded: cb.checked, score: scene ? scene.dok.score : null });
        renderStudentModal(r);
        saveGradeItem("dok", key, { excluded: cb.checked, score: gs.scenes[key].dok.score });
      };
    });
    document.querySelectorAll(".mcExcludeToggle").forEach((cb) => {
      cb.onchange = () => {
        let key = cb.dataset.key;
        applyLocalGradeItemUpdate(gs, key, "mc", { excluded: cb.checked });
        renderStudentModal(r);
        saveGradeItem("mc", key, { excluded: cb.checked, comment: "" });
      };
    });
    document.querySelectorAll(".dokComment").forEach((ta) => {
      ta.onblur = () => {
        let key = ta.dataset.key;
        let scene = gs.scenes[key];
        if (!scene) return;
        scene.dok.comment = ta.value;
        saveGradeItem("dok", key, { excluded: scene.dok.excluded, score: scene.dok.score, comment: ta.value });
      };
    });
    document.querySelectorAll(".detailTab").forEach(
      (b) =>
        (b.onclick = () => {
          document
            .querySelectorAll(".detailTab")
            .forEach((x) => x.classList.toggle("active", x === b));
          document.querySelectorAll(".detailPane").forEach((x) => x.classList.add("hide"));
          document.getElementById("detail-" + b.dataset.tab).classList.remove("hide");
        }),
    );
  }
  function sceneSort(a, b) {
    let [aa, as] = a.split(".").map(Number),
      [ba, bs] = b.split(".").map(Number);
    return aa - ba || as - bs;
  }

  if (backend.enabled) {
    setAccountHeader();
    bootstrap();
  } else {
    backend.ready = true;
    render();
  }
})();

__MB.BackendClient = 'ok';
</script>
