  `;
  document.head.appendChild(backendCss);

  function rpc(name, arg) {
    return new Promise((resolve, reject) => {
      if (!backend.enabled)
        return reject(
          new Error("Backend is not available outside the deployed Apps Script web app."),
        );
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e))));
      try {
        if (arg === undefined) runner[name]();
        else runner[name](arg);
      } catch (e) {
        reject(e);
      }
    });
  }
  const MC_POINTS = 4;
  const DOK_POINTS = 7;

  // Recomputes one scene's mc/dok contribution to its Act total after a
  // teacher grading action, using only data already in hand (mirrors
  // gradeSummaryForStudent_ in Code.gs) so the modal can redraw instantly
  // without waiting on a round-trip. The real setGradeItem call still goes
  // to the server in the background.
  function hasScore_(v) {
    return v !== null && v !== undefined && v !== "";
  }
  // Apps Script does not hand `null` back to the browser reliably -- an
  // ungraded score arrives as UNDEFINED. Every `score !== null` test then reads
  // an ungraded response as graded, which is how a class nobody had marked
  // showed up under "Already graded" as "Graded undefined/7", leaving "Needs
  // grading" empty. Normalise the moment data crosses into the browser so no
  // comparison downstream has to know about it.
  function normalizeScore_(v) {
    return hasScore_(v) ? Number(v) : null;
  }
  function normalizeResponses_(list) {
    (list || []).forEach((r) => {
      r.score = normalizeScore_(r.score);
      r.excluded = !!r.excluded;
      r.editedAfterGrading = !!r.editedAfterGrading;
      r.dokText = r.dokText || "";
    });
    return list;
  }
  function normalizeGradeSummary_(gs) {
    if (!gs || !gs.scenes) return gs;
    Object.keys(gs.scenes).forEach((k) => {
      let sc = gs.scenes[k];
      if (!sc) return;
      if (sc.mc) { sc.mc.score = normalizeScore_(sc.mc.score); sc.mc.excluded = !!sc.mc.excluded; }
      if (sc.dok) { sc.dok.score = normalizeScore_(sc.dok.score); sc.dok.excluded = !!sc.dok.excluded;
                    sc.dok.editedAfterGrading = !!sc.dok.editedAfterGrading; }
    });
    return gs;
  }
  // Rebuilds every Act (chapter) total from the scene data in hand. This is a
  // full recompute rather than an incremental adjustment: the totals are the
  // same arithmetic the server does, so patching them by hand is how the two
  // drift apart. 9 chapters is nothing to recount.
  function recomputeActTotals(gs) {
    let actIds = [1, 2, 3, 4, 5, 6, 7, 8, 9];
    actIds.forEach((a) => {
      if (!gs.acts[a]) gs.acts[a] = {};
      Object.assign(gs.acts[a], {
        earned: 0, possible: 0, mcEarned: 0, mcPossible: 0, dokEarned: 0, dokPossible: 0,
        complete: true, mcUnanswered: 0, dokUnmarked: 0, dokMissing: 0, pendingPoints: 0, touched: false,
      });
    });
    Object.keys(gs.scenes || {}).forEach((key) => {
      let sc = gs.scenes[key];
      let meta = CHAPTERS[key];
      if (!sc || !meta) return;
      let act = gs.acts[meta.act];
      if (!act) return;
      let mcScore = hasScore_(sc.mc && sc.mc.score) ? sc.mc.score : null;
      let dokScore = hasScore_(sc.dok && sc.dok.score) ? Number(sc.dok.score) : null;
      let submitted = sc.dok && sc.dok.submitted !== undefined ? !!sc.dok.submitted : dokScore !== null;
      if (mcScore !== null || submitted || dokScore !== null) act.touched = true;
      // The Act is worth its full value; anything not done scores zero. Only an
      // exclusion takes points out of the denominator.
      if (!(sc.mc && sc.mc.excluded)) {
        act.mcPossible += MC_POINTS;
        act.mcEarned += mcScore === 1 ? MC_POINTS : mcScore === 0.5 ? MC_POINTS / 2 : 0;
        if (mcScore === null) { act.mcUnanswered++; act.complete = false; }
      }
      if (!(sc.dok && sc.dok.excluded)) {
        act.dokPossible += DOK_POINTS;
        act.dokEarned += dokScore === null ? 0 : dokScore;
        if (dokScore === null) {
          act.complete = false;
          if (submitted) { act.dokUnmarked++; act.pendingPoints += DOK_POINTS; }
          else act.dokMissing++;
        }
      }
    });
    actIds.forEach((a) => {
      let act = gs.acts[a];
      act.earned = act.mcEarned + act.dokEarned;
      act.possible = act.mcPossible + act.dokPossible;
    });
  }
  // The Act total is always out of the full Act. That means a response you
  // haven't marked yet is sitting in there as a zero, which is correct but
  // easy to misread mid-marking -- so say so rather than let the number lie by
  // omission. Work the student never submitted is a real zero and isn't listed.
  function actPendingNoteHtml_(a) {
    if (!a || !a.dokUnmarked) return "";
    return `<span class="act-pending" title="These are counted as 0 in the total above until you grade them. Responses the student never submitted are not included in this count.">${a.dokUnmarked} written response${a.dokUnmarked === 1 ? "" : "s"} not marked yet (${a.pendingPoints} pts)</span>`;
  }
  function applyLocalGradeItemUpdate(gs, key, itemType, patch) {
    let scene = gs.scenes[key];
    if (!scene || !CHAPTERS[key]) return;
    if (itemType === "mc") {
      scene.mc.excluded = !!patch.excluded;
    } else {
      scene.dok.excluded = !!patch.excluded;
      if (patch.score !== undefined) scene.dok.score = scene.dok.excluded ? null : patch.score;
      if (patch.comment !== undefined) scene.dok.comment = patch.comment;
    }
    recomputeActTotals(gs);
  }

  function blankStudentState() {
    return {
      role: "student",
      view: "home",
      releasedActs: [1],
      releasedScenes: {},
      releasedEssayThrough: "self",
      supportOpen: false,
      answers: {},
      dok: {},
      dokMeta: {},
      evidence: [],
      teacherResources: true,
      className: "English - The Great Gatsby",
      activityResponses: {},
      essay: {
        step: "thesis",
        theme: "",
        thesis: "",
        discussion: [],
        bodies: ["", "", ""],
        intro: "",
        conclusion: "",
        selfEval: {},
        selfComments: {},
      },
    };
  }
  function normalizeState(remote, settings) {
    let b = blankStudentState();
    let r = remote && typeof remote === "object" ? remote : {};
    b = Object.assign(b, r);
    b.answers = b.answers || {};
    b.dok = b.dok || {};
    b.dokMeta = b.dokMeta || {};
    b.evidence = Array.isArray(b.evidence) ? b.evidence : [];
    b.activityResponses = b.activityResponses || {};
    b.essay = Object.assign(blankStudentState().essay, b.essay || {});
    b.essay.bodies = Array.isArray(b.essay.bodies) ? b.essay.bodies : ["", "", ""];
    while (b.essay.bodies.length < 3) b.essay.bodies.push("");
    b.essay.selfEval = b.essay.selfEval || {};
    b.essay.selfComments = b.essay.selfComments || {};
    b.essay.discussion = Array.isArray(b.essay.discussion) ? b.essay.discussion : [];
    if (settings) {
      b.releasedActs = settings.releasedActs || [1];
      b.releasedScenes = settings.releasedScenes || {};
      b.releasedEssayThrough = settings.releasedEssayThrough || "self";
      b.teacherResources = settings.teacherResources !== false;
    }
    b.role = "student";
    return b;
  }
  function localKey() {
    return backend.user && backend.activeClassId
      ? `macbethState:${backend.user.email}:${backend.activeClassId}`
      : "macbethState";
  }
  function safeLSGet(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }
  function safeLSSet(k, v) {
    try {
      localStorage.setItem(k, v);
      return true;
    } catch (e) {
      console.warn("Local storage save skipped:", e);
      return false;
    }
  }
  function setAccountHeader() {
    const roleSwitch = document.querySelector(".role-switch");
    if (!backend.enabled) {
      if (roleSwitch) roleSwitch.style.display = "flex";
      return;
    }
    if (roleSwitch) roleSwitch.style.display = "none";
    let old = document.getElementById("accountPill");
    if (old) old.remove();
    if (!backend.user) return;
    const el = document.createElement("div");
    el.id = "accountPill";
    el.className = "account-pill";
    el.innerHTML = `<span id="syncDot" class="sync-dot"></span><span><strong>${esc(backend.user.name || backend.user.email)}</strong> · <span class="account-role">${esc(backend.user.role)}</span></span>`;
    document.querySelector(".topbar").appendChild(el);
  }
  // A save that fails used to colour a dot that has no failure colour and write
  // a tooltip nobody hovers over, so "it didn't save" looked exactly like
  // "it saved". Everything that can tell a student otherwise is painted here,
  // from one place, off the backend's own counters.
  function saveBusy_() {
    return !!(backend.saveInFlight || backend.saveDirty || backend.saveTimer);
  }
  function paintSaveState_() {
    const failing = backend.saveFails > 0;
    const busy = saveBusy_();
    const d = document.getElementById("syncDot");
    if (d) {
      d.classList.toggle("saving", busy && !failing);
      d.classList.toggle("error", failing);
      d.title = failing
        ? "Not reaching your account right now. Your work is safe in this browser and will be sent as soon as the connection is back."
        : busy
          ? "Saving..."
          : "Saved";
    }
    const st = document.getElementById("saveStatus");
    if (st) {
      st.textContent = failing
        ? "Trying to reconnect — your work is safe in this browser"
        : busy
          ? "Saving..."
          : "Autosave on";
      const banner = st.parentElement;
      if (banner && banner.classList.contains("backend-banner"))
        banner.classList.toggle("warn", failing);
    }
    // Two failures in a row is no longer a blip. Say so where it cannot be
    // missed, and say the thing that actually matters: the work is not lost.
    let toast = document.getElementById("saveTrouble");
    if (failing && backend.saveFails >= 2) {
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "saveTrouble";
        toast.className = "save-toast warn";
        toast.innerHTML =
          "<strong>Still trying to save to your account.</strong><span>Your work is safe in this browser. Leave this tab open and it will send itself as soon as the connection comes back.</span>";
        document.body.appendChild(toast);
      }
    } else if (toast) toast.remove();
  }
  function noteSaveMerge_(kept) {
    let n = document.getElementById("saveMerged");
    if (!n) {
      n = document.createElement("div");
      n.id = "saveMerged";
      n.className = "save-toast";
      document.body.appendChild(n);
    }
    n.innerHTML =
      "<strong>Another window had newer work.</strong><span>Both copies were kept and nothing was overwritten. Reload this page to see the merged version.</span>";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = "Got it";
    b.onclick = () => n.remove();
    n.appendChild(b);
    console.warn("Merged on save; kept from the other copy:", kept);
  }
  function currentClass() {
    return backend.classes.find((c) => c.classId === backend.activeClassId) || null;
  }

  async function bootstrap() {
    if (!backend.enabled) {
      return;
    }
    document.getElementById("app").innerHTML =
      '<div class="card"><h2>Connecting to your class...</h2><p>Checking your Google Workspace account and loading saved work.</p></div>';
    try {
      const data = await rpc("getBootstrap");
      if (!data || !data.ok)
        throw new Error(data && data.message ? data.message : "Could not load account.");
      backend.ready = true;
      backend.user = {
        email: data.email,
        name: data.name,
        role: data.role,
        status: data.accessStatus,
      };
      backend.classes = data.classes || [];
      backend.activeClassId =
        data.activeClassId ||
        safeLSGet("macbethActiveClass") ||
        (backend.classes[0] || {}).classId ||
        "";
      backend.needsName = data.role === "student" && !!data.needsName;
      backend.access = data.access || [];
      backend.discussion = data.discussion || [];
      backend.grades = data.grades || {};
      backend.gradeSummary = normalizeGradeSummary_(data.gradeSummary) || null;
      // The stamp on the copy we were just handed. Every save quotes it back so
      // the server can tell whether anything else has written since.
      backend.serverUpdatedAt = data.stateUpdatedAt || "";
      state.role = data.role;
      if (data.role === "student") {
        if (backend.activeClassId) {
          const klass = currentClass() || backend.classes[0];
          backend.activeClassId = klass.classId;
          safeLSSet("macbethActiveClass", backend.activeClassId);
          const settings = parseSettings(klass.settingsJson, data.classSettings);
          const cached = JSON.parse(safeLSGet(localKey()) || "null");
          state = normalizeState(
            Object.keys(data.state || {}).length ? data.state : cached,
            settings,
          );
          state.className = klass.className;
          safeLSSet(localKey(), JSON.stringify(state));
        } else state = normalizeState({}, null);
      } else {
        state.role = data.role;
        state.view = "manage";
        if (backend.activeClassId) await loadDashboard(backend.activeClassId, false);
      }
      setAccountHeader();
      render();
    } catch (e) {
      backend.ready = true;
      setAccountHeader();
      document.getElementById("sidebar").innerHTML = "";
      document.getElementById("app").innerHTML =
        `<div class="card"><h2>Backend setup needed</h2><p>${esc(e.message)}</p><p class="toolbar-note">If this is the first deployment, run <strong>setupGatsbyBackend()</strong> once in Apps Script, then redeploy the web app so users sign in with their school Google account.</p></div>`;
    }
  }
  function parseSettings(json, fallback) {
    try {
      return fallback || JSON.parse(json || "{}");
    } catch (e) {
      return (
        fallback || {
          releasedActs: [1],
          releasedScenes: {},
          releasedEssayThrough: "self",
          teacherResources: true,
        }
      );
    }
  }

  save = function () {
    safeLSSet(localKey(), JSON.stringify(state));
    if (!backend.enabled || !backend.ready || !backend.activeClassId) return;
    backend.saveDirty = true;
    clearTimeout(backend.saveTimer);
    backend.saveTimer = setTimeout(() => {
      backend.saveTimer = null;
      flushSave_();
    }, 650);
    paintSaveState_();
  };

  // Everything a save can do wrong, it used to do:
  //   - an edit made inside the 650ms debounce was simply never sent if the
  //     tab closed first;
  //   - a save that failed was caught, logged, and FORGOTTEN -- the text only
  //     went up again if the student happened to keep typing;
  //   - two saves could be in the air at once, so the older one could land last.
  // One sender, nothing dropped: a failure puts the work straight back on the
  // dirty pile and comes back for it, and anything typed while a save is in the
  // air is sent the moment that one lands.
  async function flushSave_() {
    clearTimeout(backend.saveTimer);
    backend.saveTimer = null;
    clearTimeout(backend.saveRetryTimer);
    backend.saveRetryTimer = null;
    if (!backend.enabled || !backend.ready || !backend.activeClassId || !backend.user) return;
    if (!backend.saveDirty || backend.saveInFlight) return;
    backend.saveInFlight = true;
    backend.saveDirty = false;
    paintSaveState_();
    try {
      if (backend.user.role === "student") {
        const res = await rpc("saveStudentState", {
          classId: backend.activeClassId,
          state: state,
          baseUpdatedAt: backend.serverUpdatedAt || "",
        });
        if (res && res.updatedAt) backend.serverUpdatedAt = res.updatedAt;
        if (res && res.merged) noteSaveMerge_(res.kept || []);
      } else if (backend.dashboard) {
        await rpc("saveClassSettings", {
          classId: backend.activeClassId,
          settings: {
            releasedActs: state.releasedActs || [1],
            releasedScenes: state.releasedScenes || {},
            releasedEssayThrough: state.releasedEssayThrough || "self",
            teacherResources: state.teacherResources !== false,
            modernSupport: true,
          },
        });
      }
      backend.saveFails = 0;
      backend.lastSaved = new Date().toISOString();
      backend.saveInFlight = false;
      paintSaveState_();
      if (backend.saveDirty) flushSave_(); // they carried on typing while it sent
    } catch (e) {
      backend.saveInFlight = false;
      backend.saveDirty = true; // still owed to the server
      backend.saveFails = (backend.saveFails || 0) + 1;
      console.error(e);
      paintSaveState_();
      const wait = Math.min(30000, 800 * Math.pow(2, Math.min(backend.saveFails, 6)));
      backend.saveRetryTimer = setTimeout(() => flushSave_(), wait);
    }
  }
  backend.__flushSave = flushSave_;

  // The gap between the last keystroke and the save going out is 650ms. Close
  // the tab, switch app, or lock the phone inside it and the old code lost that
  // edit. These send the pending save the moment the page stops being looked
  // at, which is while there is still time for it to land.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushSave_();
  });
  window.addEventListener("pagehide", () => flushSave_());
  window.addEventListener("blur", () => flushSave_());
  window.addEventListener("beforeunload", (e) => {
    if (!backend.enabled || !backend.ready || !backend.activeClassId) return;
    flushSave_();
    // Only hold them up when we already know saving is failing -- otherwise
    // this is a confirm dialog on every single tab close, for nothing.
    if (backend.saveFails > 0) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  // The name a student types here is what the teacher sees in the marking
  // list, so first and last are separate required fields.
  function splitStoredName_(name) {
    let parts = String(name || "")
      .trim()
      .replace(/\s+/g, " ")
      .split(" ");
    if (parts.length < 2 || /\d/.test(String(name || ""))) return { first: "", last: "" };
    return { first: parts.shift(), last: parts.join(" ") };
  }
  function nameFieldsHtml_(name) {
    let n = splitStoredName_(name);
    return `<div class="name-fields"><div class="field"><label>First name</label><input id="joinFirst" value="${esc(n.first)}" placeholder="Alex" autocomplete="given-name"></div><div class="field"><label>Last name</label><input id="joinLast" value="${esc(n.last)}" placeholder="Rivera" autocomplete="family-name"></div></div>`;
  }
  function readNameFields_() {
    let f = (document.getElementById("joinFirst") || {}).value || "";
    let l = (document.getElementById("joinLast") || {}).value || "";

  manage = function () {

  // ---- Batch grading: grade one written-response question across the whole class ----
  // Keyed by classId+sceneKey (not just sceneKey) so switching classes never shows a
  // stale class's responses under the same scene. Loaded once per scene, then cached
  // and re-sorted only on load -- a grading click patches that one row in place rather
  // than re-rendering the whole list, so the page never jumps while you work down it.
  function sceneCacheKey_(classId, sceneKey) {
    return classId + "::" + sceneKey;
  }
  function getBatchResponses_() {
    return backend.sceneResponseCache[sceneCacheKey_(backend.activeClassId, backend.batchSceneKey)];
  }
  function getBatchResponse_(email) {
    let list = getBatchResponses_();
    return list ? list.find((r) => r.email === email) : null;
  }
  function applyBatchLocalUpdate_(email, patch) {
    let r = getBatchResponse_(email);
    if (!r) return;
    if (patch.score !== undefined) r.score = patch.score;
    if (patch.excluded !== undefined) r.excluded = patch.excluded;
    if (patch.comment !== undefined) r.comment = patch.comment;
    // Any grading action re-snapshots the response on the server, so the
    // "redone since marking" flag is answered. Clear it HERE, before the row
    // redraws -- clearing it inside the save call happens a beat too late and
    // the badge survives its own dismissal.
    r.editedAfterGrading = false;
  }
  // Any grade change makes the cached dashboard's Act totals stale, so drop it and
  // let the Teacher Dashboard refetch next time it's opened.
  function invalidateDashboardCache_() {
    delete backend.dashboardCache[backend.activeClassId];
    // The tiles' "needs grading" counts are the first thing a grade changes, so
    // they go stale at exactly the same moment the dashboard does.
    delete backend.gradingHubCache[backend.activeClassId];
  }
  async function toggleExcludeWholeClass_() {
    let responses = getBatchResponses_() || [];
    if (!responses.length) return;
    let sceneKey = backend.batchSceneKey;
    let next = !responses.every((r) => r.excluded);
    let btn = document.getElementById("excludeAllBtn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = next ? "Excluding…" : "Restoring…";
    }
    try {
      await rpc("setGradeItemForClass", {
        classId: backend.activeClassId,
        itemType: "dok",
        itemKey: sceneKey,
        excluded: next,
      });
      responses.forEach((r) => (r.excluded = next));
      invalidateDashboardCache_();
    } catch (e) {
      alert("Could not update the whole class: " + e.message);
    }
    if (state.view === "batchGrade") refreshBatchView_();
  }
  async function saveBatchGradeItem_(email, patch) {
    invalidateDashboardCache_();
    // The server re-snapshots the response text on every save, so whatever was
    // flagged as redone has now been seen by you. Mirror that locally rather
    // than leaving a stale flag until the next fetch.
    let cached = getBatchResponse_(email);
    if (cached) cached.editedAfterGrading = false;
    try {
      await rpc("setGradeItem", {
        classId: backend.activeClassId,
        studentEmail: email,
        itemType: "dok",
        itemKey: backend.batchSceneKey,
        score: patch.score !== undefined ? patch.score : null,
        excluded: !!patch.excluded,
        comment: patch.comment !== undefined ? patch.comment : ((getBatchResponse_(email) || {}).comment || ""),
      });
    } catch (e) {
      alert("Could not save that grade -- try again: " + e.message);
    }
  }
  // Sort priority: ungraded first (the actual to-do list), then incomplete
  // (nothing submitted yet, so you can see who to chase), then already-graded
  // last since they need no further attention.
  // -1 = redone since you marked it (your score is attached to text that has
  // changed, so it goes to the very top), 0 = waiting on you, 1 = nothing
  // submitted, 2 = done.
  // -1 redone since marking, 0 waiting on you, 1 nothing submitted, 2 done,
  // 3 excluded. Excluded gets its own group at the bottom: it used to share
  // "Already graded", which is untrue -- an excluded response has no score and
  // never will, and lumping the two together made a question excluded for the
  // whole class look like a class that had already been marked.
  function batchSortRank_(r) {
    if (r.excluded) return 3;
    if (r.editedAfterGrading && r.dokText) return -1;
    // A SCORE WINS OVER EVERYTHING ELSE. This check used to sit below the
    // no-response check, which meant giving a non-submitter a zero left them
    // parked in Incomplete for ever -- you could mark the whole group and watch
    // nothing move. Incomplete now means "still needs a decision from you".
    if (hasScore_(r.score)) return 2;
    if (!r.dokText) return 1;
    return 0;
  }
  function batchSortCompare_(a, b) {
    let ra = batchSortRank_(a),
      rb = batchSortRank_(b);
    if (ra !== rb) return ra - rb;
    return String(a.name || "").localeCompare(String(b.name || ""));
  }
  // ---- Rubric presentation, ported from the Short Story app ----
  // The 1-7 descriptors in DOK_RUBRIC are written as "Name. Sentence...", so
  // the leading word is the band name. Showing the name on the button (and in
  // the status chip) is the difference between picking a number and applying a
  // rubric.
  // Turns a "Name. Sentence..." descriptor array (index 0 unused, 1-7) into the
  // shape the marking UI renders. Every 7-point rubric in the app -- the scene
  // written response and the four essay steps -- is written that way, so they
  // all get the same buttons, the same legend and the same off-band note.
  function rubricFrom_(arr, label) {
    let levels = [];
    for (let n = arr.length - 1; n >= 1; n--) {
      let full = String(arr[n] || "");
      let dot = full.indexOf(". ");
      levels.push({
        points: n,
        label: dot > 0 ? full.slice(0, dot) : "Level " + n,
        text: dot > 0 ? full.slice(dot + 2) : full,
      });
    }
    return { label: label, levels: levels, max: arr.length - 1 };
  }
  const MB_RUBRIC = rubricFrom_(DOK_RUBRIC, "Written Response");
  // Every rubric in the app can be reached by name, so one marking screen can
  // switch between them by changing a key rather than a code path.
  const ESSAY_RUBRICS = {
    discussion: rubricFrom_(DISCUSSION_RUBRIC, "Thesis Discussion"),
    body: rubricFrom_(BODY_RUBRIC, "Body Paragraphs"),
    intro: rubricFrom_(INTRO_RUBRIC, "Introduction"),
    conclusion: rubricFrom_(CONCLUSION_RUBRIC, "Conclusion"),
  };
  function rubricLevelName_(score, rubric) {
    if (!hasScore_(score)) return "";
    let l = (rubric || MB_RUBRIC).levels.find((x) => x.points === Number(score));
    return l ? l.label : "";
  }
  function rubricLevelRow_(currentScore, btnClass, dataAttrs, rubric) {
    return `<div class="score-btn-row rubric-level-row">${(rubric || MB_RUBRIC).levels
      .map(
        (l) =>
          `<button type="button" class="${btnClass} rubric-level-btn ${hasScore_(currentScore) && Number(currentScore) === l.points ? "selected" : ""}" ${dataAttrs} data-score="${l.points}" title="${esc(l.text || l.label)}"><span class="rubric-level-name">${esc(l.label)}</span><span class="rubric-level-pts">${l.points}</span></button>`,
      )
      .join("")}</div>`;
  }
  // A free numeric box beside the bands, because a response is sometimes a 5.5
  // and forcing it onto a band loses that.
  function teacherScoreInputHtml_(inputClass, score, attrs, max) {
    let m = max === undefined ? DOK_POINTS : max;
    return `<div class="teacher-score-entry"><label><span>Teacher score</span><span>1\u2013${m} \u00b7 decimals allowed</span></label><input type="number" class="${inputClass}" min="0" max="${m}" step="0.5" value="${hasScore_(score) ? esc(String(score)) : ""}" ${attrs || ""} placeholder="Score"></div>`;
  }
  function teacherScoreValue_(input, max) {
    let m = max === undefined ? DOK_POINTS : max;
    let raw = String(input.value || "").trim();
    if (!raw) return null;
    let n = Number(raw);
    if (!Number.isFinite(n) || n < 0 || n > m) {
      alert("Enter a score from 0 to " + m + ".");
      input.focus();
      return undefined;
    }
    return Math.round(n * 100) / 100;
  }
  // The descriptors are the reason for having a rubric, so they are readable
  // without hovering every button.
  function rubricLegendHtml_(note, rubric) {
    let rb = rubric || MB_RUBRIC;
    return `<details class="rubric-legend"><summary>${esc(rb.label)} rubric &mdash; the full descriptors</summary>${rb.levels
      .map(
        (l) =>
          `<div class="rubric-legend-row"><span class="rubric-legend-level">${esc(l.label)} <strong>${l.points}</strong></span><span class="rubric-legend-text">${esc(l.text || "")}</span></div>`,
      )
      .join("")}${note ? `<small class="rubric-legend-note">${note}</small>` : ""}</details>`;
  }
  // A score that sits between bands (5.5) still counts, but no button lights
  // up -- say so rather than letting it read as ungraded.
  function offRubricNoteHtml_(score, rubric) {
    if (!hasScore_(score)) return "";
    if ((rubric || MB_RUBRIC).levels.some((l) => l.points === Number(score))) return "";
    return `<p class="toolbar-note">Teacher-entered score: <strong>${score}</strong>. It falls between the rubric's bands.</p>`;
  }

  // Badges follow the same order the buckets do, and a student can carry two of
  // them: scoring someone who submitted nothing should still say so.
  function batchStatusBadgeHtml_(r) {
    if (r.excluded) return `<span class="mini-chip batch-status-badge batch-badge-excluded">Excluded</span>`;
    let out = "";
    if (!r.dokText) out += `<span class="mini-chip batch-status-badge">Not submitted</span>`;
    if (hasScore_(r.score)) {
      let n = rubricLevelName_(r.score);
      out += `<span class="mini-chip batch-status-badge batch-badge-graded">${n ? esc(n) + " " : ""}${r.score}/7</span>`;
    } else if (r.dokText) {
      out += `<span class="mini-chip batch-status-badge batch-badge-needs">Needs grading</span>`;
    }
    return out;
  }
  // Shown when the response no longer matches what was on screen at the moment
  // it was marked. Re-saving the mark refreshes the record and clears this.
  function batchEditedBadgeHtml_(r) {
    if (!r.editedAfterGrading || !r.dokText) return "";
    let when = r.gradedAt ? new Date(r.gradedAt).toLocaleDateString() : "";
    return `<span class="mini-chip batch-edited-badge" title="This answer has been changed since you marked it${when ? " on " + when : ""}. Your score is still the one you gave the old version. Re-read it and set a score to clear this.">✎ Redone since marking</span>`;
  }
  // Only outside pastes get a badge. A quotation lifted from the scene is what
  // the question asks for, so it is highlighted in the text but not flagged.
  function batchPasteBadgeHtml_(r) {
    let p = r.paste;
    if (!r.dokText || !p || !p.pasted) return "";
    let pct = Math.round((p.pasted / (p.total || r.dokText.length || 1)) * 100);
    return `<span class="mini-chip batch-paste-badge" title="Part of this answer was pasted in from outside the app. Worth a conversation, not a verdict.">📋 ${pct}% pasted</span>`;
  }
  // Renders a response with any pasted stretches marked. Spans come from the
  // student's own typing record; text pasted out of the scene is shown as a
  // quotation rather than as an outside paste, because citing the novel is the
  // assignment. Every segment is escaped separately, so nothing a student types
  // can inject markup.
  function responseHtmlWithPaste_(text, paste) {
    if (!text) return "<em>No written response submitted yet.</em>";
    let spans = paste && Array.isArray(paste.spans) ? paste.spans.slice() : [];
    if (!spans.length) return esc(text);
    spans.sort((a, b) => a[0] - b[0]);
    let out = "";
    let at = 0;
    spans.forEach((sp) => {
      let a = Math.max(at, sp[0]);
      let b = Math.min(text.length, sp[1]);
      if (b <= a) return;
      if (a > at) out += esc(text.slice(at, a));
      let cls = sp[2] === "q" ? "paste-quote" : "paste-outside";
      let title = sp[2] === "q" ? "Pasted from the scene text (a quotation)" : "Pasted in from somewhere outside the app";
      out += `<mark class="${cls}" title="${title}">${esc(text.slice(a, b))}</mark>`;
      at = b;
    });
    if (at < text.length) out += esc(text.slice(at));
    return out;
  }
  function pasteSummaryHtml_(r) {
    let p = r.paste;
    if (!r.dokText) return "";
    if (!p || (!p.pasted && !p.quoted)) {
      return `<p class="paste-note">Typed — nothing pasted in.</p>`;
    }
    let total = p.total || r.dokText.length || 1;
    let pct = Math.round((p.pasted / total) * 100);
    let bits = [];
    if (p.pasted) bits.push(`<strong>${p.pasted} of ${total} characters (${pct}%) pasted from outside</strong>`);
    if (p.quoted) bits.push(`${p.quoted} pasted from the scene text`);
    return `<p class="paste-note ${p.pasted ? "warn" : ""}">${bits.join(" · ")}</p>`;
  }
  // ---- Grading buckets, ported from the Short Story app ----
  // Every bucket renders even when it holds nobody. That is the whole point: an
  // empty group that disappears is indistinguishable from a broken sort, which
  // is exactly how a scene excluded for the entire class came to look like a
  // class that had already been marked.
  function batchGroupMeta_(rank) {
    if (rank === -1) return { label: "Redone since marking", note: "Rewritten after you scored it" };
    if (rank === 0) return { label: "Ready to Grade", note: "Finished work that still needs a score" };
    if (rank === 1) return { label: "Incomplete", note: "No response submitted yet" };
    if (rank === 2) return { label: "Graded", note: "Already scored" };
    return { label: "Excluded", note: "Not counted for these students" };
  }
  const BATCH_RANKS = [-1, 0, 1, 2, 3];
  // opts lets the essay screens reuse this with their own row renderer, their own
  // rank function and their own bucket names, rather than growing a second copy
  // of the grouping logic that would then drift from this one.
  function batchGroupedListHtml_(sceneKey, rows, opts) {
    opts = opts || {};
    let rowHtml = opts.rowHtml || ((r) => batchStudentRowHtml_(sceneKey, r));
    let rankFn = opts.rankFn || batchSortRank_;
    let metaFn = opts.metaFn || batchGroupMeta_;
    let buckets = {};
    BATCH_RANKS.forEach((k) => (buckets[k] = []));
    (rows || []).forEach((r) => {
      let rank = rankFn(r);
      if (buckets[rank] === undefined) rank = 1;
      buckets[rank].push(r);
    });
    BATCH_RANKS.forEach((k) =>
      buckets[k].sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""))),
    );
    return `<div class="batch-grade-groups">${BATCH_RANKS.map((rank) => {
      let meta = metaFn(rank);
      let items = buckets[rank];
      if (!items.length && (rank === -1 || rank === 3)) return ""; // only the core three are shown empty
      return `<section class="batch-grade-group ${items.length ? "" : "is-empty"}" data-grade-group="${rank}"><div class="batch-grade-group-head"><div><strong>${meta.label}</strong><span>${meta.note}</span></div><span class="batch-grade-group-count">${items.length}</span></div><div class="batch-group-list">${items
        .map(rowHtml)
        .join("")}</div></section>`;

  }
  function refreshBatchGroupCounts_(root) {
    if (!root) return;
    root.querySelectorAll(".batch-grade-group").forEach((group) => {
      let list = group.querySelector(".batch-group-list");
      let count = list ? list.querySelectorAll(":scope > .batch-row").length : 0;
      let chip = group.querySelector(".batch-grade-group-count");

  // Scoring a response moves its row into Graded straight away, instead of

  function resortBatchRows_(row, rank, studentName) {
    if (!row) return;

    target.appendChild(row);
    let rows = Array.from(target.children).filter((el) => el.classList && el.classList.contains("batch-row"));
    rows.sort((a, b) => String(a.dataset.studentName || "").localeCompare(String(b.dataset.studentName || "")));
    rows.forEach((el) => target.appendChild(el));
