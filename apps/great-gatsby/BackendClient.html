  }

  function batchStudentRowHtml_(sceneKey, r) {
    return `<div class="item-grade-block batch-row" data-email="${esc(r.email)}" data-grade-rank="${batchSortRank_(r)}" data-student-name="${esc(r.name || "")}">
      <h5>${esc(r.name)} ${batchStatusBadgeHtml_(r)}${batchEditedBadgeHtml_(r)}${batchPasteBadgeHtml_(r)}</h5>
      <div class="batch-work">${r.editedAfterGrading && r.dokText ? `<p class="edited-note">You gave this <strong>${hasScore_(r.score) ? r.score + "/7" : "no score"}</strong>${r.gradedAt ? " on " + esc(new Date(r.gradedAt).toLocaleDateString()) : ""}, and the student has rewritten it since. Below is the current version. <button class="btn keepMarkBtn" data-email="${esc(r.email)}" ${hasScore_(r.score) ? "" : "disabled"}>Keep ${r.score}/7</button></p>` : ""}<div class="response-box">${responseHtmlWithPaste_(r.dokText, r.paste)}</div>${pasteSummaryHtml_(r)}</div>
      <div class="grade-row-dok">${scoreButtonRow(sceneKey, { score: r.score }, r.email)}<label class="exclude-toggle"><input type="checkbox" class="batchExcludeToggle" data-email="${esc(r.email)}" ${r.excluded ? "checked" : ""}> Exclude from grade</label><textarea class="batchComment" data-email="${esc(r.email)}" placeholder="Optional feedback comment for the student">${esc(r.comment || "")}</textarea></div>
    </div>`;
  }
  function updateBatchRowUI_(email) {
    let r = getBatchResponse_(email);
    if (!r) return;
    let row = document.querySelector('.batch-row[data-email="' + email + '"]');
    if (!row) return;
    let h5 = row.querySelector("h5");
    if (h5) h5.innerHTML = `${esc(r.name)} ${batchStatusBadgeHtml_(r)}${batchEditedBadgeHtml_(r)}${batchPasteBadgeHtml_(r)}`;
    if (!r.editedAfterGrading) {
      let note = row.querySelector(".edited-note");
      if (note) note.remove();
    }
    let manual = row.querySelector(".dokManualScore");
    if (manual) manual.value = hasScore_(r.score) ? r.score : "";
    row.querySelectorAll(".score-btn").forEach((btn) => {
      btn.classList.toggle("selected", hasScore_(r.score) && Number(btn.dataset.score) === Number(r.score));
    });
    let excludeCb = row.querySelector(".batchExcludeToggle");
    if (excludeCb) excludeCb.checked = r.excluded;
    resortBatchRows_(row, batchSortRank_(r), r.name);
  }
  async function loadSceneResponses(sceneKey, forceRefresh) {
    backend.batchSceneKey = sceneKey;
    let classId = backend.activeClassId;
    let key = sceneCacheKey_(classId, sceneKey);
    let cached = backend.sceneResponseCache[key];
    if (state.view === "batchGrade") refreshBatchView_(); // instant from cache, or the "Loading responses…" placeholder
    if ((cached && !forceRefresh) || backend.sceneResponsePending[key]) return;
    backend.sceneResponsePending[key] = true;
    try {
      let fresh = await rpc("getSceneResponses", { classId: classId, sceneKey: sceneKey });
      backend.sceneResponseCache[key] = normalizeResponses_(fresh.responses);
      if (backend.activeClassId === classId && backend.batchSceneKey === sceneKey && state.view === "batchGrade") refreshBatchView_();
    } catch (e) {
      console.error(e);
      let list = document.getElementById("batchResponseList");
      if (list && !cached)
        list.innerHTML = `<p class="toolbar-note">Could not load responses: ${esc(e.message || String(e))}</p>`;
    } finally {
      delete backend.sceneResponsePending[key];
    }
  }
  // The scene <select> is deliberately rendered ONCE and never rebuilt by a data
  // refresh. It used to sit inside the same innerHTML as the response list, so a
  // background fetch finishing while the menu was open destroyed and recreated
  // the element mid-click -- the dropdown appeared to glitch and the click was
  // lost, and only the second attempt worked. Everything that changes with the
  // data now lives in #batchScenePanel and #batchResponseList, which are updated
  // on their own.
  function batchListHtml_(sceneKey, responses) {
    if (!responses) {
      let key = sceneCacheKey_(backend.activeClassId, sceneKey);
      if (!backend.sceneResponsePending[key]) setTimeout(() => loadSceneResponses(sceneKey), 0);
      return `<p class="toolbar-note">Loading responses…</p>`;
    }
    if (!responses.length) return `<p>No students enrolled in this class yet.</p>`;
    if (responses.every((r) => r.excluded)) {
      let wrote = responses.filter((r) => r.dokText).length;
      return (
        `<p class="all-excluded-note"><strong>This question is excluded for the whole class</strong>, so there is nothing to grade here${
          wrote ? ` — ${wrote} student(s) wrote a response, but it is not being counted` : ""
        }. Use the button above to count it again.</p>` +
        batchGroupedListHtml_(sceneKey, responses)
      );
    }
    let shown = backend.batchHideUnsubmitted ? responses.filter((r) => batchSortRank_(r) !== 1) : responses;
    let hidden = responses.length - shown.length;
    let anyPaste = responses.some((r) => r.paste && (r.paste.pasted || r.paste.quoted));
    let legend = anyPaste
      ? `<p class="paste-legend"><span><span class="swatch" style="background:#ffe0e0;border:1px solid #d4676a"></span>pasted from outside</span><span><span class="swatch" style="background:#fdf3d6;border:1px solid #d9b755"></span>pasted from the scene (a quotation)</span><span>Unmarked text was typed.</span></p>`
      : "";
    let note = hidden
      ? `<p class="toolbar-note">${hidden} student(s) who haven't submitted are hidden.</p>`
      : "";
    return legend + batchGroupedListHtml_(sceneKey, shown) + note;
  }

  function batchPanelHtml_(sceneKey, responses) {
    let q = QUESTIONS[sceneKey];
    let allExcluded = !!(responses && responses.length && responses.every((r) => r.excluded));
    let excludeBtn =
      responses && responses.length
        ? `<div class="exclude-all-row ${allExcluded ? "is-excluded" : ""}"><button class="btn ${allExcluded ? "primary" : ""}" id="excludeAllBtn">${
            allExcluded ? "↺ Count this question again for everyone" : "🚫 Don't grade this question for anyone"
          }</button><span class="toolbar-note">${
            allExcluded
              ? `Excluded for the whole class — Chapter ${CHAPTERS[sceneKey].act} is now worth ${DOK_POINTS} points less for every student, and the Canvas CSV you export will show the lower total.`
              : `Use this if the question turned out to be flawed or unfair. It comes out of every student's Chapter ${CHAPTERS[sceneKey].act} total (${DOK_POINTS} points) rather than counting as a zero.`
          }</span></div>`
        : "";
    return `<p class="dok-prompt">${esc(q ? q[3] : "")}</p>${rubricLegendHtml_("Keep this open while you score the class. Click a band, or type an exact score in the box beside it.")}<label class="exclude-toggle" style="margin-top:6px"><input type="checkbox" id="hideUnsubmitted" ${backend.batchHideUnsubmitted ? "checked" : ""}> Hide students who haven't submitted</label>${excludeBtn}`;
  }

  // Updates just the two data-driven panels, leaving the dropdown alone.
  // Falls back to a full render if the batch screen isn't on show.
  function refreshBatchView_() {
    let panel = document.getElementById("batchScenePanel");
    let list = document.getElementById("batchResponseList");
    if (!panel || !list) {
      if (state.view === "batchGrade") render();
      return;
    }
    let sceneKey = backend.batchSceneKey;
    let responses = getBatchResponses_();
    panel.innerHTML = batchPanelHtml_(sceneKey, responses);
    list.innerHTML = batchListHtml_(sceneKey, responses);
    bindBackend();
  }

  batchGrade = function () {
    if (!backend.enabled) return original.batchGrade();
    if (!backend.activeClassId)
      return `<div class="sectionhead"><h2>Grade Written Responses</h2></div><p class="toolbar-note">Choose a class from the Teacher Dashboard first.</p>`;
    if (!backend.batchSceneKey) backend.batchSceneKey = Object.keys(CHAPTERS).sort(sceneSort)[0];
    let sceneKey = backend.batchSceneKey;
    let sceneOptions = Object.keys(CHAPTERS)
      .sort(sceneSort)
      .map((k) => `<option value="${k}" ${k === sceneKey ? "selected" : ""}>Chapter ${CHAPTERS[k].act}</option>`)
      .join("");
    let responses = getBatchResponses_();
    return `<div class="sectionhead"><h2>Grade Written Responses</h2><button class="btn" id="backToDashboard">← Back to Dashboard</button></div><div class="card"><div class="field" style="max-width:360px"><label>Chapter</label><select id="batchSceneSelect">${sceneOptions}</select></div><div id="batchScenePanel">${batchPanelHtml_(sceneKey, responses)}</div></div><div id="batchResponseList">${batchListHtml_(sceneKey, responses)}</div>`;
  };
  // ---- Grade the essay, one step at a time ----------------------------------
  // The same screen as Grade Written Responses, keyed by essay step instead of
  // scene. It deliberately reuses that screen's grouping, sorting and rubric
  // rendering rather than growing a parallel copy: two marking screens that look
  // the same but behave differently is worse than either one alone.
  const ESSAY_GRADE_STEPS = ESSAY_STEP_KEYS.concat(["final"]);
  const ESSAY_GRADE_LABELS = Object.assign({}, ESSAY_STEP_LABELS, { final: "Final Essay" });
  // Column headings have to fit eleven of them across one table.
  const ESSAY_GRADE_SHORT = {
    thesis: "Thesis", discussion: "Discussion", body: "Body", intro: "Intro", conclusion: "Conclusion", final: "Final Essay",
  };

  function essayCacheKey_(classId, stepKey) { return classId + "::essay::" + stepKey; }
  function getEssayRows_() {
    return backend.essayResponseCache[essayCacheKey_(backend.activeClassId, backend.essayStepKey)];
  }
  function getEssayRow_(email) {
    let list = getEssayRows_();
    return list ? list.find((r) => r.email === email) : null;
  }
  // The thesis is a completion mark the app fills in: a drafted thesis is
  // complete without the teacher clicking anything. Everywhere else, "graded"
  // means the teacher put a number on it.
  function essayIsThesis_() { return backend.essayStepKey === "thesis"; }
  function essayRubric_() { return ESSAY_RUBRICS[backend.essayStepKey] || MB_RUBRIC; }
  function essayStepMax_() { return essayIsThesis_() ? 1 : DOK_POINTS; }

  function essayRowRank_(r) {
    if (r.excluded) return 3;
    if (r.editedAfterGrading && r.text) return -1;
    if (hasScore_(r.score)) return 2;
    if (!r.text) return 1;
    return 0;
  }
  function essayGroupMeta_(rank) {
    if (!essayIsThesis_()) return batchGroupMeta_(rank);
    if (rank === -1) return { label: "Redone since marking", note: "Rewritten after you marked it" };
    if (rank === 0) return { label: "Ready to Grade", note: "Needs a decision from you" };
    if (rank === 1) return { label: "Not drafted", note: "No thesis written yet" };
    if (rank === 2) return { label: "Complete", note: "A thesis is drafted" };
    return { label: "Excluded", note: "Not counted for these students" };
  }
  function essayStatusBadgeHtml_(r) {
    if (r.excluded) return `<span class="mini-chip batch-status-badge batch-badge-excluded">Excluded</span>`;
    let out = "";
    if (!r.text) out += `<span class="mini-chip batch-status-badge">Not submitted</span>`;
    if (essayIsThesis_()) {
      if (hasScore_(r.score))
        out += `<span class="mini-chip batch-status-badge batch-badge-graded">${Number(r.score) > 0 ? "Complete" : "Not complete"}${r.auto ? "" : " (yours)"}</span>`;
      else if (r.text) out += `<span class="mini-chip batch-status-badge batch-badge-needs">Needs a decision</span>`;
      return out;
    }
    if (hasScore_(r.score)) {
      let n = rubricLevelName_(r.score, essayRubric_());
      out += `<span class="mini-chip batch-status-badge batch-badge-graded">${n ? esc(n) + " " : ""}${r.score}/${DOK_POINTS}</span>`;
    } else if (r.text) {
      out += `<span class="mini-chip batch-status-badge batch-badge-needs">Needs grading</span>`;
    }
    return out;
  }
  function essayEditedBadgeHtml_(r) {
    if (!r.editedAfterGrading || !r.text) return "";
    let when = r.gradedAt ? new Date(r.gradedAt).toLocaleDateString() : "";
    return `<span class="mini-chip batch-edited-badge" title="This has been changed since you marked it${when ? " on " + when : ""}. Your score is still the one you gave the old version. Re-read it and set a score to clear this.">✎ Redone since marking</span>`;
  }

  // What the teacher actually reads, which is different for every step: a
  // thesis is one sentence, the body step is several paragraphs plus an optional
  // counterargument, the discussion is a list of posts.
  function essayWorkHtml_(r) {
    let step = backend.essayStepKey;
    let thesis = r.thesis ? `<p class="essay-thesis-line"><strong>Their thesis:</strong> ${esc(r.thesis)}</p>` : "";
    if (step === "discussion") {
      if (!r.posts || !r.posts.length) return `<div class="response-box"><em>Nothing posted to the discussion yet.</em></div>`;
      return r.posts
        .map((p) => `<div class="response-box"><small class="essay-post-date">${esc(new Date(p.date).toLocaleString())}</small><p>${esc(p.text)}</p></div>`)
        .join("");
    }
    if (step === "body") {
      let bodies = Array.isArray(r.bodies) ? r.bodies : [];
      let blocks = bodies
        .map((b, i) => `<div class="response-box essay-para"><strong>Body Paragraph ${i + 1}${i >= 3 ? " (extra)" : ""}</strong><p>${b && b.trim() ? esc(b) : "<em>Not drafted</em>"}</p></div>`)
        .join("");
      let reb = String(r.rebuttal || "").trim()
        ? `<div class="response-box essay-para essay-rebuttal"><strong>Counterargument</strong> <span class="mini-chip body-chip-extra">Optional</span><p>${esc(r.rebuttal)}</p></div>`
        : `<p class="toolbar-note">No counterargument paragraph — it is optional, so this is not a gap.</p>`;
      return thesis + (blocks || `<div class="response-box"><em>Nothing drafted yet.</em></div>`) + reb;
    }
    return thesis + `<div class="response-box">${r.text ? esc(r.text) : "<em>Nothing drafted yet.</em>"}</div>`;
  }

  // The thesis row asks a yes/no question, so it gets two buttons rather than a
  // seven-band rubric. Anything else would be pretending to measure something.
  function essayScoreRowHtml_(r) {
    if (essayIsThesis_()) {
      let val = hasScore_(r.score) ? Number(r.score) : null;
      return `<div class="score-btn-row essay-complete-row">
        <button type="button" class="essayCompleteBtn rubric-level-btn ${val === 1 ? "selected" : ""}" data-email="${esc(r.email)}" data-score="1"><span class="rubric-level-name">Complete</span><span class="rubric-level-pts">1</span></button>
        <button type="button" class="essayCompleteBtn rubric-level-btn ${val === 0 ? "selected" : ""}" data-email="${esc(r.email)}" data-score="0"><span class="rubric-level-name">Not complete</span><span class="rubric-level-pts">0</span></button>
      </div>${r.auto && val === 1 ? `<p class="toolbar-note">Marked complete automatically because a thesis is drafted. Click either button to decide it yourself.</p>` : ""}`;
    }
    let rb = essayRubric_();
    return (
      rubricLevelRow_(r.score, "essayScoreBtn", `data-email="${esc(r.email)}"`, rb) +
      teacherScoreInputHtml_("essayManualScore", r.score, `data-email="${esc(r.email)}"`, DOK_POINTS) +
      offRubricNoteHtml_(r.score, rb)
    );
  }
  function essayStudentRowHtml_(r) {
    let keep = r.editedAfterGrading && r.text
      ? `<p class="edited-note">You gave this <strong>${hasScore_(r.teacherScore) ? r.teacherScore + "/" + essayStepMax_() : "no score"}</strong>${r.gradedAt ? " on " + esc(new Date(r.gradedAt).toLocaleDateString()) : ""}, and the student has rewritten it since. Below is the current version. <button class="btn essayKeepBtn" data-email="${esc(r.email)}" ${hasScore_(r.teacherScore) ? "" : "disabled"}>Keep ${r.teacherScore}/${essayStepMax_()}</button></p>`
      : "";
    return `<div class="item-grade-block batch-row" data-email="${esc(r.email)}" data-grade-rank="${essayRowRank_(r)}" data-student-name="${esc(r.name || "")}">
      <h5>${esc(r.name)} ${essayStatusBadgeHtml_(r)}${essayEditedBadgeHtml_(r)}</h5>
      <div class="batch-work">${keep}${essayWorkHtml_(r)}</div>
      <div class="grade-row-dok">${essayScoreRowHtml_(r)}<label class="exclude-toggle"><input type="checkbox" class="essayExcludeToggle" data-email="${esc(r.email)}" ${r.excluded ? "checked" : ""}> Exclude from grade</label><textarea class="essayComment" data-email="${esc(r.email)}" placeholder="Optional feedback comment for the student">${esc(r.comment || "")}</textarea></div>
    </div>`;
  }
  function applyEssayLocalUpdate_(email, patch) {
    let r = getEssayRow_(email);
    if (!r) return;
    if (patch.score !== undefined) {
      r.score = patch.score;
      r.teacherScore = patch.score;
      r.auto = false;
      r.editedAfterGrading = false; // marking it again is reading the new version
    }
    if (patch.excluded !== undefined) r.excluded = patch.excluded;
    if (patch.comment !== undefined) r.comment = patch.comment;
  }
  function updateEssayRowUI_(email) {
    let r = getEssayRow_(email);
    if (!r) return;
    let row = document.querySelector('.batch-row[data-email="' + email + '"]');
    if (!row) return;
    let h5 = row.querySelector("h5");
    if (h5) h5.innerHTML = `${esc(r.name)} ${essayStatusBadgeHtml_(r)}${essayEditedBadgeHtml_(r)}`;
    if (!r.editedAfterGrading) {
      let note = row.querySelector(".edited-note");
      if (note) note.remove();
    }
    let manual = row.querySelector(".essayManualScore");
    if (manual) manual.value = hasScore_(r.score) ? r.score : "";
    row.querySelectorAll(".essayScoreBtn,.essayCompleteBtn").forEach((btn) => {
      btn.classList.toggle("selected", hasScore_(r.score) && Number(btn.dataset.score) === Number(r.score));
    });
    let cb = row.querySelector(".essayExcludeToggle");
    if (cb) cb.checked = r.excluded;
    resortBatchRows_(row, essayRowRank_(r), r.name);
  }
  async function toggleExcludeEssayStepForClass_() {
    let rows = getEssayRows_() || [];
    if (!rows.length) return;
    let stepKey = backend.essayStepKey;
    let next = !rows.every((r) => r.excluded);
    let btn = document.getElementById("essayExcludeAllBtn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = next ? "Excluding\u2026" : "Restoring\u2026";
    }
    try {
      await rpc("setGradeItemForClass", {
        classId: backend.activeClassId,
        itemType: "essay",
        itemKey: stepKey,
        excluded: next,
      });
      rows.forEach((r) => (r.excluded = next));
      invalidateDashboardCache_();
    } catch (e) {
      alert("Could not update the whole class: " + e.message);
    }
    if (state.view === "essayGrade") refreshEssayView_();
  }
  async function saveEssayGradeItem_(email, patch) {
    invalidateDashboardCache_();
    try {
      await rpc("setGradeItem", {
        classId: backend.activeClassId,
        studentEmail: email,
        itemType: "essay",
        itemKey: backend.essayStepKey,
        score: patch.score !== undefined ? patch.score : null,
        excluded: !!patch.excluded,
        comment: patch.comment !== undefined ? patch.comment : (getEssayRow_(email) || {}).comment || "",
      });
    } catch (e) {
      alert("Could not save that grade — try again: " + e.message);
    }
  }

  // ---- The finished essay, all four criteria at once ----
  // The teacher reads a 900-word essay once, then scores Meaning, Style, Form
  // and Conventions together. Splitting them across four passes would mean
  // reading it four times.
  function finalRowRank_(r) {
    let active = ESSAY_CRITERIA.filter((c) => !r.criteria[c].excluded);
    if (!active.length) return 3;
    if (r.finalTotal && r.finalTotal.editedAfterGrading && r.text) return -1;
    if (!r.text) return 1;
    return active.every((c) => hasScore_(r.criteria[c].teacherScore)) ? 2 : 0;
  }
  function finalGroupMeta_(rank) {
    if (rank === -1) return { label: "Redone since marking", note: "Rewritten after you scored it" };
    if (rank === 0) return { label: "Ready to Grade", note: "Still has a criterion without a score" };
    if (rank === 1) return { label: "Incomplete", note: "No essay assembled yet" };
    if (rank === 2) return { label: "Graded", note: "All four criteria scored" };
    return { label: "Excluded", note: "Not counted for these students" };
  }
  function finalSummaryHtml_(r) {
    if (!r.text) return `<span class="mini-chip batch-status-badge">Not submitted</span>`;
    let t = r.finalTotal || { earned: 0, possible: 0 };
    let scored = ESSAY_CRITERIA.filter((c) => !r.criteria[c].excluded && hasScore_(r.criteria[c].teacherScore)).length;
    let active = ESSAY_CRITERIA.filter((c) => !r.criteria[c].excluded).length;
    let cls = scored === active && active ? "batch-badge-graded" : "batch-badge-needs";
    return `<span class="mini-chip batch-status-badge ${cls}">${t.earned}/${t.possible} · ${scored}/${active} criteria</span><span class="mini-chip">${r.words} words</span>`;
  }
  function finalCriterionCardHtml_(r, c) {
    let rec = r.criteria[c] || {};
    let self = rec.selfEvalIdx !== "" && rec.selfEvalIdx !== undefined ? Number(rec.selfEvalIdx) : null;
    let btns = RUBRIC[c]
      .map((desc, i) => {
        let pts = ESSAY_CRITERION_POINTS[i];
        let official = hasScore_(rec.teacherScore) && Number(rec.teacherScore) === pts;
        let suggested = !hasScore_(rec.teacherScore) && self === i;
        return `<button type="button" class="critScoreBtn rubric-level-btn ${official ? "selected" : suggested ? "pending-suggested" : ""}" data-email="${esc(r.email)}" data-crit="${esc(c)}" data-score="${pts}" title="${esc(desc)}"><span class="rubric-level-name">${esc(ESSAY_BAND_LABELS[i])}</span><span class="rubric-level-pts">${pts}</span></button>`;
      })
      .join("");
    let selfNote =
      self !== null
        ? `<p class="toolbar-note">The student rated themselves <strong>${esc(ESSAY_BAND_LABELS[self])} (${ESSAY_CRITERION_POINTS[self]})</strong>${rec.selfComment ? ": “" + esc(rec.selfComment) + "”" : "."}${hasScore_(rec.teacherScore) ? "" : " Shown dashed above until you decide."}</p>`
        : `<p class="toolbar-note">No self-evaluation for this criterion yet.</p>`;
    return `<section class="final-criterion">
      <div class="final-criterion-head"><strong>${esc(c)}</strong>${
        rec.excluded
          ? `<span class="mini-chip batch-badge-excluded">Excluded</span>`
          : hasScore_(rec.teacherScore)
            ? `<span class="mini-chip batch-badge-graded">${rec.teacherScore}/${ESSAY_CRITERION_MAX}</span>`
            : `<span class="mini-chip batch-badge-needs">Needs grading</span>`
      }</div>
      <div class="score-btn-row rubric-level-row">${btns}</div>
      ${selfNote}
      <label class="exclude-toggle"><input type="checkbox" class="critExcludeToggle" data-email="${esc(r.email)}" data-crit="${esc(c)}" ${rec.excluded ? "checked" : ""}> Exclude ${esc(c)} from this student's grade</label>
      <textarea class="critComment" data-email="${esc(r.email)}" data-crit="${esc(c)}" placeholder="Optional ${esc(c)} comment">${esc(rec.comment || "")}</textarea>
    </section>`;
  }
  function finalStudentRowHtml_(r) {
    return `<div class="item-grade-block batch-row" data-email="${esc(r.email)}" data-grade-rank="${finalRowRank_(r)}" data-student-name="${esc(r.name || "")}">
      <h5>${esc(r.name)} ${finalSummaryHtml_(r)}</h5>
      <div class="batch-work"><div class="response-box final-essay-text">${r.text ? esc(r.text) : "<em>No essay assembled yet.</em>"}</div></div>
      <div class="final-criteria-grid">${ESSAY_CRITERIA.map((c) => finalCriterionCardHtml_(r, c)).join("")}</div>
    </div>`;
  }
  function applyFinalLocalUpdate_(email, crit, patch) {
    let r = getEssayRow_(email);
    if (!r || !r.criteria || !r.criteria[crit]) return;
    let rec = r.criteria[crit];
    if (patch.score !== undefined) { rec.teacherScore = patch.score; rec.score = patch.score; rec.pending = false; }
    if (patch.excluded !== undefined) rec.excluded = patch.excluded;
    if (patch.comment !== undefined) rec.comment = patch.comment;
    if (r.finalTotal) {
      let earned = 0, possible = 0;
      ESSAY_CRITERIA.forEach((c) => {
        let x = r.criteria[c];
        if (x.excluded) return;
        possible += ESSAY_CRITERION_MAX;
        if (hasScore_(x.teacherScore)) earned += Number(x.teacherScore);
      });
      r.finalTotal.earned = earned;
      r.finalTotal.possible = possible;
      r.finalTotal.editedAfterGrading = false;
    }
  }
  function updateFinalRowUI_(email) {
    let r = getEssayRow_(email);
    if (!r) return;
    let row = document.querySelector('.batch-row[data-email="' + email + '"]');
    if (!row) return;
    let h5 = row.querySelector("h5");
    if (h5) h5.innerHTML = `${esc(r.name)} ${finalSummaryHtml_(r)}`;
    ESSAY_CRITERIA.forEach((c) => {
      let rec = r.criteria[c];
      row.querySelectorAll(`.critScoreBtn[data-crit="${c}"]`).forEach((btn) => {
        btn.classList.toggle("selected", hasScore_(rec.teacherScore) && Number(btn.dataset.score) === Number(rec.teacherScore));
        if (hasScore_(rec.teacherScore)) btn.classList.remove("pending-suggested");
      });
      let head = row.querySelectorAll(".final-criterion-head")[ESSAY_CRITERIA.indexOf(c)];
      if (head) {
        let chip = head.querySelector(".mini-chip");
        if (chip) {
          chip.className = "mini-chip " + (rec.excluded ? "batch-badge-excluded" : hasScore_(rec.teacherScore) ? "batch-badge-graded" : "batch-badge-needs");
          chip.textContent = rec.excluded ? "Excluded" : hasScore_(rec.teacherScore) ? rec.teacherScore + "/" + ESSAY_CRITERION_MAX : "Needs grading";
        }
      }
    });
    resortBatchRows_(row, finalRowRank_(r), r.name);
  }
  async function saveFinalGradeItem_(email, crit, patch) {
    invalidateDashboardCache_();
    try {
      let rec = (getEssayRow_(email) || { criteria: {} }).criteria[crit] || {};
      await rpc("setGradeItem", {
        classId: backend.activeClassId,
        studentEmail: email,
        itemType: "essayRubric",
        itemKey: crit,
        score: patch.score !== undefined ? patch.score : null,
        excluded: !!patch.excluded,
        comment: patch.comment !== undefined ? patch.comment : rec.comment || "",
      });
    } catch (e) {
      alert("Could not save that grade — try again: " + e.message);
    }
  }

  async function loadEssayResponses(stepKey, forceRefresh) {
    backend.essayStepKey = stepKey;
    let classId = backend.activeClassId;
    let key = essayCacheKey_(classId, stepKey);
    let cached = backend.essayResponseCache[key];
    if (state.view === "essayGrade") refreshEssayView_();
    if ((cached && !forceRefresh) || backend.essayResponsePending[key]) return;
    backend.essayResponsePending[key] = true;
    try {
      let fresh = await rpc("getEssayResponses", { classId: classId, stepKey: stepKey });
      backend.essayResponseCache[key] = normalizeEssayRows_(fresh.responses, stepKey);
      if (backend.activeClassId === classId && backend.essayStepKey === stepKey && state.view === "essayGrade") refreshEssayView_();
    } catch (e) {
      console.error(e);
      let list = document.getElementById("essayResponseList");
      if (list && !cached) list.innerHTML = `<p class="toolbar-note">Could not load the essays: ${esc(e.message || String(e))}</p>`;
    } finally {
      delete backend.essayResponsePending[key];
    }
  }
  // Apps Script hands the browser `undefined` where the server returned null, so
  // every score arriving from the server is normalised at the door -- the same
  // guard the scene responses get, and for the same reason.
  function normalizeEssayRows_(rows, stepKey) {
    return (rows || []).map((r) => {
      let out = Object.assign({}, r);
      out.text = String(out.text || "");
      out.excluded = out.excluded === true;
      out.comment = String(out.comment || "");
      if (stepKey === "final") {
        out.criteria = out.criteria || {};
        ESSAY_CRITERIA.forEach((c) => {
          let rec = out.criteria[c] || {};
          rec.teacherScore = normalizeScore_(rec.teacherScore);
          rec.score = normalizeScore_(rec.score);
          rec.excluded = rec.excluded === true;
          rec.comment = String(rec.comment || "");
          rec.selfEvalIdx = rec.selfEvalIdx === undefined || rec.selfEvalIdx === null ? "" : rec.selfEvalIdx;
          out.criteria[c] = rec;
        });
        out.finalTotal = out.finalTotal || { earned: 0, possible: 0 };
        out.words = Number(out.words || 0);
      } else {
        out.score = normalizeScore_(out.score);
        out.teacherScore = normalizeScore_(out.teacherScore);
        out.auto = out.auto === true;
        out.submitted = out.submitted === true;
        out.editedAfterGrading = out.editedAfterGrading === true;
      }
      return out;
    });
  }

  function essayPanelHtml_() {
    let step = backend.essayStepKey;
    let rows = getEssayRows_();
    let intro = ESSAY_GRADE_NOTES[step] || "";
    let legend =
      step === "final"
        ? `<details class="rubric-legend"><summary>Gatsby essay rubric &mdash; the full descriptors</summary>${ESSAY_CRITERIA.map(
            (c) =>
              `<div class="rubric-legend-row"><span class="rubric-legend-level">${esc(c)}</span><span class="rubric-legend-text">${RUBRIC[c]
                .map((d, i) => `<strong>${esc(ESSAY_BAND_LABELS[i])} (${ESSAY_CRITERION_POINTS[i]})</strong> ${esc(d)}`)
                .join("<br>")}</span></div>`,
          ).join("")}<small class="rubric-legend-note">This is the same rubric the students self-assess against on Step 7. Their own choice is shown dashed under each criterion until you decide.</small></details>`
        : step === "thesis"
          ? ""
          : rubricLegendHtml_("Keep this open while you score the class. Click a band, or type an exact score in the box beside it.", essayRubric_());
    let allExcluded = !!(rows && rows.length && rows.every((r) => (step === "final" ? ESSAY_CRITERIA.every((c) => r.criteria[c].excluded) : r.excluded)));
    let excludeBtn =
      rows && rows.length && step !== "final"
        ? `<div class="exclude-all-row ${allExcluded ? "is-excluded" : ""}"><button class="btn ${allExcluded ? "primary" : ""}" id="essayExcludeAllBtn">${
            allExcluded ? "↺ Count this step again for everyone" : "🚫 Don't grade this step for anyone"
          }</button><span class="toolbar-note">${
            allExcluded
              ? "Excluded for the whole class — it has no Canvas assignment and counts for nobody."
              : "Use this if you are not marking this step this time round. It comes out of every student's essay total rather than counting as a zero."
          }</span></div>`
        : "";
    return `<p class="dok-prompt">${esc(intro)}</p>${legend}${excludeBtn}`;
  }
  function essayListHtml_() {
    let step = backend.essayStepKey;
    let rows = getEssayRows_();
    if (!rows) {
      let key = essayCacheKey_(backend.activeClassId, step);
      if (!backend.essayResponsePending[key]) setTimeout(() => loadEssayResponses(step), 0);
      return `<p class="toolbar-note">Loading the class's work…</p>`;
    }
    if (!rows.length) return `<p>No students enrolled in this class yet.</p>`;
    if (step === "final")
      return batchGroupedListHtml_("", rows, { rowHtml: finalStudentRowHtml_, rankFn: finalRowRank_, metaFn: finalGroupMeta_ });
    return batchGroupedListHtml_("", rows, { rowHtml: essayStudentRowHtml_, rankFn: essayRowRank_, metaFn: essayGroupMeta_ });
  }
  function refreshEssayView_() {
    let panel = document.getElementById("essayStepPanel");
    let list = document.getElementById("essayResponseList");
    if (!panel || !list) {
      if (state.view === "essayGrade") render();
      return;
    }
    panel.innerHTML = essayPanelHtml_();
    list.innerHTML = essayListHtml_();
    bindBackend();
  }
  essayGrade = function () {
    if (!backend.enabled) return original.essayGrade();
    if (!backend.activeClassId)
      return `<div class="sectionhead"><h2>Grade the Essay</h2></div><p class="toolbar-note">Choose a class from the Teacher Dashboard first.</p>`;
    if (!backend.essayStepKey) backend.essayStepKey = ESSAY_GRADE_STEPS[0];
    let opts = ESSAY_GRADE_STEPS.map(
      (k, i) => `<option value="${k}" ${k === backend.essayStepKey ? "selected" : ""}>${i + 1}. ${esc(ESSAY_GRADE_LABELS[k])}</option>`,
    ).join("");
    return `<div class="sectionhead"><h2>Grade the Essay</h2><button class="btn" id="backToDashboard">← Back to Dashboard</button></div><div class="card"><div class="field" style="max-width:360px"><label>Essay step</label><select id="essayStepSelect">${opts}</select></div><div id="essayStepPanel">${essayPanelHtml_()}</div></div><div id="essayResponseList">${essayListHtml_()}</div>`;
  };

  // ---- The Grading Hub -------------------------------------------------------
  // Eleven tiles: the five Acts and the six pieces of the essay. Each one answers
  // the only question worth asking at a glance -- how many students are waiting
  // on me -- and is a button through to the screen where you deal with them.
  //
  // Counts come from getGradingHubSummary, fetched separately from the roster so
  // a grading click refreshes the numbers without refetching every student's
  // whole grade summary. Ported from the short story unit's Grading Hub.
  async function loadGradingHub(classId, forceRefresh) {
    classId = classId || backend.activeClassId;
    if (!classId) return;
    let cached = backend.gradingHubCache[classId];
    if (cached && !forceRefresh) {
      backend.gradingHub = cached;
      return;
    }
    if (backend.gradingHubPending[classId]) return;
    backend.gradingHubPending[classId] = true;
    try {
      let fresh = await rpc("getGradingHubSummary", { classId: classId });
      backend.gradingHubCache[classId] = fresh;
      if (backend.activeClassId !== classId) return; // switched class while this was in flight
      backend.gradingHub = fresh;
      // Repaint just the tiles, so a refresh never destroys anything the teacher
      // is part-way through elsewhere on the dashboard.
      let mount = document.getElementById("gradingHubTiles");
      if (mount && state.view === "manage") {
        mount.innerHTML = hubTilesHtml_();
        bindBackend();
      } else if (state.view === "manage") {
        render();
      }
    } catch (e) {
      console.error(e);
      let mount = document.getElementById("gradingHubTiles");
      if (mount && !cached) mount.innerHTML = `<p class="toolbar-note">Could not load the grading counts: ${esc(e.message || String(e))}</p>`;
    } finally {
      delete backend.gradingHubPending[classId];
    }
  }

  // The one line on a tile that says what it wants from you.
  function hubStatusLine_(r) {
    if (r.allExcluded) return { text: "Not graded for this class", cls: "is-excluded" };
    if (r.needsGrading > 0) return { text: r.needsGrading + " to mark", cls: "needs" };
    if (r.submitted > 0) return { text: "Caught up", cls: "done" };
    return { text: "No submissions yet", cls: "" };
  }
  // Canvas, in the smallest number of words that are still true.
  function hubCanvasNote_(asg) {
    let c = canvasSettings_();
    if (!c.courseId) return "Canvas not linked";
    let link = (c.assignments || {})[asg] || {};
    let sch = canvasSchedule_()[asg] || {};
    let parts = [link.assignmentId ? "Canvas ✓" : "Not in Canvas yet"];
    if (link.moduleName) parts.push(link.moduleName);
    let due = sch.dueAt || link.dueAt;
    if (due) {
      let d = new Date(due);
      if (!Number.isNaN(d.getTime())) parts.push("Due " + d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
    }
    return parts.join(" · ");
  }

  // Push shows as soon as the class is linked to a Canvas course, not once the
  // assignment exists: the server creates the assignment on demand, so pushing a
  // brand-new Act is still one button. Hiding it until "Create" had been pressed
  // would take a step away that already worked.
  function hubCanvasButtonsHtml_(asg) {
    let push = canvasLinked_()
      ? `<button class="btn primary hub-mini-btn push-act-btn" data-asg="${asg}" title="Send these scores to Canvas now. The assignment is created the first time and reused after that.">\u2197 Push</button>`
      : "";
    return `${push}<button class="btn hub-mini-btn hubCanvasBtn" data-asg="${asg}" title="Due date, module placement and the Canvas assignment">Canvas</button><button class="btn hub-mini-btn export-act-btn" data-asg="${asg}" title="Download a Canvas CSV">CSV</button>`;
  }

  function hubActTileHtml_(r) {
    let st = hubStatusLine_(r);
    let asg = "act:" + r.act;
    let marked = r.totalItems ? `${r.graded} of ${r.totalItems}` : "No students yet";
    // The section heading already says "The Novel", so the eyebrow carries
    // something the tile does not otherwise show: this chapter's title.
    let card = ACT_CARDS[r.act - 1];
    let range = card ? card[1] : "";
    return `<article class="hub-tile ${r.released ? "is-released" : "is-unreleased"} ${st.cls === "needs" ? "has-needs" : ""} ${r.allExcluded ? "is-nograde" : ""}" data-hubopen="act" data-key="${r.act}" data-scene="${esc(r.firstToMark)}" tabindex="0" role="button" aria-label="Mark Chapter ${r.act} written responses">
      <div class="hub-tile-top"><span class="hub-tile-eyebrow">${esc(range)}</span>${
        st.cls === "needs"
          ? `<span class="hub-needs-badge" title="${r.needsGrading} written response${r.needsGrading === 1 ? "" : "s"} waiting on you">${r.needsGrading}</span>`
          : r.submitted > 0
            ? `<span class="hub-caught-badge" title="Nothing waiting on you here">✓</span>`
            : ""
      }</div>
      <div class="hub-tile-main"><h4>Chapter ${r.act}</h4><p>Written responses and multiple choice</p>
        <span class="hub-tile-points">${r.pointsError ? "Not graded" : r.pointsPossible + " pts"}</span></div>
      <div class="hub-tile-rows">
        <div><span>Written</span><strong class="${st.cls}">${esc(st.text)}</strong></div>
        <div><span>Answered</span><strong>${r.mcPossible ? `${r.mcAnswered} of ${r.mcPossible}` : "—"}</strong></div>
        <div><span>Marked</span><strong>${esc(marked)}</strong></div>
      </div>
      <div class="hub-tile-controls">
        <label title="Show Chapter ${r.act} to students"><input type="checkbox" class="actRelease" data-act="${r.act}" ${r.released ? "checked" : ""}> Released</label>
        ${hubCanvasButtonsHtml_(asg)}
        <button class="btn hub-mini-btn actNoGradeBtn ${r.allExcluded ? "is-excluded" : ""}" data-act="${r.act}" title="${
          r.allExcluded
            ? "Count Chapter " + r.act + " again for the whole class"
            : "Leave Chapter " + r.act + " out of every student's grade. Scores you have already entered are kept."
        }">${r.allExcluded ? "\u21ba Count it again" : "\uD83D\uDEAB Don't grade"}</button>
      </div>
      <div class="hub-tile-canvas ${canvasLinked_() ? "" : "is-dim"}" id="${asgStatusId_(asg)}">${esc(hubCanvasNote_(asg))}</div>
    </article>`;
  }

  function hubEssayTileHtml_(r, idx) {
    let st = hubStatusLine_(r);
    let asg = "essay:" + r.key;
    let worth = r.gradingType === "pass_fail" ? "complete / incomplete" : r.pointsPossible + " pts";
    let marked = r.totalItems ? `${r.graded} of ${r.totalItems}` : "No students yet";
    // Whether students can reach this stage at all. The teacher always can.
    let stageOpen = essayGradeKeyReleased_(r.key);
    return `<article class="hub-tile hub-tile-essay ${stageOpen ? "" : "is-unreleased"} ${st.cls === "needs" ? "has-needs" : ""}" data-hubopen="essay" data-key="${esc(r.key)}" tabindex="0" role="button" aria-label="Mark ${esc(r.label)}">
      <div class="hub-tile-top"><span class="hub-tile-eyebrow">Essay · Step ${idx + 1}</span>${
        st.cls === "needs"
          ? `<span class="hub-needs-badge" title="${r.needsGrading} waiting on you">${r.needsGrading}</span>`
          : r.submitted > 0
            ? `<span class="hub-caught-badge" title="Nothing waiting on you here">✓</span>`
            : ""
      }</div>
      <div class="hub-tile-main"><h4>${esc(r.label)}</h4><p>${esc(ESSAY_TILE_BLURB[r.key] || "")}</p>
        <span class="hub-tile-points">${esc(worth)}</span></div>
      <div class="hub-tile-rows">
        <div><span>Status</span><strong class="${st.cls}">${esc(st.text)}</strong></div>
        <div><span>Submitted</span><strong>${r.submitted} of ${r.totalItems}</strong></div>
        <div><span>Marked</span><strong>${esc(marked)}</strong></div>
        <div><span>Students</span><strong class="${stageOpen ? "" : "is-excluded"}">${stageOpen ? "Open" : "Not open yet"}</strong></div>
      </div>
      <div class="hub-tile-controls">
        ${
          stageOpen
            ? ""
            : `<button class="btn hub-mini-btn essayOpenThroughBtn" data-estep="${esc(essayGradeKeyStage_(r.key))}" title="Open the essay through ${esc(r.label)} for this class">\u2192 Open through here</button>`
        }
        ${hubCanvasButtonsHtml_(asg)}
      </div>
      <div class="hub-tile-canvas ${canvasLinked_() ? "" : "is-dim"}" id="${asgStatusId_(asg)}">${esc(hubCanvasNote_(asg))}</div>
    </article>`;
  }

  function hubTilesHtml_() {
    let hub = backend.gradingHub;
    if (!hub) return `<p class="toolbar-note">Loading the grading counts…</p>`;
    return `<h5 class="hub-subhead">The Novel</h5>
      <div class="hub-tile-grid">${hub.acts.map(hubActTileHtml_).join("")}</div>
      <h5 class="hub-subhead">The Essay</h5>
      <div class="hub-tile-grid">${hub.essay.map(hubEssayTileHtml_).join("")}</div>`;
  }

  function gradingHubCard() {
    let hub = backend.gradingHub;
    let headline = !hub
      ? ""
      : hub.needsGradingTotal > 0
        ? `<span class="mini-chip batch-badge-needs hub-headline">${hub.needsGradingTotal} waiting on you</span>`
        : `<span class="mini-chip batch-badge-graded hub-headline">Nothing waiting on you</span>`;
    return `<div class="card">
      <div class="hub-card-head"><h3>Grading</h3>${headline}<button class="btn" id="refreshHub" title="Recount everything">↻ Refresh</button></div>
      <p class="toolbar-note">A red number means work is sitting there waiting for you. Click a tile to go straight to it.</p>
      <div id="gradingHubTiles">${hubTilesHtml_()}</div>
    </div>`;
  }

  // ---- Canvas: connect once, then push each Act straight into the gradebook ----
  function canvasSettings_() {
    // The dashboard's settings are the freshly-fetched copy. backend.classes
    // still carries whatever bootstrap loaded at sign-in, so reading that
    // first would leave a class looking unlinked right after you linked it.
    let fromDash = backend.dashboard && backend.dashboard.settings && backend.dashboard.settings.canvas;
    if (fromDash) return fromDash;
    let k = currentClass();
    return (k && parseSettings(k.settingsJson, null).canvas) || { courseId: "", assignments: {} };
  }
  function canvasLinked_() {
    return !!(backend.canvas && backend.canvas.connected && canvasSettings_().courseId);
  }
  // Due dates live beside the Canvas block, not inside it, because they are set
  // per class whether or not an assignment has been created yet.
  function canvasSchedule_() {
    let fromDash = backend.dashboard && backend.dashboard.settings && backend.dashboard.settings.assignmentSchedule;
    if (fromDash) return fromDash;
    let k = currentClass();
    return (k && parseSettings(k.settingsJson, null).assignmentSchedule) || {};
  }
  function canvasCard_() {
    let cs = canvasSettings_();
    let conn = backend.canvas || {};
    let body;
    if (!conn.checked) {
      body = `<p class="toolbar-note">Checking your Canvas connection…</p>`;
    } else if (!conn.connected) {
      body = `<p class="toolbar-note">Push scores from here into your Canvas gradebook. You'll need an access token from Canvas: <strong>Account → Settings → New Access Token</strong>. It is stored privately against your Google account, never in the class spreadsheet, and never shown to students.</p>
        <div class="field"><label>Canvas address</label><input id="canvasBaseUrl" placeholder="https://yourschool.instructure.com" value="${esc(conn.baseUrl || "")}"></div>
        <div class="field"><label>Access token</label><input id="canvasToken" type="password" placeholder="Paste the token from Canvas"></div>
        <button class="btn primary" id="canvasConnectBtn">Connect Canvas</button>`;
    } else if (conn.valid === false) {
      body = `<p class="toolbar-note" style="color:#8c1d17"><strong>Canvas rejected the saved token.</strong> ${esc(conn.message || "")} Reconnect with a fresh one.</p>
        <button class="btn" id="canvasDisconnectBtn">Disconnect and start again</button>`;
    } else {
      let who = conn.profile && conn.profile.name ? conn.profile.name : "your Canvas account";
      let courseLine = cs.courseId
        ? `<p class="toolbar-note">This class is linked to <strong>${esc(cs.courseName || cs.courseId)}</strong>${cs.assignmentGroupName ? ` · assignments go into <strong>${esc(cs.assignmentGroupName)}</strong>` : ""}. <button class="btn" id="canvasUnlinkBtn" style="font-size:12px;padding:4px 9px">Unlink</button></p>`
        : `<p class="toolbar-note">Connected as <strong>${esc(who)}</strong>. Now choose which Canvas course this class pushes to.</p>`;
      let picker = `<div class="integration-row"><div class="field"><label>Canvas course</label><select id="canvasCourseSelect"><option value="">${
          conn.courses ? "Choose a course…" : "Loading your courses…"
        }</option>${(conn.courses || []).map((c) => `<option value="${esc(c.id)}" ${c.id === cs.courseId ? "selected" : ""}>${esc(c.name)}${c.term ? " · " + esc(c.term) : ""}</option>`).join("")}</select></div>
        <div class="field"><label>Assignment group (optional)</label><select id="canvasGroupSelect"><option value="">Course default</option>${(conn.groups || []).map((g) => `<option value="${esc(g.id)}" ${g.id === cs.assignmentGroupId ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
        <div><button class="btn primary" id="canvasLinkBtn">${cs.courseId ? "Update link" : "Link this class"}</button></div></div>`;
      let links = cs.courseId && cs.assignments && Object.keys(cs.assignments).length
        ? `<p class="toolbar-note">Canvas assignments created so far: ${Object.keys(cs.assignments)
            .map((k) => cs.assignments[k])
            .sort((a, b) => a.act - b.act)
            .map((a) => `Chapter ${a.act}${a.lastGradeSyncAt ? " ✓" : ""}`)
            .join(" · ")}</p>`
        : "";
      body = courseLine + picker + links +
        `<p class="toolbar-note">${cs.courseId ? "Use <strong>↗ Push to Canvas</strong> on any Chapter below. The assignment is created the first time and reused after that." : ""}</p>
         <button class="btn" id="canvasDisconnectBtn" style="font-size:12px;padding:4px 9px">Disconnect Canvas</button>`;
    }
    return body;
  }
  // A short status chip up with the class pills, so Canvas is reachable without
  // scrolling past the roster and the gradebook to find it.
  function canvasSwitcherButton_() {
    let conn = backend.canvas || {};
    let cs = canvasSettings_();
    let label, cls;
    if (!conn.checked) { label = "Canvas…"; cls = ""; }
    else if (!conn.connected) { label = "⚙ Set up Canvas"; cls = ""; }
    else if (conn.valid === false) { label = "⚠ Canvas needs attention"; cls = "canvas-chip-bad"; }
    else if (!cs.courseId) { label = "⚙ Link a Canvas course"; cls = "canvas-chip-warn"; }
    else { label = "✓ Canvas: " + (cs.courseName || cs.courseId); cls = "canvas-chip-good"; }
    return `<button class="btn canvas-switch-btn ${cls}" id="openCanvasSetup" title="Connect Canvas, and choose which course this class pushes grades to">${esc(label)}</button>`;
  }
  function openCanvasSetupModal() {
    let root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal"><div class="modalbox canvas-setup-box"><h3>Canvas</h3>${canvasCard_()}<div class="modal-actions"><button class="btn modal-dismiss" id="closeCanvasSetup">Close</button></div><p id="canvasMsg" class="toolbar-note"></p></div></div>`;
    document.getElementById("closeCanvasSetup").onclick = () => (root.innerHTML = "");
    bindBackend();
  }
  async function loadCanvasStatus(force) {
    if (backend.canvas && backend.canvas.checked && !force) return;
    try {
      let st = await rpc("getCanvasConnectionStatus");
      backend.canvas = Object.assign({ checked: true }, st);
      if (st.connected && st.valid !== false) {
        try {
          let list = await rpc("listCanvasCourses");
          backend.canvas.courses = list.courses || [];
          let cs = canvasSettings_();
          if (cs.courseId) {
            let g = await rpc("listCanvasAssignmentGroups", { courseId: cs.courseId });
            backend.canvas.groups = g.groups || [];
          }
        } catch (e) {
          backend.canvas.message = e.message;
        }
      }
    } catch (e) {
      // Not connected, or the scope was never authorised. Either way the card
      // should offer to connect rather than sit on "checking".
      backend.canvas = { checked: true, connected: false, message: e.message };
    }
    if (state.view === "manage") render();
  }
  function canvasMsg_(text, bad) {
    let el = document.getElementById("canvasMsg");
    if (el) { el.textContent = text; el.style.color = bad ? "#8c1d17" : ""; }
  }
  // datetime-local speaks local wall-clock time with no zone; Canvas speaks
  // ISO8601 with one. Convert at the boundary in both directions so a due date
  // set at 3pm here is 3pm to the students.
  function localInputFromIso_(iso) {
    if (!iso) return "";
    let d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }
  function isoFromLocalInput_(v) {
    if (!v) return "";
    let d = new Date(v);
    return Number.isNaN(d.getTime()) ? "" : d.toISOString();
  }
  // Every Canvas assignment -- the five Acts and the six essay pieces -- is
  // addressed by one string: "act:2" or "essay:body". One code path, so a fix to
  // the Act flow cannot forget the essay flow.
  function asgPayload_(asg) {
    let str = String(asg);
    return str.indexOf("essay:") === 0 ? { kind: "essay", key: str.slice(6) } : { act: Number(str.replace("act:", "")) };
  }
  function asgLabel_(asg) {
    let str = String(asg);
    return str.indexOf("essay:") === 0 ? ESSAY_GRADE_LABELS[str.slice(6)] || str.slice(6) : "Chapter " + str.replace("act:", "");
  }
  function asgStatusId_(asg) { return "exportStatus-" + String(asg).replace(":", "-"); }

  async function openCanvasActModal(asg) {
    let name = asgLabel_(asg);
    let root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal"><div class="modalbox"><h3>${esc(name)} in Canvas</h3><p class="toolbar-note">Loading…</p></div></div>`;
    let setup;
    try {
      setup = await rpc("getCanvasActSetup", Object.assign({ classId: backend.activeClassId }, asgPayload_(asg)));
    } catch (e) {
      root.innerHTML = `<div class="modal"><div class="modalbox"><h3>${esc(name)} in Canvas</h3><p class="toolbar-note" style="color:#8c1d17">${esc(e.message)}</p><div class="modal-actions"><button class="btn modal-dismiss" id="closeCanvasAct">Close</button></div></div></div>`;
      document.getElementById("closeCanvasAct").onclick = () => (root.innerHTML = "");
      return;
    }
    let link = setup.link || {};
    let sch = setup.schedule || {};
    let moduleOptions =
      `<option value="">Not in a module</option>` +
      (setup.modules || [])
        .map((m) => `<option value="${esc(m.id)}" ${m.id === String(link.moduleId || "") ? "selected" : ""}>${esc(m.name)}${m.published ? "" : " · unpublished"}</option>`)
        .join("");
    // Assignment group for THIS assignment. Preselected with where it is in Canvas now; it is
    // sent only when changed, so a move made in Canvas is never undone from here.
    let groupNow = String(setup.currentGroupId || "");
    let groupOptions =
      (groupNow ? "" : `<option value="">Course default</option>`) +
      (setup.groups || []).map((g) => `<option value="${esc(g.id)}" ${String(g.id) === groupNow ? "selected" : ""}>${esc(g.name)}</option>`).join("");
    root.innerHTML = `<div class="modal"><div class="modalbox canvas-act-box">
      <h3>${esc(setup.label)} in Canvas</h3>
      <div class="canvas-act-meta"><span class="mini-chip">${esc(setup.canvas.courseName || setup.canvas.courseId)}</span>${
        setup.canvas.assignmentGroupName ? `<span class="mini-chip">${esc(setup.canvas.assignmentGroupName)}</span>` : ""
      }<span class="mini-chip">${setup.pointsPossible} points</span>${
        link.assignmentId ? `<span class="mini-chip batch-badge-graded">✓ Linked</span>` : `<span class="mini-chip">Not created yet</span>`
      }${setup.gradingType === "pass_fail" ? `<span class="mini-chip">Complete / incomplete</span>` : ""}${setup.published ? "" : `<span class="mini-chip">Unpublished — ${esc(name)} isn't released to students yet</span>`}${
        (setup.sharedWith || []).length ? `<span class="mini-chip canvas-chip-warn">Shared with ${esc(setup.sharedWith.join(", "))}</span>` : ""
      }</div>
      ${
        (setup.sharedWith || []).length
          ? `<p class="toolbar-note canvas-shared-note">This is <strong>one Canvas assignment</strong> serving both classes. The due date, module and points below are shared — changing them here changes them for ${esc(setup.sharedWith.join(", "))} too. Pushing grades from either class only fills in that class's own students, so neither can blank the other's.${
              setup.canvasPointsPossible !== null && Number(setup.canvasPointsPossible) !== Number(setup.pointsPossible)
                ? ` <strong>Note:</strong> Canvas currently has it out of ${setup.canvasPointsPossible} points, but this class works out to ${setup.pointsPossible} — that happens when a question is excluded for one class and not the other.`
                : ""
            }</p>`
          : ""
      }
      <p class="toolbar-note">The Great Gatsby app controls this assignment's name, points, due date, module placement and grades. Students do the work here, not in Canvas.</p>
      <div class="canvas-date-grid">
        <div class="field"><label>Due date</label><input type="datetime-local" id="canvasDueAt" value="${esc(localInputFromIso_(sch.dueAt || link.dueAt || ""))}"></div>
        <div class="field"><label>Available from <small>(optional)</small></label><input type="datetime-local" id="canvasUnlockAt" value="${esc(localInputFromIso_(sch.unlockAt || ""))}"></div>
        <div class="field"><label>Lock after <small>(optional)</small></label><input type="datetime-local" id="canvasLockAt" value="${esc(localInputFromIso_(sch.lockAt || ""))}"></div>
      </div>
      ${
        setup.appUrl
          ? `<p class="toolbar-note canvas-url-note">Students will get a link to <code>${esc(setup.appUrl)}</code>.${
              /\/dev($|\?)/.test(setup.appUrl)
                ? ` <strong>⚠ That is the test URL, not the one students can open.</strong> Deploy a new version, then press Update in Canvas to fix the link.`
                : ` It is read fresh each time you press Update or push grades, so a redeploy keeps it current.`
            }</p>`
          : `<p class="toolbar-note canvas-url-note">⚠ The app could not work out its own web address, so the assignment won't include a link to it. Everything else still works.</p>`
      }
      <div class="field"><label>Assignment group</label><select id="canvasGroupPick">${groupOptions}</select>
        <small class="toolbar-note">${
          setup.groupsError
            ? `Assignment groups could not be loaded: ${esc(setup.groupsError)}`
            : link.assignmentId
              ? "Pick a group and press Update in Canvas to move it there. Pushing grades never changes the group, so you can also move it in Canvas."
              : "The group it goes into when you create it. You can change it here or in Canvas later — pushing grades never moves it back."
        }</small></div>
      <div class="field"><label>Canvas module <small>(optional)</small></label><select id="canvasModuleSelect">${moduleOptions}</select>
        <small class="toolbar-note">${
          setup.modulesError
            ? `Modules could not be loaded: ${esc(setup.modulesError)}`
            : "Adds this assignment to an existing module. Clearing it removes the module item only — the assignment and its grades stay."
        }</small></div>
      <div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap">
        <button class="btn primary" id="syncCanvasActBtn">${link.assignmentId ? "Update in Canvas" : "Create in Canvas"}</button>
        <button class="btn" id="pushFromModalBtn" ${link.assignmentId ? "" : "disabled"}>↗ Push grades now</button>
        ${link.htmlUrl ? `<a class="btn" target="_blank" rel="noopener" href="${esc(link.htmlUrl)}">Open in Canvas ↗</a>` : ""}
        <button class="btn modal-dismiss" id="closeCanvasAct">Close</button>
      </div>
      <p id="canvasActMsg" class="toolbar-note">${
        link.lastGradeSyncAt ? "Last grade push: " + esc(new Date(link.lastGradeSyncAt).toLocaleString()) : ""
      }</p></div></div>`;
    document.getElementById("closeCanvasAct").onclick = () => (root.innerHTML = "");
    let msg = document.getElementById("canvasActMsg");
    document.getElementById("syncCanvasActBtn").onclick = async () => {
      let btn = document.getElementById("syncCanvasActBtn");
      let sel = document.getElementById("canvasModuleSelect");
      let opt = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
      let gsel = document.getElementById("canvasGroupPick");
      let groupChoice = gsel && gsel.value && gsel.value !== groupNow ? gsel.value : "";
      btn.disabled = true;
      msg.textContent = "Sending the assignment to Canvas…";
      try {
        let r = await rpc("syncCanvasAssignment", Object.assign({
          classId: backend.activeClassId,
          assignmentGroupId: groupChoice,
          dueAt: isoFromLocalInput_(document.getElementById("canvasDueAt").value),
          unlockAt: isoFromLocalInput_(document.getElementById("canvasUnlockAt").value),
          lockAt: isoFromLocalInput_(document.getElementById("canvasLockAt").value),
          moduleId: sel ? sel.value : "",
          moduleName: opt ? opt.textContent.replace(/ · unpublished$/, "") : "",
        }, asgPayload_(asg)));
        invalidateDashboardCache_();
        await loadDashboard(backend.activeClassId, false);
        await openCanvasActModal(asg);
        render();
        if (r && r.adopted) {
          let m2 = document.getElementById("canvasActMsg");
          if (m2)
            m2.textContent =
              "Joined the Canvas assignment that already existed" +
              ((r.sharedWith || []).length ? " for " + r.sharedWith.join(", ") : "") +
              " instead of creating a second one. Both classes now share it.";
        }
      } catch (e) {
        msg.textContent = e.message;
        msg.style.color = "#8c1d17";
        btn.disabled = false;
      }
    };
    let pushBtn = document.getElementById("pushFromModalBtn");
    if (pushBtn)
      pushBtn.onclick = async () => {
        pushBtn.disabled = true;
        msg.style.color = "";
        msg.textContent = "Pushing " + name + " grades…";
        try {
          let res = await rpc("pushCanvasGrades", Object.assign({ classId: backend.activeClassId }, asgPayload_(asg)));
          msg.textContent = canvasPushSummary_(res);
          invalidateDashboardCache_();
        } catch (e) {
          msg.textContent = e.message;
          msg.style.color = "#8c1d17";
        } finally {
          pushBtn.disabled = false;
        }
      };
  }
  function canvasPushSummary_(res) {
    let parts = [`Sent ${res.sent} score(s) to “${res.assignment.name}”, out of ${res.pointsPossible} points.`];
    if (res.skipped && res.skipped.length) parts.push(`Left alone (nothing done yet): ${res.skipped.join(", ")}.`);
    if (res.unmatched && res.unmatched.length)
      parts.push(`⚠ No matching Canvas student: ${res.unmatched.join(", ")} — check their Canvas login email.`);
    if (res.unmarked && res.unmarked.length)
      parts.push(`⚠ Counted as 0 because you haven't marked them yet — ${res.unmarked.join(", ")}.`);
    if (res.adjusted && res.adjusted.length) parts.push(`Scaled to keep the same percentage: ${res.adjusted.join("; ")}.`);
    if (res.pointsConflict) parts.push(`⚠ ${res.pointsConflict}`);
    return parts.join(" ");
  }
  async function pushActToCanvas(asg, btn) {
    let status = document.getElementById(asgStatusId_(asg));
    if (btn) btn.disabled = true;
    if (status) status.textContent = "Sending " + asgLabel_(asg) + " to Canvas…";
    try {
      let res = await rpc("pushCanvasGrades", Object.assign({ classId: backend.activeClassId }, asgPayload_(asg)));
      if (status) status.textContent = canvasPushSummary_(res);
      invalidateDashboardCache_();
    } catch (e) {
      if (status) status.textContent = "Canvas error: " + (e.message || String(e));
    } finally {
      if (btn) btn.disabled = false;
    }
  }
  // ---- One gradebook -------------------------------------------------------
  // Everything the unit is worth in a single table: the nine Chapters, the six
  // pieces of the essay, and a unit total. There used to be two tables with
  // three Canvas buttons stacked in every column heading, which made the
  // headings taller than the data. Those buttons live on the tiles above now,
  // where the rest of each assignment's controls already are, so this is just
  // numbers -- which is what a gradebook is for.
  function gradebookCard(dash) {
    let actCols = [1, 2, 3, 4, 5, 6, 7, 8, 9]
      .map((act) => `<th class="gb-act" title="Chapter ${act}: multiple choice + written responses">Chapter ${act}</th>`)
      .join("");
    let essayCols = ESSAY_GRADE_STEPS.map((k) => {
      let pts = k === "final" ? ESSAY_CRITERIA.length * ESSAY_CRITERION_MAX : k === "thesis" ? 1 : DOK_POINTS;
      return `<th class="gb-essay" title="${esc(ESSAY_GRADE_LABELS[k])} · ${k === "thesis" ? "complete / incomplete" : pts + " points"}">${esc(ESSAY_GRADE_SHORT[k] || ESSAY_GRADE_LABELS[k])}</th>`;
    }).join("");

    let rows = dash.students
      .map((s) => {
        let gs = s.gradeSummary || { acts: {} };
        let unitEarned = 0, unitPossible = 0, anyStarted = false;
        let actCells = [1, 2, 3, 4, 5, 6, 7, 8, 9]
          .map((act) => {
            let a = gs.acts[act];
            // "—" means the student has not touched this Chapter at all (and exports
            // blank). A number is always out of the full Chapter total; a dot after
            // it means some of it is still waiting on you.
            let started = a && a.possible && a.touched;
            // The Unit column counts what the student has STARTED, not the whole
            // unit. Including a Chapter nobody has opened yet would read as a
            // failing grade in week one -- the same misleading-denominator
            // problem as the Chapter totals, pointing the other way. Inside each
            // Chapter the rule is unchanged: work they skipped still counts as zero.
            if (started) { unitPossible += a.possible; unitEarned += a.earned; anyStarted = true; }
            let pending = started && a.dokUnmarked ? `<span class="cell-pending" title="${a.dokUnmarked} written response(s) not marked yet, counted as 0 so far">•</span>` : "";
            let tip = started
              ? `${esc(s.name)} · Chapter ${act}: ${a.earned} of ${a.possible}${a.dokUnmarked ? ` · ${a.dokUnmarked} not marked yet` : ""}${a.dokMissing ? ` · ${a.dokMissing} not submitted` : ""}`
              : `${esc(s.name)} has not started Chapter ${act}`;
            return `<td class="gb-act"><button type="button" class="gradebook-cell gradebookJump ${started ? "" : "ungraded"}" data-email="${esc(s.email)}" data-act="${act}" title="${tip}">${started ? a.earned + "/" + a.possible + pending : "—"}</button></td>`;
          })
          .join("");

        let e = gs.essay;
        let essayCells = ESSAY_GRADE_STEPS.map((k) => {
          if (!e) return `<td class="gb-essay"><button type="button" class="gradebook-cell ungraded" disabled>—</button></td>`;
          if (k === "final") {
            let t = e.finalTotal || { earned: 0, possible: 0, hasAnyResult: false };
            if (ESSAY_CRITERIA.every((c) => ((e.criteria || {})[c] || {}).excluded))
              return `<td class="gb-essay"><button type="button" class="gradebook-cell ungraded" disabled title="${esc(s.name)} is excused from the final essay">ex</button></td>`;
            if (t.hasAnyResult || t.submitted) {
              unitPossible += Number(t.possible || 0);
              unitEarned += Number(t.earned || 0);
              anyStarted = true;
            }
            let tip = t.hasAnyResult
              ? `${esc(s.name)} · Final Essay: ${t.earned} of ${t.possible}${t.unmarked ? ` · ${t.unmarked} criteria not scored yet` : ""}`
              : t.submitted
                ? `${esc(s.name)} has assembled an essay but none of it is scored yet`
                : `${esc(s.name)} has not assembled an essay yet`;
            return `<td class="gb-essay"><button type="button" class="gradebook-cell essayJump ${t.hasAnyResult ? "" : "ungraded"}" data-email="${esc(s.email)}" data-step="final" title="${tip}">${t.hasAnyResult ? t.earned + "/" + t.possible : t.submitted ? "•" : "—"}</button></td>`;
          }
          let rec = (e.steps || {})[k] || {};
          if (!rec.excluded && (hasScore_(rec.score) || rec.submitted)) {
            unitPossible += Number(rec.possible || 0);
            if (hasScore_(rec.score)) unitEarned += Number(rec.score);
            anyStarted = true;
          }
          let val = rec.excluded
            ? "ex"
            : hasScore_(rec.score)
              ? k === "thesis"
                ? Number(rec.score) > 0
                  ? "✓"
                  : "✗"
                : rec.score + "/" + rec.possible
              : rec.submitted
                ? "•"
                : "—";
          let tip = rec.excluded
            ? `${esc(s.name)} is excused from ${esc(ESSAY_GRADE_LABELS[k])}`
            : hasScore_(rec.score)
              ? `${esc(s.name)} · ${esc(ESSAY_GRADE_LABELS[k])}: ${rec.score} of ${rec.possible}${rec.auto ? " (marked complete automatically)" : ""}`
              : rec.submitted
                ? `${esc(s.name)} has done this but it is not marked yet`
                : `${esc(s.name)} has not done this yet`;
          return `<td class="gb-essay"><button type="button" class="gradebook-cell essayJump ${hasScore_(rec.score) ? "" : "ungraded"}" data-email="${esc(s.email)}" data-step="${k}" title="${tip}">${val}</button></td>`;
        }).join("");

        // The unit total counts what has actually been marked so far. It is a
        // running figure, not a final grade, and says so in its tooltip --
        // unmarked work sits in it as a zero exactly as it would in Canvas.
        let pct = unitPossible ? Math.round((unitEarned / unitPossible) * 100) : 0;
        let totalCell = anyStarted
          ? `<td class="gb-total"><span title="${esc(s.name)}: ${Math.round(unitEarned * 100) / 100} of ${unitPossible} across the work they have started. Assignments nobody has opened yet are left out; work you have not marked yet counts as 0, the same as it would in Canvas.">${Math.round(unitEarned * 100) / 100}/${unitPossible}<small>${pct}%</small></span></td>`
          : `<td class="gb-total"><span class="ungraded" title="${esc(s.name)} has not started anything yet">—</span></td>`;
        return `<tr><td class="gb-name"><strong>${esc(s.name)}</strong></td>${actCells}${essayCells}${totalCell}</tr>`;
      })
      .join("");

    return `<div class="card"><h3>Gradebook</h3><p class="toolbar-note">Every assignment in the unit. <strong>✓</strong> complete · <strong>•</strong> done but not marked yet · <strong>—</strong> not done · <strong>ex</strong> excused. Click any cell to go straight to marking it. <strong>Unit</strong> totals the work each student has actually started, so it does not read as a fail in week one. Due dates, Canvas and CSV downloads are on the tiles above.</p><div class="gradebook-scroll"><table class="gradebook-table gradebook-wide"><thead><tr><th class="gb-name">Student</th>${actCols}${essayCols}<th class="gb-total">Unit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  async function exportAct(asg) {
    let status = document.getElementById(asgStatusId_(asg));
    let btn = document.querySelector(`.export-act-btn[data-asg="${asg}"]`);
    if (btn) btn.disabled = true;
    if (status) status.textContent = "Preparing CSV...";
    try {
      let res = await rpc("exportActGradesCsv", Object.assign({ classId: backend.activeClassId }, asgPayload_(asg)));
      downloadTextFile_(res.filename, res.content);
      let parts = [`Downloaded ${res.filename} (${res.sent} graded student(s)), out of ${res.pointsPossible} points.`];
      if (res.skipped && res.skipped.length)
        parts.push(`Left blank (nothing done in this Act yet): ${res.skipped.join(", ")}.`);
      if (res.unmarked && res.unmarked.length)
        parts.push(
          `⚠ Counted as 0 because you haven't marked them yet — ${res.unmarked.join(", ")}. Mark those and download again if you don't want the zeros.`,
        );
      if (res.adjusted && res.adjusted.length)
        parts.push(
          `Scaled to keep the same percentage (these students had a question excluded individually): ${res.adjusted.join("; ")}.`,
        );
      if (status) status.textContent = parts.join(" ");
    } catch (e) {
      if (status) status.textContent = "Error: " + e.message;
    } finally {
      btn.disabled = false;
    }
  }
  function downloadTextFile_(filename, content) {
    let blob = new Blob([content], { type: "text/csv;charset=utf-8" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function openEditClass(classId) {
    let c = backend.classes.find((x) => x.classId === classId);
    if (!c) return;
    document.getElementById("modalRoot").innerHTML =
      `<div class="modal"><div class="modalbox"><h3>Edit Class</h3><div class="field"><label>Class name</label><input id="editClassName" value="${esc(c.className)}"></div><div class="field"><label>Period / section</label><input id="editClassPeriod" value="${esc(c.period || "")}"></div><p id="editClassMsg" class="toolbar-note"></p><div class="modal-actions"><button class="btn modal-dismiss" id="cancelEditClass">Cancel</button><button class="btn primary" id="saveEditClass">Save</button></div></div></div>`;
    document.getElementById("cancelEditClass").onclick = () =>
      (document.getElementById("modalRoot").innerHTML = "");
    document.getElementById("saveEditClass").onclick = async () => {
      let name = document.getElementById("editClassName").value.trim();
      let period = document.getElementById("editClassPeriod").value.trim();
      let msg = document.getElementById("editClassMsg");
      if (!name) {
        msg.textContent = "Class name is required.";
        return;
      }
      msg.textContent = "Saving...";
      try {
        await rpc("updateClass", { classId, className: name, period });
        c.className = name;
        c.period = period;
        if (backend.activeClassId === classId) state.className = name;
        if (backend.dashboardCache[classId]) {
          backend.dashboardCache[classId].classInfo.className = name;
          backend.dashboardCache[classId].classInfo.period = period;
        }
        document.getElementById("modalRoot").innerHTML = "";
        render();
      } catch (e) {
        msg.textContent = e.message;
      }
    };
  }
  function armDeleteButton(b) {
    b.textContent = "Confirm?";
    b.dataset.armed = "1";
    b.classList.add("confirm-armed");
    clearTimeout(b._armTimer);
    b._armTimer = setTimeout(() => {
      b.dataset.armed = "0";
      b.textContent = "🗑";
      b.classList.remove("confirm-armed");
    }, 4000);
  }
  async function confirmDeleteClass(b, classId) {
    let name = (backend.classes.find((c) => c.classId === classId) || {}).className || "this class";
    b.disabled = true;
    b.textContent = "…";
    try {
      await rpc("archiveClass", { classId });
      backend.classes = backend.classes.filter((c) => c.classId !== classId);
      delete backend.dashboardCache[classId];
      if (backend.activeClassId === classId) {
        let next = (backend.classes[0] || {}).classId || "";
        backend.activeClassId = next;
        safeLSSet("macbethActiveClass", next);
        backend.dashboard = null;
        if (next) loadDashboard(next);
        else render();
      } else {
        render();
      }
    } catch (e) {
      alert(`Could not delete ${name}: ${e.message}`);
      b.disabled = false;
      b.textContent = "🗑";
      b.dataset.armed = "0";
      b.classList.remove("confirm-armed");
    }
  }
  function createClassCard() {
    return `<div class="card"><h3>Create a Class</h3><div class="field"><label>Class name</label><input id="newClassName" placeholder="English 2 - Period 2"></div><div class="field"><label>Period / section</label><input id="newClassPeriod" placeholder="Period 2"></div><button class="btn primary" id="createClassBtn">Create Class</button><p id="createClassMsg" class="toolbar-note"></p></div>`;
  }
  async function createNewClass() {
    let msg = document.getElementById("createClassMsg");
    let name = document.getElementById("newClassName").value.trim();
    if (!name) {
      msg.textContent = "Enter a class name.";
      return;
    }
    msg.textContent = "Creating...";
    try {
      let c = await rpc("createClass", {
        className: name,
        period: document.getElementById("newClassPeriod").value,
      });
      let d = await rpc("getBootstrap");
      backend.classes = d.classes || [];
      backend.activeClassId = c.classId;
      safeLSSet("macbethActiveClass", c.classId);
      await loadDashboard(c.classId);
    } catch (e) {
      msg.textContent = e.message;
    }
  }
  function applyDashboardState_(d) {
    state.releasedActs = d.settings.releasedActs || [1];
    state.releasedScenes = d.settings.releasedScenes || {};
    state.releasedEssayThrough = d.settings.releasedEssayThrough || "self";
    state.teacherResources = d.settings.teacherResources !== false;
    state.className = d.classInfo.className;
    // Mirror the server's settings back onto the cached class record, so
    // anything reading settingsJson (the Canvas link, chiefly) is not stale.

  // Switching classes used to always wait on a fresh getClassDashboard round-trip
  // before anything on screen changed, which reads as "stuck" for however long that
  // sheet read takes. Now: if we've shown this class before, redraw instantly from
  // the cached copy, then quietly refresh from the server in the background and
  // redraw again only if anything actually changed. First-time loads still wait on
  // the real fetch (there's nothing to show yet), same as before.
  async function loadDashboard(classId, rerender = true) {
    backend.activeClassId = classId;
    safeLSSet("macbethActiveClass", classId);
    let cached = backend.dashboardCache[classId];
    backend.gradingHub = backend.gradingHubCache[classId] || null;
    if (cached) {
      backend.dashboard = cached;
      applyDashboardState_(cached);
      if (rerender) render();
      loadGradingHub(classId);
    } else {
      backend.dashboard = null;
      if (rerender) render();
    }
    try {
      let fresh = await rpc("getClassDashboard", { classId });
      (fresh.students || []).forEach((st) => normalizeGradeSummary_(st.gradeSummary));
      backend.dashboardCache[classId] = fresh;
      if (backend.activeClassId !== classId) return; // switched again before this resolved
      backend.dashboard = fresh;
      applyDashboardState_(fresh);
      if (rerender) render();
      loadGradingHub(classId);
    } catch (e) {
      console.error(e);
      if (!cached && rerender) {
        let app = document.getElementById("app");
        if (app)
          app.insertAdjacentHTML(
            "beforeend",
            `<p class="toolbar-note">Could not load this class right now: ${esc(e.message || String(e))}</p>`,
          );
      }
    }
  }
