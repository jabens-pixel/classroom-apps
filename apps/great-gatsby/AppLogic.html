}


// ---------------------------------------------------------------------------
// Written-response origin tracking
//
// The DOK box records which CHARACTERS of the final answer arrived by paste
// rather than by typing, so the teacher can see pasted spans highlighted when
// marking. It stores character ranges only -- no keystroke log, no clipboard
// history, nothing the student does not submit anyway. Text pasted out of the
// chapter the student is reading is tagged separately as a quotation, because
// citing the novel is the assignment, not a red flag.
// ---------------------------------------------------------------------------
const PASTE_MIN_CHARS = 8; // a pasted word or a fixed typo is not worth flagging

function dokOriginArray_(meta, len) {
  let a = new Array(len).fill("t");
  let spans = meta && Array.isArray(meta.spans) ? meta.spans : [];
  spans.forEach((sp) => {
    let from = Math.max(0, sp[0] | 0);
    let to = Math.min(len, sp[1] | 0);
    for (let i = from; i < to; i++) a[i] = sp[2] === "q" ? "q" : "p";
  });
  return a;
}
function dokMetaFromOrigin_(a, events) {
  let spans = [];
  let i = 0;
  while (i < a.length) {
    if (a[i] === "t") { i++; continue; }
    let j = i;
    while (j < a.length && a[j] === a[i]) j++;
    spans.push([i, j, a[i]]);
    i = j;
  }
  let pasted = 0, quoted = 0;
  spans.forEach((sp) => { if (sp[2] === "q") quoted += sp[1] - sp[0]; else pasted += sp[1] - sp[0]; });
  return { spans: spans, pasted: pasted, quoted: quoted, total: a.length, events: events || 0 };
}
// A single input event changes one contiguous region, so a common prefix /
// suffix diff tells us exactly which characters are new. Marking only those
// keeps the rest of the map correct through later edits anywhere in the answer.
function dokDiff_(oldText, newText) {
  let max = Math.min(oldText.length, newText.length);
  let p = 0;
  while (p < max && oldText[p] === newText[p]) p++;
  let s = 0;
  while (s < max - p && oldText[oldText.length - 1 - s] === newText[newText.length - 1 - s]) s++;
  return { p: p, s: s, insertedLen: newText.length - s - p };
}
function dokApplyEdit_(origin, oldText, d, kind) {
  let mid = new Array(d.insertedLen > 0 ? d.insertedLen : 0).fill(kind);
  return origin.slice(0, d.p).concat(mid, origin.slice(oldText.length - d.s));
}
function normalizeForMatch_(t) {
  return String(t || "")
    .replace(/[‘’‛]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[–—]/g, "-")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}
// Is this pasted text lifted from the chapter the student is reading (a quote)?
// The chapter text lives only in the DOM (the teacher's pasted storyTextStore
// section), never in this file, so this reads it back the same way the reader does.
function pastedFromScene_(text, key) {
  let needle = normalizeForMatch_(text);
  if (needle.length < PASTE_MIN_CHARS) return false;
  let act = +String(key).split(".")[0];
  let hay = normalizeForMatch_(chapterFullText_(act));
  if (!hay) return false;
  return hay.indexOf(needle) !== -1;
}
function attachDokBox(el, key) {
  if (!el) return;
  state.dokMeta = state.dokMeta || {};
  let prev = el.value;
  let meta = state.dokMeta[key] || null;
  let origin = dokOriginArray_(meta, prev.length);
  let events = meta && meta.events ? meta.events : 0;
  let pendingKind = null;
  let clipboardRead = false; // did the paste handler actually see the text?

  function noteIncoming(text) {
    let t = String(text || "");
    clipboardRead = t.length > 0;
    // A pasted word or a corrected typo is not worth marking up.
    if (t.length < PASTE_MIN_CHARS) { pendingKind = null; return; }
    pendingKind = pastedFromScene_(t, key) ? "q" : "p";
  }
  el.addEventListener("paste", (e) => {
    let t = "";
    try { t = ((e.clipboardData || window.clipboardData).getData("text") || ""); } catch (err) { t = ""; }
    noteIncoming(t);
  });
  el.addEventListener("drop", (e) => {
    let t = "";
    try { t = (e.dataTransfer && e.dataTransfer.getData("text")) || ""; } catch (err) { t = ""; }
    noteIncoming(t);
  });
  el.oninput = (e) => {
    let next = el.value;
    // inputType is the reliable signal that this was a paste; the paste handler
    // above only exists to read the text, so a quotation can be told from an
    // outside paste. If the clipboard could not be read, fall back to the size
    // of the insertion so a real paste is still caught.
    let it = e && e.inputType;
    let pasteish = it === "insertFromPaste" || it === "insertFromDrop" || it === "insertFromPasteAsQuotation";
    let d = dokDiff_(prev, next);
    let kind = "t";
    if (pendingKind) kind = pendingKind;
    else if (pasteish && !clipboardRead && d.insertedLen >= PASTE_MIN_CHARS) kind = "p";
    if (kind !== "t") events++;
    pendingKind = null;
    clipboardRead = false;
    origin = dokApplyEdit_(origin, prev, d, kind);
    if (origin.length !== next.length) origin = dokOriginArray_(null, next.length); // safety net
    prev = next;
    state.dok[key] = next;
    state.dokMeta[key] = dokMetaFromOrigin_(origin, events);
    save();
  };
}

// A quote captured from the page and the scene text it came from do not agree
// about whitespace: the source has a newline between verse lines, while the
// browser hands back whatever the selection's textContent happened to contain
// once the line-number spans were stripped. An exact indexOf then failed for
// any selection spanning more than one line -- the evidence saved fine, but the
// highlight silently never appeared. So match on a whitespace-flattened copy
// and map the hit back to real offsets in the original.
function flattenForSearch_(text) {
  let flat = "";
  let map = [];   // index in `flat` -> index in `text`
  let lastWasSpace = true;
  for (let i = 0; i < text.length; i++) {
    let ch = text[i];
    if (/\s/.test(ch)) {
      if (lastWasSpace) continue;
      flat += " ";
      map.push(i);
      lastWasSpace = true;
    } else {
      flat += ch;
      map.push(i);
      lastWasSpace = false;
    }
  }
  return { flat: flat, map: map };
}
function findQuoteRange_(text, flatIndex, quote, isFree) {
  let needle = String(quote || "").replace(/\s+/g, " ").trim();
  if (!needle) return null;
  let from = 0;
  while (true) {
    let at = flatIndex.flat.indexOf(needle, from);
    if (at < 0) return null;
    let start = flatIndex.map[at];
    let end = flatIndex.map[at + needle.length - 1] + 1;
    if (isFree(start, end)) return { start: start, end: end };
    from = at + 1;
  }
}
function injectHighlights(text, act) {
  let items = (state.evidence || []).filter((x) => x.act === act);
  if (!items.length) return text;
  let ranges = [];
  let flatIndex = flattenForSearch_(text);
  items.forEach((item) => {
    let q = esc(item.quote || "");
    if (!q) return;
    let hit = findQuoteRange_(text, flatIndex, q, function (start, end) {
      return !ranges.some((r) => start < r.end && end > r.start);
    });
    if (hit) ranges.push({ start: hit.start, end: hit.end, item: item });
  });
  if (!ranges.length) return text;
  ranges.sort((a, b) => a.start - b.start);
  let out = "";
  let cursor = 0;
  ranges.forEach((r) => {
    let eqDef = EQ.find((e) => e.id === r.item.eq);
    let color = eqDef ? eqDef.color : "var(--gold)";
    out += text.slice(cursor, r.start);
    out += `<mark class="ev-hl" data-ev-id="${r.item.id}" style="--ev-color:${color}" title="${esc(
      eqDef ? eqDef.label : "Saved evidence",
    )}${r.item.note ? " — " + esc(r.item.note.slice(0, 90)) : ""}">`;
    out += text.slice(r.start, r.end);
    out += "</mark>";
    cursor = r.end;
  });
  out += text.slice(cursor);
  return out;
}

function bind() {
  let dupUnitBtn = document.getElementById("dupUnitBtn");
  if (dupUnitBtn)
    dupUnitBtn.onclick = () =>
      alert(
        "Unit duplication is managed from the connected class backend. Once deployed, use Teacher Dashboard > Create a Class to start a new section of this same unit — each class gets its own code and release settings automatically.",
      );
  document.querySelectorAll("[data-role]").forEach((b) => {
    b.classList.toggle("active", b.dataset.role === state.role);
    b.onclick = () => {
      state.role = b.dataset.role;
      save();
      render();
    };
  });
  document.querySelectorAll("[data-goto]").forEach(
    (b) =>
      (b.onclick = () => {
        // Paging from the last scene of an Act into the first of the next one
        // should open that Act in the sidebar too.
        syncNavAct_(b.dataset.goto);
        state.view = b.dataset.goto;
        save();
        render();
      }),
  );
  document
    .querySelectorAll(".openActivity")
    .forEach((b) => (b.onclick = () => openActivity(b.dataset.activity)));
  // Every way of moving between stages goes through here: a stop on the journey
  // strip, the Next button, the Back button. Work is already saved on every
  // keystroke; save() again so the step itself is remembered, then put the
  // reader at the top of the new stage rather than wherever they were scrolled
  // to on the old one.
  document.querySelectorAll("[data-estep]").forEach(
    (b) =>
      (b.onclick = () => {
        if (!essayStepReleased(b.dataset.estep))
          return alert(
            essayStepLabel(b.dataset.estep) +
              " has not been opened yet. Your teacher releases each stage of the essay as the class reaches it.",
          );
        let moving = state.essay.step !== b.dataset.estep;
        state.essay.step = b.dataset.estep;
        save();
        render();
        if (moving) {
          let head = document.querySelector(".essay-journey");
          if (head && head.scrollIntoView) head.scrollIntoView({ block: "start" });
          else window.scrollTo(0, 0);
        }
      }),
  );
  document.querySelectorAll(".themePick").forEach(
    (r) =>
      (r.onchange = () => {
        state.essay.theme = r.value;
        save();
        render();
      }),
  );
  let tb = document.getElementById("thesisBox");
  if (tb)
    tb.oninput = (e) => {
      state.essay.thesis = e.target.value;
      save();
      document.getElementById("thesisCoach").innerHTML = coach(e.target.value, "thesis");
    };
  let post = document.getElementById("postThesis");
  if (post)
    post.onclick = () => {
      let text = state.essay.thesis.trim();
      if (!text) return;
      state.essay.discussion.push({ text, date: new Date().toLocaleString() });
      save();
      render();
    };
  document.querySelectorAll(".bodyBox").forEach(
    (t) =>
      (t.oninput = (e) => {
        let i = +t.dataset.body;
        state.essay.bodies[i] = e.target.value;
        save();
        let c = document.getElementById("bodyCoach" + i);
        if (c) c.innerHTML = coach(e.target.value, "body");
        // The "n of 3 drafted" line and the Required/Drafted chip are the only
        // other things on screen that depend on this text, so patch those two
        // rather than re-rendering and throwing away the cursor mid-sentence.
        refreshBodyProgress_();
      }),
  );
  let addBody = document.getElementById("addBodyBtn");
  if (addBody)
    addBody.onclick = () => {
      if (state.essay.bodies.length >= MAX_BODIES) return;
      state.essay.bodies.push("");
      save();
      render();
      // Put the cursor in the box they just asked for.
      let boxes = document.querySelectorAll(".bodyBox");
      let last = boxes[boxes.length - 1];
      if (last) { last.focus(); last.scrollIntoView({ behavior: "smooth", block: "center" }); }
    };
  document.querySelectorAll(".removeBodyBtn").forEach(
    (b) =>
      (b.onclick = () => {
        let i = +b.dataset.body;
        if (i < REQUIRED_BODIES) return;   // the first three are not removable
        let written = String(state.essay.bodies[i] || "").trim();
        if (written && !confirm("Delete this extra paragraph? What you wrote in it will be lost.")) return;
        state.essay.bodies.splice(i, 1);
        while (state.essay.bodies.length < REQUIRED_BODIES) state.essay.bodies.push("");
        save();
        render();
      }),
  );
  let rebuttal = document.getElementById("rebuttalBox");
  if (rebuttal)
    rebuttal.oninput = (e) => {
      state.essay.rebuttal = e.target.value;
      save();
      let c = document.getElementById("rebuttalCoach");
      if (c) c.innerHTML = coach(e.target.value, "body");
    };
  let intro = document.getElementById("introBox");
  if (intro)
    intro.oninput = (e) => {
      state.essay.intro = e.target.value;
      save();
      document.getElementById("introCoach").innerHTML = coach(e.target.value, "intro");
    };
  let con = document.getElementById("conclusionBox");
  if (con)
    con.oninput = (e) => {
      state.essay.conclusion = e.target.value;
      save();
      document.getElementById("conclusionCoach").innerHTML = coach(e.target.value, "conclusion");
    };
  let copy = document.getElementById("copyEssay");
  if (copy)
    copy.onclick = async () => {
      let full = [state.essay.intro, ...state.essay.bodies, state.essay.conclusion]
        .filter((x) => x.trim())
        .join("\n\n");
      try {
        await navigator.clipboard.writeText(full);
        alert("Full essay copied.");
      } catch (e) {
        alert("Copy is not available in this browser. Select the essay text and copy it manually.");
      }
    };
  document.querySelectorAll(".self-band").forEach(
    (x) =>
      (x.onclick = () => {
        state.essay.selfEval[x.dataset.crit] = x.dataset.band;
        save();
        render();
      }),
  );
  document.querySelectorAll(".selfComment").forEach(
    (x) =>
      (x.oninput = () => {
        state.essay.selfComments[x.dataset.crit] = x.value;
        save();
      }),
  );
  document.querySelectorAll(".openStandards").forEach((x) => (x.onclick = openStandards));
  if (state.view.startsWith("scene:")) {
    let key = state.view.split(":")[1];
    let sb = document.getElementById("supportBtn");
    if (sb)
      sb.onclick = () => {
        // Remembered in state, not just in the DOM. Answering a multiple-choice
        // question re-renders the chapter, and a DOM-only toggle was wiped every
        // time -- students had to reopen the reading support panel after every answer.
        state.supportOpen = !state.supportOpen;
        let panel = document.getElementById("readingSupportPanel");
        if (panel) panel.classList.toggle("hide", !state.supportOpen);
        sb.classList.toggle("active", state.supportOpen);
        save();
      };
    document
      .querySelectorAll(".hilite")
      .forEach((b) => (b.onclick = () => addHighlight(b.dataset.eq, key)));
    document.querySelectorAll("[data-answer]").forEach(
      (b) =>
        (b.onclick = () => {
          let info = answerInfo(key, state.answers[key]);
          if (info.locked) return;
          let picked = +b.dataset.answer;
          if (info.picks.includes(picked)) return;
          state.answers[key] = [...info.picks, picked];
          save();
          render();
        }),
    );
    attachDokBox(document.getElementById("dok"), key);
  }
  document.querySelectorAll(".scene-pager-btn").forEach(
    (b) =>
      (b.onclick = () => {
        let v = b.dataset.view;
        if (!v) return;
        if (v.startsWith("scene:") && !released(v.split(":")[1])) {
          alert("This chapter has not been released yet.");
          return;
        }
        state.view = v;
        save();
        render();
        window.scrollTo(0, 0);
      }),
  );
  document.querySelectorAll(".removeEv").forEach(
    (b) =>
      (b.onclick = () => {
        state.evidence = state.evidence.filter((x) => x.id != b.dataset.id);
        save();
        render();
      }),
  );
  document.querySelectorAll(".actRelease").forEach(
    (c) =>
      (c.onchange = () => {
        let a = +c.dataset.act;
        state.releasedActs = c.checked
          ? [...new Set([...state.releasedActs, a])]
          : state.releasedActs.filter((x) => x !== a);
        save();
        render();
      }),
  );
  document.querySelectorAll(".sceneRelease").forEach(
    (c) =>
      (c.onchange = () => {
        state.releasedScenes[c.dataset.key] = c.checked;
        save();
      }),
  );
  let esel = document.querySelector(".essayReleaseSelect");
  if (esel)
    esel.onchange = () => {
      state.releasedEssayThrough = esel.value;
      save();
      render();
    };
  let enext = document.querySelector(".essayReleaseNext");
  if (enext)
    enext.onclick = () => {
      let i = essayReleasedThrough();
      if (i >= ESSAY_JOURNEY.length - 1) return;
      state.releasedEssayThrough = ESSAY_JOURNEY[i + 1][0];
      save();
      render();
    };
  let rt = document.getElementById("resourceToggle");
  if (rt)
    rt.onchange = () => {
      state.teacherResources = rt.checked;
      save();
    };
}

function render() {
  sidebar();
  let app = document.getElementById("app");
  let v = String(state.view || "home");
  if (v.startsWith("scene:")) app.innerHTML = scene(v.split(":")[1]);
  else if (v === "evidence") app.innerHTML = evidence();
  else if (v === "essay") app.innerHTML = essay();
  else if (v === "manage") app.innerHTML = manage();
  else if (v === "batchGrade") app.innerHTML = batchGrade();
  else if (v === "essayGrade") app.innerHTML = essayGrade();
  else if (v === "admin") app.innerHTML = admin();
  else app.innerHTML = home();
  bind();
  navSync_();
}

(function bindModalBackdropDismiss() {
  const root = document.getElementById("modalRoot");
  if (!root) return;
  root.addEventListener("click", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("modal")) {
      const dismiss = e.target.querySelector(".modal-dismiss");
      if (dismiss) dismiss.click();
      else root.innerHTML = "";
    }
  });
})();
