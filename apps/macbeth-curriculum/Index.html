<script>
/* Startup self-check. Each included file stamps window.__MB when it starts and
   again when it finishes, so if one of them is missing, misnamed, or holds the
   wrong app's code, this says WHICH FILE rather than leaving you to work
   backwards from an error like "SCENES is not defined". */
(function () {
  var expected = ['Images', 'PlayData', 'AppLogic', 'BackendClient'];
  var stamps = window.__MB || {};
  var problems = expected
    .filter(function (f) { return stamps[f] !== 'ok'; })
    .map(function (f) {
      return { file: f, how: stamps[f] === 'started' ? 'started but stopped partway through' : 'never loaded' };
    });
  if (!problems.length) return;
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  };
  var rows = problems.map(function (p) {
    return '<li><strong>' + esc(p.file) + '</strong> &mdash; ' + esc(p.how) + '</li>';
  }).join('');
  var app = document.getElementById('app');
  if (!app) return;
  app.innerHTML =
    '<div class="card"><h2>Macbeth could not finish loading</h2>' +
    '<p>' + problems.length + ' of the ' + expected.length +
    ' code files did not load correctly in this Apps Script project:</p><ul>' + rows + '</ul>' +
    (problems.length > 1
      ? '<p><strong>Fix the first one on that list first</strong> &mdash; a file that fails to load usually takes the ones after it down with it, so the later entries are often just casualties.</p>'
      : '') +
    '<p><strong>What to do:</strong> open the Apps Script editor and check the file named above. ' +
    '&ldquo;Never loaded&rdquo; usually means it is missing, misnamed, or holds another app&rsquo;s code. ' +
    '&ldquo;Stopped partway&rdquo; usually means the paste got cut short &mdash; re-paste it and make sure it ends with ' +
    '<code>&lt;/script&gt;</code>.</p>' +
    '<p class="toolbar-note">Every file must be named exactly (capitals matter): Images, PlayData, AppLogic, BackendClient. ' +
    'Student work is stored in the backend spreadsheet and is not affected by this.</p></div>';
})();
</script>
