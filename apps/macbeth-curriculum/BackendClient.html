  // A deployed Apps Script web app can remain open (or occasionally be served
  // from browser cache) after the teacher publishes a new deployment version.
  // Compare the build embedded in this HTML page with the server's current
  // build before loading any class data. If they differ, do not let students
  // keep working in stale code: send them through the canonical /exec URL.
  function newestAppUrl_(baseUrl, version) {
    let base = String(baseUrl || window.location.href || "");
    // Remove our own old cache-buster while preserving any other query params.
    base = base.replace(/([?&])mbv=[^&#]*(&?)/, function (_, lead, tail) {
      return lead === "?" && tail ? "?" : tail ? "&" : "";
    }).replace(/[?&]$/, "");
    const join = base.indexOf("?") >= 0 ? "&" : "?";
    return base + join + "mbv=" + encodeURIComponent(String(version || Date.now()));
  }

  // One sender, nothing dropped: a failure puts the work straight back on the
  // dirty pile and comes back for it, and anything typed while a save is in the

  function sleep_(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
  async function forceStudentSaveNow_() {
    if (!backend.enabled || !backend.ready || !backend.activeClassId || !backend.user || backend.user.role !== "student") return true;
    save();
    clearTimeout(backend.saveTimer);
    backend.saveTimer = null;
    let spins = 0;
    while (backend.saveInFlight && spins++ < 120) await sleep_(50);
    let result = await flushSave_();
    spins = 0;
    while (backend.saveInFlight && spins++ < 120) await sleep_(50);
    if (backend.saveDirty && !backend.saveInFlight) result = await flushSave_();
    if (!result || !result.ok || backend.saveFails > 0 || backend.saveDirty || backend.saveInFlight) {
      throw new Error("Your draft is still safe in this browser, but it could not be confirmed in your account yet. Check your connection and try again.");
    }
    return true;
  }
  backend.__forceStudentSaveNow = forceStudentSaveNow_;

  // The gap between the last keystroke and the save going out is 650ms. Close
  // the tab, switch app, or lock the phone inside it and the old code lost that
  // edit. These send the pending save the moment the page stops being looked
  // at, which is while there is still time for it to land.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushSave_();
  });
  window.addEventListener("pagehide", () => flushSave_());
  window.addEventListener("blur", () => flushSave_());
  window.addEventListener("beforeunload", (e) => {
    if (!backend.enabled || !backend.ready || !backend.activeClassId) return;
    flushSave_();
    // Only hold them up when we already know saving is failing -- otherwise
    // this is a confirm dialog on every single tab close, for nothing.
    if (backend.saveFails > 0) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  // The name a student types here is what the teacher sees in the marking
  // list, so first and last are separate required fields.
  function splitStoredName_(name) {
    let parts = String(name || "")
      .trim()
      .replace(/\s+/g, " ")
      .split(" ");
    if (parts.length < 2 || /\d/.test(String(name || ""))) return { first: "", last: "" };
    return { first: parts.shift(), last: parts.join(" ") };
  }
  function nameFieldsHtml_(name) {
    let n = splitStoredName_(name);
    return `<div class="name-fields"><div class="field"><label>First name</label><input id="joinFirst" value="${esc(n.first)}" placeholder="Duncan" autocomplete="given-name"></div><div class="field"><label>Last name</label><input id="joinLast" value="${esc(n.last)}" placeholder="Macalpine" autocomplete="family-name"></div></div>`;
  }
  function readNameFields_() {
    let f = (document.getElementById("joinFirst") || {}).value || "";
    let l = (document.getElementById("joinLast") || {}).value || "";
    return { firstName: f.trim(), lastName: l.trim() };
  }
  function studentJoinView() {
    return `<div class="join-card card"><div class="pill">Student Access</div><h2>Join your Macbeth class</h2><p>Use your real first and last name — this is how your teacher will find your work when marking.</p>${nameFieldsHtml_(backend.user.name)}<div class="field"><label>Class code</label><input id="joinCode" maxlength="8" style="text-transform:uppercase" placeholder="ABC123"></div><button class="btn primary" id="joinClassBtn">Join Class</button><p id="joinMsg" class="toolbar-note"></p></div>`;

  // One switch, used on the tiles and in Release & Resources alike. The real

  function accessSwitchHtml_(cls, attr, on, name, detail, hides) {

  function releaseCardHtml_() {

    return `<section class="card dash-card" id="releaseCard">

      <p class="dash-card-sub">What students can open. Turning something off hides it from students; it never deletes their work, and it comes back when you turn it on again.</p>
      <div class="access-group"><h4 class="access-group-title">The Play</h4><div class="access-grid">${acts}</div></div>
      <div class="access-group"><h4 class="access-group-title">The Essay</h4><div class="access-grid">${stages}</div></div>
      <div class="access-group"><h4 class="access-group-title">Resources</h4><div class="access-grid">${
        `<label class="access-item ${state.teacherResources ? "is-on" : ""}" title="Extension videos and links at the foot of each scene"><span class="hub-switch ${state.teacherResources ? "is-on" : ""}"><input id="resourceToggle" type="checkbox" ${state.teacherResources ? "checked" : ""}><span class="hub-switch-track" aria-hidden="true"></span></span><span class="access-item-copy"><strong>Extension resources</strong><small>Videos and links at the end of each scene</small></span><span class="access-item-state">${state.teacherResources ? "Shown" : "Hidden"}</span></label>`
      }<div id="lessonLinkSlot" class="lesson-link-slot">${lessonLinkItemHtml_()}</div></div></div>

  manage = function () {

      return `<div class="sectionhead"><h2>Teacher Dashboard</h2></div><div class="backend-banner"><div><strong>${esc(backend.user.name)}</strong><br><small>Your teacher access is active. Create your first class to begin.</small></div></div>${createClassCard()}`;
    let dash = backend.dashboard;
    let klass = currentClass();
    let classSwitcher = `<div class="class-switch-row">${backend.classes
      .map(
        (c) =>
          `<span class="class-pill-wrap"><button class="class-pill ${c.classId === backend.activeClassId ? "active" : ""}" data-classid="${c.classId}" title="${esc(c.className)}${c.period ? " · " + esc(c.period) : ""} · Code ${esc(c.joinCode)}">${esc(c.className)}${c.period ? `<span class="class-pill-period">${esc(c.period)}</span>` : ""}</button><button class="pill-icon-btn classEditBtn" data-classid="${c.classId}" title="Edit ${esc(c.className)}">✎</button><button class="pill-icon-btn classDeleteBtn" data-classid="${c.classId}" title="Delete ${esc(c.className)}">🗑</button></span>`,
      )
      .join("")}<button class="btn" id="toggleNewClass">+ New Class</button>${canvasSwitcherButton_()}</div><div id="newClassPanel" class="hide">${createClassCard()}</div>`;

    let controls = dash ? releaseCardHtml_() : "";

                .map(

                )
                .join("")}</tbody></table>`

      : "";
    let hub = dash ? gradingHubCard() : "";
    let gradebook = dash && dash.students.length ? gradebookCard(dash) : "";

    return `<div class="sectionhead"><h2>Teacher Dashboard</h2></div><div class="backend-banner"><div><strong>${esc(klass ? klass.className : "Classes")}${klass && klass.period ? " · " + esc(klass.period) : ""}</strong><br><small>${dash ? dash.students.length + " student" + (dash.students.length === 1 ? "" : "s") + " enrolled · " : ""}Student work saves to their school Google account and appears here.</small></div><div>Class code: <strong>${esc(klass ? klass.joinCode : "")}</strong></div></div>${classSwitcher}${hub}${gradebook}${roster}${controls}`;

  // ---- Batch grading: grade one written-response question across the whole class ----
  // Keyed by classId+sceneKey (not just sceneKey) so switching classes never shows a
  // stale class's responses under the same scene. Loaded once per scene, then cached.
  // A grading click patches that one row and moves it to its new group
  // (resortBatchRows_) rather than re-rendering the whole list.
  function sceneCacheKey_(classId, sceneKey) {
    return classId + "::" + sceneKey;
  }
  function getBatchResponses_() {
    return backend.sceneResponseCache[sceneCacheKey_(backend.activeClassId, backend.batchSceneKey)];
  }
  function getBatchResponse_(email) {
    let list = getBatchResponses_();
    return list ? list.find((r) => r.email === email) : null;
  }
  function applyBatchLocalUpdate_(email, patch) {
    let r = getBatchResponse_(email);
    if (!r) return;
    if (patch.score !== undefined) r.score = patch.score;
    if (patch.excluded !== undefined) r.excluded = patch.excluded;
    if (patch.comment !== undefined) r.comment = patch.comment;
    // Any grading action re-snapshots the response on the server, so the
    // "redone since marking" flag is answered. Clear it HERE, before the row
    // redraws -- clearing it inside the save call happens a beat too late and
    // the badge survives its own dismissal.
    r.editedAfterGrading = false;
    r.markedBlank = false;
  }
  // Any grade change makes the cached dashboard's Act totals stale, so drop it and
  // let the Teacher Dashboard refetch next time it's opened.
  function invalidateDashboardCache_() {
    delete backend.dashboardCache[backend.activeClassId];
    // The tiles' "needs grading" counts are the first thing a grade changes, so
    // they go stale at exactly the same moment the dashboard does.
    delete backend.gradingHubCache[backend.activeClassId];
  }

  // setGradeItem returns the authoritative recomputed essay summary. Put it
  // straight into both live and cached dashboard data so an unsubmitted draft
  // that the teacher chooses to grade appears in the gradebook immediately.
  function acceptEssayGradeSummary_(email, result) {
    if (!result || !result.gradeSummary) return;
    let gs = normalizeGradeSummary_(result.gradeSummary);
    let apply = function(d) {
      if (!d || !d.students) return;
      let stu = d.students.find(function(x){ return String(x.email || '').toLowerCase() === String(email || '').toLowerCase(); });
      if (stu) stu.gradeSummary = gs;
    };
    apply(backend.dashboard);
    apply(backend.dashboardCache[backend.activeClassId]);
    if (backend.dashboard) backend.dashboardCache[backend.activeClassId] = backend.dashboard;
  }
  async function toggleExcludeWholeClass_() {
    let responses = getBatchResponses_() || [];
    if (!responses.length) return;
    let sceneKey = backend.batchSceneKey;
    let next = !responses.every((r) => r.excluded);
    let btn = document.getElementById("excludeAllBtn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = next ? "Excluding…" : "Restoring…";
    }
    try {
      await rpc("setGradeItemForClass", {
        classId: backend.activeClassId,
        itemType: "dok",
        itemKey: sceneKey,
        excluded: next,
      });
      responses.forEach((r) => (r.excluded = next));
      invalidateDashboardCache_();
    } catch (e) {
      alert("Could not update the whole class: " + e.message);
    }
    if (state.view === "batchGrade") refreshBatchView_();
  }
  // One save at a time per graded item, in the order you made them, so an
  // older save (e.g. a comment box losing focus) can never land after a newer
  // one (the score you clicked next) and undo it. (2026-10-08a)
  function inOrder_(key, send) {
    backend.saveChains = backend.saveChains || {};
    let prev = backend.saveChains[key] || Promise.resolve();
    let next = prev.catch(() => {}).then(send);
    backend.saveChains[key] = next;
    next.finally(() => { if (backend.saveChains[key] === next) delete backend.saveChains[key]; }).catch(() => {});
    return next;
  }
  async function saveBatchGradeItem_(email, patch) {
    invalidateDashboardCache_();
    // The server re-snapshots the response text on every save, so whatever was
    // flagged as redone has now been seen by you. Mirror that locally rather
    // than leaving a stale flag until the next fetch.
    let cached = getBatchResponse_(email);
    if (cached && cached.editedAfterGrading) {
      // A comment on a redone response answers it too: redraw the row and file
      // it where a fresh load would now put it.
      cached.editedAfterGrading = false;
      cached.markedBlank = false;
      updateBatchRowUI_(email);
    }
    try {
      let sceneKey = backend.batchSceneKey;
      let pending = inOrder_("dok|" + sceneKey + "|" + email, () => rpc("setGradeItem", {
        classId: backend.activeClassId,
        studentEmail: email,
        itemType: "dok",
        itemKey: sceneKey,
        score: patch.score !== undefined ? patch.score : null,
        excluded: !!patch.excluded,
        comment: patch.comment !== undefined ? patch.comment : ((getBatchResponse_(email) || {}).comment || ""),
      }));
      trackTeacherSave_(pending);
      await pending;
    } catch (e) {
      alert("Could not save that grade -- try again: " + e.message);
    }
  }
  // Sort priority: ungraded first (the actual to-do list), then incomplete
  // (nothing submitted yet, so you can see who to chase), then already-graded
  // last since they need no further attention.
  // -1 = redone since you marked it (your score is attached to text that has
  // changed, so it goes to the very top), 0 = waiting on you, 1 = nothing
  // submitted, 2 = done.
  // -1 redone since marking, 0 waiting on you, 1 nothing submitted, 2 done,
  // 3 excluded. Excluded gets its own group at the bottom: it used to share
  // "Already graded", which is untrue -- an excluded response has no score and
  // never will, and lumping the two together made a question excluded for the
  // whole class look like a class that had already been marked.
  function batchSortRank_(r) {
    if (r.excluded) return 3;
    if (r.editedAfterGrading && r.dokText) return -1;
    // A SCORE WINS OVER EVERYTHING ELSE. This check used to sit below the
    // no-response check, which meant giving a non-submitter a zero left them
    // parked in Incomplete for ever -- you could mark the whole group and watch
    // nothing move. Incomplete now means "still needs a decision from you".
    if (hasScore_(r.score)) return 2;
    if (!r.dokText) return 1;
    return 0;
  }
  function batchSortCompare_(a, b) {
    let ra = batchSortRank_(a),
      rb = batchSortRank_(b);
    if (ra !== rb) return ra - rb;
    return String(a.name || "").localeCompare(String(b.name || ""));
  }
  // ---- Rubric presentation, ported from the Short Story app ----
  // The 1-7 descriptors in DOK_RUBRIC are written as "Name. Sentence...", so
  // the leading word is the band name. Showing the name on the button (and in
  // the status chip) is the difference between picking a number and applying a
  // rubric.
  // Turns a "Name. Sentence..." descriptor array (index 0 unused, 1-7) into the
  // shape the marking UI renders. Every 7-point rubric in the app -- the scene
  // written response and the four essay steps -- is written that way, so they
  // all get the same buttons, the same legend and the same off-band note.
  function rubricFrom_(arr, label) {
    let levels = [];
    for (let n = arr.length - 1; n >= 1; n--) {
      let full = String(arr[n] || "");
      let dot = full.indexOf(". ");
      levels.push({
        points: n,
        label: dot > 0 ? full.slice(0, dot) : "Level " + n,
        text: dot > 0 ? full.slice(dot + 2) : full,
      });
    }
    return { label: label, levels: levels, max: arr.length - 1 };
  }
  const MB_RUBRIC = rubricFrom_(DOK_RUBRIC, "Written Response");
  // Every rubric in the app can be reached by name, so one marking screen can
  // switch between them by changing a key rather than a code path.
  const ESSAY_RUBRICS = {
    discussion: rubricFrom_(DISCUSSION_RUBRIC, "Thesis Discussion"),
    body: rubricFrom_(BODY_RUBRIC, "Body Paragraphs"),
    intro: rubricFrom_(INTRO_RUBRIC, "Introduction"),
    conclusion: rubricFrom_(CONCLUSION_RUBRIC, "Conclusion"),
  };
  function rubricLevelName_(score, rubric) {
    if (!hasScore_(score)) return "";
    let l = (rubric || MB_RUBRIC).levels.find((x) => x.points === Number(score));
    return l ? l.label : "";
  }
  function rubricLevelRow_(currentScore, btnClass, dataAttrs, rubric) {
    return `<div class="score-btn-row rubric-level-row">${(rubric || MB_RUBRIC).levels
      .map(
        (l) =>
          `<button type="button" class="${btnClass} rubric-level-btn ${hasScore_(currentScore) && Number(currentScore) === l.points ? "selected" : ""}" ${dataAttrs} data-score="${l.points}" title="${esc(l.text || l.label)}"><span class="rubric-level-name">${esc(l.label)}</span><span class="rubric-level-pts">${l.points}</span></button>`,
      )
      .join("")}</div>`;
  }
  // A free numeric box beside the bands, because a response is sometimes a 5.5
  // and forcing it onto a band loses that.
  function teacherScoreInputHtml_(inputClass, score, attrs, max) {
    let m = max === undefined ? DOK_POINTS : max;
    return `<div class="teacher-score-entry"><label><span>Teacher score</span><span>1\u2013${m} \u00b7 decimals allowed</span></label><input type="number" class="${inputClass}" min="0" max="${m}" step="0.5" value="${hasScore_(score) ? esc(String(score)) : ""}" ${attrs || ""} placeholder="Score"></div>`;
  }
  function teacherScoreValue_(input, max) {
    let m = max === undefined ? DOK_POINTS : max;
    let raw = String(input.value || "").trim();
    if (!raw) return null;
    let n = Number(raw);
    if (!Number.isFinite(n) || n < 0 || n > m) {
      alert("Enter a score from 0 to " + m + ".");
      input.focus();
      return undefined;
    }
    return Math.round(n * 100) / 100;
  }
  // The descriptors are the reason for having a rubric, so they are readable
  // without hovering every button.
  function rubricLegendHtml_(note, rubric) {
    let rb = rubric || MB_RUBRIC;
    return `<details class="rubric-legend"><summary>${esc(rb.label)} rubric &mdash; the full descriptors</summary>${rb.levels
      .map(
        (l) =>

        `<p class="all-excluded-note"><strong>This question is excluded for the whole class</strong>, so there is nothing to grade here${
          wrote ? ` — ${wrote} student(s) wrote a response, but it is not being counted` : ""
        }. Use the button above to count it again.</p>` +
        batchGroupedListHtml_(sceneKey, responses)
      );
    }
    let shown = backend.batchHideUnsubmitted ? responses.filter((r) => batchSortRank_(r) !== 1) : responses;
    let hidden = responses.length - shown.length;
    let anyPaste = responses.some((r) => r.paste && (r.paste.pasted || r.paste.quoted));
    let legend = anyPaste
      ? `<p class="paste-legend"><span><span class="swatch" style="background:#ffe0e0;border:1px solid #d4676a"></span>pasted from outside</span><span><span class="swatch" style="background:#fdf3d6;border:1px solid #d9b755"></span>pasted from the scene (a quotation)</span><span>Unmarked text was typed.</span></p>`
      : "";
    let note = hidden
      ? `<p class="toolbar-note">${hidden} student(s) who haven't submitted are hidden.</p>`
      : "";
    return legend + batchGroupedListHtml_(sceneKey, shown) + note;
  }

  function batchPanelHtml_(sceneKey, responses) {
    let q = QUESTIONS[sceneKey];
    let allExcluded = !!(responses && responses.length && responses.every((r) => r.excluded));
    let excludeBtn =
      responses && responses.length
        ? `<div class="exclude-all-row ${allExcluded ? "is-excluded" : ""}"><button class="btn ${allExcluded ? "primary" : ""}" id="excludeAllBtn">${
            allExcluded ? "↺ Count this question again for everyone" : "🚫 Don't grade this question for anyone"
          }</button><span class="toolbar-note">${
            allExcluded
              ? `Excluded for the whole class — Act ${SCENES[sceneKey].act} is now worth ${DOK_POINTS} points less for every student, and the Canvas CSV you export will show the lower total.`
              : `Use this if the question turned out to be flawed or unfair. It comes out of every student's Act ${SCENES[sceneKey].act} total (${DOK_POINTS} points) rather than counting as a zero.`
          }</span></div>`
        : "";
    return `<p class="dok-prompt">${esc(q ? q[3] : "")}</p>${rubricLegendHtml_("Keep this open while you score the class. Click a band, or type an exact score in the box beside it.")}<label class="exclude-toggle" style="margin-top:6px"><input type="checkbox" id="hideUnsubmitted" ${backend.batchHideUnsubmitted ? "checked" : ""}> Hide students who haven't submitted</label>${excludeBtn}`;
  }

  // Updates just the two data-driven panels, leaving the dropdown alone.
  // Falls back to a full render if the batch screen isn't on show.
  function refreshBatchView_() {
    let panel = document.getElementById("batchScenePanel");
    let list = document.getElementById("batchResponseList");
    if (!panel || !list) {
      if (state.view === "batchGrade") render();
      return;
    }
    let sceneKey = backend.batchSceneKey;
    let responses = getBatchResponses_();
    panel.innerHTML = batchPanelHtml_(sceneKey, responses);
    list.innerHTML = batchListHtml_(sceneKey, responses);
    bindBackend();
  }

  batchGrade = function () {
    if (!backend.enabled) return original.batchGrade();
    if (!backend.activeClassId)
      return `<div class="sectionhead"><h2>Grade Written Responses</h2></div><p class="toolbar-note">Choose a class from the Teacher Dashboard first.</p>`;
    if (!backend.batchSceneKey) backend.batchSceneKey = Object.keys(SCENES).sort(sceneSort)[0];
    let sceneKey = backend.batchSceneKey;
    let sceneOptions = [1, 2, 3, 4, 5]
      .map((act) => {
        let keys = Object.keys(SCENES)
          .filter((k) => SCENES[k].act === act)
          .sort(sceneSort);
        let opts = keys.map((k) => `<option value="${k}" ${k === sceneKey ? "selected" : ""}>Scene ${k}</option>`).join("");
        return `<optgroup label="Act ${act}">${opts}</optgroup>`;
      })
      .join("");
    let responses = getBatchResponses_();
    return `<div class="sectionhead grade-screen-head"><h2>Grade Written Responses</h2><div class="sectionhead-actions"><button class="btn" id="backToDashboard">← Back to Dashboard</button><button class="btn" id="refreshBatchResponses" title="Fetch the latest saved work for this scene">↻ Refresh</button></div></div><div class="card grade-screen-card"><div class="field" style="max-width:360px"><label>Scene</label><select id="batchSceneSelect">${sceneOptions}</select></div><div id="batchScenePanel">${batchPanelHtml_(sceneKey, responses)}</div></div><div id="batchResponseList">${batchListHtml_(sceneKey, responses)}</div>`;
  };
  // ---- Grade the essay, one step at a time ----------------------------------
  // The same screen as Grade Written Responses, keyed by essay step instead of
  // scene. It deliberately reuses that screen's grouping, sorting and rubric
  // rendering rather than growing a parallel copy: two marking screens that look
  // the same but behave differently is worse than either one alone.
  const ESSAY_GRADE_STEPS = ESSAY_STEP_KEYS.concat(["final"]);
  const ESSAY_GRADE_LABELS = Object.assign({}, ESSAY_STEP_LABELS, { final: "Final Essay" });
  // Column headings have to fit eleven of them across one table.
  const ESSAY_GRADE_SHORT = {
    thesis: "Thesis", discussion: "Discussion", body: "Body", intro: "Intro", conclusion: "Conclusion", final: "Final Essay",
  };

  function essayCacheKey_(classId, stepKey) { return classId + "::essay::" + stepKey; }
  function getEssayRows_() {
    return backend.essayResponseCache[essayCacheKey_(backend.activeClassId, backend.essayStepKey)];
  }
  function getEssayRow_(email) {
    let list = getEssayRows_();
    return list ? list.find((r) => r.email === email) : null;
  }
  // The thesis is a completion mark the app fills in: a drafted thesis is
  // complete without the teacher clicking anything. Everywhere else, "graded"
  // means the teacher put a number on it.
  function essayIsThesis_() { return backend.essayStepKey === "thesis"; }
  function essayRubric_() { return ESSAY_RUBRICS[backend.essayStepKey] || MB_RUBRIC; }
  function essayStepMax_() { return essayIsThesis_() ? 1 : DOK_POINTS; }

  function essayRowRank_(r) {
    if (r.excluded) return 3;
    // A rewrite only returns to the teacher queue after the student explicitly
    // resubmits the new version. Until then the old grade remains attached to
    // the old submission and the new text is just a draft.
    if (r.editedAfterGrading && r.text && r.submitted) return -1;
    if (hasScore_(r.score)) return 2;
    if (!r.submitted) return 1;
    return 0;
  }
  function essayIsDiscussion_() { return backend.essayStepKey === "discussion"; }
  function essayGroupMeta_(rank) {
    // In the discussion, posting is handing in -- there is no separate Submit.
    if (essayIsDiscussion_()) {
      if (rank === -1) return { label: "Resubmitted", note: "New replies or an updated thesis since you graded it" };
      if (rank === 0) return { label: "Ready to Grade", note: "Posted to the discussion, not graded yet" };
      if (rank === 1) return { label: "Not Submitted", note: "Nothing posted to the discussion yet" };
      if (rank === 2) return { label: "Graded", note: "Nothing new since you graded it" };
    }
    if (rank === -1) return { label: "Resubmitted", note: "Revised, or written for the first time, after grading and submitted" };
    if (rank === 0) return { label: "Ready to Grade", note: "Student explicitly submitted the current version" };
    if (rank === 1) return { label: "Not Submitted", note: "A draft may exist, but the current version has not been submitted" };
    if (rank === 2) return { label: essayIsThesis_() ? "Complete" : "Graded", note: essayIsThesis_() ? "Teacher-completed or submitted thesis recorded" : "Teacher score is official even if the student did not click Submit" };
    return { label: "Excluded", note: "Not counted for these students" };
  }
  function essayStatusBadgeHtml_(r) {
    if (r.excluded) return `<span class="mini-chip batch-status-badge batch-badge-excluded">Excluded</span>`;
    let out = "";
    if (essayIsDiscussion_() && hasScore_(r.teacherScore) && !r.submitted)
      out += `<span class="mini-chip batch-status-badge" title="You gave this a score, and the student has not posted anything in the discussion.">Nothing posted</span>`;
    else if (r.teacherGradedDraft || (hasScore_(r.teacherScore) && !r.submitted))
      out += `<span class="mini-chip batch-status-badge batch-badge-graded" title="You graded the saved draft even though the student did not click Submit. This score counts in the Macbeth gradebook and will be sent on the next Canvas push.">Teacher graded draft</span>`;
    else if (!r.text) out += `<span class="mini-chip batch-status-badge">Not started</span>`;
    else if (!r.submitted) out += `<span class="mini-chip batch-status-badge">Draft — not submitted</span>`;
    else if (essayIsDiscussion_()) out += `<span class="mini-chip batch-status-badge batch-badge-needs">Posted</span>`;
    else out += `<span class="mini-chip batch-status-badge batch-badge-needs">Submitted</span>`;
    if (essayIsThesis_()) {
      if (hasScore_(r.score))
        out += `<span class="mini-chip batch-status-badge batch-badge-graded">${Number(r.score) > 0 ? "Complete" : "Not complete"}${r.auto ? "" : " (yours)"}</span>`;
      return out;
    }
    if (hasScore_(r.score)) {
      let n = rubricLevelName_(r.score, essayRubric_());
      out += `<span class="mini-chip batch-status-badge batch-badge-graded">${n ? esc(n) + " " : ""}${r.score}/${DOK_POINTS}</span>`;
    } else if (r.submitted) {
      out += `<span class="mini-chip batch-status-badge batch-badge-needs">Needs grading</span>`;
    }
    return out;
  }

  function essayProcessFlagBadgeHtml_(r) {
    let p = (r && r.process) || {};
    let pasted = Number(p.pasted || 0), total = Number(p.total || 0);
    if (!pasted) return "";
    let pct = total ? Math.round((pasted / total) * 100) : 0;
    return `<span class="mini-chip process-warn" title="Current characters pasted from outside the Macbeth app. This is a process flag, not an automatic plagiarism finding.">Paste ${pct}%</span>`;
  }
  function essayEditedBadgeHtml_(r) {
    if (!r.editedAfterGrading || !r.text) return "";
    let when = r.gradedAt ? new Date(r.gradedAt).toLocaleDateString() : "";
    if (!r.submitted)
      return `<span class="mini-chip" title="The student changed the draft after it was graded, but has not resubmitted those changes yet.">✎ Revised draft — not resubmitted</span>`;
    if (essayIsDiscussion_()) {
      let what = discussionChangeText_(r);
      let tip = (r.markedBlank ? "You marked this" + (when ? " on " + when : "") + " before they had posted anything." : "Since you graded this" + (when ? " on " + when : "") + ", the student has added to the discussion.") +
        (what ? " What's new is marked below." : "") + " Your score is still the one you gave before. Once you have read it, set a score or press Keep.";
      return `<span class="mini-chip batch-edited-badge" title="${esc(tip)}">↻ ${r.markedBlank ? "POSTED AFTER MARKING" : "RESUBMITTED"} — ${esc(what || "needs regrade")}</span>`;
    }
    if (r.markedBlank)
      return `<span class="mini-chip batch-edited-badge" title="You marked this${when ? " on " + when : ""} while it was blank, and the student has since written and submitted it. Your score is still the one you gave the blank step. Read it and set a score to clear this.">↻ SUBMITTED AFTER MARKING — needs grade</span>`;
    return `<span class="mini-chip batch-edited-badge" title="This submitted version has changed since you marked it${when ? " on " + when : ""}. Your score is still the one you gave the old version. Re-read it and set a score to clear this.">↻ RESUBMITTED — needs regrade</span>`;
  }
  // "2 new replies", "thesis updated", "thesis updated, 1 new reply" -- from the
  // server's own timestamps. Empty when the change can't be dated, and the
  // badge then just says it needs a regrade.
  function discussionChangeText_(r) {
    let n = r.newSince || {};
    let replies = Number(n.replies || 0);
    let parts = [];
    if (n.thesis) parts.push(n.thesis === "posted" ? "thesis posted" : "thesis updated");
    if (replies) parts.push(replies + " new " + (replies === 1 ? "reply" : "replies"));
    return parts.join(", ");
  }
  // The same facts as a sentence, for the note above their posts.
  function discussionChangeSentence_(r) {
    let n = r.newSince || {};
    let replies = Number(n.replies || 0);
    let parts = [];
    if (n.thesis) parts.push(n.thesis === "posted" ? "posted their thesis" : "updated their thesis");
    if (replies) parts.push("posted " + replies + " new " + (replies === 1 ? "reply" : "replies"));
    return parts.length ? parts.join(" and ") : "added to the discussion";
  }


  // What the teacher actually reads, which is different for every step: a
  // thesis is one sentence, the body step is several paragraphs plus an optional
  // counterargument, the discussion is a list of posts.
  function essayWorkHtml_(r) {
    let step = backend.essayStepKey;
    let thesis = r.thesis ? `<p class="essay-thesis-line"><strong>Their thesis:</strong> ${esc(r.thesis)}</p>` : "";
    if (step === "discussion") {
      if (!r.posts || !r.posts.length) return `<div class="response-box"><em>Nothing posted to the discussion yet.</em></div>${essayProcessSummaryHtml_(r.text, r.process, {words:r.words, time:false})}`;
      return r.posts
        .map((p) => {
          let fresh = r.editedAfterGrading && p.isNew;
          let tag = fresh ? `<span class="mini-chip disc-new-chip">${p.kind === "reply" ? "New reply" : (r.newSince || {}).thesis === "posted" ? "New thesis" : "Updated thesis"}</span>` : "";
          return `<div class="response-box${fresh ? " disc-post-new" : ""}"><small class="essay-post-date">${esc(new Date(p.date).toLocaleString())}</small>${tag}<p>${esc(p.text)}</p></div>`;
        })
        .join("") + essayProcessSummaryHtml_(r.text, r.process, {words:r.words, time:false});
    }
    if (step === "body") {
      let bodies = Array.isArray(r.bodies) ? r.bodies : [];
      let bp = Array.isArray(r.bodyProcesses) ? r.bodyProcesses : [];
      let blocks = bodies
        .map((b, i) => {
          let text = String(b || "").trim();
          return `<div class="response-box essay-para"><strong>Body Paragraph ${i + 1}${i >= 3 ? " (extra)" : ""}</strong><p>${text ? essayProcessTextHtml_(text, bp[i]) : "<em>Not drafted</em>"}</p>${essayProcessSummaryHtml_(text, bp[i])}</div>`;
        })
        .join("");
      let rebText = String(r.rebuttal || "").trim();
      let reb = rebText
        ? `<div class="response-box essay-para essay-rebuttal"><strong>Counterargument</strong> <span class="mini-chip body-chip-extra">Optional</span><p>${essayProcessTextHtml_(rebText, r.rebuttalProcess)}</p>${essayProcessSummaryHtml_(rebText, r.rebuttalProcess)}</div>`
        : `<p class="toolbar-note">No counterargument paragraph — it is optional, so this is not a gap.</p>`;
      return thesis + (blocks || `<div class="response-box"><em>Nothing drafted yet.</em></div>`) + reb;
    }
    return thesis + `<div class="response-box">${r.text ? essayProcessTextHtml_(r.text, r.process) : "<em>Nothing drafted yet.</em>"}</div>${essayProcessSummaryHtml_(r.text, r.process, {words:r.words})}`;
  }

  // The thesis row asks a yes/no question, so it gets two buttons rather than a
  // seven-band rubric. Anything else would be pretending to measure something.
  function essayScoreRowHtml_(r) {
    if (essayIsThesis_()) {
      let val = hasScore_(r.score) ? Number(r.score) : null;
      return `<div class="score-btn-row essay-complete-row">
        <button type="button" class="essayCompleteBtn rubric-level-btn ${val === 1 ? "selected" : ""}" data-email="${esc(r.email)}" data-score="1"><span class="rubric-level-name">Complete</span><span class="rubric-level-pts">1</span></button>
        <button type="button" class="essayCompleteBtn rubric-level-btn ${val === 0 ? "selected" : ""}" data-email="${esc(r.email)}" data-score="0"><span class="rubric-level-name">Not complete</span><span class="rubric-level-pts">0</span></button>
      </div>${r.auto && val === 1 ? `<p class="toolbar-note">Marked complete automatically because a thesis is drafted. Click either button to decide it yourself.</p>` : ""}`;
    }
    let rb = essayRubric_();
    return (
      rubricLevelRow_(r.score, "essayScoreBtn", `data-email="${esc(r.email)}"`, rb) +
      teacherScoreInputHtml_("essayManualScore", r.score, `data-email="${esc(r.email)}"`, DOK_POINTS) +
      offRubricNoteHtml_(r.score, rb)
    );
  }
  function essayStudentRowHtml_(r) {
    let since = essayIsDiscussion_()
      ? r.markedBlank
        ? " before they had posted anything, and they have posted since. Their posts are below."
        : `, and since then they have ${esc(discussionChangeSentence_(r))}.${discussionChangeText_(r) ? " What's new is marked below." : ""}`
      : r.markedBlank
        ? " when it was blank, and the student has written and submitted it since. Below is the current version."
        : ", and the student has rewritten it since. Below is the current version.";
    let keep = r.editedAfterGrading && r.text && r.submitted
      ? `<p class="edited-note">You gave this <strong>${hasScore_(r.teacherScore) ? r.teacherScore + "/" + essayStepMax_() : "no score"}</strong>${r.gradedAt ? " on " + esc(new Date(r.gradedAt).toLocaleDateString()) : ""}${since} <button class="btn essayKeepBtn" data-email="${esc(r.email)}" ${hasScore_(r.teacherScore) ? "" : "disabled"}>Keep ${r.teacherScore}/${essayStepMax_()}</button></p>`
      : "";
    return `<div class="item-grade-block batch-row" data-email="${esc(r.email)}" data-grade-rank="${essayRowRank_(r)}" data-student-name="${esc(r.name || "")}">
      <h5>${esc(r.name)} ${essayStatusBadgeHtml_(r)}${essayProcessFlagBadgeHtml_(r)}${essayEditedBadgeHtml_(r)}</h5>
      <div class="batch-work">${keep}${essayWorkHtml_(r)}</div>
      <div class="grade-row-dok">${essayScoreRowHtml_(r)}<label class="exclude-toggle"><input type="checkbox" class="essayExcludeToggle" data-email="${esc(r.email)}" ${r.excluded ? "checked" : ""}> Exclude from grade</label><textarea class="essayComment" data-email="${esc(r.email)}" placeholder="Optional feedback comment for the student">${esc(r.comment || "")}</textarea></div>
    </div>`;
  }
  function applyEssayLocalUpdate_(email, patch) {
    let r = getEssayRow_(email);
    if (!r) return;
    if (patch.score !== undefined) {
      r.score = patch.score;
      r.teacherScore = patch.score;
      r.auto = false;
      r.teacherGradedDraft = hasScore_(patch.score) && !r.submitted;
      r.editedAfterGrading = false; // marking it again is reading the new version
      r.markedBlank = false;
      r.newSince = { replies: 0, thesis: false };
      (r.posts || []).forEach((p) => (p.isNew = false));
    }
    if (patch.excluded !== undefined) r.excluded = patch.excluded;
    if (patch.comment !== undefined) r.comment = patch.comment;
  }
  function updateEssayRowUI_(email) {
    let r = getEssayRow_(email);
    if (!r) return;
    let row = document.querySelector('.batch-row[data-email="' + email + '"]');
    if (!row) return;
    let h5 = row.querySelector("h5");
    if (h5) h5.innerHTML = `${esc(r.name)} ${essayStatusBadgeHtml_(r)}${essayProcessFlagBadgeHtml_(r)}${essayEditedBadgeHtml_(r)}`;
    if (!r.editedAfterGrading) {
      let note = row.querySelector(".edited-note");
      if (note) note.remove();
      row.querySelectorAll(".disc-new-chip").forEach((c) => c.remove());
      row.querySelectorAll(".disc-post-new").forEach((b) => b.classList.remove("disc-post-new"));
    }
    let manual = row.querySelector(".essayManualScore");
    if (manual) manual.value = hasScore_(r.score) ? r.score : "";
    row.querySelectorAll(".essayScoreBtn,.essayCompleteBtn").forEach((btn) => {
      btn.classList.toggle("selected", hasScore_(r.score) && Number(btn.dataset.score) === Number(r.score));
    });
    let cb = row.querySelector(".essayExcludeToggle");
    if (cb) cb.checked = r.excluded;
    resortBatchRows_(row, essayRowRank_(r), r.name);
  }
  async function toggleExcludeEssayStepForClass_() {
    let rows = getEssayRows_() || [];
    if (!rows.length) return;
    let stepKey = backend.essayStepKey;
    let isFinal = stepKey === "final";
    let rowExcluded = (r) => (isFinal ? ESSAY_CRITERIA.every((c) => r.criteria && r.criteria[c] && r.criteria[c].excluded) : r.excluded);
    let next = !rows.every(rowExcluded);
    let btn = document.getElementById("essayExcludeAllBtn");
    if (btn) {
      btn.disabled = true;
      btn.textContent = next ? "Excluding\u2026" : "Restoring\u2026";
    }
    try {
      await rpc("setGradeItemForClass", isFinal
        ? { classId: backend.activeClassId, essayFinal: true, excluded: next }
        : { classId: backend.activeClassId, itemType: "essay", itemKey: stepKey, excluded: next });
      if (isFinal) {
        // The four criteria carry their own flags; refetch so every row's
        // totals are recomputed by the server rather than patched here.
        delete backend.essayResponseCache[essayCacheKey_(backend.activeClassId, stepKey)];
        await loadEssayResponses(stepKey, true);
      } else {
        rows.forEach((r) => (r.excluded = next));
      }
      invalidateDashboardCache_();
    } catch (e) {
      alert("Could not update the whole class: " + e.message);
    }
    if (state.view === "essayGrade") refreshEssayView_();
  }
  async function saveEssayGradeItem_(email, patch) {
    invalidateDashboardCache_();
    // The server stores the version on screen with every save, so a flag on
    // this row has now been seen -- the same rule as the scene screen. Mirror it
    // here rather than leaving a stale flag until the next fetch.
    let seenRow = getEssayRow_(email);
    if (seenRow && seenRow.editedAfterGrading) {
      seenRow.editedAfterGrading = false;
      seenRow.markedBlank = false;
      seenRow.newSince = { replies: 0, thesis: false };
      (seenRow.posts || []).forEach((p) => (p.isNew = false));
      // Redraw the header and note, and file the row where a fresh load would
      // now put it (a comment on a resubmitted step answers the resubmission).
      // A save from a comment box losing focus happens on the press of the next
      // click; resortBatchRows_ holds the move until that click is handled.
      let rowEl = document.querySelector('.batch-row[data-email="' + email + '"]');
      if (rowEl) {
        let h5 = rowEl.querySelector("h5");
        if (h5) h5.innerHTML = `${esc(seenRow.name)} ${essayStatusBadgeHtml_(seenRow)}${essayProcessFlagBadgeHtml_(seenRow)}${essayEditedBadgeHtml_(seenRow)}`;
        rowEl.querySelectorAll(".edited-note,.disc-new-chip").forEach((x) => x.remove());
        rowEl.querySelectorAll(".disc-post-new").forEach((x) => x.classList.remove("disc-post-new"));
        resortBatchRows_(rowEl, essayRowRank_(seenRow), seenRow.name);
      }
    }
    try {
      let stepKey = backend.essayStepKey;
      let pending = inOrder_("essay|" + stepKey + "|" + email, () => rpc("setGradeItem", {
        classId: backend.activeClassId,
        studentEmail: email,
        itemType: "essay",
        itemKey: stepKey,
        score: patch.score !== undefined ? patch.score : null,
        excluded: !!patch.excluded,
        comment: patch.comment !== undefined ? patch.comment : (getEssayRow_(email) || {}).comment || "",
        // The version on screen. Anything the student adds after this screen
        // loaded stays flagged instead of being folded into this grade unseen.
        seenFp: (getEssayRow_(email) || {}).fp || "",
      }));
      trackTeacherSave_(pending);
      let saved = await pending;
      acceptEssayGradeSummary_(email, saved);
    } catch (e) {
      alert("Could not save that grade — try again: " + e.message);
    }
  }

  // ---- The finished essay, all four criteria at once ----
  // The teacher reads a 900-word essay once, then scores Argument & Insight,
  // Evidence & Analysis, Organization & Coherence, and Language & Control together.
  // Splitting them across four passes would mean
  // reading it four times.
  function finalRowRank_(r) {
    let active = ESSAY_CRITERIA.filter((c) => !r.criteria[c].excluded);
    if (!active.length) return 3;
    let t = r.finalTotal || {};
    if (t.editedAfterGrading && r.text && t.submitted) return -1;
    if (active.every((c) => hasScore_(r.criteria[c].teacherScore))) return 2;
    if (!t.submitted) return 1;
    return 0;
  }
  function finalGroupMeta_(rank) {
    if (rank === -1) return { label: "Resubmitted", note: "Final essay revised after grading and submitted again" };
    if (rank === 0) return { label: "Ready to Grade", note: "Student explicitly submitted the current final essay" };
    if (rank === 1) return { label: "Not Submitted", note: "An assembled draft may exist, but the current version has not been submitted" };
    if (rank === 2) return { label: "Graded", note: "All four criteria scored; teacher scores count even without student submission" };
    return { label: "Excluded", note: "Not counted for these students" };

  function finalSummaryHtml_(r) {

  function finalStudentRowHtml_(r) {

  function applyFinalLocalUpdate_(email, crit, patch) {
    let r = getEssayRow_(email);

  // Saving a final-essay criterion (2026-10-08a).
  // Before, every click or comment sent its own save, all at once. Typing a
  // comment and then clicking a score sent two saves together: the comment's
  // (carrying the OLD score) and the score's. If the comment's arrived second,
  // it wiped the score -- the "it didn't save, I had to redo a section" bug.
  // Now each criterion has ONE save at a time, and every save sends what is on
  // screen at the moment it goes out, so the last thing you did always wins.
  function saveFinalGradeItem_(email, crit, patch) {
    invalidateDashboardCache_();
    patch = patch || {};
    let local = {};
    if (patch.score !== undefined) local.score = patch.score;
    if (patch.excluded !== undefined) local.excluded = !!patch.excluded;
    if (patch.comment !== undefined) local.comment = patch.comment;
    applyFinalLocalUpdate_(email, crit, local);
    backend.finalSaveQ = backend.finalSaveQ || {};

    if (q.running) { q.again = true; return q.running; }

      do {
        q.again = false;

          classId: backend.activeClassId,

      .catch((e) => {

  // ---- Gemini: suggested feedback on the Final Essay (2026-10-02a) ----------
  // A "Suggest feedback" button on each final essay. Gemini reads the essay

  // click to add it to the comment (saved like a typed comment), click again to

  const AI_FB_TAGS = ["Strength", "Strength", "Praise + push", "Next step"];
  backend.ai = backend.ai || { status: null, statusLoading: false, results: {}, loading: {}, errors: {}, connectFor: "" };

  function aiFindAll_(selector, email, crit) {
    return Array.from(document.querySelectorAll(selector)).filter(
      (el) => el.dataset.email === email && (crit === undefined || el.dataset.crit === crit),
    );
  }
  function aiCommentBox_(email, crit) {
    return aiFindAll_("textarea.critComment", email, crit)[0] || null;
  }
  function aiHasStatement_(text, statement) {
    return !!statement && String(text || "").indexOf(statement) !== -1;
  }
  function aiStatusLineHtml_() {
    let s = backend.ai.status;
    if (!s) return `<span class="toolbar-note">✨ Gemini feedback suggestions: checking…</span>`;

    let who = s.source === "script" ? "using the school-wide key" : `your key ${esc(s.hint || "")}`;
    return `<span class="toolbar-note">✨ <strong>Gemini feedback suggestions:</strong> connected (${who}). Click <em>Suggest feedback</em> on an essay, then click a suggestion to add it to that criterion's comment.</span>${
      s.source === "teacher" ? ` <button type="button" class="btn ai-fb-disconnect" style="font-size:12px;padding:4px 9px">Disconnect</button>` : ""
    }`;
  }
  function aiRefreshStatusLine_() {
    let el = document.getElementById("aiGeminiStatus");
    if (el) el.innerHTML = aiStatusLineHtml_();
  }
  async function aiLoadStatus_() {
    if (backend.ai.status || backend.ai.statusLoading || !backend.enabled) return;
    backend.ai.statusLoading = true;
    try {
      backend.ai.status = await rpc("getGeminiStatus");
    } catch (e) {
      backend.ai.status = { connected: false, error: e.message };

  function aiConnectHtml_(email) {
    return `<div class="ai-fb-connect">
      <strong>Connect Gemini</strong>
      <ol>
        <li>Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio → API keys</a> and sign in with your Google account.</li>
        <li>Click <em>Create API key</em>, then copy it.</li>
        <li>Paste it here. It is stored privately against your own Google account — students never see it.</li>
      </ol>

    </div>`;
  }
  function aiBarHtml_(r) {

  function aiSlotHtml_(email, crit) {

      .map(
        (s, i) =>

  function aiRefreshChips_(email, crit) {

  async function aiSuggest_(email, refresh) {
    let r = getEssayRow_(email);

  async function aiSaveKey_(email) {

  }
  // ---- Focused grading (2026-10-02e) -----------------------------------
  // One student's final essay full-screen: the essay wide and readable on the
  // left, the four criteria (scores, comments, Gemini suggestions) on the
  // right, each scrolling on its own. It is the SAME row as in the list, just
  // laid out differently, so every button and save works exactly as before.
  function focusRows_() {
    return Array.from(document.querySelectorAll("#essayResponseList .batch-row[data-email]")).filter(
      (el) => el.classList.contains("focus-mode") || el.offsetParent !== null,
    );
  }
  function setFocus_(email) {
    document.querySelectorAll(".batch-row.focus-mode").forEach((el) => el.classList.remove("focus-mode"));
    backend.focusEmail = email || "";
    if (!email) return;
    let row = focusRows_().find((el) => el.dataset.email === email) ||
      Array.from(document.querySelectorAll(".batch-row[data-email]")).find((el) => el.dataset.email === email);
    if (!row) { backend.focusEmail = ""; return; }
    row.classList.add("focus-mode");
    focusRefreshLeft_();
    let work = row.querySelector(".batch-work");
    let grid = row.querySelector(".final-criteria-grid");
    if (work) work.scrollTop = 0;
    if (grid) grid.scrollTop = 0;
  }
  function closeFocus_() {
    let email = backend.focusEmail;
    setFocus_("");
    let row = Array.from(document.querySelectorAll(".batch-row[data-email]")).find((el) => el.dataset.email === email);
    if (row) row.scrollIntoView({ block: "start" });
  }
  // "Next to mark" skips anyone who hasn't submitted or is already fully
  // marked, and anyone you have already looked at and passed over this time
  // round. "Back" retraces the students you actually viewed.
  function needsMarking_(email) {
    let r = getEssayRow_(email);
    if (!r || !r.text || !r.criteria) return false;
    let rank = finalRowRank_(r);
    return rank === 0 || rank === -1;   // Ready to Grade, or Resubmitted
  }
  function markingQueue_() {
    return Array.from(document.querySelectorAll("#essayResponseList .batch-row[data-email]"))
      .map((el) => el.dataset.email)
      .filter((e, i, all) => all.indexOf(e) === i && needsMarking_(e));
  }
  function focusRefreshLeft_() {
    let left = markingQueue_().length;
    document.querySelectorAll(".batch-row.focus-mode .focus-left").forEach((el) => {
      el.textContent = left ? left + " left to mark" : "All submitted essays are marked";
    });
    document.querySelectorAll(".batch-row.focus-mode .focusPrevBtn").forEach((b) => (b.disabled = !(backend.focusHistory || []).length));
  }
  function stepFocus_(dir) {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // saves a comment or score being typed
    backend.focusHistory = backend.focusHistory || [];
    backend.focusSeen = backend.focusSeen || {};
    let current = backend.focusEmail;
    if (dir < 0) {
      let prev = backend.focusHistory.pop();
      if (prev) setFocus_(prev);
      return;
    }
    backend.focusSeen[current] = true;
    let queue = markingQueue_().filter((e) => e !== current);
    let next = queue.find((e) => !backend.focusSeen[e]);
    if (!next && queue.length) {

      backend.focusSeen = {};

  if (!backend.aiListenersBound) {

  async function loadEssayResponses(stepKey, forceRefresh, attempt) {
    backend.essayStepKey = stepKey;
    let classId = backend.activeClassId;
    let key = essayCacheKey_(classId, stepKey);
    let cached = backend.essayResponseCache[key];
    if (state.view === "essayGrade") refreshEssayView_();
    if ((cached && !forceRefresh) || backend.essayResponsePending[key]) return;
    backend.essayResponsePending[key] = true;
    try {
      let fresh = await fetchResponsesSafely_("getEssayResponses", { classId: classId, stepKey: stepKey });
      if (!fresh && !cached) fresh = await rpc("getEssayResponses", { classId: classId, stepKey: stepKey });
      let showing = backend.activeClassId === classId && backend.essayStepKey === stepKey && state.view === "essayGrade";
      const again = () => {
        if (backend.activeClassId === classId && backend.essayStepKey === stepKey && state.view === "essayGrade") loadEssayResponses(stepKey, true);
      };
      if (!fresh) { if ((attempt || 0) < 2) setTimeout(() => backend.activeClassId === classId && backend.essayStepKey === stepKey && state.view === "essayGrade" && loadEssayResponses(stepKey, true, (attempt || 0) + 1), 2000); return; }
      if (cached && showing && listIsBusy_("essayResponseList")) { refetchWhenListFree_("essayResponseList", again); return; }
      backend.essayResponseCache[key] = normalizeEssayRows_(fresh.responses, stepKey);
      if (showing) refreshEssayView_();
    } catch (e) {
      console.error(e);
      let list = document.getElementById("essayResponseList");
      if (list && !cached) list.innerHTML = `<p class="toolbar-note">Could not load the essays: ${esc(e.message || String(e))}</p>`;
    } finally {
      delete backend.essayResponsePending[key];
    }
  }
  // Apps Script hands the browser `undefined` where the server returned null, so
  // every score arriving from the server is normalised at the door -- the same
  // guard the scene responses get, and for the same reason.
  function normalizeEssayRows_(rows, stepKey) {
    return (rows || []).map((r) => {
      let out = Object.assign({}, r);
      out.text = String(out.text || "");
      out.words = Number(out.words || processWordCount_(out.text));
      out.process = out.process || {};
      out.excluded = out.excluded === true;
      out.comment = String(out.comment || "");
      if (stepKey === "final") {
        out.criteria = out.criteria || {};
        ESSAY_CRITERIA.forEach((c) => {
          let rec = out.criteria[c] || {};
          rec.teacherScore = normalizeScore_(rec.teacherScore);
          rec.score = normalizeScore_(rec.score);
          rec.excluded = rec.excluded === true;
          rec.comment = String(rec.comment || "");
          rec.selfEvalIdx = rec.selfEvalIdx === undefined || rec.selfEvalIdx === null ? "" : rec.selfEvalIdx;
          out.criteria[c] = rec;
        });
        out.finalTotal = out.finalTotal || { earned: 0, possible: 0 };
        out.words = Number(out.words || 0);
      } else {
        out.score = normalizeScore_(out.score);
        out.teacherScore = normalizeScore_(out.teacherScore);
        out.auto = out.auto === true;
        out.submitted = out.submitted === true;
        out.teacherGradedDraft = out.teacherGradedDraft === true || (hasScore_(out.teacherScore) && !out.submitted);
        out.editedAfterGrading = out.editedAfterGrading === true;
      }
      return out;
    });
  }

  essayGrade = function () {

  // ---- The Grading Hub -------------------------------------------------------
  // Eleven tiles: the five Acts and the six pieces of the essay. Each one answers
  // the only question worth asking at a glance -- how many students are waiting
  // on me -- and is a button through to the screen where you deal with them.
  //
  // Counts come from getGradingHubSummary, fetched separately from the roster so
  // a grading click refreshes the numbers without refetching every student's
  // whole grade summary. Ported from the short story unit's Grading Hub.
  function showRegradeNotice_(count) {
    let old = document.getElementById("regradeToast");
    if (old) old.remove();
    let toast = document.createElement("div");
    toast.id = "regradeToast";
    toast.className = "save-toast warn";
    toast.innerHTML = `<strong>↻ Student redo needs grading</strong><span>${count} redone assignment${count === 1 ? " is" : "s are"} now waiting for you. Redos are placed at the top of the grading pile.</span>`;
    document.body.appendChild(toast);
    window.setTimeout(() => { if (toast && toast.parentNode) toast.remove(); }, 9000);
  }
  async function loadGradingHub(classId, forceRefresh) {
    classId = classId || backend.activeClassId;
    if (!classId) return;
    let cached = backend.gradingHubCache[classId];
    if (cached && !forceRefresh) {
      backend.gradingHub = cached;
      return;
    }
    if (backend.gradingHubPending[classId]) return;
    backend.gradingHubPending[classId] = true;
    try {
      let previousRedo = cached ? Number(cached.needsRegradeTotal || 0) : null;
      let fresh = await rpc("getGradingHubSummary", { classId: classId });
      backend.gradingHubCache[classId] = fresh;
      if (backend.activeClassId !== classId) return; // switched class while this was in flight
      backend.gradingHub = fresh;
      let freshRedo = Number(fresh.needsRegradeTotal || 0);
      if (previousRedo !== null && freshRedo > previousRedo) showRegradeNotice_(freshRedo);
      // Repaint just the tiles, so a refresh never destroys anything the teacher
      // is part-way through elsewhere on the dashboard.
      let mount = document.getElementById("gradingHubTiles");
      if (mount && state.view === "manage") {
        // A background recount must not wipe a Push or CSV result the teacher
        // is still reading, or snap shut a menu they have open.
        let notes = {};
        if (mount.dataset.class === classId)
          mount.querySelectorAll(".hub-tile-msg").forEach((m) => { if (m.textContent.trim()) notes[m.id] = m.textContent; });
        mount.dataset.class = classId;
        let openMenu = mount.querySelector(".hub-more[open]");
        let openAsg = openMenu ? (openMenu.querySelector("[data-asg]") || {}).dataset : null;
        mount.innerHTML = hubTilesHtml_();
        Object.keys(notes).forEach((id) => { let m = document.getElementById(id); if (m) m.textContent = notes[id]; });
        bindBackend();
        // The release switches are AppLogic's controls, bound by its bind(), not
        // by bindBackend() -- without this a repainted tile's switch would move
        // but save nothing.
        if (typeof bindReleaseControls_ === "function") bindReleaseControls_();
        if (openAsg && openAsg.asg) {
          let btn = mount.querySelector(`.hub-more [data-asg="${openAsg.asg}"]`);
          let d = btn ? btn.closest(".hub-more") : null;
          if (d) d.open = true;
        }
      } else if (state.view === "manage") {
        render();
      }
    } catch (e) {
      console.error(e);
      let mount = document.getElementById("gradingHubTiles");
      if (mount && !cached) mount.innerHTML = `<p class="toolbar-note">Could not load the grading counts: ${esc(e.message || String(e))}</p>`;
    } finally {
      delete backend.gradingHubPending[classId];
    }
  }

  backend.__loadGradingHub = loadGradingHub; // test hook: the same call the 60s timer makes
  // Keep the teacher's to-do list alive while Macbeth is open. This is light
  // enough for a class-sized sheet, but frequent enough that a student redo does
  // not sit unnoticed until the teacher manually refreshes the dashboard.
  window.setInterval(function(){
    if (!backend.ready || !backend.activeClassId || state.role === "student") return;
    if (document.visibilityState === "hidden") return;
    loadGradingHub(backend.activeClassId, true);
  }, 60000);

  // ---- One tile, two kinds of assignment -------------------------------------
  // The five Acts and the six graded essay steps are drawn by ONE function from
  // one normalised description (hubTileModel_), so the two rows of tiles cannot
  // drift apart again. Every tile has the same four zones, in the same order:
  //
  //   head      what it is, what it is worth, when it is due, and a status badge
  //   progress  one bar and three counts: to grade / graded / not submitted
  //   action    one button through to the marking screen
  //   foot      student access (a switch), then Canvas (status, Push, ⋯ menu)
  //
  // Everything used less than weekly -- due dates, the CSV, "Don't grade" --
  // lives in the ⋯ menu, so the tile shows the things you act on every day.
  // Handler classes are the ones bind() already looks for (actRelease,
  // essayStageRelease, push-act-btn, hubCanvasBtn, export-act-btn,
  // actNoGradeBtn), plus essayNoGradeBtn, which is new and deliberately its own
  // class rather than a shared one -- see the parallel-classes note in bind().
  function hubStatus_(r) {
    if (r.allExcluded) return { kind: "excluded", count: 0, redo: 0, fresh: 0 };
    let total = Number(r.needsGrading || 0);
    let redo = Number(r.needsRegrade || 0);
    let fresh = Math.max(0, total - redo);
    if (total > 0) return { kind: "needs", count: total, redo: redo, fresh: fresh };
    if (Number(r.submitted || 0) > 0 || Number(r.graded || 0) > 0) return { kind: "done", count: 0, redo: 0, fresh: 0 };
    return { kind: "none", count: 0, redo: 0, fresh: 0 };
  }
  function hubShortDate_(iso) {
    if (!iso) return "";
    let d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function hubDue_(asg) {
    let link = (canvasSettings_().assignments || {})[asg] || {};
    let sch = canvasSchedule_()[asg] || {};
    let due = sch.dueAt || link.dueAt;
    if (!due) return null;
    let d = new Date(due);
    if (Number.isNaN(d.getTime())) return null;
    return {
      short: hubShortDate_(due),
      full: d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }),
    };
  }
  // Canvas, in the smallest number of words that are still true.
  function hubCanvasState_(asg) {
    let c = canvasSettings_();
    if (!canvasLinked_() || !c.courseId) return { text: "Canvas not linked", cls: "is-off", title: "Link this class to a Canvas course to push scores and comments." };
    let link = (c.assignments || {})[asg] || {};
    if (!link.assignmentId)
      return { text: "Not in Canvas yet", cls: "is-pending", title: "Push creates the Canvas assignment the first time, then reuses it." };
    let bits = [link.name || "Canvas assignment"];
    if (link.moduleName) bits.push("Module: " + link.moduleName);
    if (link.lastGradeSyncAt) bits.push("Last pushed " + hubShortDate_(link.lastGradeSyncAt));
    return {
      text: link.lastGradeSyncAt ? "Pushed " + hubShortDate_(link.lastGradeSyncAt) : "In Canvas",
      cls: "is-ok",
      title: bits.join(" · "),
    };
  }
  const ESSAY_TILE_NOTE = {
    thesis: "Marks itself complete when submitted",
    discussion: "A post or reply counts as turned in",
    body: "One rubric score for every paragraph",
    intro: "Scored on a 7-level rubric",
    conclusion: "Scored on a 7-level rubric",
    final: "Four criteria, 7 points each",
  };

  function hubTileModel_(r, kind, idx) {
    if (kind === "act") {
      let card = ACT_CARDS[r.act - 1] || ["Act " + r.act, "Act " + r.act, "#6f1d2c"];
      let sceneCount = Object.keys(SCENES).filter((k) => SCENES[k].act === r.act).length;
      return {
        kind: "act",
        asg: "act:" + r.act,
        name: "Act " + r.act,
        accent: card[2],

        title: card[1],

        unit: "written responses",

        open: `data-hubopen="act" data-key="${r.act}" data-scene="${esc(r.firstToMark)}"`,
        release: { cls: "actRelease", attr: `data-act="${r.act}"`, on: (state.releasedActs || []).indexOf(r.act) !== -1, hides: `students cannot open Act ${r.act}'s scenes` },
        noGrade: { cls: "actNoGradeBtn", attr: `data-act="${r.act}"` },
      };
    }
    let stage = essayGradeKeyStage_(r.key);
    let journey = ESSAY_JOURNEY.find((j) => j[0] === stage) || [];
    return {
      kind: "essay",
      asg: "essay:" + r.key,
      name: r.label,
      accent: journey[3] || "#6f1d2c",
      eyebrow: `Essay · Step ${idx + 1}`,
      title: r.label,
      worth: r.allExcluded ? "Excluded for this class" : r.gradingType === "pass_fail" ? "Complete / incomplete" : r.pointsPossible + " pts",
      unit: "students",
      note: ESSAY_TILE_NOTE[r.key] || "",
      open: `data-hubopen="essay" data-key="${esc(r.key)}"`,
      release: { cls: "essayStageRelease", attr: `data-estep="${esc(stage)}"`, on: essayGradeKeyReleased_(r.key), hides: `students cannot open the ${journey[1] || r.label} step` },
      noGrade: { cls: "essayNoGradeBtn", attr: `data-ekey="${esc(r.key)}"` },
    };
  }

  function hubTileHtml_(r, kind, idx) {

    let done = Math.max(0, Number(r.graded || 0));
    let todo = Math.max(0, Number(r.needsGrading || 0));
    let rest = Math.max(0, total - done - todo);

        : `<div class="hub-bar" role="img" aria-label="${done} graded, ${todo} to grade, ${rest} not submitted, of ${total} ${m.unit}">
            <span class="hub-bar-done" style="width:${pct(done)}%"></span><span class="hub-bar-todo" style="width:${pct(todo)}%"></span>
          </div>
          <dl class="hub-stats">

    let rel = m.release;

    let menu = `<details class="hub-more">
        <summary class="hub-more-btn" title="More actions" aria-label="More actions for ${esc(m.name)}">⋯</summary>
        <div class="hub-menu" role="menu">
          <button type="button" role="menuitem" class="hubCanvasBtn" data-asg="${m.asg}">${linked ? "Due date &amp; Canvas…" : "Set up Canvas…"}</button>
          <button type="button" role="menuitem" class="export-act-btn" data-asg="${m.asg}" ${(backend.asgBusy || {})[m.asg] ? "disabled" : ""}>Download Canvas CSV</button>
          <hr>
          <button type="button" role="menuitem" class="${m.noGrade.cls} ${r.allExcluded ? "is-excluded" : ""}" ${m.noGrade.attr} title="${
            r.allExcluded ? "Count this again for the whole class" : "Leave this out of every student's grade. Scores you have already entered are kept."
          }">${r.allExcluded ? "↺ Count it again" : "Don’t grade for this class"}</button>
        </div>
      </details>`;

    return `<article class="hub-tile hub-tile-${m.kind} ${rel.on ? "is-released" : "is-unreleased"} ${st.kind === "needs" ? "has-needs" : ""} ${r.allExcluded ? "is-nograde" : ""}" style="--acc:${m.accent}" ${m.open} aria-label="${esc(m.name)}">
      <header class="hub-tile-head">
        <div class="hub-tile-id">
          <span class="hub-tile-eyebrow">${esc(m.eyebrow)}</span>

              ? `<button type="button" class="btn hub-mini-btn push-act-btn" data-asg="${m.asg}" ${(backend.asgBusy || {})[m.asg] ? "disabled" : ""} title="Send these scores and teacher comments to Canvas now. The assignment is created the first time and reused after that.">↗ Push</button>`
              : ""
          }${menu}</span>
        </div>
        <div class="hub-tile-msg" id="${asgStatusId_(m.asg)}" aria-live="polite"></div>
      </footer>
    </article>`;
  }
  function hubActTileHtml_(r) { return hubTileHtml_(r, "act", 0); }
  function hubEssayTileHtml_(r, idx) { return hubTileHtml_(r, "essay", idx); }

  function hubGroupHeadHtml_(title, rows) {
    let waiting = rows.reduce((n, r) => n + (r.allExcluded ? 0 : Number(r.needsGrading || 0)), 0);
    return `<div class="hub-group-head"><h4>${esc(title)}</h4><span class="hub-group-count">${rows.length} assignments</span>${
      waiting ? `<span class="hub-group-waiting">${waiting} to grade</span>` : `<span class="hub-group-clear">Nothing waiting</span>`
    }</div>`;

  function hubTilesHtml_() {
    let hub = backend.gradingHub;
    if (!hub) return `<div class="hub-loading"><span class="hub-spinner" aria-hidden="true"></span>Counting what needs grading…</div>`;
    return `${hubGroupHeadHtml_("The Play", hub.acts)}

      ${hubGroupHeadHtml_("The Essay", hub.essay)}
      <div class="hub-tile-grid">${hub.essay.map(hubEssayTileHtml_).join("")}</div>`;
  }

  function gradingHubCard() {
    let hub = backend.gradingHub;
    let redoCount = hub ? Number(hub.needsRegradeTotal || 0) : 0;
    let headline = !hub
      ? ""
      : hub.needsGradingTotal > 0
        ? `<span class="mini-chip batch-badge-needs hub-headline">${hub.needsGradingTotal} to grade${redoCount ? " · ↻ " + redoCount + " redo" + (redoCount === 1 ? "" : "s") : ""}</span>`

    return `<section class="card dash-card" id="gradingCard">
      <div class="dash-card-head">
        <div class="dash-card-title"><h3>Grading</h3>${headline}</div>
        <div class="dash-card-actions"><button class="btn dash-btn" id="refreshHub" title="Recount everything">↻ Refresh</button></div>
      </div>
      <p class="dash-card-sub">Open an assignment to grade it. A red number is work waiting on you; ↻ means a student redid something after you graded it.</p>
      <div id="gradingHubTiles" data-class="${esc(backend.activeClassId)}">${hubTilesHtml_()}</div>
    </section>`;

  // ---- Canvas: connect once, then push each Act straight into the gradebook ----
  function canvasSettings_() {
    // The dashboard's settings are the freshly-fetched copy. backend.classes
    // still carries whatever bootstrap loaded at sign-in, so reading that
    // first would leave a class looking unlinked right after you linked it.
    let fromDash = backend.dashboard && backend.dashboard.settings && backend.dashboard.settings.canvas;
    if (fromDash) return fromDash;
    let k = currentClass();
    return (k && parseSettings(k.settingsJson, null).canvas) || { courseId: "", assignments: {} };
  }
  function canvasLinked_() {
    return !!(backend.canvas && backend.canvas.connected && canvasSettings_().courseId);
  }
  // Due dates live beside the Canvas block, not inside it, because they are set
  // per class whether or not an assignment has been created yet.
  function canvasSchedule_() {
    let fromDash = backend.dashboard && backend.dashboard.settings && backend.dashboard.settings.assignmentSchedule;
    if (fromDash) return fromDash;
    let k = currentClass();
    return (k && parseSettings(k.settingsJson, null).assignmentSchedule) || {};
  }
  function canvasCard_() {
    let cs = canvasSettings_();
    let conn = backend.canvas || {};
    let body;
    if (!conn.checked) {
      body = `<p class="toolbar-note">Checking your Canvas connection…</p>`;
    } else if (!conn.connected) {
      body = `<p class="toolbar-note">Push scores and teacher comments from here into your Canvas gradebook. You'll need an access token from Canvas: <strong>Account → Settings → New Access Token</strong>. It is stored privately against your Google account, never in the class spreadsheet, and never shown to students.</p>
        <div class="field"><label>Canvas address</label><input id="canvasBaseUrl" placeholder="https://yourschool.instructure.com" value="${esc(conn.baseUrl || "")}"></div>
        <div class="field"><label>Access token</label><input id="canvasToken" type="password" placeholder="Paste the token from Canvas"></div>
        <button class="btn primary" id="canvasConnectBtn">Connect Canvas</button>`;
    } else if (conn.valid === false) {
      body = `<p class="toolbar-note" style="color:#8c1d17"><strong>Canvas rejected the saved token.</strong> ${esc(conn.message || "")} Reconnect with a fresh one.</p>
        <button class="btn" id="canvasDisconnectBtn">Disconnect and start again</button>`;
    } else {
      let who = conn.profile && conn.profile.name ? conn.profile.name : "your Canvas account";
      let courseLine = cs.courseId
        ? `<p class="toolbar-note">This class is linked to <strong>${esc(cs.courseName || cs.courseId)}</strong>${cs.assignmentGroupName ? ` · assignments go into <strong>${esc(cs.assignmentGroupName)}</strong>` : ""}. <button class="btn" id="canvasUnlinkBtn" style="font-size:12px;padding:4px 9px">Unlink</button></p>`
        : `<p class="toolbar-note">Connected as <strong>${esc(who)}</strong>. Now choose which Canvas course this class pushes to.</p>`;
      let picker = `<div class="integration-row"><div class="field"><label>Canvas course</label><select id="canvasCourseSelect"><option value="">${
          conn.courses ? "Choose a course…" : "Loading your courses…"
        }</option>${(conn.courses || []).map((c) => `<option value="${esc(c.id)}" ${c.id === cs.courseId ? "selected" : ""}>${esc(c.name)}${c.term ? " · " + esc(c.term) : ""}</option>`).join("")}</select></div>
        <div class="field"><label>Assignment group (optional)</label><select id="canvasGroupSelect"><option value="">Course default</option>${(conn.groups || []).map((g) => `<option value="${esc(g.id)}" ${g.id === cs.assignmentGroupId ? "selected" : ""}>${esc(g.name)}</option>`).join("")}</select></div>
        <div><button class="btn primary" id="canvasLinkBtn">${cs.courseId ? "Update link" : "Link this class"}</button></div></div>`;
      let links = cs.courseId && cs.assignments && Object.keys(cs.assignments).length
        ? `<p class="toolbar-note">Canvas assignments created so far: ${Object.keys(cs.assignments)
            .map((k) => cs.assignments[k])
            .sort((a, b) => a.act - b.act)
            .map((a) => `Act ${a.act}${a.lastGradeSyncAt ? " ✓" : ""}`)
            .join(" · ")}</p>`
        : "";
      body = courseLine + picker + links +
        `<p class="toolbar-note">${cs.courseId ? "Use <strong>↗ Push to Canvas</strong> on any assignment below to send scores and feedback. The assignment is created the first time and reused after that." : ""}</p>
         <button class="btn" id="canvasDisconnectBtn" style="font-size:12px;padding:4px 9px">Disconnect Canvas</button>`;
    }
    return body;
  }
  // A short status chip up with the class pills, so Canvas is reachable without
  // scrolling past the roster and the gradebook to find it.
  function canvasSwitcherButton_() {
    let conn = backend.canvas || {};
    let cs = canvasSettings_();
    let label, cls;
    if (!conn.checked) { label = "Canvas…"; cls = ""; }
    else if (!conn.connected) { label = "⚙ Set up Canvas"; cls = ""; }
    else if (conn.valid === false) { label = "⚠ Canvas needs attention"; cls = "canvas-chip-bad"; }
    else if (!cs.courseId) { label = "⚙ Link a Canvas course"; cls = "canvas-chip-warn"; }
    else { label = "✓ Canvas: " + (cs.courseName || cs.courseId); cls = "canvas-chip-good"; }
    return `<button class="btn canvas-switch-btn ${cls}" id="openCanvasSetup" title="Connect Canvas, and choose which course this class pushes grades to">${esc(label)}</button>`;
  }
  function openCanvasSetupModal() {
    let root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal"><div class="modalbox canvas-setup-box"><h3>Canvas</h3>${canvasCard_()}<div class="modal-actions"><button class="btn modal-dismiss" id="closeCanvasSetup">Close</button></div><p id="canvasMsg" class="toolbar-note"></p></div></div>`;
    document.getElementById("closeCanvasSetup").onclick = () => (root.innerHTML = "");
    bindBackend();
  }
  async function loadCanvasStatus(force) {
    if (backend.canvas && backend.canvas.checked && !force) return;
    try {
      let st = await rpc("getCanvasConnectionStatus");
      backend.canvas = Object.assign({ checked: true }, st);
      if (st.connected && st.valid !== false) {
        try {
          let list = await rpc("listCanvasCourses");
          backend.canvas.courses = list.courses || [];
          let cs = canvasSettings_();
          if (cs.courseId) {
            let g = await rpc("listCanvasAssignmentGroups", { courseId: cs.courseId });
            backend.canvas.groups = g.groups || [];
          }
        } catch (e) {
          backend.canvas.message = e.message;
        }
      }
    } catch (e) {
      // Not connected, or the scope was never authorised. Either way the card
      // should offer to connect rather than sit on "checking".
      backend.canvas = { checked: true, connected: false, message: e.message };
    }
    if (state.view === "manage") render();
  }
  function canvasMsg_(text, bad) {
    let el = document.getElementById("canvasMsg");
    if (el) { el.textContent = text; el.style.color = bad ? "#8c1d17" : ""; }
  }
  // datetime-local speaks local wall-clock time with no zone; Canvas speaks
  // ISO8601 with one. Convert at the boundary in both directions so a due date
  // set at 3pm here is 3pm to the students.
  function localInputFromIso_(iso) {
    if (!iso) return "";
    let d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }
  function isoFromLocalInput_(v) {
    if (!v) return "";
    let d = new Date(v);
    return Number.isNaN(d.getTime()) ? "" : d.toISOString();
  }
  // A date and a time, side by side, instead of one datetime-local box. With a
  // single datetime-local, picking a day from the calendar left the time blank
  // and the whole value empty -- so a date "set" that way was silently never
  // saved. Now the time is filled in for you (11:59 PM for due and lock dates,
  // 12:00 AM for "available from") and choosing the date is the only step.
  function canvasDateTimeFieldHtml_(id, label, iso, defaultTime, optional) {
    let local = localInputFromIso_(iso);
    let date = local ? local.slice(0, 10) : "";
    let time = local ? local.slice(11, 16) : defaultTime;
    return `<div class="field canvas-dt-field"><label for="${id}Date">${esc(label)}${optional ? " <small>(optional)</small>" : ""}</label>
      <div class="canvas-dt"><input type="date" id="${id}Date" value="${esc(date)}" aria-label="${esc(label)} (date)"><input type="time" id="${id}Time" value="${esc(time)}" step="60" aria-label="${esc(label)} (time)"></div></div>`;
  }
  function canvasDateTimeValue_(id, defaultTime) {
    let d = (document.getElementById(id + "Date") || {}).value || "";
    if (!d) return "";
    let t = (document.getElementById(id + "Time") || {}).value || defaultTime;
    return isoFromLocalInput_(d + "T" + t);
  }
  // Every Canvas assignment -- the five Acts and the six essay pieces -- is
  // addressed by one string: "act:2" or "essay:body". One code path, so a fix to
  // the Act flow cannot forget the essay flow.
  function asgPayload_(asg) {
    let str = String(asg);
    return str.indexOf("essay:") === 0 ? { kind: "essay", key: str.slice(6) } : { act: Number(str.replace("act:", "")) };
  }
  function asgLabel_(asg) {
    let str = String(asg);
    return str.indexOf("essay:") === 0 ? ESSAY_GRADE_LABELS[str.slice(6)] || str.slice(6) : "Act " + str.replace("act:", "");
  }
  function asgStatusId_(asg) { return "exportStatus-" + String(asg).replace(":", "-"); }
  // Tile status is written through a fresh lookup every time: a redraw while a
  // Push or CSV is running replaces the element, and a reference taken before
  // the wait would write the result somewhere no longer on the page.
  function setAsgStatus_(asg, text) {
    let el = document.getElementById(asgStatusId_(asg));
    if (el) el.textContent = text;
  }
  function setAsgBusy_(asg, busy) {
    backend.asgBusy = backend.asgBusy || {};
    if (busy) backend.asgBusy[asg] = true;
    else delete backend.asgBusy[asg];
    document.querySelectorAll(`.push-act-btn[data-asg="${asg}"],.export-act-btn[data-asg="${asg}"]`).forEach((b) => (b.disabled = !!busy));
  }

      <h3>${esc(setup.label)} in Canvas</h3>
      <div class="canvas-act-meta"><span class="mini-chip">${esc(setup.canvas.courseName || setup.canvas.courseId)}</span><span class="mini-chip">${setup.pointsPossible} points</span>${
        link.assignmentId ? `<span class="mini-chip batch-badge-graded">✓ Linked</span>` : `<span class="mini-chip">Not created yet</span>`

        (setup.sharedWith || []).length ? `<span class="mini-chip canvas-chip-warn">Shared with ${esc(setup.sharedWith.join(", "))}</span>` : ""
