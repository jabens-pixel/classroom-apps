              setup.canvasPointsPossible !== null && Number(setup.canvasPointsPossible) !== Number(setup.pointsPossible)
                ? ` <strong>Note:</strong> Canvas currently has it out of ${setup.canvasPointsPossible} points, but this class works out to ${setup.pointsPossible} — that happens when a question is excluded for one class and not the other.`
                : ""
            }</p>`
          : ""
      }
      <div class="canvas-date-grid">
        ${canvasDateTimeFieldHtml_("canvasDueAt", "Due date", sch.dueAt || link.dueAt || "", "23:59", false)}
        ${canvasDateTimeFieldHtml_("canvasUnlockAt", "Available from", sch.unlockAt || "", "00:00", true)}
        ${canvasDateTimeFieldHtml_("canvasLockAt", "Lock after", sch.lockAt || "", "23:59", true)}
      </div>
      ${
        !setup.appUrl
          ? `<p class="toolbar-note canvas-url-note">⚠ The app couldn't find its own web address, so the Canvas assignment won't link to it.</p>`
          : /\/dev($|\?)/.test(setup.appUrl)
            ? `<p class="toolbar-note canvas-url-note">⚠ Students would get the test link. Deploy a new version, then press Update in Canvas.</p>`

      <div class="canvas-pick-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px;margin:4px 0 10px">
        <div class="field" style="margin:0;min-width:0"><label>Assignment group</label><select id="canvasGroupPick" style="width:100%">${groupOptions}</select>${

  function canvasPushSummary_(res) {
    let parts = [`Sent ${res.sent} score(s) to “${res.assignment.name}”, out of ${res.pointsPossible} points.`];
    if (res.feedbackPosted) parts.push(`Shared ${res.feedbackPosted} new or revised teacher comment${res.feedbackPosted === 1 ? "" : "s"} with students in Canvas.`);
    if (res.feedbackSkipped) parts.push(`${res.feedbackSkipped} unchanged Canvas comment${res.feedbackSkipped === 1 ? " was" : "s were"} already up to date.`);
    if (res.feedbackFailed && res.feedbackFailed.length) parts.push(`⚠ Feedback could not be posted for: ${res.feedbackFailed.join(", ")}.`);
    if (res.excused) parts.push(`Excused in Canvas (left out of the grade here): ${(res.excusedNames || []).join(", ") || res.excused}.`);
    if (res.unexcused) parts.push(`${res.unexcused} student${res.unexcused === 1 ? "" : "s"} excused earlier now ha${res.unexcused === 1 ? "s" : "ve"} a score, so Canvas counts it again.`);
    if (res.skipped && res.skipped.length) parts.push(`Left alone (nothing done yet): ${res.skipped.join(", ")}.`);
    if (res.unmatched && res.unmatched.length)
      parts.push(`⚠ No matching Canvas student: ${res.unmatched.join(", ")} — check their Canvas login email.`);
    if (res.unmarked && res.unmarked.length)
      parts.push(`⚠ Counted as 0 because you haven't marked them yet — ${res.unmarked.join(", ")}.`);
    if (res.waiting && res.waiting.length)
      parts.push(`Not sent yet — turned in but not marked: ${res.waiting.join(", ")}. Mark them and push again.`);
    if (res.adjusted && res.adjusted.length) parts.push(`Scaled to keep the same percentage: ${res.adjusted.join("; ")}.`);
    if (res.pointsConflict) parts.push(`⚠ ${res.pointsConflict}`);
    return parts.join(" ");
  }

  // One button on the Gradebook card. The server pushes every released

  function gradebookPushSummary_(r) {
    let n = r.assignments.length;
    let parts = [`Sent ${r.totalSent} score${r.totalSent === 1 ? "" : "s"} across ${n} assignment${n === 1 ? "" : "s"}.`];
    if (r.totalExcused) parts.push(`${r.totalExcused} excluded score${r.totalExcused === 1 ? "" : "s"} excused in Canvas.`);
    if (r.totalUnexcused) parts.push(`${r.totalUnexcused} earlier excusal${r.totalUnexcused === 1 ? "" : "s"} lifted because the work is scored now.`);
    parts.push(r.totalFeedbackPosted ? `${r.totalFeedbackPosted} new or revised comment${r.totalFeedbackPosted === 1 ? "" : "s"} shared.` : "Comments already up to date.");
    if (r.waiting && r.waiting.length) parts.push(`Turned in but not marked, so not sent yet: ${r.waiting.join(", ")}.`);
    if (r.unmarked && r.unmarked.length) parts.push(`⚠ Has unmarked responses counted as 0: ${r.unmarked.join(", ")}.`);
    if (r.unmatched && r.unmatched.length) parts.push(`⚠ No matching Canvas student: ${r.unmatched.join(", ")} — check their Canvas login email.`);
    if (r.notInCanvas && r.notInCanvas.length) parts.push(`Not in Canvas yet (use ↗ Push on its tile once): ${r.notInCanvas.join(", ")}.`);
    if (r.hidden && r.hidden.length) parts.push(`Skipped, hidden from students: ${r.hidden.join(", ")}.`);
    if (r.classExcluded && r.classExcluded.length) parts.push(`Skipped, not graded for this class: ${r.classExcluded.join(", ")}.`);
    (r.assignments || []).forEach((a) => { if (a.pointsConflict) parts.push(`⚠ ${a.label}: ${a.pointsConflict}`); });

    if (r.notReached && r.notReached.length) parts.push(`⚠ Ran out of time before: ${r.notReached.join(", ")}. Press Push all again to finish.`);

  // ---- One gradebook -------------------------------------------------------
  // Everything the unit is worth in a single table: the five Acts, the six
  // pieces of the essay, and a unit total. There used to be two tables with
  // three Canvas buttons stacked in every column heading, which made the
  // headings taller than the data. Those buttons live on the tiles above now,
  // where the rest of each assignment's controls already are, so this is just
  // numbers -- which is what a gradebook is for.
  function gradebookCard(dash) {
    let actCols = [1, 2, 3, 4, 5]
      .map((act) => `<th class="gb-act" title="Act ${act}: multiple choice + written responses">Act ${act}</th>`)
      .join("");
    let essayCols = ESSAY_GRADE_STEPS.map((k) => {
      let pts = k === "final" ? ESSAY_CRITERIA.length * ESSAY_CRITERION_MAX : k === "thesis" ? 1 : DOK_POINTS;
      return `<th class="gb-essay" title="${esc(ESSAY_GRADE_LABELS[k])} · ${k === "thesis" ? "complete / incomplete" : pts + " points"}">${esc(ESSAY_GRADE_SHORT[k] || ESSAY_GRADE_LABELS[k])}</th>`;
    }).join("");

    let rows = dash.students
      .map((s) => {
        let gs = s.gradeSummary || { acts: {} };
        let unitEarned = 0, unitPossible = 0, anyStarted = false;
        let actCells = [1, 2, 3, 4, 5]
          .map((act) => {
            let a = gs.acts[act];
            // "—" means the student has not touched this Act at all (and exports
            // blank). A number is always out of the full Act total; a dot after
            // it means some of it is still waiting on you.
            let started = a && a.possible && a.touched;
            // The Unit column counts what the student has STARTED, not the whole
            // unit. Including an Act nobody has opened yet would read as a
            // failing grade in week one -- the same misleading-denominator
            // problem as the Act totals, pointing the other way. Inside each Act
            // the rule is unchanged: work they skipped still counts as zero.
            if (started) { unitPossible += a.possible; unitEarned += a.earned; anyStarted = true; }
            let pending = started && a.dokUnmarked ? `<span class="cell-pending" title="${a.dokUnmarked} written response(s) not marked yet, counted as 0 so far">•</span>` : "";
            let tip = started
              ? `${esc(s.name)} · Act ${act}: ${a.earned} of ${a.possible}${a.dokUnmarked ? ` · ${a.dokUnmarked} not marked yet` : ""}${a.dokMissing ? ` · ${a.dokMissing} not submitted` : ""}`
              : `${esc(s.name)} has not started Act ${act}`;
            return `<td class="gb-act"><button type="button" class="gradebook-cell gradebookJump ${started ? "" : "ungraded"}" data-email="${esc(s.email)}" data-act="${act}" title="${tip}">${started ? a.earned + "/" + a.possible + pending : "—"}</button></td>`;
          })
          .join("");

        let e = gs.essay;
        let essayCells = ESSAY_GRADE_STEPS.map((k) => {
          if (!e) return `<td class="gb-essay"><button type="button" class="gradebook-cell ungraded" disabled>—</button></td>`;
          if (k === "final") {
            let t = e.finalTotal || { earned: 0, possible: 0, hasAnyResult: false };
            if (ESSAY_CRITERIA.every((c) => ((e.criteria || {})[c] || {}).excluded))
              return `<td class="gb-essay"><button type="button" class="gradebook-cell ungraded" disabled title="${esc(s.name)} is excused from the final essay">ex</button></td>`;
            if (t.hasAnyResult || t.submitted) {
              unitPossible += Number(t.possible || 0);
              unitEarned += Number(t.earned || 0);
              anyStarted = true;
            }
            let tip = t.hasAnyResult
              ? `${esc(s.name)} · Final Essay: ${t.earned} of ${t.possible}${t.teacherGradedDraft ? " · teacher graded before student submission" : ""}${t.unmarked ? ` · ${t.unmarked} criteria not scored yet` : ""}`
              : t.submitted
                ? `${esc(s.name)} has assembled an essay but none of it is scored yet`
                : `${esc(s.name)} has not assembled an essay yet`;
            return `<td class="gb-essay"><button type="button" class="gradebook-cell essayJump ${t.hasAnyResult ? "" : "ungraded"}" data-email="${esc(s.email)}" data-step="final" title="${tip}">${t.hasAnyResult ? t.earned + "/" + t.possible : t.submitted ? '<span class="cell-pending gb-dot">•</span>' : "—"}</button></td>`;
          }
          let rec = (e.steps || {})[k] || {};
          if (!rec.excluded && (hasScore_(rec.score) || rec.submitted)) {
            unitPossible += Number(rec.possible || 0);
            if (hasScore_(rec.score)) unitEarned += Number(rec.score);
            anyStarted = true;
          }
          let val = rec.excluded
            ? "ex"
            : hasScore_(rec.score)
              ? k === "thesis"
                ? Number(rec.score) > 0
                  ? "✓"
                  : "✗"
                : rec.score + "/" + rec.possible
              : rec.submitted
                ? '<span class="cell-pending gb-dot">•</span>'
                : "—";
          let tip = rec.excluded
            ? `${esc(s.name)} is excused from ${esc(ESSAY_GRADE_LABELS[k])}`
            : hasScore_(rec.score)
              ? `${esc(s.name)} · ${esc(ESSAY_GRADE_LABELS[k])}: ${rec.score} of ${rec.possible}${rec.teacherGradedDraft ? " · teacher graded before student submission" : ""}${rec.auto ? " (marked complete automatically)" : ""}`
              : rec.submitted
                ? `${esc(s.name)} has done this but it is not marked yet`
                : `${esc(s.name)} has not done this yet`;
          return `<td class="gb-essay"><button type="button" class="gradebook-cell essayJump ${hasScore_(rec.score) ? "" : "ungraded"}" data-email="${esc(s.email)}" data-step="${k}" title="${tip}">${val}</button></td>`;
        }).join("");

        // The unit total counts what has actually been marked so far. It is a
        // running figure, not a final grade, and says so in its tooltip --
        // unmarked work sits in it as a zero exactly as it would in Canvas.
        let pct = unitPossible ? Math.round((unitEarned / unitPossible) * 100) : 0;
        let totalCell = anyStarted
          ? `<td class="gb-total"><span title="${esc(s.name)}: ${Math.round(unitEarned * 100) / 100} of ${unitPossible} across the work they have started. Assignments nobody has opened yet are left out; work you have not marked yet counts as 0, the same as it would in Canvas.">${Math.round(unitEarned * 100) / 100}/${unitPossible}<small>${pct}%</small></span></td>`
          : `<td class="gb-total"><span class="ungraded" title="${esc(s.name)} has not started anything yet">—</span></td>`;
        return `<tr><td class="gb-name"><strong>${esc(s.name)}</strong></td>${actCells}${essayCells}${totalCell}</tr>`;
      })
      .join("");

    return `<section class="card dash-card" id="gradebookCard"><div class="dash-card-head"><div class="dash-card-title"><h3>Gradebook</h3><span class="mini-chip">${dash.students.length} students · 11 assignments</span></div><div class="dash-card-actions"><button type="button" class="btn" id="pushCanvasGradebookBtn" title="Send scores, excused work and new comments for every released assignment that is already in Canvas"${backend.gradebookPushBusy ? " disabled" : ""}>↗ Push all to Canvas</button></div></div><p class="dash-card-sub gradebook-push-status" id="canvasGradebookStatus" aria-live="polite"${backend.gradebookPushStatus ? "" : " hidden"}>${esc(backend.gradebookPushStatus || "")}</p><p class="dash-card-sub"><strong>✓</strong> complete · <strong>•</strong> done but not graded yet · <strong>—</strong> not done · <strong>ex</strong> excused. Click any cell to open that student's work. <strong>Unit</strong> totals only the work each student has started, so it does not read as a fail in week one. Due dates, Canvas and CSV are in each tile's ⋯ menu; <strong>↗ Push all to Canvas</strong> sends every released assignment that is already in Canvas.</p><div class="gradebook-scroll"><table class="gradebook-table gradebook-wide"><thead><tr><th class="gb-name">Student</th>${actCols}${essayCols}<th class="gb-total">Unit</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  async function loadDashboard(classId, rerender = true) {
    backend.activeClassId = classId;
    safeLSSet("macbethActiveClass", classId);
    let cached = backend.dashboardCache[classId];
    backend.gradingHub = backend.gradingHubCache[classId] || null;
    if (cached) {
      backend.dashboard = cached;
      applyDashboardState_(cached);
      if (rerender) render();
      loadGradingHub(classId);
    } else {
      backend.dashboard = null;
      if (rerender) render();
    }
    try {
      let fresh = await rpc("getClassDashboard", { classId });
      (fresh.students || []).forEach((st) => normalizeGradeSummary_(st.gradeSummary));
      backend.dashboardCache[classId] = fresh;
      if (backend.activeClassId !== classId) return; // switched again before this resolved
      backend.dashboard = fresh;
      applyDashboardState_(fresh);
      if (rerender) render();
      loadGradingHub(classId);
    } catch (e) {
      console.error(e);
      if (!cached && rerender) {
        let app = document.getElementById("app");
        if (app)
          app.insertAdjacentHTML(
            "beforeend",
            `<p class="toolbar-note">Could not load this class right now: ${esc(e.message || String(e))}</p>`,
          );
      }
    }
  }

  essayDiscussionReplied_ = function () {
    const me = String((backend.user || {}).email || '').toLowerCase();
    return (backend.discussion || []).some((p) => (p.replies || []).some((r) => String(r.email || '').toLowerCase() === me));
  };
  function ownThesisPost_() {
    const me = String((backend.user || {}).email || '').toLowerCase();
    return (backend.discussion || []).find((p) => String(p.email || '').toLowerCase() === me) || null;
  }

  function discussionPostHtml_(p) {
    const mine = String(p.email || '').toLowerCase() === String((backend.user || {}).email || '').toLowerCase();
    const replies = Array.isArray(p.replies) ? p.replies : [];
    const replyHtml = replies.length
      ? `<div class="discussion-replies">${replies.map((r) => `<div class="discussion-reply"><strong>${esc(r.name || "Student")}</strong>${String(r.email || '').toLowerCase() === String((backend.user || {}).email || '').toLowerCase() ? ' <span class="discussion-you">You</span>' : ''}<p>${esc(r.text)}</p><small>${esc(new Date(r.date).toLocaleString())}</small></div>`).join("")}</div>`
      : "";
    const replyControl = mine
      ? `<span class="discussion-you">Your thesis</span>`
      : `<button type="button" class="btn thesisReplyToggle">Reply</button>`;
    const composer = mine
      ? ""
      : `<div class="thesis-reply-compose hide"><textarea class="thesisReplyText" maxlength="3000" placeholder="Respond to ${esc(p.name || "your classmate")}’s thesis. Be specific: what is clear, arguable, or worth reconsidering?"></textarea><div class="thesis-reply-compose-actions"><button type="button" class="btn thesisReplyCancel">Cancel</button><button type="button" class="btn primary thesisReplySubmit" data-postid="${esc(p.id)}">Post Reply</button></div></div>`;
    const stamp = p.updatedAt && String(p.updatedAt) !== String(p.date)
      ? `Updated ${esc(new Date(p.updatedAt).toLocaleString())}`
      : `Posted ${esc(new Date(p.date).toLocaleString())}`;
    return `<div class="discussion-post" data-discussion-post="${esc(p.id)}"><div class="discussion-post-head"><div><strong>${esc(p.name || "Student")}</strong>${mine ? ' <span class="discussion-you">You</span>' : ''}</div><small>${stamp}</small></div><p>${esc(p.text)}</p>${replyHtml}<div class="discussion-post-actions">${replyControl}</div>${composer}</div>`;
  }

  discussion = function () {
    if (!backend.enabled || backend.user.role !== "student" || !backend.activeClassId)
      return original.discussion();
    const ownPost = ownThesisPost_();
    const currentThesis = String(state.essay.thesis || '').trim();
    const alreadyCurrent = !!ownPost && String(ownPost.text || '').trim() === currentThesis;
    const buttonLabel = ownPost
      ? (alreadyCurrent ? "Thesis Is Up to Date ✓" : "Update Thesis in Discussion")
      : "Post Thesis to Class Discussion";
    const buttonDisabled = !currentThesis || alreadyCurrent;
    const note = ownPost
      ? (alreadyCurrent
          ? "Your discussion post matches your current thesis. If you revise the thesis in Step 1, return here to update this same post. Classmates’ replies will stay attached."
          : "You revised your thesis. Update the existing discussion post rather than creating a new one; classmates’ replies will stay attached.")
      : `Posts and replies are shared with students in ${esc(state.className || "your class")} and saved to your school account.`;
    return `<div class="card"><h3>Step 2 · Thesis Discussion</h3><p>Post your thesis for classmates to read, then reply to classmates with useful feedback. Ask: Is the claim arguable? Is it specific? Does it explain <em>why</em> this theme is central?</p><div class="thesis-preview">${currentThesis ? esc(currentThesis) : "Complete your thesis first."}</div><button class="btn primary" id="postThesis" ${buttonDisabled ? "disabled" : ""}>${buttonLabel}</button><p class="remote-discussion-note">${note}</p>${backend.discussion.length ? backend.discussion.map(discussionPostHtml_).join("") : "<p>No thesis has been posted yet.</p>"}</div>`;
  };

  function backendBanner() {

  render = function () {
    if (
      backend.enabled &&
      backend.ready &&
      backend.user &&
      backend.user.role === "student" &&
      !backend.activeClassId
    ) {
      document.getElementById("sidebar").innerHTML = "";
      document.getElementById("app").innerHTML = studentJoinView();
      let j = document.getElementById("joinClassBtn");
      if (j) j.onclick = joinCurrent;
      setAccountHeader();
      return;
    }
    if (
      backend.enabled &&
      backend.ready &&
      backend.user &&
      backend.user.role === "student" &&
      backend.needsName
    ) {
      document.getElementById("sidebar").innerHTML = "";
      document.getElementById("app").innerHTML = confirmNameView();
      let c = document.getElementById("confirmNameBtn");
      if (c) c.onclick = confirmNameCurrent;
      setAccountHeader();
      return;
    }
    // A Push or CSV result in a tile survives a redraw of the same class's
    // dashboard (flipping a switch redraws the page); it never follows the
    // teacher to a different class, where the same tile ids mean other work.
    let tileNotes = {};
    let oldMount = document.getElementById("gradingHubTiles");
    let notesClass = oldMount ? oldMount.dataset.class : "";
    if (oldMount && state.view === "manage")
      oldMount.querySelectorAll(".hub-tile-msg").forEach((m) => { if (m.textContent.trim()) tileNotes[m.id] = m.textContent; });
    original.render();
    if (state.view === "manage" && notesClass && notesClass === backend.activeClassId)
      Object.keys(tileNotes).forEach((id) => { let m = document.getElementById(id); if (m) m.textContent = tileNotes[id]; });
    if (backend.enabled && backend.ready) {
      state.role = backend.user.role;
      setAccountHeader();
      if (backend.user.role === "student" && backend.activeClassId) {
        let app = document.getElementById("app");
        app.insertAdjacentHTML("afterbegin", backendBanner());
      }
      bindBackend();
      // The account pill and the banner are both rebuilt by the redraw above,
      // so the save state has to be painted back onto them afterwards.
      paintSaveState_();
      // However the teacher gets back to the dashboard -- the Back to Dashboard
      // button, the browser's Back, or the sidebar -- numbers that grading made
      // stale are refetched. Only the button used to do this, so the other two
      // routes showed a count that had not come down yet.
      // It waits for any score still crossing to the server first, as the
      // button does, so the recount cannot read the sheet a beat too early.
      if (backend.user.role !== "student" && state.view === "manage" && backend.activeClassId) {
        let id = backend.activeClassId;
        let hubStale = !backend.gradingHubCache[id];
        let dashStale = !!backend.dashboard && !backend.dashboardCache[id];
        if (hubStale || dashStale)
          waitForTeacherSaves_().then(() => {
            if (hubStale) loadGradingHub(id, true);
            if (dashStale) refreshDashboardQuietly_(id);
          });
      }
    }
  };
  function refreshDashboardQuietly_(classId) {
    backend.dashQuietPending = backend.dashQuietPending || {};
    if (backend.dashQuietPending[classId]) return;
    backend.dashQuietPending[classId] = true;
    let startedAt = Date.now();
    rpc("getClassDashboard", { classId: classId })
      .then((fresh) => {
        (fresh.students || []).forEach((st) => normalizeGradeSummary_(st.gradeSummary));
        backend.dashboardCache[classId] = fresh;
        if (backend.activeClassId !== classId) return;
        // A release switch flipped while this was in flight is newer than the
        // settings it brought back: keep the teacher's version of those.
        // Only an edit made to THIS class counts; one made to another class
        // while this was in flight must never be carried across to it.
        let editedHere = backend.settingsEditedFor === classId;
        let edited = editedHere && ((backend.settingsEditedAt || 0) >= startedAt ||
          (backend.settingsSavedFor === classId && (backend.settingsSavedAt || 0) >= startedAt) ||
          backend.saveDirty || backend.saveInFlight || !!backend.saveTimer);
        let keep = edited
          ? { releasedActs: state.releasedActs, releasedScenes: state.releasedScenes, releasedEssayThrough: state.releasedEssayThrough, releasedEssayStages: state.releasedEssayStages, teacherResources: state.teacherResources }
          : null;
        backend.dashboard = fresh;
        applyDashboardState_(fresh);
        if (keep) Object.assign(state, keep);
        if (state.view === "manage") renderKeepScroll_();
      })
      .catch((e) => console.error(e))
      .finally(() => { delete backend.dashQuietPending[classId]; });
  }

  bind = function () {
    original.bind();
    bindLessonLinkItem_();
    if (!backend.enabled || !backend.ready) return;
    document.querySelectorAll("[data-role]").forEach((b) => (b.onclick = null));

    // In the Writing Workshop, autosave keeps drafts safe while these buttons
    // give students an explicit, confirmed hand-in. "Submit" is only recorded
    // after the current state is confirmed in the backend.
    const saveDraftBtn = document.getElementById("essaySaveDraftBtn");
    if (saveDraftBtn && backend.user.role === "student" && backend.activeClassId)
      saveDraftBtn.onclick = async () => {
        const old = saveDraftBtn.textContent;
        saveDraftBtn.disabled = true;
        saveDraftBtn.textContent = "Saving…";
        try {
          await forceStudentSaveNow_();
          const status = document.getElementById("essaySubmitStatus");
          if (status) status.textContent = "✓ Draft saved to your account. It is not submitted for grading until you press Submit.";
        } catch (e) {
          alert(e.message || String(e));
        } finally {
          const b = document.getElementById("essaySaveDraftBtn");
          if (b) { b.disabled = false; b.textContent = old; }
        }
      };

    const submitStageBtn = document.getElementById("essaySubmitStageBtn");
    if (submitStageBtn && backend.user.role === "student" && backend.activeClassId)
      submitStageBtn.onclick = async () => {
        const id = state.essay.step || "thesis";
        if (!essayStageReady_(id)) return alert(ESSAY_INCOMPLETE_NOTE[id] || "Finish this stage before submitting it.");
        const key = essaySubmissionKey_(id);
        const prior = state.essay.submissions && state.essay.submissions[key]
          ? JSON.parse(JSON.stringify(state.essay.submissions[key]))
          : null;
        submitStageBtn.disabled = true;
        submitStageBtn.textContent = "Submitting…";
        markEssayStageSubmitted_(id);
        save();
        try {
          await forceStudentSaveNow_();
          render();
        } catch (e) {
          // Do not leave a local "submitted" badge when the server could not
          // confirm it. The draft remains safe and can be submitted again.
          state.essay.submissions = state.essay.submissions || {};
          if (prior) state.essay.submissions[key] = prior;
          else delete state.essay.submissions[key];
          safeLSSet(localKey(), JSON.stringify(state));
          syncEssayStageActionUI_();
          alert(e.message || String(e));
        }
      };

    const refreshEssayWork = document.getElementById("refreshEssayWork");
    if (refreshEssayWork && backend.user.role === "student" && backend.activeClassId)
      refreshEssayWork.onclick = async () => {
        refreshEssayWork.disabled = true;
        refreshEssayWork.textContent = "Refreshing…";
        try {
          // Save what is on screen first so Refresh can never erase a sentence
          // the student just typed, then pull the authoritative account copy.
          await forceStudentSaveNow_();
          const r = await rpc("getStudentStateRefresh", { classId: backend.activeClassId });
          backend.serverUpdatedAt = r.stateUpdatedAt || backend.serverUpdatedAt || "";
          backend.discussion = r.discussion || [];
          state = normalizeState(r.state || {}, r.classSettings || null);
          const klass = currentClass();
          if (klass) state.className = klass.className;
          syncOwnDiscussion_();
          safeLSSet(localKey(), JSON.stringify(state));
          render();
        } catch (e) {
          alert("Could not refresh the saved writing: " + (e.message || String(e)));
          const b = document.getElementById("refreshEssayWork");
          if (b) { b.disabled = false; b.textContent = "↻ Refresh Saved Work"; }
        }
      };
    const post = document.getElementById("postThesis");
    if (post && backend.user.role === "student" && backend.activeClassId)
      post.onclick = async () => {
        let text = state.essay.thesis.trim();
        if (!text) return;
        const wasUpdate = !!ownThesisPost_();
        const restoreLabel = wasUpdate ? "Update Thesis in Discussion" : "Post Thesis to Class Discussion";
        post.disabled = true;
        post.textContent = wasUpdate ? "Updating..." : "Posting...";
        const y = window.scrollY;
        try {
          let r = await rpc("postThesisDiscussion", { classId: backend.activeClassId, text });
          backend.discussion = r.discussion || [];
          syncOwnDiscussion_();
          save();
          render();
          requestAnimationFrame(() => window.scrollTo(0, y));
        } catch (e) {
          alert(e.message);
          post.disabled = false;
          post.textContent = restoreLabel;
        }
      };
    document.querySelectorAll(".thesisReplyToggle").forEach((btn) => {
      btn.onclick = () => {
        const postCard = btn.closest(".discussion-post");
        const form = postCard && postCard.querySelector(".thesis-reply-compose");
        if (!form) return;
        form.classList.remove("hide");
        btn.style.display = "none";
        const ta = form.querySelector(".thesisReplyText");
        if (ta) ta.focus();
      };
    });
    document.querySelectorAll(".thesisReplyCancel").forEach((btn) => {
      btn.onclick = () => {
        const postCard = btn.closest(".discussion-post");
        const form = btn.closest(".thesis-reply-compose");
        const toggle = postCard && postCard.querySelector(".thesisReplyToggle");
        if (form) form.classList.add("hide");
        if (toggle) toggle.style.display = "";
      };
    });
    document.querySelectorAll(".thesisReplySubmit").forEach((btn) => {
      btn.onclick = async () => {
        const form = btn.closest(".thesis-reply-compose");
        const ta = form && form.querySelector(".thesisReplyText");
        const text = ta ? ta.value.trim() : "";
        if (!text) { if (ta) ta.focus(); return; }
        const y = window.scrollY;
        btn.disabled = true;
        btn.textContent = "Posting...";
        try {
          const r = await rpc("postThesisReply", { classId: backend.activeClassId, postId: btn.dataset.postid, text });
          backend.discussion = r.discussion || [];
          syncOwnDiscussion_();
          render();
          requestAnimationFrame(() => window.scrollTo(0, y));
        } catch (e) {
          alert(e.message);
          btn.disabled = false;
          btn.textContent = "Post Reply";
        }
      };
    });
  };
  function bindBackend() {
    let join = document.getElementById("joinClassBtn");
    if (join) join.onclick = joinCurrent;
    let cname = document.getElementById("confirmNameBtn");
    if (cname) cname.onclick = confirmNameCurrent;
    let create = document.getElementById("createClassBtn");
    if (create) create.onclick = createNewClass;
    document
      .querySelectorAll(".class-pill")
      .forEach((b) => (b.onclick = () => loadDashboard(b.dataset.classid)));
    document
      .querySelectorAll(".classEditBtn")
      .forEach((b) => (b.onclick = () => openEditClass(b.dataset.classid)));
    document.querySelectorAll(".classDeleteBtn").forEach((b) => {
      b.onclick = () => {
        if (b.dataset.armed === "1") confirmDeleteClass(b, b.dataset.classid);
        else armDeleteButton(b);
      };
    });
    let toggleNew = document.getElementById("toggleNewClass");
    if (toggleNew)
      toggleNew.onclick = () => {
        let p = document.getElementById("newClassPanel");
        if (p) p.classList.toggle("hide");
      };
    let ref = document.getElementById("refreshRoster");
    if (ref) ref.onclick = () => loadDashboard(backend.activeClassId);
    if (state.view === "manage" && backend.user && backend.user.role !== "student") setTimeout(() => loadCanvasStatus(false), 0);
    let openBatch = document.getElementById("openBatchGrade");
    if (openBatch)
      openBatch.onclick = () => {
        state.view = "batchGrade";
        if (!backend.batchSceneKey) backend.batchSceneKey = Object.keys(SCENES).sort(sceneSort)[0];
        render();
        loadSceneResponses(backend.batchSceneKey);
      };
    let backToDash = document.getElementById("backToDashboard");
    if (backToDash)
      backToDash.onclick = async () => {
        backToDash.disabled = true;
        backToDash.textContent = "Saving…";
        // A score/comment click can still be crossing the Apps Script bridge when
        // the teacher immediately goes back. Wait for those writes, then fetch a
        // fresh grading summary so a regraded redo disappears from its tile now.
        await waitForTeacherSaves_();
        invalidateDashboardCache_();
        await loadGradingHub(backend.activeClassId, true);
        state.view = "manage";
        await loadDashboard(backend.activeClassId, true);
      };
    let sceneSelect = document.getElementById("batchSceneSelect");
    if (sceneSelect) sceneSelect.onchange = () => loadSceneResponses(sceneSelect.value);
    let excludeAll = document.getElementById("excludeAllBtn");
    if (excludeAll) excludeAll.onclick = toggleExcludeWholeClass_;
    let hideUn = document.getElementById("hideUnsubmitted");
    if (hideUn)
      hideUn.onchange = () => {
        backend.batchHideUnsubmitted = hideUn.checked;
        refreshBatchView_();
      };
    // Same preference, on the essay screen: hiding non-submitters on one
    // marking screen hides them on the other too.
    let hideUnEssay = document.getElementById("hideUnsubmittedEssay");
    if (hideUnEssay)
      hideUnEssay.onchange = () => {
        backend.batchHideUnsubmitted = hideUnEssay.checked;
        refreshEssayView_();
      };
    let refreshBatch = document.getElementById("refreshBatchResponses");
    if (refreshBatch)
      refreshBatch.onclick = async () => {
        refreshBatch.disabled = true;
        refreshBatch.textContent = "Refreshing…";
        try {
          await waitForTeacherSaves_();
          await loadSceneResponses(backend.batchSceneKey, true);
          await loadGradingHub(backend.activeClassId, true);
        } finally {
          let b = document.getElementById("refreshBatchResponses");
          if (b) { b.disabled = false; b.textContent = "↻ Refresh"; }
        }
      };
    document.querySelectorAll(".score-btn[data-email]").forEach((btn) => {
      btn.onclick = () => {
        let email = btn.dataset.email;
        let score = Number(btn.dataset.score);
        let newScore = btn.classList.contains("selected") ? null : score;
        applyBatchLocalUpdate_(email, { score: newScore });
        updateBatchRowUI_(email);
        saveBatchGradeItem_(email, { score: newScore, excluded: (getBatchResponse_(email) || {}).excluded });
      };
    });
    document.querySelectorAll(".batchExcludeToggle").forEach((cb) => {
      cb.onchange = () => {
        let email = cb.dataset.email;
        applyBatchLocalUpdate_(email, { excluded: cb.checked });
        updateBatchRowUI_(email);
        saveBatchGradeItem_(email, { excluded: cb.checked, score: (getBatchResponse_(email) || {}).score });
      };
    });
    document.querySelectorAll(".dokManualScore[data-email]").forEach((input) => {
      input.onchange = () => {
        let email = input.dataset.email;
        let score = teacherScoreValue_(input);
        if (score === undefined) return; // out of range; the box keeps focus
        applyBatchLocalUpdate_(email, { score: score, excluded: false });
        updateBatchRowUI_(email);
        saveBatchGradeItem_(email, { score: score, excluded: false });
      };
    });
    document.querySelectorAll(".keepMarkBtn").forEach((btn) => {
      btn.onclick = () => {
        let email = btn.dataset.email;
        let r = getBatchResponse_(email);
        if (!r || !hasScore_(r.score)) return;
        // Re-saving the same score refreshes the snapshot the flag compares
        // against, so this says "I've read the new version and it still stands".
        saveBatchGradeItem_(email, { score: r.score, excluded: r.excluded, comment: r.comment || "" });
        updateBatchRowUI_(email);
      };
    });
    document.querySelectorAll(".batchComment").forEach((ta) => {
      ta.onblur = () => {
        let email = ta.dataset.email;
        let r = getBatchResponse_(email);
        if (!r) return;
        r.comment = ta.value;
        saveBatchGradeItem_(email, { score: r.score, excluded: r.excluded, comment: ta.value });
      };
    });
    // ---- the grading tiles ----
    let refreshHub = document.getElementById("refreshHub");
    if (refreshHub)
      refreshHub.onclick = () => {
        refreshHub.disabled = true;
        // The hub summary was already forced fresh, but essay response pages
        // kept their own cache. Clear it here so opening a writing stage after
        // Refresh always asks the backend for the latest saved/submitted work.
        backend.essayResponseCache = {};
        loadGradingHub(backend.activeClassId, true).finally(() => {
          let b = document.getElementById("refreshHub");
          if (b) b.disabled = false;
        });
      };
    // The tile's top half and its Grade button open the marking screen. The
    // footer does not -- flipping the release switch, pressing Push, or using
    // the ⋯ menu must never also throw you onto another page. The tile itself
    // is not focusable; its Grade button is a real <button>, so keyboard users
    // get Enter and Space from the browser rather than from a keydown handler
    // that used to fire for every key pressed on the controls inside it.
    document.querySelectorAll("[data-hubopen]").forEach((tile) => {
      const open = () => {
        if (tile.dataset.hubopen === "act") {
          let scene = tile.dataset.scene || Object.keys(SCENES).sort(sceneSort)[0];
          state.view = "batchGrade";
          backend.batchSceneKey = scene;
          render();
          // Show what is cached at once, then fetch the latest: the tile's
          // count is recounted every minute, so the list it opens must be too.
          loadSceneResponses(scene, true);
        } else {
          state.view = "essayGrade";
          backend.essayStepKey = tile.dataset.key;
          render();
          loadEssayResponses(tile.dataset.key, true);
        }
      };
      tile.onclick = (ev) => {

    document.querySelectorAll(".hub-more").forEach((d) => {

      cb.onchange = () => {

      .querySelectorAll(".gradebookJump")
      .forEach((b) => (b.onclick = () => openStudentWork(b.dataset.email, Number(b.dataset.act))));

    let cCourse = document.getElementById("canvasCourseSelect");

          backend.canvas.groups = g.groups || [];
          let sel = document.getElementById("canvasGroupSelect");
          if (sel)
            sel.innerHTML = `<option value="">Course default</option>` +
              backend.canvas.groups.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
          canvasMsg_("");
        } catch (e) {
          canvasMsg_(e.message, true);

      };
    let cLink = document.getElementById("canvasLinkBtn");
    if (cLink)
      cLink.onclick = async () => {
        let courseId = (document.getElementById("canvasCourseSelect") || {}).value || "";
        if (!courseId) return canvasMsg_("Choose a Canvas course first.", true);
        cLink.disabled = true;
        canvasMsg_("Linking…");

            classId: backend.activeClassId,

          await loadDashboard(backend.activeClassId);

          cLink.disabled = false;

    let cUnlink = document.getElementById("canvasUnlinkBtn");
    if (cUnlink)
      cUnlink.onclick = async () => {
        try {
          await rpc("unlinkCanvasCourse", { classId: backend.activeClassId });
          invalidateDashboardCache_();
          await loadDashboard(backend.activeClassId);
          openCanvasSetupModal();
        } catch (e) {

    document
      .querySelectorAll(".export-act-btn")

  async function openStudentWork(email, jumpToAct) {
    document.getElementById("modalRoot").innerHTML =
      '<div class="modal"><div class="modalbox"><h3>Loading student work...</h3></div></div>';
    try {
      let r = await rpc("getStudentWork", { classId: backend.activeClassId, studentEmail: email });
      normalizeGradeSummary_(r.gradeSummary);
      backend.studentDetail = r;
      renderStudentModal(r);
      if (jumpToAct) {
        let block = document.getElementById("actBlock" + jumpToAct);
        if (block) {
          block.scrollIntoView({ behavior: "smooth", block: "start" });
          block.classList.add("jump-highlight");
          setTimeout(() => block.classList.remove("jump-highlight"), 1600);
        }
      }
    } catch (e) {
      document.getElementById("modalRoot").innerHTML =
        `<div class="modal"><div class="modalbox"><h3>Could not load work</h3><p>${esc(e.message)}</p><button class="btn modal-dismiss" id="closeStudent">Close</button></div></div>`;
      document.getElementById("closeStudent").onclick = () =>
        (document.getElementById("modalRoot").innerHTML = "");
    }
  }
  function activityHasContent(v) {
    if (v == null) return false;
    if (typeof v === "string") return v.trim().length > 0;
    if (typeof v === "object") {
      if (Array.isArray(v.table) && v.table.some((row) => Array.isArray(row) && row.some((c) => String(c || "").trim())))
        return true;
      if (Array.isArray(v.fields) && v.fields.some((f) => String(f || "").trim())) return true;
      if (v.reflection && String(v.reflection).trim()) return true;
      return false;
    }
    return false;
  }
  function formatActivityResponseHtml(title, v) {
    if (typeof v === "string") return `<p>${esc(v)}</p>`;
    let detail = (typeof ACTIVITY_DETAILS !== "undefined" && ACTIVITY_DETAILS[title]) || {};
    let h = "";
    if (Array.isArray(v.table) && v.table.length) {
      let cols = detail.table || [];
      h += `<div style="overflow:auto"><table class="rubric"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${v.table.map((row) => `<tr>${row.map((c) => `<td>${esc(c || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if (Array.isArray(v.fields) && v.fields.length) {
      let labels = detail.fields || [];
      h += v.fields
        .map((val, i) =>
          val && String(val).trim()
            ? `<p><strong>${esc((labels[i] && labels[i].label) || "Field " + (i + 1))}:</strong> ${esc(val)}</p>`
            : "",
        )
        .join("");
    }
    if (v.reflection && String(v.reflection).trim())
      h += `<p><strong>${esc(detail.reflection || "Reflection")}:</strong> ${esc(v.reflection)}</p>`;
    return h || '<p class="toolbar-note">No response submitted.</p>';
  }
  function scoreButtonRow(key, dok, email) {
    let emailAttr = email ? ` data-email="${esc(email)}"` : "";
    let attrs = `data-key="${esc(key)}"${emailAttr}`;
    return (
      rubricLevelRow_(dok.score, "score-btn", attrs) +
      teacherScoreInputHtml_("dokManualScore", dok.score, attrs) +
      offRubricNoteHtml_(dok.score)
    );
  }

  function mcItemHtml(key, s, gs) {
    let scene = (gs && gs.scenes && gs.scenes[key]) || { mc: { score: null, excluded: false } };
    let q = QUESTIONS[key];
    let info = answerInfo(key, s.answers[key]);
    let pickLabels = (info.picks || []).map((i) => (q ? q[1][i] : null) || "?").join(" → ") || "No answer";
    let mcLabel =
      scene.mc.score === 1
        ? "✓ Correct on the first try — " + MC_POINTS + " pts"
        : scene.mc.score === 0.5
          ? "✓ Correct on the second try — " + MC_POINTS / 2 + " pts"
          : scene.mc.score === 0
            ? "✗ Incorrect after 2 tries — 0 pts"
            : "Not attempted yet";
    return `<div class="item-grade-block" data-scene="${key}">
      <h5>Scene ${key}</h5>
      <div class="grade-row-mc"><div class="mc-summary">${esc(q ? q[0] : "")}<br><small>Answer: ${esc(pickLabels)} — ${mcLabel}</small></div><label class="exclude-toggle"><input type="checkbox" class="mcExcludeToggle" data-key="${key}" ${scene.mc.excluded ? "checked" : ""}> Exclude MC from grade</label></div>
    </div>`;
  }

  function dokItemHtml(key, s, gs) {
    let scene = (gs && gs.scenes && gs.scenes[key]) || { dok: { score: null, excluded: false, comment: "" } };
    let dokText = String((s.dok || {})[key] || "").trim();
    let q = QUESTIONS[key];
    return `<div class="item-grade-block" data-scene="${key}">
      <h5>Scene ${key}</h5>
      <p class="dok-prompt">${esc(q ? q[3] : "")}</p>
      <div class="response-box">${dokText ? esc(dokText) : "<em>No written response submitted yet.</em>"}</div>
      <div class="grade-row-dok">${scoreButtonRow(key, scene.dok)}<label class="exclude-toggle"><input type="checkbox" class="dokExcludeToggle" data-key="${key}" ${scene.dok.excluded ? "checked" : ""}> Exclude written response from grade</label><textarea class="dokComment" data-key="${key}" placeholder="Optional feedback comment for the student">${esc(scene.dok.comment || "")}</textarea></div>
    </div>`;
  }

  function renderStudentModal(r) {
    // Grading a scene calls this again to redraw with the new score, but rebuilding
    // .modalbox's innerHTML resets its scroll position to the top — annoying when a
    // teacher is working their way down a long list of scenes. Remember where they
    // were (and which tab they were on) and put both back after the rebuild.
    let modalRootEl = document.getElementById("modalRoot");
    let existingBox = modalRootEl.querySelector(".modalbox");
    let savedScroll = existingBox ? existingBox.scrollTop : 0;
    let existingActiveTab = modalRootEl.querySelector(".detailTab.active");
    let savedTab = existingActiveTab ? existingActiveTab.dataset.tab : "reading";
    let s = normalizeState(r.state || {}, null);
    let gs = r.gradeSummary || { scenes: {}, acts: {} };
    let rubricLegend = `<div class="rubric-legend">${DOK_RUBRIC.slice(1)
      .map((d, i) => `<span class="rubric-chip" title="${esc(d)}">${i + 1}</span>`)
      .join("")}<small class="rubric-legend-note">Hover a number for the full rubric descriptor. Click a scene's written-response score to grade it; use the checkboxes to leave a question out of the final grade.</small></div>`;
    let dokSection = [1, 2, 3, 4, 5]
      .map((act) => {
        let keys = Object.keys(SCENES)
          .filter((k) => SCENES[k].act === act)
          .sort(sceneSort);
        let mcBlocks = keys.map((k) => mcItemHtml(k, s, gs)).join("");
        let dokBlocks = keys.map((k) => dokItemHtml(k, s, gs)).join("");
        let actTotal = gs.acts[act] || { earned: 0, possible: 0 };
        return `<div class="grade-act-block" id="actBlock${act}"><h4>Act ${act} <span class="pill" id="actTotal${act}">${actTotal.earned}/${actTotal.possible}</span>${actPendingNoteHtml_(actTotal)}</h4><h5 class="act-subhead">Multiple Choice</h5>${mcBlocks}<h5 class="act-subhead">Written Responses</h5>${dokBlocks}</div>`;
      })
      .join("");
    let evidence = (s.evidence || [])
      .map(
        (x) =>
          `<div class="response-box"><strong>Act ${x.act}, Scene ${x.scene} · ${esc((EQ.find((e) => e.id === x.eq) || {}).label || x.eq)}</strong><br>“${esc(x.quote)}”<p>${esc(x.note)}</p></div>`,
      )
      .join("");
    let acts = Object.entries(s.activityResponses || {})
      .filter(([, v]) => activityHasContent(v))
      .map(([k, v]) => `<div class="response-box"><strong>${esc(k)}</strong>${formatActivityResponseHtml(k, v)}</div>`)
      .join("");
    let e = s.essay || {};
    // A read-only summary of where this student's essay grades stand. Marking
    // happens on the Grade the Essay screen, where the whole class is in one
    // place -- this is here so the scores are visible beside the drafts.
    let eg = (r.gradeSummary || {}).essay;
    let essayScores = eg
      ? `<div class="essay-score-strip">${ESSAY_GRADE_STEPS.map((k) => {
          if (k === "final") {
            let t = eg.finalTotal || {};
            return `<span class="mini-chip ${t.hasAnyResult ? "batch-badge-graded" : ""}">Final Essay ${t.hasAnyResult ? t.earned + "/" + t.possible : "not scored"}</span>`;
          }
          let rec = (eg.steps || {})[k] || {};
          let val = rec.excluded
            ? "excused"
            : hasScore_(rec.score)
              ? k === "thesis"
                ? Number(rec.score) > 0
                  ? "complete"
                  : "not complete"
                : rec.score + "/" + rec.possible
              : rec.submitted
                ? "not marked yet"
                : "not done";
          let cls = rec.excluded ? "batch-badge-excluded" : hasScore_(rec.score) ? "batch-badge-graded" : rec.submitted ? "batch-badge-needs" : "";
          return `<span class="mini-chip ${cls}">${esc(ESSAY_GRADE_LABELS[k])} ${esc(val)}</span>`;
        }).join("")}</div>`
      : "";
    function modalEssayBox_(label, raw, slot, idx) {
      let text = String(raw || "").trim();
      let pm = essayMetaFromState_(e, slot, idx || 0, raw || "");
      return `<div class="response-box"><strong>${esc(label)}</strong><p>${text ? essayProcessTextHtml_(text, pm) : "<em>Not drafted</em>"}</p>${essayProcessSummaryHtml_(text, pm)}</div>`;
    }
    let essay = essayScores + essayProcessLegendHtml_() + modalEssayBox_("Thesis", e.thesis, "thesis", 0) + (e.bodies || []).map((b, i) => modalEssayBox_(`Body Paragraph ${i + 1}${i >= 3 ? " (extra)" : ""}`, b, "bodies", i)).join("") + (String(e.rebuttal || "").trim() ? modalEssayBox_("Counterargument", e.rebuttal, "rebuttal", 0) : "") + modalEssayBox_("Introduction", e.intro, "intro", 0) + modalEssayBox_("Conclusion", e.conclusion, "conclusion", 0);
    let self = ESSAY_CRITERIA
      .map(
        (c) =>
          `<div class="response-box"><strong>${c}</strong><br>Selected level: ${e.selfEval && e.selfEval[c] !== undefined ? Number(e.selfEval[c]) + 1 : "Not selected"}<p>${esc((e.selfComments || {})[c] || "No comment")}</p></div>`,
      )
      .join("");
    let roster2 = (backend.dashboard && backend.dashboard.students) || [];
    let myIdx = roster2.findIndex((x) => x.email === r.student.email);
    let prevStu = myIdx > 0 ? roster2[myIdx - 1] : null;
    let nextStu = myIdx >= 0 && myIdx < roster2.length - 1 ? roster2[myIdx + 1] : null;
    let navHtml =
      roster2.length > 1
        ? `<div class="student-nav"><button class="btn" id="prevStudentBtn" ${prevStu ? "" : "disabled"}>← ${prevStu ? esc(prevStu.name) : "Prev"}</button><span class="toolbar-note">${myIdx >= 0 ? myIdx + 1 : "?"} of ${roster2.length}</span><button class="btn" id="nextStudentBtn" ${nextStu ? "" : "disabled"}>${nextStu ? esc(nextStu.name) : "Next"} →</button></div>`
        : "";
    let tabDefs = [
      ["reading", "Reading"],
      ["evidence", "Evidence"],
      ["activities", "Activities"],
      ["essay", "Essay"],
      ["self", "Self-Assessment"],
    ];
    let tabsHtml = tabDefs
      .map(([id, label]) => `<button class="btn detailTab${id === savedTab ? " active" : ""}" data-tab="${id}">${label}</button>`)
      .join("");
    let paneHtml = (id, inner) =>
      `<div id="detail-${id}" class="detailPane${id === savedTab ? "" : " hide"}">${inner}</div>`;
    document.getElementById("modalRoot").innerHTML =
      `<div class="modal"><div class="modalbox" style="max-width:1000px;max-height:90vh;overflow:auto"><div class="pill">Student Work</div><h2>${esc(r.student.name)}</h2><p>${esc(r.student.email)} · Last saved ${r.updatedAt ? esc(new Date(r.updatedAt).toLocaleString()) : "not yet"}</p>${navHtml}<div class="student-detail-tabs">${tabsHtml}</div>${paneHtml("reading", `<h3>Reading &amp; Grading, by Scene</h3>${rubricLegend}${dokSection}`)}${paneHtml("evidence", `<h3>Evidence Bank</h3>${evidence || "<p>No evidence saved yet.</p>"}`)}${paneHtml("activities", `<h3>Activities</h3>${acts || "<p>No activity responses yet.</p>"}`)}${paneHtml("essay", `<h3>Essay Drafts</h3>${essay}`)}${paneHtml("self", `<h3>Self-Assessment</h3>${self}`)}<div class="modal-actions"><button class="btn primary modal-dismiss" id="closeStudent">Close</button></div></div></div>`;
    let newBox = document.getElementById("modalRoot").querySelector(".modalbox");
    if (newBox) newBox.scrollTop = savedScroll;
    document.getElementById("closeStudent").onclick = () => {
      document.getElementById("modalRoot").innerHTML = "";
      if (state.view === "manage") render();
    };
    let prevBtn = document.getElementById("prevStudentBtn");
    if (prevBtn && prevStu) prevBtn.onclick = () => openStudentWork(prevStu.email);
    let nextBtn = document.getElementById("nextStudentBtn");
    if (nextBtn && nextStu) nextBtn.onclick = () => openStudentWork(nextStu.email);
    async function saveGradeItem(itemType, key, patch) {
      try {
        await rpc("setGradeItem", {
          classId: backend.activeClassId,
          studentEmail: r.student.email,
          itemType,
          itemKey: key,
          score: patch.score !== undefined ? patch.score : null,
          excluded: !!patch.excluded,
          comment: patch.comment !== undefined ? patch.comment : (gs.scenes[key] && gs.scenes[key].dok.comment) || "",
        });
        if (backend.dashboard) {
          let stu = backend.dashboard.students.find((x) => x.email.toLowerCase() === r.student.email.toLowerCase());
          if (stu) stu.gradeSummary = gs;
        }
      } catch (e) {
        alert("Could not save that grade -- reloading this student to double check: " + e.message);
        await refreshStudentModal();
      }
    }
    async function refreshStudentModal() {
      try {
        let fresh = await rpc("getStudentWork", { classId: backend.activeClassId, studentEmail: r.student.email });
        normalizeGradeSummary_(fresh.gradeSummary);
        backend.studentDetail = fresh;
        renderStudentModal(fresh);
      } catch (e) {
        alert(e.message);
      }
    }
    document.querySelectorAll(".score-btn").forEach((btn) => {
      btn.onclick = () => {
        let key = btn.dataset.key;
        let score = Number(btn.dataset.score);
        let selected = btn.classList.contains("selected");
        let newScore = selected ? null : score;
        applyLocalGradeItemUpdate(gs, key, "dok", { excluded: false, score: newScore });
        renderStudentModal(r);
        saveGradeItem("dok", key, { excluded: false, score: newScore });
      };
    });
    document.querySelectorAll(".dokExcludeToggle").forEach((cb) => {
      cb.onchange = () => {
        let key = cb.dataset.key;
        let scene = gs.scenes[key];
        applyLocalGradeItemUpdate(gs, key, "dok", { excluded: cb.checked, score: scene ? scene.dok.score : null });
        renderStudentModal(r);
        saveGradeItem("dok", key, { excluded: cb.checked, score: gs.scenes[key].dok.score });
      };
    });
    document.querySelectorAll(".mcExcludeToggle").forEach((cb) => {
      cb.onchange = () => {
        let key = cb.dataset.key;
        applyLocalGradeItemUpdate(gs, key, "mc", { excluded: cb.checked });
        renderStudentModal(r);
        saveGradeItem("mc", key, { excluded: cb.checked, comment: "" });
      };
    });
    document.querySelectorAll(".dokComment").forEach((ta) => {
      ta.onblur = () => {
        let key = ta.dataset.key;
        let scene = gs.scenes[key];
        if (!scene) return;
        scene.dok.comment = ta.value;
        saveGradeItem("dok", key, { excluded: scene.dok.excluded, score: scene.dok.score, comment: ta.value });
      };
    });
    document.querySelectorAll(".detailTab").forEach(
      (b) =>
        (b.onclick = () => {
          document
            .querySelectorAll(".detailTab")
            .forEach((x) => x.classList.toggle("active", x === b));
          document.querySelectorAll(".detailPane").forEach((x) => x.classList.add("hide"));
          document.getElementById("detail-" + b.dataset.tab).classList.remove("hide");
        }),
    );
  }
  function sceneSort(a, b) {
    let [aa, as] = a.split(".").map(Number),
      [ba, bs] = b.split(".").map(Number);
    return aa - ba || as - bs;
  }

  if (backend.enabled) {
    setAccountHeader();
    bootstrap();
  } else {
    backend.ready = true;
    render();
  }
})();

__MB.BackendClient = 'ok';
</script>
