    ? `<a class="btn primary lesson-card-btn" href="https://join.nearpod.com" target="_blank" rel="noopener">Open Nearpod ↗</a><span class="lesson-card-code">Code <strong>${esc(link.code)}</strong></span>`
    : `<a class="btn primary lesson-card-btn" href="${esc(link.url)}" target="_blank" rel="noopener">Start the lesson ↗</a>`;
  return `<div class="lesson-card"><div class="lesson-card-copy"><span class="lesson-card-eyebrow">Lesson${isNearpod ? " · Nearpod" : ""}</span><strong>${esc(title)}</strong><small>${link.code ? "Go to join.nearpod.com and type the code." : "Opens in a new tab."} Your teacher may run it with the class instead.</small></div><div class="lesson-card-action">${action}</div></div>`;
}

// ---- Shape diagrams for the introduction and the conclusion ---------------
// The introduction narrows (broad → specific) and the conclusion widens
// (specific → broad). Drawn here as SVG in each stage's colour.
function shapeDiagramHtml_(kind) {
  let intro = kind === "intro";
  let bands = intro
    ? [["Hook", "Start broad: a question, a bold claim about people, or an idea the play explores. Skip dictionary definitions and “In this essay I will…”."],
       ["Bridge", "Narrow in: name the play and Shakespeare, give only the background a reader needs, and lead toward your argument."],
       ["Thesis", "Land on your claim. Your saved thesis is the last sentence."]]
    : [["Restated thesis", "Start with your claim again, in new words: the same idea, but not the same sentence."],
       ["Summary", "Pull together what your body paragraphs proved: your reasons, not a retelling of the plot."],
       ["Take-away", "Widen out: why does this idea matter beyond <i>Macbeth</i>, to people, power or the choices we make?"]];
  // Three shades of the stage's own colour (ESSAY_JOURNEY), one per band.
  let fills = intro ? ["#4a2c3c", "#6b4257", "#7d4d66"] : ["#3f6b6b", "#335a5a", "#244242"];
  // The pointed band is taller than the other two, so its label sits where the
  // shape is wide enough to hold it.
  let W = 260, H = 222, top = 6, span = H - top, cx = W / 2;
  let shares = intro ? [0.3, 0.3, 0.4] : [0.45, 0.275, 0.275];
  let edges = [top];
  shares.forEach((f) => edges.push(edges[edges.length - 1] + f * span));
  let half = (y) => (W / 2) * (intro ? 1 - (y - top) / span : (y - top) / span);
  let polys = bands.map((b, i) => {
    let y0 = edges[i], y1 = edges[i + 1], h = y1 - y0;
    let pts = [[cx - half(y0), y0], [cx + half(y0), y0], [cx + half(y1), y1], [cx - half(y1), y1]]
      .map((pt) => pt[0].toFixed(1) + "," + pt[1].toFixed(1)).join(" ");
    let tip = intro ? i === 2 : i === 0;
    let words = b[0] === "Restated thesis" ? ["Restated", "thesis"] : [b[0]];
    // In the pointed band, sit toward the wide end.
    let base = tip ? (intro ? y0 + h * 0.34 : y0 + h * 0.7) : y0 + h / 2 + 5 - (words.length - 1) * 7;
    let text = words.map((t, j) => `<text x="${cx}" y="${(base + j * 14).toFixed(1)}" text-anchor="middle" class="shape-label${tip ? " is-tip" : ""}">${t}</text>`).join("");
    return `<polygon points="${pts}" fill="${fills[i]}" stroke="#fff" stroke-width="2"/>${text}`;
  }).join("");
  let arrow = `<g class="shape-axis"><text x="0" y="14">${intro ? "BROAD" : "SPECIFIC"}</text><line x1="10" y1="24" x2="10" y2="${H - 24}"/><path d="M4 ${H - 32} L10 ${H - 20} L16 ${H - 32}" fill="none"/><text x="0" y="${H - 4}">${intro ? "SPECIFIC" : "BROAD"}</text></g>`;
  let svg = `<svg class="shape-svg" viewBox="-74 0 ${W + 78} ${H + 2}" role="img" aria-label="${intro ? "An upside-down triangle: hook at the wide top, bridge in the middle, thesis at the narrow point." : "A triangle: restated thesis at the narrow top, summary in the middle, take-away at the wide base."}"><g transform="translate(-72,0)">${arrow}</g>${polys}</svg>`;
  let list = bands.map((b, i) => `<li><span class="shape-dot" style="background:${fills[i]}"></span><div><strong>${b[0]}</strong><span>${b[1]}</span></div></li>`).join("");
  let example = intro
    ? ""
    : `<details class="shape-example"><summary>What does “in new words” look like?</summary><p>An example from a fable (not <i>Macbeth</i>):</p><p><strong>Thesis:</strong> By contrasting the tortoise’s patience with the hare’s pride, the fable argues that steady effort matters more than natural talent.</p><p><strong>Restated:</strong> The fable’s lesson is clear: talent is worth little without the steady effort the patient tortoise shows and the proud hare lacks.</p><p>The claim is the same, but the sentence is new: the ideas come in a different order, in different words.</p></details>`;
  return `<div class="shape-guide shape-${kind}"><div class="shape-figure">${svg}</div><div class="shape-copy"><h4>${intro ? "Shape: broad to specific" : "Shape: specific to broad"}</h4><ol class="shape-list">${list}</ol>${example}</div></div>`;
}

function evidence() {
  let list = state.evidence || [];
  return `<div class="sectionhead"><h2>Evidence Bank</h2>${citeGuideButtonHtml_()}</div><p>Your highlights are organized here so you can trace the argument you have been building across the play. Each quote shows its citation, ready to copy into your essay.</p><div class="grid3">${EQ.map((e) => `<div class="eq"><strong>${eqLabel(e)}</strong><span class="score">${list.filter((x) => x.eq === e.id).length}</span><div>saved pieces of evidence</div></div>`).join("")}</div><div class="card">${
    list.length
      ? list
          .map((x) => {
            let e = EQ.find((z) => z.id === x.eq);
            return `<div class="evidence"><div><span class="swatch" style="background:${e.color}"></span><strong>${eqLabel(e)}</strong><br><small>Act ${x.act}, Scene ${x.scene}</small></div><div><blockquote class="evidence-quote">“${esc(x.quote)}”</blockquote>${evidenceCiteHtml_(x)}<p>${esc(x.note)}</p><button class="btn removeEv" data-id="${x.id}">Remove</button></div></div>`;
          })
          .join("")
      : "<p>No evidence saved yet. Highlight a passage while reading to begin your notebook.</p>"
  }</div>`;
}

// The seven stages, in order. One list, used by the journey strip, the Next
// button and anything else that needs to know what comes after what.
// [id, name, what you do there, the colour that stage carries, its icon]
// Each stage has an identity -- a colour and a mark -- so the path reads as
// seven different pieces of work rather than seven identical dots.
const ESSAY_JOURNEY = [
  ["thesis", "Thesis", "Plant your claim", "#26405c", "flag"],
  ["discussion", "Discussion", "Test it on the class", "#5f7a63", "talk"],
  ["body", "Body Paragraphs", "Prove it, three times", "#9a7b3f", "pillars"],
  ["intro", "Introduction", "Lead the reader in", "#6b4257", "door"],
  ["conclusion", "Conclusion", "Land the point", "#3f6b6b", "target"],
  ["assemble", "Put It Together", "Read it as one essay", "#7a5a42", "pages"],
  ["self", "Self-Evaluation", "Judge your own work", "#4a4a70", "glass"],
];

// Drawn inline rather than loaded, so they scale, take the stage's colour, and
// cannot be the thing that fails to load.
const JOURNEY_ICONS = {
  flag: '<path d="M6 3v18" /><path d="M6 4h11l-2.2 3.5L17 11H6z" />',
  talk: '<path d="M3 5h12v8H8l-5 4z" /><path d="M17 9h4v8l-3-2.5h-5" />',
  pillars: '<path d="M3 4h18" /><path d="M3 20h18" /><path d="M6 4v16M12 4v16M18 4v16" />',
  door: '<path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16" /><path d="M3 21h18" /><circle cx="15" cy="12" r="1.1" />',
  target: '<circle cx="12" cy="12" r="8.5" /><circle cx="12" cy="12" r="4.5" /><circle cx="12" cy="12" r="1" />',
  pages: '<path d="M7 3h7l4 4v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M14 3v4h4" /><path d="M8.5 12h7M8.5 16h5" />',
  glass: '<circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /><path d="M8 10.5h5" />',
};
function journeyIcon_(name) {
  return `<svg viewBox="0 0 24 24" class="journey-icon" aria-hidden="true" focusable="false">${JOURNEY_ICONS[name] || JOURNEY_ICONS.flag}</svg>`;
}
function essayStepIndex(id) {
  let i = ESSAY_JOURNEY.findIndex((s) => s[0] === id);
  return i < 0 ? 0 : i;
}
function essayStepLabel(id) {
  let s = ESSAY_JOURNEY[essayStepIndex(id)];
  return s ? s[1] : id;
}

// The steps drawn as a path: seven medallions, each with its own colour and
// mark, joined by a line that fills in behind you. A row of identical pills
// told a student nothing about what the stages were or how far along they had
// got; this does both without them reading a word.
/* ---- Which essay stages are open ------------------------------------------
   Each writing stage now has its own release switch. Older classes used the
   sequential `releasedEssayThrough` setting, so we translate that once when no
   per-stage map exists. That keeps existing classes exactly where they were,
   while allowing a teacher to open or close any stage independently. */
function legacyEssayReleaseMap_(through) {
  let i = ESSAY_JOURNEY.findIndex((s) => s[0] === through);
  if (i < 0) i = ESSAY_JOURNEY.length - 1; // pre-release-control classes stay open
  let map = {};
  ESSAY_JOURNEY.forEach(([id], idx) => (map[id] = idx <= i));
  return map;
}
function essayReleaseMap_() {
  let raw = state.releasedEssayStages;
  let hasMap = raw && typeof raw === "object" && ESSAY_JOURNEY.some(([id]) => Object.prototype.hasOwnProperty.call(raw, id));
  let map = hasMap ? {} : legacyEssayReleaseMap_(state.releasedEssayThrough);
  if (hasMap) ESSAY_JOURNEY.forEach(([id]) => (map[id] = raw[id] === true));
  state.releasedEssayStages = map;
  return map;
}
// This helper deliberately ignores the viewer's role. Teacher dashboards use it
// to show the real student-facing release state even though teachers themselves
// can always open every stage.
function essayStageIsOpen_(id) {
  return essayReleaseMap_()[id] === true;
}
function essayStepReleased(id) {
  if (state.role !== "student") return true;
  return essayStageIsOpen_(id);
}
// If a teacher closes the stage a student was viewing, move them to the nearest
// earlier open stage. If there is no earlier one, use the first open stage. A
// class is allowed to have every writing stage closed.
function essayOpenStep(id) {
  if (essayStepReleased(id)) return id;
  let wanted = essayStepIndex(id);
  for (let i = wanted - 1; i >= 0; i--) if (essayStageIsOpen_(ESSAY_JOURNEY[i][0])) return ESSAY_JOURNEY[i][0];
  for (let i = 0; i < ESSAY_JOURNEY.length; i++) if (essayStageIsOpen_(ESSAY_JOURNEY[i][0])) return ESSAY_JOURNEY[i][0];
  return null;
}
// The final grading tile corresponds to the assembled essay (stage 6). The
// self-evaluation remains its own independently releasable student stage.
function essayGradeKeyStage_(key) {
  return key === "final" ? "assemble" : key;
}
function essayGradeKeyReleased_(key) {
  return essayStageIsOpen_(essayGradeKeyStage_(key));
}

function essayNav(active) {
  let lastDone = -1;
  ESSAY_JOURNEY.forEach(([id], i) => {
    if (essayStepDone(id)) lastDone = i;
  });
  let activeIdx = active ? essayStepIndex(active) : -1;
  let stops = ESSAY_JOURNEY.map(([id, label, blurb, color, icon], i) => {
    let done = essayStepDone(id);
    let isActive = active === id;
    let locked = !essayStepReleased(id);
    // The segment to the LEFT of this stop is lit when the stop before it is
    // finished, so the path fills in one leg at a time.
    let legLit = i > 0 && essayStepDone(ESSAY_JOURNEY[i - 1][0]);
    return `<li class="journey-stop ${done ? "is-done" : ""} ${isActive ? "is-active" : ""} ${legLit ? "leg-lit" : ""} ${locked ? "is-locked" : ""}" style="--stage:${color}">
      <button class="stepbtn ${isActive ? "active" : ""} ${done ? "done" : ""} ${locked ? "locked" : ""}" data-estep="${id}"
        title="${locked ? esc(label) + " — not open yet" : esc(label) + " — " + esc(blurb)}" aria-current="${isActive ? "step" : "false"}">
        <span class="journey-node">${journeyIcon_(icon)}${locked ? '<span class="journey-lock" aria-hidden="true">\uD83D\uDD12</span>' : done ? '<span class="journey-tick" aria-hidden="true">\u2713</span>' : ""}</span>
        <span class="journey-label"><span class="journey-index">${i + 1}.</span> ${esc(label)}</span>
        <span class="journey-blurb">${locked ? "Not open yet" : esc(blurb)}</span>
      </button>
    </li>`;
  }).join("");
  return `<nav class="essay-journey" aria-label="Essay steps">
    <div class="journey-head">
      <div><span class="journey-eyebrow">Your path</span><h3 class="journey-title">Read it. Argue it. Make it yours.</h3></div>
      <span class="journey-count">${activeIdx >= 0 ? `Step ${activeIdx + 1} of ${ESSAY_JOURNEY.length}` : "Waiting for release"}</span>
    </div>
    <ol class="essay-steps">${stops}</ol>
  </nav>`;
}

// The essay question, given the room it deserves. It is the thing every one of
// the seven stages is in service of, and it used to sit in the same plain box
// as everything else. Once a student has a thesis, their own answer is shown
// underneath it -- the question is the assignment, the thesis is what they are
// making of it.
function essayHero() {
  let thesis = String((state.essay || {}).thesis || "").trim();
  return `<section class="essay-hero">
    <span class="hero-eyebrow">Your essay question</span>
    <h2 class="hero-question">Is <em>Macbeth</em> mainly a play about <span class="hero-em">control and destiny</span>, <span class="hero-em">ambition and power</span>, or <span class="hero-em">justice and guilt</span>?</h2>
    ${
      thesis
        ? `<div class="hero-answer"><span class="hero-answer-label">Your answer so far</span><p>${esc(thesis)}</p></div>`
        : `<div class="hero-answer is-empty"><p>You answer it with a thesis \u2014 one arguable sentence. That is stage one.</p></div>`
    }
    <div class="hero-meta"><span>28 points</span><span>Argument &amp; Insight</span><span>Evidence &amp; Analysis</span><span>Organization &amp; Coherence</span><span>Language &amp; Control</span></div>
  </section>`;
}

// The button at the foot of every stage. Work already autosaves on every
// keystroke, so this is not what makes it safe -- it is the "I am finished with
// this part" signal, and the thing that carries you to the next stage without
// going back up to the map. It never blocks: an unfinished stage can still move
// on, it just says what is missing first.
function essaySubmissionKey_(id) {
  return id === "assemble" ? "final" : id;
}

function essaySubmissionText_(id) {
  let e = state.essay || {};
  if (id === "thesis") return String(e.thesis || "").trim();
  if (id === "discussion") {
    let posts = Array.isArray(e.discussion) ? e.discussion : [];
    let p = posts.length ? posts[posts.length - 1] : null;
    return p ? String(p.text || "").trim() : "";
  }
  if (id === "body") {
    let parts = (Array.isArray(e.bodies) ? e.bodies : []).map((x) => String(x || "").trim());
    if (String(e.rebuttal || "").trim()) parts.push(String(e.rebuttal || "").trim());
    return parts.join("\n\n").trim();
  }
  if (id === "intro") return String(e.intro || "").trim();
  if (id === "conclusion") return String(e.conclusion || "").trim();
  if (id === "assemble") {
    let parts = [e.intro].concat(Array.isArray(e.bodies) ? e.bodies : []);
    if (String(e.rebuttal || "").trim()) parts.push(e.rebuttal);
    parts.push(e.conclusion);
    return parts.map((x) => String(x || "").trim()).filter(Boolean).join("\n\n");
  }
  if (id === "self") {
    return ESSAY_CRITERIA.map((c) => `${c}=${e.selfEval && e.selfEval[c] !== undefined ? e.selfEval[c] : ""}|${String((e.selfComments || {})[c] || "").trim()}`).join("\n");
  }
  return "";
}

function essaySubmissionSig_(text) {
  let t = String(text || "");
  let h = 2166136261;
  for (let i = 0; i < t.length; i++) {
    h ^= t.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return t.length + ":" + h.toString(16);
}

function essayStageReady_(id) {
  let e = state.essay;
  if (id === "thesis") return !!String(e.thesis || "").trim();
  if (id === "discussion") {
    let posts = Array.isArray(e.discussion) ? e.discussion : [];
    let posted = posts.length ? String(posts[posts.length - 1].text || "").trim() : "";
    return !!posted && posted === String(e.thesis || "").trim();
  }
  if (id === "body") return e.bodies.slice(0, REQUIRED_BODIES).every((x) => String(x || "").trim());
  if (id === "intro") return !!String(e.intro || "").trim();
  if (id === "conclusion") return !!String(e.conclusion || "").trim();
  if (id === "assemble")
    return (
      String(e.intro || "").trim() &&
      e.bodies.slice(0, REQUIRED_BODIES).every((x) => String(x || "").trim()) &&
      String(e.conclusion || "").trim()
    );
  if (id === "self")
    return ESSAY_CRITERIA.every((c) => e.selfEval[c] !== undefined && e.selfEval[c] !== "");
  return false;
}

// The discussion has no separate Submit: posting a thesis is handing it in,
// and the teacher sees every reply as it is written.
function essayDiscussionPosted_() {
  let posts = Array.isArray((state.essay || {}).discussion) ? state.essay.discussion : [];
  return posts.some((p) => String((p && p.text) || "").trim());
}

// Replies live on classmates' posts, which only the class-backed app has, so
// BackendClient replaces this for a signed-in student.
function essayDiscussionReplied_() {
  return false;
}

function essayStageSubmitted_(id) {
  if (id === "discussion") return essayDiscussionPosted_();
  if (!essayStageReady_(id)) return false;
  let key = essaySubmissionKey_(id);
  let rec = (state.essay.submissions || {})[key];
  if (!rec || !rec.sig) return false;
  return String(rec.sig) === essaySubmissionSig_(essaySubmissionText_(id));
}

function markEssayStageSubmitted_(id) {
  state.essay.submissions = state.essay.submissions || {};
  let key = essaySubmissionKey_(id);
  state.essay.submissions[key] = {
    sig: essaySubmissionSig_(essaySubmissionText_(id)),
    submittedAt: new Date().toISOString(),
  };
}

function essaySubmitLabel_(id) {
  if (id === "assemble") return "Submit Final Essay";
  if (id === "self") return "Submit Self-Evaluation";
  return "Submit " + essayStepLabel(id);
}

function essaySubmitStatusText_(id) {
  if (id === "discussion") {
    if (!essayDiscussionPosted_())
      return essayDiscussionReplied_()
        ? "Your replies are in, and your teacher can see them. Post your thesis above to finish this stage."
        : ESSAY_INCOMPLETE_NOTE.discussion;
    if (!essayStageReady_(id)) return "✓ Posted. Your thesis has changed since you posted it — press Update Thesis in Discussion so the class sees the new version.";
    return "✓ Posted. That is how you turn in this stage — your teacher sees your thesis and every reply you write.";
  }
  if (essayStageSubmitted_(id)) return `✓ ${essayStepLabel(id)} submitted. Your teacher sees this version as ready.`;
  if (essayStageReady_(id)) return "Draft saved. Submit this stage when you want your teacher to grade the current version.";
  return ESSAY_INCOMPLETE_NOTE[id] || "Keep drafting. Your work is autosaved, but it is not submitted yet.";
}

function syncEssayStageActionUI_() {
  if (state.view !== "essay") return;
  let id = state.essay.step || "thesis";
  let status = document.getElementById("essaySubmitStatus");
  let submit = document.getElementById("essaySubmitStageBtn");
  if (status) {
    status.textContent = essaySubmitStatusText_(id);
    status.classList.toggle("done", essayStageSubmitted_(id));
  }
  if (submit) {
    let submitted = essayStageSubmitted_(id);
    submit.disabled = !essayStageReady_(id) || submitted;
    submit.textContent = submitted ? "Submitted ✓" : essaySubmitLabel_(id);
  }
}

// The footer now separates three different ideas that used to be conflated:
// autosave protects a draft, Submit tells the teacher it is ready to grade,
// and Continue simply navigates to the next released stage.
function essayNextBar(active) {
  let i = essayStepIndex(active);
  let submitted = essayStageSubmitted_(active);
  let prev = i > 0 ? ESSAY_JOURNEY[i - 1] : null;
  let next = i < ESSAY_JOURNEY.length - 1 ? ESSAY_JOURNEY[i + 1] : null;
  let back = prev
    ? `<button class="btn essayBackBtn" data-estep="${prev[0]}">← Back to ${esc(prev[1])}</button>`
    : `<span></span>`;
  let nextLocked = next && !essayStepReleased(next[0]);
  let forward = next
    ? nextLocked
      ? `<span class="journey-waiting">${esc(next[1])} is not open yet — your teacher will release it.</span>`
      : `<button class="btn essayNextBtn" data-estep="${next[0]}">Continue to ${esc(next[1])} →</button>`
    : submitted
      ? `<span class="journey-finished">✓ That is the whole essay. Every stage is submitted.</span>`
      : `<span></span>`;
  return `<div class="journey-next">
    ${back}
    <div class="essay-stage-submit">
      <span id="essaySubmitStatus" class="journey-next-note ${submitted ? "done" : ""}">${esc(essaySubmitStatusText_(active))}</span>
      ${active === "discussion" ? "" : `<div class="essay-stage-submit-buttons">
        <button type="button" class="btn" id="essaySaveDraftBtn">Save Draft</button>
        <button type="button" class="btn primary" id="essaySubmitStageBtn" ${!essayStageReady_(active) || submitted ? "disabled" : ""}>${submitted ? "Submitted ✓" : esc(essaySubmitLabel_(active))}</button>
      </div>`}
    </div>
    ${forward}
  </div>`;
}

// What is still missing, said plainly, so submission is deliberate rather than
// inferred from a partially filled autosave.
const ESSAY_INCOMPLETE_NOTE = {
  thesis: "Draft a thesis before you submit this stage — everything after this is built on it.",
  discussion: "Post your thesis to the class discussion above. Posting it is how you turn in this stage — there is no separate Submit button.",
  body: "Draft all three required body paragraphs before submitting this stage.",
  intro: "Draft your introduction before submitting this stage.",
  conclusion: "Draft your conclusion before submitting this stage.",
  assemble: "Your final essay is missing a required section. Go back to the stage that still needs work.",
  self: "Choose a level for all four criteria before submitting your self-evaluation.",
};

function essayStepDone(id) {
  return essayStageSubmitted_(id);
}

function evidenceCounts() {
  return EQ.map((q) => ({
    id: q.id,
    label: eqLabel(q),
    count: state.evidence.filter((x) => x.eq === q.id).length,
  }));
}

function sentenceList(text) {
  return (text.trim().match(new RegExp("[^.!?]+[.!?]+|[^.!?]+$", "g")) || []).map((x) => x.trim()).filter(Boolean);
}

function coach(text, type) {
  let sent = sentenceList(text),
    words = text.trim().split(new RegExp("\\s+")).filter(Boolean).length,
    quote = new RegExp("[“”\"]").test(text),
    explain =
      new RegExp("\\b(shows|reveals|demonstrates|suggests|illustrates|because|therefore|this means|this matters|indicates)\\b", "i").test(
        text,
      ),
    transition =
      new RegExp("\\b(furthermore|however|therefore|ultimately|additionally|because|as a result|thus|in contrast)\\b", "i").test(
        text,
      );
  let checks = [];
  if (type === "thesis") {
    // A thesis is a CLAIM, not a paragraph. It used to be checked against the
    // body-paragraph list, which asked a single sentence of argument for a
    // quotation, an act and scene, and a concluding sentence. The quotation and
    // the line reference belong in the body paragraphs, beside the evidence
    // they support; the thesis is the claim those paragraphs go on to prove.
    const THEME_WORDS = {
      destiny: "destiny|fate|control|choice|choos|prophec|free will|inevitab",
      ambition: "ambition|ambitious|power|desire|corrupt",
      justice: "justice|guilt|conscience|remorse|punish|atone|wrong",
    };
    let themeRe = new RegExp(
      state.essay.theme && THEME_WORDS[state.essay.theme]
        ? THEME_WORDS[state.essay.theme]
        : Object.keys(THEME_WORDS)
            .map((k) => THEME_WORDS[k])
            .join("|"),
      "i",
    );
    // "central idea", "mainly", "rather than" -- the words a thesis uses to
    // take a side, including the ones in the model sentence on this page.
    let stance = new RegExp(
      "\\b(central|centrally|mainly|primarily|chiefly|most|more than|rather than|above all|not merely|not simply|not just|instead of|driven by)\\b",
      "i",
    ).test(text);
    let reasons = new RegExp("\\b(because|since|through)\\b", "i").test(text);
    let insight = new RegExp(
      "\\b(ultimately|show|shows|showing|reveal|reveals|revealing|suggest|suggests|demonstrate|demonstrates|illustrate|illustrates|argues|indicates|means that|matters)\\b",
      "i",
    ).test(text);
    let citesText =
      quote || new RegExp("\\bAct\\s*[IVX\\d]|\\bScene\\s*[IVX\\d]|\\bline\\s*\\d", "i").test(text);
    checks = [
      [
        "Answers the question",
        themeRe.test(text),
        "Name the reading you are arguing for — control and destiny, ambition and power, or justice and guilt.",
      ],
      [
        "Takes a position",
        stance,
        "Say which reading is the central one. A thesis a classmate could not disagree with is not yet a thesis.",
      ],
      [
        "Previews your reasons",
        reasons,
        "Signal the reasoning your body paragraphs will prove — “because…”, “through…”.",
      ],
      [
        "Says why it matters",
        insight,
        "Finish with the larger idea Shakespeare develops, not just the claim itself.",
      ],
      [
        "One or two sentences",
        words >= 15 && sent.length >= 1 && sent.length <= 2,
        "A thesis is one sentence, two at most. Say it once, clearly.",
      ],
      [
        // An empty box has no quotation in it, but it has not earned a tick
        // for that either.
        "A claim, not evidence",
        words > 0 && !citesText,
        "Save the quotation and the act and line for your body paragraphs, where the evidence goes. The thesis makes the claim they prove.",
      ],
    ];
  } else if (type === "body") {
    checks = [
      [
        "Topic sentence",
        sent.length > 0 && sent[0].split(new RegExp("\\s+")).length >= 7,
        "Begin with a clear claim that connects this paragraph to your thesis.",
      ],
      [
        "Text evidence",
        quote || new RegExp("\\bAct\\s*\\d|\\bScene\\s*\\d", "i").test(text),
        "Include a specific quotation or clearly identified evidence from the play.",
      ],
      [
        "Explanation / analysis",
        explain,
        "Explain how the evidence proves your topic sentence; use analytical language such as “reveals,” “shows,” or “because.”",
      ],
      [
        "Concluding sentence",
        sent.length >= 4,
        "End the paragraph by connecting the paragraph’s idea back to the larger thesis.",
      ],
    ];
  } else if (type === "intro") {
    checks = [
      ["Opening/context", sent.length >= 2, "Give the reader enough context before the thesis."],
      [
        "Thesis is last",
        !!state.essay.thesis &&
          sent.length &&
          sent[sent.length - 1].replace(new RegExp("[.!?]+$"), "").trim() ===
            state.essay.thesis.replace(new RegExp("[.!?]+$"), "").trim(),
        "Place your saved thesis statement as the final sentence of the introduction.",
      ],
      [
        "Focused length",
        words >= 60,
        "Develop the introduction enough to establish context and direction.",
      ],
    ];
  } else {
    checks = [
      [
        "Restates central idea",
        sent.length && new RegExp("Macbeth|ambition|power|destiny|control|justice|guilt", "i").test(text),
        "Return to your central argument without simply copying the thesis.",
      ],
      [
        "Synthesizes ideas",
        sent.length >= 3 && explain,
        "Explain what the combined evidence shows about the play as a whole.",
      ],
      [
        "Final significance",
        sent.length >= 4,
        "End with a “so what?” insight about Shakespeare’s larger message.",
      ],
      [
        "No new quotation",
        !quote,
        "A conclusion usually synthesizes rather than introducing a brand-new quotation.",
      ],
    ];
  }
  let good = checks.filter((x) => x[1]).length;
  return `<div class="coach"><h4>Writing Coach · ${good}/${checks.length} checks</h4>${checks.map(([n, ok, tip]) => `<div class="check ${ok ? "good" : "warn"}"><strong>${ok ? "✓" : "△"} ${n}</strong>${ok ? "" : ` — ${tip}`}</div>`).join("")}<small>This feedback is a built-in writing check, not a grade. Your teacher’s judgment and the rubric remain the final standard.</small></div>`;
}

function thesisGuide() {
  let counts = evidenceCounts(),
    max = Math.max(...counts.map((x) => x.count)),
    suggested = counts
      .filter((x) => x.count === max)
      .map((x) => x.label)
      .join(" / ");
  let ev = state.evidence.filter((x) => !state.essay.theme || x.eq === state.essay.theme);
  let chosen = EQ.find((q) => q.id === state.essay.theme);
  return `<div class="card"><h3>Step 1 · Thesis Creation</h3><p>Build your thesis in order. Your evidence should drive the claim—not the other way around.</p><div class="thesis-flow"><section class="thesis-stage"><h3><span class="stage-num">1</span>Review the evidence you collected</h3><p>Start by noticing which essential question has the strongest evidence base.</p><div class="grid3">${counts.map((x) => `<div class="eq"><strong>${x.label}</strong><div class="score">${x.count}</div><div>pieces of evidence</div></div>`).join("")}</div><div class="thesis-preview"><strong>Evidence check:</strong> ${max ? `You currently have the most evidence for <em>${esc(suggested)}</em>. This is a starting point, not a requirement. Choose the theme you can argue most convincingly.` : "You do not have saved evidence yet. Return to the Evidence Bank or continue reading before finalizing your thesis."}</div></section><section class="thesis-stage"><h3><span class="stage-num">2</span>Choose the essential question you will answer</h3><div class="theme-list">${EQ.map((q) => `<label class="theme-card"><input type="radio" name="theme" class="themePick" value="${q.id}" ${state.essay.theme === q.id ? "checked" : ""}><span><strong>${eqLabel(q)}</strong><br>${q.q}</span></label>`).join("")}</div>${chosen ? `<div class="selected-evidence"><h4>Your saved evidence for ${esc(eqLabel(chosen))}</h4>${ev.length ? ev.map((x) => `<div class="evidence-choice"><strong>Act ${x.act}, Scene ${x.scene}</strong><br>“${esc(x.quote)}”<br><small>${esc(x.note)}</small></div>`).join("") : "<p>You have not saved evidence for this theme yet.</p>"}</div>` : ""}</section><section class="thesis-stage"><h3><span class="stage-num">3</span>Plan what your thesis must do</h3><p>A strong literary-analysis thesis:</p><ul><li><strong>Answers the final question directly.</strong></li><li><strong>Makes an arguable claim</strong> rather than stating a fact.</li><li><strong>Previews the reasoning</strong> your body paragraphs will prove.</li><li><strong>Explains the larger idea</strong> Shakespeare develops through the theme.</li></ul><div class="thesis-preview"><strong>Thesis pattern:</strong><br>In <em>Macbeth</em>, Shakespeare presents <strong>[chosen theme]</strong> as the play’s central idea because <strong>[reason 1]</strong>, <strong>[reason 2]</strong>, and <strong>[reason 3]</strong>, ultimately showing that <strong>[larger insight]</strong>.</div></section><section class="thesis-stage"><h3><span class="stage-num">4</span>Write and revise your thesis</h3><textarea id="thesisBox" class="writingbox short" placeholder="Write one complete thesis statement...">${esc(state.essay.thesis)}</textarea><p class="dok-note">Writing process: word count, writing time and pasted text are recorded and visible to your teacher. Macbeth/evidence text is identified separately from other pasted text.</p><div id="thesisCoach">${coach(state.essay.thesis, "thesis")}</div><p class="toolbar-note">When your thesis makes a clear claim and matches your evidence, continue to the Thesis Discussion.</p></section></div></div>`;
}

function discussion() {
  let current = String(state.essay.thesis || "").trim();
  let posted = state.essay.discussion.length ? state.essay.discussion[state.essay.discussion.length - 1] : null;
  let same = !!posted && String(posted.text || "").trim() === current;
  let label = posted ? (same ? "Thesis Is Up to Date ✓" : "Update Thesis in Discussion") : "Post Thesis to Discussion";
  return `<div class="card"><h3>Step 2 · Thesis Discussion</h3><p>Post your thesis for classmates to read. Before revising, respond to peer feedback by asking: Is my claim arguable? Is it specific? Does it explain <em>why</em> this theme is central?</p><div class="thesis-preview">${current ? esc(current) : "Complete your thesis first."}</div><button class="btn primary" id="postThesis" ${!current || same ? "disabled" : ""}>${label}</button><p class="toolbar-note">If you revise your thesis, this same discussion post will be updated instead of creating a duplicate.</p>${posted ? `<div class="discussion-post"><strong>Student Thesis</strong><p>${esc(posted.text)}</p><small>${esc(posted.updated || posted.date)}</small></div>` : "<p>No thesis has been posted yet.</p>"}</div>`;
}

function refreshBodyProgress_() {
  let el = document.querySelector(".body-progress");
  if (!el) return;
  let bodies = state.essay.bodies;
  let done = bodies.slice(0, REQUIRED_BODIES).filter((x) => String(x || "").trim()).length;
  let extras = bodies.length - REQUIRED_BODIES;
  el.innerHTML =
    `<strong>${done} of ${REQUIRED_BODIES} required paragraphs drafted.</strong>` +
    (extras > 0 ? ` You have also added ${extras} extra paragraph${extras === 1 ? "" : "s"}.` : "");
  document.querySelectorAll(".body-para").forEach((sec, idx) => {
    let filled = !!String(bodies[idx] || "").trim();
    sec.classList.toggle("is-filled", filled);
    if (idx < REQUIRED_BODIES) {
      let chip = sec.querySelector(".mini-chip");
      if (chip) {
        chip.textContent = filled ? "Drafted" : "Required";
        chip.className = "mini-chip " + (filled ? "body-chip-done" : "body-chip-todo");
      }
    }
  });
  // The step button in the nav should tick over as soon as the third is done.
  let navBtn = document.querySelector('.stepbtn[data-estep="body"]');
  if (navBtn) navBtn.classList.toggle("done", essayStepDone("body"));
}

function bodyEvidenceHtml_() {
  let ev = state.evidence.filter((x) => !state.essay.theme || x.eq === state.essay.theme);
  return `<details class="body-evidence"><summary><strong>Your evidence for this argument (${ev.length})</strong></summary>${
    ev
      .map(
        (x) =>
          `<div class="evidence-choice"><strong>Act ${x.act}, Scene ${x.scene}</strong> · “${esc(x.quote)}”<br><small>${esc(x.note)}</small>${evidenceCiteHtml_(x)}</div>`,
      )
      .join("") || "<p>No matching evidence saved yet.</p>"
  }<p class="toolbar-note">Copy a quote with its citation and paste it into your paragraph. Quoting the play this way is not counted as outside pasting. ${citeGuideButtonHtml_("btn-inline")}</p></details>`;
}

// All the body paragraphs on one screen. Three are required; the rest are the
// student's own. Keeping them together makes the shape of the argument visible
// -- you can see paragraph two repeating paragraph one, which you cannot when
// each lives on its own page.
function bodiesStep() {
  let bodies = state.essay.bodies;
  let doneCount = bodies.slice(0, REQUIRED_BODIES).filter((x) => String(x || "").trim()).length;
  let extras = bodies.length - REQUIRED_BODIES;
  let blocks = bodies
    .map((text, idx) => {
      let required = idx < REQUIRED_BODIES;
      let filled = !!String(text || "").trim();
      return `<section class="body-para ${filled ? "is-filled" : ""}">
        <div class="body-para-head">
          <h4>Body Paragraph ${idx + 1} ${
            required
              ? `<span class="mini-chip ${filled ? "body-chip-done" : "body-chip-todo"}">${filled ? "Drafted" : "Required"}</span>`
              : `<span class="mini-chip body-chip-extra">Extra</span>`
          }</h4>
          ${
            !required
              ? `<button type="button" class="btn removeBodyBtn" data-body="${idx}" title="Remove this extra paragraph">Remove</button>`
              : ""
          }
        </div>
        <textarea class="writingbox bodyBox" data-body="${idx}" placeholder="${
          required
            ? `Body Paragraph ${idx + 1}: topic sentence, evidence, explanation, concluding sentence...`
            : "An extra paragraph — another reason, a second piece of evidence, or a complication worth exploring..."
        }">${esc(text)}</textarea>
        <p class="dok-note">Writing process: word count, writing time and pasted text are recorded and visible to your teacher.</p>
        <div id="bodyCoach${idx}">${coach(text, "body")}</div>
      </section>`;
    })
    .join("");
  return `<div class="card"><h3>Step 3 · Body Paragraphs</h3>
    <p>Each paragraph does one job: <strong>Topic Sentence → Evidence → Explanation → Concluding Sentence</strong>. Every paragraph should prove one reason from your thesis — if two paragraphs are making the same point, combine them and find a new reason.</p>
    <div class="thesis-preview"><strong>Your thesis:</strong> ${esc(state.essay.thesis || "Draft your thesis first.")}</div>
    ${bodyEvidenceHtml_()}
    <p class="body-progress"><strong>${doneCount} of ${REQUIRED_BODIES} required paragraphs drafted.</strong>${
      extras > 0 ? ` You have also added ${extras} extra paragraph${extras === 1 ? "" : "s"}.` : ""
    }</p>
    ${blocks}
    <div class="body-add-row">
      <button class="btn" id="addBodyBtn" ${bodies.length >= MAX_BODIES ? "disabled" : ""}>+ Add another paragraph</button>
      <span class="toolbar-note">${
        bodies.length >= MAX_BODIES
          ? `That's ${MAX_BODIES} paragraphs — plenty for this essay.`
          : "Three is the requirement, not a limit. Add a fourth or fifth if your argument needs more room."
      }</span>
    </div>
    ${rebuttalSection()}</div>`;
}

// A counterargument paragraph is the single fastest way to make an argument read
// as considered rather than one-sided, so the tutorial lives here rather than in
// a handout, with a worked Macbeth example to measure an attempt against. It
// sits at the end of the body paragraphs because that is where it belongs in the
// essay, and because you cannot fairly concede to an opponent until you know
// what your own argument actually is. The tutorial is collapsed by default so it
// never pushes the paragraph boxes off the screen.
function rebuttalSection() {
  let text = state.essay.rebuttal || "";
  let filled = !!String(text).trim();
  return `<section class="body-para rebuttal-para ${filled ? "is-filled" : ""}">
    <div class="body-para-head">
      <h4>Counterargument <span class="mini-chip ${filled ? "body-chip-done" : "body-chip-extra"}">${filled ? "Drafted" : "Optional"}</span></h4>
    </div>
    <p>One more paragraph, if you want it: name the strongest objection to your thesis and explain why your reading still holds. It does not weaken your essay — it shows you read the play from more than one angle, which is what makes an argument convincing.</p>

    <details class="rebuttal-guide" ${filled ? "" : "open"}>
      <summary><strong>How to write one</strong> — four moves, a worked example, and three ways it goes wrong</summary>

      <h4>The four moves</h4>
      <ol class="rebuttal-moves">
        <li><strong>Name the other side fairly.</strong> State the opposing reading in its <em>strongest</em> form. If it sounds silly, you have picked the wrong objection — nobody is persuaded by watching you beat a weak argument.<br><em>A reader might argue that…</em></li>
        <li><strong>Give it real evidence.</strong> Quote the line that genuinely supports that other reading. Using the play against yourself is what makes this paragraph credible.</li>
        <li><strong>Concede what is true.</strong> Admit the part that is right. This costs you nothing and buys the reader's trust.<br><em>It is true that… / This reading is not wrong about…</em></li>
        <li><strong>Turn back to your claim.</strong> Explain why your reading accounts for more of the play than theirs does. End on your side — this is the whole point of the paragraph.<br><em>However… / But this overlooks… / What this reading cannot explain is…</em></li>
      </ol>

      <h4>A worked example</h4>
      <div class="rebuttal-example">
        <p><span class="rb-move rb-1">A reader might argue that Macbeth is not truly responsible for his choices, since the witches name him king before the idea of murder has occurred to him at all:</span> <span class="rb-move rb-2">“All hail, Macbeth, that shalt be king hereafter” (1.3.53).</span> <span class="rb-move rb-3">It is true that the prophecy plants the ambition; Macbeth is not the one who first says the word “king.”</span> <span class="rb-move rb-4">But the witches never mention Duncan, and they never mention a dagger. That step is entirely Macbeth's. He talks himself out of the murder in his own soliloquy, listing every reason not to act — and then acts anyway, answering his wife with “I am settled” (1.7.92). The prophecy gives Macbeth an ambition. It does not give him a knife.</span></p>
        <p class="rebuttal-key"><span class="rb-key rb-1">1 Name it</span> <span class="rb-key rb-2">2 Evidence</span> <span class="rb-key rb-3">3 Concede</span> <span class="rb-key rb-4">4 Turn back</span></p>
      </div>

      <h4>Three ways this goes wrong</h4>
      <ul class="rebuttal-warn">
        <li><strong>The straw man.</strong> Picking an objection so weak nobody holds it. Argue against the version your smartest classmate would defend.</li>
        <li><strong>The surrender.</strong> Conceding so much that your thesis quietly disappears. Concede a detail, not your claim.</li>
        <li><strong>The stall.</strong> Ending the paragraph on the other side's point. The last sentence must be yours.</li>
      </ul>
    </details>

    <textarea id="rebuttalBox" class="writingbox" placeholder="A reader might argue that…">${esc(text)}</textarea>
    <p class="dok-note">Writing process: word count, writing time and pasted text are recorded and visible to your teacher.</p>
    <div id="rebuttalCoach">${coach(text, "body")}</div>
    <p class="toolbar-note">Optional. Leave it blank and your essay is still complete. If you write one, it goes in after your last body paragraph and before the conclusion.</p>
  </section>`;
}

function introStep() {
  let sent = sentenceList(state.essay.intro),
    thesis = state.essay.thesis;
  let preview = "";
  if (state.essay.intro) {
    let last = sent.pop() || "";
    preview = `<div class="essay-preview">${esc(sent.join(" "))}${sent.length ? " " : ""}<span class="thesis-highlight">${esc(last)}</span></div>`;
  }
  return `<div class="card"><h3>Step 4 · Introduction</h3>${lessonCardHtml_("intro", "How to write an introduction")}<p>Write the introduction as its own section. Establish the play and the issue your argument will address. Your <strong>saved thesis must be the final sentence</strong>.</p>${shapeDiagramHtml_("intro")}<div class="thesis-preview"><strong>Thesis to place last:</strong> ${esc(thesis || "Complete your thesis first.")}</div><textarea id="introBox" class="writingbox" placeholder="Write your introduction here. End with your thesis statement...">${esc(state.essay.intro)}</textarea><p class="dok-note">Writing process: word count, writing time and pasted text are recorded and visible to your teacher.</p>${preview}<div id="introCoach">${coach(state.essay.intro, "intro")}</div></div>`;
}

function conclusionStep() {
  return `<div class="card"><h3>Step 5 · Conclusion</h3><p>Bring the argument together: return to your thesis, synthesize what your body paragraphs prove, and end with the larger significance of Shakespeare’s message. Avoid simply repeating the introduction.</p>${shapeDiagramHtml_("conclusion")}<div class="thesis-preview"><strong>Your thesis, to restate in new words:</strong> ${esc(state.essay.thesis || "Complete your thesis first.")}</div><textarea id="conclusionBox" class="writingbox" placeholder="Write your conclusion here...">${esc(state.essay.conclusion)}</textarea><p class="dok-note">Writing process: word count, writing time and pasted text are recorded and visible to your teacher.</p><div id="conclusionCoach">${coach(state.essay.conclusion, "conclusion")}</div></div>`;
}

function assembleStep() {
  let e = state.essay;
  // Reading order: introduction, every body paragraph, the counterargument if
  // there is one, then the conclusion.
  let parts = [e.intro]
    .concat(e.bodies)
    .concat(String(e.rebuttal || "").trim() ? [e.rebuttal] : [])
    .concat([e.conclusion]);
  let full = parts.filter((x) => String(x || "").trim()).join("\n\n");
  // Required = introduction + three body paragraphs + conclusion. Extra
  // paragraphs and the counterargument are counted separately so a student who
  // writes more is never shown as less than finished.
  let required = [e.intro, e.bodies[0], e.bodies[1], e.bodies[2], e.conclusion];
  let done = required.filter((x) => String(x || "").trim()).length;
  let extraBodies = e.bodies.slice(REQUIRED_BODIES).filter((x) => String(x || "").trim()).length;
  let hasRebuttal = !!String(e.rebuttal || "").trim();
  let bonus = [];
  if (extraBodies) bonus.push(`${extraBodies} extra body paragraph${extraBodies === 1 ? "" : "s"}`);
  if (hasRebuttal) bonus.push("a counterargument paragraph");
  let words = full.trim() ? full.trim().split(/\s+/).length : 0;
  return `<div class="card"><h3>Step 6 · Put It Together</h3>
    <p>This view combines each piece without deleting the separate drafts. Return to any step to revise.</p>
    <div class="progressbar"><span style="width:${(done / required.length) * 100}%"></span></div>
    <p><strong>${done}/${required.length} required sections complete</strong>${
      bonus.length ? ` · plus ${bonus.join(" and ")}` : ""
    }${words ? ` · ${words} words` : ""}</p>
    ${
      done === required.length && !hasRebuttal
        ? `<p class="toolbar-note">Your essay is complete. If you want to strengthen it, Step 4 shows you how to add a counterargument paragraph.</p>`
        : ""
    }
    <div class="essay-preview">${esc(full || "Your completed sections will appear here.")}</div>
    <button class="btn" id="copyEssay">Copy Full Essay</button>
    <div class="works-cited-step"><h4>Works Cited</h4><p>When you type up your final copy, end it with a Works Cited page. ${citeGuideButtonHtml_("btn-inline")}</p>${worksCitedBoxHtml_()}</div></div>`;
}

function rubricTable() {
  let bands = ["7 to >6 pts", "6 to >5 pts", "5 to >4 pts", "4 to >1 pts", "1 to >0 pts"];
  return `<div class="rubric-wrap"><table class="rubric"><thead><tr><th>Criteria</th>${bands.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody>${Object.entries(
    RUBRIC,
  )
    .map(
      ([c, ds]) =>
        `<tr><td class="crit">${c}</td>${ds.map((d) => `<td>${esc(d)}</td>`).join("")}</tr>`,
    )
    .join("")}</tbody></table></div>`;
}

function selfEvalStep() {
  let e = state.essay,
    bands = ["7 to >6 pts", "6 to >5 pts", "5 to >4 pts", "4 to >1 pts", "1 to >0 pts"];
  let labels = ESSAY_BAND_LABELS;
  return `<div class="card"><h3>Step 7 · Self-Evaluation</h3><p>Read your assembled essay and click the rubric description that best matches your work for each criterion. Then explain your choice in the comment box directly below it.</p>${ESSAY_CRITERIA
    .map((c) => {
      let selected = e.selfEval[c];
      return `<section class="self-criterion"><div class="self-criterion-head"><div><strong>${c}</strong><br><small>Choose the description that most closely matches your essay.</small></div>${selected !== undefined && selected !== "" ? `<span class="pill">Selected: ${bands[+selected]}</span>` : '<span class="pill">Not selected</span>'}</div><div class="self-band-grid">${RUBRIC[c].map((d, i) => `<button type="button" class="self-band ${String(selected) === String(i) ? "selected" : ""}" data-crit="${c}" data-band="${i}"><strong>${labels[i]}<br><small>${bands[i]}</small></strong>${esc(d)}</button>`).join("")}</div><div class="self-comment-wrap"><label><strong>Your ${c} reflection</strong></label><textarea class="selfComment self-comment" data-crit="${c}" placeholder="Explain why you chose this level. Identify a specific strength and/or something you would revise.">${esc(e.selfComments[c] || "")}</textarea></div></section>`;
    })
    .join(
      "",
    )}<div class="self-summary"><strong>Self-assessment status:</strong> ${ESSAY_CRITERIA.filter((c) => e.selfEval[c] !== undefined && e.selfEval[c] !== "").length}/4 criteria selected.</div><h3>Full Macbeth Essay Rubric</h3>${rubricTable()}<div class="bottom-standards"><button class="btn primary standards-btn openStandards">View Common Core Standards</button></div></div>`;
}

function essay() {
  // If a stage is closed while a student is standing in it, move them to an
  // open stage without touching any saved work. If the teacher closes every
  // stage, the journey stays visible but the writing itself remains protected.
  let step = essayOpenStep(state.essay.step || "thesis");
  let content = !step
    ? `<div class="card essay-all-locked"><h3>Writing Workshop Not Open Yet</h3><p>Your teacher has not released a writing stage yet. Your saved work is still here and will reappear when that stage is opened.</p></div>`
    : step === "thesis"
      ? thesisGuide()
      : step === "discussion"
        ? discussion()
        : step === "body"
          ? bodiesStep()
          : step === "intro"
            ? introStep()
            : step === "conclusion"
              ? conclusionStep()
              : step === "assemble"
                ? assembleStep()
                : selfEvalStep();

function openActivity(title) {
  let detail = ACTIVITY_DETAILS[title] || { prompt: "Complete the activity described by your teacher." };
  let saved = state.activityResponses[title];
  let isStructured = !!(detail.table || detail.fields);
  let bodyHtml = "";
  if (detail.table) {
    let cols = detail.table;
    let savedRows = saved && Array.isArray(saved.table) ? saved.table : null;
    let rows = savedRows && savedRows.length ? savedRows : detail.presetRows || Array.from({ length: detail.minRows || 1 }, () => []);
    bodyHtml += `<div style="overflow:auto"><table class="rubric" id="actTable"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody id="actTableBody">${rows.map((r) => activityTableRowHtml(cols, r)).join("")}</tbody></table></div><button type="button" class="btn" id="actAddRow" style="margin-top:8px">+ Add Row</button>`;
  }
  if (detail.fields) {
    let savedFields = saved && Array.isArray(saved.fields) ? saved.fields : [];
    bodyHtml += detail.fields
      .map((f, i) => `<div class="field"><label>${esc(f.label)}</label><textarea class="actField writingbox short" data-idx="${i}" placeholder="${esc(f.placeholder || "")}">${esc(savedFields[i] || "")}</textarea></div>`)
      .join("");
  }
  if (!isStructured) {
    let legacyVal = typeof saved === "string" ? saved : "";
    bodyHtml += `<textarea id="activityResponse" class="activity-response" placeholder="Record your thinking or response here...">${esc(legacyVal)}</textarea>`;
  }
  if (detail.reflection) {
    let savedReflection = (saved && typeof saved === "object" && saved.reflection) || "";
    bodyHtml += `<div class="field" style="margin-top:14px"><label><strong>${esc(detail.reflection)}</strong></label><textarea id="actReflection" class="writingbox short" placeholder="Your answer...">${esc(savedReflection)}</textarea></div>`;
  }
  document.getElementById("modalRoot").innerHTML =
    `<div class="modal"><div class="modalbox" style="max-width:720px;max-height:88vh;overflow:auto"><div class="pill">Built-in Activity</div><h3>${esc(title)}</h3><p>${esc(detail.prompt || "")}</p>${bodyHtml}<div class="modal-actions"><button class="btn modal-dismiss" id="cancelModal">Close</button><button class="btn primary" id="saveActivity">Save Response</button></div></div></div>`;
  document.getElementById("cancelModal").onclick = () =>
    (document.getElementById("modalRoot").innerHTML = "");
  function bindRowRemovers() {
    document.querySelectorAll(".actRemoveRow").forEach((b) => (b.onclick = () => {
      let body = document.getElementById("actTableBody");
      if (body && body.children.length > 1) b.closest("tr").remove();
    }));
  }
  let addRowBtn = document.getElementById("actAddRow");
  if (addRowBtn)
    addRowBtn.onclick = () => {
      document.getElementById("actTableBody").insertAdjacentHTML("beforeend", activityTableRowHtml(detail.table, []));
      bindRowRemovers();
    };
  bindRowRemovers();
  document.getElementById("saveActivity").onclick = () => {
    if (!isStructured) {
      state.activityResponses[title] = document.getElementById("activityResponse").value;
      save();
      document.getElementById("modalRoot").innerHTML = "";
      alert("Activity response saved.");
      return;
    }
    let response = {};
    if (detail.table)
      response.table = Array.from(document.querySelectorAll("#actTableBody tr"))
        .map((tr) => Array.from(tr.querySelectorAll(".actTableCell")).map((inp) => inp.value))
        .filter((row) => row.some((c) => c.trim()));
    if (detail.fields) response.fields = Array.from(document.querySelectorAll(".actField")).map((t) => t.value);
    if (detail.reflection) response.reflection = document.getElementById("actReflection").value;
    state.activityResponses[title] = response;
    save();
    document.getElementById("modalRoot").innerHTML = "";
    alert("Activity response saved.");
  };
}

// Reads the selected passage WITHOUT the margin line numbers. CSS user-select
// keeps them out of a normal drag, but a selection that starts before a number
// and ends after it can still pick the digits up, so the numbers are removed
// from a copy of the selected markup rather than trusted to styling alone.
function selectedQuote_(sel) {
  if (!sel || !sel.rangeCount) return "";
  try {
    let frag = sel.getRangeAt(0).cloneContents();
    Array.prototype.slice.call(frag.querySelectorAll(".lineno")).forEach((el) => el.remove());
    return frag.textContent.replace(/[ \t]+\n/g, "\n").trim();
  } catch (e) {
    return sel.toString().trim();
  }
}

function addHighlight(eqId, key) {
  let sel = window.getSelection();
  let quote = selectedQuote_(sel);
  if (!quote) return alert("Select a passage in the Original Text first.");
  let pane = document.getElementById("originalPane");
  if (!pane.contains(sel.anchorNode)) return alert("Select text from the Original Text pane.");
  let e = EQ.find((x) => x.id === eqId);
  document.getElementById("modalRoot").innerHTML =
    `<div class="modal"><div class="modalbox"><div class="pill">${eqLabel(e)}</div><h3>Explain your evidence</h3><blockquote>“${esc(quote)}”</blockquote><p>${esc(e.q)}</p><textarea class="notearea" id="evNote" placeholder="Explain how this passage helps answer the essential question..."></textarea><div class="modal-actions"><button class="btn modal-dismiss" id="cancelModal">Cancel</button><button class="btn primary" id="saveEv">Save Evidence</button></div></div></div>`;
  document.getElementById("cancelModal").onclick = () =>
    (document.getElementById("modalRoot").innerHTML = "");
  document.getElementById("saveEv").onclick = () => {
    let note = document.getElementById("evNote").value.trim();
    if (!note) return alert("Add a note explaining the connection.");
    let s = SCENES[key];
    try {
      state.evidence.push({ id: Date.now(), eq: eqId, quote, note, act: s.act, scene: s.scene });
      save();
      alert("Evidence saved to your Evidence Bank.");
    } catch (err) {
      console.error("Evidence save failed:", err);
      alert(
        "Your evidence was recorded, but there was a problem saving it (" +
          (err && err.message ? err.message : err) +
          "). If this keeps happening, tell your teacher this exact message.",
      );
    } finally {
      document.getElementById("modalRoot").innerHTML = "";
      render();
    }
  };
}

// once the line-number spans were stripped. An exact indexOf then failed for
// any selection spanning more than one line -- the evidence saved fine, but the
// highlight silently never appeared. So match on a whitespace-flattened copy
// and map the hit back to real offsets in the original.
function flattenForSearch_(text) {
  let flat = "";
  let map = [];   // index in `flat` -> index in `text`
  let lastWasSpace = true;
  for (let i = 0; i < text.length; i++) {
    let ch = text[i];
    if (/\s/.test(ch)) {
      if (lastWasSpace) continue;
      flat += " ";
      map.push(i);
      lastWasSpace = true;
    } else {
      flat += ch;
      map.push(i);
      lastWasSpace = false;
    }
  }
  return { flat: flat, map: map };
}
function findQuoteRange_(text, flatIndex, quote, isFree) {
  let needle = String(quote || "").replace(/\s+/g, " ").trim();
  if (!needle) return null;
  let from = 0;
  while (true) {
    let at = flatIndex.flat.indexOf(needle, from);
    if (at < 0) return null;
    let start = flatIndex.map[at];
    let end = flatIndex.map[at + needle.length - 1] + 1;
    if (isFree(start, end)) return { start: start, end: end };
    from = at + 1;
  }
}
function injectHighlights(text, key) {
  let s = SCENES[key];
  let items = (state.evidence || []).filter((x) => x.act === s.act && x.scene === s.scene);
  if (!items.length) return text;
  let ranges = [];
  let flatIndex = flattenForSearch_(text);
  items.forEach((item) => {
    let q = esc(item.quote || "");
    if (!q) return;
    let hit = findQuoteRange_(text, flatIndex, q, function (start, end) {
      return !ranges.some((r) => start < r.end && end > r.start);
    });
    if (hit) ranges.push({ start: hit.start, end: hit.end, item: item });
  });
  if (!ranges.length) return text;
  ranges.sort((a, b) => a.start - b.start);
  let out = "";
  let cursor = 0;
  ranges.forEach((r) => {
    let eqDef = EQ.find((e) => e.id === r.item.eq);
    let color = eqDef ? eqDef.color : "var(--gold)";
    out += text.slice(cursor, r.start);
    out += `<mark class="ev-hl" data-ev-id="${r.item.id}" style="--ev-color:${color}" title="${esc(
      eqDef ? eqDef.label : "Saved evidence",
    )}${r.item.note ? " — " + esc(r.item.note.slice(0, 90)) : ""}">`;
    out += text.slice(r.start, r.end);
    out += "</mark>";
    cursor = r.end;
  });
  out += text.slice(cursor);
  return out;
}

function bind() {
  let dupUnitBtn = document.getElementById("dupUnitBtn");
  if (dupUnitBtn)
    dupUnitBtn.onclick = () =>
      alert(
        "Unit duplication is managed from the connected class backend. Once deployed, use Teacher Dashboard > Create a Class to start a new section of this same unit — each class gets its own code and release settings automatically.",
      );
  document.querySelectorAll("[data-role]").forEach((b) => {
    b.classList.toggle("active", b.dataset.role === state.role);
    b.onclick = () => {
      state.role = b.dataset.role;
      save();
      render();
    };
  });
  document.querySelectorAll("[data-goto]").forEach(
    (b) =>
      (b.onclick = () => {
        // Paging from the last scene of an Act into the first of the next one
        // should open that Act in the sidebar too.
        syncNavAct_(b.dataset.goto);
        state.view = b.dataset.goto;
        save();
        render();
      }),
  );
  document
    .querySelectorAll(".openActivity")
    .forEach((b) => (b.onclick = () => openActivity(b.dataset.activity)));
  // Every way of moving between stages goes through here: a stop on the journey
  // strip, the Next button, the Back button. Work is already saved on every
  // keystroke; save() again so the step itself is remembered, then put the
  // reader at the top of the new stage rather than wherever they were scrolled
  // to on the old one.
  // Only actual essay-navigation buttons belong here. Release checkboxes also
  // carry data-estep so the teacher controls know which stage they toggle;
  // binding every [data-estep] made a release click navigate to that stage,
  // redraw the page, and remove the checkbox before its change event could save.
  document.querySelectorAll(".stepbtn[data-estep], .essayBackBtn[data-estep], .essayNextBtn[data-estep]").forEach(
    (b) =>
      (b.onclick = () => {
        if (!essayStepReleased(b.dataset.estep))
          return alert(
            essayStepLabel(b.dataset.estep) +
              " has not been opened yet. Your teacher releases each stage of the essay as the class reaches it.",
          );
        let moving = state.essay.step !== b.dataset.estep;
        state.essay.step = b.dataset.estep;
        save();
        render();
        if (moving) {
          let head = document.querySelector(".essay-journey");
          if (head && head.scrollIntoView) head.scrollIntoView({ block: "start" });
          else window.scrollTo(0, 0);
        }
      }),
  );
  let saveDraftBtn = document.getElementById("essaySaveDraftBtn");
  if (saveDraftBtn)
    saveDraftBtn.onclick = () => {
      save();
      let status = document.getElementById("essaySubmitStatus");
      if (status) status.textContent = "Draft saved in this browser.";
    };
  let submitStageBtn = document.getElementById("essaySubmitStageBtn");
  if (submitStageBtn)
    submitStageBtn.onclick = () => {
      let id = state.essay.step || "thesis";
      if (!essayStageReady_(id)) return alert(ESSAY_INCOMPLETE_NOTE[id] || "Finish this stage before submitting it.");
      markEssayStageSubmitted_(id);
      save();
      render();
    };
  let refreshEssayWorkBtn = document.getElementById("refreshEssayWork");
  if (refreshEssayWorkBtn)
    refreshEssayWorkBtn.onclick = () => {
      save();
      render();
    };
  document.querySelectorAll(".themePick").forEach(
    (r) =>
      (r.onchange = () => {
        state.essay.theme = r.value;
        save();
        render();
      }),
  );
  let tb = document.getElementById("thesisBox");
  if (tb)
    tb.oninput = (e) => {
      state.essay.thesis = e.target.value;
      save();
      document.getElementById("thesisCoach").innerHTML = coach(e.target.value, "thesis");
      syncEssayStageActionUI_();
    };
  let post = document.getElementById("postThesis");
  if (post)
    post.onclick = () => {
      let text = state.essay.thesis.trim();
      if (!text) return;
      let now = new Date().toLocaleString();
      if (state.essay.discussion.length) {
        // Local/prototype mode mirrors the class backend: revise the one thesis
        // post rather than adding another copy to the discussion list.
        state.essay.discussion[state.essay.discussion.length - 1].text = text;
        state.essay.discussion[state.essay.discussion.length - 1].updated = "Updated " + now;
      } else {
        state.essay.discussion.push({ text, date: "Posted " + now });
      }
      save();
      render();
    };
  document.querySelectorAll(".bodyBox").forEach(
    (t) =>
      (t.oninput = (e) => {
        let i = +t.dataset.body;
        state.essay.bodies[i] = e.target.value;
        save();
        let c = document.getElementById("bodyCoach" + i);
        if (c) c.innerHTML = coach(e.target.value, "body");
        // The "n of 3 drafted" line and the Required/Drafted chip are the only
        // other things on screen that depend on this text, so patch those two
        // rather than re-rendering and throwing away the cursor mid-sentence.
        refreshBodyProgress_();
        syncEssayStageActionUI_();
      }),
  );
  let addBody = document.getElementById("addBodyBtn");
  if (addBody)
    addBody.onclick = () => {
      if (state.essay.bodies.length >= MAX_BODIES) return;
      state.essay.bodies.push("");
      state.essay.writingMeta = state.essay.writingMeta || {};
      state.essay.writingMeta.bodies = Array.isArray(state.essay.writingMeta.bodies) ? state.essay.writingMeta.bodies : [];
      state.essay.writingMeta.bodies.push(null);
      save();
      render();
      // Put the cursor in the box they just asked for.
      let boxes = document.querySelectorAll(".bodyBox");
      let last = boxes[boxes.length - 1];
      if (last) { last.focus(); last.scrollIntoView({ behavior: "smooth", block: "center" }); }
    };
  document.querySelectorAll(".removeBodyBtn").forEach(
    (b) =>
      (b.onclick = () => {
        let i = +b.dataset.body;
        if (i < REQUIRED_BODIES) return;   // the first three are not removable
        let written = String(state.essay.bodies[i] || "").trim();
        if (written && !confirm("Delete this extra paragraph? What you wrote in it will be lost.")) return;
        state.essay.bodies.splice(i, 1);
        state.essay.writingMeta = state.essay.writingMeta || {};
        state.essay.writingMeta.bodies = Array.isArray(state.essay.writingMeta.bodies) ? state.essay.writingMeta.bodies : [];
        state.essay.writingMeta.bodies.splice(i, 1);
        while (state.essay.bodies.length < REQUIRED_BODIES) state.essay.bodies.push("");
        save();
        render();
      }),
  );
  let rebuttal = document.getElementById("rebuttalBox");
  if (rebuttal)
    rebuttal.oninput = (e) => {
      state.essay.rebuttal = e.target.value;
      save();
      let c = document.getElementById("rebuttalCoach");
      if (c) c.innerHTML = coach(e.target.value, "body");
      syncEssayStageActionUI_();
    };
  let intro = document.getElementById("introBox");
  if (intro)
    intro.oninput = (e) => {
      state.essay.intro = e.target.value;
      save();
      document.getElementById("introCoach").innerHTML = coach(e.target.value, "intro");
      syncEssayStageActionUI_();
    };
  let con = document.getElementById("conclusionBox");
  if (con)
    con.oninput = (e) => {
      state.essay.conclusion = e.target.value;
      save();
      document.getElementById("conclusionCoach").innerHTML = coach(e.target.value, "conclusion");
      syncEssayStageActionUI_();
    };
  // Attach writing-process tracking after the ordinary text handlers so both
  // the draft and its origin metadata are saved on the same input event.
  attachEssayWritingBox_(document.getElementById("thesisBox"), "thesis", 0);
  document.querySelectorAll(".bodyBox").forEach((el) => attachEssayWritingBox_(el, "bodies", +el.dataset.body));
  attachEssayWritingBox_(document.getElementById("rebuttalBox"), "rebuttal", 0);
  attachEssayWritingBox_(document.getElementById("introBox"), "intro", 0);
  attachEssayWritingBox_(document.getElementById("conclusionBox"), "conclusion", 0);

  let copy = document.getElementById("copyEssay");
  if (copy)
    copy.onclick = () => {
      // The same reading order as the preview above it -- including the
      // counterargument, which the old copy left out.
      let e = state.essay;
      let full = [e.intro]
        .concat(e.bodies)
        .concat(String(e.rebuttal || "").trim() ? [e.rebuttal] : [])
        .concat([e.conclusion])
        .filter((x) => String(x || "").trim())
        .join("\n\n");
      copyText_(full, copy);
    };
  document.querySelectorAll(".openCiteGuide").forEach((b) => (b.onclick = () => openCiteGuide_()));
  document.querySelectorAll(".copyWorksCited").forEach((b) => (b.onclick = () => copyText_(worksCitedEntry_(false), b)));
  document.querySelectorAll(".copyEvidenceCite").forEach((b) => {
    b.onclick = () => {
      let item = (state.evidence || []).find((x) => String(x.id) === String(b.dataset.id));
      if (item) copyText_(evidenceCopyText_(item), b);
    };
  });
  document.querySelectorAll(".self-band").forEach(
    (x) =>
      (x.onclick = () => {
        state.essay.selfEval[x.dataset.crit] = x.dataset.band;
        save();
        render();
      }),
  );
  document.querySelectorAll(".selfComment").forEach(
    (x) =>
      (x.oninput = () => {
        state.essay.selfComments[x.dataset.crit] = x.value;
        save();
        syncEssayStageActionUI_();
      }),
  );
  document.querySelectorAll(".openStandards").forEach((x) => (x.onclick = openStandards));
  if (state.view.startsWith("scene:")) {
    let key = state.view.split(":")[1];
    let sb = document.getElementById("supportBtn");
    sb.onclick = () => {
      // Remembered in state, not just in the DOM. Answering a multiple-choice
      // question re-renders the scene, and a DOM-only toggle was wiped every
      // time -- students had to reopen the modern text after every answer.
      state.modernOpen = !state.modernOpen;
      document.getElementById("reader").classList.toggle("support", state.modernOpen);
      sb.classList.toggle("active", state.modernOpen);
      save();
    };
    document
      .querySelectorAll(".hilite")
      .forEach((b) => (b.onclick = () => addHighlight(b.dataset.eq, key)));
    document.querySelectorAll("[data-answer]").forEach(
      (b) =>
        (b.onclick = () => {
          let info = answerInfo(key, state.answers[key]);
          if (info.locked) return;
          let picked = +b.dataset.answer;
          if (info.picks.includes(picked)) return;
          state.answers[key] = [...info.picks, picked];
          save();
          render();
        }),
    );
    attachDokBox(document.getElementById("dok"), key);
  }
  document.querySelectorAll(".scene-pager-btn").forEach(
    (b) =>
      (b.onclick = () => {
        let v = b.dataset.view;
        if (!v) return;
        if (v.startsWith("scene:") && !released(v.split(":")[1])) {
          alert("This scene has not been released yet.");
          return;
        }
        state.view = v;
        save();
        render();
        window.scrollTo(0, 0);
      }),
  );
  document.querySelectorAll(".removeEv").forEach(
    (b) =>
      (b.onclick = () => {
        state.evidence = state.evidence.filter((x) => x.id != b.dataset.id);
        save();
        render();
      }),
  );
  bindReleaseControls_();
}


// Every release control on the page, in one place, so anything that repaints
// part of the page (the grading tiles are repainted on their own by each
// recount) can re-attach them without re-running the whole of bind().
// Assigning onchange again is harmless, so calling this twice is safe.
function bindReleaseControls_() {
  // Every release control redraws in place: the page stays where it was, and
  // every copy of the same switch (a tile and Release & Resources) agrees.
  document.querySelectorAll(".actRelease").forEach(
    (c) =>
      (c.onchange = (ev) => {
        if (ev) ev.stopPropagation();
        let a = +c.dataset.act;
        state.releasedActs = c.checked
          ? [...new Set([...state.releasedActs, a])]
          : state.releasedActs.filter((x) => x !== a);
        save();
        renderKeepScroll_();
      }),
  );
  document.querySelectorAll(".sceneRelease").forEach(
    (c) =>
      (c.onchange = () => {
        state.releasedScenes[c.dataset.key] = c.checked;
        save();
        renderKeepScroll_();
      }),
  );
  document.querySelectorAll(".essayStageRelease").forEach(
    (c) =>
      (c.onchange = (ev) => {
        // This is a release control, not essay navigation. Keep the teacher in
        // the same place on the dashboard while all duplicate controls/tile
        // states refresh to match the newly saved setting.
        if (ev) ev.stopPropagation();
        let map = Object.assign({}, essayReleaseMap_());
        map[c.dataset.estep] = c.checked;
        state.releasedEssayStages = map;
        save();
        renderKeepScroll_();
      }),
  );
  let rt = document.getElementById("resourceToggle");
  if (rt)
    rt.onchange = () => {
      state.teacherResources = rt.checked;
      save();
      renderKeepScroll_();
    };
}

function render() {
  sidebar();
  let app = document.getElementById("app");
  let v = String(state.view || "home");
  if (v.startsWith("scene:")) app.innerHTML = scene(v.split(":")[1]);
  else if (v === "evidence") app.innerHTML = evidence();
  else if (v === "essay") app.innerHTML = essay();
  else if (v === "manage") app.innerHTML = manage();
  else if (v === "batchGrade") app.innerHTML = batchGrade();
  else if (v === "essayGrade") app.innerHTML = essayGrade();
  else if (v === "admin") app.innerHTML = admin();
  else app.innerHTML = home();
  bind();
  navSync_();
}

(function bindModalBackdropDismiss() {
  const root = document.getElementById("modalRoot");
  if (!root) return;
  root.addEventListener("click", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("modal")) {
      const dismiss = e.target.querySelector(".modal-dismiss");
      if (dismiss) dismiss.click();
      else root.innerHTML = "";
    }
  });
})();
