<script>
window.__MB = window.__MB || {}; __MB.AppLogic = 'started';
// Three body paragraphs are required; anything past that is the student's own
// addition and is optional everywhere -- progress, completion, assembly.
const REQUIRED_BODIES = 3;
const MAX_BODIES = 8;

// ---------------------------------------------------------------------------
// ESSAY GRADING
//
// Each step of the essay is graded on its own: the thesis is a completion mark,
// the four written steps each get one 1-7 rubric score, and the finished essay
// is scored on the four-criterion rubric the students already self-assess
// against (RUBRIC in PlayData).
//
// The rubrics live HERE rather than beside DOK_RUBRIC in PlayData because
// PlayData is 245KB of play text and every re-paste of it is a chance to
// truncate the file. Anything likely to be reworded belongs in a small file.
// Sibling <script> tags share one global scope, so BackendClient sees these.
//
// Format matches DOK_RUBRIC: index 0 unused, "Name. Sentence..." so the marking
// screen can split the band name off the descriptor.
// ---------------------------------------------------------------------------
const ESSAY_STEP_KEYS = ["thesis", "discussion", "body", "intro", "conclusion"];
const ESSAY_STEP_LABELS = {
  thesis: "Thesis",
  discussion: "Thesis Discussion",
  body: "Body Paragraphs",
  intro: "Introduction",
  conclusion: "Conclusion",
};
const ESSAY_RUBRIC_MAX = 7;
// The thesis is a completion mark, not a rubric score: it is worth one point and
// the only question is whether they drafted one.
const ESSAY_THESIS_POINTS = 1;

const BODY_RUBRIC = [
  null,
  "Incomplete. Fewer than three paragraphs are drafted, or what is there is too short to show an argument.",
  "Minimal. Three paragraphs exist, but they retell what happens in the play rather than argue a point, and the text is barely quoted.",
  "Developing. Each paragraph makes a point, but the points repeat one another or drift away from the thesis, and quotations are dropped in without explanation.",
  "Adequate. Each paragraph makes a distinct point supported by a quotation, but the explanation is thin and the link back to the thesis is left for the reader to make.",
  "Proficient. Every paragraph opens with a clear topic sentence, supports it with well-chosen evidence, explains how that evidence proves the point, and returns to the thesis.",
  "Strong. Every paragraph proves a different reason from the thesis, the evidence is precise, and the analysis reads the language of the quotation rather than only its content.",
  "Exemplary. The paragraphs build a cumulative argument: each proves a distinct reason, the evidence is chosen for its exact wording, the analysis goes well beyond a surface reading, and the order of the paragraphs is itself doing work.",
];

const DISCUSSION_RUBRIC = [
  null,
  "Incomplete. Nothing was posted to the discussion.",
  "Minimal. A thesis was posted, but it is a statement of fact or a summary rather than an arguable claim.",
  "Developing. The posted thesis makes a claim, but it is broad or vague and does not say why the theme matters.",
  "Adequate. The posted thesis is arguable and on topic, but it could apply to almost any play and gives no sense of how the essay will proceed.",
  "Proficient. The posted thesis is specific and arguable, names the theme it will defend, and is clear enough for a classmate to respond to.",
  "Strong. The posted thesis is specific, arguable, and explains why the theme is central to the play, and the student engaged with what classmates posted.",
  "Exemplary. The posted thesis is precise and genuinely contestable, explains why the theme is central, and the student's responses to classmates sharpened someone's thinking, including their own.",
];

const INTRO_RUBRIC = [
  null,
  "Incomplete. The introduction is missing or is a single sentence.",
  "Minimal. The introduction announces the assignment rather than the argument, and the thesis is missing from the end.",
  "Developing. The introduction names the play and the theme, but it opens on a generalisation about life or literature and the thesis is buried rather than final.",
  "Adequate. The introduction establishes the play and the issue and ends with the thesis, but the opening does little to make the reader care about the question.",
  "Proficient. The introduction establishes the play and the issue clearly, narrows from context to claim, and ends on the saved thesis.",
  "Strong. The introduction opens on something specific to Macbeth, frames the question the essay will answer, and arrives at the thesis as a conclusion rather than an announcement.",
  "Exemplary. The introduction makes the question feel worth asking, frames it in the play's own terms, and lands on a thesis the reader now wants to see defended.",
];

const CONCLUSION_RUBRIC = [
  null,
  "Incomplete. The conclusion is missing or is a single sentence.",
  "Minimal. The conclusion restates the thesis in the same words and stops.",
  "Developing. The conclusion repeats the introduction, listing what the essay said without adding anything to it.",
  "Adequate. The conclusion returns to the thesis and gathers the body paragraphs, but ends on a general statement that could close any essay.",
  "Proficient. The conclusion returns to the thesis in new words, synthesises what the body paragraphs proved, and ends on why Shakespeare's point matters.",
  "Strong. The conclusion shows what the argument adds up to rather than listing it again, and its final idea reaches past the essay without leaving the play behind.",
  "Exemplary. The conclusion reframes the thesis in light of everything proved, and closes on an insight about the play that the reader could not have had before reading the essay.",
];

const ESSAY_STEP_RUBRICS = {
  discussion: DISCUSSION_RUBRIC,
  body: BODY_RUBRIC,
  intro: INTRO_RUBRIC,
  conclusion: CONCLUSION_RUBRIC,
};

// The four-criterion rubric (RUBRIC in PlayData) is written best-first with five
// levels. These are the points each level is worth, matching the band headings
// the students already see ("7 to >6 pts", "6 to >5 pts", ...).
const ESSAY_CRITERIA = ["Argument & Insight", "Evidence & Analysis", "Organization & Coherence", "Language & Control"];
// Older builds stored the self-evaluation under the original generic rubric.
// Preserve those choices when a student opens this build instead of discarding
// work. "Meaning" used to combine argument, evidence and analysis, so it is the
// closest legacy starting point for both of the two criteria that now separate
// those skills. Students can revise either selection on Step 7.
const LEGACY_SELF_CRITERION = {
  "Argument & Insight": "Meaning",
  "Evidence & Analysis": "Meaning",
  "Organization & Coherence": "Form",
  "Language & Control": "Style",
};
const ESSAY_CRITERION_POINTS = [7, 6, 5, 4, 1];
const ESSAY_CRITERION_MAX = 7;
const ESSAY_BAND_LABELS = ["Exceeds", "Strong", "Developing", "Limited", "Beginning"];

// One line per essay tile on the Teacher Dashboard: what the student did, not
// what the teacher is looking for (that is ESSAY_GRADE_NOTES, on the marking
// screen itself).
const ESSAY_TILE_BLURB = {
  thesis: "Their arguable claim",
  discussion: "What they posted to the class board",
  body: "Three paragraphs plus any counterargument",
  intro: "Context narrowing to the thesis",
  conclusion: "What the argument adds up to",
  final: "The assembled essay, all four criteria",
};

// What the teacher is being asked to judge on each marking screen. Written for
// the grader, not the student -- they are two different readers.
const ESSAY_GRADE_NOTES = {
  thesis:
    "Is there a thesis? This is a completion mark, not a judgement — the app ticks anyone who drafted one, and you override it where you disagree. The quality of the claim is judged in the steps that follow.",
  discussion:
    "What they posted to the class discussion — their thesis and every reply — and whether the claim is arguable, specific, and clear enough for a classmate to respond to. Posting counts as turning it in. A new reply or an updated thesis after you grade brings the student back to the top as Resubmitted.",
  body:
    "All of their body paragraphs on one screen, plus the optional counterargument. One score for the set: does each paragraph prove a distinct reason with evidence that is explained and tied back to the thesis?",
  intro:
    "Does the introduction establish the play and the issue, narrow towards the argument, and end on the saved thesis?",
  conclusion:
    "Does the conclusion do more than restate — does it show what the argument adds up to, and end on why it matters?",
  final:
    "The whole essay, scored on Argument & Insight, Evidence & Analysis, Organization & Coherence, and Language & Control. Read it once and score all four.",
};
let state = JSON.parse(
  (function () {
    try {
      return localStorage.getItem("macbethState");
    } catch (e) {
      return null;
    }
  })() || "null",
) || {
  role: "student",
  view: "home",
  releasedActs: [1],
  releasedScenes: {},
  modern: true,
  answers: {},
  dok: {},
  evidence: [],
  teacherResources: true,
  className: "English 2 - Macbeth",
};
state = state && typeof state === "object" ? state : {};
state.role = state.role || "student";
state.view = state.view || "home";
state.releasedActs = Array.isArray(state.releasedActs) ? state.releasedActs : [1];
state.releasedScenes = state.releasedScenes || {};
state.answers = state.answers || {};
state.dok = state.dok || {};
state.dokMeta = state.dokMeta || {};
state.modernOpen = state.modernOpen === true;
state.navAct = Number.isFinite(Number(state.navAct)) ? Number(state.navAct) : 1;
syncNavAct_();   // coming back to a saved scene opens its Act
state.evidence = Array.isArray(state.evidence) ? state.evidence : [];
state.teacherResources = state.teacherResources !== false;
state.className = state.className || "English 2 - Macbeth";
state.essay = state.essay && typeof state.essay === "object" ? state.essay : {};
state.essay.step = state.essay.step || "thesis";
state.essay.theme = state.essay.theme || "";
state.essay.thesis = state.essay.thesis || "";
state.essay.discussion = Array.isArray(state.essay.discussion) ? state.essay.discussion : [];
state.essay.bodies = Array.isArray(state.essay.bodies) ? state.essay.bodies : ["", "", ""];
while (state.essay.bodies.length < REQUIRED_BODIES) state.essay.bodies.push("");
state.essay.rebuttal = typeof state.essay.rebuttal === "string" ? state.essay.rebuttal : "";
// The three separate body steps became one, and the counterargument then moved
// inside that step. Anyone mid-essay when either shipped has "body2" or
// "rebuttal" saved as their current step, which would otherwise render nothing.
if (/^body\d$/.test(String(state.essay.step || "")) || state.essay.step === "rebuttal") state.essay.step = "body";
state.essay.intro = state.essay.intro || "";
state.essay.conclusion = state.essay.conclusion || "";
state.essay.selfEval = state.essay.selfEval || {};
state.essay.selfComments = state.essay.selfComments || {};
// Explicit stage submissions are separate from autosaved drafts. A submission
// stores a short signature of the exact version the student turned in; if they
// revise afterward, the signature no longer matches and the stage becomes a
// draft again until they resubmit.
state.essay.submissions = state.essay.submissions && typeof state.essay.submissions === "object" ? state.essay.submissions : {};
// Writing-process metadata for the essay. This records only how text currently
// in the student's essay arrived (typed, pasted from Macbeth/evidence, or pasted
// from somewhere else), plus paste-event counts. It does not store clipboard
// contents or a keystroke history. Existing writing from before this feature is
// marked as pre-tracking rather than being falsely labelled as typed.
state.essay.writingMeta = state.essay.writingMeta && typeof state.essay.writingMeta === "object" ? state.essay.writingMeta : {};
state.essay.writingMeta.bodies = Array.isArray(state.essay.writingMeta.bodies) ? state.essay.writingMeta.bodies : [];
for (const c of ESSAY_CRITERIA) {
  const legacy = LEGACY_SELF_CRITERION[c];
  if ((state.essay.selfEval[c] === undefined || state.essay.selfEval[c] === "") && legacy && state.essay.selfEval[legacy] !== undefined) {
    state.essay.selfEval[c] = state.essay.selfEval[legacy];
  }
  if (!state.essay.selfComments[c] && legacy && state.essay.selfComments[legacy]) {
    state.essay.selfComments[c] = state.essay.selfComments[legacy];
  }
  let v = state.essay.selfEval[c];
  if (v !== undefined && v !== "" && Number(v) > 4) {
    let n = Number(v);
    state.essay.selfEval[c] = n >= 7 ? "0" : n >= 6 ? "1" : n >= 5 ? "2" : n >= 2 ? "3" : "4";
  }
}
state.activityResponses = state.activityResponses || {};

function save() {
  try {
    localStorage.setItem("macbethState", JSON.stringify(state));
  } catch (e) {
    console.warn("Local save skipped (storage unavailable):", e);
  }
}

/* ---- The browser Back button ----------------------------------------------
   The app never changes page, so Back used to jump the student clean out of
   Macbeth -- one stray swipe and they were on whatever was open before.
   Every move between pages goes through render(), so that is the one place
   history is written from: each new place pushes an entry, a redraw of the
   same place does not. Back pops the entry and puts the app back where it was.

   The URL is deliberately left alone (the third argument stays null): this runs
   inside the Apps Script sandbox iframe, where rewriting it is refused. If
   history is unavailable at all, __navOk goes false and the app behaves exactly
   as it did before. */
let __navKeyNow = null; // the place the top history entry stands for
let __navRestoring = false; // true only while Back/Forward is driving render()
let __navOk = true;

function navKey_() {
  let v = String(state.view || "home");
  if (v === "essay") v += "/" + String((state.essay && state.essay.step) || "thesis");
  return v;
}
function navApply_(key) {
  let parts = String(key || "home").split("/");
  if (parts[0] === "essay" && parts[1]) {
    state.essay = state.essay || {};
    state.essay.step = parts[1];
  }
  state.view = parts[0];
}
function navSync_() {
  if (!__navOk || __navRestoring) return;
  let key = navKey_();
  if (key === __navKeyNow) return;
  try {
    if (__navKeyNow === null) history.replaceState({ mbNav: key }, "");
    else history.pushState({ mbNav: key }, "");
    __navKeyNow = key;
  } catch (e) {
    __navOk = false;
  }
}
window.addEventListener("popstate", function (e) {
  if (!__navOk) return;
  let key = e.state && e.state.mbNav;
  if (!key) return; // somebody else's history entry
  __navRestoring = true;
  __navKeyNow = key;
  try {
    navApply_(key);
    save();
    render();
  } finally {
    __navRestoring = false;
  }
});

// Redraw without moving the page. Used by every switch on the dashboard, so
// flipping one never scrolls the teacher back to the top.
function renderKeepScroll_() {
  let sx = window.scrollX || 0, sy = window.scrollY || 0;
  render();
  requestAnimationFrame(() => window.scrollTo(sx, sy));
}

// Anything can arrive here: Sheets turns a period typed as "2" into the number
// 2, and (s || "").replace would throw on it and blank the whole dashboard.
function esc(s) {
  return (s === null || s === undefined || s === false ? "" : String(s)).replace(
    new RegExp("[&<>\"']", "g"),
    (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m],
  );
}

function eqLabel(e) {
  let i = EQ.findIndex((x) => x.id === e.id);
  return `EQ${i + 1} — ${e.label}`;
}

function eqShortLabel(e) {
  let i = EQ.findIndex((x) => x.id === e.id);
  return `EQ${i + 1} · ${e.label}`;
}

// Normalizes a saved multiple-choice answer (a legacy plain index, a picks
// array, or nothing yet) into attempt/scoring info. Students get up to two
// tries: full credit on the first try, half credit on the second, and the
// correct answer is revealed once both tries are used.
function answerInfo(key, raw) {
  let qa = QUESTIONS[key];
  if (!qa) return null;
  let correctIdx = qa[2];
  let picks = Array.isArray(raw) ? raw : raw !== undefined && raw !== null ? [raw] : [];
  let attempts = picks.length;
  let correct = picks.includes(correctIdx);
  let score = attempts === 0 ? null : correct ? (picks[0] === correctIdx ? 1 : 0.5) : attempts >= 2 ? 0 : null;
  let locked = correct || attempts >= 2;
  return { picks, attempts, correctIdx, correct, score, locked };
}

function released(key) {
  let a = +key.split(".")[0];
  return state.role !== "student" || state.releasedActs.includes(a) || state.releasedScenes[key];
}

// Reading order of every scene key ("1.1", "1.2", ... "5.8"), used to build
// the Back/Next buttons at the end of each scene.
const SCENE_ORDER = Object.keys(SCENES).sort((a, b) => {
  let [a1, a2] = a.split(".").map(Number);
  let [b1, b2] = b.split(".").map(Number);
  return a1 - b1 || a2 - b2;
});

function scenePager(key) {
  let idx = SCENE_ORDER.indexOf(key);
  let prevKey = idx > 0 ? SCENE_ORDER[idx - 1] : null;
  let nextKey = idx >= 0 && idx < SCENE_ORDER.length - 1 ? SCENE_ORDER[idx + 1] : null;

  let backHtml = prevKey
    ? `<button class="btn scene-pager-btn" data-view="scene:${prevKey}">← Back: Act ${SCENES[prevKey].act}, Scene ${SCENES[prevKey].scene}</button>`
    : `<button class="btn scene-pager-btn" data-view="home">← Back to Overview</button>`;

  let nextHtml;
  if (!nextKey) {
    nextHtml = `<button class="btn primary scene-pager-btn" data-view="evidence">Continue to Evidence Bank →</button>`;
  } else if (released(nextKey)) {
    nextHtml = `<button class="btn primary scene-pager-btn" data-view="scene:${nextKey}">Next: Act ${SCENES[nextKey].act}, Scene ${SCENES[nextKey].scene} →</button>`;
  } else {
    nextHtml = `<button class="btn scene-pager-btn locked" disabled>🔒 Next: Act ${SCENES[nextKey].act}, Scene ${SCENES[nextKey].scene} (not yet released)</button>`;
  }

  return `<div class="scene-pager">${backHtml}${nextHtml}</div>`;
}

// Which Act is folded open in the left column. Twenty-eight scenes in a flat
// list is a lot of scrolling to reach Act 5; one Act open at a time keeps the
// list short. The Act you are reading opens itself, so navigating never leaves
// you looking at a closed list.
function openNavAct() {
  let saved = Number(state.navAct);
  // 0 means every Act folded -- clicking the open one shuts it and it stays shut.
  return saved >= 0 && saved <= 5 ? saved : 1;
}
// Opening a scene opens its Act. Done here rather than inside sidebar() so that
// folding the Act you are reading actually folds it, instead of springing back
// open on the next redraw.
function syncNavAct_(view) {
  let v = String(view || state.view || "");
  if (!v.startsWith("scene:")) return;
  let sc = SCENES[v.split(":")[1]];
  if (sc) state.navAct = sc.act;
}

// Five identical grey rows reading "Act 1  7 scenes" told a student nothing
// about what was inside them. Each Act now carries its own colour and the name
// of the thing that happens in it, so the left column reads as the shape of the
// play rather than as a list of folders.
const ACT_CARDS = [
  ["Act One", "The Prophecy", "#4a6b7c"],
  ["Act Two", "The Murder", "#2e4057"],
  ["Act Three", "The Banquet", "#6b4257"],
  ["Act Four", "The Apparitions", "#6b5335"],
  ["Act Five", "The Reckoning", "#7a2f38"],
];

// The Acts became cards, which left Overview / Evidence Bank / Final Essay
// looking like leftovers beside them. Same card, one accent colour, so the
// whole left column reads as one thing.
function navCard_(view, eyebrow, name, note, colour) {
  const active = String(state.view || "") === view;
  return `<button class="navbtn nav-card ${active ? "active" : ""}" data-view="${view}" style="--act:${colour}">
      <span class="nav-act-body">
        <span class="nav-act-eyebrow">${eyebrow}</span>
        <span class="nav-act-name">${name}</span>
        <span class="nav-act-note">${note}</span>
      </span>
      <span class="nav-act-caret nav-card-go" aria-hidden="true">→</span>
    </button>`;
}

function sidebar() {
  let h =
    '<div class="nav-title">Unit</div>' +
    navCard_("home", "Start here", "Overview", "The essential questions", "#3f5c4e");
  let open = openNavAct();
  for (let a = 1; a <= 5; a++) {
    let keys = Object.keys(SCENES)
      .filter((k) => SCENES[k].act === a)
      .sort((x, y) => SCENES[x].scene - SCENES[y].scene);
    let isOpen = a === open;
    // An Act nobody can open yet says so on the folded row, so a student is not
    // invited to click into five locked scenes to find that out.
    let openCount = keys.filter((k) => released(k)).length;
    let note = openCount ? `${keys.length} scenes` : "locked";
    let card = ACT_CARDS[a - 1];
    h += `<button class="nav-act ${isOpen ? "is-open" : ""} ${openCount ? "" : "is-locked"}" data-navact="${a}" aria-expanded="${isOpen}" style="--act:${card[2]}">
      <span class="nav-act-body">
        <span class="nav-act-eyebrow">${card[0]}</span>
        <span class="nav-act-name">${card[1]}</span>
        <span class="nav-act-note">${note}</span>
      </span>
      <span class="nav-act-caret" aria-hidden="true">\u25b8</span>
    </button>`;
    h += `<div class="nav-scenes ${isOpen ? "" : "hide"}" data-navscenes="${a}" style="--act:${card[2]}">`;
    keys.forEach(
      (k) =>
        (h += `<button class="navbtn ${!released(k) ? "locked" : ""}" data-view="scene:${k}">Scene ${SCENES[k].scene}${!released(k) ? " \u00b7 locked" : ""}</button>`),
    );
    h += `</div>`;
  }
  h +=
    '<div class="nav-title">Writing</div>' +
    navCard_("evidence", "Collect", "Evidence Bank", "Your saved quotations", "#7a5a42") +
    navCard_("essay", "Create", "Final Essay", "Seven stages, 28 points", "#6f1d2c");
  if (state.role !== "student")
    h +=
      '<div class="nav-title">Management</div>' +
      navCard_("manage", "Review", "Teacher Dashboard", "Marking, grades and Canvas", "#2e4057");
  if (state.role === "admin")
    h += navCard_("admin", "Manage", "Admin", "Accounts and access", "#4a4a70");
  if (typeof SIDEBAR_IMG !== "undefined")
    h += `<figure class="sidebar-art"><img src="${SIDEBAR_IMG}" alt="The three witches of Macbeth"><figcaption>“Fair is foul, and foul is fair”</figcaption></figure>`;
  document.getElementById("sidebar").innerHTML = h;
  // Folding is a sidebar-only concern: redraw the sidebar, leave the page alone.
  document.querySelectorAll(".nav-act").forEach(
    (b) =>
      (b.onclick = () => {
        let a = Number(b.dataset.navact);
        state.navAct = openNavAct() === a ? 0 : a;
        save();
        sidebar();
      }),
  );
  document.querySelectorAll(".navbtn").forEach(
    (b) =>
      (b.onclick = () => {
        let v = b.dataset.view;
        if (v.startsWith("scene:") && !released(v.split(":")[1]))
          return alert("This scene has not been released yet.");
        syncNavAct_(v);
        state.view = v;
        save();
        render();
      }),
  );
}

function home() {
  let vids = (ACTIVITIES.PRE || []).map(resourceCard).join("");
  let heroBg =
    typeof HERO_IMG !== "undefined"
      ? ` style="background-image:linear-gradient(135deg,rgba(12,9,10,.92),rgba(93,23,38,.86)),url('${HERO_IMG}')"`
      : "";
  let bannerBg =
    typeof BANNER_IMG !== "undefined"
      ? ` style="background-image:linear-gradient(120deg,rgba(8,6,7,.86),rgba(111,29,44,.72)),url('${BANNER_IMG}')"`
      : "";
  return `<section class="hero"${heroBg}><div class="pill">Interactive unit</div><h1>Macbeth</h1><p>Read Shakespeare’s original language, request side-by-side modern-language support, answer comprehension checks, collect evidence, and build an argument about the forces that drive Macbeth’s tragedy.</p><div class="chips"><span class="chip">5 acts · 28 scenes</span><span class="chip">Text evidence notebook</span><span class="chip">DOK scene responses</span><span class="chip">Modern-language support</span></div></section>${myGradesCard()}<div class="card"><strong>Learning Targets & Standards</strong><p>See the Common Core reading, writing, discussion, and language standards addressed across this unit.</p><button class="btn primary standards-btn openStandards">View Common Core Standards</button></div><div class="theme-banner"${bannerBg}><h2>The Essential Questions</h2><p>Use the three highlight colors throughout the play. Every highlighted passage should include a note explaining how the passage helps answer its essential question.</p></div><div class="grid3">${EQ.map((e, i) => `<div class="eq"><strong>${eqLabel(e)}</strong>${e.q}</div>`).join("")}</div><div class="card"><h2>Before Act 1: Build Context</h2><p>Complete these resources before beginning the play.</p>${vids}</div>`;
}

function myGradesCard() {
  let backend = typeof window !== "undefined" ? window.MACBETH_BACKEND : null;
  if (!backend || !backend.enabled || state.role !== "student") return "";
  let gs = backend.gradeSummary;
  if (!gs || !gs.acts) return "";
  let graded = [1, 2, 3, 4, 5].filter((a) => gs.acts[a] && gs.acts[a].possible > 0);
  if (!graded.length) return "";
  // Same rules as the teacher's gradebook: an Act the student has not started
  // is "Not started", never 0/77; an Act left out of the grade says so; and
  // written work that is waiting on the teacher is named, not silently zero.
  let cells = [1, 2, 3, 4, 5]
    .map((act) => {
      let a = gs.acts[act];
      let card = ACT_CARDS[act - 1];
      let head = `<span class="grade-pill-eyebrow">Act ${act}</span><span class="grade-pill-name">${esc(card[1])}</span>`;
      if (!a || !a.possible)

      let waiting = a.dokUnmarked
        ? `<div class="grade-pill-pending">${a.dokUnmarked} written response${a.dokUnmarked === 1 ? "" : "s"} waiting for your teacher</div>`

}

function resourceCard(r) {

function scene(key) {

    })

  return `<div class="sectionhead"><div><div class="pill">Act ${s.act}</div><h2>Scene ${s.scene}</h2></div></div><div class="reader-tools"><button id="supportBtn" class="btn modernbtn${state.modernOpen ? " active" : ""}">⇄ Modern Language</button>${EQ.map((e, i) => `<button class="btn hilite" data-eq="${e.id}" style="border-bottom:5px solid ${e.color}">${eqShortLabel(e)}</button>`).join("")}<span class="toolbar-note">Select words in the original text, then choose a highlight color.</span></div><div class="reader${state.modernOpen ? " support" : ""}" id="reader"><div class="pair-head"><h3>Original Text</h3><h3 class="pair-mod-head">Modern Language Support</h3></div><div class="textpane" id="originalPane">${readerRowsHtml(key, s, qbox)}</div></div><div class="question dok"><strong>End-of-Scene DOK Response</strong><p>${esc(qa[3])}</p><textarea id="dok" placeholder="Make a claim and use specific evidence from the scene...">${esc(state.dok[key] || "")}</textarea><p class="dok-note">Write this answer in your own words. Your writing time and any text you paste in are recorded and shown to your teacher.</p></div>${state.teacherResources && res ? `<h3>Extension / Teacher Resource</h3>${res}` : ""}${scenePager(key)}`;

// Splits a scene into speech blocks (a speaker heading plus the lines that
// follow it), so the original and the modern translation can be shown beside
// each other speech by speech instead of as two separate walls of text that
// drift apart. Never splits in the middle of a saved-evidence highlight, since
// that would tear the <mark> in half.
function splitSpeechBlocks(text) {
  let blocks = [];
  let cur = { speaker: "", lines: [] };
  let openMarks = 0;
  text.split("\n").forEach((line) => {
    let plain = line.replace(/<[^>]*>/g, "").trim();
    let letters = plain.replace(/[^A-Za-z]/g, "");
    let isSpeaker =
      !!letters && letters === letters.toUpperCase() && plain.length <= 30 && !STAGE_CUE.test(plain);
    if (isSpeaker && openMarks === 0 && cur.lines.length) {
      blocks.push(cur);
      cur = { speaker: plain, lines: [line] };
    } else {
      if (isSpeaker && !cur.lines.length) cur.speaker = plain;
      cur.lines.push(line);
    }
    openMarks += (line.match(/<mark/g) || []).length - (line.match(/<\/mark>/g) || []).length;
  });
  if (cur.lines.length) blocks.push(cur);
  return blocks;
}

// Pairs original blocks with modern ones. They line up exactly in most scenes;
// where a translation merges or splits a speech, this resyncs on the speaker
// name rather than letting every later row drift out of step.
function pairSpeechBlocks(orig, mod) {
  let rows = [];
  let i = 0,
    j = 0;
  while (i < orig.length || j < mod.length) {
    let o = orig[i],
      m = mod[j];
    if (!o) {
      rows.push([null, m]);
      j++;
      continue;
    }
    if (!m) {
      rows.push([o, null]);
      i++;
      continue;
    }
    if (o.speaker === m.speaker) {
      rows.push([o, m]);
      i++;
      j++;
      continue;
    }
    let mAhead = mod.slice(j + 1, j + 4).findIndex((b) => b.speaker === o.speaker);
    let oAhead = orig.slice(i + 1, i + 4).findIndex((b) => b.speaker === m.speaker);
    if (mAhead >= 0 && (oAhead < 0 || mAhead <= oAhead)) {
      rows.push([null, m]);
      j++;
    } else if (oAhead >= 0) {
      rows.push([o, null]);
      i++;
    } else {
      rows.push([o, m]);
      i++;
      j++;
    }
  }
  return rows;
}

function readerRowsHtml(key, s, qbox) {
  let original = injectLineNumbers(injectHighlights(esc(s.original), key), key);
  let modern = esc(s.modern || "");
  let rows = pairSpeechBlocks(splitSpeechBlocks(original), splitSpeechBlocks(modern));

  // Place the comprehension check after the speech that answers it. Falls back
  // to the end of the scene rather than the middle, so a question can never
  // appear before the passage it is asking about.
  let anchor = QUIZ_ANCHORS[key];
  let qIdx = rows.length - 1;
  if (anchor && anchor !== "END") {
    let needle = esc(anchor);
    let found = rows.findIndex((r) => r[0] && r[0].lines.join("\n").indexOf(needle) >= 0);
    if (found >= 0) qIdx = found;
  }

  return rows
    .map((r, i) => {
      let o = r[0] ? r[0].lines.join("\n") : "";
      let m = r[1] ? r[1].lines.join("\n") : "";
      let row = `<div class="pair-row"><div class="pair-orig">${o}</div><div class="pair-mod">${m}</div></div>`;
      return i === qIdx ? row + `<div class="pair-qbox">${qbox}</div>` : row;
    })
    .join("");
}

// ---------------------------------------------------------------------------
// Citing Macbeth (MLA 9)
//
// Every saved quote knows its scene, and the scene text knows its Folger line
// numbers (FOLGER_LINES, the same numbers printed in the margin), so the app can
// work out the citation itself: find the quote in the scene, see which spoken
// lines it covers, and write (act.scene.first–last). Nothing is stored -- it is
// worked out from the quote each time, so evidence saved before this existed
// gets a citation too.
const WORKS_CITED_URL_ = "www.folger.edu/explore/shakespeares-works/macbeth/read/";
const MLA_MONTHS_ = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
function mlaAccessDate_(d) {
  d = d || new Date();
  return d.getDate() + " " + MLA_MONTHS_[d.getMonth()] + " " + d.getFullYear();
}
// The Works Cited entry, as HTML (title in italics) or as plain text to copy.
function worksCitedEntry_(asHtml) {
  let title = asHtml ? "<i>Macbeth</i>" : "Macbeth";
  return `Shakespeare, William. ${title}. Edited by Barbara Mowat et al., Folger Shakespeare Library, ${WORKS_CITED_URL_}. Accessed ${mlaAccessDate_()}.`;
}
// MLA number ranges: the second number in full up to 99; after that only its
// last two digits, unless more are needed (25–28, 102–07, 88–116, 195–202).
function mlaLineRange_(a, b) {
  if (!(b > a)) return String(a);
  if (b < 100) return a + "–" + b;
  let sa = String(a), sb = String(b);
  if (sa.length === sb.length && sa.slice(0, -2) === sb.slice(0, -2)) return a + "–" + sb.slice(-2);
  return a + "–" + b;
}
// The margin numbers of a scene, one per spoken line -- exactly what
// injectLineNumbers() prints: Folger's numbers when the table fits the text,
// otherwise 1, 2, 3.
//
// Two repairs are made to the table's numbers on the way. Both are done here
// only, so the margin and the citations always agree:
//  - A run of three or more lines all given the same number is an
//    interpolation gap in the table (it opens 2.3, for example). When the next
//    number leaves room, the run is counted up one line at a time.
//  - A spoken line that opens with a direction in brackets, such as "(aside) …"
//    or "(reading) …", along with any lowercase lines that continue it, is
//    filed as a stage direction by spokenLineIndexes_, and so the table has no
//    number for it. Those lines get the numbers missing between their
//    neighbours. This covers a whole letter, and several much-quoted asides.
let __sceneNumbers = {};
function sceneLineNumbers_(key) {
  if (__sceneNumbers[key]) return __sceneNumbers[key];
  let s = SCENES[key];
  if (!s || !s.original) return null;
  let lines = esc(s.original).split("\n");
  let spoken = spokenLineIndexes_(lines);
  let folger = FOLGER_LINES[key];
  let useFolger = Array.isArray(folger) && folger.length === spoken.length;
  let nums = spoken.map((_, i) => (useFolger ? folger[i] : i + 1));
  if (useFolger) nums = spreadNumberRuns_(nums);
  let rows = spoken.map((li, i) => ({ li: li, n: nums[i] }))
    .concat(asideDialogueLines_(lines, spoken).map((li) => ({ li: li, n: null })))
    .sort((a, b) => a.li - b.li);
  if (useFolger) fillNumberGaps_(rows);
  else rows.forEach((r, i) => (r.n = i + 1));
  return (__sceneNumbers[key] = { spoken: rows.map((r) => r.li), numbers: rows.map((r) => r.n), lineCount: lines.length });
}
function spreadNumberRuns_(nums) {
  let out = nums.slice();
  for (let j = 0; j < out.length; ) {
    let e = j;
    while (e + 1 < out.length && out[e + 1] === out[j]) e++;
    let len = e - j + 1, next = out[e + 1];
    if (len >= 3 && (next === undefined || next - out[j] >= len)) for (let k = 0; k < len; k++) out[j + k] = out[j] + k;
    j = e + 1;
  }
  return out;
}
function asideDialogueLines_(lines, spoken) {
  let isSpoken = {};
  spoken.forEach((i) => (isSpoken[i] = true));
  let out = [], chain = false;
  lines.forEach((line, i) => {
    let text = line.replace(/<[^>]*>/g, "").replace(/&(amp|lt|gt|quot|#39);/g, (m, e) => ({ amp: "&", lt: "<", gt: ">", quot: '"', "#39": "'" })[e]).trim();
    if (isSpoken[i] || !text) { chain = false; return; }
    let after = (text.match(/^\([^)]*\)\s*(.*)$/) || [])[1] || "";
    if (/[A-Za-z].*[A-Za-z].*[A-Za-z]/.test(after)) { out.push(i); chain = true; return; }
    if (chain && /^[a-z]/.test(text)) { out.push(i); return; }
    chain = false;
  });
  return out;
}
function fillNumberGaps_(rows) {
  for (let j = 0; j < rows.length; ) {
    if (rows[j].n !== null) { j++; continue; }
    let e = j;
    while (e + 1 < rows.length && rows[e + 1].n === null) e++;
    let prev = j > 0 ? rows[j - 1].n : 0;
    let next = e + 1 < rows.length ? rows[e + 1].n : Infinity;
    for (let k = j; k <= e; k++) rows[k].n = Math.min(prev + 1 + (k - j), next);
    j = e + 1;
  }
}
// {first, last, lines} for a saved quote, or null when it can't be placed
// (a stage direction on its own, or text that no longer matches the scene).
function evidenceLineSpan_(item) {
  if (!item || !item.quote) return null;
  let key = item.act + "." + item.scene;
  let s = SCENES[key];
  let nums = sceneLineNumbers_(key);
  if (!s || !nums) return null;
  let text = s.original;
  let hit = findQuoteRange_(text, flattenForSearch_(text), item.quote, () => true);
  if (!hit) return null;
  let lineOf = (offset) => text.slice(0, offset).split("\n").length - 1;
  let from = lineOf(hit.start), to = lineOf(hit.end - 1);
  let inside = [];
  nums.spoken.forEach((lineIdx, i) => { if (lineIdx >= from && lineIdx <= to) inside.push(i); });
  if (!inside.length) return null;
  let first = nums.numbers[inside[0]], last = nums.numbers[inside[inside.length - 1]];
  // A speaker heading between the first and last line means two voices.
  let headings = 0;
  let lines = esc(text).split("\n");
  for (let li = nums.spoken[inside[0]] + 1; li < nums.spoken[inside[inside.length - 1]]; li++) {
    let t = lines[li].replace(/&(amp|#39|quot);/g, "&").trim();
    let letters = t.replace(/[^A-Za-z]/g, "");
    if (letters && letters === letters.toUpperCase() && t.length <= 30 && nums.spoken.indexOf(li) === -1) headings++;
  }
  return { first: first, last: last, lines: inside.length, speakers: headings + 1 };
}
function evidenceCitation_(item) {
  let span = evidenceLineSpan_(item);
  return span ? `(${item.act}.${item.scene}.${mlaLineRange_(span.first, span.last)})` : `(${item.act}.${item.scene})`;
}
// What the Copy button puts on the clipboard: the quote, in quotation marks, on
// one line, followed by its citation. The paste recogniser below knows this
// shape, so pasting it into the essay counts as quoting the play, not as an
// outside paste.
function evidenceCopyText_(item) {
  // Quotation marks inside the quote become single ones, as MLA asks.
  let q = String(item.quote || "").replace(/\s+/g, " ").trim().replace(/[“]/g, "‘").replace(/[”]/g, "’").replace(/"/g, "'");
  return `“${q}” ${evidenceCitation_(item)}`;
}
// A short hint about how to set the quote in the essay, by length.
function evidenceQuoteHint_(item) {
  let span = evidenceLineSpan_(item);
  if (!span) return "Couldn't find the line numbers for this one. Check the margin of the scene and cite the lines yourself.";
  if (span.speakers > 1) return "More than one character speaks here: set it off as a block quote with each character's name in capitals (How to Cite Macbeth, section 6).";
  if (span.lines >= 4) return `${span.lines} lines: if it's poetry, set it off as a block quote. If it's prose, block-quote it only if it runs past four lines in your essay.`;
  if (span.lines >= 2) return `${span.lines} lines: if it's poetry, mark each line break with a slash ( / ).`;
  return "";
}
function evidenceCiteHtml_(item) {
  let hint = evidenceQuoteHint_(item);
  return `<div class="cite-row"><span class="cite-chip" title="MLA citation: act.scene.lines">${esc(evidenceCitation_(item))}</span><button type="button" class="btn cite-copy-btn copyEvidenceCite" data-id="${esc(item.id)}">Copy quote + citation</button>${hint ? `<small class="cite-hint">${esc(hint)}</small>` : ""}</div>`;
}

// Copying from inside the app: the Clipboard API first, then the older
// select-and-copy route, which still works inside the Apps Script frame when
// the newer one is blocked. Says so on the button either way.
async function copyText_(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    try {
      let ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    } catch (e2) {
      ok = false;
    }
  }
  if (btn) {
    let old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = ok ? "Copied ✓" : "Couldn't copy — select and copy it yourself";
    setTimeout(() => { if (btn.isConnected) btn.textContent = old; }, 1800);
  }
  return ok;
}

// The guide. Written for this unit and this app; examples use placeholders
// rather than lines of the play.
function citeGuideHtml_() {
  let ex = (t) => `<span class="cite-ex">${t}</span>`;
  return `<div class="cite-guide">
    <p class="cite-lede">Every time you quote or paraphrase a specific moment in the play, say exactly where it is. Use MLA style: act, scene and line numbers.</p>
    <section><h4>1. The numbers</h4>
      <p>${ex("(3.4.122–24)")} means Act 3, Scene 4, lines 122 to 124. Use numerals, separate them with periods, and don't add spaces or the word "line."</p>
      <p>The line numbers are the small numbers in the margin of the play, next to every fifth line; count from the nearest one. <strong>Your Evidence Bank works them out for you</strong>: every saved quote shows its citation and has a Copy button.</p>
      <p class="cite-note">These are the Folger edition's line numbers. This app's text is lightly modernized, so now and then a number can be a line or two off from the printed Folger text. If your teacher wants exact numbers, check the line on the Folger website.</p>
    </section>
    <section><h4>2. Where the citation goes</h4>
      <p>Put it after the closing quotation mark and before the period:</p>
      <p class="cite-model">… as Macbeth admits, “[quoted words]” ${ex("(1.7.25–28)")}<strong>.</strong></p>
      <p>A question mark or exclamation point that belongs to the quote stays inside the quotation marks, and the period still follows the citation: “[quoted words]?” ${ex("(2.2.73)")}.</p>
      <p>Paraphrases need citations too. If you put a specific moment in your own words, cite it: Macbeth admits that nothing drives him but ambition ${ex("(1.7.25–28)")}.</p>
    </section>
    <section><h4>3. The first citation</h4>
      <p>The first time you cite the play, include Shakespeare's name unless your sentence already names him: ${ex("(Shakespeare 1.3.38)")}. After that, while it's clear you are still quoting <i>Macbeth</i>, the numbers alone are enough: ${ex("(2.2.60–61)")}.</p>
    </section>
    <section><h4>4. Quoting poetry (verse)</h4>
      <p>Most of <i>Macbeth</i> is written in lines of poetry, and the way you quote them depends on how many lines you use.</p>
      <ul>
        <li><strong>One line:</strong> quote it inside your own sentence.</li>
        <li><strong>Two or three lines:</strong> keep them in your sentence and mark each line break with a slash that has a space on each side: “[first line] / [second line]” ${ex("(2.1.44–45)")}.</li>
        <li><strong>Four or more lines:</strong> use a block quote. Start it on a new line, indent it half an inch, and leave off the quotation marks. Keep the original line breaks, and put the citation after the final punctuation.</li>
      </ul>
    </section>
    <section><h4>5. Quoting prose</h4>
      <p>Some scenes are written in prose, not poetry: the Porter's speech, the letter from Macbeth that Lady Macbeth reads aloud, and the sleepwalking scene are examples. Prose has no line breaks to mark, so leave out the slashes. You still cite it by act, scene and line.</p>
    </section>
    <section><h4>6. Quoting a conversation</h4>
      <p>When you quote two or more characters speaking to each other, use a block quote. Start each speech with the character's name in capital letters followed by a period, like LADY MACBETH. Put the citation at the end.</p>
    </section>
    <section><h4>7. Changing a quote to fit your sentence</h4>
      <p>Put any word you add or change in square brackets, e.g. “[he]” instead of “I.” Use three spaced periods ( . . . ) where you leave words out. Never change what the line means.</p>
    </section>
    <section><h4>8. Works Cited</h4>
      <p>End your essay with a Works Cited page. Put the title <strong>Works Cited</strong> at the top, centered, and use a hanging indent (every line after the first is indented half an inch). The line numbers in this app are the Folger edition's, so cite the Folger text:</p>
      ${worksCitedBoxHtml_()}
    </section>
  </div>`;
}
