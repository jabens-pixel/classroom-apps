// Writing-process record
//
// For every writing box the app records, per character, how the text arrived:
//   t  typed here                     (not stored -- anything unmarked)
//   p  pasted from outside the app    (flagged to the teacher)
//   q  moved in from the student's own writing in this app (not flagged)

//      reported as typed)

//

// discussion post first). Every other box blocks outside paste -- the drafting
// is meant to happen in the student's own words -- but always lets a student
// move their OWN sentences between stages, which revising needs.
//

// ---- The story arc ---------------------------------------------------------------
// x is story time, y is tension. The Lead sits at the Callback's height, joined
// by a dashed line: it opens on that moment, then the story rewinds.
const ARC_LABELS = {
  lead: [52, 28, "start"], beginning: [106, 134, "start"], rising: [372, 120, "middle"],
  callback: [600, 66, "middle"], climax: [742, 22, "start"], sowhat: [856, 130, "middle"]
};
function arcSvg_(currentKey, opts) {
  opts = opts || {};
  let nodes = STAGES.map((s, i) => {
    let [x, y] = ARC_POINTS[s.key];
    let st = pieceStatus_(s.key);
    let done = st.kind === "turned" || st.kind === "graded";
    let here = s.key === currentKey;
    let locked = st.kind === "locked";
    let [lx, ly, anchor] = ARC_LABELS[s.key];
    let label = `${i + 1} ${s.short}${here ? " · you are here" : ""}`;
    let dot = here
      ? `<circle cx="${x}" cy="${y}" r="14" class="arc-ring" style="stroke:${s.color}"/><circle cx="${x}" cy="${y}" r="7.5" style="fill:${s.color}"/>`
      : done
        ? `<circle cx="${x}" cy="${y}" r="9" style="fill:${s.color}"/>`
        : `<circle cx="${x}" cy="${y}" r="8.5" class="arc-open ${locked ? "is-locked" : ""}" style="stroke:${locked ? "var(--line-2)" : s.color}"/>`;
    return `<g class="arc-node ${here ? "is-here" : ""}" data-view="stage:${s.key}" tabindex="0" role="link" aria-label="Stage ${i + 1}, ${esc(s.label)}: ${esc(st.label)}">
      <circle cx="${x}" cy="${y}" r="22" class="arc-hit"/>${dot}
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" class="arc-label ${here ? "is-here" : ""}" ${here ? `style="fill:${s.color}"` : ""}>${esc(label)}</text></g>`;
  }).join("");

    <path d="${ARC_PATH}" class="arc-track"/>
    ${cur && currentKey !== "lead" ? `<path d="${ARC_PATH}" class="arc-progress" pathLength="100" style="stroke-dasharray:${arcProgressPct_(currentKey)} 100"/>` : ""}

function setPosterStatus_(text, kind) {
  let el = document.getElementById("posterStatus");
  if (el) { el.textContent = text || ""; el.className = "poster-status " + (kind || ""); }
}
function wrapCanvasText_(ctx, text, maxWidth) {
  let lines = [];
  String(text).split(/\n+/).forEach((para, idx, all) => {
    let line = "";
    para.split(/\s+/).filter(Boolean).forEach((word) => {
      let test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
      else line = test;
    });
    if (line) lines.push(line);
    if (idx < all.length - 1) lines.push("");
  });
  return lines;
}
async function posterFontsReady_() {
  try {
    await Promise.all([document.fonts.load('400 54px "Instrument Serif"'), document.fonts.load('400 19px "Literata"'), document.fonts.load('italic 400 20px "Literata"')]);
  } catch (e) {}
}
async function drawPoster_(bgImg) {
  await posterFontsReady_();
  let wrap = document.getElementById("posterPreview");
  if (!wrap) return;
  let canvas = document.getElementById("posterCanvas");
  if (!canvas) { wrap.innerHTML = `<canvas id="posterCanvas" class="poster-canvas" role="img" aria-label="Your memoir poster"></canvas>`; canvas = document.getElementById("posterCanvas"); }
  let ctx = canvas.getContext("2d");
  let W = 1000, pad = 76, maxW = W - pad * 2, lh = 31, pgap = 20;
  let title = (state.memoir.poster.title || "").trim() || "My Memoir";
  let byline = (state.memoir.poster.author || "").trim();
  let titleFont = '400 54px "Instrument Serif", Georgia, serif';
  let bodyFont = '400 19px "Literata", Georgia, serif';
  ctx.font = titleFont;
  let titleLines = wrapCanvasText_(ctx, title, maxW).filter(Boolean);
  ctx.font = bodyFont;
  let paras = STAGE_KEYS.map((k) => stageText_(k).trim()).filter(Boolean);
  if (!paras.length) paras = ["(Nothing written yet — write your memoir first.)"];
  let wrapped = paras.map((t) => wrapCanvasText_(ctx, t, maxW));
  let h = pad + titleLines.length * 60 + (byline ? 44 : 10) + 44;
  wrapped.forEach((ls) => { h += ls.length * lh + pgap; });
  h = Math.max(1300, Math.round(h + pad));
  canvas.width = W; canvas.height = h;
  if (bgImg) {
    let sc = Math.max(W / bgImg.width, h / bgImg.height);
    let sw = W / sc, sh = h / sc;
    ctx.drawImage(bgImg, (bgImg.width - sw) / 2, (bgImg.height - sh) / 2, sw, sh, 0, 0, W, h);
    let g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(14,16,21,0.50)"); g.addColorStop(0.25, "rgba(14,16,21,0.66)"); g.addColorStop(1, "rgba(14,16,21,0.74)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
  } else {
    let g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#1C2029"); g.addColorStop(1, "#12141A");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
    // The unit's story arc, faint, behind the title.
    ctx.save(); ctx.globalAlpha = 0.22; ctx.strokeStyle = "#E9A94B"; ctx.lineWidth = 3;
    let p = new Path2D("M90,118 C135,113 275,104 360,90 C445,76 540,48 600,36 C660,24 677,5 720,16 C763,27 837,86 860,100");
    ctx.translate(40, 40); ctx.stroke(p); ctx.restore();
  }
  ctx.textAlign = "center"; ctx.fillStyle = "#F3EFE7"; ctx.font = titleFont;
  let y = pad + 44;
  titleLines.forEach((l) => { ctx.fillText(l, W / 2, y); y += 60; });
  if (byline) { ctx.font = 'italic 400 20px "Literata", Georgia, serif'; ctx.fillStyle = "#D8D3C8"; ctx.fillText("By " + byline, W / 2, y + 2); y += 44; }
  ctx.fillStyle = "rgba(233,169,75,0.85)"; ctx.fillRect(W / 2 - 28, y - 6, 56, 2); y += 44;
  ctx.textAlign = "left"; ctx.font = bodyFont; ctx.fillStyle = "#EFEBE3";
  wrapped.forEach((ls) => { ls.forEach((l) => { ctx.fillText(l, pad, y); y += lh; }); y += pgap; });
  posterDrawn_ = true;
  ["downloadPosterBtn", "turnInPosterBtn"].forEach((id) => { let bt = document.getElementById(id); if (bt) bt.disabled = false; });
}
// A copy small enough to store with the class: a JPEG that fits in the
// POSTERS tab's eight cells.
function posterJpeg_() {
  let canvas = document.getElementById("posterCanvas");
  if (!canvas) return null;
  let tries = [[900, 0.82], [820, 0.76], [720, 0.72], [640, 0.66], [560, 0.6], [480, 0.55]];
  for (let i = 0; i < tries.length; i++) {
    let [w, q] = tries[i];
    let scale = Math.min(1, w / canvas.width);
    let c2 = document.createElement("canvas");
    c2.width = Math.round(canvas.width * scale); c2.height = Math.round(canvas.height * scale);
    c2.getContext("2d").drawImage(canvas, 0, 0, c2.width, c2.height);
    let url = c2.toDataURL("image/jpeg", q);
    let b64 = url.slice(url.indexOf(",") + 1);
    if (b64.length <= 350000) return { image: b64, mimeType: "image/jpeg", width: c2.width, height: c2.height };
  }
  return null;
}
function downloadBlob_(blob, name) {
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function downloadDraft_() {
  let content = ((state.memoir.poster.title || "").trim() || "My Memoir") + "\n" + "=".repeat(40) + "\n\n";
  STAGES.forEach((s) => {
    let label = s.label.toUpperCase();
    content += label + "\n" + "-".repeat(label.length) + "\n" + (stageText_(s.key).trim() || "(not written yet)") + "\n\n";
  });
  downloadBlob_(new Blob([content], { type: "text/plain" }), "memoir-draft.txt");
}

      return `<div class="grade-card is-quiet" style="--acc:${color}">${head}<span class="grade-status">Not turned in yet</span></div>`;

  }).join("");

// BackendClient replaces these once a class is connected.
function manage() {
  return `<div class="page-head"><h1 class="page-title">Teacher Dashboard</h1><p class="page-sub">The dashboard, grading tiles and gradebook appear here when the app is opened from its deployed web-app link and you are signed in as an authorized teacher.</p></div>`;
}
function gradeScreen() { return manage(); }
function admin() { return manage(); }

// ===========================================================================
// bind(): re-attach every handler after each render
// ===========================================================================
function autoGrow_(el, min) {
  if (!el) return;
  el.style.height = "auto";
  el.style.height = Math.max(min || 160, el.scrollHeight + 3) + "px";
}
function refreshStatusUI_(key) {
  let st = pieceStatus_(key);
  let chip = document.getElementById("stageStatus");
  if (chip) chip.innerHTML = statusChip_(st);
  let rc = document.getElementById("reviewChip-" + key);
  if (rc) rc.innerHTML = statusChip_(st);
  let area = document.getElementById("turnInArea");
  if (area) { area.innerHTML = turnInAreaHtml_(key, flowNeighbours_("stage:" + key).next); bindViewButtons_(area); bindTurnIn_(); }
  // The sidebar only needs redrawing when a status actually changes.
  refreshStatusUI_.last = refreshStatusUI_.last || {};
  let sig = st.kind + "|" + pieceStatus_(MEMOIR_FINAL_KEY).kind;
  if (refreshStatusUI_.last[key] !== sig) { refreshStatusUI_.last[key] = sig; sidebar(); }
}
function bindViewButtons_(root) {
  (root || document).querySelectorAll("button[data-view], a[data-view]").forEach((b) => {
    if (b.closest("#sidebar")) return;
    b.onclick = (e) => { e.preventDefault(); go_(b.dataset.view); };
  });
}
function bindTurnIn_() {
  let t = document.getElementById("turnInBtn");
  if (t) t.onclick = () => {
    let key = t.dataset.stage;
    if (!submissionOf_(key).text) return showToast("Write something first, then turn it in.");
    markSubmitted_(key);
    save();
    renderKeepScroll_();
    showToast(STAGE_BY_KEY[key].label + " turned in. You can keep revising — turn it in again if you change it.");
  };
}
function bindStageWriter_(key) {
  let box = document.getElementById("writerBox");
  if (!box) return;
  let back = document.getElementById("writerBackdrop");
  const log = () => (state.memoir.cadence[key] = Array.isArray(state.memoir.cadence[key]) ? state.memoir.cadence[key] : []);
  const paint = () => {
    back.innerHTML = highlightedHtml_(stageText_(key), highlightOn_() ? log() : []);
    let c = cadenceCounts_(log());
    let bal = document.getElementById("hlBalance");
    if (bal) bal.innerHTML = hlBalanceHtml_(c);
    let u = document.getElementById("tagUndo");
    if (u) u.disabled = !log().length;
    let tip = document.getElementById("hlTip");
    if (tip) { let t = cadenceTip_(log()); tip.textContent = t; tip.classList.toggle("show", !!t); }
  };
  autoGrow_(box, 240);
  attachWritingBox_(box, key, {
    onEdit: (prev, next) => { state.memoir.cadence[key] = shiftLog_(log(), prev, next); },
    afterEdit: () => { autoGrow_(box, 240); paint(); refreshProcessLine_(key); refreshStatusUI_(key); }
  });
  const tag = (type) => {
    let s = box.selectionStart, e = box.selectionEnd;
    let v = box.value;
    while (s < e && /\s/.test(v[s])) s++;
    while (e > s && /\s/.test(v[e - 1])) e--;
    if (s === e) return showToast("Select a phrase or sentence in your writing first, then choose Internal or External.");
    let cand = { start: s, end: e };
    state.memoir.cadence[key] = cutOverlap_(log(), cand).concat([{ type, start: s, end: e }]);
    save();
    paint();
    box.focus();
    box.setSelectionRange(e, e);
  };
  ["tagInternal", "tagExternal", "tagUndo"].forEach((id) => {
    let b = document.getElementById(id);
    // Keep the student's selection alive while they reach for the button.
    if (b) b.onmousedown = (ev) => ev.preventDefault();
  });
  let ti = document.getElementById("tagInternal"); if (ti) ti.onclick = () => tag("internal");
  let te = document.getElementById("tagExternal"); if (te) te.onclick = () => tag("external");
  let tu = document.getElementById("tagUndo");
  if (tu) tu.onclick = () => { let l = log(); if (!l.length) return; l.pop(); save(); paint(); };
}
function bindReview_() {
  document.querySelectorAll(".review-input").forEach((ta) => {
    let key = ta.dataset.stage;
    autoGrow_(ta, 120);
    attachWritingBox_(ta, key, {
      onEdit: (prev, next) => { state.memoir.cadence[key] = shiftLog_(state.memoir.cadence[key] || [], prev, next); },
      afterEdit: () => { autoGrow_(ta, 120); refreshProcessLine_(key); refreshStatusUI_(key); refreshFinalUI_(); }
    });
  });
  let re = document.getElementById("reviewEdit");
  if (re) re.onclick = () => { state.memoir.reviewMode = "edit"; save(); renderKeepScroll_(); };
  let rr = document.getElementById("reviewRead");
  if (rr) rr.onclick = () => { state.memoir.reviewMode = "read"; save(); renderKeepScroll_(); };
  document.querySelectorAll(".band-btn").forEach((b) => (b.onclick = () => {
    let c = b.dataset.crit;
    state.memoir.selfEval[c] = b.dataset.band;
    save();
    b.parentElement.querySelectorAll(".band-btn").forEach((x) => x.classList.toggle("selected", x === b));
    let d = document.getElementById("bandDesc-" + c.replace(/[^A-Za-z]/g, ""));
    if (d) d.textContent = MEMOIR_RUBRIC[c][Number(b.dataset.band)];
  }));
  document.querySelectorAll(".self-comment").forEach((t) => (t.oninput = () => { state.memoir.selfComments[t.dataset.crit] = t.value; save(); }));
  let tf = document.getElementById("turnInFinalBtn");
  if (tf) tf.onclick = () => {
    if (!assembledText_()) return showToast("Write your memoir first.");
    markSubmitted_(MEMOIR_FINAL_KEY);
    save();
    renderKeepScroll_();
    showToast("Final Memoir turned in.");
  };
  let dd = document.getElementById("downloadDraftBtn");
  if (dd) dd.onclick = downloadDraft_;
}
function refreshFinalUI_() {
  let tf = document.getElementById("turnInFinalBtn");
  if (!tf) return;
  let fin = submissionOf_(MEMOIR_FINAL_KEY);
  tf.disabled = !fin.text || fin.submitted;
  tf.className = "btn " + (fin.submitted ? "btn-done" : "btn-primary");
  tf.innerHTML = fin.submitted ? icon("check") + " Final Memoir turned in" : fin.changed ? "Turn in again" : "Turn in Final Memoir";
}
function bindPoster_() {
  let redraw = () => { if (posterDrawn_) { clearTimeout(bindPoster_._t); bindPoster_._t = setTimeout(() => drawPoster_(posterBg_), 250); } };
  [["posterTitle", "title"], ["posterAuthor", "author"], ["posterHint", "hint"]].forEach(([id, f]) => {
    let el = document.getElementById(id);
    if (el) el.oninput = () => { state.memoir.poster[f] = el.value; save(); if (f !== "hint") redraw(); };
  });
  let plain = document.getElementById("plainBtn");
  if (plain) plain.onclick = () => { posterBg_ = null; drawPoster_(null); setPosterStatus_(""); };
  let dl = document.getElementById("downloadPosterBtn");
  if (dl) dl.onclick = () => {
    let c = document.getElementById("posterCanvas");
    if (!c) return;
    try { c.toBlob((blob) => blob ? downloadBlob_(blob, "memoir-poster.png") : showToast("Couldn't prepare the download — right-click the poster and choose Save Image."), "image/png"); }
    catch (e) { showToast("Couldn't download — right-click the poster and choose Save Image."); }
  };
  let paint = document.getElementById("paintBtn");
  if (paint) paint.onclick = () => showToast("Painted backgrounds work once the app is opened from your class link.");
  let st = document.getElementById("suggestTitleBtn");
  if (st) st.onclick = () => showToast("Title ideas work once the app is opened from your class link.");
  let tp = document.getElementById("turnInPosterBtn");
  if (tp) tp.onclick = () => showToast("Turning in a poster works once the app is opened from your class link. You can still download it.");
  if (!posterDrawn_ && !(backend_() && backend_().poster && backend_().poster.savedAt)) { /* nothing drawn yet */ }
}
function bindShareLocal_() {
  let post = document.getElementById("postLeadBtn");
  if (post) post.onclick = () => {
    let text = stageText_("lead").trim();
    if (!text) return;
    state.localShare = Array.isArray(state.localShare) ? state.localShare : [];
    let mine = state.localShare.find((p) => p.email === "you@local");
    let now = new Date().toISOString();
    if (mine) { mine.text = text; mine.updatedAt = now; }
    else state.localShare.push({ id: "local-" + Date.now(), name: "You", email: "you@local", text, date: now, updatedAt: now, replies: [] });
    save(); renderKeepScroll_();
  };
  document.querySelectorAll(".replyToggle").forEach((b) => (b.onclick = () => {
    let f = b.parentElement.querySelector(".reply-compose");
    if (f) { f.classList.remove("hide"); b.classList.add("hide"); let t = f.querySelector("textarea"); if (t) t.focus(); }
  }));
  document.querySelectorAll(".replyCancel").forEach((b) => (b.onclick = () => {
    let f = b.closest(".reply-compose");
    if (f) { f.classList.add("hide"); let t = f.parentElement.querySelector(".replyToggle"); if (t) t.classList.remove("hide"); }
  }));
  document.querySelectorAll(".replySubmit").forEach((b) => (b.onclick = () => {
    let ta = b.closest(".reply-compose").querySelector("textarea");
    let p = (state.localShare || []).find((x) => x.id === b.dataset.postid);
    if (!p || !ta.value.trim()) return;
    p.replies.push({ id: "r" + Date.now(), name: "You", email: "you@local", text: ta.value.trim(), date: new Date().toISOString() });
    save(); renderKeepScroll_();
  }));
  let rf = document.getElementById("refreshShareBtn");
  if (rf) rf.onclick = () => renderKeepScroll_();
}
function bind() {
  document.querySelectorAll("[data-role]").forEach((b) => {
    b.classList.toggle("active", b.dataset.role === state.role);
    b.onclick = () => { state.role = b.dataset.role; save(); render(); };
  });
  let nt = document.getElementById("navToggle");
  if (nt) nt.onclick = () => document.body.classList.toggle("nav-open");
  bindViewButtons_(document.getElementById("app"));
  document.querySelectorAll(".arc-node").forEach((g) => {
    g.onclick = () => go_(g.dataset.view);
    g.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go_(g.dataset.view); } };
  });
  let ft = document.getElementById("focusToggle");
  if (ft) ft.onclick = () => { state.focus = !state.focus; saveNav_(); renderKeepScroll_(); if (state.focus) { let w = document.getElementById("writerBox"); if (w) w.focus({ preventScroll: true }); } };
  let sm = document.getElementById("supportMore");
  if (sm) sm.onclick = () => { state.scaffold = "more"; save(); renderKeepScroll_(); };
  let sl = document.getElementById("supportLess");
  if (sl) sl.onclick = () => { state.scaffold = "less"; save(); renderKeepScroll_(); };
  document.querySelectorAll(".checkBox").forEach((c) => (c.onchange = () => {
    let key = c.dataset.stage, i = Number(c.dataset.idx);
    state.memoir.checks[key][i] = c.checked;
    c.closest(".check-item").classList.toggle("is-checked", c.checked);
    save();
  }));
  let v = String(state.view || "");
  if (v.indexOf("stage:") === 0) bindStageWriter_(v.slice(6));
  bindTurnIn_();
  let coach = document.getElementById("coachBtn");
  if (coach) coach.onclick = () => showToast("The writing coach works once the app is opened from your class link.");
  if (v === "review") bindReview_();
  if (v === "poster") bindPoster_();
  if (v === "share") bindShareLocal_();
  let rm = document.getElementById("refreshMyWork");
  if (rm) rm.onclick = () => renderKeepScroll_();
  bindReleaseControls_();
}

// Every release control on the page, in one place, so anything that repaints
// part of the page on its own (the grading tiles recount every minute) can
// re-attach them without re-running bind(). Assigning twice is harmless.
function bindReleaseControls_() {
  document.querySelectorAll(".stepRelease").forEach((c) => (c.onchange = (ev) => {
    if (ev) ev.stopPropagation();
    state.releasedSteps = Object.assign({}, state.releasedSteps || {});
    state.releasedSteps[c.dataset.step] = c.checked;
    save();
    renderKeepScroll_();
  }));
  document.querySelectorAll(".classToggle").forEach((c) => (c.onchange = (ev) => {
    if (ev) ev.stopPropagation();
    state[c.dataset.flag] = c.checked;
    save();
    renderKeepScroll_();
  }));
}

function render() {
  sidebar();
  let app = document.getElementById("app");
  let v = String(state.view || "home");
  document.body.dataset.view = v.split(":")[0];
  // Focus belongs to the writing page, not to the viewer: a teacher previewing
  // a stage sees exactly what a student sees.
  document.body.classList.toggle("focus-mode", !!state.focus && v.indexOf("stage:") === 0 && released_(v.slice(6)));
  if (v.indexOf("stage:") === 0) app.innerHTML = stagePage(v.slice(6));
  else if (v === "share") app.innerHTML = sharePage();
  else if (v === "review") app.innerHTML = reviewPage();
  else if (v === "poster") app.innerHTML = posterPage();
  else if (v === "grades") app.innerHTML = gradesPage();
  else if (v === "manage") app.innerHTML = manage();
  else if (v === "grade") app.innerHTML = gradeScreen();
  else if (v === "admin") app.innerHTML = admin();
  else { state.view = "home"; app.innerHTML = home(); }
  if (v !== "poster") posterDrawn_ = false;
  bind();
  navSync_();
}

(function bindModalBackdropDismiss() {
  const root = document.getElementById("modalRoot");
  if (!root) return;
  root.addEventListener("click", (e) => {
    if (e.target && e.target.classList && e.target.classList.contains("modal")) {
      const dismiss = e.target.querySelector(".modal-dismiss");
      if (dismiss) dismiss.click(); else root.innerHTML = "";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !root.innerHTML && document.body.classList.contains("focus-mode")) {
      state.focus = false; saveNav_(); renderKeepScroll_(); return;
    }
    if (e.key !== "Escape" || !root.innerHTML) return;
    const dismiss = root.querySelector(".modal-dismiss");
    if (dismiss) dismiss.click(); else root.innerHTML = "";
  });
})();
__MB.AppLogic = 'ok';
</script>
