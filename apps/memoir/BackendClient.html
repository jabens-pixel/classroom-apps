<script>
window.__MB = window.__MB || {}; __MB.BackendClient = 'started';
window.addEventListener("error", function (event) {
  try {
    const app = document.getElementById("app");
    if (app && !(window.MEMOIR_BACKEND && window.MEMOIR_BACKEND.ready))
      app.innerHTML = '<div class="card"><h2 class="card-title">Memoir could not finish loading</h2><p>' + String(event.message || "A browser error occurred.").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]) + '</p><p class="muted-note">Open the app from its web-app link in a new tab, signed into your school Google account.</p></div>';
  } catch (e) {}
});
// ===========================================================================
// BACKEND CLIENT
//
// Connects the app to the class backend. Every function it replaces is kept in
// `original`, and each override falls back to it when there is no backend --
// that is how one codebase gives a working offline preview AND a class-backed
// app. Keep that pattern; do not fold the two branches together.
// ===========================================================================
(function () {
  if (typeof save !== "function" || typeof render !== "function" || typeof bind !== "function") {
    const appRoot = document.getElementById("app");
    if (appRoot) appRoot.innerHTML = '<div class="card"><h2 class="card-title">Memoir could not start</h2><p>AppLogic did not load. Check the include lines in Index.html.</p></div>';
    return;
  }
  const backend = {
    enabled: typeof google !== "undefined" && google.script && google.script.run,
    ready: false,
    user: null,
    classes: [],
    activeClassId: "",
    dashboard: null,
    dashboardCache: {},
    access: [],
    discussion: [],
    gradeSummary: null,
    poster: null,
    posterImage: null,
    aiConfigured: true,
    saveTimer: null, saveRetryTimer: null, saveInFlight: false, saveDirty: false, saveFails: 0,
    serverUpdatedAt: "",
    needsName: false,
    gradingHub: null, gradingHubCache: {}, gradingHubPending: {},
    gradeKey: "", gradeCache: {}, gradePending: {}, hideUnsubmitted: false, markView: "paste", gradeFocusEmail: "",
    teacherSavePromises: new Set(),
    rosterOpen: false,
    canvas: null,
    asgBusy: {},
    posterImages: {}
  };
  window.MEMOIR_BACKEND = backend;
  const original = { save, render, bind, manage, gradeScreen, admin };

  function rpc(name, arg) {
    return new Promise((resolve, reject) => {
      if (!backend.enabled) return reject(new Error("The class backend is only available in the deployed web app."));
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e))));
      try { if (arg === undefined) runner[name](); else runner[name](arg); } catch (e) { reject(e); }
    });
  }
  backend.rpc = rpc;
  // Grading saves are asynchronous. Navigation, recounts and Canvas pushes wait
  // for the exact saves the teacher just made, instead of racing them.
  function trackTeacherSave_(p) {
    if (!p || typeof p.then !== "function") return p;
    backend.teacherSavePromises.add(p);
    const clear = () => backend.teacherSavePromises.delete(p);
    p.then(clear, clear);
    return p;
  }
  async function waitForTeacherSaves_() {
    while (backend.teacherSavePromises.size) await Promise.allSettled(Array.from(backend.teacherSavePromises));
  }

  // ---- Normalise at the door ---------------------------------------------------
  // Apps Script hands the browser `undefined` where the server returned null,
  // and Sheets turns numeric-looking text into numbers. Everything is
  // normalised the moment it arrives, so no comparison downstream has to know.
  function hasScore_(v) { return v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v)); }
  function normScore_(v) { return hasScore_(v) ? Number(v) : null; }
  function normalizeGradeSummary_(gs) {
    let m = gs && gs.memoir;
    if (!m) return gs || null;
    Object.keys(m.steps || {}).forEach((k) => {
      let r = m.steps[k];
      r.score = normScore_(r.score); r.teacherScore = normScore_(r.teacherScore);
      ["excluded", "auto", "submitted", "draft", "teacherGradedDraft", "editedAfterGrading", "markedBlank", "passFail"].forEach((f) => (r[f] = r[f] === true));
      r.comment = String(r.comment || "");
    });
    Object.keys(m.criteria || {}).forEach((c) => {
      let r = m.criteria[c];
      r.score = normScore_(r.score); r.teacherScore = normScore_(r.teacherScore);
      r.excluded = r.excluded === true; r.pending = r.pending === true;
      r.selfEvalIdx = r.selfEvalIdx === undefined || r.selfEvalIdx === null ? "" : r.selfEvalIdx;
      r.comment = String(r.comment || "");
    });
    let t = m.finalTotal || (m.finalTotal = {});
    t.earned = Number(t.earned || 0); t.possible = Number(t.possible || 0);
    ["hasAnyResult", "submitted", "complete", "teacherGradedDraft", "editedAfterGrading", "draft"].forEach((f) => (t[f] = t[f] === true));
    return gs;
  }
  backend.__normalizeGradeSummary = normalizeGradeSummary_;

  function localKey() {
    return backend.user && backend.activeClassId && backend.user.role === "student"
      ? `${APP_KEY}:${backend.user.email}:${backend.activeClassId}` : APP_KEY + ":teacher";
  }
  function safeLSGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeLSSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function currentClass() { return backend.classes.find((c) => c.classId === backend.activeClassId) || null; }
  function parseSettings(json, fallback) {
    if (fallback) return fallback;
    try { return JSON.parse(json || "{}"); } catch (e) { return {}; }
  }
  function applyClassSettings_(s) {
    s = s || {};
    state.releasedSteps = Object.assign({}, s.releasedSteps || {});
    state.aiCoach = s.aiCoach !== false;
    state.aiPoster = s.aiPoster !== false;
    state.leadPaste = s.leadPaste !== false;
    state.highlighting = s.highlighting === true;
  }
  function classLabel_(c) { return c ? c.className + (c.period !== "" && c.period !== undefined && c.period !== null ? " · " + c.period : "") : ""; }

  // ---- App version guard --------------------------------------------------------
  // A deployed web app can stay open, or be served from cache, after a new
  // version goes live. Compare the build baked into this page with the shared
  // live marker before loading any work, and send stale tabs to the current one.
  function newestAppUrl_(baseUrl, version) {
    let base = String(baseUrl || window.location.href || "").replace(/([?&])mmv=[^&#]*(&?)/, (_, lead, tail) => (lead === "?" && tail ? "?" : tail ? "&" : "")).replace(/[?&]$/, "");
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + "mmv=" + encodeURIComponent(String(version || Date.now()));
  }
  function showAppUpdatePrompt_(info) {
    const root = document.getElementById("modalRoot");
    if (!root) return;
    const target = newestAppUrl_(info && info.url, (info && info.version) || "new");
    root.innerHTML = `<div class="modal"><div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="updTitle"><div class="eyebrow">Update available</div><h3 id="updTitle">There's a newer version of the Memoir app</h3><p>Your teacher published an update. Your saved work is safe.</p><p class="muted-note">Load the newest version before you continue, so every page and writing tool matches your class.</p><div class="modal-actions"><button type="button" class="btn btn-primary" id="loadNewestApp">Load newest version</button></div></div></div>`;
    document.getElementById("loadNewestApp").onclick = () => {
      try { if (window.top && window.top !== window) window.open(target, "_top"); else window.location.replace(target); }
      catch (e) { window.location.href = target; }
    };
  }
  async function appVersionIsCurrent_() {
    if (!backend.enabled) return true;
    try {
      const info = await rpc("getAppVersion");
      const serverVersion = String((info && info.version) || "");
      const clientVersion = String(window.MEMOIR_CLIENT_VERSION || "");
      if (serverVersion && clientVersion && serverVersion !== clientVersion) { showAppUpdatePrompt_(info); return false; }
      const prev = String(safeLSGet("memoirAppVersion") || "");
      if (clientVersion) safeLSSet("memoirAppVersion", clientVersion);
      if (prev && clientVersion && prev !== clientVersion) setTimeout(() => showToast("The app was updated since your last visit. Your work carried over."), 400);
      return true;
    } catch (e) {
      console.warn("Could not check the app version:", e);
      return true;   // never strand a class over a brief network blip
    }
  }
  let lastVersionWatchAt_ = 0;
  async function checkVersionOnReturn_() {
    if (!backend.enabled || !backend.ready || document.hidden) return;
    if (Date.now() - lastVersionWatchAt_ < 120000) return;
    lastVersionWatchAt_ = Date.now();
    await appVersionIsCurrent_();
  }
  window.addEventListener("focus", checkVersionOnReturn_);
  document.addEventListener("visibilitychange", checkVersionOnReturn_);

  // ---- Account and save state in the top bar -----------------------------------------
  function setAccountHeader() {
    const roleSwitch = document.querySelector(".role-switch");
    if (roleSwitch) roleSwitch.style.display = backend.enabled ? "none" : "";
    let old = document.getElementById("accountPill");
    if (old) old.remove();
    if (!backend.user) return;
    const el = document.createElement("div");
    el.id = "accountPill";
    el.className = "account-pill";
    const initials = String(backend.user.name || backend.user.email || "?").split(/\s+/).map((w) => w[0] || "").join("").slice(0, 2).toUpperCase();
    el.innerHTML = `<span class="save-state" id="saveState"><span class="sync-dot" id="syncDot"></span><span id="saveLabel">Saved</span></span><span class="avatar" title="${esc(backend.user.name)} · ${esc(backend.user.email)}">${esc(initials)}</span><span class="account-role">${esc(backend.user.role === "student" ? "" : backend.user.role)}</span>`;
    document.querySelector(".topbar").appendChild(el);
  }
  function saveBusy_() { return !!(backend.saveInFlight || backend.saveDirty || backend.saveTimer); }
  // Everything that can tell a student their work did or did not save is
  // painted here, from one place, off the backend's own counters.
  function paintSaveState_() {
    const failing = backend.saveFails > 0, busy = saveBusy_();
    const d = document.getElementById("syncDot"), l = document.getElementById("saveLabel");
    if (d) { d.classList.toggle("saving", busy && !failing); d.classList.toggle("error", failing); }
    if (l) l.textContent = failing ? "Reconnecting — work is safe here" : busy ? "Saving…" : (backend.user && backend.user.role !== "student" ? "Settings saved" : "Saved");
    let toast = document.getElementById("saveTrouble");
    if (failing && backend.saveFails >= 2) {
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "saveTrouble";
        toast.className = "save-toast warn";
        toast.setAttribute("role", "status");
        toast.innerHTML = "<strong>Still trying to save to your account.</strong><span>Your work is safe in this browser. Leave this tab open and it will send itself as soon as the connection comes back.</span>";
        document.body.appendChild(toast);
      }
    } else if (toast) toast.remove();
  }
  function adoptMergedState_(merged) {
    const m = normalizeMemoir_(merged && merged.memoir);
    const changed = STAGE_KEYS.some((k) => m.texts[k] !== state.memoir.texts[k]);
    state.memoir = m;
    safeLSSet(localKey(), JSON.stringify(state));
    if (changed) renderKeepScroll_(); else sidebar();
  }
  function noteSaveMerge_(kept) {
    let n = document.getElementById("saveMerged");
    if (!n) { n = document.createElement("div"); n.id = "saveMerged"; n.className = "save-toast"; document.body.appendChild(n); }
    n.innerHTML = "<strong>Another window had newer work.</strong><span>The two copies were combined and nothing was overwritten. If a stage looks different, that's the newer writing from your other window.</span>";
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn btn-sm"; b.textContent = "Got it"; b.onclick = () => n.remove();
    n.appendChild(b);
    console.warn("Merged on save; kept from the other copy:", kept);
  }

  // ---- Bootstrap ------------------------------------------------------------------------
  async function bootstrap() {
    if (!backend.enabled) return;
    document.getElementById("app").innerHTML = '<section class="card boot-card"><h2 class="card-title">Connecting to your class…</h2><p class="muted-note">Checking your school Google account and loading your saved work.</p></section>';
    try {
      if (!(await appVersionIsCurrent_())) return;
      const data = await rpc("getBootstrap");
      if (!data || !data.ok) throw new Error(data && data.message ? data.message : "Could not load your account.");
      const bootVersion = String(data.appVersion || ""), clientVersion = String(window.MEMOIR_CLIENT_VERSION || "");
      if (bootVersion && clientVersion && bootVersion !== clientVersion) { showAppUpdatePrompt_({ version: bootVersion, url: data.appUrl || "" }); return; }
      backend.ready = true;
      backend.user = { email: data.email, name: data.name, role: data.role, status: data.accessStatus };
      backend.classes = data.classes || [];
      backend.aiConfigured = data.aiConfigured !== false;
      backend.aiFeatures = data.aiFeatures === true;
      backend.access = data.access || [];
      backend.needsName = data.role === "student" && !!data.needsName;
      if (data.role === "student") {
        backend.activeClassId = data.activeClassId || "";
        if (backend.activeClassId) {
          const klass = currentClass() || backend.classes[0];
          const cached = JSON.parse(safeLSGet(localKey()) || "null");
          state = normalizeAppState_(Object.keys(data.state || {}).length ? data.state : cached || {});
          applyClassSettings_(parseSettings(klass.settingsJson, data.classSettings));
          state.className = klass.className;
          state.role = "student";
          backend.serverUpdatedAt = data.stateUpdatedAt || "";
          backend.discussion = data.discussion || [];
          backend.gradeSummary = normalizeGradeSummary_(data.gradeSummary);
          backend.poster = data.poster || null;
          if (["manage", "grade", "admin"].indexOf(state.view) !== -1) state.view = "home";
          safeLSSet(localKey(), JSON.stringify(state));
        } else {
          state = normalizeAppState_({});
          state.role = "student";
        }
      } else {
        const cached = JSON.parse(safeLSGet(localKey()) || "null");
        if (cached) { let keep = normalizeAppState_(cached); state.memoir = keep.memoir; state.scaffold = keep.scaffold; }
        state.role = data.role;
        state.view = "manage";
        backend.activeClassId = safeLSGet("memoirActiveClass") || (backend.classes[0] || {}).classId || "";
        if (!backend.classes.some((c) => c.classId === backend.activeClassId)) backend.activeClassId = (backend.classes[0] || {}).classId || "";
        if (backend.activeClassId) { await loadDashboard(backend.activeClassId, false); loadCanvasStatus(); }
      }
      setAccountHeader();
      render();
    } catch (e) {
      backend.ready = true;
      setAccountHeader();
      document.getElementById("sidebar").innerHTML = "";
      const msg = String(e.message || e);
      document.getElementById("app").innerHTML = `<section class="card"><h2 class="card-title">${/set up yet|setupMemoirBackend/i.test(msg) ? "Backend setup needed" : "Couldn't connect"}</h2><p>${esc(msg)}</p>
        <p class="muted-note">Signed into more than one Google account? Open a new tab, go to google.com, click your profile picture, choose <strong>Sign out of all accounts</strong>, sign back in with only your school account, then reload this page.</p>
        <p class="muted-note">Teachers: if this is the first deployment, run <strong>setupMemoirBackend()</strong> once in the Apps Script editor, then deploy a new version.</p>
        <button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button></section>`;
    }
  }

  // ---- Saving ------------------------------------------------------------------------------
  save = function () {
    safeLSSet(localKey(), JSON.stringify(state));
    if (!backend.enabled || !backend.ready || !backend.activeClassId || !backend.user) return original.save();
    if (backend.user.role !== "student") { backend.settingsEditedAt = Date.now(); backend.settingsEditedFor = backend.activeClassId; }
    backend.saveDirty = true;
    clearTimeout(backend.saveTimer);
    backend.saveTimer = setTimeout(() => { backend.saveTimer = null; flushSave_(); }, 650);
    paintSaveState_();
  };
  backend.saveLocal = () => safeLSSet(localKey(), JSON.stringify(state));
  // One sender, nothing dropped: a failure puts the work straight back on the
  // dirty pile and retries with backoff; anything typed while a save is in the
  // air goes the moment it lands.
  function settingsSig_(s) {
    return JSON.stringify([MEMOIR_GRADE_KEYS.map((k) => (s.releasedSteps || {})[k] !== false), s.aiCoach !== false, s.aiPoster !== false, s.leadPaste !== false, s.highlighting === true]);
  }
  async function flushSave_() {
    clearTimeout(backend.saveTimer); backend.saveTimer = null;
    clearTimeout(backend.saveRetryTimer); backend.saveRetryTimer = null;
    if (!backend.enabled || !backend.ready || !backend.activeClassId || !backend.user) return { ok: false, skipped: true };
    if (!backend.saveDirty || backend.saveInFlight) return { ok: !backend.saveFails, skipped: true };
    backend.saveInFlight = true;
    backend.saveDirty = false;
    paintSaveState_();
    try {
      if (backend.user.role === "student") {
        const res = await rpc("saveStudentState", { classId: backend.activeClassId, state: state, baseUpdatedAt: backend.serverUpdatedAt || "" });
        if (res && res.merged && res.state) {
          // Another window or device had newer work and the server combined
          // the two. Take the combined copy unless something was typed while
          // this save was in the air; then keep the old base, so the next
          // save is merged too, and take it when that one lands.
          if (!backend.saveDirty) { adoptMergedState_(res.state); backend.serverUpdatedAt = res.updatedAt; }
          noteSaveMerge_(res.kept || []);
        } else if (res && res.updatedAt) backend.serverUpdatedAt = res.updatedAt;
      } else if (backend.dashboard && settingsSig_(state) !== settingsSig_(backend.dashboard.settings || {})) {
        // Only a real change to a switch is sent; opening pages never resaves.
        const forClass = backend.activeClassId;
        const res = await rpc("saveClassSettings", { classId: forClass, settings: {
          releasedSteps: Object.assign({}, state.releasedSteps || {}), aiCoach: state.aiCoach !== false,
          aiPoster: state.aiPoster !== false, leadPaste: state.leadPaste !== false, highlighting: state.highlighting === true } });
        backend.settingsSavedAt = Date.now(); backend.settingsSavedFor = forClass;
        if (res && res.settings) {
          [backend.dashboard, backend.dashboardCache[forClass]].forEach((d) => { if (d && d.classInfo && d.classInfo.classId === forClass) d.settings = res.settings; });
          const k = backend.classes.find((c) => c.classId === forClass);
          if (k) k.settingsJson = JSON.stringify(res.settings);
        }
      }
      backend.saveFails = 0;
      backend.saveInFlight = false;
      paintSaveState_();
      if (backend.saveDirty) flushSave_();
      return { ok: true };
    } catch (e) {
      backend.saveInFlight = false;
      backend.saveDirty = true;
      backend.saveFails = (backend.saveFails || 0) + 1;
      console.error(e);
      paintSaveState_();
      backend.saveRetryTimer = setTimeout(() => flushSave_(), Math.min(30000, 800 * Math.pow(2, Math.min(backend.saveFails, 6))));
      return { ok: false, error: e };
    }
  }
  backend.__flushSave = flushSave_;
  function sleep_(ms) { return new Promise((r) => setTimeout(r, ms)); }
  // A turn-in is only shown as turned in once the account has confirmed it.
  async function forceStudentSaveNow_() {
    if (!backend.enabled || !backend.ready || !backend.activeClassId || !backend.user || backend.user.role !== "student") return true;
    save();
    clearTimeout(backend.saveTimer); backend.saveTimer = null;
    let spins = 0;
    while (backend.saveInFlight && spins++ < 160) await sleep_(50);
    let result = await flushSave_();
    spins = 0;
    while (backend.saveInFlight && spins++ < 160) await sleep_(50);
    if (backend.saveDirty && !backend.saveInFlight) result = await flushSave_();
    if (!result || !result.ok || backend.saveFails > 0 || backend.saveDirty || backend.saveInFlight)
      throw new Error("Your writing is safe in this browser, but your account couldn't confirm it yet. Check your connection and try again.");
    return true;
  }
  backend.__forceSave = forceStudentSaveNow_;
  // The gap between the last keystroke and the save is 650 ms. Send the
  // pending save the moment the page stops being looked at.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave_(); });
  window.addEventListener("pagehide", () => flushSave_());
  window.addEventListener("blur", () => flushSave_());
  window.addEventListener("beforeunload", (e) => {
    if (!backend.enabled || !backend.ready || !backend.activeClassId) return;
    flushSave_();
    if (backend.saveFails > 0) { e.preventDefault(); e.returnValue = ""; return ""; }
  });

  // ---- Joining a class, and names -----------------------------------------------------------
  function splitStoredName_(name) {
    let parts = String(name || "").trim().replace(/\s+/g, " ").split(" ");
    if (parts.length < 2 || /\d/.test(String(name || ""))) return { first: "", last: "" };
    return { first: parts.shift(), last: parts.join(" ") };
  }
  function nameFieldsHtml_(name) {
    let n = splitStoredName_(name);
    return `<div class="name-fields"><div class="field"><label for="joinFirst">First name</label><input id="joinFirst" value="${esc(n.first)}" autocomplete="given-name"></div><div class="field"><label for="joinLast">Last name</label><input id="joinLast" value="${esc(n.last)}" autocomplete="family-name"></div></div>`;
  }
  function readNameFields_() {
    return { firstName: ((document.getElementById("joinFirst") || {}).value || "").trim(), lastName: ((document.getElementById("joinLast") || {}).value || "").trim() };
  }
  function studentJoinView() {
    return `<section class="card join-card"><div class="eyebrow">Student access</div><h1 class="page-title">Join your Memoir class</h1><p>Use your real first and last name — it's how your teacher finds your work when grading.</p>${nameFieldsHtml_(backend.user.name)}<div class="field"><label for="joinCode">Class code</label><input id="joinCode" maxlength="8" class="code-input" placeholder="ABC123" autocomplete="off"></div><button type="button" class="btn btn-primary" id="joinClassBtn">Join class</button><p id="joinMsg" class="muted-note" role="status"></p></section>`;
  }
  async function joinCurrent() {
    let b = document.getElementById("joinClassBtn"), msg = document.getElementById("joinMsg"), name = readNameFields_();
    if (!name.firstName || !name.lastName) { msg.textContent = "Please enter both your first name and your last name."; (name.firstName ? document.getElementById("joinLast") : document.getElementById("joinFirst")).focus(); return; }
    b.disabled = true; msg.textContent = "Joining…";
    try {
      await rpc("joinClass", { code: document.getElementById("joinCode").value, firstName: name.firstName, lastName: name.lastName });
      backend.user.name = name.firstName + " " + name.lastName;
      backend.needsName = false;
      await bootstrapStudentAgain_();
    } catch (e) { msg.textContent = e.message; b.disabled = false; }
  }
  async function bootstrapStudentAgain_() {
    const d = await rpc("getBootstrap");
    backend.classes = d.classes || [];
    backend.activeClassId = d.activeClassId || "";
    const k = currentClass();
    state = normalizeAppState_(Object.keys(d.state || {}).length ? d.state : {});
    state.role = "student";
    if (k) { applyClassSettings_(parseSettings(k.settingsJson, d.classSettings)); state.className = k.className; }
    backend.serverUpdatedAt = d.stateUpdatedAt || "";
    backend.discussion = d.discussion || [];
    backend.gradeSummary = normalizeGradeSummary_(d.gradeSummary);
    backend.poster = d.poster || null;
    state.view = "home";
    safeLSSet(localKey(), JSON.stringify(state));
    render();
  }
  function confirmNameView() {
    return `<section class="card join-card"><div class="eyebrow">One quick thing</div><h1 class="page-title">What's your name?</h1><p>Your teacher grades by name, so enter your real first and last name. You only need to do this once.</p>${nameFieldsHtml_(backend.user.name)}<button type="button" class="btn btn-primary" id="confirmNameBtn">Save my name</button><p id="confirmNameMsg" class="muted-note" role="status"></p></section>`;
  }
  async function confirmNameCurrent() {
    let b = document.getElementById("confirmNameBtn"), msg = document.getElementById("confirmNameMsg"), name = readNameFields_();
    if (!name.firstName || !name.lastName) { msg.textContent = "Please enter both your first name and your last name."; return; }
    b.disabled = true; msg.textContent = "Saving…";
    try {
      let r = await rpc("updateMyName", name);
      backend.user.name = (r && r.name) || name.firstName + " " + name.lastName;
      backend.needsName = false;
      render();
    } catch (e) { msg.textContent = e.message; b.disabled = false; }
  }

  // ===========================================================================
  // Teacher Dashboard: class pills + Canvas chip → Grading → Gradebook →
  // Students → Release & Resources. Every card uses the same header pattern.
  // ===========================================================================
  function cardHead_(title, chip, actions, sub) {
    return `<div class="dash-card-head"><div class="dash-card-title"><h2 class="card-title">${title}</h2>${chip || ""}</div>${actions ? `<div class="dash-card-actions">${actions}</div>` : ""}</div>${sub ? `<p class="dash-card-sub">${sub}</p>` : ""}`;
  }
  // One switch, used on the tiles and in Release & Resources alike. The real
  // checkbox stays in the DOM (focusable, and the element bind() listens to).
  function switchHtml_(cls, attr, on, text) {
    return `<label class="switch ${on ? "is-on" : ""}"><input type="checkbox" class="${cls}" ${attr} ${on ? "checked" : ""}><span class="switch-track" aria-hidden="true"></span><span class="switch-text">${esc(text)}</span></label>`;
  }
  function accessItemHtml_(cls, attr, on, name, detail, offMeans, color) {
    return `<label class="access-item ${on ? "is-on" : ""}" style="--acc:${color || "var(--line-2)"}" title="${cls === "classToggle" ? (on ? "On for this class" : "Off for this class") : on ? "Open to students" : "Hidden from students"}">
      <span class="switch ${on ? "is-on" : ""}"><input type="checkbox" class="${cls}" ${attr} ${on ? "checked" : ""}><span class="switch-track" aria-hidden="true"></span></span>
      <span class="access-copy"><strong>${esc(name)}</strong><small>${esc(detail)}</small>${offMeans ? `<small class="access-off">${on ? "Turn off: " : "Off: "}${esc(offMeans)}</small>` : ""}</span>
      <span class="access-state">${cls === "classToggle" ? (on ? "On" : "Off") : on ? "Open" : "Hidden"}</span></label>`;
  }
  function releaseCardHtml_() {
    let rel = state.releasedSteps || {};
    let items = RELEASE_ITEMS_().map((it) => accessItemHtml_("stepRelease", `data-step="${it.key}"`, rel[it.key] !== false, it.name, it.detail, "", it.color)).join("");
    let open = RELEASE_ITEMS_().filter((it) => rel[it.key] !== false).length;
    let aiNote = !backend.aiFeatures || backend.aiConfigured ? "" : `<p class="muted-note warn-note">No GEMINI_API_KEY is set, so the writing coach and title ideas stay hidden from students until you add one (Project Settings → Script Properties). Painted poster backgrounds work without it.</p>`;
    let tools = [
      accessItemHtml_("classToggle", 'data-flag="highlighting"', state.highlighting === true, "Internal / external highlighting", "Students mark their own sentences as internal or external to see the balance in their writing. Turn it on once rough drafts are written.", "the highlighter and highlighted view are hidden. Highlights students already made are kept.", "var(--peri)"),
      accessItemHtml_("classToggle", 'data-flag="leadPaste"', state.leadPaste !== false, "Pasting into The Lead", "For students who wrote their lead as a discussion post first.", "outside paste is blocked in The Lead too, like every other box.", "var(--peri)")
    ].join("");
    let res = !backend.aiFeatures ? "" : [
      accessItemHtml_("classToggle", 'data-flag="aiCoach"', state.aiCoach !== false, "Writing coach (AI)", "A button under each stage for feedback on the draft. It never rewrites student words.", "the coach button disappears for students; replies they already got stay in their work.", "var(--peri)"),
      accessItemHtml_("classToggle", 'data-flag="aiPoster"', state.aiPoster !== false, "Poster art & title ideas (AI)", "A painted background and a suggested title on the Poster page.", "students make posters with a plain background and their own title.", "var(--peri)")
    ].join("");
    return `<section class="card dash-card" id="releaseCard">
      ${cardHead_("Release &amp; Resources", `<span class="chip">${open} of ${RELEASE_ITEMS_().length} open</span>`, "", "What students can open. Turning something off hides it; it never deletes their work, and it comes back when you turn it on.")}
      <div class="access-group"><h3 class="access-title">The memoir</h3><div class="access-grid">${items}</div></div>
      <div class="access-group"><h3 class="access-title">Writing tools</h3><div class="access-grid">${tools}</div></div>
      ${res ? `<div class="access-group"><h3 class="access-title">AI</h3>${aiNote}<div class="access-grid">${res}</div></div>` : ""}
    </section>`;
  }
  function RELEASE_ITEMS_() {
    let out = [];
    STAGES.forEach((s, i) => {
      out.push({ key: s.key, name: s.label, detail: `Stage ${i + 1} · ${s.note}`, color: s.color });
      if (s.key === "lead") out.push({ key: "share", name: "Lead Share board", detail: "Post the Lead, reply to classmates", color: pieceColor("share") });
    });
    out.push({ key: "final", name: "Review & Turn In", detail: "All six stages together, self-rating, final turn-in", color: pieceColor("final") });
    out.push({ key: "poster", name: "Memoir Poster", detail: "Title, byline and the whole memoir as a poster", color: pieceColor("poster") });
    return out;
  }

  manage = function () {
    if (!backend.enabled || !backend.ready) return original.manage();
    let pills = backend.classes.map((c) => `<span class="class-pill-wrap"><button type="button" class="class-pill ${c.classId === backend.activeClassId ? "active" : ""}" data-classid="${esc(c.classId)}" title="${esc(classLabel_(c))} · code ${esc(c.joinCode)}">${esc(c.className)}${c.period !== "" && c.period !== null && c.period !== undefined ? `<span class="class-pill-period">${esc(c.period)}</span>` : ""}</button><button type="button" class="icon-btn classEditBtn" data-classid="${esc(c.classId)}" aria-label="Edit ${esc(c.className)}" title="Edit">${icon("pen")}</button></span>`).join("");
    let head = `<div class="page-head dash-head"><h1 class="page-title">Teacher Dashboard</h1></div>
      <div class="class-row">${pills}<button type="button" class="btn btn-dashed" id="toggleNewClass">+ New class</button><span class="class-row-right">${canvasChip_()}</span></div>
      <div id="newClassPanel" class="hide">${createClassCard()}</div>`;
    if (!backend.classes.length) return `<div class="page-head"><h1 class="page-title">Teacher Dashboard</h1><p class="page-sub">Your teacher access is active. Create your first class to get a join code for students.</p></div>${createClassCard()}`;
    let dash = backend.dashboard;
    if (!dash) return head + `<div class="hub-loading"><span class="spinner" aria-hidden="true"></span>Loading this class…</div>`;
    let k = currentClass();
    let banner = `<section class="class-banner"><div><strong>${esc(classLabel_(k))}</strong><span>${dash.students.length} student${dash.students.length === 1 ? "" : "s"} enrolled</span></div><div class="join-code">Class code <strong>${esc(dash.classInfo.joinCode)}</strong></div></section>`;
    return head + banner + gradingHubCard() + (dash.students.length ? gradebookCard(dash) : "") + studentsCard(dash) + releaseCardHtml_();
  };
  function createClassCard() {
    return `<section class="card create-card"><h2 class="card-title">Create a class</h2><div class="name-fields"><div class="field"><label for="newClassName">Class name</label><input id="newClassName" placeholder="English 2"></div><div class="field"><label for="newClassPeriod">Period / section</label><input id="newClassPeriod" placeholder="Period 2"></div></div><button type="button" class="btn btn-primary" id="createClassBtn">Create class</button><p id="createClassMsg" class="muted-note" role="status"></p></section>`;
  }

  // ---- Grading tiles ------------------------------------------------------------------------
  // Every graded piece is drawn by ONE renderer from ONE model (hubTileModel_),
  // so no tile can drift from its neighbours. Four zones, in order:
  //   head      what it is, what it is worth, when it is due, a status badge
  //   progress  one bar and three counts that always add up: to grade / graded / not submitted
  //   action    one button through to the marking screen
  //   foot      student access (a switch), then Canvas (state, Push, ⋯ menu)
  // The tile itself is not a button; only the Grade button navigates.
  async function loadGradingHub(classId, force) {
    classId = classId || backend.activeClassId;
    if (!classId) return;
    let cached = backend.gradingHubCache[classId];
    if (cached && !force) { backend.gradingHub = cached; return; }
    if (backend.gradingHubPending[classId]) return;
    backend.gradingHubPending[classId] = true;
    try {
      let prevRedo = cached ? Number(cached.needsRegradeTotal || 0) : null;
      let fresh = await rpc("getGradingHubSummary", { classId });
      backend.gradingHubCache[classId] = fresh;
      if (backend.activeClassId !== classId) return;
      backend.gradingHub = fresh;
      if (prevRedo !== null && Number(fresh.needsRegradeTotal || 0) > prevRedo) showToast("A student redid work you'd graded — it's at the top of that piece's list.", "warn");
      repaintTiles_(classId);
    } catch (e) {
      console.error(e);
      let mount = document.getElementById("gradingHubTiles");
      if (mount && !cached) mount.innerHTML = `<p class="muted-note">Couldn't load the grading counts: ${esc(e.message || String(e))}</p>`;
    } finally { delete backend.gradingHubPending[classId]; }
  }
  backend.__loadGradingHub = loadGradingHub;
  // Repaint just the tiles, so a recount never wipes what the teacher is doing
  // elsewhere -- and never wipes a Push result they are reading or snaps shut a
  // menu they have open, or carries either into a different class.
  function repaintTiles_(classId) {
    let mount = document.getElementById("gradingHubTiles");
    if (!mount || state.view !== "manage") return;
    let notes = {};
    if (mount.dataset.class === classId) mount.querySelectorAll(".tile-msg").forEach((m) => { if (m.textContent.trim()) notes[m.id] = m.textContent; });
    let openMenu = mount.querySelector(".tile-more[open]");
    let openKey = openMenu ? openMenu.dataset.key : "";
    mount.dataset.class = classId;
    mount.innerHTML = hubTilesHtml_();
    Object.keys(notes).forEach((id) => { let m = document.getElementById(id); if (m) m.textContent = notes[id]; });
    if (openKey) { let d = mount.querySelector(`.tile-more[data-key="${openKey}"]`); if (d) d.open = true; }
    let head = document.getElementById("hubHeadline");
    if (head) head.innerHTML = hubHeadline_();
    bindBackend();
    // The release switches are AppLogic's controls; a repainted switch must be
    // re-bound or it would move but save nothing.
    bindReleaseControls_();
  }
  setInterval(() => {
    if (!backend.ready || !backend.activeClassId || !backend.user || backend.user.role === "student") return;
    if (document.visibilityState === "hidden" || state.view !== "manage") return;
    loadGradingHub(backend.activeClassId, true);
  }, 60000);

  function hubStatus_(r) {
    if (r.allExcluded) return { kind: "excluded", count: 0, redo: 0 };
    let total = Number(r.needsGrading || 0), redo = Number(r.needsRegrade || 0);
    if (total > 0) return { kind: "needs", count: total, redo, fresh: Math.max(0, total - redo) };
    if (Number(r.submitted || 0) > 0 || Number(r.graded || 0) > 0) return { kind: "done", count: 0, redo: 0 };
    return { kind: "none", count: 0, redo: 0 };
  }
  function shortDate_(iso) {
    if (!iso) return "";
    let d = new Date(iso);
    return Number.isNaN(d.getTime()) ? "" : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function asgKey_(key) { return "memoir:" + key; }
  function hubDue_(key) {
    let link = (canvasSettings_().assignments || {})[asgKey_(key)] || {};
    let due = (canvasSchedule_()[asgKey_(key)] || {}).dueAt || link.dueAt;
    if (!due) return null;
    let d = new Date(due);
    if (Number.isNaN(d.getTime())) return null;
    return { short: shortDate_(due), full: d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) };
  }
  function hubCanvasState_(key) {
    let c = canvasSettings_();
    if (!canvasLinked_()) return { text: "Canvas not linked", cls: "is-off", title: "Link this class to a Canvas course to push scores and comments." };
    let link = (c.assignments || {})[asgKey_(key)] || {};
    if (!link.assignmentId) return { text: "Not in Canvas yet", cls: "is-pending", title: "Push creates the Canvas assignment the first time, then reuses it." };
    let bits = [link.name || "Canvas assignment"];
    if (link.moduleName) bits.push("Module: " + link.moduleName);
    if (link.lastGradeSyncAt) bits.push("Last pushed " + shortDate_(link.lastGradeSyncAt));
    return { text: link.lastGradeSyncAt ? "Pushed " + shortDate_(link.lastGradeSyncAt) : "In Canvas", cls: "is-ok", title: bits.join(" · ") };
  }
  function hubTileModel_(r) {
    let key = r.key;
    let st = STAGE_BY_KEY[key];
    let label = MEMOIR_GRADE_LABELS[key];
    return {
      key, asg: asgKey_(key), name: label, title: label, accent: pieceColor(key),
      eyebrow: st ? "Stage " + (st.index + 1) : key === "share" ? "After Stage 1" : "Finish",
      worth: r.allExcluded ? "Excluded for this class" : r.gradingType === "pass_fail" ? "Complete / incomplete" : r.pointsPossible + " pts",
      note: STEP_TILE_NOTE[key] || "",
      release: { cls: "stepRelease", attr: `data-step="${key}"`, on: (state.releasedSteps || {})[key] !== false, hides: `students can't open ${label}` },
      noGrade: { cls: "pieceNoGradeBtn", attr: `data-key="${key}"` }
    };
  }
  function hubTileHtml_(r) {
    let m = hubTileModel_(r);
    let st = hubStatus_(r);
    let total = Math.max(0, Number(r.totalItems || 0)), done = Math.max(0, Number(r.graded || 0)), todo = Math.max(0, Number(r.needsGrading || 0));
    let rest = Math.max(0, total - done - todo);
    let pct = (n) => (total ? Math.round((n / total) * 1000) / 10 : 0);
    let due = hubDue_(m.key), cv = hubCanvasState_(m.key), linked = canvasLinked_();
    let badge = st.kind === "needs"
      ? `<span class="tile-badge is-needs" title="${st.redo ? st.redo + " redone after grading · " : ""}${st.fresh} new · ${st.count} waiting on you">${st.redo ? "↻ " : ""}${st.count}</span>`
      : st.kind === "done" ? `<span class="tile-badge is-done" title="Nothing waiting on you here">${icon("check")}</span>`
      : st.kind === "excluded" ? `<span class="tile-badge is-excluded" title="Left out of every student's grade. Scores already entered are kept.">Not graded</span>` : "";
    let action = st.kind === "needs"
      ? `<button type="button" class="btn btn-primary tile-open" data-hubopen="${m.key}">Grade ${st.count}${st.redo ? ` <span class="tile-open-sub">· ${st.redo} redo${st.redo === 1 ? "" : "s"}</span>` : ""} ${icon("right")}</button>`
      : `<button type="button" class="btn tile-open" data-hubopen="${m.key}">${st.kind === "done" ? "Review graded work" : "Open"} ${icon("right")}</button>`;
    let progress = st.kind === "excluded"
      ? `<p class="tile-excluded-note">Left out of the grade for this class. Any scores you entered are kept; choose <strong>Count it again</strong> in the ⋯ menu to bring it back.</p>`
      : `<div class="tile-bar" role="img" aria-label="${done} graded, ${todo} to grade, ${rest} not submitted, of ${total} students"><span class="bar-done" style="width:${pct(done)}%"></span><span class="bar-todo" style="width:${pct(todo)}%"></span></div>
         <dl class="tile-stats"><div class="${todo ? "is-todo" : ""}"><dt>To grade</dt><dd>${todo}</dd></div><div><dt>Graded</dt><dd>${done}</dd></div><div><dt>Not submitted</dt><dd>${rest}</dd></div></dl>
         <p class="tile-note">${esc(m.note)}${m.release.on ? "" : " · hidden from students"}</p>`;
    let rel = m.release;
    let menu = `<details class="tile-more" data-key="${m.key}"><summary class="icon-btn" aria-label="More actions for ${esc(m.name)}" title="More actions">${icon("dots")}</summary>
      <div class="tile-menu" role="menu">
        <button type="button" role="menuitem" class="hubCanvasBtn" data-asg="${m.asg}">${linked ? "Due date &amp; Canvas…" : "Set up Canvas…"}</button>
        <button type="button" role="menuitem" class="exportAsgBtn" data-asg="${m.asg}" ${backend.asgBusy[m.asg] ? "disabled" : ""}>Download Canvas CSV</button>
        <hr><button type="button" role="menuitem" class="${m.noGrade.cls} ${r.allExcluded ? "is-excluded" : ""}" ${m.noGrade.attr}>${r.allExcluded ? "↺ Count it again" : "Don’t grade for this class"}</button>
      </div></details>`;
    return `<article class="tile ${st.kind === "needs" ? "has-needs" : ""} ${r.allExcluded ? "is-nograde" : ""} ${rel.on ? "" : "is-hidden-step"}" style="--acc:${m.accent}" aria-label="${esc(m.name)}">
      <header class="tile-head"><div class="tile-id"><span class="tile-eyebrow">${esc(m.eyebrow)}</span><h3 class="tile-title">${esc(m.title)}</h3>
        <span class="tile-meta"><span>${esc(m.worth)}</span>${due ? `<span title="${esc(due.full)}">Due ${esc(due.short)}</span>` : ""}</span></div>${badge}</header>
      <div class="tile-body">${progress}</div>
      ${action}
      <footer class="tile-foot">
        <label class="switch ${rel.on ? "is-on" : ""}" title="${rel.on ? "Students can open this. Turn off and " + esc(rel.hides) + "; their work is kept." : "Hidden: " + esc(rel.hides) + ". Turn on to release it."}"><input type="checkbox" class="${rel.cls}" ${rel.attr} ${rel.on ? "checked" : ""}><span class="switch-track" aria-hidden="true"></span><span class="switch-text">${rel.on ? "Open to students" : "Hidden from students"}</span></label>
        <div class="tile-canvas"><span class="canvas-state ${cv.cls}" title="${esc(cv.title)}">${esc(cv.text)}</span><span class="tile-canvas-actions">${linked ? `<button type="button" class="btn btn-sm pushAsgBtn" data-asg="${m.asg}" ${backend.asgBusy[m.asg] ? "disabled" : ""} title="Send these scores and teacher comments to Canvas now">${icon("push")} Push</button>` : ""}${menu}</span></div>
        <div class="tile-msg" id="asgMsg-${m.key}" aria-live="polite"></div>
      </footer></article>`;
  }
  function hubGroupHead_(title, rows) {
    let waiting = rows.reduce((n, r) => n + (r.allExcluded ? 0 : Number(r.needsGrading || 0)), 0);
    return `<div class="hub-group-head"><h3>${esc(title)}</h3><span class="hub-group-count">${rows.length} pieces</span>${waiting ? `<span class="hub-group-waiting">${waiting} to grade</span>` : `<span class="hub-group-clear">Nothing waiting</span>`}</div>`;
  }
  function hubTilesHtml_() {
    let hub = backend.gradingHub;
    if (!hub) return `<div class="hub-loading"><span class="spinner" aria-hidden="true"></span>Counting what needs grading…</div>`;
    return `${hubGroupHead_("Drafting", hub.drafting)}<div class="tile-grid">${hub.drafting.map(hubTileHtml_).join("")}</div>
      ${hubGroupHead_("The finished memoir", hub.finished)}<div class="tile-grid">${hub.finished.map(hubTileHtml_).join("")}</div>`;
  }
  function hubHeadline_() {
    let hub = backend.gradingHub;
    if (!hub) return "";
    let redo = Number(hub.needsRegradeTotal || 0);
    return hub.needsGradingTotal > 0 ? `<span class="chip chip-needs">${hub.needsGradingTotal} to grade${redo ? " · ↻ " + redo + " redo" + (redo === 1 ? "" : "s") : ""}</span>` : `<span class="chip chip-done">Nothing waiting on you</span>`;
  }
  function gradingHubCard() {
    return `<section class="card dash-card" id="gradingCard">
      ${cardHead_("Grading", `<span id="hubHeadline">${hubHeadline_()}</span>`, `<button type="button" class="btn btn-sm" id="refreshHub">${icon("refresh")} Refresh</button>`, "Open a piece to grade it. A red number is work waiting on you; ↻ means a student redid something after you graded it. Counts update every minute and after anything you grade.")}
      <div id="gradingHubTiles" data-class="${esc(backend.activeClassId)}">${hubTilesHtml_()}</div></section>`;
  }

  // ---- Gradebook ------------------------------------------------------------------------------
  // Everything the unit is worth in one table. "Unit" totals only the pieces
  // that have a score, like Canvas's current score, so a student who turned
  // everything in never reads as failing while it waits to be graded.
  function gradebookCard(dash) {
    let cols = MEMOIR_GRADE_KEYS.map((k) => `<th style="--acc:${pieceColor(k)}" title="${esc(MEMOIR_GRADE_LABELS[k])} · ${esc(worthLabel_(k))}">${esc(MEMOIR_GRADE_SHORT[k])}</th>`).join("");
    let rows = dash.students.map((s) => {
      let m = (s.gradeSummary && s.gradeSummary.memoir) || null;
      let earned = 0, possible = 0, started = false;
      let cells = MEMOIR_GRADE_KEYS.map((k) => {
        if (!m) return `<td><button type="button" class="gb-cell is-empty" disabled>—</button></td>`;
        if (k === MEMOIR_FINAL_KEY) {
          let t = m.finalTotal || {};
          if (!t.possible) return `<td><button type="button" class="gb-cell is-empty gbJump" data-email="${esc(s.email)}" data-key="final" title="${esc(s.name)} is excused from the Final Memoir">ex</button></td>`;
          if (t.hasAnyResult) { possible += t.possible; earned += t.earned; started = true; }
          let tip = t.hasAnyResult ? `${s.name} · Final Memoir: ${t.earned} of ${t.possible}${t.unmarked ? " · " + t.unmarked + " criteria not scored yet" : ""}` : t.submitted ? `${s.name} turned in the Final Memoir — not graded yet` : `${s.name} hasn't turned in the Final Memoir`;
          return `<td><button type="button" class="gb-cell gbJump ${t.hasAnyResult ? "" : "is-empty"}" data-email="${esc(s.email)}" data-key="final" title="${esc(tip)}">${t.hasAnyResult ? t.earned + "/" + t.possible + (t.unmarked ? '<span class="gb-dot">•</span>' : "") : t.submitted ? '<span class="gb-dot">•</span>' : "—"}</button></td>`;
        }
        let r = (m.steps || {})[k] || {};
        if (!r.excluded && hasScore_(r.score)) { possible += Number(r.possible || 0); earned += Number(r.score); started = true; }
        let val = r.excluded ? "ex" : hasScore_(r.score) ? (r.passFail ? (Number(r.score) > 0 ? "✓" : "✗") : r.score + "/" + r.possible) + (r.editedAfterGrading && r.submitted ? '<span class="gb-redo">↻</span>' : "") : r.submitted ? '<span class="gb-dot">•</span>' : "—";
        let tip = r.excluded ? `${s.name} is excused from ${MEMOIR_GRADE_LABELS[k]}` : hasScore_(r.score) ? `${s.name} · ${MEMOIR_GRADE_LABELS[k]}: ${r.score} of ${r.possible}${r.auto ? " (marked complete automatically)" : ""}${r.teacherGradedDraft ? " · graded before the student turned it in" : ""}` : r.submitted ? `${s.name} turned this in — not graded yet` : r.draft ? `${s.name} has a draft but hasn't turned it in` : `${s.name} hasn't started this`;
        return `<td><button type="button" class="gb-cell gbJump ${hasScore_(r.score) ? "" : "is-empty"}" data-email="${esc(s.email)}" data-key="${k}" title="${esc(tip)}">${val}</button></td>`;
      }).join("");
      let pct = possible ? Math.round((earned / possible) * 100) : 0;
      let total = started ? `<td class="gb-total"><span title="${esc(s.name)}: ${Math.round(earned * 100) / 100} of ${possible} across the pieces you've graded. Work that's turned in but not graded yet is left out, the way Canvas works out a current score.">${Math.round(earned * 100) / 100}/${possible}<small>${pct}%</small></span></td>` : `<td class="gb-total"><span class="is-empty">—</span></td>`;
      return `<tr><th scope="row" class="gb-name">${esc(s.name)}</th>${cells}${total}</tr>`;
    }).join("");
    return `<section class="card dash-card" id="gradebookCard">${cardHead_("Gradebook", `<span class="chip">${dash.students.length} students · 9 pieces</span>`, "", "<strong>✓</strong> complete · <strong>•</strong> turned in, not graded yet · <strong>↻</strong> redone since you graded it · <strong>—</strong> not done · <strong>ex</strong> excused. Click any cell to grade that student's work.")}
      <div class="gb-scroll"><table class="gb-table"><thead><tr><th class="gb-name" scope="col">Student</th>${cols}<th class="gb-total" scope="col">Unit</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  // ---- Students (folded away) -------------------------------------------------------------------
  function studentsCard(dash) {
    let body = dash.students.length
      ? `<div class="table-scroll"><table class="roster-table"><thead><tr><th scope="col">Student</th><th scope="col">Words</th><th scope="col">Stages</th><th scope="col">Lead Share</th><th scope="col">Final</th><th scope="col">Poster</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${dash.students.map((s) => `<tr>
          <td><strong>${esc(s.name)}</strong><small>${esc(s.email)}</small></td><td>${Number(s.words || 0)}</td>

      <summary class="roster-summary"><span class="roster-left"><strong>Students</strong><span class="chip">${dash.students.length} enrolled</span></span><span class="muted-note">class code <strong>${esc(dash.classInfo.joinCode)}</strong></span></summary>
      <div class="roster-body"><div class="roster-actions"><button type="button" class="btn btn-sm" id="importLegacyBtn">Bring in drafts from the old Memoir tool…</button><button type="button" class="btn btn-sm" id="refreshRoster">${icon("refresh")} Refresh</button></div>${body}</div></details>`;
  }

  // ---- Classes ------------------------------------------------------------------------------------
  function applyDashboardState_(d) {

      backend.dashboard = fresh;
      applyDashboardState_(fresh);

      console.error(e);

  }
  function acceptGradeSummary_(email, result) {
    if (!result || !result.gradeSummary) return;
    let gs = normalizeGradeSummary_(result.gradeSummary);
    [backend.dashboard, backend.dashboardCache[backend.activeClassId]].forEach((d) => {
      if (!d || !d.students) return;

    });
  }
  function openEditClass(classId) {
    let c = backend.classes.find((x) => x.classId === classId);
    if (!c) return;
    let root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal"><div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="ecTitle"><h3 id="ecTitle">Edit class</h3>
      <div class="field"><label for="editClassName">Class name</label><input id="editClassName" value="${esc(c.className)}"></div>
      <div class="field"><label for="editClassPeriod">Period / section</label><input id="editClassPeriod" value="${esc(c.period)}"></div>
      <p class="muted-note">Archiving hides the class from your dashboard. Student work stays in the backend spreadsheet.</p>
      <p id="editClassMsg" class="muted-note" role="status"></p>
      <div class="modal-actions"><button type="button" class="btn btn-danger-ghost" id="archiveClassBtn">Archive class</button><span class="grow"></span><button type="button" class="btn modal-dismiss" id="cancelEditClass">Cancel</button><button type="button" class="btn btn-primary" id="saveEditClass">Save</button></div></div></div>`;

      let name = document.getElementById("editClassName").value.trim(), period = document.getElementById("editClassPeriod").value.trim();

      msg.textContent = "Saving…";

        await rpc("updateClass", { classId, className: name, period });

  }
  async function createNewClass() {

  }

  // ===========================================================================

  function rubricFrom_(arr, label) {

  function gradeRow_(email) { let l = gradeRows_(); return l ? l.find((r) => r.email === email) : null; }

  function rubricLevelName_(score, rb) {
    if (!hasScore_(score) || !rb) return "";
    let l = rb.levels.find((x) => x.points === Number(score));
    return l ? l.label : "";
  }
  function rubricRowHtml_(score, btnClass, attrs, rb) {
    return `<div class="band-row score-bands">${rb.levels.map((l) => `<button type="button" class="${btnClass} band-btn ${hasScore_(score) && Number(score) === l.points ? "selected" : ""}" ${attrs} data-score="${l.points}" title="${esc(l.text)}"><span class="band-name">${esc(l.label)}</span><span class="band-pts">${l.points}</span></button>`).join("")}</div>`;
  }
  function scoreInputHtml_(score, attrs, max) {
    return `<div class="score-entry"><label><span>Score</span><span>0–${max} · halves allowed</span></label><input type="number" class="pieceManualScore" min="0" max="${max}" step="0.5" value="${hasScore_(score) ? esc(String(score)) : ""}" ${attrs} placeholder="—" aria-label="Score out of ${max}"></div>`;
  }
  function readScoreInput_(input, max) {
    let raw = String(input.value || "").trim();

    let n = Number(raw);

    return Math.round(n * 100) / 100;
  }
  function rubricLegendHtml_(rb) {
    return `<details class="rubric-legend" open><summary>${esc(rb.label)} rubric — the full descriptors</summary>${rb.levels.map((l) => `<div class="legend-row"><span class="legend-level">${esc(l.label)} <strong>${l.points}</strong></span><span>${esc(l.text)}</span></div>`).join("")}<small class="muted-note">Click a band beside each response, or type an exact score.</small></details>`;
  }

  // ---- The writing-process record, as the teacher sees it -------------------------------------
  function procStat_(value, label, cls, title) {
    return `<span class="proc-stat ${cls || ""}"${title ? ` title="${esc(title)}"` : ""}>${value !== "" && value !== null && value !== undefined ? `<b class="proc-num">${value}</b>` : ""}<span class="proc-label">${label}</span></span>`;
  }
  function timeStat_(t, hasText) {
    t = t || {};
    if (!t.timed) return hasText ? procStat_("", "Not timed", "proc-muted", "Written before writing time was recorded, so there's no time for this box.") : "";
    let lower = Number(t.untimedChars || 0) > 0, s = Number(t.sessions || 0);
    return procStat_((lower ? "≥ " : "") + esc(writingTimeText_(t.activeMs)), "writing", "proc-time",
      `${writingTimeText_(t.activeMs)} of active writing${s ? ` across ${s} sitting${s === 1 ? "" : "s"}` : ""}. Counted from the student's own edits; a pause over two minutes isn't counted.${lower ? " Some of this text was here before timing began, so the real total is higher." : ""}`);

    let total = Number(p.total || text.trim().length || 0);
    let pasted = Number(p.pasted || 0), moved = Number(p.moved || 0), unknown = Number(p.unknown || 0);
    let events = Number(p.events || 0), outside = Number(p.outsideEvents || 0), blocked = Number(p.blocked || 0);

    chips.push(procStat_(events, "paste event" + (events === 1 ? "" : "s"), events ? (outside ? "proc-warn" : "proc-own") : "",

    if (blocked) chips.push(procStat_(blocked, "outside paste" + (blocked === 1 ? "" : "s") + " blocked", "proc-muted", "The student tried to paste from outside the app in a box where it's turned off. Nothing was pasted."));
    if (unknown) chips.push(procStat_(unknown, "chars before tracking", "proc-muted", "Text already in this box when tracking began (for example, brought over from the original Memoir tool). Its origin is unknown, not assumed typed."));
    if (opts.cadence) chips.push(procStat_(opts.cadence.internal + " / " + opts.cadence.external, "internal / external highlights", "proc-cadence", "How many phrases the student marked as internal and external."));
    if (opts.checks && opts.checks.total) chips.push(procStat_(opts.checks.ticked + "/" + opts.checks.total, "checklist ticked", "", "The student's own craft checklist for this stage."));
    let note = "";
    if (pasted && !opts.leadPaste) note = `<p class="proc-note warn">Outside paste is evidence for a conversation, not a verdict. Read the highlighted passage in context.</p>`;

    return `<div class="proc-stats">${chips.join("")}</div>${note}`;
  }
  // Text with either the paste record or the student's highlights marked. Each

  function markedTextHtml_(text, ranges) {

  function workTextHtml_(r, text, process) {

    return markedTextHtml_(text, spans.filter((s) => s[2] === "p" || s[2] === "q").map((s) => [s[0], s[1], s[2] === "p" ? "paste-outside" : "paste-own", s[2] === "p" ? "Pasted from outside the app" : "Moved from the student's own writing"]));
  }

    return `<p class="legend"><span><span class="sw sw-paste"></span>pasted from outside</span><span><span class="sw sw-own"></span>moved from their own writing</span><span>Unmarked text was typed in the app.</span></p>`;
  }

  // ---- Rows ------------------------------------------------------------------------------------
  function pieceRank_(r) {

    if (!t.submitted) return 1;

  }
  function groupMeta_(rank) {
    let pf = isPassFail_();

    if (rank === -1) return { label: "Resubmitted", note: "Revised after you graded it, and turned in again" };

    if (rank === 1) return { label: "Not Submitted", note: share ? "No post yet" : "A draft may exist, but it hasn't been turned in" };
    if (rank === 2) return { label: pf ? "Complete" : "Graded", note: pf ? "Marked complete — automatically when turned in, or by you" : "Scored" };

  const RANKS = [-1, 0, 1, 2, 3];

    }).join("")}</div>`;

      g.classList.toggle("is-empty", n === 0);
    });
  }
  function moveRow_(row, rank, name) {
    if (!row) return;

    row.dataset.rank = String(rank);
    let root = row.closest(".grade-groups");
    if (!root) return;
    let target = root.querySelector(`.grade-group[data-group="${rank}"] .group-list`);

      let after = RANKS.slice(0, RANKS.indexOf(rank)).reverse().map((k) => root.querySelector(`.grade-group[data-group="${k}"]`)).find(Boolean);

    refreshGroupCounts_(root);
  }
  function statusBadges_(r) {
    let out = "";

    let share = gradeKey_() === "share", poster = gradeKey_() === MEMOIR_POSTER_KEY;
    if (hasScore_(r.teacherScore) && !r.submitted) out += `<span class="chip chip-done" title="You graded the saved draft before the student turned it in. The score counts and goes to Canvas on the next push.">Graded draft</span>`;
    else if (!r.text && !(poster && r.poster)) out += `<span class="chip chip-muted">${share ? "No post" : "Not started"}</span>`;

    } else if (hasScore_(r.teacherScore)) {
      let n = rubricLevelName_(r.teacherScore, PIECE_RUBRICS[gradeKey_()]);
      out += `<span class="chip chip-done">${n ? esc(n) + " " : ""}${r.teacherScore}/${pieceMax_()}</span>`;
    } else if (r.submitted) out += `<span class="chip chip-needs">Needs grading</span>`;

    return out;
  }
  function refBlockHtml_(r) {
    if (!r.ref) return "";
    return `<details class="ref-panel ref-teacher"><summary>Their ${esc(r.ref.label)}, for comparison</summary>${r.ref.text ? `<p class="ref-text">${esc(r.ref.text)}</p>` : `<p class="ref-empty">Not written yet.</p>`}</details>`;
  }
  function coachBlockHtml_(r) {
    if (!r.coach || !r.coach.length) return "";
    return `<details class="coach-older teacher-coach"><summary>What the writing coach told them (${r.coach.length})</summary>${r.coach.slice().reverse().map((e) => `<div class="coach-reply is-old"><div class="coach-when">${esc(new Date(e.at).toLocaleString())}</div><p>${esc(e.text)}</p></div>`).join("")}</details>`;
  }
  function keepNoteHtml_(r) {
    if (!(r.editedAfterGrading && r.text && r.submitted && hasScore_(r.teacherScore))) return "";
    return `<p class="edited-note">You gave this <strong>${r.teacherScore}/${pieceMax_()}</strong>${r.gradedAt ? " on " + esc(new Date(r.gradedAt).toLocaleDateString()) : ""}, and the student has ${r.markedBlank ? "written it" : "revised it"} since. This is the current version. <button type="button" class="btn btn-sm pieceKeepBtn" data-email="${esc(r.email)}">Keep ${r.teacherScore}/${pieceMax_()}</button></p>`;
  }
  function pieceScoreHtml_(r) {
    let attrs = `data-email="${esc(r.email)}"`;
    let scoring;
    if (isPassFail_()) {
      let v = hasScore_(r.score) ? Number(r.score) : null;
      scoring = `<div class="band-row score-bands"><button type="button" class="pieceCompleteBtn band-btn ${v === pieceMax_() ? "selected" : ""}" ${attrs} data-score="${pieceMax_()}"><span class="band-name">Complete</span><span class="band-pts">${pieceMax_()}</span></button><button type="button" class="pieceCompleteBtn band-btn ${v === 0 ? "selected" : ""}" ${attrs} data-score="0"><span class="band-name">Not complete</span><span class="band-pts">0</span></button></div>${r.auto && v ? `<p class="muted-note">Marked complete automatically because it was turned in. Click either to decide yourself.</p>` : ""}`;

  }
  function pieceRowHtml_(r) {
    return `<article class="grade-row" data-email="${esc(r.email)}" data-rank="${pieceRank_(r)}" data-name="${esc(r.name || "")}">
      <h3 class="row-name"><span>${esc(r.name)}</span><span class="row-badges">${statusBadges_(r)}</span></h3>
      <div class="row-work">${pieceWorkHtml_(r)}</div>
      ${pieceScoreHtml_(r)}</article>`;
  }
  function updatePieceRow_(email) {
    let r = gradeRow_(email);
    let row = document.querySelector(`.grade-row[data-email="${CSS.escape(email)}"]`);
    if (!r || !row) return;
    row.querySelector(".row-badges").innerHTML = statusBadges_(r);
    if (!r.editedAfterGrading) { let n = row.querySelector(".edited-note"); if (n) n.remove(); }
    let inp = row.querySelector(".pieceManualScore");
    if (inp && document.activeElement !== inp) inp.value = hasScore_(r.teacherScore) ? r.teacherScore : "";
    row.querySelectorAll(".pieceScoreBtn,.pieceCompleteBtn").forEach((b) => b.classList.toggle("selected", hasScore_(isPassFail_() ? r.score : r.teacherScore) && Number(b.dataset.score) === Number(isPassFail_() ? r.score : r.teacherScore)));
    let cb = row.querySelector(".pieceExcludeToggle");

    moveRow_(row, pieceRank_(r), r.name);
  }
  // ---- The final memoir: read once, score all four criteria ------------------------------------
  function finalCriterionHtml_(r, c) {
    let rec = r.criteria[c] || {};
    let self = rec.selfEvalIdx !== "" && rec.selfEvalIdx !== undefined ? Number(rec.selfEvalIdx) : null;
    let btns = MEMOIR_RUBRIC[c].map((desc, i) => {
      let pts = CRITERION_POINTS[i];

      return `<button type="button" class="critScoreBtn band-btn ${official ? "selected" : suggested ? "is-suggested" : ""}" data-email="${esc(r.email)}" data-crit="${esc(c)}" data-score="${pts}" title="${esc(desc)}"><span class="band-name">${esc(BAND_LABELS[i])}</span><span class="band-pts">${pts}</span></button>`;
    }).join("");
    let selfNote = self !== null
      ? `<p class="muted-note">They rated themselves <strong>${esc(BAND_LABELS[self])} (${CRITERION_POINTS[self]})</strong>${rec.selfComment ? ": “" + esc(rec.selfComment) + "”" : "."}${hasScore_(rec.teacherScore) ? "" : " Shown dashed until you decide."}</p>`

  }
  function finalBadges_(r) {

  function finalRowHtml_(r) {

  function recomputeFinal_(r) {
    let earned = 0, possible = 0;
    MEMOIR_CRITERIA.forEach((c) => { let x = r.criteria[c]; if (x.excluded) return; possible += CRITERION_MAX; if (hasScore_(x.teacherScore)) earned += Number(x.teacherScore); });

  function updateFinalRow_(email) {

      let rec = r.criteria[c];

        let on = hasScore_(rec.teacherScore) && Number(b.dataset.score) === Number(rec.teacherScore);

      });
      sec.querySelector(".crit-chip").innerHTML = rec.excluded ? `<span class="chip chip-muted">Excluded</span>` : hasScore_(rec.teacherScore) ? `<span class="chip chip-done">${rec.teacherScore}/${CRITERION_MAX}</span>` : `<span class="chip chip-warn">Needs a score</span>`;
    });

  }

  // ---- Loading and saving ---------------------------------------------------------------------------
  function normalizeGradeRows_(rows, key) {
    return (rows || []).map((r) => {
      let o = Object.assign({}, r);
      o.text = String(o.text || "");
      o.words = Number(o.words || 0);
      o.process = o.process || {};
      o.comment = String(o.comment || "");
      if (key === MEMOIR_FINAL_KEY) {
        o.criteria = o.criteria || {};
        MEMOIR_CRITERIA.forEach((c) => {
          let x = o.criteria[c] || {};
          x.teacherScore = normScore_(x.teacherScore); x.score = normScore_(x.score);
          x.excluded = x.excluded === true; x.comment = String(x.comment || "");
          x.selfEvalIdx = x.selfEvalIdx === undefined || x.selfEvalIdx === null ? "" : x.selfEvalIdx;
          o.criteria[c] = x;
        });
        o.finalTotal = o.finalTotal || { earned: 0, possible: 0 };
        ["submitted", "editedAfterGrading", "teacherGradedDraft", "hasAnyResult"].forEach((f) => (o.finalTotal[f] = o.finalTotal[f] === true));
      } else {
        o.score = normScore_(o.score); o.teacherScore = normScore_(o.teacherScore);

      }

    });
  }
  async function loadGradeRows_(key, force) {
    backend.gradeKey = key;
    let classId = backend.activeClassId, ck = gradeCacheKey_(classId, key);
    let cached = backend.gradeCache[ck];
    if (state.view === "grade") refreshGradeView_();
    if ((cached && !force) || backend.gradePending[ck]) return;
    backend.gradePending[ck] = true;
    try {
      let fresh = await rpc("getMemoirResponses", { classId, stepKey: key });
      backend.gradeCache[ck] = normalizeGradeRows_(fresh.responses, key);
      if (backend.activeClassId === classId && backend.gradeKey === key && state.view === "grade") refreshGradeView_();
    } catch (e) {
      console.error(e);
      let list = document.getElementById("gradeList");
      if (list && !cached) list.innerHTML = `<p class="muted-note">Couldn't load the class's work: ${esc(e.message || String(e))}</p>`;
    } finally { delete backend.gradePending[ck]; }
  }
  async function savePiece_(email, patch) {
    let r = gradeRow_(email);

      let p = rpc("setGradeItem", { classId: backend.activeClassId, studentEmail: email, itemType: "memoir", itemKey: gradeKey_(),

  }

  async function saveCrit_(email, crit, patch) {
    let r = gradeRow_(email);
    if (!r) return;

    invalidateDashboardCache_();
    try {
      let p = rpc("setGradeItem", { classId: backend.activeClassId, studentEmail: email, itemType: "memoirRubric", itemKey: crit,

    } catch (e) { alert("Couldn't update the whole class: " + e.message); if (btn) btn.disabled = false; }

  // ---- The screen ---------------------------------------------------------------------------------------
  function gradePanelHtml_() {

      : isPassFail_() ? "" : rubricLegendHtml_(PIECE_RUBRICS[key]);

        let live = document.getElementById(el.id);
        if (live) live.innerHTML = `<img src="data:${esc(safeImgType_(p.mimeType))};base64,${safeB64_(p.image)}" alt="${esc(p.title || "Memoir poster")} by ${esc(p.author || "the student")}">`;
      } catch (e) { let live = document.getElementById(el.id); if (live) live.innerHTML = `<span class="muted-note">Couldn't load: ${esc(e.message)}</span>`; }

  gradeScreen = function () {

  // ===========================================================================

    if (res.skipped && res.skipped.length) parts.push(`Left blank (nothing graded yet): ${res.skipped.join(", ")}.`);
