      if (body) body.innerHTML = before + `<p class="coach-error">${esc(e.message)}</p>`;
    } finally { let b = document.getElementById("coachBtn"); if (b) b.disabled = false; }
  }
  function setDiscussion_(list) { backend.discussion = list || []; }
  async function refreshShare_() {
    try { setDiscussion_((await rpc("getLeadShare", { classId: backend.activeClassId })).discussion); renderKeepScroll_(); }
    catch (e) { showToast(e.message, "warn"); }
  }
  async function loadSavedPoster_() {
    let wrap = document.getElementById("posterPreview");
    if (!wrap || !backend.poster || !backend.poster.savedAt || posterDrawn_) return;
    try {
      let p = backend.posterImage;
      if (!p || p.savedAt !== backend.poster.savedAt) { p = (await rpc("getMyPoster", { classId: backend.activeClassId })).poster; backend.posterImage = p; }
      let live = document.getElementById("posterPreview");
      if (!live || posterDrawn_) return;
      if (!p) { live.innerHTML = `<div class="poster-empty"><p>Your poster appears here.</p></div>`; return; }
      live.innerHTML = `<figure class="saved-poster"><img src="data:${esc(safeImgType_(p.mimeType))};base64,${safeB64_(p.image)}" alt="Your memoir poster, ${esc(p.title || "untitled")}"><figcaption class="muted-note">The poster you turned in. Make a new version any time with the buttons on the left, then turn it in again.</figcaption></figure>`;
      let dl = document.getElementById("downloadPosterBtn");
      if (dl) { dl.disabled = false; dl.onclick = () => { fetch("data:" + safeImgType_(p.mimeType) + ";base64," + safeB64_(p.image)).then((r) => r.blob()).then((b) => downloadBlob_(b, "memoir-poster.jpg")); }; }
    } catch (e) { console.warn(e); }
  }

  function b64ToBlob_(b64, type) {
    let bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: type || "application/octet-stream" });
  }
  function studentConnected_() { return backend.enabled && backend.ready && backend.user && backend.user.role === "student" && !!backend.activeClassId; }

  // A turn-in is shown as turned in only after the account confirms it. If the
  // save can't be confirmed, the local "turned in" mark is taken back.
  const originalBindTurnIn = bindTurnIn_;
  bindTurnIn_ = function () {
    if (!studentConnected_()) return originalBindTurnIn();
    let t = document.getElementById("turnInBtn");
    if (!t) return;
    t.onclick = async () => {
      let key = t.dataset.stage;
      if (!submissionOf_(key).text) return showToast("Write something first, then turn it in.");
      let prior = state.memoir.submissions[key] ? JSON.parse(JSON.stringify(state.memoir.submissions[key])) : null;
      markSubmitted_(key);
      t.disabled = true; t.textContent = "Turning in…";
      try {
        await forceStudentSaveNow_();
        renderKeepScroll_();
        showToast(STAGE_BY_KEY[key].label + " turned in. You can keep revising — turn it in again if you change it.");
      } catch (e) {
        if (prior) state.memoir.submissions[key] = prior; else delete state.memoir.submissions[key];
        safeLSSet(localKey(), JSON.stringify(state));
        renderKeepScroll_();
        alert(e.message || String(e));
      }
    };
  };

  function bindStudentBackend_() {
    if (!studentConnected_() && !(backend.ready && backend.user && backend.user.role !== "student")) return;
    let coach = document.getElementById("coachBtn");
    if (coach && backend.activeClassId) coach.onclick = () => askCoach_(coach);
    if (!studentConnected_()) return;
    bindTurnIn_();
    let tf = document.getElementById("turnInFinalBtn");
    if (tf) tf.onclick = async () => {
      if (!assembledText_()) return showToast("Write your memoir first.");
      let prior = state.memoir.submissions.final ? JSON.parse(JSON.stringify(state.memoir.submissions.final)) : null;
      markSubmitted_(MEMOIR_FINAL_KEY);
      tf.disabled = true; tf.textContent = "Turning in…";
      try { await forceStudentSaveNow_(); renderKeepScroll_(); showToast("Final Memoir turned in."); }
      catch (e) {
        if (prior) state.memoir.submissions.final = prior; else delete state.memoir.submissions.final;
        safeLSSet(localKey(), JSON.stringify(state));
        renderKeepScroll_();
        alert(e.message || String(e));
      }
    };
    let post = document.getElementById("postLeadBtn");
    if (post) post.onclick = async () => {
      let text = stageText_("lead").trim();
      if (!text) return;
      post.disabled = true; post.textContent = "Posting…";
      try { setDiscussion_((await rpc("postLeadShare", { classId: backend.activeClassId, text })).discussion); renderKeepScroll_(); showToast("Your Lead is on the board."); }
      catch (e) { alert(e.message); post.disabled = false; post.textContent = "Post my Lead to the board"; }
    };
    document.querySelectorAll(".replySubmit").forEach((b) => (b.onclick = async () => {
      let ta = b.closest(".reply-compose").querySelector("textarea");
      let text = ta ? ta.value.trim() : "";
      if (!text) { if (ta) ta.focus(); return; }
      b.disabled = true; b.textContent = "Posting…";
      try { setDiscussion_((await rpc("postLeadShareReply", { classId: backend.activeClassId, postId: b.dataset.postid, text })).discussion); renderKeepScroll_(); }
      catch (e) { alert(e.message); b.disabled = false; b.textContent = "Post reply"; }
    }));
    let rf = document.getElementById("refreshShareBtn");
    if (rf) rf.onclick = refreshShare_;
    let rm = document.getElementById("refreshMyWork");
    if (rm) rm.onclick = async () => {
      rm.disabled = true;
      try {
        await forceStudentSaveNow_();
        let r = await rpc("getStudentStateRefresh", { classId: backend.activeClassId });
        let view = state.view;
        state = normalizeAppState_(r.state || {});
        state.role = "student"; state.view = view;
        applyClassSettings_(r.classSettings || {});
        let k = currentClass(); if (k) state.className = k.className;
        backend.serverUpdatedAt = r.stateUpdatedAt || backend.serverUpdatedAt;
        setDiscussion_(r.discussion);
        backend.gradeSummary = normalizeGradeSummary_(r.gradeSummary);
        backend.poster = r.poster || null;
        safeLSSet(localKey(), JSON.stringify(state));
        render();
        showToast("Up to date.");
      } catch (e) { alert("Couldn't refresh: " + (e.message || String(e))); rm.disabled = false; }
    };
    // ---- Poster ----
    let st = document.getElementById("suggestTitleBtn");
    if (st) st.onclick = async () => {
      let text = assembledText_();
      if (!text) return setPosterStatus_("Write some of your memoir first, then ask for a title idea.", "bad");
      st.disabled = true;
      setPosterStatus_("Thinking of a title…");
      try {
        let res = await rpc("getPosterTitle", { classId: backend.activeClassId, text });
        if (!res || !res.ok) throw new Error((res && res.error) || "No title came back — try again.");
        state.memoir.poster.title = res.title;
        let inp = document.getElementById("posterTitle"); if (inp) inp.value = res.title;
        save();
        setPosterStatus_("Suggested: “" + res.title + "”. Keep it, edit it, or type your own.", "ok");
        if (posterDrawn_) drawPoster_(posterBg_);
      } catch (e) { setPosterStatus_(e.message, "bad"); }
      finally { let b = document.getElementById("suggestTitleBtn"); if (b) b.disabled = false; }
    };
    let paint = document.getElementById("paintBtn");
    if (paint) paint.onclick = async () => {
      if (backend.paintCooldownUntil && Date.now() < backend.paintCooldownUntil) return setPosterStatus_("The free art service needs about 15 seconds between pictures.", "bad");
      paint.disabled = true;
      setPosterStatus_("Painting your background… this can take up to 30 seconds.");
      try {
        let res = await rpc("getPosterBackground", { classId: backend.activeClassId, hint: state.memoir.poster.hint || "" });
        if (!res || !res.ok) throw new Error((res && res.error) || "The art service didn't answer — try again, or use a plain background.");
        await new Promise((resolve, reject) => {
          let img = new Image();
          img.onload = () => { posterBg_ = img; resolve(); };
          img.onerror = () => reject(new Error("A picture came back but couldn't be opened — try again."));
          img.src = "data:" + (res.mimeType || "image/jpeg") + ";base64," + res.imageBase64;
        });
        await drawPoster_(posterBg_);
        setPosterStatus_("Here's your poster. Change the title or name and it updates.", "ok");
      } catch (e) { setPosterStatus_(e.message, "bad"); }
      finally {
        backend.paintCooldownUntil = Date.now() + 15000;
        let b = document.getElementById("paintBtn");
        if (b) { b.disabled = true; setTimeout(() => { let bb = document.getElementById("paintBtn"); if (bb) bb.disabled = false; }, 15000); }
      }
    };
    let tp = document.getElementById("turnInPosterBtn");
    if (tp) tp.onclick = async () => {
      if (!posterDrawn_) return setPosterStatus_("Make your poster first.", "bad");
      let jpg = posterJpeg_();
      if (!jpg) return setPosterStatus_("That poster is too big to store. Try shortening the title or removing extra blank lines.", "bad");
      tp.disabled = true;
      setPosterStatus_("Turning in your poster…");
      try {
        let res = await rpc("saveMyPoster", Object.assign({ classId: backend.activeClassId, title: state.memoir.poster.title || "", author: state.memoir.poster.author || "" }, jpg));
        backend.poster = { title: state.memoir.poster.title || "", author: state.memoir.poster.author || "", savedAt: res.savedAt };
        backend.posterImage = Object.assign({}, jpg, backend.poster);
        state.memoir.poster.savedAt = res.savedAt;
        save();
        let area = document.querySelector(".poster-turnin");
        if (area) area.innerHTML = statusChip_(pieceStatus_(MEMOIR_POSTER_KEY)) + `<span class="muted-note">Turned in just now</span>`;
        sidebar();
        setPosterStatus_("Poster turned in. Your teacher can see it, and it'll be here next time you open this page.", "ok");
      } catch (e) { setPosterStatus_(e.message, "bad"); }
      finally { let b = document.getElementById("turnInPosterBtn"); if (b) b.disabled = false; }
    };
  }

  // ===========================================================================
  // render / bind
  // ===========================================================================
  render = function () {
    if (backend.enabled && backend.ready && backend.user && backend.user.role === "student" && !backend.activeClassId) {
      document.getElementById("sidebar").innerHTML = "";
      document.getElementById("app").innerHTML = studentJoinView();
      document.body.dataset.view = "join";
      setAccountHeader(); bindBackend();
      return;
    }
    if (backend.enabled && backend.ready && backend.user && backend.user.role === "student" && backend.needsName) {
      document.getElementById("sidebar").innerHTML = "";
      document.getElementById("app").innerHTML = confirmNameView();
      document.body.dataset.view = "join";
      setAccountHeader(); bindBackend();
      return;
    }
    // A Push or CSV result in a tile survives a redraw of the SAME class's
    // dashboard; it never follows the teacher into a different class.
    let notes = {}, oldMount = document.getElementById("gradingHubTiles");
    let notesClass = oldMount ? oldMount.dataset.class : "";
    if (oldMount && state.view === "manage") oldMount.querySelectorAll(".tile-msg").forEach((m) => { if (m.textContent.trim()) notes[m.id] = m.textContent; });
    if (backend.enabled && backend.ready && backend.user) state.role = backend.user.role;
    original.render();
    if (state.view === "manage" && notesClass && notesClass === backend.activeClassId)
      Object.keys(notes).forEach((id) => { let m = document.getElementById(id); if (m) m.textContent = notes[id]; });
    if (!(backend.enabled && backend.ready && backend.user)) return;
    setAccountHeader();
    paintSaveState_();
    if (backend.user.role !== "student" && backend.activeClassId) {
      // However the teacher gets back to the dashboard -- the button, the
      // browser's Back, or the sidebar -- counts that grading made stale are
      // refetched, after any score still crossing to the server has landed.
      if (state.view === "manage") {
        let id = backend.activeClassId;
        let hubStale = !backend.gradingHubCache[id];
        let dashStale = !!backend.dashboard && !backend.dashboardCache[id];
        if (hubStale || dashStale) waitForTeacherSaves_().then(() => { if (hubStale) loadGradingHub(id, true); if (dashStale) refreshDashboardQuietly_(id); });
      }
      if (state.view === "share" && backend.shareLoadedFor !== backend.activeClassId) {
        backend.shareLoadedFor = backend.activeClassId;
        refreshShare_();
      }
      if (state.view === "grade") { loadPosterThumbs_(); setTimeout(focusGradeStudent_, 60); }
    }
    if (studentConnected_() && state.view === "poster") loadSavedPoster_();
    // Your Grades always shows the latest: fetched each time the page is opened.
    if (studentConnected_() && state.view === "grades" && backend.lastRenderedView !== "grades") refreshMyGrades_();
    backend.lastRenderedView = state.view;
  };
  async function refreshMyGrades_() {
    try {
      let r = await rpc("getMyGrades", { classId: backend.activeClassId });
      backend.gradeSummary = normalizeGradeSummary_(r.gradeSummary);
      if (state.view === "grades") renderKeepScroll_();
      else sidebar();
    } catch (e) { console.warn("Couldn't refresh grades", e); }
  }
  bind = function () {
    original.bind();
    if (!backend.enabled || !backend.ready) return;
    bindStudentBackend_();
    bindBackend();
  };
  let commentTimers = {};
  function bindBackend() {
    let q = (sel) => Array.from(document.querySelectorAll(sel));
    let byId = (id) => document.getElementById(id);
    if (byId("joinClassBtn")) byId("joinClassBtn").onclick = joinCurrent;
    if (byId("joinCode")) byId("joinCode").onkeydown = (e) => { if (e.key === "Enter") joinCurrent(); };
    if (byId("confirmNameBtn")) byId("confirmNameBtn").onclick = confirmNameCurrent;
    if (byId("createClassBtn")) byId("createClassBtn").onclick = createNewClass;
    if (byId("toggleNewClass")) byId("toggleNewClass").onclick = () => byId("newClassPanel").classList.toggle("hide");
    q(".class-pill").forEach((b) => (b.onclick = () => { backend.gradeCache = {}; backend.shareLoadedFor = ""; loadDashboard(b.dataset.classid); }));
    q(".classEditBtn").forEach((b) => (b.onclick = () => openEditClass(b.dataset.classid)));
    if (byId("openCanvasSetup")) byId("openCanvasSetup").onclick = openCanvasSetupModal;
    // ---- Canvas setup ----
    if (byId("canvasConnectBtn")) byId("canvasConnectBtn").onclick = async () => {
      canvasMsg_("Checking the token with Canvas…");
      try { await rpc("saveCanvasConnection", { baseUrl: byId("canvasBaseUrl").value, token: byId("canvasToken").value }); canvasMsg_("Connected."); await loadCanvasStatus(true); }
      catch (e) { canvasMsg_(e.message, true); }
    };
    if (byId("canvasDisconnectBtn")) byId("canvasDisconnectBtn").onclick = async () => {
      if (!confirm("Disconnect Canvas for your account? Assignments already in Canvas and their grades stay there.")) return;
      try { await rpc("clearCanvasConnection"); backend.canvas = null; await loadCanvasStatus(true); } catch (e) { canvasMsg_(e.message, true); }
    };
    if (byId("canvasCourseSelect")) byId("canvasCourseSelect").onchange = async (e) => {
      let courseId = e.target.value;
      backend.canvas.groups = [];
      if (courseId) { try { backend.canvas.groups = (await rpc("listCanvasAssignmentGroups", { courseId })).groups || []; } catch (err) { canvasMsg_(err.message, true); } }
      let g = byId("canvasGroupSelect");
      if (g) g.innerHTML = `<option value="">Course default</option>` + backend.canvas.groups.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
    };
    if (byId("canvasLinkBtn")) byId("canvasLinkBtn").onclick = async () => {
      let courseId = byId("canvasCourseSelect").value;
      if (!courseId) return canvasMsg_("Choose a course first.", true);
      canvasMsg_("Linking…");
      try {
        let r = await rpc("linkCanvasCourse", { classId: backend.activeClassId, courseId, assignmentGroupId: byId("canvasGroupSelect").value });
        if (backend.dashboard) backend.dashboard.settings.canvas = r.canvas;
        invalidateDashboardCache_();
        await loadDashboard(backend.activeClassId, true);
        let body = byId("canvasSetupBody"); if (body) body.innerHTML = canvasSetupBody_();
        canvasMsg_("Linked. Push from any grading tile.");
        bindBackend();
      } catch (e) { canvasMsg_(e.message, true); }
    };
    if (byId("canvasUnlinkBtn")) byId("canvasUnlinkBtn").onclick = async () => {
      if (!confirm("Unlink this class from its Canvas course? Nothing in Canvas is deleted.")) return;
      try { let r = await rpc("unlinkCanvasCourse", { classId: backend.activeClassId }); if (backend.dashboard) backend.dashboard.settings.canvas = r.canvas; invalidateDashboardCache_(); await loadDashboard(backend.activeClassId, true); let body = byId("canvasSetupBody"); if (body) body.innerHTML = canvasSetupBody_(); bindBackend(); }
      catch (e) { canvasMsg_(e.message, true); }
    };
    // ---- Tiles ----
    if (byId("refreshHub")) byId("refreshHub").onclick = async () => { await waitForTeacherSaves_(); loadGradingHub(backend.activeClassId, true); refreshDashboardQuietly_(backend.activeClassId); };
    q("[data-hubopen]").forEach((b) => (b.onclick = () => openGradeAt_(b.dataset.hubopen)));
    q(".pushAsgBtn").forEach((b) => (b.onclick = () => pushAsg_(b.dataset.asg)));
    q(".hubCanvasBtn").forEach((b) => (b.onclick = () => { let d = b.closest("details"); if (d) d.open = false; canvasLinked_() ? openCanvasAsgModal(b.dataset.asg) : openCanvasSetupModal(); }));
    q(".exportAsgBtn").forEach((b) => (b.onclick = () => { let d = b.closest("details"); if (d) d.open = false; exportAsg_(b.dataset.asg); }));
    q(".pieceNoGradeBtn").forEach((b) => (b.onclick = async () => {
      let key = b.dataset.key, label = MEMOIR_GRADE_LABELS[key];
      let excluding = !b.classList.contains("is-excluded");
      if (excluding && !confirm(`Leave ${label} out of every student's grade in this class? Scores you've entered are kept, and "Count it again" brings them all back.`)) return;
      let d = b.closest("details"); if (d) d.open = false;
      setAsgMsg_(asgKey_(key), excluding ? "Leaving it out for everyone…" : "Counting it again…");
      try {
        await rpc("setGradeItemForClass", key === MEMOIR_FINAL_KEY ? { classId: backend.activeClassId, memoirFinal: true, excluded: excluding } : { classId: backend.activeClassId, itemType: "memoir", itemKey: key, excluded: excluding });
        delete backend.gradeCache[gradeCacheKey_(backend.activeClassId, key)];
        invalidateDashboardCache_();
        await loadGradingHub(backend.activeClassId, true);
        refreshDashboardQuietly_(backend.activeClassId);
      } catch (e) { setAsgMsg_(asgKey_(key), e.message); }
    }));
    q(".gbJump").forEach((b) => (b.onclick = () => openGradeAt_(b.dataset.key, b.dataset.email)));
    let roster = byId("rosterCard");
    if (roster) roster.ontoggle = () => (backend.rosterOpen = roster.open);
    q(".viewStudent").forEach((b) => (b.onclick = () => openStudentWork(b.dataset.email)));
    if (byId("importLegacyBtn")) byId("importLegacyBtn").onclick = openLegacyImport_;
    if (byId("refreshRoster")) byId("refreshRoster").onclick = () => { invalidateDashboardCache_(); loadDashboard(backend.activeClassId); };
    // ---- Grade the Memoir ----
    if (byId("backToDashboard")) byId("backToDashboard").onclick = async () => { await waitForTeacherSaves_(); delete backend.gradingHubCache[backend.activeClassId]; go_("manage"); };
    if (byId("refreshGrade")) byId("refreshGrade").onclick = async () => { await waitForTeacherSaves_(); loadGradeRows_(gradeKey_(), true); };
    if (byId("gradeSelect")) byId("gradeSelect").onchange = (e) => { backend.gradeKey = e.target.value; render(); loadGradeRows_(e.target.value); };
    if (byId("hideUnsubmitted")) byId("hideUnsubmitted").onchange = (e) => { backend.hideUnsubmitted = e.target.checked; refreshGradeView_(); };
    if (byId("excludeAllBtn")) byId("excludeAllBtn").onclick = toggleExcludeForClass_;
    if (byId("markPaste")) byId("markPaste").onclick = () => { backend.markView = "paste"; refreshGradeView_(); };
    if (byId("markCadence")) byId("markCadence").onclick = () => { backend.markView = "cadence"; refreshGradeView_(); };
    q(".pieceScoreBtn,.pieceCompleteBtn").forEach((b) => (b.onclick = () => {
      let email = b.dataset.email, score = Number(b.dataset.score);
      applyPiece_(email, { score }); updatePieceRow_(email); savePiece_(email, { score });
    }));
    q(".pieceManualScore").forEach((inp) => (inp.onchange = () => {
      let email = inp.dataset.email, v = readScoreInput_(inp, pieceMax_());
      if (v === undefined) return;
      applyPiece_(email, { score: v }); updatePieceRow_(email); savePiece_(email, { score: v });
    }));
    q(".pieceExcludeToggle").forEach((c) => (c.onchange = () => { let email = c.dataset.email; applyPiece_(email, { excluded: c.checked }); updatePieceRow_(email); savePiece_(email, { excluded: c.checked }); }));
    q(".pieceKeepBtn").forEach((b) => (b.onclick = () => { let email = b.dataset.email, r = gradeRow_(email); if (!r) return; applyPiece_(email, { score: r.teacherScore }); updatePieceRow_(email); savePiece_(email, { score: r.teacherScore }); }));
    q(".pieceComment").forEach((t) => {
      let flush = () => { clearTimeout(commentTimers[t.id]); let r = gradeRow_(t.dataset.email); if (!r || r.comment === t.value) return; applyPiece_(t.dataset.email, { comment: t.value }); savePiece_(t.dataset.email, { comment: t.value }); };
      t.oninput = () => { clearTimeout(commentTimers[t.id]); commentTimers[t.id] = setTimeout(flush, 1400); };
      t.onchange = flush;
    });
    q(".critScoreBtn").forEach((b) => (b.onclick = () => {
      let email = b.dataset.email, crit = b.dataset.crit, score = Number(b.dataset.score), r = gradeRow_(email);
      if (!r) return;
      Object.assign(r.criteria[crit], { teacherScore: score, score, pending: false });
      recomputeFinal_(r); updateFinalRow_(email); saveCrit_(email, crit, { score });
    }));
    q(".critExcludeToggle").forEach((c) => (c.onchange = () => {
      let email = c.dataset.email, crit = c.dataset.crit, r = gradeRow_(email);
      if (!r) return;
      r.criteria[crit].excluded = c.checked;
      recomputeFinal_(r); updateFinalRow_(email); saveCrit_(email, crit, { excluded: c.checked });
    }));
    q(".critComment").forEach((t) => {
      let flush = () => { clearTimeout(commentTimers[t.id]); let r = gradeRow_(t.dataset.email); if (!r) return; let rec = r.criteria[t.dataset.crit]; if (rec.comment === t.value) return; rec.comment = t.value; saveCrit_(t.dataset.email, t.dataset.crit, { comment: t.value }); };
      t.oninput = () => { clearTimeout(commentTimers[t.id]); commentTimers[t.id] = setTimeout(flush, 1400); };
      t.onchange = flush;
    });
    // ---- Admin ----
    if (byId("addTeacherBtn")) byId("addTeacherBtn").onclick = async () => {
      let msg = byId("teacherAccessMsg"); msg.textContent = "Saving…";
      try { backend.access = (await rpc("adminAddTeacher", { email: byId("teacherEmail").value, name: byId("teacherName").value })).access || []; render(); }
      catch (e) { msg.textContent = e.message; }
    };
    q(".accessToggle").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try { backend.access = (await rpc("adminSetAccess", { email: b.dataset.email, status: b.dataset.status })).access || []; render(); }
      catch (e) { alert(e.message); b.disabled = false; }
    }));
    // ---- Lead Share moderation ----
    q(".removeShareItem").forEach((b) => (b.onclick = async () => {
      if (!confirm(b.dataset.kind === "post" ? "Remove this post and every reply under it? This can't be undone." : "Remove this reply? This can't be undone.")) return;
      try { setDiscussion_((await rpc("removeLeadShareItem", { classId: backend.activeClassId, kind: b.dataset.kind, id: b.dataset.id })).discussion); renderKeepScroll_(); }
      catch (e) { alert(e.message); }
    }));
  }
  // Close an open ⋯ menu when the teacher clicks anywhere else.
  document.addEventListener("click", (e) => {
    document.querySelectorAll(".tile-more[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; });
  });

  __MB.BackendClient = 'ok';
  if (backend.enabled) bootstrap();
  else render();
})();
</script>
