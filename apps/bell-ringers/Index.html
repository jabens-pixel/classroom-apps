.dash-icon{border:1px solid var(--border);background:#fff;color:#4c4167;border-radius:10px;min-width:40px;height:40px;padding:0 10px;cursor:pointer;font-size:1rem}

.hub-card{padding:0;overflow:visible}

.hub-band-star{color:var(--lime);font-size:1.1rem}

.hub-card-body{padding:16px 22px 22px}
.hub-tile{overflow:hidden;border-top:0}
.hub-cover{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:118px;padding:16px 16px 14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc,#6555ab),#202239);border-radius:13px 13px 0 0}
.hub-cover:after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border:22px solid #ffffff14;border-radius:50%;pointer-events:none}
.hub-cover-text{position:relative;min-width:0;display:flex;flex-direction:column;gap:4px}
.hub-cover-title{margin:0;font-size:1.25rem;line-height:1.15;font-weight:850;letter-spacing:-.02em;color:#fff;overflow-wrap:anywhere}
.hub-cover-sub{font-size:.78rem;color:#e7e3fb;font-weight:650}
.hub-cover-pts{margin-top:4px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.hub-cover .hub-status{position:relative}
.hub-caught-badge{background:#e2f3d4}

/* 2026.10.14.3 rubric */

/* 2026.10.14.3 grading screen (Macbeth marking flow, Electric palette) */
.grade-screen{max-width:1240px;margin:0 auto}
.grade-screen-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:18px 0 14px}
.grade-screen-head h1{margin:2px 0 0;color:#f6f3ff;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.03em}
.grade-screen-head .class-kicker{color:var(--lime)!important}
.grade-screen-actions{display:flex;gap:8px;flex-wrap:wrap}
.grade-screen-card{margin-bottom:16px}
.grade-screen-card .dok-prompt{white-space:pre-wrap;background:#f0ecf9;color:#37304d;border-radius:12px;padding:12px 14px;line-height:1.55;margin:10px 0}
.exclude-toggle{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700;color:#4c4167;cursor:pointer;margin:6px 0}
.exclude-toggle input{width:16px;height:16px;accent-color:#6555ab}
.exclude-all-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:10px;padding-top:12px}
.exclude-all-row .toolbar-note{flex:1;min-width:240px;margin:0}
.exclude-all-row.is-excluded{background:#fff4f6;border-radius:12px;padding:12px;border-top:0}
.batch-grade-groups{display:flex;flex-direction:column;gap:16px}
.batch-grade-group{background:#1d2140;border:1px solid #33375a;border-radius:18px;padding:12px}
.batch-grade-group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 6px 10px;color:#f6f3ff}
.batch-grade-group-head strong{font-size:1.05rem;margin-right:10px}
.batch-grade-group-head span{font-size:.8rem;color:#c6c2df}
.batch-grade-group-count{min-width:30px;height:30px;display:grid;place-items:center;border-radius:999px;background:#2f3354;color:#fff!important;font-weight:900;font-size:.85rem!important;padding:0 8px}
.batch-grade-group[data-grade-group="-1"] .batch-grade-group-count{background:#aa3962}
.batch-grade-group[data-grade-group="0"] .batch-grade-group-count{background:var(--lime);color:#25302a!important}
.batch-grade-group.is-empty .batch-group-list:empty:after{content:"Nobody here right now.";display:block;font-size:.8rem;color:#8f8cab;padding:2px 8px 6px}
.batch-group-list{display:flex;flex-direction:column;gap:12px}
.batch-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.9fr);column-gap:18px;row-gap:6px;background:var(--paper);color:var(--ink);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.batch-row>h5{grid-column:1/-1;margin:0;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.batch-row .gs-badges{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.batch-row .response-box{white-space:pre-wrap;line-height:1.6;background:#f0ecf9;color:#37304d;border-radius:11px;padding:12px 14px;max-height:340px;overflow-y:auto}
.proc-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.proc-stat{font-size:.74rem;color:var(--muted);background:#f3f0fb;border-radius:999px;padding:3px 9px}
.grade-row-dok{border-left:1px solid var(--border);padding-left:16px}
.rubric-level-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 10px}
.rubric-level-btn{border:1px solid #d8ceed;background:#fff;color:#514369;border-radius:10px;padding:8px 4px;cursor:pointer;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.rubric-level-btn:hover{border-color:#6555ab;background:#f6f3ff}
.rubric-level-name{font-size:.68rem;font-weight:900}
.rubric-level-pts{font-size:1.05rem;font-weight:900}
.rubric-level-btn.selected{background:#6555ab;border-color:#6555ab;color:#fff}
.teacher-score-entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f6f3ff;border:1px solid #e3dcf5;border-radius:10px;padding:7px 10px;margin:0 0 6px}
.teacher-score-entry label{flex:1;min-width:150px;display:flex;flex-direction:column;font-size:.8rem;font-weight:800;color:#4c4167}
.teacher-score-entry label span+span{font-size:.7rem;font-weight:600;color:var(--muted)}
.teacher-score-entry input{max-width:90px;padding:6px 8px;border:1px solid #c8c0de;border-radius:8px;font:inherit}
.gs-comment{width:100%;box-sizing:border-box;min-height:70px;border:1px solid #c8c0de;border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem;line-height:1.5;resize:vertical;margin-top:4px}
.gs-save{min-height:1.2em;font-size:.76rem;font-weight:800;color:#3c6024;margin-top:4px}
.gs-save.is-bad{color:#aa3962}
.batch-badge-excluded{background:#eceaf2;color:#5b5670;border-color:#d6d2e2}
.batch-edited-badge{background:#fde6ec;color:#8c1d3c;border-color:#eab3c3;font-weight:900}
.edited-note{background:#fff4f6;border:1px solid #f0c7d3;border-radius:10px;padding:9px 12px;font-size:.84rem;color:#5e2a3b;margin:0 0 8px}
.edited-note .btn{margin-left:6px}
.focus-head,.focus-foot,.gs-focus-hint,.gs-focus-rubric{display:none}
.focus-open-row{display:flex;justify-content:flex-end;margin:0 0 6px}
.focus-left{font-size:.84rem;color:var(--muted);margin-right:auto;padding-left:4px;font-weight:700}
/* Focused grading: the same row, laid out full-screen (Macbeth layout) */
.batch-row.focus-mode{position:fixed;inset:0;z-index:900;margin:0;border:0;border-radius:0;padding:14px 22px 16px;background:#f6f4fc;
  grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:24px;row-gap:10px;overflow:hidden;align-items:stretch}
.batch-row.focus-mode>h5{grid-column:1;grid-row:1;align-self:center;font-size:1.05rem}
.batch-row.focus-mode>.focus-head{display:flex;gap:8px;justify-content:flex-end;align-items:center;grid-column:2;grid-row:1}
.batch-row.focus-mode>.batch-work{grid-column:1;grid-row:2/4;align-self:stretch;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:6px}
.batch-row.focus-mode>.grade-row-dok{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px 16px 18px}
.batch-row.focus-mode>.focus-foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;grid-column:2;grid-row:3;padding:10px 2px 2px;border-top:1px solid var(--border)}
.batch-row.focus-mode .focus-open-row{display:none}
.batch-row.focus-mode .response-box{max-height:none;overflow:visible;background:#fff;border:1px solid #e3ddf2;border-radius:12px;padding:26px 34px;font-size:1.05rem;line-height:1.75;max-width:80ch;margin:0 auto 12px;box-shadow:0 1px 3px #0000000d}
.batch-row.focus-mode .proc-stats{max-width:80ch;margin:0 auto}
.batch-row.focus-mode .gs-comment{min-height:84px}
.batch-row.focus-mode .gs-focus-hint{display:block;font-size:.76rem;color:var(--muted);margin:2px 0 10px}
.batch-row.focus-mode .gs-focus-rubric{display:block;border-top:1px solid var(--border);padding-top:10px}
.fr-crit{margin:0 0 10px;font-size:.76rem;line-height:1.4}
.fr-crit>b{display:block;font-size:.8rem;margin-bottom:3px}
.fr-lv{display:flex;gap:8px;padding:4px 8px;border-radius:7px;margin-bottom:2px}
.fr-lv span{font-weight:900;min-width:12px}
.fr-lv.lv-c5{background:#f1f8ea}.fr-lv.lv-c4{background:#f2f4fc}.fr-lv.lv-c3{background:#fdf7e8}.fr-lv.lv-c2{background:#fcf0f3}
.fr-zero{font-size:.74rem;color:var(--muted);margin:4px 0 0}
body:has(.batch-row.focus-mode){overflow:hidden}
.gradebook-cell.is-excl{color:#8a86a0;font-style:italic;background:#f1eff6}
@media(max-width:900px){
  .batch-row{grid-template-columns:1fr}
  .grade-row-dok{border-left:0;padding-left:0;border-top:1px solid var(--border);padding-top:10px}
  .batch-row.focus-mode{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
  .batch-row.focus-mode>.batch-work,.batch-row.focus-mode>.grade-row-dok{overflow:visible;padding-left:0}
  .batch-row.focus-mode>.focus-head{justify-content:flex-start;margin:6px 0 10px;flex-wrap:wrap}
  .batch-row.focus-mode .response-box{padding:16px 18px;font-size:1rem}
  .rubric-level-row{grid-template-columns:repeat(3,1fr)}
}

<body>
<div class="shell">
  <div id="loading" class="loading"><div class="spinner"></div><b>Connecting to SchEnglish Bell Ringers&#x2026;</b><div id="bootStatus" class="muted" style="margin-top:8px">Starting app&#x2026;</div><div class="muted" style="margin-top:8px;font-size:.72rem">Build 2026.10.23.1 &#xb7; Electric Notebook</div></div>
  <div id="app" class="hidden">
    <div class="topbar"><div class="topin"><button class="brand-button" onclick="home()"><span class="brand-mark">S</span><span class="brand-copy"><strong>SchEnglish</strong><span>Bell Ringers</span></span></button><div class="spacer"></div><nav id="navHost" class="shell-nav"></nav><div id="roleSwitch" class="role-switch hidden" role="group" aria-label="Choose a view"></div><span id="rolePill" class="pill"></span><span id="emailPill" class="top-account"></span><button id="homeBtn" class="btn secondary small">Home</button></div></div>
    <main class="wrap" id="view"></main><footer class="build-label">SchEnglish Bell Ringers &#xb7; Electric Notebook &#xb7; v2026.10.23.1</footer>
  </div>
</div>
<div id="toast" class="toast"></div><div id="modalHost"></div>
<script>
const S={boot:null,classId:null,classData:null,mode:null,saveTimer:null,libraryItems:[],libraryFilter:'All',librarySearch:'',librarySelected:'',libraryGrade:null};
const $=id=>document.getElementById(id); const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
function callOnce_(fn,args=[]){return new Promise((res,rej)=>{try{if(!window.google||!google.script||!google.script.run)throw new Error('Apps Script connection is unavailable. Open the deployed Web App URL, not the HTML preview.');const runner=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message:String(e||'Server call failed'))));const method=runner[fn];if(typeof method!=='function')throw new Error('Server function not found: '+fn);method.apply(runner,args)}catch(e){rej(e)}})}
/* 2026.10.15.1 Google sign-in lapses (HTTP 401). Google refuses the request before it reaches the app,
   so nothing was saved and it is always safe to send it again. */
function brIsAuthErr(e){return /HTTP 40[13]\b|Authorization is required|not authorized to perform/i.test(String(e&&e.message||e||''))}
async function call(fn,args=[]){
  try{return await callOnce_(fn,args)}catch(e){
    if(!brIsAuthErr(e))throw e;
    await new Promise(r=>setTimeout(r,1500));
    try{const out=await callOnce_(fn,args);brHideSignIn();return out}catch(e2){
      if(brIsAuthErr(e2)){brShowSignIn();const x=new Error('Google signed this page out (HTTP 401). Reload the page.');x.auth=true;throw x}
      throw e2}
  }
}
function brShowSignIn(){
  let b=document.getElementById('brSignIn');if(b){b.hidden=false;return}
  b=document.createElement('div');b.id='brSignIn';b.className='br-signin';b.setAttribute('role','alert');
  b.innerHTML='<div class="br-signin-in"><div><strong>Google signed this page out, so nothing can be saved right now.</strong> '+
    '<span>Grades you entered are kept in this browser and are sent automatically after you reload. '+
    'If this comes back right after reloading, you are probably signed in to more than one Google account: open the app in a Chrome window (or profile) signed in to your school account only.</span></div>'+
    '<button class="btn small" type="button" onclick="brReloadForSignIn()">Reload &amp; send grades</button></div>';
  document.body.appendChild(b);
}
function brHideSignIn(){const b=document.getElementById('brSignIn');if(b)b.hidden=true}
function brReloadForSignIn(){try{if(typeof G!=='undefined'&&G&&G.pending&&G.pending.size){Promise.race([Promise.allSettled([...G.pending]),new Promise(r=>setTimeout(r,1500))]).then(()=>location.reload());return}}catch(e){}location.reload()}
// Grades waiting to be sent, kept in this browser until the server confirms them.
const BR_PENDING_KEY='brPendingGrades';
function brPendingRead(){try{return JSON.parse(localStorage.getItem(BR_PENDING_KEY)||'{}')||{}}catch(e){return {}}}
function brPendingWrite(m){try{if(Object.keys(m).length)localStorage.setItem(BR_PENDING_KEY,JSON.stringify(m));else localStorage.removeItem(BR_PENDING_KEY)}catch(e){}}
function brPendingPut(payload){const m=brPendingRead();m[payload.assignmentId+'|'+payload.studentEmail]={payload:payload,by:(S.boot&&S.boot.user&&S.boot.user.email)||'',at:Date.now()};brPendingWrite(m)}
function brPendingDrop(aid,email){const m=brPendingRead(),k=aid+'|'+email;if(m[k]){delete m[k];brPendingWrite(m)}}
async function brReplayPendingGrades(){
  const m=brPendingRead(),me=(S.boot&&S.boot.user&&S.boot.user.email)||'';
  const keys=Object.keys(m).filter(k=>m[k]&&m[k].payload&&(!m[k].by||m[k].by===me)&&Date.now()-(m[k].at||0)<7*864e5);
  Object.keys(m).forEach(k=>{if(!keys.includes(k)&&(!m[k]||Date.now()-(m[k].at||0)>=7*864e5))delete m[k]});brPendingWrite(m);
  if(!keys.length)return;
  let sent=0,failed=0;
  for(const k of keys){
    try{await call('setBrGradeItem',[m[k].payload]);sent++;const p=m[k].payload;brPendingDrop(p.assignmentId,p.studentEmail)}
    catch(e){if(e&&e.auth)return;failed++;const p=m[k].payload;brPendingDrop(p.assignmentId,p.studentEmail)}
  }
  if(S.hubCache)S.hubCache={};
  if(sent)toast('\u2713 Sent '+sent+' grade'+(sent===1?'':'s')+' that had not saved before the reload');
  if(failed)alert(failed+' grade'+(failed===1?'':'s')+' from before the reload could not be saved. Please check the grading screen.');
}
/* ===== 2026.10.19.2 update bar (house rule, from Lit Circles) =====
   "A new version is ready — Reload". It compares against the build THIS link
   serves (serverBuild, read by the server from the Index.html it serves), not only
   the newest build anywhere. Reload is a real link to the app's /exec address
   (reloading the inner frame can return the old build) and waits for saves. If a
   reload came back on the same old build, teachers are told the link still needs
   a new deployment; students see nothing (they can't fix a deployment). */
const BR_CLIENT_BUILD='2026.10.23.1';
const UB={last:0,plan:null,leaving:false};
function brVerCmp(a,b){if(!a||!b)return 0;const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i]||0,q=y[i]||0;if(p!==q)return p<q?-1:1}return 0}
function brIsStaff(){return !!(S.boot&&S.boot.isTeacher)}
function brBust(url,v){return url?url+(url.indexOf('?')>=0?'&':'?')+'brv='+encodeURIComponent(v):''}
const UB_TRY='br_update_try';
function brLastTry(){try{return JSON.parse(localStorage.getItem(UB_TRY)||'null')}catch(e){return null}}
function brCheckVersion(force){
  const now=Date.now();if(!S.boot||(!force&&now-UB.last<120000))return;UB.last=now;
  try{google.script.run.withSuccessHandler(function(v){
    if(!v||!v.ok)return;const mine=BR_CLIENT_BUILD;let plan=null;
    if(brVerCmp(v.serverBuild,mine)>0)plan={to:v.serverBuild,url:brBust(v.url,v.serverBuild)};
    else if(brVerCmp(v.version,mine)>0&&v.liveUrl&&v.liveUrl!==v.url)plan={to:v.version,url:brBust(v.liveUrl,v.version)};
    else if(brVerCmp(v.version,mine)>0)plan={to:v.version,url:'',stuck:true};
    if(!plan){try{localStorage.removeItem(UB_TRY)}catch(e){}const o=document.querySelector('.br-update-bar');if(o)o.remove();return}
    const t=brLastTry();
    if(!plan.stuck&&t&&t.from===mine&&t.to===plan.to&&now-(t.at||0)<10*60000)plan.stuck=true;  // we went there and still got this build
    if(plan.stuck&&!brIsStaff())return;
    brShowUpdate(plan);
  }).withFailureHandler(function(){}).getBrAppVersion()}catch(e){}
}
function brShowUpdate(plan){
  const old=document.querySelector('.br-update-bar');if(old)old.remove();
  UB.plan=plan;const bar=document.createElement('div');bar.className='br-update-bar';bar.setAttribute('role','status');
  if(plan.stuck)bar.innerHTML=`<span><b>This link is still running v${esc(BR_CLIENT_BUILD)}</b>, but v${esc(plan.to)} has been saved. Reloading won’t change that until it is deployed to this link: double-click <b>Push &amp; deploy all</b> (or in Apps Script: Deploy → Manage deployments → pencil → Version: New version → Deploy). Students keep using v${esc(BR_CLIENT_BUILD)} meanwhile.</span><button type="button" class="btn small secondary" onclick="this.closest('.br-update-bar').remove()">OK</button>`;
  else bar.innerHTML=`<span>A new version of Bell Ringers is ready (v${esc(plan.to)}).</span>`+(plan.url?`<a class="btn small br-update-go" href="${esc(plan.url)}" target="_top" onclick="return brReloadForUpdate(this,event)">Reload</a>`:'<span><b>Press your browser’s reload button.</b></span>');
  document.body.appendChild(bar);
}
function brUnsaved(){
  try{if(typeof G!=='undefined'&&G.pending&&G.pending.size)return true}catch(e){}
  try{if(typeof SV!=='undefined'&&typeof svPending==='function'&&svPending())return true}catch(e){}
  return false;
}
// The Reload link opens the new build itself (a real link, so the browser always allows it).
// If grades or writing are still saving, the first click waits for them and then says it's safe.
function brReloadForUpdate(el,e){
  const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();
  try{if(typeof flushStudentSave==='function')flushStudentSave()}catch(x){}
  if(!brUnsaved()||el.getAttribute('data-ready')==='1'){
    UB.leaving=true;try{localStorage.setItem(UB_TRY,JSON.stringify({from:BR_CLIENT_BUILD,to:(UB.plan||{}).to,at:Date.now()}))}catch(x){}
    return true;
  }
  if(e)e.preventDefault();el.textContent='Saving your work…';
  (async()=>{
    try{if(typeof gsWaitSaves==='function')await gsWaitSaves()}catch(x){}
    for(let i=0;i<40&&brUnsaved();i++)await new Promise(r=>setTimeout(r,250));
    el.textContent=brUnsaved()?'Still saving — open anyway':'Saved — open the new version';el.setAttribute('data-ready','1');
  })();
  return false;
}
function brVersionStart(){
  setTimeout(()=>brCheckVersion(true),4000);
  window.addEventListener('focus',()=>brCheckVersion(false));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')brCheckVersion(false)});
  setInterval(()=>brCheckVersion(true),10*60000);
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function setTheme(grade){document.documentElement.style.setProperty('--theme','#6555ab');document.documentElement.style.setProperty('--theme2','#aaa0ec');}
function modal(html){$('modalHost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Bell Ringer workspace"><button class="modal-close" aria-label="Close dialog" onclick="closeModal()">\u00d7</button>${html}</div></div>`}function closeModal(){const had=!!$('modalHost').innerHTML;$('modalHost').innerHTML='';const f=S.onModalClose;S.onModalClose=null;if(had&&typeof f==='function'){try{f()}catch(e){}}}
function showConnectError(message){$('loading').innerHTML=`<div class="card" style="max-width:680px;margin:auto;text-align:left"><h2>Could not connect</h2><p>${esc(message)}</p><div class="notice"><b>Fix:</b> In Apps Script, run <b>setupSchEnglishBellRingers()</b> once and approve permissions. Then deploy a <b>new Web App version</b> and open the /exec URL.</div><p class="muted">Deployment should execute as the app owner and be accessible to the Google Workspace users who need the app.</p><button class="btn" onclick="location.reload()">Try Again</button></div>`}
function init(){
  const status=$('bootStatus');
  if(status)status.textContent='Client started. Checking Apps Script\u2026';
  let finished=false;
  const timer=setTimeout(()=>{
    if(!finished){
      finished=true;
      showConnectError('The server did not answer the startup request. Run diagnoseSchEnglishBellRingers() once from the Apps Script editor and check Executions for the exact server error.');
    }
  },10000);
  try{
    if(!window.google||!google.script||!google.script.run)throw new Error('Apps Script connection is unavailable. Open the deployed Web App /exec URL.');
    if(status)status.textContent='Apps Script connected. Checking server\u2026';
    google.script.run
      .withSuccessHandler(function(p){
        if(finished)return;
        if(!p||!p.ok){finished=true;clearTimeout(timer);showConnectError('The server ping did not return correctly.');return;}
        if(status)status.textContent='Server connected. Loading your account and classes\u2026';
        brFetchLastClass();brFetchProfile();
        google.script.run
          .withSuccessHandler(function(b){
            if(finished)return;
            finished=true;clearTimeout(timer);
            if(!b||!b.ok){showConnectError((b&&b.message)||'The server returned an invalid startup response.');return;}
            S.boot=b;
            $('loading').classList.add('hidden');
            $('app').classList.remove('hidden');
            $('rolePill').textContent=b.user.role+' \u00b7 v'+b.backendVersion;
            $('emailPill').textContent=b.user.email;
            $('homeBtn').onclick=home;
            configureShell();
            brStartHome();
            setTimeout(()=>{brReplayPendingGrades().catch(()=>{})},800);
            brVersionStart();
          })
          .withFailureHandler(function(e){
            if(finished)return;finished=true;clearTimeout(timer);
            showConnectError('Bootstrap failed: '+(e&&e.message?e.message:String(e||'unknown server error')));
          })
          .getBootstrap({preferredClassId:(function(){try{return localStorage.schEnglishClassId||''}catch(e){return ''}})()});
      })
      .withFailureHandler(function(e){
        if(finished)return;finished=true;clearTimeout(timer);
        showConnectError('Server ping failed: '+(e&&e.message?e.message:String(e||'unknown server error')));
      })
      .pingSchEnglish();
  }catch(e){
    if(finished)return;finished=true;clearTimeout(timer);showConnectError(e.message||String(e));
  }
}
function setNavActive(label){document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.textContent.trim()===label));}
function hero(title,sub){return `<section class="hero"><h1>${esc(title)}</h1><p>${esc(sub)}</p></section>`}
function teacherClassesPage(){
  setNavActive('Classes');
  const cs=S.boot.classes||[];
  $('view').innerHTML=`<div class="teacher-home"><div class="teacher-heading"><div><div class="class-kicker">Manage</div><h1>Classes</h1><p>Class codes, rosters, settings, and course organization.</p></div><div class="teacher-actions"><button class="btn" onclick="createClassDialog()">+ New Class</button>${S.boot.isAdmin?'<button class="btn secondary" onclick="adminDialog()">Teacher Access</button>':''}</div></div>${cs.length?`<div class="class-grid-modern">${cs.map(c=>`<div class="class-card-modern ${c.classId===workingClassId()?'is-current':''}" onclick="openTeacherClass('${c.classId}')"><div class="class-kicker">Grade ${esc(c.grade||'')} ${c.period?'\u00b7 '+esc(c.period):''}${c.classId===workingClassId()?'<span class="current-chip">Working in</span>':''}</div><h3>${esc(c.className)}</h3><div class="muted" style="font-size:.78rem;margin-bottom:6px">Join code</div><div class="class-code-modern">${esc(c.joinCode)}</div><div class="row" style="margin-top:16px"><button class="btn secondary small" onclick="event.stopPropagation();editClassDialog('${c.classId}')">Edit</button><button class="btn danger small" onclick="event.stopPropagation();deleteClassNow('${c.classId}')">Delete</button></div></div>`).join('')}</div>`:`<div class="teacher-empty"><h3>No classes yet</h3><button class="btn" onclick="createClassDialog()">+ Create Class</button></div>`}</div>`;
}
async function addBellRingerToClass(id){closeModal();await openTeacherClass(id);openLibraryPage();}
async function studentHome(){
  if(S.preview)return previewStudentHome();
  if(S.needsName)return showNamePage();
  setNavActive('Assignments');
  const cs=S.boot.classes||[];
  if(!cs.length){
    $('view').innerHTML=`<div class="student-page"><div class="student-topline"><div><div class="class-kicker">SchEnglish</div><h1>Your assignments</h1><p>Join your English class to get started.</p></div></div><div class="teacher-empty"><h3>No class yet</h3><p class="muted">Enter the join code your teacher gave you.</p><button class="btn" onclick="joinDialog()">Join a Class</button></div></div>`;return;
  }
  const preferred=workingClassId();
  const target=cs.find(c=>c.classId===preferred)||cs[0];
  if(S.classId===target.classId&&S.classData){renderStudentClass();return}
  $('view').innerHTML=`<div class="student-page"><div class="muted" style="padding:30px 0">Loading your assignments\u2026</div></div>`;
  await openStudentClass(target.classId);
}
async function studentFeedbackPage(){
  if(S.needsName&&!S.preview)return showNamePage();
  setNavActive('Feedback');
  const cs=S.boot.classes||[],v=$('view');
  if(S.preview){v.innerHTML=`<div class="student-page">${previewBanner(classById(S.previewClassId))}<div class="student-topline"><div><div class="class-kicker">Your progress</div><h1>Feedback</h1><p>Teacher comments and assessed bell ringers in one place.</p></div></div><div class="teacher-empty"><h3>No feedback yet</h3><p class="muted">Students see each assessed bell ringer here with its level and your comment.</p></div></div>`;return;}
  v.innerHTML=`<div class="student-page"><div class="student-topline"><div><div class="class-kicker">Your progress</div><h1>Feedback</h1><p>Teacher comments and assessed bell ringers in one place.</p></div></div><div class="muted" style="padding:24px 0">Loading feedback\u2026</div></div>`;
  const details=await Promise.all(cs.map(c=>call('getStudentClass',[c.classId]).catch(()=>null)));
  const items=[];details.filter(Boolean).forEach(d=>(d.assignments||[]).forEach(a=>{const r=a.response||{};if((r.score!==''&&r.score!=null)||r.feedback)items.push({a:a,c:d.class})}));
  items.sort((x,y)=>String(y.a.response&&y.a.response.updatedAt||'').localeCompare(String(x.a.response&&x.a.response.updatedAt||'')));
  v.innerHTML=`<div class="student-page"><div class="student-topline"><div><div class="class-kicker">Your progress</div><h1>Feedback</h1><p>Teacher comments and assessed bell ringers in one place.</p></div></div>${items.length?`<div class="assignment-list">${items.map(x=>{const r=x.a.response||{},level=performanceLabel(r.score);return `<div class="assignment-row-modern marked" onclick="openStudentClass('${x.c.classId}').then(()=>openStudentAssignment('${x.a.assignmentId}'))"><div class="assignment-accent"></div><div><div class="assignment-title">${esc(x.a.title)}</div><div class="assignment-meta">${esc(x.c.className)} \u00b7 ${esc(x.a.category||'Bell Ringer')}</div></div><div class="assignment-state"><strong>${esc(level||'Marked')}</strong>${r.score!==''&&r.score!=null?esc(r.score)+'/5':''}${r.feedback?`<span class="marked-feedback-inline">${esc(r.feedback)}</span>`:''}</div></div>`}).join('')}</div>`:`<div class="teacher-empty"><h3>No feedback yet</h3><p class="muted">Assessed bell ringers and teacher comments will appear here.</p></div>`}</div>`;
}
function studentAssignmentState(a){const r=a.response||{};if(r.score!==''&&r.score!=null)return 'marked';if(r.status==='submitted')return 'submitted';return 'todo'}
function studentAssignmentRow(a){const r=a.response||{},state=studentAssignmentState(a),level=state==='marked'?performanceLabel(r.score):'',label=state==='marked'?(level||'Marked'):state==='submitted'?'Submitted':r.status==='draft'?'Draft saved':'To do';return `<div class="assignment-row-modern ${state}" onclick="openStudentAssignment('${a.assignmentId}')"><div class="assignment-accent"></div><div><div class="assignment-title">${esc(a.title)}</div><div class="assignment-meta">${esc(a.category||'Bell Ringer')}</div></div><div class="assignment-state"><strong>${esc(label)}</strong>${state==='marked'?esc(r.score)+'/5':''}${state==='marked'&&r.feedback?`<span class="marked-feedback-inline">${esc(r.feedback)}</span>`:''}</div></div>`}
function studentSection(title,items){return `<section class="student-section"><div class="student-section-head"><h2>${title}</h2><span class="student-count">${items.length}</span></div>${items.length?`<div class="assignment-list">${items.map(studentAssignmentRow).join('')}</div>`:`<div class="muted" style="padding:8px 2px">Nothing here right now.</div>`}</section>`}
function createClassDialog(){modal(`<h2>Create a Class</h2><div class="field"><label>Class name</label><input id="ccName" placeholder="English 10"></div><div class="field"><label>Period / section</label><input id="ccPeriod" placeholder="Period 2"></div><div class="field"><label>Grade</label><select id="ccGrade">${[6,7,8,9,10,11,12].map(x=>`<option ${x===10?'selected':''}>${x}</option>`).join('')}</select></div><div class="row"><button class="btn" onclick="createClassNow()">Create</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}

.studentEmail).replace(/'/g,''))}',this)">Remove</button>`}</td></tr>`).join('')}</table></div>`;

async function saveCanvasClass(){try{await call('updateClass',[{classId:S.classId,canvasBaseUrl:$('canvasUrl').value,canvasCourseId:$('canvasCourse').value}]);toast('Canvas class link saved.');await openTeacherClass(S.classId)}catch(e){toast(e.message)}}
function openLibraryPage(){const p=$('teacherPanel');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));p.innerHTML='<div class="page-title-row"><div><h2>Add Bell Ringer</h2><div class="muted">Preview a grade-level prompt, then assign it to this class.</div></div><div class="spacer"></div><button class="btn secondary" onclick="teacherTab(\'assignments\')">\u2190 Back to Assignments</button></div><div id="libraryMount"></div>';loadLibrary()}
async function loadLibrary(){
  const p=$('libraryMount')||$('teacherPanel');
  p.innerHTML='<div class="card">Loading library\u2026</div>';
  try{
    const r=await call('getLibrary');
    const rawGrade=Number(S.classData&&S.classData.class&&S.classData.class.grade||9);
    const targetGrade=[9,10,11,12].includes(rawGrade)?rawGrade:9;
    S.libraryGrade=targetGrade;
    const built=(r.builtIn||[]).filter(x=>!x.grade||Number(x.grade)===targetGrade);
    const all=[
      ...built.map((x,i)=>Object.assign({source:'built-in',__key:'built-'+(x.id||i)},x)),
      ...(r.custom||[]).map((x,i)=>Object.assign({source:'custom',__key:'custom-'+(x.itemId||i)},x))
    ];
    S.libraryItems=all;
    S.libraryFilter='All';
    S.librarySearch='';
    S.librarySelected=all.length?all[0].__key:'';
    if(!all.length){
      p.innerHTML=`<div class="card"><h3>Built-in library not detected</h3><p class="muted">${esc(r.libraryDiagnostic||'Keep BellRingerLibrary.gs in this Apps Script project, then redeploy.')}</p><p class="muted">Detected source: ${esc(r.librarySource||'none')} \u00b7 Built-in items: ${esc(r.libraryCount||0)}</p></div>`;
      return;
    }
    renderLibrary();
  }catch(e){
    p.innerHTML=`<div class="notice">${esc(e.message)}</div>`;
  }
}
function libraryCategories(){
  const counts={};
  S.libraryItems.forEach(x=>{const c=x.category||'Other';counts[c]=(counts[c]||0)+1});
  return Object.keys(counts).sort((a,b)=>a.localeCompare(b)).map(name=>({name,count:counts[name]}));
}
function filteredLibraryItems(){
  const q=String(S.librarySearch||'').trim().toLowerCase();
  return S.libraryItems.filter(x=>{
    if(S.libraryFilter!=='All'&&(x.category||'Other')!==S.libraryFilter)return false;
    if(!q)return true;
    const hay=[x.title,x.name,x.category,x.preview,x.prompt,x.directions,x.skill,x.learningPoint,x.testStyle,x.gradeLabel,(x.tags||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function renderLibrary(){
  const p=$('libraryMount')||$('teacherPanel');
  const cats=libraryCategories();
  const items=filteredLibraryItems();
  if(items.length&&!items.some(x=>x.__key===S.librarySelected))S.librarySelected=items[0].__key;
  if(!items.length)S.librarySelected='';
  const catButtons=[{name:'All',count:S.libraryItems.length},...cats].map(c=>`<button class="library-cat ${S.libraryFilter===c.name?'active':''}" onclick='setLibraryFilter(${JSON.stringify(c.name)})'>${esc(c.name)} <span style="opacity:.7">${c.count}</span></button>`).join('');
  const list=items.length?items.map(x=>`<button class="library-item ${S.librarySelected===x.__key?'active':''}" onclick='selectLibraryItem(${JSON.stringify(x.__key)})'><div class="library-item-title">${esc(x.title||x.name||'Bell Ringer')}</div><div class="library-item-meta">${esc(x.category||'Other')}${x.testStyle?' \u00b7 '+esc(x.testStyle):''}${x.duration?' \u00b7 '+esc(x.duration):''}${x.source==='custom'?' \u00b7 Custom':''}</div></button>`).join(''):`<div class="card library-empty"><b>No bell ringers match.</b><div class="muted" style="margin-top:6px">Try another category or search.</div></div>`;
  p.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row"><div><div class="row" style="gap:8px"><h3 style="margin:0">Grade ${esc(S.libraryGrade||'')} Bell Ringer Library</h3><span class="grade-library-note">Unique Grade ${esc(S.libraryGrade||'')} bank</span></div><div class="library-count">${S.libraryItems.length} bell ringers \u00b7 this class only sees its grade-level built-in bank \u00b7 custom ringers remain available</div></div><div class="spacer"></div><button class="btn secondary" onclick="customDialog()">+ Custom Bell Ringer</button></div><div class="library-toolbar" style="margin-top:14px"><div class="searchbox"><input id="librarySearch" placeholder="Search title, skill, or prompt\u2026" value="${esc(S.librarySearch)}" oninput="setLibrarySearch(this.value)"></div></div><div class="library-cats">${catButtons}</div></div><div class="library-layout"><div class="library-list">${list}</div><div id="libraryPreview" class="card library-preview"></div></div>`;
  renderLibraryPreview();
}
function setLibraryFilter(name){S.libraryFilter=name;renderLibrary()}
function setLibrarySearch(value){S.librarySearch=value;renderLibrary();const el=$('librarySearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function selectLibraryItem(key){S.librarySelected=key;renderLibrary()}
function selectedLibraryItem(){return S.libraryItems.find(x=>x.__key===S.librarySelected)||null}
function renderLibraryPreview(){
  const host=$('libraryPreview');if(!host)return;
  const x=selectedLibraryItem();
  if(!x){host.innerHTML='<div class="library-empty"><h3>Select a bell ringer</h3><p class="muted">Its complete prompt and directions will appear here.</p></div>';return}
  const tags=Array.isArray(x.tags)?x.tags:[];
  host.innerHTML=`<div><span class="library-label">${esc(x.category||'Other')}</span>${x.grade?`<span class="library-label">Grade ${esc(x.grade)}</span>`:''}${x.testStyle?`<span class="library-label">${esc(x.testStyle)}</span>`:''}${x.duration?`<span class="library-label">${esc(x.duration)}</span>`:''}${x.source==='custom'?'<span class="library-label">Custom</span>':''}</div><h2>${esc(x.title||x.name||'Bell Ringer')}</h2>${x.preview?`<p class="library-summary">${esc(x.preview)}</p>`:''}${x.skill?`<div class="library-section-title">Focus</div><div>${esc(x.skill)}</div>`:''}${x.learningPoint?`<div class="learning-point-box"><strong>Learning point</strong>${esc(x.learningPoint)}</div>`:''}<div class="library-section-title">Student prompt</div><div class="prompt library-preview-text">${esc(x.prompt||'')}</div>${x.directions?`<div class="library-section-title">Directions</div><div class="library-preview-text">${esc(x.directions)}</div>`:''}${tags.length?`<div class="library-section-title">Skills / tags</div><div>${tags.map(t=>`<span class="library-label">${esc(t)}</span>`).join('')}</div>`:''}<div class="row" style="margin-top:20px"><button class="btn" onclick="assignLibrarySelection()">Assign Bell Ringer</button>${x.source==='custom'?`<button class="btn danger" onclick="deleteCustom('${esc(x.itemId)}')">Delete Custom</button>`:''}</div>`;
}
function assignLibrarySelection(){const x=selectedLibraryItem();if(!x)return;assignDialog(JSON.stringify(x))}
function customDialog(){modal(`<h2>Custom Bell Ringer</h2>${assignmentFields({})}<div class="row"><button class="btn" onclick="saveCustomNow()">Save to Library</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`)}
function assignmentFields(x){return `<div class="field"><label>Title</label><input id="aTitle" value="${esc(x.title||x.name||'')}"></div><div class="field"><label>Category</label><input id="aCat" value="${esc(x.category||'Custom')}"></div><div class="field"><label>Prompt</label><textarea id="aPrompt">${esc(x.prompt||'')}</textarea></div><div class="field"><label>Directions</label><textarea id="aDirections">${esc(x.directions||'')}</textarea></div><div class="field"><label>Response type</label><select id="aType"><option value="writing">Writing</option><option value="photo">Photo</option><option value="writing_photo">Writing + Photo</option><option value="drawing">Drawing / Diagram</option></select></div><div class="scale-box"><strong>Assessment: 5-point performance scale</strong><div class="muted">Advanced 5 \u00b7 Proficient 4 \u00b7 Developing 3 \u00b7 Incomplete 2 \u00b7 Zero 0</div></div><input id="aAssess" type="hidden" value="rubric5"><input id="aPoints" type="hidden" value="5"><div class="field"><label>Teacher note <small class="muted">(optional) \u2014 Gemini follows this when it gives feedback, e.g. \u201cFocus on the topic sentence\u201d</small></label><textarea id="aNote" placeholder="What should feedback focus on for this bell ringer?">${esc(x.teacherNote||'')}</textarea></div>`}

async function saveCustomNow(){try{await call('saveCustomBellRinger',[readAssignmentForm()]);closeModal();toast('Saved to your library.');loadLibrary()}catch(e){toast(e.message)}}
// Links from Canvas open the app at ?br=<bell ringer>&c=<class>.
// Opening the app from a Canvas link (?br=<bell ringer id>). The app finds the
// copy of that bell ringer in one of the student's own classes, so a Canvas
// assignment shared by several periods works for everyone.
function handleDeepLink(){
  try{
    if(!(window.google&&google.script&&google.script.url))return;
    google.script.url.getLocation(async function(loc){
      const p=(loc&&loc.parameter)||{},br=p.br,c=p.c;if(!br||!S.boot||S.deepLinkDone===br)return;
      if(S.needsName&&!S.boot.isTeacher){S.pendingDeepLink=true;return}
      S.deepLinkDone=br;
      if(S.boot.isTeacher){if(S.view==='teacher'){try{await gradeScreen(br)}catch(e){}}return}
      for(let i=0;i<40&&!S.classData&&(S.boot.classes||[]).length;i++)await new Promise(r=>setTimeout(r,100));
      let r=null;try{r=await call('resolveBrDeepLink',[{br:br,c:c||''}])}catch(e){r=null}
      let classId=r?r.classId:'',aid=r?r.assignmentId:'';
      if(!r){const k=(S.boot.classes||[]).find(x=>x.classId===c);if(k){classId=k.classId;aid=br}}
      if(classId&&!(S.boot.classes||[]).some(x=>x.classId===classId)){try{await refreshBoot()}catch(e){}}

  if(res.unexcused&&res.unexcused.length)parts.push(`Excused earlier, now assessed, so Canvas counts it again: ${res.unexcused.join(', ')}.`);
  if(res.waiting&&res.waiting.length)parts.push(`Not sent yet \u2014 written but not assessed: ${res.waiting.join(', ')}. Assess them and push again.`);
  if(res.skipped&&res.skipped.length)parts.push(`Left blank (not submitted): ${res.skipped.join(', ')}.`);
  if(res.trialSkipped)parts.push(`${res.trialSkipped} trial student${res.trialSkipped===1?' was':'s were'} skipped (they are never sent to Canvas).`);
  if(res.unmatched&&res.unmatched.length)parts.push(`\u26a0 No matching Canvas student: ${res.unmatched.join(', ')} \u2014 check their Canvas login email.`);
  if(res.warnings&&res.warnings.length)parts.push('\u26a0 '+res.warnings.join(' '));
  if(res.via==='hub')parts.push('(Sent through your LMS Hub.)');
  return parts.join(' ');
}
/* 2026.10.18.1 "\u2197 Push all to Canvas" (Gradebook card): every bell ringer already in Canvas,
   through the same server code as each tile's Push. Never creates a Canvas assignment. */
function gbPushAllSummary(r){
  const p=[`<b>Sent ${r.sent} score${r.sent===1?'':'s'} to Canvas</b> across ${r.pushed.length} bell ringer${r.pushed.length===1?'':'s'}${r.via==='hub'?' (through your LMS Hub)':''}.`];
  p.push(r.feedbackPosted?`${r.feedbackPosted} new or revised comment${r.feedbackPosted===1?'':'s'} shared.`:'Comments already up to date.');
  if(r.excused)p.push(`${r.excused} excluded response${r.excused===1?'':'s'} marked Excused.`);
  if(r.unexcused)p.push(`${r.unexcused} earlier excusal${r.unexcused===1?'':'s'} lifted.`);
  if(r.waiting&&r.waiting.length)p.push(`Not sent yet \u2014 written but not assessed: ${esc(r.waiting.slice(0,10).join(', '))}${r.waiting.length>10?' +'+(r.waiting.length-10):''}.`);
  if(r.unmatched&&r.unmatched.length)p.push(`\u26a0 No matching Canvas student: ${esc(r.unmatched.join(', '))}.`);
  if(r.deletedInCanvas&&r.deletedInCanvas.length)p.push(`\u26a0 Deleted in Canvas: ${esc(r.deletedInCanvas.join(', '))}. Push all doesn\u2019t make assignments \u2014 press Push on ${r.deletedInCanvas.length===1?'its tile':'their tiles'} (or Save in Due date &amp; Canvas\u2026) to make ${r.deletedInCanvas.length===1?'it':'them'} again.`);
  if(r.notInCanvas&&r.notInCanvas.length)p.push(`Not in Canvas yet (use Push on that tile once): ${esc(r.notInCanvas.join(', '))}.`);
  if(r.notGraded&&r.notGraded.length)p.push(`Skipped, not graded: ${esc(r.notGraded.join(', '))}.`);
  (r.failures||[]).forEach(f=>p.push(`\u26a0 <b>${esc(f.label)}</b> didn\u2019t send: ${esc(f.message)}`));
  if(r.notReached&&r.notReached.length)p.push(`\u26a0 Ran out of time before: ${esc(r.notReached.join(', '))}. Press Push all again to finish.`);
  (r.warnings||[]).forEach(w=>p.push('\u26a0 '+esc(w)));
  return p.join(' ');
}

function gradebookCardHtml(hub){
  const asg=(hub.assignments||[]).slice().sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))),students=hub.students||[];
  if(!asg.length||!students.length)return `<section class="card dash-card" id="gradebookCard"><div class="dash-card-head"><div class="dash-card-title"><h3>Gradebook</h3><span class="mini-chip">${students.length} students \u00b7 ${asg.length} bell ringers</span></div></div><p class="dash-card-sub">${students.length?'Scores appear here once you assign a bell ringer.':'Students appear here after they join with code '+esc(hub.class.joinCode||'')+'.'}</p></section>`;

      const label=c.excluded?'ex':has?`${c.score}${c.redo?'<span class="cell-redo" title="Resubmitted after grading">\u21bb</span>':''}`:(c.submitted||c.needs)?'<span class="cell-pending">\u2022</span>':'\u2014';

/* ===== 2026.10.14.3 grading screen: the Macbeth marking flow ===== */
// One bell ringer at a time, the whole class in five groups:
//   Resubmitted / Ready to Grade / Not Submitted / Graded / Excluded.
// Every click saves on its own. Scoring a student moves their row into
// Graded straight away, excluding moves it into Excluded and clearing the
// score moves it back to where a fresh load would put it -- sorted by name,
// counts updated (Jaben, 2026-10-19). In Focused grading the screen jumps
// straight to the next student who needs marking.
// Saves for one student go out one at a time and always send what is on
// screen, so the last thing you did wins (Macbeth 2026-10-08a).
const G={assignmentId:null,data:null,hide:false,focusEmail:'',focusHistory:[],focusSeen:{},saveQ:{},pending:new Set(),bound:false};
const GS_LEVELS=[[5,'Advanced'],[4,'Proficient'],[3,'Developing'],[2,'Incomplete'],[0,'Zero']];
const GS_RANKS=[-1,0,4,1,3,2];   // submitted first, drafts next, graded last
const GS_OPTIONAL=[-1,3,4];      // shown only when someone is in them
function gsHas(v){return !(v===''||v===null||v===undefined)}
function gsRow(email){return ((G.data&&G.data.rows)||[]).find(r=>r.email===email)||null}
function gsRank(r){if(r.excluded)return 3;if(r.redo&&r.text)return -1;if(gsHas(r.score))return 2;if(!String(r.text||'').trim())return 1;if(!r.submitted)return 4;return 0}
function gsGroupMeta(rank){
  if(rank===-1)return {label:'Needs Regrade',note:'Rewritten, or written for the first time, after you scored it'};
  if(rank===0)return {label:'Needs Grading',note:'Submitted work without a score yet'};
  if(rank===4)return {label:'Started \u2014 Not Submitted',note:'Partly done: the student wrote something but has not turned it in'};
  if(rank===1)return {label:'Incomplete',note:'Nothing written yet'};
  if(rank===2)return {label:'Graded',note:'Already scored'};
  return {label:'Excluded',note:'Not counted for these students'};
}

// ---- Writing process on the grading screen (2026.10.19, same as Short Story) ----
// Red: pasted in from outside the app. Amber: pasted from this bell ringer's own
// task text (copying the paragraph to revise is expected). Evidence for a
// conversation with the student, never a verdict.
function prSpans(text,proc){
  text=String(text||'');const ev=(proc&&Array.isArray(proc.pasteEvents)?proc.pasteEvents:[]).filter(e=>e&&e.head&&Number(e.chars)>0);
  if(!ev.length||!text)return [];
  let run='',map=[],last=-1;
  for(let i=0;i<text.length;i++){if(/\s/.test(text[i])){if(last===1)continue;run+=' ';map.push(i);last=1}else{run+=text[i];map.push(i);last=0}}
  const spans=[],used=[];
  ev.forEach(e=>{const head=String(e.head).replace(/\s+/g,' ').trim();if(head.length<12)return;let from=0,at=-1;
    while(true){at=run.indexOf(head,from);if(at<0)return;if(!used.some(u=>at>=u[0]&&at<u[1]))break;from=at+1}
    const len=Math.max(head.length,Math.min(Number(e.chars)||head.length,run.length-at));used.push([at,at+len]);
    const a=map[at],b=at+len>=map.length?text.length:map[at+len];spans.push({start:a,end:Math.max(a+1,b),kind:e.fromSource?'source':'outside'})});
  spans.sort((x,y)=>x.start-y.start||y.end-x.end);
  const out=[];spans.forEach(sp=>{const p=out[out.length-1];if(p&&sp.start<p.end){if(sp.end>p.end)p.end=sp.end;if(sp.kind==='outside')p.kind='outside';return}out.push(Object.assign({},sp))});
  return out;
}
function prSummary(r){
  const t=String(r.text||''),p=r.process||null,spans=prSpans(t,p);let outside=0,src=0;
  spans.forEach(sp=>{const n=sp.end-sp.start;if(sp.kind==='outside')outside+=n;else src+=n});
  const ev=p&&Array.isArray(p.pasteEvents)?p.pasteEvents:[];
  const tracked=!!(p&&(Number(p.inputEvents)||Number(p.activeMs)||ev.length));
  const outsideEv=ev.filter(e=>!e.fromSource);
  return {spans,outside,src,pct:t.length?Math.round(outside/t.length*100):0,tracked,min:p?Math.round(Number(p.activeMs||0)/6000)/10:0,
    pre:p?Number(p.preChars||0):0,pastes:ev.length,pastedChars:outsideEv.reduce((a,e)=>a+Number(e.chars||0),0),srcPastes:ev.length-outsideEv.length,sessions:p?Number(p.sessions||0):0};
}
function gsAuthBox(r){
  const t=String(r.text||'');if(!t.trim())return '<div class="response-box"><em>No written response submitted yet.</em></div>';
  let spans=[];try{spans=prSummary(r).spans}catch(e){}

function gsProcStats(r,when){

function gsRenderList(){

function gsGroupHtml(rank,items){const m=gsGroupMeta(rank);return `<section class="batch-grade-group ${items.length?'':'is-empty'}" data-grade-group="${rank}"><div class="batch-grade-group-head"><div><strong>${m.label}</strong><span>${m.note}</span></div><span class="batch-grade-group-count">${items.length}</span></div><div class="batch-group-list">${items.map(gsRowHtml).join('')}</div></section>`}
function gsGroupCounts(){
  document.querySelectorAll('#gsList .batch-grade-group').forEach(g=>{const list=g.querySelector('.batch-group-list');const n=list?list.querySelectorAll(':scope > .batch-row').length:0;const c=g.querySelector('.batch-grade-group-count');if(c)c.textContent=String(n);g.classList.toggle('is-empty',n===0);g.hidden=n===0&&GS_OPTIONAL.includes(Number(g.dataset.gradeGroup))});
}
// The list for a group; a group a fresh load leaves out (Needs Regrade,
// Started, Excluded) is added in its place the first time someone moves in.
function gsGroupList(rank){
  const wrap=document.querySelector('#gsList .batch-grade-groups');if(!wrap)return null;
  const have=k=>wrap.querySelector(`:scope > .batch-grade-group[data-grade-group="${k}"]`);
  let sec=have(rank);
  if(!sec){
    const tmp=document.createElement('div');tmp.innerHTML=gsGroupHtml(rank,[]);sec=tmp.firstElementChild;
    const after=GS_RANKS.slice(GS_RANKS.indexOf(rank)+1).map(have).find(Boolean)||null;

// A move set off by a mouse press (a score box losing focus as you click a
// level in the same row) waits until that click has landed.
const GS_PTR={down:false,at:0,rows:new Set()};
function gsPtrDown(){return GS_PTR.down&&Date.now()-GS_PTR.at<3000}
function gsPtrFlush(){setTimeout(()=>{if(gsPtrDown())return;const rows=Array.from(GS_PTR.rows);GS_PTR.rows.clear();rows.forEach(gsResort)},0)}
// Files the row in the group a fresh load would give it, in name order.
// Only a row that is out of place is moved: re-inserting a row that is
// already where it belongs swallows the next click in it. Focused grading
// is full-screen, so its row is filed when the view moves on.
function gsResort(row){
  if(!row||!row.isConnected)return;
  const r=gsRow(row.dataset.email);if(!r)return;
  const rank=gsRank(r);row.dataset.gradeRank=String(rank);
  if(row.classList.contains('focus-mode')){row.dataset.pendingResort='1';return}
  if(gsPtrDown()){GS_PTR.rows.add(row);setTimeout(gsPtrFlush,3100);return}
  delete row.dataset.pendingResort;
  const target=gsGroupList(rank);if(!target)return;
  if(row.parentElement!==target)target.appendChild(row);
  const rows=Array.from(target.children).filter(el=>el.classList.contains('batch-row'));
  const sorted=rows.slice().sort((a,b)=>String(a.dataset.studentName||'').localeCompare(String(b.dataset.studentName||'')));
  if(sorted.some((el,i)=>el!==rows[i]))sorted.forEach(el=>target.appendChild(el));
  gsGroupCounts();
}
function gsUpdateRow(email){

  const off=row.querySelector('.gs-off');if(off){const isOff=sc!==null&&!GS_LEVELS.some(l=>l[0]===sc);off.hidden=!isOff;if(isOff)off.innerHTML=`Teacher-entered score: <strong>${sc}</strong>. It falls between the rubric\u2019s levels.`}

function gsApply(email,patch){

function gsSaveState(email,text,bad){document.querySelectorAll(`.gs-save[data-email="${CSS.escape(email)}"]`).forEach(el=>{el.textContent=text;el.classList.toggle('is-bad',!!bad)})}
// 2026.10.19: grade saves go to the server one at a time, and a "busy" answer
// (nothing was written) is retried on its own instead of asking you to click again.
let GS_CHAIN=Promise.resolve();
function gsSerial(fn){const p=GS_CHAIN.then(fn,fn);GS_CHAIN=p.catch(()=>{});return p}
async function gsSendRetry(email,pl){
  const waits=[1500,3000,6000,10000,15000];
  for(let i=0;;i++){
    try{return await call('setBrGradeItem',[pl])}
    catch(e){if(i<waits.length&&/busy/i.test(String(e&&e.message||e))){gsSaveState(email,'Saving… (waiting for the sheet)');await new Promise(r=>setTimeout(r,waits[i]));continue}throw e}
  }
}
function gsSave(email){
  const r=gsRow(email);if(!r)return;
  if(G.data)delete S.hubCache[G.data.class.classId];
  const aid=G.assignmentId,key=aid+'|'+email;
  const q=G.saveQ[key]||(G.saveQ[key]={running:null,again:false});
  gsSaveState(email,'Saving\u2026');
  if(q.running){q.again=true;return q.running}
  const send=()=>{const pl={assignmentId:aid,studentEmail:email,score:gsHas(r.score)?Number(r.score):null,excluded:!!r.excluded,comment:r.comment||'',seenFp:r.fp||''};brPendingPut(pl);return gsSerial(()=>gsSendRetry(email,pl))};
  const run=async()=>{do{q.again=false;let res=await send();
    // The server reads the grade back after writing it. If it is not what was sent (and nothing newer is queued), try once more.
    if(res&&res.verified===false&&!q.again){res=await send();if(res&&res.verified===false&&!q.again)throw new Error('the sheet did not keep the grade')}
  }while(q.again);brPendingDrop(aid,email);if(G.data)delete S.hubCache[G.data.class.classId]};
  q.running=run().then(()=>gsSaveState(email,'\u2713 Saved')).catch(e=>{if(e&&e.auth){gsSaveState(email,'\u26a0 Not saved yet \u2014 Google signed this page out. Reload the page and this grade is sent automatically.',true);return}brPendingDrop(aid,email);gsSaveState(email,'\u26a0 Not saved: '+String(e&&e.message||e).slice(0,160)+' \u2014 click the level again',true);alert('Could not save '+(r.name||'this student')+'\u2019s grade \u2014 click the level again: '+e.message)}).finally(()=>{q.running=null});
  gsTrack(q.running);return q.running;
}

// The rubric sits beside the work, one criterion at a time, top level first.
function gsFocusRubric(){
  const a=G.data&&G.data.assignment;if(!a)return '';
  const rb=rubricFor(a.category);
  return `<div class="class-kicker">Rubric \u00b7 ${esc(rb.name)}</div>${rb.rows.map(([crit,d])=>`<div class="fr-crit"><b>${esc(crit)}</b>${d.map((x,i)=>`<div class="fr-lv lv-c${RUBRIC_LEVELS[i][0]}"><span>${RUBRIC_LEVELS[i][0]}</span>${esc(x)}</div>`).join('')}</div>`).join('')}<p class="fr-zero"><b>0</b> No response, or off task.</p>`;
}
function gsRowsEls(){return Array.from(document.querySelectorAll('#gsList .batch-row[data-email]'))}
function gsSetFocus(email){
  document.querySelectorAll('#gsList .batch-row.focus-mode').forEach(el=>{el.classList.remove('focus-mode');if(el.dataset.pendingResort)gsResort(el)});
  G.focusEmail=email||'';
  if(!email)return;
  const row=gsRowsEls().find(el=>el.dataset.email===email);
  if(!row){G.focusEmail='';return}
  row.classList.add('focus-mode');gsFocusLeft();
  const fr=row.querySelector('.gs-focus-rubric');if(fr&&!fr.innerHTML)fr.innerHTML=gsFocusRubric();
  const dok=row.querySelector('.grade-row-dok');if(dok)dok.scrollTop=0;
  const w=row.querySelector('.batch-work');if(w)w.scrollTop=0;
}
function gsCloseFocus(){const email=G.focusEmail;gsSetFocus('');const row=gsRowsEls().find(el=>el.dataset.email===email);if(row)row.scrollIntoView({block:'start'})}
function gsNeeds(email){const r=gsRow(email);if(!r)return false;const k=gsRank(r);return k===0||k===-1||k===4}
function gsIsDraft(email){const r=gsRow(email);return !!r&&gsRank(r)===4}
function gsQueue(){return gsRowsEls().map(el=>el.dataset.email).filter((e,i,a)=>a.indexOf(e)===i&&gsNeeds(e))}
function gsFocusLeft(){
  const q=gsQueue(),drafts=q.filter(gsIsDraft).length,left=q.length-drafts;
  document.querySelectorAll('#gsList .batch-row.focus-mode .focus-left').forEach(el=>{el.textContent=(left?left+' submitted left to mark':'All submitted work is marked')+(drafts?' \u00b7 '+drafts+' unsubmitted draft'+(drafts===1?'':'s')+' after that':'')});
  document.querySelectorAll('#gsList .batch-row.focus-mode .gs-prev').forEach(b=>b.disabled=!G.focusHistory.length);
}
// "Next to mark" skips anyone who hasn't submitted or is already marked, and
// anyone you passed over this time round. "Back" retraces who you viewed.
function gsStep(dir){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const current=G.focusEmail;
  if(dir<0){const prev=G.focusHistory.pop();if(prev)gsSetFocus(prev);return}
  G.focusSeen[current]=true;
  const queue=gsQueue().filter(e=>e!==current);
  let next=queue.find(e=>!G.focusSeen[e]);
  if(!next&&queue.length){G.focusSeen={};G.focusSeen[current]=true;next=queue[0]}
  if(!next){gsFocusLeft();return}
  G.focusHistory.push(current);gsSetFocus(next);
}

async function gsAiDraft(email,btn){
  const r=gsRow(email);if(!r)return;
  const ta=document.querySelector(`#gsList .gs-comment[data-email="${CSS.escape(email)}"]`);

    const txt=String(res.feedback||'').trim();if(!txt)throw new Error('No feedback came back.');
    if(ta){ta.value=ta.value.trim()?ta.value.trim()+'\n\n'+txt:txt;r.comment=ta.value;gsSave(email);ta.focus()}
  }catch(e){alert('Gemini could not draft feedback: '+(e&&e.message?e.message:e))}
  finally{btn.disabled=false;btn.textContent=old}
}
function gsBind(){
  if(G.bound)return;G.bound=true;
  window.addEventListener('beforeunload',e=>{if(G.pending.size){e.preventDefault();e.returnValue='A grade is still saving.';return e.returnValue}});
  document.addEventListener('click',e=>{
    const t=e.target.closest?e.target.closest('.gs-score,.gs-keep,.gs-open,.gs-close,.gs-prev,.gs-next,.gs-ai,#gsBack,#gsRefresh,#gsNoGrade'):null;
    if(!t||!$('gsList'))return;
    if(t.id==='gsBack'){t.disabled=true;gsWaitSaves().then(()=>teacherHome(G.data?G.data.class.classId:undefined));return}
    if(t.id==='gsRefresh'){t.disabled=true;t.textContent='Refreshing\u2026';gsWaitSaves().then(gsLoad).finally(()=>{const b=$('gsRefresh');if(b){b.disabled=false;b.textContent='\u21bb Refresh'}});return}
    if(t.id==='gsNoGrade'){const a=G.data.assignment,next=!a.noGrade;t.disabled=true;call('setBrAssignmentNoGrade',[{assignmentId:a.assignmentId,noGrade:next}]).then(r=>{a.noGrade=next;delete S.hubCache[G.data.class.classId];gsRenderPanel();if(r.canvasNote)toast(r.canvasNote)}).catch(err=>{alert('Could not update the whole class: '+err.message);t.disabled=false});return}
    if(t.classList.contains('gs-open')){G.focusHistory=[];G.focusSeen={};gsSetFocus(t.dataset.email);return}
    if(t.classList.contains('gs-close')){gsCloseFocus();return}
    if(t.classList.contains('gs-prev')){gsStep(-1);return}
    if(t.classList.contains('gs-next')){gsStep(1);return}
    const email=t.dataset.email;
    if(t.classList.contains('gs-ai')){gsAiDraft(email,t);return}
    if(t.classList.contains('gs-keep')){const r=gsRow(email);if(!r||!gsHas(r.score))return;gsApply(email,{});gsUpdateRow(email);gsSave(email);return}
    if(t.classList.contains('gs-score')){
      const r=gsRow(email);if(!r)return;
      const score=Number(t.dataset.score),newScore=t.classList.contains('selected')?null:score;
      gsApply(email,{score:newScore,excluded:false});gsUpdateRow(email);gsSave(email);
      // Focused grading: a score is the last step for this student, so go straight on.
      if(G.focusEmail===email&&newScore!==null)setTimeout(()=>gsStep(1),120);
      else if(G.focusEmail)gsFocusLeft();
    }
  });
  document.addEventListener('change',e=>{
    const t=e.target;if(!$('gsList'))return;

    if(t.id==='gsHide'){G.hide=t.checked;gsRenderList();return}
    if(!t.classList)return;
    const email=t.dataset&&t.dataset.email;
    if(t.classList.contains('gs-excl')){gsApply(email,{excluded:t.checked});gsUpdateRow(email);gsSave(email);if(G.focusEmail)gsFocusLeft();return}
    if(t.classList.contains('gs-manual')){
      const raw=String(t.value||'').trim();let score=null;
      if(raw){const n=Number(raw);if(!Number.isFinite(n)||n<0||n>5){alert('Enter a score from 0 to 5.');const r=gsRow(email);t.value=r&&gsHas(r.score)?String(r.score):'';t.focus();return}score=Math.round(n*100)/100}
      gsApply(email,{score:score,excluded:false});gsUpdateRow(email);gsSave(email);if(G.focusEmail)gsFocusLeft();
    }
  });
  document.addEventListener('focusout',e=>{
    const t=e.target;if(!t.classList||!t.classList.contains('gs-comment')||!$('gsList'))return;
    const r=gsRow(t.dataset.email);if(!r||r.comment===t.value)return;

  ['pointerup','pointercancel','dragend'].forEach(ev=>document.addEventListener(ev,()=>{GS_PTR.down=false;gsPtrFlush()},true));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G.focusEmail&&document.querySelector('#gsList .batch-row.focus-mode')){gsCloseFocus()}});
}
// The dashboard tiles and the gradebook open this screen now.

/* ===== 2026.10.14.3 browser Back / Forward ===== */
// Apps Script web apps run inside a Google frame, so the page uses
// google.script.history (Google's supported way to drive the browser's
// Back/Forward buttons). Each main screen records where you are; pressing
// Back re-opens the previous screen. Plain window.history is a fallback.
const NAV={last:'',silentUntil:0,ready:false};
function navHistory(){try{return window.google&&google.script&&google.script.history?google.script.history:null}catch(e){return null}}
function navPush(state){
  if(!NAV.ready)return;
  const key=JSON.stringify(state);
  if(key===NAV.last)return;
  NAV.last=key;
  if(Date.now()<NAV.silentUntil)return;
  try{const h=navHistory();if(h)h.push(state);else history.pushState(state,'')}catch(e){}
}
function navReplace(state){NAV.last=JSON.stringify(state);try{const h=navHistory();if(h)h.replace(state);else history.replaceState(state,'')}catch(e){}}
function navSetView(v){if(S.boot&&S.boot.isTeacher&&S.view!==v){S.view=v;configureShell()}}
async function navApply(state){
  if(!state||!state.v||!S.boot)return;
  NAV.last=JSON.stringify(state);NAV.silentUntil=Date.now()+1500;
  if(typeof gsWaitSaves==='function')await gsWaitSaves();
  S.onModalClose=null;closeModal();
  try{
    switch(state.v){
      case 'dash':navSetView('teacher');await teacherHome(state.c);break;
      case 'classes':navSetView('teacher');teacherClassesPage();break;
      case 'class':navSetView('teacher');await openTeacherClass(state.c);if(state.t==='library')openLibraryPage();else if(state.t&&state.t!=='assignments')teacherTab(state.t);break;
      case 'grade':navSetView('teacher');await gradeScreen(state.a);break;
      case 'admin':navSetView('admin');await adminHome();break;
      case 'preview':navSetView('student');await previewStudentHome(state.c);break;
      case 'previewfb':navSetView('student');await studentFeedbackPage();break;
      case 'student':if(state.c)await openStudentClass(state.c);else await studentHome();break;
      case 'feedback':await studentFeedbackPage();break;
    }
  }catch(e){}
  window.scrollTo(0,0);
}
(function(){
  function after(name,fn){const orig=window[name];if(typeof orig!=='function')return;window[name]=function(){const r=orig.apply(this,arguments);try{fn.apply(this,arguments)}catch(e){}return r}}
  after('teacherHome',function(){if(S.hubClassId)navPush({v:'dash',c:S.hubClassId})});
  after('teacherClassesPage',function(){navPush({v:'classes'})});
  after('teacherTab',function(name){if(S.classId&&name!=='library')navPush({v:'class',c:S.classId,t:name})});
  after('openLibraryPage',function(){if(S.classId)navPush({v:'class',c:S.classId,t:'library'})});
  after('gradeScreen',function(id){if(id)navPush({v:'grade',a:id})});
  after('adminHome',function(){navPush({v:'admin'})});
  after('renderStudentClass',function(){if(S.classData&&S.classData.class)navPush({v:S.preview?'preview':'student',c:S.classData.class.classId})});
  after('studentFeedbackPage',function(){navPush({v:S.preview?'previewfb':'feedback'})});
  // Start recording once the first screen is up, so the first Back leaves the app normally.
  after('home',function(){
    if(NAV.ready)return;
    setTimeout(function(){
      NAV.ready=true;
      const first=S.view==='admin'?{v:'admin'}:(S.boot&&S.boot.isTeacher&&S.view==='teacher')?{v:'dash',c:S.hubClassId||''}:{v:'student',c:S.classId||''};
      navReplace(first);
      try{const h=navHistory();if(h&&h.setChangeHandler)h.setChangeHandler(function(e){navApply(e&&e.state)});else window.addEventListener('popstate',function(e){navApply(e.state)})}catch(e){}
    },600);
  });
})();

// ---- Add students by email ---------------------------------------------------
// Picks every email address out of whatever is pasted: one per line, a column
// from a spreadsheet, or a comma/semicolon separated list. Anything else on a
// line (such as a name) is ignored - students type their own name the first
// time they open the app.
const BS_EMAIL_RE=/[^\s<>(),;:"'\[\]]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;
function bsParse(text){
  const out=[],bad=[],seen={};let dup=0;
  const add=(e,n)=>{e=String(e).toLowerCase().replace(/^mailto:/,'').replace(/\.+$/,'');if(seen[e]){dup++;return}seen[e]=1;out.push({email:e,name:n})};
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();if(!line)return;
    const ems=line.match(BS_EMAIL_RE);
    if(!ems){if(!/^(name|email|e-mail|student|first|last|login)\b/i.test(line))bad.push(line);return}
    ems.forEach(e=>add(e,''));
  });
  return {entries:out,bad:bad,dup:dup};
}
function bsNameFromEmail(e){return String(e).split('@')[0].replace(/[._-]+/g,' ').replace(/\d+/g,' ').trim().replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function bsDisplayName(x){let n=x.name||'';const m=n.match(/^([^,]+),\s*([^,]+)$/);if(m)n=m[2].trim()+' '+m[1].trim();return n||bsNameFromEmail(x.email)}
function bsRosterEmails(classId){
  const d=S.classData;if(!d||!d.class||d.class.classId!==classId||!d.roster)return null;
  const o={};d.roster.forEach(s=>{o[String(s.studentEmail).toLowerCase()]=1});return o;
}

function bsPreview(){
  const ta=$('bsText'),box=$('bsPreview'),btn=$('bsAdd');if(!ta||!box)return;
  const p=bsParse(ta.value),classId=$('bsClass').value,have=bsRosterEmails(classId);
  const already=have?p.entries.filter(x=>have[x.email]):[],fresh=have?p.entries.filter(x=>!have[x.email]):p.entries;
  btn.disabled=!fresh.length;btn.textContent=fresh.length?`Add ${fresh.length} student${fresh.length===1?'':'s'}`:'Add students';
  if(!p.entries.length&&!p.bad.length){box.innerHTML='';return}
  const doms={};p.entries.forEach(x=>{const d=x.email.split('@')[1];doms[d]=(doms[d]||0)+1});
  const domList=Object.keys(doms).sort((a,b)=>doms[b]-doms[a]);
  const odd=domList.length>1?domList.slice(1).filter(d=>doms[d]<=Math.max(1,Math.floor(p.entries.length*0.2))):[];
  box.innerHTML=`<div class="bs-summary"><span class="mini-chip batch-badge-graded">${fresh.length} ready to add</span>${already.length?`<span class="mini-chip">${already.length} already in this class</span>`:''}${p.dup?`<span class="mini-chip">${p.dup} duplicate${p.dup===1?'':'s'} ignored</span>`:''}${domList.map(d=>`<span class="mini-chip ${odd.indexOf(d)>=0?'canvas-chip-warn':''}" title="${odd.indexOf(d)>=0?'Different from most of the list \u2014 check for a typo':'Email domain'}">@${esc(d)} \u00b7 ${doms[d]}</span>`).join('')}</div>
  ${p.bad.length?`<p class="bs-bad"><b>Not an email \u2014 skipped (${p.bad.length}):</b> ${p.bad.slice(0,6).map(esc).join(' \u00b7 ')}${p.bad.length>6?' \u2026':''}</p>`:''}
  ${fresh.length?`<div class="bs-list"><table><tr><th>Email</th><th>Name</th></tr>${fresh.slice(0,200).map(x=>`<tr><td>${esc(x.email)}${odd.indexOf(x.email.split('@')[1])>=0?' <span class="bs-guess bs-warn">check</span>':''}</td><td><span class="bs-guess">student enters it</span></td></tr>`).join('')}</table>${fresh.length>200?`<p class="toolbar-note">\u2026and ${fresh.length-200} more.</p>`:''}</div>`:''}`;
}
