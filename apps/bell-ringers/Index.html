/* ===== 2026.10.14.3 student work is never lost ===== */
// - Saves for one bell ringer go out one at a time, newest text last, so an
//   older save can never land after a newer one.
// - The text being saved is kept in memory (and in this browser), never read
//   from a window that has already closed.
// - Closing the window saves straight away. Submit waits for any save still
//   going, sends the final text, and checks the sheet kept every character
//   before the window closes.
// - If the browser holds a longer version than the server, the student is
//   offered it back when they open the bell ringer.
const SV={q:{},latest:{},timerId:''};
function svKey(id){return 'brDraft_'+((S.boot&&S.boot.user&&S.boot.user.email)||'')+'_'+id}
function svBackup(id,text){try{localStorage[svKey(id)]=JSON.stringify({text:text,at:Date.now()})}catch(e){}}
function svReadBackup(id){try{const v=localStorage[svKey(id)];return v?JSON.parse(v):null}catch(e){return null}}
function svClearBackup(id){try{localStorage.removeItem(svKey(id))}catch(e){}}
function svStatus(t,bad){const el=$('saveStatus');if(el){el.textContent=t;el.classList.toggle('save-bad',!!bad)}}
function svLocal(id,text){
  const a=S.classData&&S.classData.assignments&&S.classData.assignments.find(x=>x.assignmentId===id);
  if(a){a.response=Object.assign({},a.response||{},{text:text})}
}
function svPending(){return !!SV.timerId||Object.keys(SV.q).some(k=>SV.q[k].running)}
function studentTextChanged(id,minWords){
  const t=$('studentText');if(t){SV.latest[id]=t.value;svLocal(id,t.value);svBackup(id,t.value)}
  scheduleSave(id);
  const text=t?t.value:'';const n=wordCount(text),count=$('coachWords'),btn=$('coachBtn');if(count)count.textContent=`${n} words \u00b7 coach unlocks at ${minWords}`;if(btn)btn.disabled=n<minWords;
}
function scheduleSave(id){
  if(S.preview){svStatus('Preview \u2014 not saved');return}
  clearTimeout(S.saveTimer);SV.timerId=id;svStatus('Saving\u2026');
  S.saveTimer=setTimeout(()=>{SV.timerId='';saveDraft(id)},900);
}
function flushStudentSave(){if(SV.timerId){const id=SV.timerId;clearTimeout(S.saveTimer);SV.timerId='';return saveDraft(id)}return null}
function saveDraft(id){
  if(S.preview)return Promise.resolve({ok:true,preview:true});
  if(SV.latest[id]===undefined){const t=$('studentText');if(!t)return Promise.resolve(null);SV.latest[id]=t.value}
  const q=SV.q[id]||(SV.q[id]={running:null,again:false});
  if(q.running){q.again=true;return q.running}
  const run=async()=>{let res=null;do{q.again=false;const text=SV.latest[id];res=await call('saveStudentDraft',[{assignmentId:id,text:text,clientUpdatedAt:Date.now(),process:prOut(id)}])}while(q.again);return res};
  q.running=run().then(r=>{if(!SV.timerId)svStatus('\u2713 Saved');return r}).catch(e=>{svStatus('Not saved yet \u2014 keep this window open, it will try again',true);setTimeout(()=>{if(SV.latest[id]!==undefined)saveDraft(id)},4000);return null}).finally(()=>{q.running=null});
  return q.running;
}
async function submitStudent(id,btn){
  if(S.preview){closeModal();toast('Preview only \u2014 nothing was submitted.');return}
  const t=$('studentText');const text=t?t.value:(SV.latest[id]!==undefined?SV.latest[id]:'');
  SV.latest[id]=text;svBackup(id,text);clearTimeout(S.saveTimer);SV.timerId='';
  if(btn){btn.disabled=true;btn.dataset.label=btn.textContent;btn.textContent='Submitting\u2026'}
  svStatus('Submitting\u2026');
  try{
    const q=SV.q[id];if(q&&q.running){q.again=false;await q.running}   // let any save already on its way finish first
    prStop(false);const r=await call('submitResponse',[{assignmentId:id,text:text,clientUpdatedAt:Date.now(),process:prOut(id)}]);
    if(r&&r.savedLength!==undefined&&Number(r.savedLength)!==text.length)throw new Error('Your writing did not save completely. Please press Submit again \u2014 your text is still here.');
    svLocal(id,text);svClearBackup(id);delete SV.latest[id];
    toast('Submitted.');S.onModalClose=null;closeModal();await openStudentClass(S.classId);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent=btn.dataset.label||'Submit'}
    svStatus('Not submitted yet',true);alert('Not submitted yet: '+(e&&e.message?e.message:e)+'\n\nYour writing is still in the box. Please try Submit again.');
  }
}
// Offer back a longer version this browser kept, if the server has less.
function studentRestoreCheck(a){
  const b=svReadBackup(a.assignmentId),t=$('studentText');if(!b||!t||typeof b.text!=='string')return;
  const server=String((a.response&&a.response.text)||'');
  if(b.text===server||b.text.trim().length<=server.trim().length)return;
  const box=document.createElement('div');box.className='notice restore-box';
  box.innerHTML=`<b>This browser kept a longer version of your writing</b> (${wordCount(b.text)} words, ${esc(new Date(b.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}). The saved one has ${wordCount(server)} words. <div class="row" style="margin-top:8px"><button class="btn small" type="button">Restore my longer version</button><button class="btn secondary small" type="button">Keep what is here</button></div>`;
  const [yes,no]=box.querySelectorAll('button');
  yes.onclick=()=>{t.value=b.text;box.remove();t.dispatchEvent(new Event('input',{bubbles:true}));toast('Restored. It is saving now.')};
  no.onclick=()=>{box.remove();svClearBackup(a.assignmentId)};
  t.closest('.field').insertAdjacentElement('beforebegin',box);
}
(function(){
  // Closing the window saves right away instead of dropping the last words.
  const orig=window.closeModal;
  if(typeof orig==='function')window.closeModal=function(){try{flushStudentSave()}catch(e){}return orig.apply(this,arguments)};
  window.addEventListener('beforeunload',function(e){if(svPending()){try{flushStudentSave()}catch(x){}e.preventDefault();e.returnValue='Your writing is still saving.';return e.returnValue}});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){try{flushStudentSave()}catch(e){}}});
})();
/* ===== 2026.10.19 writing process (same record as the Short Story app) =====
   Per bell ringer: time the writing box is in use, typed / deleted / pasted
   characters, and each paste (its first 60 characters, so the teacher can see
   where it sits in the answer). Students are told on screen. */
const PR={data:{},rt:{id:'',el:null,timer:null,lastTick:0}};
function prBlank(){return {v:1,startedAt:'',activeMs:0,inputEvents:0,typedChars:0,deletedChars:0,pastedChars:0,pasteEvents:[],lastActivityAt:0,sessions:0,preChars:0}}
function prInit(a){
  const id=a.assignmentId;if(PR.data[id])return PR.data[id];
  const p=Object.assign(prBlank(),(a.response&&a.response.process&&typeof a.response.process==='object')?a.response.process:{});
  if(!Array.isArray(p.pasteEvents))p.pasteEvents=[];
  const had=String((a.response&&a.response.text)||'');
  if(had&&!p.inputEvents&&!p.activeMs&&!p.pasteEvents.length&&!p.preChars)p.preChars=had.length;  // written before tracking: time shown as "at least"
  PR.task=PR.task||{};PR.task[id]=(String(a.prompt||'')+' '+String(a.directions||'')).replace(/\s+/g,' ').trim().toLowerCase();
  return PR.data[id]=p;
}
function prOut(id){const p=PR.data[id];if(!p)return undefined;if(PR.rt.id===id)prTick();return JSON.parse(JSON.stringify(p))}
function prStripHtml(a){const p=prInit(a),m=prMetrics(p),w=wordCount((a.response&&a.response.text)||'');
  return `<div class="proc-strip" id="prStrip"><strong>Writing process</strong><span data-m="words">${w} word${w===1?'':'s'}</span><span data-m="time">${m.min} min writing</span><span data-m="paste">${m.pasted.toLocaleString()} pasted</span></div><p class="proc-tell">Your teacher can see your word count, how long you spent writing here, and anything pasted into this box.</p>`}
function prMetrics(p){return {min:Math.round(Number(p.activeMs||0)/6000)/10,pasted:Number(p.pastedChars||0)}}
function prPaint(id){const st=$('prStrip'),p=PR.data[id],t=$('studentText');if(!st||!p)return;const m=prMetrics(p),w=wordCount(t?t.value:'');
  const set=(k,v)=>{const el=st.querySelector(`[data-m="${k}"]`);if(el)el.textContent=v};set('words',w+' word'+(w===1?'':'s'));set('time',m.min+' min writing');set('paste',m.pasted.toLocaleString()+' pasted')}
function prTick(){const r=PR.rt;if(!r.id||!r.el)return;const now=Date.now(),el=now-(r.lastTick||now);r.lastTick=now;
  if(!document.hidden&&document.activeElement===r.el&&el>0&&el<20000){const p=PR.data[r.id];p.activeMs+=el;p.lastActivityAt=now;prPaint(r.id)}}
function prStart(id,el){const r=PR.rt;if(r.timer)clearInterval(r.timer);const p=PR.data[id];if(!p)return;r.id=id;r.el=el;r.lastTick=Date.now();
  if(!p.startedAt)p.startedAt=new Date().toISOString();p.sessions=Number(p.sessions||0)+1;r.timer=setInterval(prTick,5000)}
function prStop(save){const r=PR.rt;if(!r.id)return;const id=r.id,now=Date.now(),el=now-(r.lastTick||now);
  if(!document.hidden&&el>0&&el<20000){PR.data[id].activeMs+=el}
  if(r.timer)clearInterval(r.timer);r.timer=null;r.id='';r.el=null;r.lastTick=0;prPaint(id);
  if(save&&!S.preview&&typeof scheduleSave==='function'&&$('studentText'))scheduleSave(id)}
function prDiff(b,a){b=String(b||'');a=String(a||'');if(b===a)return {ins:0,del:0};let i=0;const n=Math.min(b.length,a.length);while(i<n&&b.charCodeAt(i)===a.charCodeAt(i))i++;
  let bi=b.length-1,ai=a.length-1;while(bi>=i&&ai>=i&&b.charCodeAt(bi)===a.charCodeAt(ai)){bi--;ai--}return {ins:Math.max(0,ai-i+1),del:Math.max(0,bi-i+1)}}
function prClip(e){try{const d=e&&(e.clipboardData||e.dataTransfer);if(d&&d.getData)return d.getData('text/plain')||d.getData('text')||''}catch(x){}return ''}
function prNotePaste(el,e){const clip=prClip(e);el.__prPaste={at:Date.now(),before:String(el.value||''),clip:clip.length,head:clip.replace(/\s+/g,' ').trim().slice(0,60)}}
function prAttach(a){
  const id=a.assignmentId,el=$('studentText');if(!el||el.__prOn)return;el.__prOn=true;el.__prPrev=el.value;
  el.addEventListener('focus',()=>prStart(id,el));
  el.addEventListener('blur',()=>prStop(true));
  el.addEventListener('paste',e=>prNotePaste(el,e));
  el.addEventListener('drop',e=>prNotePaste(el,e));
  el.addEventListener('beforeinput',e=>{if(/paste|drop/i.test(e.inputType||'')){const pp=el.__prPaste;if(!pp||Date.now()-pp.at>1200)prNotePaste(el,e)}});
  el.addEventListener('input',e=>{
    const p=PR.data[id];if(!p)return;const now=Date.now();if(!p.startedAt)p.startedAt=new Date(now).toISOString();p.lastActivityAt=now;p.inputEvents++;
    const prev=typeof el.__prPrev==='string'?el.__prPrev:'',next=String(el.value||''),pp=el.__prPaste&&now-el.__prPaste.at<1800?el.__prPaste:null;
    if(/paste|drop/i.test(e.inputType||'')||pp){
      const d=prDiff(pp?pp.before:prev,next),chars=d.ins||(pp?pp.clip:0),head=pp?pp.head:'';
      const h=head.toLowerCase(),task=(PR.task&&PR.task[id])||'';
      p.pastedChars+=chars;p.deletedChars+=d.del;
      p.pasteEvents.push({at:new Date(now).toISOString(),chars:chars,replacedChars:d.del,head:head,fromSource:h.length>=20&&task.indexOf(h)>=0});
      if(p.pasteEvents.length>100)p.pasteEvents=p.pasteEvents.slice(-100);el.__prPaste=null;
    }else{const d=prDiff(prev,next);p.typedChars+=d.ins;p.deletedChars+=d.del}
    el.__prPrev=next;prPaint(id);
  });
  if(document.activeElement===el)prStart(id,el);
}
(function(){const orig=window.closeModal;if(typeof orig==='function')window.closeModal=function(){try{if(PR.rt.id)prStop(true)}catch(e){}return orig.apply(this,arguments)}})();
/* ===== 2026.10.14.3 the student link inside Canvas assignments ===== */
// Google's guess at the app's address is often the editor's /dev test link
// (students get "unable to open the file") or an old deployment. The teacher
// saves the real /exec link once; every Canvas assignment uses it.
function appLinkProblemText(p){return p==='dev'?'The app only knows its /dev test link, which students cannot open.':p==='notapp'?'The saved app link is not a web-app address.':p==='missing'?'The app does not know its student link yet.':''}
function appLinkSectionHtml(info,classId,where){
  info=info||{};const bad=!!info.problem;
  return `<section class="applink-box ${bad?'is-bad':''}" id="appLinkBox"><div class="class-kicker">Student link in Canvas assignments</div>
  ${bad?`<p class="applink-warn"><b>${esc(appLinkProblemText(info.problem))}</b> Paste the link students use, then Canvas assignments get a working button.</p>`:`<p class="toolbar-note" style="margin:4px 0 8px">Students click this in Canvas: <a href="${esc(info.url)}" target="_blank" rel="noopener" class="applink-url">${esc(info.url)}</a> <span class="mini-chip canvas-chip-good">${info.saved?'\u2713 Saved':'\u2713 Detected'}</span></p>`}
  <details class="applink-edit" ${bad?'open':''}><summary>${bad?'How to find it':'Change the link'}</summary>
  <ol class="applink-steps"><li>Open the app the way students do (not from the script editor\u2019s Test deployment).</li><li>Copy the whole address from the browser\u2019s address bar. It starts with <code>https://script.google.com/</code> and ends with <code>/exec</code>.<br><span class="muted">Or in Apps Script: Deploy \u2192 Manage deployments \u2192 Web app \u2192 URL.</span></li></ol>
  <div class="applink-row"><input id="alUrl" type="url" spellcheck="false" placeholder="https://script.google.com/a/macros/.../exec" value="${esc(info.saved?info.url:'')}"><button class="btn small" type="button" onclick="saveAppLinkNow(this,'${esc(classId||'')}','${where}')">Save link</button></div></details>
  ${where==='setup'&&!bad&&classId?`<div class="applink-row" style="margin-top:8px"><button class="btn secondary small" type="button" onclick="updateCanvasLinksNow(this,'${esc(classId)}')">Fix links in this class\u2019s Canvas assignments</button><span class="toolbar-note">Rewrites the link in every Canvas assignment this class already made. Dates and grades are not touched.</span></div>`:''}
  <div id="alMsg" class="modal-msg" aria-live="polite"></div></section>`;
}
function alMsg(t,bad){const el=$('alMsg');if(el){el.textContent=t;el.classList.toggle('is-bad',!!bad)}}
async function saveAppLinkNow(btn,classId,where){
  const v=($('alUrl')&&$('alUrl').value||'').trim();btn.disabled=true;alMsg('Saving\u2026');
  try{
    const info=await call('saveBrAppLink',[{url:v}]);if(S.canvas)S.canvas.appLink=info;
    toast('Student link saved.');
    if(where==='assign')renderAssignCanvas(classId);
    else{await canvasSetupModal(classId);alMsg('Saved. Press \u201cFix links\u201d to update Canvas assignments made before.')}
  }catch(e){btn.disabled=false;alMsg(nodeMissing(e)?'Paste the new CanvasNode.gs first.':e.message,true)}
}
async function updateCanvasLinksNow(btn,classId){
  btn.disabled=true;alMsg('Updating Canvas assignments\u2026');
  try{const r=await call('updateBrCanvasLinks',[{classId:classId}]);alMsg(`Updated the link in ${r.updated} Canvas assignment${r.updated===1?'':'s'}.`+(r.failed&&r.failed.length?' Could not update: '+r.failed.join('; '):''),!!(r.failed&&r.failed.length))}
  catch(e){alMsg(e.message,true)}finally{btn.disabled=false}
}


window.__BR_MAIN_LOADED=!!window.__BR_PART1;
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{setTimeout(init,0);}
