<!-- ======================================================================
     Literature Circles — Discussion Deck (release 2026-10-19a)
     Rides along with BackendClient (LC_INCLUDE_WITH in Code.gs), so Index.html didn't change.
     One deck per group per week: a title slide, then for every member a "Reading strategies" slide
     (their submitted Step 1) and a "Discussion plan" slide (their Step 2). Their own slides change
     only in Step 1 / Step 2. Anyone in the group can add to any slide ("Group adds"); each addition
     is saved on its own with the writer's name, so nobody overwrites anyone. Not graded.
     - Students: a "Discussion Deck" card on the week page (state.view = 'week_deck').
     - Teacher: ⋯ on the Step 2 or Step 3 tile → "Discussion decks…" (LC_DECK.openTeacher).
     Server: Deck.js.
     ====================================================================== -->

<script>
window.__MB = window.__MB || {};
window.__MB.DiscussionDeck = 'loading';
(function () {
  'use strict';
  var W = window;
  if (typeof W.render !== 'function' || typeof W.viewWeek !== 'function') { W.__MB.DiscussionDeck = 'error: Index.html did not load first'; return; }
  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function txt(v) { return String(v == null ? '' : v).trim(); }
  function lines(v) { return esc(txt(v)).replace(/\n/g, '<br>'); }
  function rpc(name, arg) {
    return new Promise(function (resolve, reject) {
      try { W.google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](arg); } catch (e) { reject(e); }
    });
  }
  function errMsg(e) { return e && e.message ? String(e.message).replace(/^Exception:\s*/, '') : String(e || 'Something went wrong.'); }
  function store(k, v) { try { if (v == null || v === '') W.localStorage.removeItem(k); else W.localStorage.setItem(k, v); } catch (e) {} }
  function stored(k) { try { return W.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function ago(iso) {
    var t = Date.parse(iso || ''); if (!t) return '';
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago';
    try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; }
  }

  // Student HTML (Journal / Hybrid) is rich text: only plain formatting and the strategy highlight
  // colours survive; everything else becomes text. Parsed with DOMParser, so nothing in it runs.
  var SAFE = { P: 1, BR: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1, UL: 1, OL: 1, LI: 1, SPAN: 1, MARK: 1, DIV: 1, BLOCKQUOTE: 1, H3: 1, H4: 1 };
  function safe(html) {
    var doc; try { doc = new DOMParser().parseFromString('<div>' + String(html || '') + '</div>', 'text/html'); } catch (e) { return esc(html); }
    function walk(node) {
      var out = '';
      node.childNodes.forEach(function (n) {
        if (n.nodeType === 3) { out += esc(n.nodeValue); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName;
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE)$/.test(tag)) return;
        var inner = walk(n);
        if (!SAFE[tag]) { out += inner; return; }
        if (tag === 'BR') { out += '<br>'; return; }
        var t = tag.toLowerCase(), cls = String(n.getAttribute('class') || '').split(/\s+/).filter(function (c) { return /^hl-[A-Za-z]+$/.test(c); }).join(' ');
        out += '<' + t + (cls ? ' class="' + cls + '"' : '') + '>' + inner + '</' + t + '>';
      });
      return out;
    }
    return walk(doc.body.firstChild || doc.body);
  }

  var PATHWAY = { strategies: 'Two reading strategies', hybrid: 'Hybrid', journal: 'Journal entry' };
  var PLAN = { focus: 'What the group should think about', evidence: 'Book evidence to point to (pages)', question1: 'Opening question', question2: 'Follow-up question', open: '0:00–1:00 · Open', explore: '1:00–3:00 · Explore', deepen: '3:00–4:00 · Deepen', close: '4:00–5:00 · Close', backup: 'Backup move' };

  var D = W.LC_DECK = { drafts: {}, mode: 'student', data: null, at: 0, slide: 'title', busy: false, err: '', msg: '', editing: '', posting: false, wk: 0, classId: '', groupId: '', groups: null, timer: 0 };

  // ---------- slides
  function slides() {
    var d = D.data, out = [{ key: 'title', title: 'Our group', sub: 'Week ' + d.week }];
    d.members.forEach(function (m) {
      var first = String(m.name || '').split(/\s+/)[0] || m.name;
      out.push({ key: m.email + '|s', member: m, kind: 's', title: (m.me ? 'You' : first) + ' · Strategies', sub: m.step1 && !m.step1.unreadable ? (PATHWAY[m.step1.prepType] || 'Step 1') : 'Not turned in yet' });
      out.push({ key: m.email + '|p', member: m, kind: 'p', title: (m.me ? 'You' : first) + ' · Plan', sub: m.plan ? '5-minute plan' : 'Not saved yet' });
    });
    return out;
  }
  function notesFor(key) { return (D.data.notes || []).filter(function (n) { return n.slide === key; }); }
  function slideIndex(list) { for (var i = 0; i < list.length; i++) if (list[i].key === D.slide) return i; return 0; }

  function titleSlide() {
    var d = D.data;
    return '<div class="lc-deck-title"><div class="lc-deck-kicker">Discussion Deck · Week ' + d.week + '</div><div class="book">' + esc(d.bookTitle || 'Our book') + '</div>' +
      '<p class="reading">' + (d.reading ? 'This week’s reading: <b>' + esc(d.reading) + '</b>' : 'This week’s reading isn’t set yet.') + '</p>' +
      '<div>' + d.members.map(function (m) { return '<span class="lc-deck-badge' + (m.me ? ' is-me' : '') + '">' + esc(m.name) + (m.me ? ' (you)' : '') + '</span>'; }).join('') + '</div>' +
      '<div class="how"><b>How to use this deck.</b> Everyone has two slides: their <b>reading strategies</b> (Step 1) and their <b>5-minute discussion plan</b> (Step 2). Your own slides update when you change Step 1 or Step 2. Under every slide is <b>Group adds</b>: add a quote, a question, a connection or an idea there, so the group’s thinking is all in one place.</div></div>';
  }
  function fieldsHtml(def, v) {
    var out = '';
    if (Array.isArray(v.items)) {
      v.items.forEach(function (it, i) {
        var bits = def.fields.map(function (f) { var t = txt(it && it[f.key]); return t ? '<div class="lc-deck-field">' + (def.fields.length > 1 ? '<b>' + esc(f.label) + '</b>' : '') + lines(t) + '</div>' : ''; }).join('');
        if (bits) out += '<div class="lc-deck-item"><div class="lc-deck-field"><b>' + (def.fixedRows && def.fixedRows[i] ? esc(def.fixedRows[i]) : '#' + (i + 1)) + '</b></div>' + bits + '</div>';
      });
    } else {
      def.fields.forEach(function (f) { var t = txt(v[f.key]); if (t) out += '<div class="lc-deck-field"><b>' + esc(f.label) + '</b>' + lines(t) + '</div>'; });
      if (Array.isArray(v.rows)) v.rows.forEach(function (row) {
        var bits = def.fields.map(function (f) { var t = txt(row && row[f.key]); return t ? '<div class="lc-deck-field"><b>' + esc(f.label) + '</b>' + lines(t) + '</div>' : ''; }).join('');
        if (bits) out += '<div class="lc-deck-item">' + bits + '</div>';
      });
    }
    if (v.imageUrl && /^https:\/\//i.test(String(v.imageUrl))) out += '<div class="lc-deck-field"><b>Image</b><a href="' + esc(v.imageUrl) + '" target="_blank" rel="noopener">Open the picture ↗</a></div>';
    if (txt(v.helped)) out += '<div class="lc-deck-field"><b>How this helped</b>' + lines(v.helped) + '</div>';
    return out;
  }
  function art(k) { var v = W.STRATEGY_VISUALS && W.STRATEGY_VISUALS[k]; return v && v.icon ? String(v.icon) : ''; }
  function strategiesSlide(m) {
    var who = m.me ? 'Your reading strategies' : esc(m.name) + '’s reading strategies';
    var s = m.step1, D2 = W.STRATEGY_DEFS || {};
    var head = '<h3>' + who + '</h3>';
    if (!s) return head + emptyHtml(m, 'Step 1 isn’t turned in yet.', m.me ? 'Turn in Step 1 and it shows up here for your group.' : 'It shows up here as soon as ' + esc(String(m.name).split(/\s+/)[0]) + ' turns it in.', 'strategies');
    if (s.unreadable) return head + emptyHtml(m, 'This Step 1 couldn’t be read.', 'Open Step 1 and turn it in again.', 'strategies');
    var data = s.data || {}, html = '';
    var chosen = (s.choices || []).map(function (k) { return D2[k] ? D2[k].label : k; });
    html += '<p class="sub">' + esc(PATHWAY[s.prepType] || 'Step 1') + (chosen.length && s.prepType !== 'journal' ? ' · ' + esc(chosen.join(' + ')) : '') + '</p>';
    if (s.prepType === 'journal') {
      html += txt(data.journalText) ? '<div class="lc-deck-rich">' + safe(data.journalText) + '</div>' : '<p class="lc-deck-empty">(empty journal)</p>';
    } else if (s.prepType === 'hybrid') {
      html += '<div class="lc-deck-strats">' + (data.hybridMoments || []).map(function (mo, i) {
        var tags = ((data.hybridTags || [])[i] || []).map(function (k) { return '<span class="lc-deck-badge">' + esc(D2[k] ? D2[k].label : k) + '</span>'; }).join('');
        return '<div class="lc-deck-strat" style="grid-template-columns:1fr"><div><h4>Moment ' + (i + 1) + '</h4>' + (tags ? '<div>' + tags + '</div>' : '') + '<div class="lc-deck-rich">' + (txt(mo) ? safe(mo) : '<p>(left blank)</p>') + '</div></div></div>';
      }).join('') + '</div>';
    } else {
      html += '<div class="lc-deck-strats">' + (s.choices || []).map(function (k) {
        var def = D2[k], v = data[k] || {};
        if (!def) return '';
        var inner = fieldsHtml(def, v);
        return '<div class="lc-deck-strat"><div class="art">' + art(k) + '</div><div><h4>' + esc(def.label) + '</h4>' + (inner || '<p class="lc-deck-field">(left blank)</p>') + '</div></div>';
      }).join('') + '</div>';
    }
    return head + html + ownHtml(m, 'strategies');
  }
  function planSlide(m) {
    var who = m.me ? 'Your 5-minute discussion plan' : esc(m.name) + '’s 5-minute discussion plan';
    var p = m.plan, head = '<h3>' + who + '</h3>';
    if (!p) return head + emptyHtml(m, 'No discussion plan saved yet.', m.me ? 'Save your plan in Step 2 and it shows up here.' : 'It shows up here once ' + esc(String(m.name).split(/\s+/)[0]) + ' saves Step 2.', 'plan');
    function box(k, cls) { var v = txt(p[k]); return '<div class="box ' + (cls || '') + '"><b>' + esc(PLAN[k]) + '</b><div>' + (v ? esc(v) : '—') + '</div></div>'; }
    return head + '<p class="sub">Leads the group for at least five minutes.</p><div class="lc-deck-plan">' + box('focus', 'focus wide') + box('evidence', 'wide') + box('question1') + box('question2') +
      '<div class="lc-deck-timeline">' + box('open') + box('explore') + box('deepen') + box('close') + '</div>' + (txt(p.backup) ? box('backup', 'wide') : '') + '</div>' + ownHtml(m, 'plan');
  }
  function emptyHtml(m, title, line, section) {
    return '<div class="lc-deck-empty"><b>' + title + '</b>' + line + (m.me && D.mode === 'student' ? '<div style="margin-top:14px"><button type="button" data-dk="go" data-section="' + section + '">Open ' + (section === 'plan' ? 'Step 2' : 'Step 1') + ' →</button></div>' : '') + '</div>';
  }
  function ownHtml(m, section) {
    if (!m.me || D.mode !== 'student') return '';
    return '<div class="lc-deck-own">This is your slide. To change it, edit ' + (section === 'plan' ? 'Step 2 (your plan)' : 'Step 1 (your submission)') + ' — the deck shows what you saved.<button type="button" class="lc-deck-link" data-dk="go" data-section="' + section + '">Open ' + (section === 'plan' ? 'Step 2' : 'Step 1') + '</button></div>';
  }

  // ---------- group adds
  function draftKey(slide) { return 'lc_deck_draft|' + (D.data && D.data.me) + '|' + (D.data && D.data.week) + '|' + slide; }
  function notesHtml(key) {
    var list = notesFor(key), d = D.data;
    var items = list.map(function (n) {
      var tools = '';
      if (n.mine && D.editing !== n.id) tools = '<button type="button" class="lc-deck-link" data-dk="edit" data-id="' + esc(n.id) + '">Edit</button><button type="button" class="lc-deck-link" data-dk="remove" data-id="' + esc(n.id) + '">Remove</button>';
      if (D.mode === 'teacher') tools = '<button type="button" class="lc-deck-link" data-dk="remove" data-id="' + esc(n.id) + '">Remove</button>';
      var body = D.editing === n.id
        ? '<div class="lc-deck-compose"><textarea id="lcDeckEdit" maxlength="' + (d.noteMax || 600) + '">' + esc(n.text) + '</textarea><div class="row"><span class="left"></span><span><button type="button" data-dk="edit-cancel" class="lc-deck-link">Cancel</button> <button type="button" data-dk="edit-save" data-id="' + esc(n.id) + '"' + (D.posting ? ' disabled' : '') + '>Save</button></span></div></div>'
        : '<div class="txt">' + esc(n.text) + '</div>';
      return '<li class="lc-deck-note' + (n.mine ? ' is-mine' : '') + '"><div class="who"><span><b>' + esc(n.mine ? 'You' : n.name) + '</b> · ' + esc(ago(n.at)) + (n.editedAt ? ' · edited' : '') + '</span><span>' + tools + '</span></div>' + body + '</li>';
    }).join('');
    return items ? '<ul class="lc-deck-notes">' + items + '</ul>' : '<p class="hint" style="margin:0 0 10px">Nothing added here yet.</p>';
  }
  function addsHtml(key) {
    var d = D.data, max = d.noteMax || 600;
    var compose = D.mode === 'student' && d.canAdd
      ? '<div class="lc-deck-compose"><label for="lcDeckNew" style="font-weight:700;font-size:14px">Add to this slide</label><textarea id="lcDeckNew" maxlength="' + max + '" placeholder="A quote (with the page), a question for the group, a connection, something you noticed…">' + esc(D.drafts[key] != null ? D.drafts[key] : stored(draftKey(key))) + '</textarea><div class="row"><span class="left" id="lcDeckCount"></span><button type="button" data-dk="add"' + (D.posting ? ' disabled' : '') + '>' + (D.posting ? 'Adding…' : 'Add') + '</button></div></div>'
      : '';
    return '<section class="lc-deck-adds"><h4>Group adds</h4><p class="hint">' + (D.mode === 'teacher' ? 'What the group added to this slide. You can remove an addition; it stays in the DeckNotes tab, marked removed.' : 'Anyone in your group can add here. Your additions show your name; you can edit or remove your own.') + '</p><div id="lcDeckNotes">' + notesHtml(key) + '</div>' + compose +
      (D.msg ? '<div class="lc-deck-msg' + (D.msgOk ? ' is-ok' : '') + '">' + esc(D.msg) + '</div>' : '') + '</section>';
  }

  // ---------- painting
  function railHtml(list) {
    var html = '', lastMember = '';
    list.forEach(function (s, i) {
      if (s.member && s.member.email !== lastMember) { lastMember = s.member.email; html += '<div class="lc-deck-rail-name">' + esc(s.member.name) + (s.member.me ? ' (you)' : '') + '</div>'; }
      var n = notesFor(s.key).length;
      html += '<button type="button" class="lc-deck-thumb' + (s.key === D.slide ? ' is-on' : '') + '" data-dk="slide" data-key="' + esc(s.key) + '">' + (n ? '<span class="n" title="' + n + ' added">+' + n + '</span>' : '') + (i + 1) + '. ' + esc(s.kind ? (s.kind === 's' ? 'Strategies' : 'Plan') : s.title) + '<small>' + esc(s.sub) + '</small></button>';
    });
    return '<nav class="lc-deck-rail" aria-label="Slides">' + html + '</nav>';
  }
  function slideHtml(s) {
    if (s.key === 'title') return titleSlide();
    return s.kind === 's' ? strategiesSlide(s.member) : planSlide(s.member);
  }
  function headHtml() {
    var d = D.data;
    var back = D.mode === 'student' ? '<a class="backlink" onclick="backToWeekHub()">← Back to Week ' + d.week + '</a>' : '';
    return back + '<div class="lc-deck-head"><div><div class="lc-deck-kicker">Discussion Deck · Week ' + d.week + '</div><h2>' + esc(d.bookTitle || 'Your book') + '</h2><p>' + (d.reading ? esc(d.reading) + ' · ' : '') + d.members.length + ' in the group · not graded</p></div>' +
      '<div class="lc-deck-actions"><button type="button" data-dk="refresh"' + (D.busy ? ' disabled' : '') + '>' + (D.busy ? 'Loading…' : '↻ Refresh') + '</button><button type="button" data-dk="present">▶ Present</button></div></div>';
  }
  function paint() {
    var box = $('lcDeck'); if (!box) return;
    if (!D.data) {
      box.innerHTML = (D.mode === 'student' ? '<a class="backlink" onclick="backToWeekHub()">← Back to Week ' + (Number(W.state && W.state.week) || '') + '</a>' : '') +
        (D.err ? '<div class="lc-deck-msg">' + esc(D.err) + '</div><p><button type="button" data-dk="refresh">Try again</button></p>' : '<div class="lc-deck-wait"><span class="spinner"></span> Building your group’s deck…</div>');
      return;
    }
    var list = slides(), i = slideIndex(list), s = list[i]; D.slide = s.key;
    box.innerHTML = headHtml() + (D.err ? '<div class="lc-deck-msg">' + esc(D.err) + '</div>' : '') +
      '<div class="lc-deck-body">' + railHtml(list) + '<div class="lc-deck-stage" id="lcDeckStage"><div class="lc-deck-slide" id="lcDeckSlide">' + slideHtml(s) + '</div>' +
      '<div class="lc-deck-nav"><button type="button" data-dk="prev"' + (i ? '' : ' disabled') + '>← Back</button><span class="count">' + (i + 1) + ' / ' + list.length + '</span><button type="button" data-dk="next"' + (i < list.length - 1 ? '' : ' disabled') + '>Next →</button></div>' +
      addsHtml(s.key) + '</div></div>';
    if (D.pseudoFs) { var st = $('lcDeckStage'); if (st) st.classList.add('is-pseudo-fs'); }
    count();
  }
  function count() { var ta = $('lcDeckNew'), c = $('lcDeckCount'); if (ta && c) { var n = ta.value.length, max = (D.data && D.data.noteMax) || 600; c.textContent = n ? n + ' / ' + max : ''; } }
  /** A refresh while someone is typing only repaints the additions list (never the text box). */
  function paintSoft() {
    var a = document.activeElement, typing = a && (a.id === 'lcDeckNew' || a.id === 'lcDeckEdit');
    if (!typing && !D.editing) { paint(); return; }
    var list = $('lcDeckNotes'); if (list && !D.editing) list.innerHTML = notesHtml(D.slide);
  }

  // ---------- loading
  function load(quiet) {
    if (D.busy) return Promise.resolve();
    D.busy = true; if (!quiet) { D.err = ''; paint(); }
    var arg = D.mode === 'teacher' ? { classId: D.classId, groupId: D.groupId, week: D.wk } : { email: String(W.state.email || ''), week: D.wk };
    return rpc('getLiteratureDiscussionDeck', arg).then(function (v) {
      D.busy = false; D.data = v; D.at = Date.now(); D.err = '';
      if (quiet) paintSoft(); else paint();
    }, function (e) { D.busy = false; if (!quiet || !D.data) { D.err = errMsg(e); paint(); } });
  }
  function startPolling() {
    stopPolling();
    D.timer = setInterval(function () {
      var on = D.mode === 'teacher' ? !!$('lcDeckOverlay') : (W.state && W.state.view === 'week_deck');
      if (!on) { stopPolling(); return; }
      if (document.hidden || D.posting) return;
      if (Date.now() - D.at > 25000) load(true);
    }, 5000);
  }
  function stopPolling() { if (D.timer) { clearInterval(D.timer); D.timer = 0; } }

  // ---------- actions
  function go(dir) { var list = slides(), i = slideIndex(list) + dir; if (i < 0 || i >= list.length) return; keepDraft(); D.slide = list[i].key; D.msg = ''; D.editing = ''; paint(); }
  function keepDraft() { var ta = $('lcDeckNew'); if (ta && D.data) { D.drafts[D.slide] = ta.value; store(draftKey(D.slide), ta.value); } }
  function add() {
    var ta = $('lcDeckNew'); if (!ta || D.posting) return;
    var text = ta.value.trim(), slide = D.slide;
    if (!text) { D.msg = 'Write something first.'; D.msgOk = false; paintSoft(); return; }
    D.drafts[slide] = ta.value; store(draftKey(slide), ta.value);
    var clientId = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    D.posting = true; D.msg = ''; paint();
    rpc('addLiteratureDeckNote', { email: String(W.state.email || ''), week: D.wk, slide: slide, text: text, clientId: clientId }).then(function (r) {
      D.posting = false; D.data.notes = r.notes || D.data.notes; delete D.drafts[slide]; store(draftKey(slide), ''); D.msg = 'Added.'; D.msgOk = true; paint();
      setTimeout(function () { if (D.msg === 'Added.') { D.msg = ''; paintSoft(); } }, 2500);
    }, function (e) { D.posting = false; D.msg = errMsg(e) + ' (Your text is still in the box.)'; D.msgOk = false; paint(); });
  }
  function saveEdit(id) {
    var ta = $('lcDeckEdit'); if (!ta || D.posting) return;
    var text = ta.value; D.posting = true; D.editText = text;
    rpc('editLiteratureDeckNote', { email: String(W.state.email || ''), week: D.wk, noteId: id, text: text }).then(function (r) {
      D.posting = false; D.editing = ''; D.data.notes = r.notes || D.data.notes; D.msg = ''; paint();
    }, function (e) { D.posting = false; D.msg = errMsg(e); D.msgOk = false; paint(); var t2 = $('lcDeckEdit'); if (t2) t2.value = text; });
  }
  function remove(id) {
    var n = (D.data.notes || []).filter(function (x) { return x.id === id; })[0]; if (!n) return;
    if (!W.confirm(D.mode === 'teacher' ? 'Remove this addition by ' + n.name + '? It stays in the DeckNotes tab, marked removed.' : 'Remove your addition?')) return;
    var arg = D.mode === 'teacher' ? { classId: D.classId, groupId: D.groupId, week: D.wk, noteId: id } : { email: String(W.state.email || ''), week: D.wk, noteId: id };
    rpc('removeLiteratureDeckNote', arg).then(function (r) { D.data.notes = r.notes || D.data.notes; paintSoft(); }, function (e) { D.msg = errMsg(e); D.msgOk = false; paint(); });
  }
  function present() {
    var st = $('lcDeckStage'); if (!st) return;
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (D.pseudoFs) { D.pseudoFs = false; st.classList.remove('is-pseudo-fs'); return; }
    var req = st.requestFullscreen || st.webkitRequestFullscreen;
    // inside the Apps Script frame full screen may be refused: fill the window instead
    if (req) { try { var p = req.call(st); if (p && p.catch) p.catch(function () { D.pseudoFs = true; st.classList.add('is-pseudo-fs'); }); return; } catch (e) {} }
    D.pseudoFs = true; st.classList.add('is-pseudo-fs');
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-dk]') : null;
    if (!el || !el.closest('.lc-deck')) return;
    var k = el.getAttribute('data-dk');
    if (k === 'slide') { keepDraft(); D.slide = el.getAttribute('data-key'); D.msg = ''; D.editing = ''; paint(); var sl = $('lcDeckSlide'); if (sl && window.innerWidth < 900) sl.scrollIntoView({ block: 'start' }); }
    else if (k === 'next') go(1);
    else if (k === 'prev') go(-1);
    else if (k === 'add') add();
    else if (k === 'edit') { keepDraft(); D.editing = el.getAttribute('data-id'); paint(); var t = $('lcDeckEdit'); if (t) t.focus(); }
    else if (k === 'edit-cancel') { D.editing = ''; paint(); }
    else if (k === 'edit-save') saveEdit(el.getAttribute('data-id'));
    else if (k === 'remove') remove(el.getAttribute('data-id'));
    else if (k === 'refresh') { keepDraft(); load(false); }
    else if (k === 'present') present();
    else if (k === 'go') { keepDraft(); if (document.fullscreenElement) try { document.exitFullscreen(); } catch (e) {} W.openWeekSection(el.getAttribute('data-section')); }
    else if (k === 'close') closeTeacher();
  });
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'lcDeckNew') { D.drafts[D.slide] = ev.target.value; store(draftKey(D.slide), ev.target.value); count(); }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'lcDeckGroup') { D.groupId = ev.target.value; D.data = null; D.slide = 'title'; D.drafts = {}; paint(); load(false); }
  });
  document.addEventListener('keydown', function (ev) {
    if (!document.querySelector('.lc-deck') || !D.data) return;
    var t = ev.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
    if (typing) return;
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); go(1); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); go(-1); }
    else if (ev.key === 'Escape' && D.pseudoFs) { D.pseudoFs = false; var st = $('lcDeckStage'); if (st) st.classList.remove('is-pseudo-fs'); }
  });

  // ---------- student: the card on the week page and the deck page
  function isStudent() { return W.platform && W.platform.mode === 'student' && W.state && W.state.group; }
  function cardHtml(wk) {
    var work = (W.state.weeklyWork || {})[wk], s1 = !!(work && work.prepType), plan = typeof W.discussionPlanFor === 'function' ? !!W.discussionPlanFor(wk) : false;
    var status = s1 && plan ? '<span class="badge done">Your slides are in</span>' : '<span class="badge pending">' + (!s1 && !plan ? 'Needs Step 1 + 2' : !s1 ? 'Needs Step 1' : 'Needs Step 2') + '</span>';
    return '<div class="journey-step lc-deck-step" id="lcDeckCard" onclick="lcOpenDeck()"><div class="step-status">' + status + '</div><div class="step-no">▤</div><h3>Discussion Deck</h3><p>Everyone’s strategies and 5-minute plans in one place for your discussion — and room for the whole group to add ideas, quotes and questions.</p><div class="step-action">Open the deck →</div></div>';
  }
  var _viewWeek = W.viewWeek;
  W.viewWeek = function () {
    var html = _viewWeek.apply(this, arguments);
    try {
      if (isStudent()) {
        var wk = Number(W.state.week), card = cardHtml(wk);
        // right after Step 2: before the Reading Quiz card if it is there, else before Step 3
        var at = html.indexOf('<div class="journey-step lc-quiz-step"');
        if (at < 0) at = html.indexOf('<div class="journey-step" onclick="openWeekSection(\'peer\')"');
        if (at > 0) html = html.slice(0, at) + card + html.slice(at);
        else html = html.replace('<div class="journey-step-grid', card + '<div class="journey-step-grid');
        html = html.replace('<div class="journey-step-grid', '<div class="journey-step-grid has-deck');
      }
    } catch (e) {}
    return html;
  };
  W.lcOpenDeck = function () {
    D.mode = 'student'; D.wk = Number(W.state.week); D.slide = 'title'; D.msg = ''; D.err = ''; D.editing = ''; D.drafts = {};
    if (!D.data || D.data.week !== D.wk) D.data = null;
    W.state.view = 'week_deck'; try { W.saveStudentResumeClient(); } catch (e) {} W.render(); load(false); startPolling();
  };
  var _render = W.render;
  W.render = function () {
    var on = W.platform && W.platform.mode === 'student' && W.state && W.state.view === 'week_deck';
    if (!on) { if (D.mode === 'student') keepDraftQuiet(); return _render.apply(this, arguments); }
    try { if (typeof W.lcHistorySyncBeforeRender === 'function') W.lcHistorySyncBeforeRender(); } catch (e) {}
    try { if (typeof W.renderHeader === 'function') W.renderHeader(); } catch (e) {}
    var app = $('app'); if (app) app.innerHTML = '<div class="lc-deck" id="lcDeck"></div>';
    D.mode = 'student';
    if (!D.wk || D.wk !== Number(W.state.week)) { D.wk = Number(W.state.week); D.data = null; D.drafts = {}; }
    D.drafts = D.drafts || {};
    paint(); window.scrollTo(0, 0);
    if (!D.data && !D.busy) load(false);
    if (!D.timer) startPolling();
  };
  function keepDraftQuiet() { try { keepDraft(); } catch (e) {} }

  // ---------- teacher: every group's deck for a week, from the dashboard tile menu
  D.openTeacher = function (classId, week) {
    closeTeacher();
    D.mode = 'teacher'; D.classId = String(classId); D.wk = Number(week); D.data = null; D.groups = null; D.groupId = ''; D.slide = 'title'; D.drafts = {}; D.err = ''; D.msg = '';
    var ov = document.createElement('div'); ov.className = 'lc-deck-overlay'; ov.id = 'lcDeckOverlay';
    ov.innerHTML = '<div class="lc-deck-sheet"><div class="lc-deck"><div class="lc-deck-head"><div><div class="lc-deck-kicker">Teacher view</div><h2>Discussion decks · Week ' + D.wk + '</h2><p>Each group’s strategies and plans, with what the group added. Not graded.</p></div><div class="lc-deck-actions lc-deck-pick" id="lcDeckPick"><span class="lc-deck-wait" style="padding:0"><span class="spinner"></span> Loading groups…</span><button type="button" data-dk="close">Close</button></div></div><div id="lcDeck"></div></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) { if (e.target === ov) closeTeacher(); });
    rpc('listLiteratureDiscussionDecks', { classId: D.classId, week: D.wk }).then(function (r) {
      D.groups = r.groups || [];
      var pick = $('lcDeckPick'); if (!pick) return;
      if (!D.groups.length) { pick.innerHTML = '<button type="button" data-dk="close">Close</button>'; var b = $('lcDeck'); if (b) b.innerHTML = '<p class="lc-deck-empty">No groups in this class yet.</p>'; return; }
      pick.innerHTML = '<label for="lcDeckGroup" style="font-weight:700">Group</label><select id="lcDeckGroup">' + D.groups.map(function (g) {
        return '<option value="' + esc(g.groupId) + '">' + esc(g.bookTitle) + ' — ' + esc(g.members.join(', ')) + ' (Step 1: ' + g.step1 + '/' + g.members.length + ', plans: ' + g.plan + '/' + g.members.length + (g.notes ? ', ' + g.notes + ' added' : '') + ')</option>';
      }).join('') + '</select><button type="button" data-dk="close">Close</button>';
      D.groupId = D.groups[0].groupId; paint(); load(false); startPolling();
    }, function (e) { var b = $('lcDeck'); if (b) b.innerHTML = '<div class="lc-deck-msg">' + esc(errMsg(e)) + '</div>'; var pick = $('lcDeckPick'); if (pick) pick.innerHTML = '<button type="button" data-dk="close">Close</button>'; });
  };
  function closeTeacher() {
    var ov = $('lcDeckOverlay'); if (ov) ov.remove();
    if (D.mode === 'teacher') { stopPolling(); D.data = null; }
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('lcDeckOverlay') && !document.fullscreenElement && !D.pseudoFs) closeTeacher(); });

  W.__MB.DiscussionDeck = 'ok';
})();
</script>
